body:
  text: 醫道之見於載籍者靈樞素問難經而上神農本經為最古諸經所論在審病本經所論在主治道實相為表裏惜其傳授姓氏不可考人遂以為漢人所假託然秦人焚書醫藥之書不毀其為上古所遺無疑後之繼是書而作者陶隱居別録為最善乃宋金元以來著本草書者十數家其言愈多其道愈歧其說愈新其旨愈晦則皆求勝於本經求加於別録而失之龐雜蕪穢者也世醫相沿承用不知其非即號稱名醫者又止講臨證習方書而於本經與別録則以尋常本草書視之不能參互考訂疏其文而證其解故古人用藥之意與藥之所以愈病其說隱晦淹塞以至於今不知一病有一病之方一方有一方之藥一藥有一藥之效不能審藥何以定方不能定方何以治病此閏庵鄒君所以有本經疏證之作也閏庵籍隸武進為鄒道鄉先生後裔敦行誼通儒術而隱於醫性耽著述所撰雜文甚多其為是書也以本經為主以別録為輔而取傷寒論金匱要略千金方外臺祕要與唐本圖經兼取六經五雅諸史說文旁及道經佛書群芳譜名人著作凡有關於論藥者為之疏解辨證或論病之所宜藥或論藥之所宜病與夫當用不當用之故務求其精毋失於粗務求其真毋惑於似反覆校勘一掃本草諸家尨雜蕪穢之言而歸於至當使藥品之美畢彰而本經之旨益著由是而審證用藥審藥定方安有不起之病哉至於唐以後之書或引焉或缺焉或仍焉或駮焉或取之而不盡取焉要以明本經之主治者為準爾湯子卿鹺尹與君莫逆交素工岐黃術篤嗜此書欲謀刊布而以問余余受其書而讀之例則箋疏之例體則辨論之體思則幽邈之思識則卓越之識絶非近世醫書可比爰乃商諸同志捐資集腋以成其事余素不知醫余以信湯君者信鄒君則其書之必傳於後可知也其他所撰述之文必傳於後亦可知也則鄒君之藉以不朽者其在於此歟抑不僅在於此歟古歙洪上庠敘鄒潤安先生傳例言第一卷第二卷第三卷第四卷第五卷第六卷第七卷第八卷第九卷第十卷第十一卷第十二卷序曰豫治傷寒論金匱要略用屬辭比事法於不合處求其義之所在沿郤尋窾往往於古人見解外別有會心然每論用藥則不能稍有異同也友人楊君穆如本經之學素深壬辰秋偶因過訪叩其治本經法楊君甚稱本草述精博本草述者豫蓋曾讀焉而苦其冗蔓者也楊君言劉潛江文筆萎薾用意甚深能熟讀之略其繁蕪則精博自見因講芍藥一味豫為心醉歸而朝夕誦之覺其旨淵然無盡然微嫌其用力於張長沙孫真人猶少也因以己意取本經別録為經傷寒論金匱要略千金方外臺祕要為緯交互參證而粗織之務疏明其所以然之故是年冬疏證藥六味求正楊君楊君深以為善但謂似獨為漢唐時用藥發者實則後世纘論悉有精詣不可廢也豫敬諾焉思夫古今至遠賢哲至衆一簣之加詎謂必無第大經大法既已森然縱繼長增高恐終未能超軼於規矩準繩外也爰將仲景所用藥百七十味先究心焉凡六易寒暑克成是編嗚呼炎軒二帝開物成務於前南陽華原紹志述事於後其旨博大淵微淺學後生詎能洞徹底蘊顧就彼此契合求其所以同後先齟齬求其所以異期於心有所得用有所徵斯已矣敢曰為古聖賢闡發義理哉從子豫春學於豫於是編討論校録之力不少茲欲次第而編輯之爰書其緣起如此道光十七年首夏鄒澍序編輯既定再四校覆書中疵纍不一摘其最大而有悖古人體制者四端謹疏於首一曰攛改古書以成己意也楊君穆如初旨欲邀諸同人將本草述汰蕪存真各為刪本間日出以相示互為印證以期毫無遺撼時和其說者有余君敏求魏君培之豫則謂劉潛江不全體本經別録即及之亦視同海藏東垣而於金元諸家無論是非必欲令成一貫以是左牽右挽馴至辭費若加刪汰定至轉失本真何如即其聯合之法取以聯合本經別録傷寒論金匱要略肘後千金外臺諸君咸謂為然遂以此見推因有是作篇中述潛江語竝芟改所餘職是故耳要之潛江及盧氏父子皆於此中實有所得誠可謂好學深思心知其意者故不敢避攛亂古書之妄云二曰譬喻冗雜不就軌範也梅勿庵治算學凡拈一義必反覆曲折務推明其故一若人終不喻者圓球之外譬以圓燈甚至塹堵陽馬立錐鱉臑無不指實課虛推闡盡致因自謂章繁句復往復諄然必如此始可自信以信於古人豫於此篇無論村夫圃叟婦孺臧獲凡於物理有關無不詢訪厥由苦思力索期於有補展卷自觀罕譬曲喻誠有如勿庵所云者拘滯固陋貽誚通方真不免矣聵者與人言每高其聲惟恐聰者不聞也體其用心亦良苦哉三曰任情馳騁渾忘畛域也論藥論方論病各有界限第方以一味出入而所主迥絶以羅列殊致而治效略同不從異同闡抉於何明藥之底蘊病有絲毫變異頓別陰陽有寒熱互陳須嫻操縱不執兩端究詰於何識處方之化裁以是篇中每緣論藥竟直論方并成論病越畔之思固難免矣但果能有益於明哲亦何嫌引罪於顓蒙所期大雅之裁成不愧芻蕘之獻納是則區區之微忱矣四曰疏密錯出不歸一律也古人著書體制既定自能首尾相稱決不彼此參差從未有密則辨析黍銖疏或大綱未舉相間錯雜如不出一手者此編殆不免焉區區之私嘗謂古人之書苟非經典吾以為師不以為法師者仿其用心法者奉為楷則明哲之士倘能以用心知我篇中原頗有指南特文字考據積習未除一章之中自爾行所當行止所當止及統會全局反致不能規規繩墨耳年齒未盡誓尚補苴若得同心證其不逮尤不能無望也六年夢夢一旦爽然至今日芟夷槎枿抉摘疵纇自以為昭然矣焉知後日視之不仍為夢夢耶爰書起訖之所自如左俾後之悼今不忘今之悼昔也道光壬辰九月始竟其年冬疏證藥九味人參黃芪甘草桔梗桂芎藭芍藥當歸牡丹癸巳緣族中纂修家乘終歲未暇至甲午夏疏證藥十一味麥虋冬乾地黃朮黃連黃芩知母麻黃細辛茈胡獨活防風乙未春疏證藥十五味紫菀薿冬花瞿麥冬葵子王不留行連翹葶藶敗醬牙子澤漆蕘花大黃大𦺩甘遂芫花乙未秋疏證藥十味附子烏頭天雄五味子半夏紫葳射干商陸藜蘆蜀漆乙未孟冬疏證藥十一味葛根栝樓根栝樓實王瓜天虋冬防己通草白斂澤藛海藻石韋丙申仲春疏證藥十四味粳米小麥麴大麥麻子赤小豆薏苡仁大豆黃卷淡豆豉飴糖酒醋蔥薤丙申季秋疏證藥十二味乾薑生薑百合薯蕷橘柚大棗蜀椒椒目梅實桃核仁杏核仁李根白皮丙申仲冬疏證藥十七味瓜蒂瓜子枳實厚朴柏葉實酸棗仁山茱萸吳茱萸訶梨勒桑根白皮檗木乾漆梔子梓白皮秦皮皂莢巴豆丁酉孟春疏證藥二十二味茯苓豬苓竹葉竹筎裩襠石蜜露蜂房鼠婦衣魚蜣螂蜚虻水蛭䗪蟲蠐螬蜘蛛鱉甲文蛤雞屎白雞子黃雞子白龍骨牡蠣丁酉仲春疏證藥二十一味髮髲人尿豬膽豬膏豬膚羊肉馬通阿膠丹沙雲母礬石消石朴消芒消鉛丹伏龍肝水五種丁酉季春疏證藥三十一味滑石禹餘糧紫石英赤白石脂雄黃石膏凝水石菊花𦮷母升麻蛇牀子茵蔯蒿蒲黃女萎苦參紫參白薇代赭石大鹽戎鹽鍛竈下灰新絳艾蒴藋蘇葦莖旋覆花白頭翁白前紅藍花上品石十一味草三味丹沙生深山石崖間穴地數十丈始見其苗乃石也謂之朱沙牀沙生石上大者如雞子小者如石榴子狀若芙蓉頭箭鏃連牀者紫黯若鐵色而光明瑩徹碎之嶄巖作牆壁又似雲母片可析者為上其非生於牀上者多雜土石即淘淨亦不如也節圖經凡藥所以致生氣於病中化病氣為生氣者也凡用藥取其稟賦之偏以救人陰陽之偏勝也是故藥物之性無有不偏者徐洄溪曰藥之用或取其氣或取其味或取其色或取其形或取其質或取其性情或取其所生之時或取其所成之地愚謂丹沙則取其質與氣與色為用者也質之剛是陽內舍汞則陰氣之寒是陰色純赤則陽故其義為陽抱陰陰承陽稟自先天不假作為人之有生已前兩精相摶即有神神依於精乃有氣有氣而後有生有生而後知識具以成其魂鑒別昭以成其魄故凡精神失所養則魂魄遂不安欲養之安之則捨陰陽緊相抱持密相承接之丹沙而誰取矣然謂主身體五臟百病養精神安魂魄益氣明目何也夫固以氣寒非溫煦生生之具故僅能於身體五臟百病中養精神安魂魄益氣明目耳若身體五臟百病其不必養精神安魂魄益氣明目者則不得用丹沙即精神當養魂魄當安氣當益目當明而無身體五臟百病者用丹沙亦無益也血衇不通者水中之火不繼續也煩滿消渴者火中之水失滋澤也中惡腹痛陰陽不相保抱邪得乘間以入毒氣疥瘻諸瘡陽不畜陰而反灼陰惟得藥之陽抱陰陰涵陽者治之斯陽不為陰賊陰不為陽纍諸疾均可已矣是丹沙主治之義也丹沙之品甚尊丹沙之用極博乃仲景僅於寒氣厥逆赤丸中用之但得別録中惡腹痛一端耳舉凡身體五臟百病養精神安魂魄益氣明目諸大用盡遺之何也是固古今醫學分合所係不可不知者也考班氏藝文志方技之別有四一曰醫經二曰經方三曰房中四曰神仙太古之醫有岐伯俞拊中世有扁鵲秦和漢興有倉公咸能盡通其旨逮漢中葉學重師承遂判而為四自是各執一端鮮能相通即天縱仲景於醫幾聖其所深慨亦止在不求經旨斯須處方是明明融洽醫經經方合為一貫故於六淫之進退出入陰陽之盛衰錯互皆辨析黍銖於房中神仙則咸闕焉本經則太古相承師師口授該四而一焉者也故仲景非特於精神魂魄等義不備細研究以示人即所謂輕身益壽不老神仙者豈復一言述及耶僅於五臟風寒積聚篇曰邪入金匱本是哭字據注家改正使魂魄不安者血氣少也血氣少者屬於心心氣虛者其人則畏目合欲眠夢遠行而精神離散魂魄妄行是歸結其旨於氣血但使氣血充盈精神魂魄自然安帖耳仲景焉有不知精神魂魄之理哉其輕身益壽不老神仙等義皆不敢強解遵仲景之志也雲母生雲所出處土石間作片成層可析明滑光白者佳其片有絶大而瑩潔者尤善圖經素問陰陽應象大論謂地氣上為雲天氣下為雨是已何以又謂雲出天氣雨出地氣也夫非天之氣交於地地之氣何以得為雲非地之氣交於天天之氣何以得為雨是故地之氣交於天天氣不應則霜露墜焉天之氣交於地地氣不應此雲母所以生也雖然非天氣不得晶瑩非地氣不得堅韌雲母為物實兼是二者而謂不得地氣可乎夫固曰地氣不應也若不得地氣非但不能堅韌并不得晶瑩請觀自地已上無非天氣充布其得晶瑩者亦賴日月之光而已試當晦夕有能自晶瑩者乎故雲母者天氣既交乎地適遇晴爽雲無由升遂結於下耳究其旨蓋猶得天氣少地氣多何則雖晶瑩而光不能徹其一也煅之不焦不過經時埋之土中則百年不腐又其一也即以其所治論身皮死肌不言其處則決非一指一節間而已乃皆能愈之其所感者微所應者衆非其驗之一端耶天氣輕地氣重故治重著必以得天氣多者此則治中風寒熱如在車船上可見其神情搖曳不定定當以得地氣多者鎮之非其驗之又一端耶五臟別論曰腦髓骨衇膽女子胞此六者地氣之所生也皆藏於陰而象於地故藏而不瀉胃大腸小腸三焦膀胱此五者天氣之所生也故瀉而不藏今者偏益統於腦髓之子精而安藏而不瀉之五臟謂非協於地德能若是乎蓋天地絪縕山川出雲方其會合之時陽氣稍盛則曳而升陰氣稍盛斯凝而聚其聚也必自下而上層層相疊以地質而吸天光謂其不重則堅韌靡加謂其不徹則能通光曜故凡肌肉之氣不與皮毛相浹者其取義為在中之土氣自內而外無不周至若邪氣句擾神識飛騰者其取義為使地氣得吸天氣遂能澄定若陽不歸陰者其義為藉其凝聚引以還原若光明不爽者在外取其可析之而去在內取其充暢而透達即是可證仲景於蜀漆散中同蜀漆龍骨為用者乃取其與龍骨固護神氣以成蜀漆快吐之功使痰涎之壅於中者決去淨盡而火自依於土金自吸於土火者心氣而主神金者天氣而主魂神與魂之不咸即所謂中風寒熱如在舟車上者也礬石初生是石燔煉則煬沸而成小塊以光瑩如水晶者良綱目劉潛江云礬石氣寒味鹹少而酸澀多夫是之謂舉寒水之氣味盡該於酸澀酸者下之陽未能達陰也澀者上之陰未能和陽也下之陰既不得達上之陽遂無以和則礬石者祇能成其潤下之用矣何以復云燥哉夫燥金屬肺為陽中之陰其氣澀而能生腎與礬石之質色氣味無不有合焉夫如是則其本燥金以成水化而專歸於下可知也第人身陰陽欲其交若是者不似使陰離於陽乎夫礬非使陰離於陽乃使陰離陽邪之化風以劫液為痰而轉耗陰者耳蓋人身惟寒水為至陰之氣而至陽出焉陰中至陽升於上以行其化亦端賴陰精隨之以資其宣發如六淫七情一有以傷其陰則陽孤無以行其化淫而為風既以鼓陽為厲復以劫陰化痰於斯時也不消痰則風仍不靖不靖風則陽仍不化惟收陰歸元俾離於陽方得使陰有主不化為痰由痰消而風靖由風靖而陽化真陽真陰得自相依以歸其元也人身至陽本出於陰中而此反全至陰於陽中人身陰陽以相合而神其分之用而此反似由離而效其合之用統參斯義則礬石主治可以得其大都矣以其能歸元陰於初發之地以裕陰化而暢元陽陽暢則陰可達陰裕則陽得和陽和則寒熱自已陰達則泄利白沃自除且陰裕陽和津液充暢陽更何能蝕陰以生惡瘡哉目痛者陰之迫於陽邪也骨齒不堅者陽邪之溷於陰也一使陰離於陽邪而皆可已矣浣豬腸者以礬揉之取其殺涎滑也醃萵苣者以礬拌之取其劫黏汁也攪濁水者礬屑摻之則滓自澄而下墜製采箋者礬汁刷之則水不滲而之他凡一切花瓣漬之以礬則花中苦水盡出花之色香不損凡欲木石相連者熬礬銲之則搖曳不動蓋緣礬之為物得火則煬遇水即化得火則煬故能使火不入水中為患遇水即化故能護水使不受火之患是其質卻雙綰於陰陽其功實側重於治水此其於淖澤則澄而清之於沉濁則劫而去之固善於陰中固氣水中禦火矣寒熱者陽迫陰而陰不為之下也泄利白沃者水不固被火劫而流也陰蝕惡瘡者陰有隙陽得入而蠶食之也目者水之精齒骨者水之幹能使不為火侵則痛者自除搖動者自堅矣即是以推仲景之用礬於礬石湯比之銲木石於礬石丸比之殺涎滑於侯氏黑散比之澄濁淖於消石礬石散比之刷采箋是知神聖用意亦只在人情物理間非必別求奧妙也朴消生斥鹵之地刮掃煎汁經宿結成狀如末鹽再以水煎化澄去腳滓入蘿蔔數枚同煮熟傾入盆中經宿則結成白消如冰如蠟其在上生細芒如鋒者為芒消其生牙如圭角作六稜縱橫玲瓏洞徹可愛者為馬牙消以似白石英亦謂之英消二消之底則通名朴消也其再三以蘿蔔煎煉至去鹹味為甜消置風日中吹去水氣則輕白如粉為風化消同甘草煎過鼎罐升煅則為元明粉消石亦産鹵地秋冬間遍地生白霜掃去煎煉而成亦再三煎煮傾盆中其上亦有芒有牙其底則通為消石惟朴消得水便化消石得火焰發斯為異耳故朴消謂之水消消石謂之火消綱目盧子繇曰朴消消石咸生鹵地假水火二大以為形質但勝劣有異故水火之用迥別楞嚴云火騰水降交發立堅溼為巨海乾為洲灘以是義故彼大海中火光常起彼洲灘中江河常注交妄發生遞相為種用是思維彼水消者火勢劣水故火體似藏而水用獨著彼火消者水劣火勢故水體似藏而火用獨著觀其主治思過半矣劉潛江云朴消消石水火攸分然同源於水同歸於治熱何歟夫水消治熱之結結則多屬血分所謂陰不降陽不化者也能行陰中之陽結則陰降陽自化矣火消乃治熱之鬱鬱者多屬氣分所謂陽不升陰不暢者也能達陽中之陰鬱則陽化陰自暢矣即就其味辨之則亦有大異者水消以鹹勝卻帶微苦本於鹹而就下即以歸火之原也火消以辛勝亦有鹹但大遜於水消苦則稍加本於辛以上際正以達火之用也火消投之火中則焰生水消則否入火生焰者與火同氣也入火不諧者水固勝火也但二物均以消得名則俱能破堅開結緣天地間生人生物未有不本於水火者生之者水火化之又能外水火乎第各就其孰為宜降而行孰為宜升而散審證察衇貴有攸當所謂適事為故可耳即如水消之能以寒化熱以鹹化堅固不徒純陰而已夫孤陰豈能化陽之結耶推之火消亦猶是矣凡藥之為物有理焉有情焉理者物之所鍾情者物之所向而適與病機會者也盧氏劉氏所言物之理耳其情則猶有不止如是者夫火消本經以主五臟積熱胃脹閉水消本經以逐六腑積聚結固留癖是分明指火消入臟水消入腑矣臟藏精而不瀉者也腑傳化物而不藏者也藏而不瀉則所積者皆無形倘啓斂不以時而有盛滿之患遂仍移於六腑故其積者惟熱而能使胃脹閉曰滌去蓄結飲食推陳致新則去胃之脹閉也胃之脹閉去五臟積熱自已矣傳化物而不藏則所積皆有形倘輸導不以時亦有盛滿之患遂致移於軀體故其積者胥飲食痰涎血液皆能固結成癖曰主百病除寒熱邪氣則其移於軀體者也結固留癖下軀體百病亦已矣所以然者火消性向陽故解自陰而陽之盛熱水消性向陰故逐伏在陽中之實結然皆即於物而化物故能所入無間所當必摧此其一也凡病之虛者必自陽入陰實者多自裏出外二消原治實之物妙在一則遇焰輒發一則逢水即化故一能發陽之鬱於陰中一能化陰之結於陽內此又其一也雖然火非滌物者水非逐物者乃本經著兩消去病之功在火消曰滌在水消曰逐何也夫固不必拘滌以水逐以物矣蓋滌者溥詞如大黃之蕩滌腸胃是在腸胃之病無不蕩滌淨盡特彼曰蕩則有動之義今祇曰滌則僅浣濯之而已以明凡病不受泛治者不得用也逐者單詞如乾薑之逐風溼痹山茱萸之逐寒溼痹地黃之逐血痹黃芩苦參之逐水白頭翁之逐血水蛭之逐惡血皆特指一節示不他及則此亦僅能於六腑中去積聚之結固留癖者以明凡病散而未結者不得用也試更參仲景之用二消消石礬石散之治非臟中鬱熱耶大承氣湯調胃承氣湯茈胡加芒消湯之治非腑中結熱耶大陷胸湯丸木防己去石膏加茯苓芒消湯之治非腑中留癖耶是皆其性之所向徵之於理固不悖體之於情尤吻合者也而所謂適與病機會者則更有精密焉如芒消豈能治渴己椒藶黃丸偏加之以治渴芒消安能止利小茈胡湯偏加之以止利是也蓋津液與固癖結遂不得上潮為渴去其固癖正使津液流行積聚結於中水液流於旁為下利去其積聚正所以止其下利耳又豈有他奇也哉赤消想即朴消之赤者據別録能殺人仲景鱉甲煎丸用之且與為君之鱉甲同用至十二分豈以服之最少不厭其毒耶抑欲其入血化堅開結必不可闕耶亦無從臆斷其是否矣滑石潔白如雪膩滑如脂其初出時柔軟似泥久漸堅強成石者以在地中氣熱故也一切布帛凡著油汙即屑滑石其上熾炭尉斗中烙之油汙遂盡布帛竟能無跡此與天虋冬之挼水浣縑素同第天虋冬僅能令縑素柔白此則無論何色均堪復故且一用水一用火故天虋冬裕肺腎精氣此則通六腑九竅津液也六腑者胃為之長非胃中積汙無有內既為泄為澼外仍身熱者藉其外之身熱為尉斗中熾炭使滑石者浥去其汙從下竅而出則利小便蕩胃中積聚寒熱均在此矣女人乳為衝衇之所屆衝衇者隸於陽明乳難癃閉陽明衝衇之病與胃有汙而小便不利者同一理也由是推之滑石之運化上下開通津液除垢存新端借病勢之身熱為藥力之助若身不熱者恐未必能奏績矣本經於藥之去病不肯輕用蕩字惟大黃巴豆滑石則有之蕩蕩也排蕩去垢穢也釋名釋言語動也文選西京賦薛注搖也左僖三年賈注放也漢書丙吉傳注散也後漢書馮衍傳注若於辭氣間分輕重則蕩練巴豆蕩滌大黃自應作排蕩觀若徒云蕩則動搖放散之謂矣況蕩練者能遍五臟六腑蕩滌者猶及腸胃徒蕩則僅去胃中積聚寒熱耳且開通閉塞巴豆推陳致新大黃皆實有物堵於其間今若但曰積聚則尚似有其物者乃積聚之下即緊承曰寒熱是決以有氣無形視之矣去有氣無形者而命之曰蕩謂非動搖放散之義可乎故復足其詞曰益精氣明係滓穢去而清光來斷斷不容與巴豆大黃一往無前者同日而語雖然胃中積聚寒熱何由知其不從大便去而從小便泄也夫曰積聚則非一朝一夕之故矣寒熱已久留若能從大便去則亦因泄澼而病可愈既泄澼而仍身熱尚非當必從小便去耶所以用滑石者為滑石初如泥而旋堅結為以土化金主肅降者於土中行肅降此所謂利小便一也金性凝重其得下流必從火化滑石初出如泥正以地中氣暖今即借積聚寒熱所化之身熱為滑石之暖氣又焉得不氣變柔而下流逮其下流氣已變柔則必不從大便去此所謂主身熱泄澼二也色白為金味甘為土氣寒則降土隨金降非味歸形形歸氣氣歸精而何此所謂益精氣三也乳者色白味甘化於血而性寒恰有合於滑石非氣歸精精歸化而何此所謂主女子乳難癃閉四也然別録曰通六腑九竅津液何也夫通者有無相濟之詞也觀上文本經之所主泄澼者有餘於大腸不足於膀胱乳難者有餘於胃不足於乳皆津液之變而不循其常也使之輸其有餘以濟不足不謂之通而何曰令人利中何也夫壅於大腸涸於膀胱艱於乳滯於胃非中之不利耶通膀胱而小便利乳道利而胃中和則雖不謂之利中不可曰通九竅六腑津液滑石之能也曰令人利中滑石之功也惟其有能乃得建功仲景於陽明病衇浮發熱渴欲飲水豬苓湯中用滑石則誠所謂胃中積聚寒熱身熱口渴小便不利矣其治他病不能若是之備也亦有說以通之歟夫亦惟細意較量其證而可得之矣豬苓湯證在少陰即不云有身熱然曰心煩不得眠則雖不熱於表其裏之熱不可謂不劇況兼下利而渴尚非身熱泄澼耶風引湯治熱癱癇縱無身熱亦不能謂非熱證滑石代赭湯與百合同用夫百合固主邪氣腹脹心痛者亦焉能因病體之如寒無寒如熱無熱而謂既遭攻下必不得有熱哉矧皮水衇浮胕腫按之沒指不惡風其中豈得無熱中有熱而四肢復厥其為熱能不更甚耶其治小便不利觀其或合蒲灰或合亂髮白魚均非溫熱之品則必謂無熱所不能矣大抵仲景之書詞簡意深故有反覆推明病候不出方者則令人循證以識方有但出方不推究病源者則令人由方以求病如枳實薤白桂枝湯之與人參湯竝主胸痹心中痞留氣結在胸胸滿脅下逆搶心則必一虛而一實茯苓杏仁甘草湯與橘枳生薑湯竝主胸痹胸中氣塞短氣則必一熱而一寒今均為小便不利而上文用栝蔞瞿麥丸中有附子則此之蒲灰散滑石白魚散必為栝蔞瞿麥丸之對照無疑矣況防己茯苓湯所治之皮水但四肢聶聶動而蒲灰散所主者則厥核之以厥深熱深之義其為熱又何逃焉百合病變發熱者百合滑石散主之既已明明標發熱矣因其下後僅多代赭一味則遂不熱有是理歟要之滑石非治身熱也以身熱而神其用耳故為煩為渴皆可以當熱滑石非止泄澼也水氣因小溲利自不入大腸耳故咳者嘔者亦得以水氣下趨而遂止明乎此而推廣之蓋其用有不止於是數端者矣禹餘糧外以石為殼形如鵝鴨卵生黃粉如蒲黃無沙者佳其極好者乃如牛黃重重甲錯甚者紫色靡靡如麵嚼之無復嘇隱居流行坎止水之性也然必各當其可斯為至順若流行仍復坎止坎止不廢流行即為至逆人身之水至於不順而逆將胥一身之氣悉引之使逆矣尚得折之以冀其平哉夫人身除氣以外凡若血若津若液以及腦髓精唾涕泗淚溺無非水也設止一件逆而難馴猶非大患苟日引一件漸漸諸件俱逆必至正氣反不足以主持是人尚得食息起居耶治此者惟使生氣竟與病連衡隨於其中挽病氣為生氣其理較之逆折為深其勢較之逆折則順此本經禹餘糧之主治也咳逆寒熱者涕唾痰涎之逆也煩滿下赤白者津液之逆也血閉癥瘕大熱者血之逆也涕唾痰涎之逆既已上出仍復橫溢津液之逆既已下漏仍復中阻血之逆既已內結仍復外發不似水之不廢流行乃猶坎止耶治水之道防土為先滲泄為要而諸證者中阻內結土氣竝未崩潰下赤白外大熱上咳逆滲泄未嘗無路又何從防何從滲而誰知有生於水中得成為土之禹餘糧能深入水中化水氣為土氣者耶夫禹餘糧係水中之石石中有水久則乾成黃粉居於水而不流生於水而不濡味甘恰合土德氣寒能平暴化其得治因血阻結而轉為熱津液阻而更滲漏痰涎逆而復橫出亦何疑哉或曰赤石脂治一源二歧之病今禹餘糧亦復似之則赤石脂禹餘糧湯者以其性相同而疊用之耶曰此蓋不然夫赤石脂綴兩氣之違禹餘糧化一氣之盛其病原心下痞鞕下利不止已飲湯藥繼服瀉心因復攻下更與理中竝非雜藥亂投實亦循規蹈矩而痞鞕如故泄利難除則非因痞而利乃因利而痞前此紛紛治法皆因痞而利之劑故不效也蓋肺主氣而下絡大腸大腸主津而上承肺肺以津而後能降大腸以氣而後能固今大腸之津儘下曳無以上供則肺氣壅於中無以下固其病不在大腸而何在故曰利在下焦也赤石脂者黏肺與大腸之不相顧禹餘糧者鍾土氣於水中水中有土津自上承津得上承氣自下固氣既下固痞鞕自通利有仍不止者則上下之氣已聯特下溜之津或有不受化者必使從小便去而小便不利已久不能以氣機轉而乍通故須復利小便斯徹上徹下無一處隔礙也可曰以功相似而疊用之耶然則小便已陰疼者猶是水之逆耶而得用禹餘糧丸何也夫汗者非他腎之液也腎之液入於心乃為汗汗家而重發汗心氣既非能固腎亦重遭迫劫恍惚心亂者心病小便已陰疼者腎病心腎俱病詎非津液上引遂成熟路尋常就下之道反不順耶不謂水氣逆而誰謂矣然則陰疼不於小便前乃於小便後何也夫陰疼於小便前則為淋證是溺已至膀胱道澀而不得出猶係順中有阻不為逆也惟其津液習於上行偶得下順旋即掣曳而上此所以為痛此所以為逆耳其用禹餘糧於水中生土以鎮之猶是既下而復上之意竝不他歧也故獨用焉且以為丸併其質服之精之至專之至正以表是物之能矣紫石英其色淡紫不勻其質明徹如水晶隨其大小皆五稜兩頭如箭鏃嶺表録異參衍義此所謂以形質與色為治者夫石土之剛金之未成者也五土數也明徹晶瑩水光也石也而無論大小咸具五稜明徹晶瑩兩端皆鋭如箭鏃則其為自中土而上至肺金下抵腎水矣紫赤黑相兼之色水中有火火中有水之象也水火者陰陽之徵兆陰者比於不足陽者比於有餘而明徹晶瑩固無與於粗澀穢濁之處矣能於心腹咳逆邪氣間補不足非入肺而治有餘中不足乎能於女人絶孕十年間除子宮風寒非入腎而治不足中有餘乎但其所以然則當歸其效於溫中其所以溫中則為其味甘氣溫也他石藥皆慓悍明徹晶瑩者必不慓悍故須久服乃有益耳雖然從中宮而上至肺下抵腎其所過豈無藏匿精華之所顧遂不能兼治之與故別録於上則有補心氣不足定驚悸安魂魄之功於下則有填下焦止消渴之功然亦皆水中有火火中有水之證也統而參之則其理有比於是者無不可以意融會而用之矣劉潛江述盧子繇之言謂石中之脂如骨中之髓故揭兩石中取之又必用黏綴脣舌者以證本經之補髓益氣以謂髓者精氣所化氣化所凝從陰中畜陽為化而歸於凝凝而未離於化是以取石中精氣有若凝為脂者以對待渙散之氣不能翕聚而為病是不特取意於脂且取其化脂之氣能為渙散之氣用耳豫謂似此體帖物情固已最為精密然尚有考索未盡者則所謂揭兩石中取之也夫石為藥物或即石取用或生於石中或生於石上或自石而下垂或倚石而旁贅從未有謂揭兩石中取之者既已有之安得不求其故夫云兩石則必同根歧出而相竝云揭其中取之則必分開兩石脂即在其中若然則是脂者即黏合兩石之膠矣故其用宜帖切於氣之同本異趨相違而不相浹以為病者就補髓益氣而言則髓是氣之凝氣是髓之釋假使氣不日凝為髓髓不日釋為氣則將髓自髓氣自氣不相聯而為病也補髓益氣者補髓即所以益氣益氣即所以補髓也就其他主治而言曰黃疸泄利夫黃疸者溼熱內蘊也溼熱內蘊而能泄利宜乎鬱蒸不甚不得成疸矣乃竟成疸則非所蘊之溼熱欲自表出而不達欲由裏下而不遂耶用石脂使之表裏相聯端可從一路而去也曰腸澼膿血夫腸澼是病在氣下膿血是病在血病既兼害其氣血而不能相并則治氣必遺其血治血必遺其氣縱氣血兼治而無物以聯絡之其間終有所格而不相謀何如使之相并亦從一路去之為愈也其餘若陰蝕而下血既有赤者復有白者邪氣在身而癰腫既有疽復有痔頭有疕瘍復有疥瘙無非同本歧趨不能歸一之疾藉此得匯於一處乃能專力以化之矣就仲景用石脂四方而言在赤石脂禹餘糧湯心下痞鞕與下利不止為歧用瀉心用下用理中皆置若罔聞則以二物成湯而使并之設尚不愈其病已合於一但利其小便自能獲效也在桃花湯少陰病與小便不利為歧下利不止與便膿血亦為歧是以非特用赤石脂且半整而半末焉以并其歧中復有歧而使乾薑粳米化之也在風引湯癱癇以引與縱為歧熱以起與落為歧是以非特用赤石脂且復以白石脂焉亦以并其歧中之歧而仍用乾薑桂枝輩去其寒石膏寒水石輩去其熱且以諸石銲其浮越也在烏頭赤石脂丸心痛與背痛為歧則亦并之而復以烏頭與附子氣本相屬者溫其內即使應於外通其外隨使應於中領椒薑以除其沉痼堅牢也然則病之同源而竝出為害者何止是數端也夫亦更究其氣味情性矣石脂悍而燥惟水與痰與溼則能治之凡火也燥也風也皆非所宜矣況其質黏能綴脣舌則凡不任連綴者得之反足以句留病邪矣菊宿根生苗春初即芽莖有稜嫩時柔老則鞕高有至丈餘者葉緑形如木槿尖長而香性喜陰惡水種須高地初秋烈日尤其所畏九月開花其色不一其味亦不一入藥取色黃白味甘者花開最久葉枯不落花萎不零綱目參埤雅菊古作鞠大戴記夏小正榮鞠小戴記月令鞠有黃華釋文鞠本又作菊鞠窮也尚書盤庚中爾惟自鞠自苦傳又毛詩南山曷又鞠止傳菊曷為其義為窮將無以花事之盡耶則不可為木芙蓉薿冬等花言矣得無以其不結實耶則不可為宿根繁生言矣然則窮果安在蓋窮於上者必反下剝固九月之卦菊正以九月花過是即為復矣而婆娑剝盡之在上者縱枯且萎仍無所謂零與落焉則謂能使窮於上之風若火自熄而反其脅從之津液於根柢詎不可歟此本經主風頭眩腫痛目欲脫淚出之義也菊雖宿根重生然至三月已後新根既成舊根遂爛則謂其因新根堅固枯萎自脫不可歟此本經主皮膚死肌之義也菊之苗烈日暴之則萎潦水漬之則萎最喜風為之疏蕩溼為之滋養則謂能使風與溼之相侵者反成相養不可歟此本經主惡風溼痹之義也菊之氣無間莖葉根花菊之津尤能上通下達此久服之所以能利血氣而仲景於侯氏黑散以之為君治大風四肢煩重心中惡寒不足則風之窮於外而不歸與窮於上而不歸者其旨固不殊也即一端而擴充之其用不可量矣人參春生苗多於深山背陰近椵漆樹下溼潤處初生小者三四寸許一丫五葉四五年後生兩丫尚未有花莖至十年後方生三丫年深者生四丫各五葉中心生一莖三月四月開花細小如粟蕊如絲紫白色秋後結子或七八枚如豆生青熟紅自落根如人形者有神圖經凡物之陰者喜高燥而惡卑溼凡物之陽者惡明爽而喜陰翳人參不生原隰汙下而生山谷是其體陰乃偏生於樹下而不喜風日是為陰中之陽在人身五臟之氣以轉輸變化為陽藏而不泄為陰何者肺主出氣腎主納氣心主運量肝主疏泄此臟氣之變化也肺藏魄肝藏魂心藏神腎藏精此臟氣之藏守也唯人參為陰中之陽其力厚其性醇故舉安精神定魂魄而補五臟之徵驗具矣然人自有生已後皆賴後天以培先天精神魂魄稟於先天者也轉輸變化得於後天者也人參雖力厚氣醇終不能越後天直入先天且其色黃味甘氣涼質潤正合中土脾臟之德故首入脾而倉廩崇矣次入肺而治節行矣次入腎而作強遂矣次入肝而謀慮定驚悸除目明矣次入心而神明固心開智益矣愈傳效愈著者則以先得者尚粗彌久而益精也人參之治別録以本經除邪氣一語宣譯之在仲景書則如茯苓四逆湯吳茱萸湯附子湯烏梅丸之主腸胃中冷也黃連湯大建中湯茈胡桂枝湯九痛丸之主心腹鼓痛也厚朴生薑甘草半夏人參湯人參湯之主胸脅逆滿也四逆加人參湯理中丸之主霍亂也乾薑黃連黃芩人參湯竹葉石膏湯大半夏湯橘皮竹茹湯麥虋冬湯乾薑半夏人參丸竹葉湯之主吐逆也半夏生薑二瀉心湯薯蕷丸之主調中也白虎加人參湯小茈胡加人參湯之主消渴也炙甘草湯通衇四逆湯溫經湯之主通血衇也旋覆花代赭石湯鱉甲煎丸之主破堅積也似盡之矣而未也如桂枝新加湯小茈胡湯小茈胡諸加減湯侯氏黑散澤漆湯終不可不謂之除邪氣耳然有邪氣而用人參者其旨甚微故小茈胡湯證若外有微熱則去人參又桂枝湯加人參生薑不曰桂枝湯加人參而曰新加則其故有在矣徐洄溪曰古人曲體病情至精至密知病有分有合合者邪正并居當專於攻散分者邪正相離有虛有實實處宜瀉虛處宜補一方之中兼用無礙且能相濟觀論中發汗後身疼痛衇沉遲及外有微熱二語則執其兩端病情已無可逃矣夫始本不用人參以下後虛甚邪微邪因虛陷而用之是始合而終分也本應用人參因外有微熱而不用是尚合而未分也雖然小茈胡湯證何以知為邪與正分蓋亦以外有微熱知之夫寒時但寒不熱熱時但熱不寒寒熱分明謂之往來寒熱若外有微熱則寒時仍有微熱熱時仍有微寒此所謂表證不罷邪氣尚混合不分邪氣混合不分而可用人參哉此表證用參之微旨所當深察明辨者有表證者不得用人參既知之矣白虎加人參湯證一則曰時時惡風再則曰背微惡寒獨非表證耶然此亦可以分合言也在小茈胡證云渴者去半夏加人參半倍夫表證不渴渴則風寒已化邪正分矣矧往來寒熱但惡熱不惡寒較之發熱惡寒者本自有間焉得不為邪正已分故曰傷寒衇浮發熱無汗其表不解者不可與白虎湯渴欲飲水無表證者白虎加人參湯主之可見白虎加人參湯之治重在渴也時時惡風則非常常惡風矣背微惡寒則非遍身惡寒矣常常惡風遍身惡寒者謂之表證時時惡風背微惡寒者表邪已經化熱特尚未盡耳謂之無表證可也然據此則熱邪充斥津液消亡用栝蔞根生津止渴可也何得必用人參靈樞決氣篇腠理發泄汗出溱溱是謂津津為水陰屬也能外達上通則陽矣夫是之謂陰中之陽人參亦陰中之陽惟其入陰故能補陰惟其為陰中之陽故能入陰使人陰中之氣化為津不化為火是非栝蔞根可為力矣表裏相混難分莫過於桂枝人參湯證裏證寒熱難分莫過於黃連湯證而皆用人參則以中氣不能自立故也夫中氣者脾氣也五味入胃俱賴脾氣為之宣布溫涼寒熱各馴其性酸苦辛鹹各得其歸今者寒自為朋熱自結隊如桂枝人參湯證之外熱內寒黃連湯證之上熱下寒各據一所而不相合若非乾薑甘草之振作中陽即繼人參之沖和煦育何以使之和合耶夫始不相合則終必相離雖有桂枝之驅寒黃連之泄熱不得其樞以應環中仍必寒與熱相攻正與邪俱盡潰敗決裂不死不已矣理中丸下加減法云腹痛者加人參今黃連湯證有腹痛而桂枝人參湯證反無則以再三下後寒氣內陷正如霍亂之寒多而無事別腹之痛與不痛矣別録曰療腸胃中冷心腹鼓痛可見腸胃中不冷雖心腹鼓痛亦非人參所宜也用人參之道非特表邪不分者不可用凡表證已罷內外皆熱虛實難明者尤不可用在傷寒論中三陽合病用白虎湯證及小茈胡湯胸中煩而不嘔兩條可按也夫人參於熱盛而虛者可用實者不可用腹滿身重難以轉側口不仁而面垢則非虛矣故但用白虎不用人參煩者邪聚於上嘔者邪得泄越邪聚於上而得泄越不可謂實邪聚於上不得泄越烏可謂虛故用小茈胡湯必去半夏人參加栝蔞實矣要之凡用人參必究病之自表自裏病自表者避忌之旨如上其不由表者若霍亂之寒多用理中丸腹痛更加之雖頭身疼痛發熱無所顧忌如胸痹之心中痞氣氣結在胸胸滿脅下逆搶心亦絶不懼補益此仲景深明本經除邪之妙奧學者可不深體之乎辛卯夏初豫治兩人病一人脾腎本虛動輒氣逆痰湧而厥是時偶感寒溼微熱惡寒他醫與九味羌活湯遂厥厥蘇後下利厄逆煩躁不得眠豫與茯苓四逆湯三劑後轉為陽明證壯熱煩渴腹滿得大便而解一人腎亦虛得風溼相搏遍身疼痛證醫與搜風補腎痛益劇豫與桂枝附子湯二劑痛已而形候大虛氣才相屬重與理中湯加附子得大汗而解門人問此二病始皆治表非法致變其後既得溫通又何一傳陽明一從太陽解也豫謂此即汗後下後之別從太陽解者其先本未嘗誤特調劑未得當耳故恃溫托之力邪復外越矣其一本感寒溼以生地黃芩梔子更益其寒烏能不下利既已下利則表邪已從之陷表邪既陷焉能復出於表不傳陽明如何得解是本不得用人參但其人過虛不藉人參不能禁附子之辛烈走竄然所以傳陽明者實人參有以致之也不當用之中有當用焉如此者新加湯白虎加人參湯小茈胡湯桂枝人參湯半夏瀉心湯生薑瀉心湯吳茱萸湯乾薑黃芩黃連人參湯理中丸竹葉石膏湯證因有表證而用人參三兩甚者加至四兩半旋覆花代赭石湯黃連湯炙甘草湯附子湯用人參二兩茈胡加龍骨牡蠣湯茈胡桂枝湯一兩半厚朴生薑甘草半夏人參湯茯苓四逆湯四逆加人參湯一兩茈胡加龍骨牡蠣湯及茈胡桂枝湯以小茈胡之半者不論其餘皆虛多於邪用之反少者少用壅滯多用宣通之說豈誠有所本耶是殆不然邪盛則開解藥亦多人參若少則不足以駕馭此所以多也在補劑中止欲其與他物相稱偏重則必有所壅遏謂之宣通可乎藉人參之宣通在傷寒論中莫過於通衇試觀炙甘草湯治衇結代通衇四逆湯治利止衇不出四逆加人參湯治衇微皆不尚多概可知矣雖然白通湯白通加豬膽汁湯不用人參則以下利故下利何以不用人參則以通衇四逆湯白通湯白通加豬膽汁湯證皆陰氣內盛為下利格陽於外為面赤是因陰逆而陽衰較之中陽自衰者有間故利止旋即加參若早用人參正恐其入陰化陰中之陽為津如止小茈胡證之渴者豈不正相反耶乾薑黃連黃芩人參湯半夏瀉心湯嘔者用人參多欲嘔者用人參少是人參之治嘔有專長矣故凡嘔而胸滿者吳茱萸湯證嘔而腸鳴心下痞者半夏瀉心湯證嘔而發熱者小茈胡湯證胃反嘔吐者大半夏湯證皆用人參抑皆不少用至三兩況旋覆代赭湯生薑瀉心湯以乾噫而用橘皮竹茹湯以乾噦而用吳茱萸湯以乾嘔而用何獨甘草瀉心湯證有乾嘔不用人參是許氏內臺方甘草瀉心湯中有人參為不韙矣嘔家不用人參有表邪方實者葛根湯證裏熱正盛而不渴者黃芩加半夏生薑湯證飲在膈上者小半夏湯豬苓湯等證且陽明證及妊娠例不用人參惟嘔則用之吳茱萸湯乾薑半夏人參丸證蓋嘔者脾胃虛弱更觸邪氣也人參色黃氣柔味甘微苦惟甘故補益中宮唯苦故於虛中去邪嘔之必用人參以此服桂枝湯大汗出後大煩渴不解衇洪大者白虎加人參湯主之少陰病身體痛手足寒骨節疼衇沉者附子湯主之則寒邪熱邪之盛皆可用人參矣大病差後喜唾久不了了者胃上有寒當以丸藥溫之宜理中丸傷寒解後虛羸少氣氣逆欲吐者竹葉石膏湯主之則病後陰虛陽虛皆可用人參矣蓋惟其氣沖和而性渾厚能入陰化陽故入寒涼隊中則調中止渴入溫熱隊中則益氣定逆也乃偏執一見者或以謂肺熱還加傷肺則必不可用或以謂養正邪自除則無不可用左右之者入主出奴使人無可適從或者調停其間謂人參能治虛熱不能治虛火仍是模稜之說豈知在上病之動者寒熱皆治之如白虎加人參湯理中丸竹葉石膏湯等證有渴吐及唾皆動也在下病之靜者亦治之如附子湯證之不動是也在上病之靜者不治如諸在表當發汗解肌證及結胸痞氣停飲等候是也如半夏瀉心旋覆花代赭石湯等證以嘔噫而用在下病之動者亦不治如諸下利證是也四逆白通赤石脂禹餘糧桃花白頭翁黃芩真武等湯四逆散證皆不用唯通衇四逆湯下加減云利止衇不出者加人參乃其證也惟既吐且痢者多治之如四逆加人參理中吳茱萸湯等證則以上下不守屬中宮潰敗須急急用參不可以上下動靜一概論也凡論藥之用有求之本處可通他處不可通者有求之傷寒可通雜證不可通者惟人參所謂上動下靜者則無是也火逆上氣咽喉不利止逆下氣麥虋冬湯主之胸痹心中痞氣氣結在胸胸滿脅下逆搶心人參湯亦主之胸中大寒痛嘔不能飲食腹中寒上衝皮起出見有頭足上下痛不可觸近者大建中湯主之非病在上而動者乎諸下利氣氣利下利膿血下利清榖熱利下重下利欲飲水證非病在下而不靜者乎獨九痛丸治九種心疼其病在上不可不謂之靜但所與共者狼牙巴豆皆非常用之品則不得以常情測之矧其方下注云治連年積冷流注心胸痛竝冷衝上氣落馬墜車血疾等則仍不得不謂之動矣蓋其用人參乃使跋扈者將兵而以純厚長者監之之術也烏梅丸侯氏黑散薯蕷丸竹葉石膏湯溫經湯皆有人參但其任退在偏裨似不得與他方竝論然亦有可言者烏梅丸中居君藥三之一侯氏黑散十二之一薯蕷丸四之一竹葉石膏湯亦三之一謂之偏裨可也溫經湯仍居三之二謂之偏裨可乎雖然其入氣藥中則和合而生氣入血藥中則歸陰而化氣入風藥中則隨所至而布氣終不得謂之偏裨也且烏梅丸中用寒藥為君竹葉石膏湯中用寒藥甚多而溫經湯以熱藥為君薯蕷丸之補瀉錯雜侯氏黑散之收散竝行非人參則其力不齊而互相違拗者有之矣天虋冬春生蔓大如叉股高至丈餘葉如茴香極尖細而疏滑有逆刺亦有澀而無刺者則其葉如絲而細散其實一物也夏生細白花亦有黃色紫色者秋結黑子在其根枝旁入伏後則無花暗結子矣根白色或黃紫色圓實如手指長二三寸大者為勝一科一二十枚同撮頗與百部根相類洛中出者大葉粗幹嶺南出者無花餘無他異挼根入湯可以浣縑素白如絨紵參博物志圖經花實者草木功能遂就之秋花為其極盛實則其收藏也然種類既繁稟性自別而體致遂殊故有花而不實者有不花而實者從未有隨時隨地如天虋冬之當其時則花而實過其時則不花而實植於此乃不花而實植於彼又花而實者夫曰入夏開花屆秋結子若至伏時則不花而實又隨地皆花而實獨在嶺南則不花而實夏者陽氣最暢之時入伏則暢已極而將退矣百粵近赤道下陽終歲不藏為海氣所溷故雖值酷暑抵暮亦涼終不如內地之充暢收藏各盡其致則可知是物偏能收功於陽氣最橫絶無忌憚之所即使用不及時陽氣斂退猶能不待冠屨急足先趨不馘其元不已矣枝葉者草木獻伎效能之象枝為行氣之道葉則性所著見也故凡物之性潤者必其枝滑澤而葉柔軟從未有根本枝葉性適相違如天虋冬為極柔潤之物而枝葉不生逆刺則澀而細散者夫刺者根橫於中澀者膚㦸於外乃能任其中外之橫且㦸不閡其生氣之優游充沛而乘陽氣之暢以敷榮以成實焉則又可知是物非芒消大黃之開又非甘遂葶藶之瀉偏能使其滋柔滑澤之氣流行條暢無梗不拔無塞不通而引其純粹清明以積精化氣積氣全生矣暴風溼偏痹熱之著於體三蟲伏尸氣之隱於中既遇此刺不能凝澀不能阻之物涵泳以導化之著者隨之而行隱者隨之而散則百骸順遂津液充盈骨髓又烏能不強也風溼偏痹之上著一暴字以及三蟲曰殺伏尸曰去最是耐人玩索夫風溼之中人也或著於陽或著於陰在陽者命曰風在陰者命曰痹然風與痹未必中而即發也蓋待其人陽氣之怒不肯容邪欲抉而去之斯時所中之邪適亦化熱將欲猖獗遂與正交搏而病作焉邪正交搏之時正病之暴起也其能與正相搏則其勢方盛其熱方熾於時不乘其隙以天虋冬之滑澤通達者導正氣逐邪氣馴至末傳寒中天虋冬遂非所宜用矣謂之暴正以明病之久者不可用也巢元方云三蟲蛔蟲赤蟲蟯蟲也蛔蟲動則吐清水出則心痛貫心則死赤蟲動則腸鳴蟯蟲多則為痔極則為癩因人瘡處以生癰疽癬瘻瘑疥齲無所不為又云人身自有三尸諸蟲與人俱生此蟲忌血能與鬼靈相通常接引外邪為人患害蓋諸蟲之種確與人俱生其得生息繁蕪多由大氣有阻溼停熱聚生類既衆遂與人為梗殺之之術諒非一端其屬熱博氣阻肺腎陰虛者自當以天虋冬殺之謂之殺正以明為病之物有形有生若既死方纍纍出者非所宜矣巢氏又云伏尸之病隱伏在人五臟內積年不除未發之時身體平調都如無患若發動則心腹刺痛脹滿喘急外臺祕要述蘇遊論曰傳尸之疾相剋而生毒氣內傳周遍五臟漸就羸瘦以至於死其初半臥半起號為殗殜氣急咳嗽名曰肺痿骨髓中熱稱為骨蒸或由淋瀝或由勞極隨其所起以相剋而傳各有形證傳盡則死夫病之始候為肺痿為骨蒸若非屬熱又將何屬既肺痿矣骨蒸矣復五臟以剋相傳是亦熱之極涸之極矣且肺痿肺病骨蒸腎病肺腎之熱涸適合天虋冬之治滋其涸則枯澀去清其熱則病氣去謂之去正以明其病句留之久伏而不去確與風溼偏痹之暴者對照矣凡此之或久或暫宜用不宜用正病機之消息所關天虋冬之情性所在蓋外感之候多始傳熱中末傳寒中內傷之候初耗真氣繼耗真精天虋冬之用外感不厭其早內傷不厭其遲然外感惡寒尚在內傷陽氣委頓是又非其所宜觀傷寒論麻黃升麻湯之用天虋冬於金一物天虋冬釀酒及大八風散小八風散之治拘攣歷節可以明治暴病之法觀外臺祕要延年枸杞子煎崔氏落腎散古今録驗通命丸彭祖丸之治虛勞可以明治久病之法矣甚矣天虋冬之挼根入湯可以浣縑素令潔白也夫質本非白浣之未必能白質本潔白又烏容浣蓋惟其質本白或不純而糙或被染而汙方賴浣以復其初人之身白者肺也肌肉也骨髓也腸胃也膀胱也凡為火熱燥溼染而為病咸可屬天虋冬浣之在肺則別録所謂保定肺氣也在肌肉及骨則本經所謂暴風溼偏痹別録所謂養肌膚去寒熱也在腸胃則本經所謂殺三蟲去伏尸也在膀胱則別録所謂利小便也在髓則本經所謂強骨髓也然數者之間出語各有深意曰主曰殺曰去曰利則除病之詞也曰強曰保定曰養則又不可與除病同觀夫強云者能增益而使之強盛保定云者僅能使之不耗養云者能滋育之不能使之有為蓋天虋冬之為物質柔潤性滋膩惟與腎為最宜故於其所主之髓最能效力肺為嬌臟喜清潤而惡溫燥則次之顧能為之除病而已以為補劑宜斟酌之上品草八味甘草春生苗莖葉悉如槐高一二尺葉端微尖而糙澀似有白毛七月開紫花似奈冬結實結角如相思角作一本生至熟時角拆子出扁如小畢豆極堅囓之不破根長者至三四尺粗細不定皮赤色上有橫梁梁下皆細根也參圖經綱目甘草春苗夏葉秋花冬實得四氣之全其色之黃味之甘迥出他黃與甘之上以是協土德和衆氣能無處不到無邪不祛此所謂主五臟六腑寒熱邪氣也土為萬物母凡物無論妍媸美惡莫不生於土及其敗也又莫不歸於土化為生生之氣則所謂能解百藥毒安和七十二種石千二百種草也人之氣猶物之氣和順者其妍美也急疾者其媸惡也盡化急疾為和順經衇自然通調血氣自然滑利於是肌骨堅肌肉長氣力倍矣特甘性緩甘彌甚者緩亦彌甚凡一身之氣因急疾為患者能調之縱弛而阻滯者非所宜也傷寒論金匱要略兩書中凡為方二百五十用甘草者至百二十方非甘草之主病多乃諸方必合甘草始能曲當病情也凡藥之散者外而不內如麻黃桂枝青龍茈胡葛根等湯攻者下而不上如調胃承氣桃仁承氣大黃甘草等湯溫者燥而不濡四逆吳茱萸等湯清者洌而不和白虎竹葉石膏等湯雜者衆而不群諸瀉心湯烏梅丸等毒者暴而無制烏梅湯大黃䗪蟲丸等若無甘草調劑其間遂其往而不返以為行險僥幸之計不異於破釜沉舟可勝而不可不勝詎誠決勝之道耶甘草中黃皮赤入脾而兼入心此瀉火之說所由來也瀉火之說在仲景書有二端一者發汗吐下後虛煩不得眠若劇者必反覆顛倒心中懊憹少氣梔子甘草豉湯主之一者少陰病二三日咽痛者可與甘草湯不差者與桔梗湯夫太陽病懊憹者宜梔子豉湯少氣則加甘草然何以知少氣之不為虛乎其說在東垣書所謂心火急而乘脾者雖不得為實亦不可謂虛譬如飢極則胸中熱且𩞄煩欲動作不得此之謂少氣其用甘草竟可謂之補虛喉嚨少陰直衇所循也少陰病僅二三日即咽痛明其急疾之至謂非少陰之熱循直衇之從腎貫肝膈入肺中循喉嚨挾舌本而上者不可其用甘草即可謂之緩中甘草緩之至而治急疾之病著效甚速故雖實為緩中補虛而謂之瀉火也可即如別録所謂溫中下氣治煩滿短氣也亦無不可或謂甘草解毒恐即是和藥性之一端雖亦有是理然其中別有精妙非和藥性所能盡者如前所謂凡物無論美惡入土即化者此其一也金匱要略云凡諸毒多是假毒以損元知時宜煮甘草薺苨汁飲之通治諸藥毒忠可徐氏謂一線之毒何能殺人乃假些微毒氣滲入元氣反為毒氣作使至不可療所謂星星之火勢極燎原也雖然補元氣之物多矣必取甘草者則以上文云凡煮藥飲汁以解毒雖云救急不可熱飲諸毒病得熱更甚宜冷飲之既欲其甘緩元氣之急又欲其涼不使助毒舍甘草其何從此又其一矣豫嘗治一人暑月煩悶以藥搐鼻不得嚏悶極遂取藥四五錢匕服之煩悶益甚昏不知人不能語言蓋以藥中有生南星生半夏等物也豫謂南星半夏之毒須得薑汁乃解盛暑煩悶烏可更服薑汁勢必以甘草解之但甘草味極甘少用則毒氣不解服至一二錢即不能更多因以甘草一斤蒸露飲之飲盡而病退是知孫真人云甘草解百藥毒如湯沃雪不我欺也金創之為病既傷則患其血出不止既合則患其腫壅為膿今曰金創腫則金創之腫而未膿且非不合者也千金方治金創多係血出不止箭鏃不出故所用多雄黃石灰草灰等物不重甘草惟金匱要略王不留行散王不留行蒴藋細葉桑東南根皆用十分甘草獨用十八分餘皆更少則其取意正與本經吻合矣甘草所以宜於金創者蓋暴病則心火急疾赴之當其未合則迫血妄行及其既合則壅結無所泄於是自腫而膿自膿而潰不異於癰疽其火勢鬱結反有甚於癰疽者故方中雖已有桑皮之續絶合創王不留行之貫通血絡者率他藥以行經衇貫營衛又必君之以甘草之甘緩解毒瀉火和中淺視之則曰急者制之以緩其實泄火之功為不少矣金創血病血病不多用血藥反以氣藥為君則以氣固血之帥血去氣隨則陽隨陰壅陰為陽潰而死矣方下血而用王不留行則血遂不可止已成膿而用川椒乾薑則痛不可忍不後不先正當金創腫時而用是方此仲景深入本經非他人所能及者也甘草之用生用炙確有不同乃兩書百二十方傷寒論用生甘草者不及十之一金匱要略用炙甘草者亦不及十之一甚有同一方在傷寒論則炙用在金匱要略則生用者是知古書傳訛者多矣如本經別録主治大率除邪氣治金創解毒皆宜生用緩中補虛止渴宜炙用消息意會之可矣炙甘草之任莫重於復衇湯其用在通經衇利血氣可無論矣而金匱要略附千金翼方治虛勞不足汗出則悶衇結悸行動如常非所謂煩滿短氣乎又附外臺方治肺痿涎唾多心中溫溫液液者非所謂傷臟咳嗽乎特衇之動而中止不能自還因而復動者有三曰代曰結曰促解之者曰衇數而止謂之促緩而止謂之結止有定時謂之代乃炙甘草湯但治結而不治代促其義何居曰此非甘草不治代促乃非治代促之湯也觀論中桂枝去芍藥湯證衇促胸滿葛根黃連黃芩湯證衇促下痢下後欲解證衇促不結胸皆不忌甘草即可知其旨不在甘草矣其次則甘草乾薑湯芍藥甘草湯一和脾一和肝和脾者安中宮陽氣之怫亂和肝者通木臟陰氣之凝結雖係乾薑芍藥之力然此重彼輕則又可見中央之病中央藥主之乾薑芍藥力雖大然保泰定功不能不歸於甘草也故兩湯之治曰便厥咽中乾煩躁吐逆兩脛拘急是陽明內結也與甘草乾薑湯厥愈足溫重與芍藥甘草湯爾乃脛伸夫陽結為厥陰結為拘乾薑能破陽芍藥能破陰破陰破陽能愈拘愈厥不能愈咽乾止煩躁此保泰定功之所在矣夫中者上下之樞金匱要略云肺痿吐涎沫而不咳者其人不渴必遺尿小便數所以然者上虛不能制下也此為肺中冷甘草乾薑湯以溫之是由中以益上制下也一變而為理中湯治上吐下利是由中以兼制上下矣再變而為桂枝人參湯治外熱內寒表裏不解是由中以兼制內外矣又一變而為四逆湯治下利清穀是由中以制下矣再變而為通衇四逆湯治下利面赤內寒外熱是由中及下兼制內外矣甘草乾薑湯制上中以及下能擴充以至外芍藥甘草湯則制中下以及外能擴充以至內如桂枝湯之治風黃芩湯之治熱芍藥甘草附子湯之治寒莫不連類及者亦可悟甘草居中安土之大凡矣其次則甘草瀉心湯與半夏瀉心湯同因甘草分兩重遂別出方名也柯韻伯曰瀉心湯即小茈胡去茈胡加黃連乾薑湯也小茈胡湯七味五味皆可加減惟茈胡甘草無可加減以安內攘外不容偏廢也其變為瀉心湯多由誤下誤下則內益不安此瀉心湯中甘草可加而不可減所取義矣而瀉心湯三方又有來自三陽之別曰茈胡湯症具以他藥下之心下遂滿而不痛者從少陽來者也曰汗出解後心下痞鞕乾噫下利者從太陽來者也曰醫反下之下利日數十行心下痞鞕而滿乾嘔心煩不得安從陽明來者也從太陽少陽來者用甘草本未嘗輕從陽明來既心下痞鞕矣乃以為病不盡而復下之致痞益甚其為胃虛何疑是知甘草治胃虛之的藥胃愈虛用之愈重成無己曰汗後胃虛是外傷陽氣故於瀉心湯加生薑下後胃虛是內損陰氣故於瀉心湯加甘草是知甘草補胃為補胃中之陰矣治血痹用桂枝黃芪五物湯治黃汗用桂枝加黃芪湯相去僅一味所治之病大有不同斯可悟素問制方之旨仲景得之為最深矣曰血痹陰陽俱微寸口關上微尺中小緊外證身體不仁如風痹狀微者虛之所在緊者病之所在不治其病虛無由復是則治下制方宜急急則去甘草而多其分數此桂枝黃芪五物湯分數較之桂枝加黃芪湯為多也曰黃汗為病兩脛自冷從腰已上汗出下無汗腰髖弛痛如有物在皮中狀劇者不能食身疼重煩躁小便不利在上汗在下痛不治其汗痛無由復以汗非尋常之汗也是則治上制方宜緩緩則加甘草而減其分數也矧血痹之源因尊榮人骨弱肌膚盛疲勞汗出臥不時動搖加被微風皆傷下之候故其治曰宜針引陽氣令衇和緊去則愈則謂其治下不謬黃汗身體腫不惡風小便通利為上焦有寒其口多涎能不謂病在上哉是故兩方之相去雖以甘草然其義實有非甘草所能盡者至真要大論曰急則氣味厚緩則氣味薄適其至所此之謂也王太僕云治上補上方迅急則止不住而迫下治下補下方緩慢則滋道路而力又微制急方而氣味薄則力與緩等制緩方而氣味厚則勢與急同如是為緩不能緩急不能急厚而不厚薄而不薄則大小非制輕重無度虛實寒熱臟腑紛撓無由致治是知分數不可不定也地黃二月生葉布地似莗前葉上有皴紋而不光高者及尺餘低者三四寸其花似油麻花紅紫色亦有黃花者其實作房如連翹中子甚細沙褐色根如人指色黃圖經盧芷園曰地黃本經主治首舉傷中逐血痹即繼填骨髓長肌肉續絶筋夫痹者閉而不通也隨其血之不通而為病如在目則赤在齒則痛在肉裏則癰腫在心則昏煩在肺則咳血壅遏而為身熱枯耗而為燥澀痿軟泛濫而為吐衄崩漏血痹頗廣當各以類推之逐者俾其流通者也性惟潤下功力到時得二便通利以為外候千金方黑膏用治熱積所成之斑肘後方拌雞蒸汁用治寒積所成之疝咸從血痹所生耳血中有痹則骨髓不滿肌肉不長筋衇斷絶均謂傷中若填滿若生長若接續皆克成血液之流通者也劉潛江云地黃之用在本經即首歸其功於血夫血本天一之真陰資中五之土氣以生者也夫萬物莫不資生化於土惟此味之取精於土者最專且酷故種植之地土便焦苦十年後方得轉甜得謂此味不專主中焦之營氣哉乘雅云種地黃一年其土便苦次年止可種䒜𧀬再二年可種山藥足十年土味方轉甜始可復種地黃否則味苦形瘦不堪入藥矣夫既資衝氣以化生獨以涼血歸之者何蓋脾統血其為臟也體柔用升升為陽血屬陰設其所統之陰不繼不足以柔其體而其用之升者自升於是陽益盛陰益虛馴至其脾為約經曰至陽盛則地氣不足此之謂也於斯時也不以得地氣之最精且專者裕其所統又何以柔其體而善其後耶第所謂傷中者義又云何夫中者陰陽之會也無陽則陰何由而升無陰則陽無所從而降升降之樞生氣生血之源也血乃真陰之化醇陽能化則血何自而痹陰能固則血無緣而漏故凡病於陰不濟陽陽氣不能化血者用地黃則為宣劑即本經所謂逐血痹除寒熱積聚是也凡病於陰不勝陽陽迫血而陰不固者用地黃又為攝劑即別録所謂治胞漏下血崩中血不止是也方書治虛勞有云實熱實極者均用地黃既云虛勞矣又何以云實也經曰精氣奪則虛邪氣盛則實因精氣之虛以致邪氣之實因邪氣之實益致精氣之虛故用地黃瀉其實在邪者即救其虛在精者如補勞劣之味乃在其後是不可悟填骨髓長肌肉療跌折絶筋之義耶古人服藥皆有法律故為丸為散為湯當各得其宜而效始著如本經此條宜作兩層讀主傷中逐血痹填骨髓長肌肉療跌折絶筋丸散之功也除寒熱積聚除痹湯飲之功也不然若茺蔚之可作浴湯葡萄之可作酒當歸之煮汁飲何以皆署於簡末而此作湯二字獨間於中耶故仲景兩書用地黃者八方為丸者三為湯者五炙甘草湯之續絶傷防己地黃湯百合地黃湯之除寒熱積聚黃土湯芎歸膠艾湯之除痹薯蕷丸之治傷中長肌肉大黃䗪蟲丸之逐血痹腎氣丸之填骨髓俱若合符節豫嘗治地黃醴先君飲醴盡而地黃枵然如故也暴之令乾則其質輕虛剔而破之則其中脂液已盡在外層者懸空包裹如栝蔞之殼其在內者縱橫牽引如絲瓜之筋因是悟地黃之用在其脂液能榮養筋骸血絡乾者枯者能使之潤澤矣進乎此則因乾枯而斷者得潤澤而仍能續故地黃之用不在能通而在能養蓋經衇筋絡乾則收引潤則弛長是養之即所以續之本經療跌折絶筋仲景治衇結代胥是意也地黃分數獨甲於炙甘草湯而傷寒金匱所主絶無血病蓋是湯所主重在復衇故亦名復衇湯衇者源於腎而主於心心血枯槁則衇道泣澀此傷寒論所以衇結代與心動悸竝稱金匱要略又以衇結悸與汗出而悶竝述至肺痿之心中溫溫液液涎唾多則陰皆將盡之孤注陽僅膏覆之殘焰乃炙甘草湯者非他即桂枝湯去芍藥加地黃麥冬人參阿膠麻仁也行血之功雖大列於行氣通營劑中則猶之地黃之滓增其殼內絡外之脂液耳然地黃之用不僅此也其妙尤在血液被迫不能不去乃不禁其去而惟生且長之使夫受病之故者不留方生之新者不去斯則有病遂為無病此黃土湯芎歸膠艾湯一治脾不統血一治肝不藏血佐使雖殊用地黃之理則一也百合地黃湯大黃䗪蟲丸一不用攻瘀而云下大便當如漆一疊用攻瘀而反不及當下血於此見緩急輕重之間又有意義存乎其中矣均之兩證皆熱在血分也然百合地黃證之熱散漫大黃䗪蟲丸之熱結聚散漫者則欲其去結聚者僅欲其行百合地黃湯生搗地黃取汁一升少煎而急飲之此緩劑急授也大黃䗪蟲丸用地黃止十兩不及全方十分之一丸如小豆酒服五丸日三度則所服些微故能行而不能下此急劑緩授也緩劑急授急劑緩授其意義雖不盡在地黃然百合地黃湯用地黃之多大黃䗪蟲丸全係攻伐獨地黃為補劑則兩方之意義謂盡由地黃可也百合地黃湯防己地黃湯二方均是取汁但一則藥和而地黃淺煮一則藥峻而地黃久蒸生者其鋒迅熟者其力厚故防己地黃湯地黃之用在補百合地黃湯地黃之用在宣此義不可不知也或問腎氣丸之用地黃為補耶為宣耶曰觀仲景以之利小便則行痹著利水道者為宣崇土氣益精血者為補矣譬如薯蕷丸主虛勞諸不足風氣百疾既有桂枝防風大豆黃卷茈胡白蘞等在矣其餘則皆益虛勞諸不足者也朮葉葉相對上有毛方莖莖端生花淡紫碧紅數色根作丫生圖經朮氣溫味甘苦而辛甘能補中苦能降泄辛能升散於人身脾與胃皆具稼穡作甘之德脾主升舉清陽胃主通降濁陰皆屬土而畏溼朮之為物開花於初夏結實於伏時偏於溼氣瀰漫之際顯其有猷有為確可知其入脾胃能內固中氣外禦溼侮矣風寒溼痹死肌痙疽不得盡謂脾病而以朮為主劑者則以溼為脾所主溼能為患固屬脾氣不治一也脾主肌肉介在皮毛筋骨中痹與痙病在肌肉內死肌及疽病在肌肉外旁病則當取中二也筋骨皮毛均非駐溼之所惟肌肉間為可駐溼三也知此則凡痹死肌痙疽之係乎風寒溼者皆朮主之矣仲景治風寒溼痹方多有不用朮者則用朮者當必有故矣痹論風寒溼三氣雜至合而成痹其風氣勝者為行痹寒氣勝者為痛痹溼氣勝者為著痹白朮之效於風勝溼勝者為最宜寒勝者為差減何以知之蓋風勝必煩溼勝必重檢金匱要略中治痹諸方其用朮者非兼煩必兼重如麻黃加朮湯下云身煩疼防己黃芪湯下云身重桂枝附子湯去桂加白朮湯下云身體疼煩甘草附子湯下云骨節煩疼掣痛或身微腫甘乾苓朮湯下云腹重如帶五千錢桂枝芍藥知母湯下云肢節疼痛腳腫如脫附近效方朮附湯下云頭重其他若麻黃杏仁薏苡甘草湯烏頭湯抵當烏頭桂枝湯大烏頭煎等方何嘗不治痛治痹絶不用朮雖然謂朮功擅於風與溼則可謂於寒有所忌則不可傷寒論少陰篇附子湯治身體疼手足寒骨節痛不煩不重亦用白朮蓋溼流關節云骨節痛則未有不兼溼者矧風溼二者必挾寒始成痹不然則否素問之旨可驗也或問理中丸以吐多去朮乃五苓散豬苓散茯苓澤藛湯偏有吐而用朮以下多而還用朮乃桂枝附子去桂枝加白朮湯偏以大便鞕而用朮其義何居夫亦當察其所因也金匱要略嘔吐篇云先嘔卻渴者此為欲解先渴卻嘔者為水停心下此屬飲家今云中風發熱六七日不解而煩有表裏證渴欲飲水水入則吐者名曰水逆五苓散主之曰嘔吐而病在膈上後思水者解急與之思水者豬苓散主之曰胃反吐而渴欲飲水者茯苓澤藛湯主之三證皆有渴皆欲飲水而理中丸條則曰霍亂頭痛發熱身疼痛熱多欲飲水者五苓散主之寒多不欲水者理中丸主之夫熱多欲水而用五苓中仍有朮寒多不欲水而用理中亦不離乎朮惟因吐多而去之可見嘔吐之於朮渴是一大關鍵必持是定其用舍不然同為霍亂證何以五苓散下不曰吐多去朮耶即理中丸下亦云渴欲得水者加朮可驗也雖然用朮治渴為嘔吐者言之耳朮究非治渴之物也如桂枝附子去桂加白朮湯曰傷寒八九日風溼相搏身體疼煩不能自轉側不嘔不渴衇浮虛而澀者桂枝附子湯主之若其人大便鞕小便自利者去桂加白朮湯主之獨提不嘔不渴二者與嘔而渴者恰相對照柯韻伯曰風寒溼三氣雜至合而成痹故身體煩疼不能轉側病只在表者用桂枝附子湯驅風散寒三氣自平營衛自和若其人又兼裏氣不和大便反鞕小便反利此非胃家實乃脾家虛也蓋脾家實腐穢當自去此溼流肌肉因脾土失職不能制水故大便反見燥化不嘔不渴是上焦之化源清故小便自利耳病本在脾法當培土以勝溼故以白朮代桂枝夫脾虛則溼勝而不運溼流於內能使大便不實溼流於表更能使大便不濡脾健則能制水水在內能使下輸膀胱而大便實水在外能使還入胃中而大便濡此理中丸所以下多還用朮而桂枝附子湯以大便鞕小便自利而將朮易桂也白朮治眩非治眩也治痰與水耳有痰與水何以能使人眩蓋眩者神之動神依於心心惡水水盛則心神搖曳為眩譬如人在舟中能發眩也雖然人在舟中未必盡眩不在舟中未必不眩所以眩證不必盡用朮用朮之飲證水證亦未必盡眩夫亦各因乎其人耳飲證水證之兼眩者在傷寒論有心下逆滿氣上衝胸起則頭眩之苓桂朮甘湯證有汗出不解仍發熱心下悸頭眩身瞤動振振欲劈地之真武湯證在金匱要略有胸脅支滿目眩之苓桂朮甘湯證有支飲眩冒之澤藛湯證有瘦人臍下悸吐涎沫而顛眩之五苓散證其有飲有水不眩而用朮者則指不勝屈其有飲眩而不用朮者亦多則係證與朮有忌耳即如卒嘔吐心下痞膈間有水眩悸者小半夏加茯苓湯主之則以心下痞故正與理中丸下注云腹滿者去朮同一理也臍上築者腎氣動也去朮加桂夫腎氣動亦不過作賁豚氣從少腹上衝心耳賁豚水氣也土能制水白朮補土健脾何不可使為中流之柱橫截於中令水氣不上衝心耶是蓋不然夫土能防水止能防其下泄不能防其上湧下泄者水之性上湧者非水之性必有激之使然者除其激之之源水自歸壑矣古之人有治隄者隨築隨潰皆緣水從下上湧則鎔鐵汁灌之隄乃得成以桂易朮正此意耳苓桂朮甘湯證有心下逆滿氣上衝心衇沉緊身振振搖病未嘗不涉腎而不忌朮僅因發汗後臍下悸用苓桂棗甘湯旋即以棗易朮可見朮之於腎確有所忌矧霍亂為病既吐且利正係水土反乘若更以所忌者橫梗於中令病與藥相拒相爭不至潰敗決裂不止矣要之桂能降朮亦能降特桂之降能使在下之水氣化朮止能使在中之水氣化故五苓散之水上下兼阻則不得不桂朮竝行如服桂枝湯或下之桂枝證仍在無汗心下滿微痛小便不利者用桂枝湯去桂加茯苓白朮可見在上之水氣不化而用桂枝則反嫌其性兼旁行不能速下用白朮茯苓則徑情直行抉去其病而後已明乎以朮易桂則以桂易朮者可瞭然矣白朮之止汗除熱非如桂枝湯之治中風能止汗除熱也亦多係風溼相搏之證發熱汗出體痛身重者得白朮而悉蠲耳夫中風證有汗出發熱無身體重痛傷寒證有發熱身體重痛而不汗出三者相兼惟風溼有之故傷寒汗出而渴者用五苓散風溼風水身重汗出惡風者用防己黃芪湯風溼相搏骨節煩疼汗出短氣者用甘草附子湯方中皆有朮是白朮止汗除熱之明驗也然仍有汗出而渴身痛發熱為溼溫之候者又不得用朮是必驗其惡風惡寒與否若不惡寒反惡熱者則朮在所忌矣於白朮主治觀之尤可證溼與水與飲一源三歧之非妄矣以仲景書而言防己黃芪湯桂枝附子去桂加白朮湯麻黃加朮湯甘草附子湯腎著湯桂枝芍藥知母湯治溼之劑也五苓散真武湯豬苓湯茯苓澤藛湯茯苓戎鹽湯越婢加朮湯治水之劑也桂枝去桂加茯苓白朮湯苓桂朮甘湯外臺茯苓飲澤藛湯治飲之劑也以本經別録言風寒溼痹死肌痙疽止汗除熱是治溼證逐皮間風水結腫是治水證消痰水除心下急滿是治飲證先聖後聖遙相印合如此五苓散理中丸皆有白朮則白朮執霍亂之兩端為必用之物矣而去朮還用朮更加朮紛紛無定統而觀之其用朮加朮之意總在使脾氣散精上歸於肺通調水道下輸膀胱而已吐多者胃病胃既作吐則不能游溢精氣上輸於脾脾無所受精於何輸肺下多者脾病脾既下陷不能循其上朝之職若非有以扶之則樞機於何轉於此見朮能舉脾之陷不能定胃之逆也渴者胃之虛渴必多飲飲多則縱使吐逆亦能波及於脾脾有所受而不能舉則下必更甚腹滿者脾實脾實不能上輸即下泄而不減其滿勢必由下逆上自腹及胸吐更加甚於此見朮能治脾胃虛不能治脾胃實也為上為下為實為虛情勢不同而既吐且利則一既吐且利渴欲飲水斯朮為必需故霍亂篇治法凡六為方亦六除吐利已止用桂枝湯和表者不論外惟理中五苓二方有渴欲得水之文其餘不衇微則厥冷均是沉寒痼冷之候其所用四逆四逆加人參通衇四逆加豬膽汁多不用朮可見既吐且利有屬太陰者有屬少陰者屬太陰者朮在可用可不用之列在少陰則無用朮之理故於衇微厥冷二者最宜著眼不可以別録霍亂吐下不止一語而無所分晰也劉潛江曰朮以除溼益氣為功然則凡溼皆可用朮乎曰否夫溼當分寒熱屬於寒者是陽鬱陰中而不升屬於熱者是陰困陽中而不降陽鬱於陰是氣之虛陰困於陽是氣之實氣虛即陽虛氣實即陽盛是虛實皆屬氣而氣之虛實皆化溼也夫溼者地氣也陽鬱於陰是地氣因天氣之鬱而不化陰困於陽是地氣受天氣之并而不化皆能為溼為溼者皆陰陰所以化溼者皆本於陽不能化故一虛一實投治迥殊虛者補正以益氣白朮茯苓是也實者除邪以益氣連柏梔黃是也夫氣者水穀所生液者氣所化當生而生當化而化何溼之有如氣虛而不能化補其陽而液自化氣實而不能化必先除其所傷之邪故抑陽則陰化陰化則液行液行則溼除溼除則氣已受益矣是氣與溼不能相離而除溼益氣亦不能相離特益氣除邪貴於適事為故耳是言也與別録益津液暖胃消穀嗜食之旨適相吻合靈樞決氣篇中焦受氣變化取赤是為血朮為中焦之藥切之有膏液而色赤是朮雖氣分補中除溼之劑又確有功於血分且治溼治血初無二理蓋朮能益津液者血勝正同溼勝而脾不能舉其職則氣之清濁何由別氣之清濁無所別則津於何上騰血於何受氣世之人動輒稱白朮黃芩安胎聖藥而疏其義者不過謂白朮健脾黃芩泄熱殊不知健脾泄熱之物豈特白朮黃芩夫婦人之病多半涉血矧妊娠尤賴血氣之調方得母子均安初妊之時胎元未旺吸血不多則下焦血旺致氣反上逆是為惡阻惡阻則中焦之氣不變赤而為水是白朮在所必需矣血盛能致氣盛氣盛能生火黃芩泄氣分之火而不傷血者也厥後胎氣日充吸血漸多血自盤旋而下氣亦隨之盤旋於下胎之所吸乃血之精者而其餘與氣相搏能仍化為水阻於腰臍之間故妊娠至五六月時多有子腫之證是白朮又為必需之劑而無所事黃芩於其間別録所謂利腰臍間血者此也考仲景書桂枝去桂加茯苓白朮湯真武湯附子湯桂枝芍藥知母湯薯蕷丸皆與芍藥同用皆治胸腹間有水氣則於婦人妊娠篇之白朮散與芎藭同用當歸芍藥散當歸散與芍藥當歸芎藭同用者不可知其為除水氣而利腰臍間血哉又仲景每出治法必先指其所治何病其病因何而致尚恐後人誤用又必反覆申明所以然之故惟此數方則概之曰妊娠宜常服曰妊娠養胎曰婦人腹中諸疾痛僅於當歸芍藥散標之曰婦人懷妊腹中㽲痛則凡白朮散當歸散皆有病可服無病亦可服總之血分之源不清則血氣不能和而附血之溼血盛之火皆為胎前所有之常患故出此不必甚為別擇之常方學者尤當會意而用之也萎蕤莖幹強直似箭簳而有節葉狹而長表白裏青三月開青花結圓實其根橫行如荻根及菖蒲節概平直而有鬚冗密宛如冠纓下垂之綏最多脂液至難燥即燥亦柔移根種之極易繁茂參圖經綱目本草述凡有節有液之物皆能通故竹瀝通風火阻經菖蒲通風痰阻竅萎蕤則通風熱阻絡者也原夫氣人身之陽也津唾血液人身之陰也若病邪以漸而來彼此徐徐相引或化為寒或化為熱久則自相朋比倘受邪既驟感化甚速則陽之從之也易陰之即之也難且陰原係泄澤骨節之物勢常依巖附險乃適遭中風暴熱陽已與之俱化陰猶倚勢為梗則陰之阻正足以助熱之熾陽之留正足以戕陰之結兩不相通而均不相下近骱之短絡遂痹機械因之廢弛矣又何自能動搖耶妙在萎蕤氣味甘平節節有鬚冗密滑澤不徒使絡中之液能柔熱之暴且可使肌肉間熱能化液之結骨節既通陽施陰化血衇膚腠自爾和暢濈然其汗出於是乎治跌筋結肉者巢氏云人手足邊忽生如豆或如結筋五十相連肌理粗強於肉謂之疣目係風邪搏於肌肉而生此非精與氣相遇遂互結不解而何曰不足明非津與氣之有餘治以萎蕤實與才所云云不殊矣他如津滯而面生皯皰津枯而面不潤澤又何異於是哉茈胡二月生苗甚香莖青紫堅硬微有細線葉似竹葉而細緊七月開黃花根淡赤色圖經劉潛江云經曰五臟者藏精氣而不瀉六腑者傳化物而不藏又曰腦髓骨衇膽女子胞此六者地氣之所生也皆藏於陰而象於地故藏而不瀉是膽雖為腑實不與胃大小腸三焦膀胱同為天氣之所生傳化物而不藏矣居陽之位稟陰之體是以為陽之少倡率五腑根陰達陽然五腑達陽其用在瀉膽達陽其用在不瀉恰象春生之氣首暢萬化奮決而出出乎陽未離乎陰是以為半表半裏也茈胡於仲冬根生白蒻於仲春生苗於仲夏極茂於仲秋成實隨陽氣始生而萌至陰氣既平而萎其香徹霄其質柔軟全有合乎少陽之義此所以為半表半裏和解之劑能助膽行上升生發之氣為十一臟所取決矣然則茈胡既以升陽為用將無與於比陰之病歟曰陰陽分於動靜靜中有動動中有靜茈胡於仲冬根生白蒻是靜中有動也識此義則所云能達陰中之陽者何止舉陽之透陰而出哉即舉陰之包陽而藏者悉皆托出矣必陽上徹而陰未能須臾與離用此升舉乃為無弊蓋茈胡非徒暢陽實能舉陰非徒能暢鬱陽以化滯陰竝能俾陽唱陰隨是以心腹腸胃之間無結不解無陳不新譬之春氣一轉萬化改觀自有不期然而然者矣夫然則六氣因鬱而升降之機阻者將可竝用茈胡以轉其樞乎夫肝膽陽升陰即隨之者以脾腎之陰原至於肺也肺為陽中少陰三陰之氣至於陽中之陰自降陽亦隨之降矣蓋下之陰裕必藉陽之先導以為上際上之陽裕亦必資陰之先導以為下蟠故三陰之經衇上行三陽之經衇下行固有為之先導者而得通也其或升降不前如有窒之者宜細參其陰陽之虛實以為主治矣當導陽而下者必陽實陰虛者也當導陰而上者必陰實陽虛者也如下之陰不足以納陽上之陽不足以化陰則升降之原已戾可期其升降相因推移氣化乎即是思之則茈胡為用必陰氣不紓致陽氣不達者乃為恰對若陰氣已虛者陽方無依而欲越更用升陽是速其斃耳可乎故凡元氣下脫虛火上炎及陰虛發熱不因血凝氣阻為寒熱者近此正如砒鴆矣仲景著小茈胡湯之效曰上焦得通津液得下胃氣因和身濈然而汗出解以是知茈胡證皆由於上焦不通上焦不通則氣阻氣阻則飲停飲停則生火火炎則嘔吐半夏生薑能止吐蠲飲然不能徹熱黃芩能徹熱然不能通上焦能通上焦者其惟茈胡乎故往來寒熱為小茈胡主證而往來寒熱悉本於上焦不通蓋惟痰凝氣滯升降之機始阻當升不升則陽怫怒為熱當降不降則陰鴟張為寒治其阻者固不可無而伐樹尋根終必求其致阻之因以拔其本則謂非茈胡之力不可也雖然茈胡證仍有不往來寒熱者何居柯韻伯曰茈胡為樞機之劑凡風寒不全在表未全入裏者皆可用夫傷寒則嘔逆中風則乾嘔凡傷寒中風無麻黃桂枝證但見喜嘔一證則雖發熱者便可用茈胡湯不必具往來寒熱也發熱而嘔則人參當去桂枝亦非所宜矣其目赤耳聾胸滿而煩者去參夏加栝蔞實衇弦細頭痛發熱者去人參加桂故曰證不必悉具方亦遂無定品也愚按嘔固是上焦不通特仍有不往來寒熱不嘔用茈胡湯者亦終有上焦不通形象為據如心下滿脅下滿胸脅滿脅下鞕滿心下支結胸脅滿微結心下急鬱鬱微煩是也乃仍有非上焦不通而用茈胡如陽衇澀陰衇弦腹中急痛之用小茈胡少陰病四逆或咳或悸或小便不利或腹中痛或泄利下重之用四逆散則又當揣其義者夫茈胡之通上焦似乎主降不知其所以降實係升之之力蓋肺不得肝膽之陽上暢則無以使陰下歸復其升降之常陽衇澀陰衇弦腹中急痛是陽鬱陰中陰為陽纍既用小建中湯調其肝不愈勢必舉其陽陰則隨之以轉此小茈胡在所不得不投矣咳悸小便不利不降也腹中痛泄利下重不升也病同一源或為不升或為不降亦可見其為中樞不旋矣旋其中樞舍茈胡其誰與歸或謂天道下濟而光明地道卑而上行人身似之故陰常上朝陽常下潛今責其陽升陰降得無與此違乎蓋陰中有陽陽中有陰陰不得陽何以上朝陽不得陰何以下濟特欲其上之陽與欲其降之陰此陰陽之粗也上朝下潛之陰陽陰陽之精也故曰陰者藏精而起亟也陽者衛外而為固也又曰陰精所奉其人壽陽精所降其人夭觀鱉甲煎丸薯蕷丸二方知古人用意深遠未容淺窺也夫鱉甲煎丸其意在攻堅堅去而樞機不轉則病邪與氣血相溷必復結於他所為患薯蕷丸其意在補虛虛復而樞機不轉則新受之補與宿存之病相搏必轉結而為患有餘而往不足隨之不足而往有餘隨之此其旨矣兩方皆用桂枝皆用茈胡蓋太陽者諸陽之長也少陽者陰陽之軸也虛勞癥癖病深在內雖無與於諸陽然病氣深伏不使從陽分消以殺其勢欲專精畢力群萃攻之曠日持久未見其成猝為他氣所乘以致敗者蓋亦多矣太陽實統營衛營衛行於身日夜共五十周無間不入無微不至太陽既治營衛經由病所病必避而讓之此其時豈不能稍稍帶去病根積微成著未見其必無功也何況少陽能轉陰陽之樞機使升降各得其所不更能帶去病邪耶兩者相較欲補虛者通營衛為長欲攻堅者轉樞機為要故鱉甲煎丸用茈胡得君藥十分之五桂枝得君藥四分之一薯蕷丸桂枝得君藥三分之一茈胡得君藥六分之一也寇宗奭氏極詬世以茈胡治勞李東璧氏又詬寇氏之說謂為不足憑詰難紛紛於茈胡之用略未得其綱領即其所謂勞亦無當於古人之旨仲景之言曰男子平人衇大為勞極虛亦為勞夫衇大陰虛也極虛陽虛也勞有兩途陰虛陽虛盡之矣而可用茈胡耶寇氏之說似矣然所謂虛勞諸不足風氣百疾薯蕷丸主之中有茈胡此又何說哉李氏引東垣之言謂有熱則加無熱則不加仲景論勞陰虛至於渴及亡血虛煩不眠陽虛至於陰寒精出痠削難行裏急竝不言發熱其言有涉於熱者曰手足煩熱止矣手足煩熱亦非茈胡可治也夫茈胡之為物其用在陽為陰蠱陽為陰蠱陽非不足陰亦非有餘故為之開其痼解其縛於是陽得暢陰亦隨之以和假使陽乘陰位陰逼陽浮而用之則禍患之來捷於桴鼓寇氏之言未為誣也設使陽纍於陰痹俠背行腸鳴馬刀俠癭且兼寒熱李氏之說可盡廢乎即如寇氏言苟無實熱必不得用既為虛勞何得更有實熱兩家之言多為似勞非勞者誤耳何謂似勞非勞即金匱所謂五臟虛熱者也徐忠可曰五臟虛熱當與凡傷於寒則為病熱對看蓋傷寒邪自外來外來之邪病在經絡為實邪故此言五臟以別於表也曰虛熱以別於實邪也謂五臟之間為虛邪所襲因致血氣滯而不暢則表裏之間虛邪作熱惟虛邪故四時皆有之唯虛邪不若表邪之傳經更變故可以一方隨時加減治之茈胡為半表半裏和解之品且能暢發少陽生生之氣四時咸用焉後人逍遙散等方此其嚆矢也而謂之勞則亦失其實矣鱉甲煎丸用茈胡小茈胡湯治婦人熱入血室必以為茈胡亦入血分矣不知所謂血者即前所云能為陽纍之陰也仲景曰血弱氣盡腠理開邪氣因入與正氣相搏結於脅下邪正分爭往來寒熱休作有時默默不欲飲食臟腑相連其痛必下邪高痛下故使嘔也夫邪高謂其所從來痛下謂其所當及高者謂脅下者謂肝肝與膽地逼氣通勢相連屬故邪氣自募入腑者必由腑及臟及臟則病連血分矣以其源本係血弱氣盡也雖然少陽之氣振則自能庇護使邪不相侵腑且不相侵又何侵臟之虞是雖名治血實則治氣也癥瘕病皆屬肝鱉甲煎丸攻堅消積飛走靈動已略具矣其拔本塞源則係於茈胡以是知茈胡仍為氣結用也曰婦人中風七八日續得寒熱發作有時經水適斷者此為熱入血室其血必結故使如瘧狀夫血去則熱隨血行血止則熱與血結結之久則為癥為瘕其暫者亦不過適與相聚原未根深蒂固也拔去其邪熱與誰結此仲景治病不異庖丁解牛批郤導窾兩無所傷不必泥於治血血分之病自無不愈矣麥虋冬凌冬不雕葉似莎草長及尺餘四月開淡紅花如紅蓼花實圓而碧如青珠根黃白色有鬚在根如連珠形圖經人之有生全恃納穀穀入於胃為之敷布一身使遍而不狥常而有制則藉乎肺經衇別論曰食氣入胃濁氣歸心淫精於衇衇氣流經經氣歸於肺肺朝百衇輸精於皮毛毛衇合精行氣於腑腑精神明留於四臟氣歸於權衡權衡以平氣口成寸以決死生但胃之為腑多氣多血凡有變動每患其實不比於虛設使胃氣偏盛所納遂多轉輸稍不循序則氣之壅結所不能免是心腹結氣傷中傷飽所由來也胃絡衇絶當以仲景胃氣生熱其陽則絶為解蓋心腹既有結氣則輸送之機更滯是以中氣無權不患傷饑每為飽困由是胃氣益盛孤陽生熱漸致衇絡不與心肺相通則食入不得為榮形羸氣短諸恙叢生矣麥虋冬質柔而韌色兼黃白衇絡貫心恰合胃之形象其一本間根株纍纍四旁橫出自十二至十六之多則有似夫與他臟腑衇絡貫注之義其葉隆冬愈茂青蔥潤澤鑑之有光則其吸土中精氣上滋莖葉絶勝他物可知且其味甘甘中帶苦又合從胃至心之妙是以胃得之而能輸精上行自不與他臟腑絶肺得之而能敷布四臟灑陳五腑結氣自爾消鎔衇絡自爾聯續飲食得為肌膚穀神旺而氣隨之充也是證也農皇軒岐唱之於前仲景思邈和之於後既已彰彰顯著矣乃金元以來凡遇此者不曰補中消運則曰清火泄熱夢夢者幾五百年賴香巖葉氏起而明之曰知饑不能食胃陰傷也曰太陰溼土得陽始運陽明燥土得陰乃安所製益胃陰方遂與仲景甘藥調之之義合嗚呼但知讀靈素不能參究本經傷寒金匱以合之乃謂能取之左右逢源吾不信也傷寒論金匱要略用麥虋冬者五方惟薯蕷丸藥味多無以見其功外於炙甘草湯可以見其陽中陰虛衇道泣澀於竹葉石膏湯可以見其胃火尚盛穀神未旺於麥虋冬湯可以見其氣因火逆於溫經湯可以見其因下焦之實成上焦之虛雖然下焦實證非見手掌煩熱脣口乾燥不可用也上氣因於風因於痰不因於火咽喉利者不可用也虛羸氣少不氣逆欲吐反下利者不可用也衇非結代微而欲絶者不可用也蓋麥虋冬之功在提曳胃家陰精潤澤心肺以通衇道以下逆氣以除煩熱若非上焦之證則與之斷不相宜故衇微欲絶是四逆湯證少氣下利是理中湯證風痰上氣是小青龍湯證有瘀血而不煩熱是下瘀血湯大黃䗪蟲丸證也劉潛江云麥虋冬四季不雕然採其根必在夏至之前是為以至陰效至陽之用心肺至陽也不能離至陰以陽不得陰則亢而不能化陰故虛勞以為要藥如黃連清心黃芩清肺均不得與於此數何者其甘苦之味潤澤之質由胃至心使衇氣流經經氣歸於肺肺朝百衇使天氣下降地氣以生是豈芩連所能任哉然治虛勞是矣又以客熱竝言何也蓋下焦陰虛為熱者謂之虛勞上焦陰虛為熱者謂之客熱以對待言也惟是上焦之熱若因陽盛致陰虛者直攻其陽之盛而陰自復可以芩連之屬治之若因陰虛以致陽亢投之芩連則非特不能和其陽之無依并致絶其陰之化源豈得不以麥虋冬治之耶蓋麥虋冬之袪熱不比於苦寒之品惟以清和之性潤澤之質能回陰燥通衇氣使亢陽得依於陰是所謂散肺伏火也使逆氣得入於經是所謂益肺氣也雖然潤澤者與燥氣對柔膩者與亢陽對若有熱而胃兼有溼滯即不可施即有熱而胃氣居於卑弱亦不可施若施之得宜則所謂強陰益精補心氣不足保定肺氣者昔人豈欺我哉獨活春生苗葉如青麻六月開花作叢或黃或紫結實時葉青黃不等防風莖葉俱青緑色莖深而葉淡似青蒿而短小春初時嫩紫紅色五月開細白花中心攢聚作房實似胡荽子而大根土黃色圖經劉潛江云易曰本乎天者親上本乎地者親下素問曰辛甘發散為陽酸苦湧泄為陰先哲曰非辛無以至天非苦無以至地防風獨活氣味俱薄性浮以升而防風先辛後甘辛勝於甘故其為義本於辛以上升乃合甘而還中土以暢其散發之用獨活先苦次辛苦多辛少辛後有甘故其為義本於苦以入陰變為辛以上行得甘之助而氣乃暢故防風自上達於周身獨活則自下達於周身矣夫大風頭眩痛惡風風邪目盲無所見是在上之病在上之病其治應降升則一往不返矣賁豚癇痓女子疝瘕是在下之病在下之病其治應升降則順流而下矣惟防風具升之體得降之用獨活具降之體得升之用所謂升中有降降中有升是以獨活能達氣於水中而散陰之結防風能暢氣於火中而散陽之結上行極而下下行極而上斯陰陽得交愈後無餘患也雖然風行周身骨節疼痛及百節痛風非特風病亦必兼溼茲二味者固亦能兼治溼歟蓋風非溼不生溼非風不化譬之長夏鬱蒸旋起大風鬱蒸者本由風而成大風者亦由鬱蒸而起故獨活能治風然其所治之風是溼化風本於陰者也防風亦能治溼然其所治之溼是風化溼本於陽者也獨活散溼以化風然時與防風合奏散風之功防風袪風以行溼然時與獨活協為除溼之助若僅以謂風能勝溼風能燥溼者亦淺之乎二味之治矣金瘡痛者經衇以血去而澀四肢攣者經衇以溼釀而拘經曰經衇者所以行血氣營陰陽濡筋骨利關節者也夫營行衇中每患於溼以為血病血病則邪氣惡血住留住留則傷經絡經絡傷則不能行血氣營陰陽故患為諸痹甚者且不得濡筋骨利關節致骨節酸痛機關不得屈伸且拘攣矣其脊痛項強不可回顧腰似折項似拔又皆由溼以化風蓋真陽不暢水鬱即溼生溼鬱又能化風獨活暢水中之陽以杜溼之根防風通陽中之陰即除溼以絶風之源此所以無問久新之百節痛風及骨節痛煩滿由於風行周身者均可分析治之矣獨活暢陰以達陽防風散陽以畜陰暢陰以達陽者俾陽出陰中以上際其升之機藉於肝散陽以畜陰者俾陽依陰中以下蟠其降之機舉在肺故曰金木者生成之終始是獨活之用在肝防風之用在肺不可胥於是見耶在上之氣上主之在下之氣下主之獨衛氣出於下焦而偏為肺所主此其間則有故而獨活防風功能因可得其慨矣蓋衛氣者非他乃水穀入胃既已致其精微淫於五臟矣其粗者更順流下抵小腸濟泌別汁分入大腸膀胱復有氣出於外而上行其氣最悍又最疾頃刻周遍一身營衛生會篇既以酒之後穀而入先穀而液出喻其質矣其俄頃頭面手足遍身盡赤獨不可喻其慓悍滑疾耶是氣有所留住則隨地皆著為疾衛氣失常篇黃帝曰衛氣之留於腹中蓄積不行莞蘊不得常所使人支脅胃中滿喘呼逆息伯高曰其氣積於胸者上取之積於腹者下取之今之賁豚癇痓女子疝瘕非積於下者耶大風頭眩痛惡風風邪目盲無所見非積於上者耶風寒所擊金瘡泄其一處諸處護衛皆疏也濬其源使來者自盛則護衛仍密矣故其功係之獨活風行周身骨節疼痛煩滿諸處皆有阻非一處之病也若更濬其源使來者益甚不更慮其阻亦益甚耶故必導其流使之暢行無閡其功不得不屬防風矣更核之金匱要略侯氏黑散桂枝芍藥知母湯薯蕷丸竹葉湯之用防風千金三黃湯之用獨活其義不益可明哉曰大風四肢煩重心中惡寒不足曰支節疼痛身體尪羸腳腫如脫頭眩短氣溫溫欲吐曰虛勞諸不足風氣百疾曰産後中風發熱面正赤喘而頭痛其病皆弛其本皆虛虛者宜益弛者宜張宜益宜張則有合乎防風辛甘之陽曰中風手足拘急百節疼痛煩熱心亂惡寒經日不欲飲食其病頗急其本不虛不虛而急者宜追逐擊散之則有合乎獨活之苦辛自陰及陽矣大率獨活氣峻防風氣緩緩者比於補益峻者比於攻伐補劑多自下及上防風者偏自上而至下是以得為補劑之佐獨活者偏自下而及上是以專為攻劑之佐體相似而用不同職此故耳上品草七味薯蕷春間或以其宿根頭或取其子以黃沙和牛糞作畦種之四月生苗延蔓紫莖緣物而長葉有三尖似白牽牛而光厚潤澤五六月開花成穗淡紅色結莢成簇莢凡三稜合成堅而無仁其子別結於一旁狀似鈴大小不一皮黃肉白其根亦然剖開有滑涎亦有野生者入藥為勝夏間宜常溉又不得大溼參圖經綱目豫家有薯蕷一本莖長至三四丈春夏緑葉扶疏屆秋垂實纍纍者有年矣會闢地治室乃掘去之根大如臂攀磚附石至三四尺究未窮其所止蒸而茹之甚甘美因是悟古人所謂種薯蕷者先杵地作孔則薯蕷隨孔之大小以為大小是欲其肥不欲其長也若野生者隨地下之隙而直下焉逮年月深久仍能橫擴為肥入藥取此即以其入土深善附磚石耳其為物也有皮有筋而肉最勝又皮黃肉白筋即仿其肉之色又可悟其致厚肉之氣於皮以為之體而合皮本為肺主而屬金色黃則土金相生而和合矣與肉本為脾之所主屬土色白亦為金土和合之氣致之於筋以為之用肺者氣之所由行肝者力之所由作氣與力之受益其端皆係於能補中而肉最厚之物此不可謂補中益氣力長肌肉乎或曰主傷中補虛羸即補中益氣力也而本經復言之何故此蓋當連下句讀主傷中補虛羸除寒熱邪氣云者猶云補傷中而致之虛羸除傷中而受之寒熱邪氣也夫虛必有一處為先他處乃連類及之者邪所湊雖云其氣必虛然亦有陰陽之分五臟六腑之異譬之水決定因其地窪下而灌之乃泛濫及於他所薯蕷所主之虛之邪須審定其由傷中傷氣方得無誤不然傷血及他傷亦能致虛羸成寒熱又何別焉別録所主補虛勞羸瘦充五臟除煩熱正與本經相印惟下氣止腰痛強陰三項為特出此則以野生者益善下行最喜攀附磚石也至於頭面游風頭風眼眩唐以來醫家不甚用此味故無從參其底裏然質之仲景治風氣百疾本經除寒熱邪氣亦可默會其旨矣仲景書中凡兩用薯蕷一為薯蕷丸一為腎氣丸薯蕷丸脾肺之劑也腎氣丸肺腎之劑也觀經衇別論食氣者先歸肝心乃及於肺飲氣則先歸脾而亦及於肺至肺而後布其精瀉其粗惟不言至於腎蓋腎固藏精泄濁之總匯也風氣百疾者心肝脾之氣懈於朝肺肺遂不能輸精於皮毛斯外邪乘而客之是其責雖在肺而其咎究在脾故薯蕷丸以薯蕷帥補氣藥為君補血藥為臣驅風藥為佐使少腹有故小便不調者肺之氣怠輸精於皮毛毛衇不能合精以行氣於腑斯清濁兩者或泛其源或塞其流是其責雖在肺家輸瀉之不肅而其咎實當歸於腎家翕受之不咸故腎氣丸以薯蕷隨地黃茱萸牡丹附子桂枝以撥正其翕受之機又以薯蕷帥茯苓澤藛以開通其輸瀉之道曰腎氣丸者明腎之氣固當留其精而瀉其粗也曰薯蕷丸者明脾之氣固當散其精而歸於肺也是薯蕷丸雖謂之脾氣丸也可腎氣丸雖謂之地黃丸也亦無不可是皆穀氣穀精不充暢流動之咎也薯蕷體滑多涎黏稠色白其似肉中之脂液耶不然何以生搗可消熱腫也其似腎所藏之精耶不然何以能強陰也凡物功能固莫不由形色性味而發然能此復能彼又莫不有一貫之理存乎其間消肉中熱腫之與強陰其義非可相直也何哉夫腫非一端而曰熱腫則固當得陰濟乃能解矣矧不在皮膚不在血衇不在筋骨而在肉斯固為肉中之氣運掉不靈致有所壅也得厚肉多脂不爽生氣之物其壅何能不解且強陰非益精也玩金匱之用薯蕷蓋可以得其概矣夫以陰中所由而言則精自精溺自溺其源不同其所由化亦異何以腎氣一丸在虛勞在轉胞則治小便不利在消渴則治小便過多然惟此方可見溺能閡精精亦能閡溺也金匱真言論北方黑色入通於腎開竅於二陰水熱穴篇曰腎者胃之關也關門不利故聚水而從其類也是故精化為氣方有以司開闔而無不禁之虞壅塞之患水精四布五經竝行方有以容氣之游行而開者遂其開闔者遂其闔此統二竅而言之者也若就一竅而言則此竅過通彼竅必塞如下利則溺短小便多則大便鞕何獨於精與溺而疑之耶故曰味歸形形歸氣氣歸精精歸化此由粗以致精也曰精食氣形食味化生精氣生形此精虛而挹粗以益之也曰味傷形氣傷精精化為氣氣傷於味則粗者不能益精反足以害精矣由此而觀則以溼熱下注而遺精以精氣壅遏而溺澀精溺雜下而為濁及以溺多而劫精以溺塞而爍精其源皆由脾胃之不咸夫固曰腎者胃之關耳夫不咸之始必本於胃氣之不充不咸之成必歸於脾氣之不治脾胃一臟一腑皆在中宮竝主出納而其性情則異胃司降而喜涼脾司升而喜溫薯蕷溫平之物不寒不熱不潤不燥為脾胃之所均喜故其用為能致胃津於脾而脾胃以和故經衇別論謂食氣入胃則散精於肝而歸濁氣於心惟飲入於胃則輸精於脾此不可易之常理也薏苡二三月宿根生苗葉如初生芑芽白苗之黍曰芑五六月抽莖高三四丈開紅白花作穗結實有二種一種尖而殼薄黏牙者薏苡也其米青白色如糯米一種圓而殼厚堅鞕者菩提子也但可作數珠竝九十月霜後採根白色大如匙柄糾結而味甘圖經參綱目靈樞經筋篇謂筋寒則收引熱則縱弛與素問生氣通天論所謂溼熱不攘大筋軟短小筋弛長者不合蓋筋之為物寒則堅徑堅徑則短縮熱則軟緩軟緩則弛長此為不挾溼者言也若挾溼則大筋橫脹橫脹則軟短小筋縱伸縱伸則弛長遇溼遂脹凡物皆然特能短而不能徑此所以與因寒而縮者異雖然寒收熱縱者理之常故其應速大縮小伸者理之變其應必遲何也則以溼熱不攘句見之蓋因於溼首如裹此時尚未挾熱也溼性最遲至其化熱已非一朝一夕之故既已化熱尚不除而去之以漸而漬於筋至筋被溼而脹焉則蓋遲之又久矣玩本經久風溼痹久字正與是義相符何者夫筋急拘攣不可屈伸焉知其不緣被寒而收引乃可更用微寒之薏苡惟筋急拘攣不能屈伸之屬於久風溼痹者方見其不因於寒以始傳寒中末傳熱中原外感之常理耳雖然以從容不迫之薏苡而主筋急拘攣不能屈伸之久風溼痹得毋貽養癰之咎歟夫物性亦各有當矣薏苡作穗結實於插禾之前而釆掇必於穫稻之後衝冒溼熱以成其體飽吸秋肅以鍊其質惟其久而成就是以專治積漸而致之病積漸之病決難速愈又豈得以貽患誚之比之天虋冬治暴風溼偏痹所謂各行其是功足相侔者也夫勝溼以燥驅熱以涼斂脹以肅且筋屬於肝筋病則肝病肝病者必以肺勝之是薏苡之色白氣涼性降者可不謂非肺之象形惟其象肺是以又能下氣耳劉潛江云胃為五臟六腑之海其清氣上注於肺以通呼吸其所以能上注於肺者實由於脾脾氣合於腎以至肺肺氣合於心以歸腎如環無端乃能運血氣營陰陽若胃氣虛則脾不上升溼盛化熱還湊於胃脘之陽以傷氣胃陽亢則肺不下降熱盛生溼還迫於脾臟之陰以傷血傷氣者肺受之故或阻其氣為胸痹偏緩或損其陰為肺痿肺癰或肆其所勝為筋急拘攣傷血者脾受之故或下陷為泄或旁溢為水或滲壅經絡為久風溼痹或溜阻下部為頽疝重墜薏苡生於平澤氣寒味甘是水土合德乃結實於盛夏是潤下之氣還就炎上而採實期於秋末是熱浮之氣反歸涼降有合於胃達地氣而後不病於溼之化熱更合於胃達天氣而後不病於熱之化溼舉前證胥能治之故寇氏曰脾健則能運化陰陽脾之不健多困於溼薏苡健脾惟使脾肺腎之氣得暢使溼不留而已故去溼即能清熱所謂陰陽合而氣生陰陽和而氣行是也論者謂益氣除溼和中健脾薏苡與朮略相似而不知其有毫釐之差千里之謬也蓋以云乎氣則朮溫而薏苡微寒以云乎味則朮甘辛而薏苡甘淡且朮氣味俱厚薏苡氣味俱薄為迥不相侔也此其義蓋見於金匱要略痙溼暍篇曰溼家身煩疼當與麻黃加朮湯發其汗為宜慎勿以火攻之曰病者一身盡疼發熱日晡所劇者此名風溼此病傷於汗出當風或久傷取冷所致也可與麻黃杏仁薏苡甘草湯夫身煩疼者溼而兼寒一身盡疼者溼而兼風寒從陰化風從陽化故身煩疼者屬太陽發熱日晡所劇者屬陽明屬太陽者宜發汗屬陽明者宜清熱發汗所以泄陽邪清熱所以折陽邪質之以用朮用桂者為發汗薏苡則為清熱矣雖然薏苡既治風溼又主筋急拘攣不能屈伸彼風溼相搏骨節疼煩不得屈伸風溼相搏身體疼煩不能自轉側獨不用薏苡何耶夫適固言之矣薏苡是治久風溼痹非治暴風溼痹者也然則麻黃杏仁薏苡甘草湯證非暴病耶玩汗出當風久傷取冷之因決知其似暴病實非暴病也發熱日晡所劇風與溼勢將化熱故以薏苡合麻黃杏仁甘草迎其機而奪之彼風溼相搏者上既冠以傷寒八九日已可知其非久病下出所治之方或有取乎附子生薑或有取乎附子桂枝且俱用朮其不能雜入薏苡決矣朮與薏苡非相反相惡也既用此即不用彼者無他朮性急薏苡性緩合而用之恐其應速則嫌於緩應遲又傷於躁也胸痹緩急者薏苡附子散主之注家於緩急二字或指為筋之引縱或指為痛之休作殊不知痛僅胸痹中一證胸痹者不必盡痛筋之繫頭項手足者即為引縱未必竟由胸痹胸痹而竝有筋病亦非引則縱非縱則引又未必乍縱乍引故注緩急者當闡明緩急之故確指緩急之據然後其證可得而明也夫胸痹緩急在素問靈樞固無及之者言他證之緩急則有矣寒熱篇曰陰蹻陽蹻陰陽相交陽入陰陰出陽交於目鋭眥陽氣甚則瞋目陰氣盛則瞑目二十九難陰蹻為病陽緩而陰急陽蹻為病陰緩而陽急此可見二蹻之緩急繫於目矣經筋篇足陽明頰筋有寒則急引頰移口有熱則筋弛縱緩不勝收而為澼治之以馬膏膏其急者以白酒和桂塗其緩者以桑鈎鈎之此可見陽明之緩急繫於口矣今但曰胸痹而不言痛是其無痛可知曰緩急則又可知如蹻之於目陽明之於口有急處有緩處矣何以知之巢元方曰寒氣客於五臟六腑因虛而發上衝胸間則胸痹甚者肌肉苦痹絞急如刺不得俯仰孫真人蓋亦云然夫陽明之口頰未必一中於寒一中於熱左右竝時也必其寒中於左逼熱於右寒中於右逼熱於左故一緩一急同時俱發耳然則五臟六腑之寒氣因虛而上衝於胸膈間者何能不衝於此逼熱於彼乎寒衝於左逼熱於右則左急而右緩寒衝於右逼熱於左則左緩而右急附子治急者也薏苡治緩與急者也使合而治之不畏治急多治緩少耶玩方中二味成劑之意薏苡固不能驅上衝之寒而附子確足以助被逼之熱故不稍殺其熱則附子之治寒不專不振散其寒則薏苡之清熱難恃且薏苡原能下氣附子本以逐痹寒既自下而上升故下氣之物不嫌倍於逐痹熱緣被逼而偏駐故逐痹之物何妨峻於下氣因製劑之料量洞識為病之根由即注家之籠統含糊均可於此察之矣然則薏苡附子敗醬散之治腸癰亦有緩急可言耶夫身甲錯是急之微腹皮急是急之甚按之濡是緩之形如腫狀是緩之著蓋溼氣瘀血盤踞於內勢將釀熱成癰而先格寒於外故其病為內緩而外急也夫腹無積聚是內熱未甚身無熱則外寒方猖正格熱於內內熱將甚之兆也故其衇為數不然焉有腸內生癰猶可用附子之理哉雖然溼與血踞於腸終竟內有根而外無根無根者易傾有根者難拔故附子之追寒破結僅十七分之二而清熱去溼之薏苡既有十分又益之以敗醬五分俾解熱毒而鍾生氣於瘀濁垢穢之中生氣昌斯瘀濁垢穢行矣或謂腸癰衇數用附子腫癰衇遲緊反用消黃何故蓋玩兩條之旨腸癰病在小腸小腸者水穀雜居故為太陽寒水之腑腫癰病在大腸大腸者有滓穢而無水故為陽明燥金之腑太陽者多血少氣陽明者多氣多血氣屬陽血屬陰則陽明之易為燥熱較之太陽殊矣然則何以證其為太陽與陽明夫身無熱衇數太陽也發熱汗自出小便自調陽明也服藥後小便當下小腸也服之有膿當下無膿當下血大腸也以燥金之府最易化熱之區而所用者消黃猶不可證以薏苡為君附子為佐者非欲其入寒水之腑多血少氣最難化燥之區耶薏苡非入小腸之物小腸有溼熱則用之此可見某藥入某經某臟某腑之為鑿矣澤藛春生苗多在淺水中葉狹而長似牛舌獨莖直上秋時開白花作叢似穀精草秋末採根暴乾圖經張隱庵曰凡水草石草皆屬腎其性主升蓋天氣下降地水之氣上升自然之理也凡物之本乎上者性升本乎下者性降澤藛形圓無下行之性矣春時叢生淺水之中獨莖直上秋時白花作叢腎之肺藥也易曰山澤通氣能行在下之水隨澤氣而上升復使在上之水隨氣通調而下瀉故名澤藛陳修園曰澤藛氣寒水之氣也味甘無毒土之味也生於水中而上升能啓水陰之氣上滋中土也五臟主藏陰而脾為五臟之原一得水精之氣則能灌溉四旁俾五臟循環受益不特肥健消水不饑見本臟之功而肺得水精之氣而氣益心得水精之氣而力益肝得水精之氣而目明腎得水精之氣而耳聰且形得水精之氣而全體輕色得水精之氣而面生光澤一生得水精之氣而延年所以然者久服之功能行在下之水使之上也此物形圓一莖直上無下行之性故其功效如此或曰澤藛自古未有言其上行者今但據張隱庵陳修園之說能無畏其杜撰歟曰淡滲之物其能去水必先上行而後下降是說起於李瀕湖非張隱庵陳修園創說也故夫水飲為病除大腹水腫不論外其小者在上為喘咳悸眩渴嘔吐噦在下為腸鳴泄瀉小便不利行水之物即仲景所用者有防己木通蕘花芫花大𦺩甘遂半夏滑石葵子白魚葶藶瞿麥蔏陸澤漆海藻赤小豆薏苡仁文蛤莫不各有所主惟嘔吐口渴及悸眩者多屬之茯苓豬苓澤藛是皆淡滲之物也傷寒論金匱要略兩書用澤藛者六方內與豬苓茯苓同用者五苓散豬苓湯與茯苓同用者腎氣丸茯苓澤藛湯不與二苓同用者祇牡蠣澤藛散澤藛湯二方而已二方所主之證一曰病後腰以下有水氣一曰心下有支飲其人苦冒眩則亦可知凡利水者當計其水之生熟矣何謂生熟夫已經輸脾歸肺者熟水也未經輸脾歸肺者生水也熟水已曾泌別精華但存水質故直達之使下出可矣生水者天真未離精華未去故必引之使上而後下乃不失其常耳淡滲之物皆行生水者也較之直使下降者不同蓋水之生者就其性則歸壑趨海而走極下逆其性則過顙在山而反極上從無橫溢墾齧於中而為患者故小便不利嘔渴悸眩者多用二苓澤藛第更當別其猛怯之殊怯者依土作祟則以二苓得氣化於中土者治之可也其猛者則所謂過顙赴壑非得澤藛生於水中得氣化於水出生氣以上朝究復反本還原者不可心下有支飲是沿路攔截生水肆其威於上所謂過顙者也大病差後腰以下有水氣是中無統攝而陷窪者也二者均未經氣化而停又何能不使先就上而後下趨哉其理固如是非張隱庵陳修園所能撰也且是義也核之於本經亦無有不合者蓋惟其無一滴生水不化斯無一滴熟水不行遂無一滴精微不歸於所當歸之處馴至肺得之而氣裕肝得之而力強脾得之而肥腎得之而健乳得之而通耳得之而聰目得之而明面得之而生光莫非精微之奉養至風寒溼痹得之而解水得之而消又莫非滓質之流行曰久服能不饑延年輕身行水上殆非虛語也夫水惟化而後能潤有水氣而仍渴即可見水之不化矧渴則飲水水入口即吐五苓散之所主也猶不可見水之不輸脾歸肺耶是水有生熟之說不為謬矣然五苓散茯苓澤藛湯渴而嘔豬苓湯腎氣丸渴而不嘔牡蠣澤藛散澤藛湯不嘔不渴此其間又必有故蓋嘔乃茯苓豬苓所主非澤藛所主也夫嘔為中焦病澤藛水中物為下焦藥是以於此無所關涉至於渴則中焦病有之下焦病亦有之故牡蠣澤藛散不渴何以用栝蔞惟其用栝蔞而後知澤藛不如茯苓豬苓之能治渴耳夫澤藛為物不生於深水而生於淺水是以知其僅能引水上輸不能引津液上朝不用其苗而用其根是以知其力之所始必起於水中其苗能出水面上與天氣相接是以知其力之所竟可至於極上腰以下有水氣水底之病也冒眩極上之病也舉此兩端澤藛之功可明矣且腎氣云者能似腎之氣也腎氣之極上者開竅於耳腎氣丸中有上及耳之物否耶是能上及耳者澤藛也即此又可以知上行之說為非無據矣細辛葉似小葵柔莖細根直而色紫味極辛綱目細辛色紫紫者赤黑相兼也赤為心色黑為腎色心與腎皆屬少陰兩少陰經皆短而直細辛一枝直上體細柔徑似之少陰者又皆水火相依細辛體雖細味極烈似之故凡風氣寒氣依於精血津液便溺涕唾以為患者竝能曳而出之使相離而不相附則精血津液便溺涕唾各復其常風氣寒氣自無所容如本經所載主治咳逆者風寒依於胸中之飲頭痛腦動者風寒依於腦中之髓百節拘攣者風寒依於骨節屈伸泄澤之液風溼痹痛死肌者風寒依於肌肉中之津推而廣之隨地皆有津液有津液處風寒皆能依附焉故在胸為痰為滯結在喉為痹在乳為結在鼻為𪖵在心為癲癇在小腸為水在氣分為汗不出在血分為血不行此別録之與本經一貫不異者也然須審定風寒果否零亂細碎倚著於津液者宜之若風寒遍被一身及與營衛相搏者自有他味為治與細辛無預也細辛能提出依附津液之風寒不能使津液復其常且不能使津液中氣不隨提曳以出故其治咳每與五味子乾薑為耦如小青龍湯真武湯厚朴麻黃湯是也若射干麻黃湯則不用乾薑用生薑四逆散小茈胡湯則但用乾薑五味子不用細辛蓋水氣與風寒相搏有飲有溼有水隨人異亦隨證異則兼嘔者有之兼滿者有之兼喘者有之不可但因其咳混同施治也特風寒將化則細辛不可用小茈胡湯證半化半未化者且然何況全化者耶四逆散證雖以四逆係之少陰然終外寒內熱故其治咳乾薑五味可用細辛不可用矣少陰病始得之反發熱衇沉者麻黃附子細辛湯主之少陰病得之二三日麻黃附子甘草湯微發汗以二三日無裏證故微發汗也夫以不用細辛為微發汗則用細辛為大發汗矣以無裏證不用細辛則細辛為裏證用矣裏證謂何吐利手足厥冷是也細辛非治吐利手足厥冷之物少陰病始得即用之者蓋始得病即衇沉發熱沉為在裏病已決在少陰若少蹉跎必至吐利手足厥冷故乘其外有發熱用麻黃附子一治其內一治其外然不得細辛自陰精中提出寒邪則溫者溫散者散猶未能絲聯繩貫使在內之邪直從外解也若至二三日猶無吐利手足厥冷則直是內本臟寒外被寒著互相勾引勢將入內故不必細辛之提曳陰寒但以甘草緩其內入能得微汗即便愈矣然則細辛治吐利手足厥冷亦有據歟是其義在當歸四逆湯烏梅丸二證可驗也特彼二證是寒邪附於血此則寒邪附於精耳然則少陰吐利四逆證有用吳茱萸湯者有用四逆湯者有用附子湯者有用白通湯者有用通衇四逆湯者皆不兼用細辛豈其寒非著陰精耶是又不然夫諸證皆無外熱是以不得用細辛惟通衇四逆湯證有之又係陽已虛不可汗者故雖亦欲通陽不過至用蔥用生薑用桔梗已耳則直欲其汗故與麻黃比而奏功也然則當歸四逆湯烏梅丸亦欲其汗耶是蓋有說焉欲其藉汗分消非純欲其從汗愈也之二症者雖皆手足厥冷皆有寒復有熱若以四逆湯等溫之則寒既去而熱遂猖故當歸四逆湯中仍有桂枝湯在內以其寒邪內有所著用細辛助桂枝是猶與向者之助麻黃同一理也若烏梅丸則烏梅黃連為君益以黃蘗沉寒附子細辛僅得君藥三之一是其大致為清劑以餘寒尚有所附恐其熱去寒生故以細辛提之使出以附子乾薑化之遂寒熱俱消太和復舊耳要之藥之功能非有異而調處之多方制劑之各別遂使之若有異者故既不得舍藥性論方又不容舍方義論藥矣金匱桂薑甘棗麻辛附子湯所治之氣分為寒著於何所耶然其在內者曰心下堅大如盤邊如旋杯其在外者曰手足逆冷腹滿脅鳴身冷骨疼其衇在寸口曰遲澀在趺陽曰微遲則其寒為與胸腹之津液相搏矣是病也上則心陽不紓下則腎陽難達是故桂枝湯暢心陽之劑也麻黃附子細辛湯鼓腎陽之劑也二方諸味分數皆與傷寒論無異惟細辛則多用一兩與小青龍湯同麻黃較之小青龍湯少用一兩是則其中有故矣夫補上治上制以緩補下治下制以急小青龍湯其治在上則此湯其治在下可知矣且腎主分布五液於五臟寒邪之依津液者雖在上在下不同然其本莫不根於腎細辛本入腎能提散依附津液之邪安得不重之耶是證之解也仲景著其義曰陰陽相得其氣乃行大氣一轉其氣乃散又著其狀曰服藥後當汗出如蟲行皮中夫欲其陽回陰戢諸味所能也欲其陰陽相得非細辛不能也欲其汗出亦諸味所能也惟然則聯二方而重細辛非無故矣咳逆倚息不得臥服小青龍湯後多唾口燥氣從少腹上衝咽胸面翕熱如醉狀小便難時復冒於小青龍湯去麻黃芍藥乾薑半夏細辛加茯苓治其氣衝服湯已衝氣低反更咳胸滿則去桂還用細辛乾薑治其咳滿咳滿止則當渴反不渴且冒而嘔則還用半夏蠲其飲此亦小青龍加減法也而其關鍵實在細辛乾薑蓋邪之中人無所依附則其去必速焉有綿延遷變如是哉惟飲為邪窟宅邪為飲凶鋒互相勾留故其治雖至變端疊出復加杏子加大黃麻黃桂枝可不復用乾薑細辛終不可去也夫小青龍本以咳為主證以渴為欲解致渴之物方中無如乾薑者然乾薑能熯飲不能去附飲之邪附飲之邪不去縱使飲已消而邪固在亦終不渴此則細辛之功遠在乾薑之右矣況才以口燥衝氣面熱恐其陽勝氣逆暫撤二物隨即咳且胸滿是二物者可不急復用耶故下文云細辛乾薑為熱藥服之應遂渴乃渴反止則二物之始終不可去尚何疑矣方以加減而用益長藥以出入而旨益明審夫咳與渴之離合細辛乾薑之用遂無誤矣風溼衇浮身重汗出惡風者防己黃芪湯主之若其人下有陳寒者加細辛手足厥寒衇細欲絶者當歸四逆湯主之若其人內有久寒者加吳茱萸生薑久寒陳寒一也上條加細辛已足下條既有細辛又加吳茱萸生薑吳茱萸生薑豈猛於細辛哉蓋上條之病在上在外者多其下但有些微陳寒加用細辛引之外達其寒自隨芪朮甘草薑棗以透達若下條其病原在內在下細辛本不可無加以素有久寒非細辛桂枝所能悉解如吳茱萸是劫散其寒加生薑是協桂枝甘棗使病從外出也是故上條不加細辛則治法有上無下不能保風溼去而寒復猖下條若但恃細辛則治法有下無中不能保陽已布而寒仍不達可見細辛究是治下之劑能直上直下不能徹內徹外是下條有細辛猶上條有生薑乃病機形勢不能不然非有猛劣之殊也故凡鑿然謂某藥治某病不知揣切其病情聯絡其形勢者可語一勞永逸耶其某藥治某病其間猶有如何則可用如何則不可用審其不可用則可用者遂不誤矣如細辛本經主咳逆上氣小青龍湯治咳逆上氣之劑也而曰服湯已渴者寒去欲解也則咳逆上氣而渴者細辛不當用矣又主百節拘攣侯氏黑散千金三黃湯治百節拘攣之劑也而此曰惡寒彼亦曰惡寒則百節拘攣而不惡寒者細辛非所宜矣又主風溼痹痛防己黃芪湯治風溼痹痛之劑也而曰下有陳寒者加之則風溼痹痛下無陳寒者細辛無能為力矣推而廣之仲景雖無治頭痛腦動之方然曰頭痛腦動則頭痛腦不動者細辛其可用耶總之細辛惟治寒乃為恰合惡寒者寒之方猖口渴者寒之已化腦動者寒與在上之陽戰而陽欲負下有陳寒則必惡寒可見矣曰脅下偏痛發熱其衇弦緊此寒也當以溫藥下之宜大黃附子湯曰寒氣厥逆赤丸主之二者一溫以附子下以大黃一溫以烏頭利以茯苓半夏一使其從大便解一使從小便解皆以細辛聯絡其間不然則溫自溫下自下利自利終不能使寒氣徹底澄清耳於金匱求大便通利者有大黃附子湯於傷寒論求利止者有烏梅丸可知細辛能已後陰諸疾矣至千金治鼻塞耳聾齒痛諸方用細辛者甚多至口鼻目病則幾乎無方不用豈本經所謂明目利九竅者誠不必別擇盡可用之耶然即此亦可窺其嚴於去取之意矣觀於目病有勞者息肉生者有障翳者有赤白膜膚者生珠管者皆不用眼暗者淚出者眥赤者多用之則目病用細辛有去取矣鼻病生息肉者衄血者皆不用鼻塞者鼻𪖵者多用之則鼻病用細辛有去取矣口病惟口臭齒痛多用之耳病惟外治多用之惟前陰病則絶無用者曾謂九竅不利於細辛毫無別擇哉素問曰六經為川腸胃為海九竅為水注之氣細辛雖善治著水之寒然著於小者能治之著於川著於海則非所長矣前陰者汪洋大水之出路故非細辛所能與也芎藭清明後宿根生苗分其枝橫埋之則節節生根葉似水芹作叢而莖細七八月開碎白花如蛇牀子花根堅瘦黃黑其形塊重實作雀腦狀者佳參圖經綱目凡物之性燥味辛能升發陽氣者必能消耗陰氣惟芎藭透苗出土必至清明已後則其不為溫和未盛之氣所能鼓動可知既而取枝橫埋土中能節節作根生苗則其於盛陽之氣無壅不宣無間不達亦可知至八月每節根下皆結芎藭九十月釆之過其時即虛劣則其遇盛陽固無不升發感陰收復能退藏於密又可知且其遇陰而藏者即以供遇陽而發特收釆當值退藏方固之時乃得發中有收之益此劉潛江芎藭能達陽於陰中即能貫陰於陽中二語所以不可易也雖然人身不止血分為陰凡物能於陰中達陽者應不止能達血分之陽乃芎藭祇入血者何義蓋凡臟氣之本降者不受下陷之纍惟其氣本升今不能升斯為纍耳臟氣本升者非肝而何肝不他藏獨藏夫血斯與升麻等物升脾中之氣者異矣此芎藭所以入肝臟升血分中陽氣也抑芎藭非專入血也觀本經主寒痹及筋攣緩急別録主諸寒冷氣心腹堅痛中惡卒急腫痛皆非血分之病然陽氣不能禦寒則為痹陽氣不能運行則為心腹堅痛以及卒急筋攣無非涉肝之病以此類推則芎藭之所主仍不約矣玩本經別録芎藭之治可悟氣血必相輔而行也夫氣本乎天者也血本乎地者也本乎天者親上本乎地者親下則血應不至頭氣應不至足矣乃若雲蓬蓬然膚寸而合不終朝而雨何不出於澤而出於山也抑若泉涓涓然引而匯之遂成江湖何不出於隰而亦出於山也在人髮為血餘乃居體之極上目得血而成視又居竅之最高以是知血不至之處氣亦不至氣不至則客氣乘之此中風入腦頭痛腦中冷動面上游風去來目淚出多涕唾忽忽如醉皆陽氣不至也陽氣不至何又責其血不至則以其用芎藭而知蓋肝為陰中之陽主升發陽氣故其衇上入頏顙連目系上出額與督衇會於巔血其體也氣其用也體以範用故血至則氣無不至氣至則頭腦面目何得為風寒侵耶然則仲景於頭項強痛何絶不用芎藭則以本經別録之風寒入腦但頭痛而身不痛不惡風寒是知仲景所治在營衛不專在頭是可悟芎藭之治不能統主一身之氣血不相維獨能提發陽氣陷於血分斯一隅之與周身所宜著眼矣芎藭本經治婦人血閉無子然則陽陷亦能血閉耶此非陽陷乃金匱要略所謂婦人之病因虛積冷結氣為諸病經水斷絶至有歷年積血胞門者也夫陽欲其暢陰欲其和不暢不和雖實而成虛矣積冷結氣皆陽不入也蓋亦未嘗無陽無陽則死矣譬之火為溼物所遏則暖氣不出而光耀不彰撥使焰通旋即溼物轉燥為火所焫矣火猶是火也人身能行血中之陽者肝肝不行陽則經水絶用芎藭使肝氣行積冷自消月事自下是別録所謂溫中內寒者也然則厥陰傷寒何以但用當歸不用芎藭蓋厥陰之為病消渴氣上撞心心中疼熱其常也咽燥唾血口傷爛赤其變也觀此則厥陰傷寒是陽逆血分非陽陷血分在上之陽未嘗不足故僅用當歸之橫散不取芎藭之升發然則少陰有下利膿血證何以不用芎藭夫病邪能入陰分以下焦根柢不足也是以止宜溫托不宜升發如心中煩不得寐面赤戴陽皆少陰所有是其陽本浮散更用芎藭不謂之盛盛不可即如太陰之腹滿時痛亦未始非邪入血分亦止用芍藥之開可知三陰皆忌升矣芍藥當歸芎藭皆去血中之病觀乎此又何不可知三物各有所主斷難混同施用耶芎藭仲景用之最少如侯氏黑散薯蕷丸賁豚湯芎歸膠艾湯當歸芍藥散當歸散溫經湯等方與諸血藥同用不足見製方之長惟白朮散有心下毒痛倍芎藭一語可略窺一斑若夫酸棗仁湯之用芎藭則可得而論矣夫曰虛勞虛煩不得眠心病也心屬火而藏神火者畏水神則宜安用茯苓可矣更用知母之益水芎藭之煽火是何為者殊不知心於卦象離中含一陰外包二陽陽本有餘陰本不足況勞者火炎陰竭之候故值此者宜益陰以配陽不宜泄陽以就陰然陰被陽隔於中為益陰藥所不能及芎藭者所以達隔陰之陽陽舒而知母遂與離中一陰浹而安神利水繼之以奏績是二味者雖列佐使實為此方樞機矣說者謂知母益水以濟火芎藭平木以生火而不知是方直截簡當無取乎隔二隔三此仲景所以為可貴也古驗胎方經三月不行者用芎藭細末濃煎艾葉湯空心調服二錢覺腹內微動為有胎不然是經滯後人緣是以芎藭動胎孕婦遂不敢服豈知仲景用於胎前之微義哉夫水澄之則清淆之則濁者無源渟蓄之水也大江黃河一瀉千里無所為澄亦無所為淆卒之清濁并流淤澱俱去者氣為之帥也人身之血何獨不然婦人經以月一行為常既有身而不月胎元之吸之者始寡後多不能一定淤澱之患由是生矣妊娠篇十方用芎藭者四四方之中與當歸同者三惟白朮散獨用芎且系之曰心下毒痛倍加芎藭良以心脾皆於血有關血有病則藏之者固先受殃肝受其殃次遂及心及脾故當歸散當歸芍藥散白朮散咸有取於白朮芎藭豈非以穀旺氣行血遂不壅耶血壅則胎病血行則胎安而行者尤當上通下達故白朮散不用當歸竝倍芎藭則歸之橫行芎之上行其功可識橫行者無論矣上行者因行血而除心痛則向於酸棗仁湯所謂治心非治肝者不為臆說也黃連苗高一尺葉似甘菊一莖三葉凌冬不雕四月開花黃色六月結實似芹子色亦黃根有二種一種粗而無毛有珠如鷹爪堅實色深黃一種無珠有毛而中虛黃色亦淡參蜀本圖經綱目徐洄溪曰苦屬火性皆熱者常理也黃連至苦而反至寒則得火之味與水之性故能除水火相亂之病水火相亂者溼熱是也是故熱氣目痛眥傷淚出目不明乃溼熱在上腸澼腹痛下利乃溼熱在中婦人陰中腫痛乃溼熱在下者悉能除之矣凡藥能去溼者必增熱能除熱者必不能去溼惟黃連能以苦燥溼以寒除熱一舉而兩得焉黃連根株叢延蔓引相屬有數百株共一莖者故名連其治亦多蔓延淹久之證如浸淫瘡黃連粉主之是矣夫名浸淫則非初起暴得之疾亦非一治可瘳之候故傷寒論金匱要略兩書從未有新得之病用黃連者黃連根黃花黃實黃皆具土色四月開花六月結實七月根緊適逢太陰溼土陽明燥金主令時宜乎為入脾胃之藥矣乃仲景諸瀉心湯以之為關鍵何歟夫仲景溯諸瀉心證之源曰病發於陽而反下之熱入因作結胸病發於陰而反下之因作痞結胸稱熱入痞不稱熱入可見所入之邪非陽邪矣陰邪結於陽位心下痞鞕非心病而何心自病不能熯土土遂不運而乾噫食臭乾嘔心煩下利矣腹中雷鳴者心氣被遏不能上行下走腸間也觀本經桔梗丹參之治可見夫心之為體於卦象離今被邪逼則外陽內伐內陰騰沸故半夏甘草生薑三瀉心湯治陰邪之未化者也大黃黃連附子二瀉心湯治陰邪之已化者也陰邪已化不逼心陽則在內之沸亂略定惟在外之邪氣尚阻則取二黃之泄熱蕩去其邪邪去正自安矣惡寒汗出者在上之陰邪才化在下之陰氣復逆故輕取二黃之氣以蕩熱除穢重任附子之威以追逐逆陰使之異趨同歸相成而不相背也其未化者陽餒朒於陽位而恣肆於陰分邪盤踞於清道而潰泄於下焦非乾薑半夏生薑之振散陰霾不足以廓清心之外郭非人參黃連之養陰泄熱不足以安擾心之內訌然則直謂之補心可也而曰瀉心何哉夫稱謂當循其實補者益其虛瀉者泄其實今者明因邪氣入伐致心臟內訌若曰補則嫌於無邪矣顧可乎本經所謂腸澼腹痛下利者與此心同蓋腸澼腹痛下利多發於夏秋溼熱之交盛暑之時心氣發舒其驗在汗所謂汗為心液也當此之時或由口食寒膩阻遏其發舒之氣或由乘風取涼使汗不得暢於是火鬱於中陰凝於外因遂生溼溼復生熱寒熱與溼輾轉膠固故後世所製香連薑連等法均仿此意為之傷寒胸中有熱胃中有邪氣腹中痛欲嘔吐者黃連湯主之少陰病二三日以上心中煩不得臥黃連阿膠湯主之二方皆以黃連為君二證皆發於心可見黃連為瀉心火之劑矣成無己曰陰不得升獨治於下為腹中痛陽不得降獨治於上為胸中熱欲嘔吐夫陰之升其體由腎其用由肝陽之降其源由肺其責由心然脾胃為升降之樞脾提腎肝之氣以升胃曳心肺之氣而降故治陰之不升必兼治脾治陽之不降必兼治胃是於黃連湯又可參黃連為心胃之劑嘔吐為胃病故後世治嘔用黃連其效最捷蓋上升皆火之變見人身之火惟欲其降升則為病即所謂諸嘔吐酸諸逆衝上皆屬於火者也尤在涇曰陽經之寒變為熱則歸於氣陰經之寒變為熱則歸於血陽經之熱或有歸於血者惟陰經之熱則必不歸於氣故三陰有熱結證不用調胃承氣小承氣而獨用大承氣諸下利證不已必便膿血是其驗也心中煩不得臥熱證也至二三日以上乃心中煩不得臥則非始即屬熱矣始即屬熱心中煩不得臥者為陰虛陰虛則不得瀉火今至二三日以上始見則為陽盛陽盛則宜瀉火然致此陽盛亦必其陰本虛故阿膠芍藥雞子黃無非救陰之品瀉火則惟恃芩連而芩止一兩連乃四兩此黃連之任獨冠一方無可議矣通二方而觀又可悟黃連一味在黃連湯為溫劑中寒藥在黃連阿膠湯為補劑中瀉藥矣五臟六腑之精氣皆上注於目而為之精精之窠為眼骨之精為瞳子筋之精為黑眼血之精為絡其窠氣之精為白眼肌肉之精為約束裹擷筋骨血氣之精與衇竝為系上屬於腦後出於項中是故瞳子黑眼法於陰白眼赤衇法於陽陰陽合揣而為精明以是知目疾非一經之病黃連所主之目痛必兼眥傷泣出又須識其目痛眥傷泣出必因於熱氣所為乃為的對之劑此何以故如上文所云痛有因於瞳子者黑睛者白眼者則非矣眥傷有因約束裹擷者泣出有因風者寒者虛者皆不得用矣蓋惟傷在胞之內白睛之外始為赤絡之病泣出隨眵始為溼熱相搏熱者傷心赤衇屬心千金外臺諸方用黃連為君者其所敷陳諸病如大棗煎之目熱眥赤生赤衇侵睛洗眼湯之目熱痛汁出乳汁煎之淚出眥赤癢黃連煎之眼赤痛除熱莫不與本經相吻合仍不外清心火除溼熱二者而已古書語簡而意深讀之者慎勿草草如此條所謂婦人陰中腫痛者是也夫陰中腫痛丈夫亦有之何獨於婦人即婦人陰中為病亦不止腫痛一端金匱要略雖無明文千金外臺所臚列者如陰蝕陰疳陰中爛傷陰癢痛陰中有蟲陰下脫陰挺皆不用黃連而獨於腫痛則間用之大抵陰中之疾皆始於小便小便不利則溼壅熱生溼與熱相搏不得泄則腫婦人前陰又為血潮汐之常道於是遂涉血為痛理固然矣黃連非能治腫痛也陰中腫痛須用之者蓋陰中腫痛必由溼熱而燥溼之物多足以助熱清熱之物多足以滋溼惟黃連既能燥溼又能清熱他處腫痛有因風者有因寒者有因火者不必盡由於溼故本經獨標出婦人也雖然丈夫陰中諸疾亦無不由溼熱黃連之治獨標出婦人者何居蓋惟丈夫多不涉及於血即使停溼生熱且涉及於血亦宜通利宜滋清如導赤等方而不宜燥夫甘為溼化苦為燥化故凡味之甘者雖性燥亦能壅氣為溼味之苦者縱如黃連之寒獨不能因燥以激發其火耶是知黃連之治溼治熱須分別觀之溼證之急者可用緩者不可用蓋溼緩者熱不盛熱不盛則惡黃連之氣寒也熱證之緩者可用急者不可用蓋熱證急者溼不盛溼不盛則惡黃連之性燥矣又黃連之治血熱亦宜分別觀之蓋惟氣分之熱涉及血者可用血分自生熱者不可用以血似水而性主流動黃連之寒恐其凝血而其燥又恐涸血也或問黃連入心清熱燥溼子既言之鑿鑿矣獨不思烏梅丸乾薑黃連黃芩人參湯任黃連皆重而所治皆肝病乎曰篇中凡言入某臟某腑者解釋其義如此耳非鑿鑿言之也試觀本經別録止言某藥治某病而不言入某臟某腑解之者不推明某病關係某臟某腑何由知其病之所以然而仲景書亦止以某病屬某經某方主治某病竝不言某方治何臟何腑之病譬如太陽病有惡風惡寒而喘非肺病乎心憒憒心惕惕心中悸非心病乎大義之所在講論之所及原不可一途論也子以烏梅丸乾薑黃連黃芩人參湯病為肝病獨不思厥陰之為病氣上撞心心中疼熱能不關於心乎是二方之君黃連別録蓋已確然言之矣曰黃連主五臟冷熱久下泄澼膿血是也夫冷熱天淵何能久相守而不相入必也君主之火令不行斯冷是冷而熱是熱冷是冷熱是熱斯一身所有津液每日所增水穀悉不化為精純以上騰而紛紛墜纍而下冷多者為泄熱多者為澼澼甚者為膿血冷輕者為痰飲故烏梅丸治久利膿血乾薑黃連黃芩人參湯治寒格吐下白頭翁湯治熱利下重小陷胸湯治飲滯停中無不有藉於黃連其病之輕重高下係於冷熱孰多孰少故或配以附子乾薑桂枝或配以乾薑人參或配以秦皮黃檗或配以栝蔞半夏不全藉黃連是可知黃連之治未必在肝烏梅丸證乾薑黃連黃芩人參湯證未必不係心矣雖然五臟冷熱久下泄澼膿血一語讀之當字字較量觀下利圊穀者與四逆湯下痢便膿血者與桃花湯皆不用黃連又可知泄澼膿血之未久者及久而但關乎五臟之冷不關乎五臟之冷熱相兼者均與黃連不宜矣千金方之論消渴曰凡積久飲酒未有不成消渴大寒凝海而酒不凍明酒性酷熱物無以加脯炙鹽鹹酒客耽嗜不離其口三觴之後制不由己飲噉無度咀嚼酢醬不擇酸鹹積年長夜酣飲不解遂使三焦猛熱五臟乾燥木石猶且焦枯在人何能不渴外臺祕要方述古今録驗方曰消渴病有三一渴而飲水多小便數有脂似麩片甜者消渴也二喫食多不甚渴小便少似有油而數者消中也三渴飲水不能多但腿腫腳先瘦小陰痿弱數小便者腎消也消渴者倍黃連消中者倍栝蔞腎消者加芒硝由千金而言酒是溼熱相兼之物因酒致病必係溼熱為源所以宜用黃連也由外臺而言消渴略相似之病有此三種消中腎消與黃連不宜所以別乎可用黃連之的證也反覆乎此二書則庶幾欲用黃連止消渴者知有別擇矣劉潛江云說者謂黃連能除溼熱即是厚腸胃然黃芩亦除溼熱何以不然蓋黃連性燥故入心而燥即寓味苦氣寒中足陽明胃手陽明大腸皆屬燥金同氣相求是即厚之意也惟黃連苦寒而燥黃芩雖苦寒而不燥矣是以不得以厚腸胃屬之愚謂別録謂黃連調胃厚腸不得混而稱之曰厚腸胃也夫腸胃中皆有脂膜一道包裹其內所以護導滓穢使下行者若有溼熱混於其間則脂膜消鎔隨滓穢而下古人謂之腸澼後人目為刮腸痢亦曰腸垢胃體廣大容垢納污雖有所留亦未必剝及脂膜故但和其中之所有邊際自不受傷故曰調腸勢曲折盤旋惟其曲折盤旋之處更為溼氣留聚溼阻熱益生熱阻脂膜益消去其所阻則消爍之源絶而薄者厚矣故曰厚凡人所食之物不論青黑白赤至胃悉變而黃不得謂不象黃連之色又人之臟腑有獨治一處者有兩相連屬者從無似大腸之於小腸小腸之於胃胃之於咽嗌三腑相通徹上徹下連屬無隔如此者不得謂不像黃連之形是黃連之調胃厚腸原廣有意義不必隘之以同氣相求一語也惟苦寒而燥一語實足貫徹黃連功能如膽中清之腑為溼熱所擾則其中不清故曰益膽水溼流關節而生熱則骨骱不利故曰除水利骨是在用之者意會焉可已黃芪十月種子如種菜法獨莖而生枝幹去地二三尺葉扶疏似槐葉而微尖小又似蒺藜葉而稍闊大青白色開黃紫花大如桃花結小尖角長寸許根長二三尺柔韌如綿皮褐色內層白中心黃緊實如箭簳者良參圖經綱目黃芪根莖皆旁無歧互獨上獨下其根中央黃次層白外層褐顯然三層界畫分明又其味甘其氣微溫直入中土而行三焦故能內補中氣則本經所謂補虛別録所謂補丈夫虛損五癆羸瘦益氣也能中行營氣則本經所謂主癰疽久敗瘡排膿止痛大風癩疾別録所謂逐五臟間惡血也能下行衛氣則本經所謂五痔鼠瘻別録所謂婦人子臟風邪氣腹痛泄利也癰疽篇寒邪客於經絡之中則血泣不通衛氣歸之不得復反故癰腫寒氣化為熱熱勝則肉腐為膿素問風論風氣與太陽俱入行諸衇俞散於分肉與衛氣相干其道不利故使肌肉憤䐜有瘍衛氣有所凝故肉有不仁營氣熱胕不清故使鼻柱壞而色敗名曰癘風生氣通天論營氣不從逆於肉理乃生癰腫歷歷明徵莫非營衛之病而營衛所以屬三焦三焦所以屬中土者靈樞營衛生會篇上焦出於胃上口貫膈竝咽布胸中以發呼吸而行營衛是為中氣中焦亦竝胃中出上焦之後此所受氣泌糟粕蒸津液上注於肺乃化為血是為營氣下焦別回腸濟泌別汁注於膀胱是為衛氣三者皆本於水穀是三焦為營衛之本脾胃之蒸腐變化又為三焦之本黃芪一源三派濬三焦之根利營衛之氣故凡營衛間阻滯無不盡通所謂源清流自潔者也黃芪別録云利陰氣者何謂也不識即前之行營氣歟抑即逐五臟間惡血歟行營氣逐惡血固亦是利陰氣而利陰氣決非僅行營氣逐惡血也素問生氣通天論陰者藏精而起亟也陽者衛外而為固也陰不勝陽則衇流薄疾竝乃狂陽不勝陰則五臟氣爭九竅不通亟數也精藏於陰雖湛然常靜然為命火所溫養氣遂蒸變而出是氣亟起即陽之衛外為固者也故曰衛出下焦而衛陽之升實本於濁陰之降黃芪送蒸腐之水穀使歸下焦即還反生衛與竝出於上下行迅則起亟自迅起亟迅則內外安和是故陰不勝陽者非黃芪所能為力陽不勝陰則陽不上而五臟氣爭陰不下而九竅不通蓋陰之降實本於脾胃之陽旺故總論以黃芪一味治小便不通耳李東垣云內傷者上焦陽氣下陷為虛熱非黃芪不可劉潛江云治虛損膀胱有熱尿血不止者於蒲黃丸中用黃芪固下焦之衛然後地黃麥冬始得合而奏清熱之功亦藉其升陽以達表而水府之熱乃以投清寒而除是可明於陽氣下陷之義蓋陽不得正其治於上斯陰不能順其化於下旨哉言矣仲景傷寒論絶不用黃芪即如汗出陽亡似與黃芪之強衛固表相宜亦終不及何也蓋陽加於陰謂之汗其係衛陽盛蒸逼營陰陰氣泄為汗者用黃芪則既能使營陰充不受陽蒸逼又能使衛陽不蒸逼營陰可矣若傷寒汗多陽亡則係陰氣逼陽外泄必以附子振其陽陰霾始散汗乃得止與黃芪之止汗適相反也然亦有兼兩義如芪附湯者則又別有故焉夫陽被迫欲亡虛固不待言矣陰離位而迫陽亦非循常度者也不得謂之充裕但傷寒則有外感陰邪相雜雜病則無挾陰邪者自宜外振威武內清奸宄故四逆湯若用黃芪謂之閉門逐賊無陰邪者乃陽先越而陰繼之故芪附湯若用乾薑是救焚潑膏也故其用黃芪非特藉以固外實恃以和陰使不迫於陽仲景治傷寒不用黃芪義實在此其後人止汗諸方如當歸六黃湯黃芪建中湯玉屏風散亦莫不倣此為法特陰陽屈伸之理既別佐使自不同耳愚嘗謂溼飲水三者相似而實不同故金匱要略分為三篇蓋溼者瀰漫霧露之氣也飲者貯於器中者也水者洋溢四射者也是故水飲有質而溼無質然有質者由生而化無質者由化而生化者化之生者發之其治固有別矣然溼病篇云風溼衇浮身重汗出惡風者防己黃芪湯主之水氣篇云風水衇浮身重汗出惡風者防己黃芪湯主之水與溼不侔防己黃芪湯之治不異其義何居夫風激水而齧土溼從風而頽土為病者不同受病者無以異防己黃芪湯白朮守中黃芪行外防己除病甘草調劑其分數調劑居二守中居三除病居四行外居五所以然者土主人身之肌肉屬脾黃芪與白朮皆脾藥也用芪以自本而行標用朮因在標而防本病正在標自宜治標者三治本者二然但知守而不知戰則病何由去此驅病之防己所以介乎其中矣要之風溼風水之為病動病也朮靜而芪動故芪任重朮任輕防己黃芪之為劑汗劑也黃芪能行而不能發故芪之任非特重於朮且更以薑棗佐之蓋防己驅逐水溼水溼勢必下行下行過急仍恐土齧且頽病既在表不如發之使近從表出為愈也風溼風水衇浮身重汗出惡風者防己黃芪湯主之皮水四支腫水氣在皮膚中四支聶聶動者防己茯苓湯主之以是知黃芪非止汗者特能行營衛中氣營衛中氣行邪氣遂無以干則汗自止耳何以言之夫水氣在皮膚中則從汗出為便今去薑棗與朮加桂枝茯苓則不欲其解於汗欲其解於小便矣本不汗出且欲水氣從小便解而仍用黃芪尚以黃芪為止汗耶雖然兩方雖皆用黃芪其旨終不同也防己黃芪湯證病本向外則乘勢壯營衛之氣使水溼從標而解是用以厚表氣故分數甲於一方防己茯苓湯證病不向外則通其水道從本而解是用以利陰氣故分數退居茯苓下與桂枝竝防己黃芪湯中焦之劑防己茯苓湯下焦之劑從本從標猶只在太陽膀胱此異而同者也或言四支屬脾肌肉亦屬脾四支聶聶動與身重病皆本於脾治法乃從太陽何也夫太陽秉寒水之氣水者剋土故病見於脾非脾自病也脾自病則防己黃芪湯應朮多於芪防己茯苓湯不應去朮矣兩方視芪重而朮輕以芪行脾之標朮崇脾之本是以知風水皮水乃脾之標病非脾之本病也黃芪非能降也亦非能升也營衛者水穀之氣三焦受氣於水穀四支稟氣於三焦營衛微則三焦無氣四屬失養由是精微不化於上陰濁獨注於下金匱云營氣不通衛不獨行營衛俱微三焦無所御四屬斷絶身體羸瘦獨足腫大黃汗出脛冷假令發熱便為歷節若不發熱腰以上汗出下無汗腰臗弛痛如有物在皮中狀身疼重小便不利此為黃汗歷節烏頭湯主之黃汗桂枝加黃芪湯主之兩者病皆在下竝治以黃芪則似黃芪能降乃其汗出竝在上體又似黃芪能升殊不知黃芪專通營衛二氣升而降降而復升一日一夜五十周於身升即降之源降即升之根凡病營衛不通上下兩截者惟此能使不滯於一偏此即非升非降之謂也黃芪非止汗也亦非發汗也止汗如所謂營衛和汗自止是矣發汗如諸黃家但利其小便假令衇浮當以汗解宜桂枝加黃芪湯夫衇浮為病在營衛既以桂枝湯和營衛矣又加黃芪者何蓋桂枝能逐營衛中邪不能益營衛中氣能通營衛之流不能濬營衛之源病暫者治其流則已病緩者必追其源是故發汗仍有桂枝湯在其用黃芪非助發汗也防己茯苓湯證曰水氣在皮膚中桂枝加黃芪湯證曰如有物在皮中狀是皮膚中病黃芪皆治之矣陽明病反無汗其身如蟲行皮中狀何以不用按此當辨其病根何在皮水黃汗病本在外脾胃中氣無所堵塞若陽明病係胃家實是內實外虛彼用黃芪是治內虛外實與此適相反不可用也上品草六味木六味香蒲春初生淺水中出水時紅白色茸茸然名曰蒻葉似莞而褊有脊而柔至夏抽梗於藂葉中花抱梗端如武士棒杵俗謂之蒲槌亦曰蒲萼蒲黃即花中蕊屑也細若金粉當欲開時便取之圖經參綱目凡生水中之物皆以水為父而聽其消漲以為榮枯矧蒲黃又生於四五月大火得令時能吸火氣以媾於水而成中五之色者是能合水火之精以成土者也人身惟水火不諧方小便不利而為心腹膀胱寒熱蒲黃象土本可防水又生於水用之使調和水火寒熱於以解小便遂自利柔化之功可反速於剛制也若夫熱傍水勢而迫血妄行熱阻水行而停血成瘀則亦行者能止瘀者能消而均可無慮其梗而難制矣金匱要略用蒲灰散利小便治厥而皮水解者或以為香蒲或以為蒲席燒灰香蒲但能清上熱不云能利水敗蒲席別録主筋溢惡瘡亦非利水之物蒲黃本經主利小便且本事方芝隱方描述其治舌脹神驗豫亦曾治多人黍銖無爽不正有合治水之腫於皮乎夫皮水為膚腠間病不應有厥厥者下焦病也膀胱與腎為表裏膀胱以水氣歸皮致小便不利氣阻而成寒熱則腎亦承其弊為之陰壅而陽不得達遂成厥焉病本在外非可用溫又屬皮水無從發散計惟解心腹膀胱之寒熱使小便得利又何厥逆之有以是知其為蒲黃無疑也曰蒲灰者蒲黃之質固有似於灰也趙以德金匱衍義亦云五味子春初生苗引赤蔓於高木其長六七尺葉光圓似杏葉三四月開黃白花類蓮花狀七月成實莖端作房如落葵子大如櫻子生青熟紅紫中有核似豬腎以根種者當年即旺若二月種子須次年乃旺參唐本圖經綱目劉潛江云五味之皮肉初酸後甘甘少酸多其核先辛後苦辛少苦多然俱帶鹹味大約五味咸具之中酸為勝苦次之而生苗於春開花於春夏之交結實於秋是發於木盛於火告成於金也氣告成於金酸味乃勝是肺媾於肝也肺媾於肝肝因媾肺而至脾脾仍合肺以歸腎是具足三陰之氣收之以降陰亦隨之矣氣依味至腎腎非納氣者歟此本經主治所以首益氣即繼以咳逆上氣也第所云勞傷補不足強陰益精者何蓋腎者主受五臟六腑之精而藏之肺亦統五臟六腑之氣而主之腎氣原上際於肺肺氣亦下歸於腎蓋以一氣自為升降者也若六淫七情有以耗散之致肺失其降而不歸不歸則元氣遂耗散以日虛歸腎則真氣還其本源以日益五味子能收諸氣入腎入腎即為五臟六腑之精腎受而藏之矣陰陽應象大論曰氣歸精精化為氣又曰精食氣氣生形是非氣盛則精盈之驗乎或曰五味子治咳何以舉寒熱皆得用之曰陽中之陰氣以能降為主在熱者陽邪傷乎陰寒者陰邪傷乎陽原亦病乎陰故涼其陽邪而收陰五味子之用固最宜矣散其陽邪以暢陽能不寓收陰之義於其間耶以肺固陽中有陰其職同天氣且司降者也王宇泰曰人知調氣調其陽而已惡知五運所主之病機本一氣變動而分陰陽者也臟腑之氣何獨不然故凡治肺氣之病如嗽如喘須先識陽中陰降之本更審病機之所生其為外淫為內傷或由陽而傷陰或由陰而傷陽適其所因以為治如陽邪傷陰此固的治矣然陽邪方熾而遽收不畏錮其邪乎陰邪傷陽者此固不宜矣然陰邪已除乃陽氣因解散而虛不當寓收陰於益陽中使陽有所依乎是五味子之用在識其機審其勢當其時又何寒熱之當分矣問傷寒論中凡遇咳總加五味子乾薑豈不嫌其表裏無別耶曰經云脾氣散精上歸於肺是故咳雖肺病其源實主於脾惟脾家所散上歸之精不清則肺家通調水道之令不肅後人治咳但知潤肺消痰殊不知潤肺則肺愈不清消痰則僅能治脾於留肺者究無益也乾薑溫脾肺是治咳之來路來路清則咳之源絶矣五味使肺氣下歸於腎是開咳之去路去路清則氣肅降矣合兩物而言則為一開一闔當開而闔是為關門逐賊當闔而開則恐津液消亡故小青龍湯小茈胡湯真武湯四逆散之兼咳者皆用之不嫌其表裏無別也五味子所治之證傷寒僅言咳逆金匱要略則兼言上氣如射干麻黃湯之咳而上氣喉中水雞聲小青龍加石膏湯之肺脹咳逆上氣煩躁而喘也夫傷寒有傷寒之關鍵無論其為太陽少陽少陰凡咳者均可加入五味子乾薑雜證自有雜證之體裁即咳而衇浮厚朴麻黃湯主之一語已通概全書大旨試觀金匱要略中有衇沉而用五味子者否蓋五味子原只能收陽中之陰氣餘則皆非所宜故收陰中之陽氣者必以附子乾薑收陰氣者必以地黃阿膠收陽中之陽氣者必以龍骨牡蠣傷寒為陽病則傷陽中之陰氣為最易故不必審其衇之為浮為沉如真武湯病之衇必沉無疑也雜證者或起於陽或發於陰則五味子之用須審衇浮斷斷不容孟浪蓋雜證之起於陽者多灼陰起於陰者多消陽灼陰而更以五味收其陰則陰遂竭消陽之陰更以五味收之是誠認賊作子矣故射干麻黃湯厚朴麻黃湯桂苓五味甘草湯諸證皆為上焦陽病皆有停飲則當執衇浮不渴為據而後五味可用其義見於桂苓五味甘草加乾薑細辛湯下曰細辛乾薑為熱藥服之當遂渴渴反止者為支飲也此則與服小青龍湯已渴者為寒去欲解服小茈胡湯已渴者為屬陽明同條共貫無傷寒雜證之分也已要之小青龍湯證未必不上氣厚朴麻黃湯證原不言上氣故上氣不上氣不足為用五味扼要惟衇浮不渴乃其眼目所在耳或曰子言咳逆上氣而不渴為用五味子的據頗似近理特千金方治消渴偏有用五味子者其說遂不可通矣曰千金方論消渴其源有四一曰渴利後人謂之上消二曰內消後人謂之中消三曰強中四曰消渴此二種後人謂之下消五味子之用在強中者一方曰治腎氣不足消渴小便多腰痛增損腎瀝湯在消渴者二方曰治虛勞渴無不效骨填煎曰治虛熱四肢羸乏渴熱不止消渴補虛茯神散渴利內消者絶不用及亦可以知與治咳逆之在上者風馬牛不相及矣夫咳逆在上當防其有邪有火若在下之火正欲其引上焦陽中之陰以相濟奈何與在上者視同一例耶閲本經五味子主治而後知古今之治病大相懸絶也古人治病每於實病中求虛虛病中求實實病中求虛如傷寒論所載是也病機錯雜邪氣方盛之時才見一種虛象便即人參白朮阿膠地黃放膽用之虛病中求實如金匱要略所載是也五勞虛極羸瘦乃主以大黃䗪蟲丸且美其稱曰緩中補虛今人治病則不然見實治實見虛治虛自以為得之矣而補之瀉之卒不能稱吾意之所出此無他未能確切研究於農軒仲景耳孫真人極深研幾於農軒仲景者也今以千金方核之與本經仲景其符合乃爾何也蓋五味子之治咳逆上氣治咳逆上氣之當益氣者也其治勞傷羸瘦治勞傷羸瘦之當補不足者也故其所列諸方如治上氣咳逆方以蘇子麻黃細辛生薑半夏諸溫散之物恐其不僅散陽中之邪驅陽中之飲竝傷陽中之陰用五味子以保之矣治氣上不得臥神祕方雜五味子於橘皮生薑紫蘇中其命意亦同安食下氣理胸脅竝治客熱人參湯則人參黃芪甘草大棗以益氣當歸芍藥以和血溫者如乾薑桂心半夏涼者如麥虋冬利者如茯苓下者如枳實誠恐其補不勝泄涼不勝溫故用五味子於中使泄不傷正溫不劫津則補自得力耳此不與葶藶大棗瀉肺湯之上氣者異耶至補下劑中有治男子風虛勞損兼肺氣方之用五味子溫補劑中有治內勞少氣寒疝裏急腹中喘逆腰脊痛填骨萬金煎之用五味子潤補藥中有通治百病虛瘠羸乏牛髓丸之用五味子鎮攝劑中有補養肺氣白石英丸之用五味子其他如治男子五勞七傷之人參湯治男子五勞六極之內補散治虛勞百病之腎瀝散又有治男子五勞七傷八風十二痹方補丈夫一切病不能具述薯蕷散治五勞六極七傷虛損治諸虛勞百損無比薯蕷丸治男子女人虛損勞絶頭目眩骨節煩疼飲食減少羸瘦百病大薯蕷丸者指不勝屈莫不各有五味子可見於大黃䗪蟲丸之虛勞者異矣引而伸之觸類而長之其廣大乃爾宜本經可以兩言概之也強陰昔之人多作益陰解惟陳修園謂能治陰痿最是益男子精張隱庵謂女子不足於血男子不足於精故益男子精最非是夫不曰益陰氣而曰強陰則為強宗筋無疑若謂男子之精猶女子之血則未聞女子血有特益之物或曰然則女子之精與男子何以異古人雖未及此泰西家則言之矣其略曰質具之德西人稱精曰質具有二絡由周身大血絡吸取歸腎及睪丸女人與男子無異特女子睪丸在腹內則距腎之道近故其絡短男子睪丸垂腹下則距腎遠故其絡長質具者非吸引血絡之時即既成而藏之也蓋吸取歸腎以後所行之絡皺而曲折以鍊成絡短則益皺而曲折加甚故質具易於備辦其自睪丸以上以及於陰則為激發之絡攜帶質具至於陰為傳生之用女人之陰縮於內其形圓大中空男子之陰出於上其道擠緊狹窄故激發之絡益有短長猛怯之殊質具之體遂有溫暖緩燥之異此其言未經先哲道無可質其是非第以本經五味子主強陰益男子精明其無與於女人而言則亦有可通者蓋五味子之鹹貫於酸苦甘辛之中則為自上而下由肺歸腎無疑者既以其皮肉之甘酸鹹為斂五臟之氣歸腎其核遂以苦發之以辛竄之甚有當於激發之義其僅能強陰益男子精無與於婦人以婦人無取乎苦辛激發也世所常用壓取酒醴豉汁者曰榨潑水救火曰龍榨以長圓木桶於端鑿一孔嵌竹管承之以囊盛其糟粕置桶中施蓋於上取可入桶為度以巨木杠垂石壓蓋而擠之則清汁自竹管出囊僅存其滓矣龍亦用長圓木桶鎔鑞為腸置於其中其腸為鑞筒二低於桶口者三之一下承以鑞管自桶底彎環而上垂及桶口遂彙為一別以鑞管螺旋而鑲接焉漸上漸窄高倍於桶而止其用之也亦以巨木杠長三倍於桶者中懸兩杵正如鑞筒之分杵端纏以布才及鑞筒之口而稍殺滿水於桶旋淺旋增杠之兩端數十人持之將杠一提則鑞筒水滿隨即一抑則杵入筒水由彎環激出於上隨提隨抑則水下灑如驟雨且加甚焉其水之上潑高者可及五丈巖牆薄壁才遇即傾由是觀之質具之體其始固同待至擠緊激發之處所經之途既殊則其性有不能不異者故千金雜補方皆益腎者方凡三十首用五味者十六方其男子女人竝提者無一焉則西人之言或亦能得其情矣千金用五味子之最難解者無如吐血門之治噫止唾血方膀胱虛實門之治膀胱虛冷不欲飲食面黑如炭腰脅疼痛方水腫門之治虛滿通身腫利三焦通水道豬苓散然亦可紬繹而得其旨者也夫胃虛客氣上逆則為噫噫非重病也且既止何復唾血耶可見其不當止而止矣夫非重病又止後復唾血則噫已除惟唾血現在不必以噫止冠於唾血之上矣窺其所用方蓋方胃虛客氣上逆之時適值肺家下降之力正雄強壓客氣使不得上上下相爭則非特傷氣兼且傷血矣治噫止唾血方即厚朴麻黃湯去細辛以生薑易乾薑也彼治衇浮咳逆是肺脹而氣上湧今治噫止吐血是肺脹而氣下墜上湧故益細辛使之透達無餘下墜故以生薑易乾薑欲其橫散不欲其守中又治噫止唾血方中有一越婢半夏湯僅少大棗甘草二味越婢半夏湯治肺脹之劑也是以知其病由肺脹而起矣黑水色也黑而至於面其勢既不亞過顙在山況如炭又黑之至其尚能欲飲食耶雖然面黑如炭不欲飲食何以知其為膀胱虛冷則以腰脅疼痛故夫腰者腎之都膀胱者腎之府腎與膀胱蓋所謂陰陽表裏上下雌雄相輸應者也焉有膀胱病若此腎之都會不震驚戰惕哉然腎固屬水何以面黑如炭腰脅疼痛尚非腎病而為膀胱病夫亦以陰主形陽主氣假使腎家水氣泛濫若是則必遍身浮腫四肢厥逆矣又何能僅僅不欲飲食腰脅疼痛今僅僅不欲飲食腰脅疼痛是以知為膀胱虛冷水氣騰湧耳治形者應以實實則宜溫宜通治氣者應以虛虛則導之使歸而已磁石白石英是導肺家水氣歸白朮茯苓是導脾家水氣歸然歸而氣無所行又必變生別故故以黃芪使由下焦入衛遍行於一身猶恐其既歸隨小便而盡泄也故以五味子杜仲監之使當行者行當留者留是則病機治法全以氣為用學者可以觸無窮之悟三焦者決瀆之官水道出焉屬膀胱是孤之府也故三焦為病多緣膀胱膀胱不利為癃不約為遺溺虛滿通身腫膀胱不利之咎也故利膀胱必利三焦赤小豆豬苓澤藛利三焦之藥也葶藶大𦻝狼毒通三焦之藥也桂心乾薑椒目溫三焦之藥也人參甘草和三焦之藥也防風女麴元參解利三焦之藥也然有利有通有溫有和有解利遂使三焦之氣往而不返乎故必有以攝之而後不當往者能返也是故五味子攝上焦之藥也白朮攝中焦之藥也蓯蓉攝下焦之藥也統三者觀之以治氣法治血之用五味子恐氣耗而血益無所依也恐收氣者耗氣之用五味子欲其復出於所當行之路也欲於瀉陰中收陰之用五味子懼其傾盡底裏邪盡而元氣亦隨之盡也三方皆用五味子而五味子皆非君藥然益可見五味子監制成方之妙矣蛇牀三月於下溼地生苗高二三尺葉青碎作叢似蒿枝每枝上有花頭百餘結同一顆如碎米攢簇似馬芹類四五月乃開花白色似繖子狀子兩片合成黃褐色有細稜如黍米至輕虛圖經參綱目盧子繇曰蛇粟蛇米蛇牀者以蛇虺喜臥於其下且喜食之也蛇性竄疾獨居隱僻稟風木善行數變之體用與蛇牀功用靡不吻合設非氣性相似詎得為其所嗜耶男子陰痿溼癢婦人陰中腫痛正厥陰隱僻之地氣閉不通所致蛇牀宣大風力鼓舞生陽則前陰疏泄竄疾自如竝可伸癲癇之氣逆於臟與關節之壅閉不開真堪作把握陰陽之良劑也徐洄溪曰蛇牀生陰溼卑下之地而芬芳燥烈不受陰溼之氣故入於人身亦能於下焦溼氣所歸之處逐邪而補正也六氣惟溼最蹇滯惟風最迅疾蛇牀子生陰溼地而得芬芳燥烈之性味是為於溼中鍾風化能於溼中行風化則向所謂溼者已隨風氣鼓蕩而化津化液矣男子之陰痿溼癢婦人之陰中腫痛何能不已耶至於肌肉中溼化而痹氣除骨骱中溼化而關節利膚腠中溼化而惡瘡已皆一以貫之無事更求他義也惟治癲癇一節則似正病乎風而更助以風藥者殊不知風因痰生人因風病若變因痰而生之風如溼中所鍾風化能鼓蕩溼氣化津化液則此痰此風早將變為氤氳流行之生氣尚何癲癇之足虞以是知化病氣為生氣原非臆說也茵蔯二月因舊苗而生其莖如艾葉如淡色青蒿而背白葉歧緊細而扁整九月開細花黃色結實大如艾子綱目風溼寒熱邪氣新感者也熱素有者也新感之邪為素有之熱結成黃疸此證已所謂因陳矣故傷寒金匱二書幾若無疸不茵蔯者然梔子檗皮湯證有外熱而無裏熱麻黃連軺赤小豆湯證有裏熱而無外熱小建中湯證小便自利小茈胡湯證腹痛而嘔小半夏湯證小便色不變而噦桂枝加黃芪湯證衇浮梔子大黃湯證心中懊憹消石礬石散證額上黑日晡發熱則內外有熱但頭汗出齊頸而還腹滿小便不利口渴為茵蔯蒿湯證矣第腹滿之治在大黃內熱之治在梔子惟外復有熱但頭汗出小便不利始為茵蔯的治其所以能治此者豈不為新葉因陳幹而生清芬可以解鬱熱苦寒可以泄停溼耶蓋陳幹本能降熱利水復加以葉之如絲如縷挺然於暑溼蒸逼之時先草木而生後草木而雕不必能發散而清芳揚溢氣暢不斂則新感者遂不得不解自是汗出不止於頭矣故曰發熱汗出此為熱越不能發黃也王不留行多生麥地中苗高一二尺三四月開小花如鐸鈴狀紅白色結實如燈籠草子殼有五稜殼內包一實大如豆實內細子大如菘子生白熟黑圓如細珠綱目王不留行多生麥地且其成實適與麥熟同時故每雜於麥中凡麥中有此則麵不能純白故須檢去之檢之之法墊漆几令欹側傾麥其上以手撫之則紛紛自下以其形渾圓也凡物之渾圓者皆轉旋極速而不滯王不留行名義大率亦不外此人身周流無滯者血也觀本經別録取治金瘡血出鼻衄仍治婦人難産可見其能使諸血不旁流逆出其當順流而下者又能使之無所留滯內而隧道外而經衇無不如之則癰疽惡瘡瘻乳皆緣血已順流自然輕則解散重則分消矣血流於衇風阻之為風痹內塞血不流暢血中之氣內薄為心煩能治之者亦總由血分通順故竝克取效也仲景用治金瘡義蓋本此後人仿此義用之治淋亦大有見解升麻春生苗高三尺以來葉似麻黃葉竝青色四五月著花似粟穗白色六月以後結實黑色根如蒿根多鬚外紫黑內白緊實者佳圖經綱目中惡腹痛毒之在下者也時氣毒癘頭痛寒熱風腫諸毒毒之在中者也喉痛口瘡毒之在上者也升麻所以能解如許多毒者蓋以其根內白外黑莖葉皆青復花白實黑是為金貫水中水從木升仍發越金氣以歸功於暢水也水者何嚴厲之寒氣也金者何收肅之熱氣也以嚴厲之寒包收肅之熱陽欲達而被陰束是所以為毒也使隨木升而暢發焉即所謂解毒矣觀所臚諸證雖得之不同其源為病不一其狀歸結其旨均熱收於中寒束於外在外者固是病在內者亦未始非病譬如傷寒中風雖亦係外寒內熱然惟外寒是病內熱乃身中陽氣故時氣及頭痛寒熱皆與傷寒中風相近而治此不治彼則可以知之矣本經桂有兩種有牡桂有箘桂諸家論之紛如愚謂皆有所未確蓋古人采藥必以其地必按其時決不以非法之物施用乃後世專嘐嘐於此不知古人每以形似名物按菌大竹也桂之本根去心而留皮者象之今所謂肉桂是也牡對牝而言門之軸所藉以闢闔者曰門牡箘桂去心而卷似牝則桂之尖但去粗皮而不去心者象牡矣今所謂桂枝是也仲景書用桂而不云枝者二處一桂枝加桂湯一理中丸去朮加桂一主臍下悸一主臍下築皆在下之病東垣曰氣之薄者桂枝也氣之厚者桂肉也氣薄則發泄桂枝上行而發表氣厚則發熱桂肉下行而補腎此天地親上親下之道也劉潛江曰親下者趨陰也以消陰翳而發陽光親上者歸陽也以達陽壅而行陰化又曰氣之厚者親下即走裏而入陰分凡在裏之陰滯而陽不足者皆可治也氣之薄者親上即走表而入陽分凡在表之陽壅而陰不和者皆可治也則桂枝桂肉之用豈不彰明較著哉凡藥須究其體用桂枝色赤條理縱橫宛如經衇系絡色赤屬心縱橫通衇絡故能利關節溫經通衇此其體也素問陰陽應象大論曰味厚則泄氣厚則發熱辛以散結甘可補虛故能調和腠理下氣散逆止痛除煩此其用也蓋其用之之道有六曰和營曰通陽曰利水曰下氣曰行瘀曰補中其功之最大施之最廣無如桂枝湯則和營其首功也夫風傷於外壅遏衛氣衛中之陽與奔迸相逐不得不就近曳營氣為助是以營氣弱衛氣強當此之時又安能不調和營氣使散陽氣之鬱遏通邪氣之相迸耶桂枝湯桂枝麻黃各半湯桂枝二麻黃一湯桂枝二越婢一湯桂枝加葛根湯桂枝加厚朴杏仁湯桂枝加附子湯桂枝去芍藥湯桂枝去芍藥加附子湯葛根湯葛根加半夏湯麻黃湯大青龍湯小青龍湯桂枝新加湯茈胡桂枝湯茈胡桂枝乾薑湯桂枝人參湯桂枝附子湯甘草附子湯桂枝加芍藥湯當歸四逆湯當歸四逆加吳茱萸生薑湯半夏散及湯瓜蔞桂枝湯麻黃加朮湯侯氏黑散風引湯古今録驗續命湯白虎加桂湯黃芪桂枝五物湯桂枝加龍骨牡蠣湯薯蕷丸小青龍加石膏湯千金桂枝去芍藥加皂莢湯厚朴七物湯黃芪芍藥桂酒湯桂枝加黃芪湯外臺黃芩湯竹葉湯小茈胡去人參加桂湯心為衆陽之主體陰用陽其陽之依陰如魚之附水寒則深藏隱伏暖則踔躍飛騰古人謂有介類伍之乃不飛越故凡有風寒汗之下之火之或不得法則為悸為煩為叉手冒心為起臥不安於是以桂枝引其歸路而率龍骨牡蠣介屬潛之也桂枝甘草湯茈胡加龍骨牡蠣湯桂枝去芍藥加蜀漆龍骨牡蠣救逆湯桂枝甘草龍骨牡蠣湯炙甘草湯防己地黃湯桂枝芍藥知母湯四逆散水者火之對水不行由於火不化是故飲入於胃由脾肺升而降於三焦膀胱不升者心之火用不宣也不降者三焦膀胱之火用不宣也桂枝能於陰中宣陽故水道不利為變非一或當滲利或當泄利或當燥溼或當決塞惟決塞者不用桂枝餘則多藉其宣化有汗出則病愈者有小便利則病愈者皆桂枝導引之功也茯苓桂枝甘草大棗湯茯苓桂枝白朮甘草湯五苓散茯苓甘草湯木防己湯木防己去石膏加茯苓芒消湯防己茯苓湯茵蔯五苓散茯苓澤藛湯桂枝湯去桂加茯苓白朮湯桂枝加桂湯理中丸若夫赤能入血辛能散結氣分之結散則當降者自降桃核承氣湯烏梅丸澤漆湯桂枝生薑枳實湯烏頭桂枝湯桂苓五味甘草湯蜘蛛散竹皮大丸枳實薤白桂枝湯四逆散防己黃芪湯桂苓五味甘草去桂加乾薑細辛湯血分之結散則當行者自行皆自然而然非可勉強者鱉甲煎丸桂枝茯苓丸溫經湯土瓜根散至補中一節尤屬義精妙而功廣博蓋凡中氣之虛有自餒而成者有為他藏剋制而成者自餒者參朮芪草所主非桂枝可施惟土為木困因氣弱而血滯因血滯而氣愈弱者必通血而氣始調氣既調而漸能旺小建中湯黃連湯黃芪建中湯桂甘薑棗麻辛附子湯千金內補當歸建中湯此其所由又非直一補氣可概也愚謂窺古人用藥之意於加減間尤其親切今計兩書中除桂枝加桂湯理中丸已具論外其餘小茈胡以不渴外有微熱加四逆散以悸加防己黃芪湯以上氣加其和營通陽下氣之功已顯然無可疑矣若夫服桂枝湯或下之仍頭項強翕翕發熱無汗心下滿微痛小便不利者桂枝湯去桂加茯苓白朮湯主之服桂苓五味甘草湯後衝氣低反更咳胸滿者桂苓五味甘草湯去桂加細辛乾薑以治其咳滿二條前一條表證明明未罷而去之後一條衝氣僅低亦去之頗為費解殊不知甘能增滿則兩條皆有胸滿也且病之互相牽屬者必并力解其一面則所留一面自無所依不能為大患如前條之表邪也水飲也是水飲為表邪之根故去其飲邪遂無所容後條之上氣也支飲也是上氣由支飲而發故但溫宣其飲上氣可不論矣可見治病用藥貴乎審其前後緩急經服何劑不得執一藥之氣味功能而遂用之若二病者非忌桂枝實用桂枝後權其不得更用故不用也或問桂枝與白虎寒熱天淵安可兼用且論中諄諄以表不解禁用白虎既可兼用則何不加此而必待表解耶曰表不解不可與白虎條上文言衇浮發熱無汗乃麻黃證非特不得用白虎且不得用桂枝矣白虎證者衇大也汗出也煩渴欲飲水也三者不兼即非是今云其衇即平身無寒但熱時嘔皆非白虎證亦未必可用桂枝特既與白虎則三者必具再加骨節疼煩之表則無寒不得用茈胡有汗不得用麻黃熱證多又不得用附子不用桂枝和營通絡而誰用哉且古人於病有分部非如後世多以陰陽五行生剋為言傷寒有傷寒用藥之例溫瘧有溫瘧用藥之例蓋傷寒自表入裏故有一毫未入則有一毫未化之寒即不可與全入者竝論溫瘧自內出外裏既全熱但有骨節疼煩一種表證即不得全認為熱而單用白虎則兼用桂枝使之盡化又何不可耶是白虎加桂枝湯之用桂枝不過和營竝無甚深妙義也水氣不化之因甚多利水之物亦甚多當審其何因觀其所用何藥而後藥之功能可見也統觀兩書中凡豬苓湯茵蔯蒿湯梔子檗皮湯真武湯澤藛湯己椒藶黃丸小半夏加茯苓湯十棗湯栝蔞瞿麥丸蒲灰散滑石白魚散茯苓戎鹽湯葵子茯苓湯大黃甘遂湯等方莫不利水皆不用桂枝則或由熱阻或由血阻故也桂枝之利水乃水為寒結而不化故用以化之使率利水之劑以下降耳是故水氣不行用桂枝者多兼表證如五苓散茯苓甘草湯等是也及悸桂枝加桂湯茯苓桂枝甘草大棗湯等是也上氣苓桂朮甘湯木防己湯等是也振振苓桂朮甘湯防己茯苓湯等是也等候不如是概不足與也以是知用桂枝者仍用其和營通陽下氣非用其利水也攻瘀之方不皆用桂枝淺言之則云瘀因寒阻則用因熱阻則不用殊不知有不然者觀傷寒攻瘀僅三方除抵當湯抵當丸品味相同外其一則桃仁承氣湯也桃仁承氣湯證諄諄以表證未罷為不可用抵當湯反有表證仍在之文則可知因寒而用為不然矣夫抵當湯丸似峻而實不峻桃仁承氣似不峻而實峻何者水蛭虻蟲究為血肉之品較之芒消桂枝反有去邪不傷正之能故金匱要略諸方凡瘀血之涉於虛者皆不用桂枝如大黃䗪蟲丸下瘀血湯可驗也其桂枝茯苓丸之有癥溫經湯之因瘀生熱皆非虛證蓋惟有餘故能成形且生火也桃仁承氣證云血自下下者愈桂枝茯苓丸證云妊娠血不止者癥不去也土瓜根散證云少腹滿痛經一月再見以此知非特血盛乃能結惟其血盛乃能既結而仍行此桂枝專破血雖行而結自若者也或問酒客不喜甘故不可與桂枝湯得湯則嘔則嘔吐者不可用桂枝湯矣又凡服桂枝湯吐者其後必吐膿血也又嘔家不可用建中湯乃五苓散證烏梅丸證桂枝芍藥知母湯證茯苓澤藛湯證皆有嘔吐皆用桂枝何故夫用藥當審病之大端大端當用則不得顧小小禁忌猶之大端不當用不得以小小利益遂用之也大端不當用如前之桂枝去桂加茯苓白朮湯證桂苓五味甘草去桂加乾薑細辛湯證不以桂枝和營下氣之能牽掣宣飲專一之力是也大端當用如桂枝湯證桂枝芍藥知母湯證不當因其鼻鳴乾嘔溫溫欲吐而忘其和營通經之大力是也若夫位居佐使則自有主持是方者為之棄其瑕而用其長此烏梅丸所以用桂枝也五苓散證茯苓澤藛湯證亦然二方淡滲多而甘緩少又豈能使吐膿血哉且金匱要略嘔吐篇已發凡起例於前矣曰先嘔卻渴者此為欲解先渴卻嘔者為水停心下嘔家本渴若有支飲則得溫藥反不渴於此見藥隨時用雖不可犯其所忌亦不可守禁忌而失事機又不可不明君臣佐使間有去短從長之妙矣柏為百木之長其樹聳直其皮薄其肌膩三月開花其花細瑣八月結子其貫成球狀如小鈴霜後四裂中有數子大如麥粒芬香可愛其葉扁圓尖鋭不一然皆西指參圖經綱目劉潛江云凡木皆向陽柏獨西指是木氣與金氣媾夫金木者生成之終始木稟春生金稟秋成人之肝肺應之肝合乎肺而化則陰生而血之化源裕於是陰降陽隨所謂金之降不窮則木之升亦不窮也肺合乎肝而化則陽生而氣之化源裕於是陽升陰隨所謂木之升不窮則金之降亦不窮也其升降有窮皆由於不相合以為化耳柏之為物陽合陰而化陰由化而生於是陰自降陽自隨其功不同於苦寒之直折故於逆順之血類能治之然其實與葉主治又有不同何也夫葉之四時不易者木已化於金為收降之氣故味苦而性燥至實之花於春成於秋雖稟金氣亦厚然木之生氣係焉蓋僅合於金而未化於金為沖和之氣故味甘而性潤苦燥者象火甘潤者象水甘潤即孕於苦燥之中所謂血源於水而成於火血源於水而成於火正藉金以為用也惟木能和於金而後金能和於火俾真水之液因鼓煽以化血焉於是盡舉益心血諸藥遂無逾此者是即別録所謂益血而本經定驚悸安五臟諸功胥於是在矣抑即繼之以益氣者何蓋心離也中之血既益則外之氣自充心氣充肺乃得貫心衇而行呼吸此所謂益氣也肝和於肺而心血生肝即合於肺之陰輸血以歸血海肺和於心而心氣暢肺即合於心之陽以歸命門是柏實於後天氣血之化源若有盡得其機緘者是即別録所謂療恍惚虛損吸吸腰中重痛者也陰符經云禽之制在氣觀於磁之引針柏之西指其氣固然有非人力所能強者揣其故則曰磁為鐵母則柏之西指獨不似子之向母乎西為金方人之身屬金者肺肺則主朝百衇行治節者也凡血得歸經自不溢為吐衄與利柏葉之治吐血衄血利血蓋欲血受肺之節制分布諸經俾不溢耳故金匱於柏葉湯著吐血不止句以見血之不歸經也雖然煩喘氣火之向心肺也乃竹皮大丸主婦人乳後中虛煩亂嘔逆者以此而加柏實柏實非結於柏葉間者耶何以柏葉能令血西指柏實又能禁氣西指也曰是誠有故焉夫實之於葉猶葉之於西氣之與血猶葉之與實也請試以人喻人之向母本無時或已逮有子其心遂有所分注柏之實始而色青久而色金黃則仍木與金相媾而生者也氣之與血亦互相化彼此相生婦人乳後中虛煩亂嘔逆則血虛而氣亂四射矣射於心則煩射於肺則喘治之以柏實者挽其西指之氣使其瀠洄而化血耳然則柏葉以何定為入血耶夫縱橫燦列而不比連經緯有緒而不紊亂任值何所而終向肺則非經絡而何經絡中之所有又非血而何是柏葉之治血衇會其意兼取其形矣惟其實三月已開花延至八月乃結則又有可深思者蓋凡花者木之精神昌沛發榮於外者也實者氣之凝結韞藏於內者也八月為金氣昌沛之時木氣已榮者感之乃得媾而成實故其為用咸在金木不媾之候其性又潤金木媾而生潤則亦惟血耳血之元既調氣自流轉受益五臟各得安和病發驚駭者其本在肝以血不歸肝也風與溼著人皮肉筋骨必其間血衇氣機不咸血衇氣機咸則凡著於陰者必出陽著於陽者必出表更以他風溼藥治之有何不解散者哉茯苓出松樹根下在土底作塊大者至數斤似人形及龜鳥者佳皮黑肉有赤白等色無苗葉花實或云是多年松脂流入土中變成或云假松氣於本根上生令人釆法山中古松久為人斬伐其枯折槎枿不生枝葉者為茯苓撥見之即於四面丈餘地內以鐵頭錐刺地如有茯苓則錐固不可拔於是掘土取之其撥大者茯苓亦大皆自作塊不附著根上其抱根而生者為茯神然則假氣而生者其說勝矣圖經劉潛江云茯苓本古松靈氣淪結成形盧子繇謂其精英不發於枝葉返旋生氣吸伏於踵一若真人之息則但視為利溼殆有未然蓋松之凌冬不雕非以其稟真陽之性耶乃其氣入土久而結茯苓是其質成於陰氣稟於陽也陶隱居曰性無朽蛀埋地中三十年猶色理無異不可見其堅貞哉第淡滲之物俱先上行而後下降其說猶非始於李瀕湖也前乎此者有謂味淡為天之陽陽當上行氣薄為陽中之陰陰主下降後乎此者有謂參天之陽回返而團結於陰其義為陽有餘而下趨於陰故其氣專專則從清陽以化濁陰又為陽有餘而下合於陰故其氣和和則引至陰以歸至陽其說皆精確不磨可證瀕湖不妄矣且甘先入脾淡主養胃是其功在中土而升清陽就其升陽即以為泄濁之用故在上焦而同益氣同驅痰在下焦而同導水同健脾莫不以是為升即升致降固未可徒以下滲概之此本經主胸脅逆氣心下結痛寒熱煩滿咳逆之義也至其主憂恚驚邪恐悸非治心乎主口乾舌焦利小便非治腎乎則但謂其升清降濁似尚未盡悉其物之理與其治之能者夫清濁本之陰陽陰陽兆於水火水火屬之心腎心內陰外陽而位於上腎內陽外陰而位於下茯苓之用能於陰中吸陽以歸陰又能於陽中引陰以歸陽是故在上者陰宅陽中則火有所主而下交於水水中之火自從地氣而蟄藏在下者陽宅陰中則水有所主而上交於火火外之水自從天氣而發育是所謂神足則氣充氣充而精盈精盈而氣固憂恚驚邪恐悸口乾舌焦又何自為患哉故其升清降濁特從陽吸陰由陰歸陽之餘事耳至若茯神入土較淺故止能入心以得陽厚得陽中之陰不厚也大凡物之生必陰陽相抱若茯苓則水土之陰交於正陽而生者也其攝於陽則有氣無質其鍾於陰則有質無氣故能於無形中煉有形有形中吸無形無形中煉有形則上焦之以氣化陰也有形中吸無形則下焦之從陰引陽也上焦之氣能化陰則所謂滓穢去而清光來結者自開逆者自降矣下焦之陰能引陽則所謂宇泰定而天光發焦者自蘇乾者自澤矣靈樞決氣篇曰上焦開發宣五穀味熏膚充身澤毛若霧露之溉是為氣於此見若焰若煙若霜霰若霖雨皆非氣之正故夫氣以潤而行水以氣而運水停即氣阻氣阻則水淤茯苓者純以氣為用故其治咸以水為事觀於仲景書其顯然可識者如隨氣之阻而宣水茯苓甘草湯隨水之淤而化氣五苓散氣以水而逆則冠以導水而下氣隨之茯苓桂枝甘草大棗湯茯苓桂枝白朮甘草湯水以氣而湧則首以下氣而導水為佐桂枝五味甘草及諸加減湯水與氣竝壅於上則從旁泄而慮傷無過茯苓杏仁甘草湯茯苓戎鹽湯茯苓澤藛湯氣與水偕溢於外則從內挽而防脫其陽防己茯苓湯氣外耗則水內迫故為君於啓陽之劑茯苓四逆湯氣下阻則水中停故見功於妊娠之疴桂枝茯苓丸葵子茯苓散凡此皆起陰以從陽布陽以化陰使清者條鬯濁者自然退聽或從下行或從外達是用茯苓之旨在補不在瀉茯苓之用在瀉不在補矣四逆散證小便不利者加茯苓理中丸證悸者加茯苓夫水不下行則必上壅原屬一貫茯苓色白象肺緣水土之陰吸陽氣而成故其治為自上及下直濬其源非開導而使之泄也然則小茈胡湯證心下悸小便不利者去黃芩加茯苓小青龍湯證小便不利少腹滿者去麻黃加茯苓其去黃芩何耶其去麻黃又何耶黃芩本治因熱生溼麻黃亦治因水阻氣溼氣也水質也以溼而能使心下悸小便不利則有形矣又豈得以黃芩治之易以茯苓直下其已化之水非追討其未化以前溼熱也麻黃治水就其在上橫開毛竅以驅之今水滿於少腹自當就其在下引停畜水氣竝從小便而出是皆因勢而導之耳雖然諸證自有本源水氣特其條目耳惟真武湯證則以水氣為正病乃曰小便利者去茯苓豈小便利尚有水氣為病者哉蓋真武證正病固係水氣但水氣之所被不止在直道中觀其內自腹外及四支上為嘔咳則小便不利者亦其末病耳是證主腦在坎中之陽不能鎮攝水氣非水道不利致病也若仍用茯苓則於橫溢上逆者無干反足以耗直道之津液故去之耳以是推之茯苓之化氣導水止能在直道中矣然則服桂枝湯或下之仍頭項強痛翕翕發熱無汗心下滿微痛小便不利及膈間支飲喘滿心下痞堅面色黧黑衇沉緊服木防己湯愈即復發者病似不僅在中道非茯苓主治也胡為一主以桂枝去桂加茯苓白朮湯一主以木防己去石膏加茯苓芒消湯耶此病固不僅在中道病之根卻據於中道致使應證之方宜效而不效故即就其原治之方增入披根之物根荄既動枝葉自摧也用茯苓方桂苓五味去桂加薑辛半夏湯腎氣丸栝蔞瞿麥丸皆治渴小半夏加茯苓湯豬苓散茯苓澤藛湯五苓散豬苓湯皆治渴而兼嘔正合本經所謂口焦舌乾利小便矣乃茯苓甘草湯乾甘苓朮湯則指明不渴乃用何哉夫水與飲本係兩端其大本大源處仲景未嘗不分之極嚴如痰飲水氣之不同篇是也至支流之所及則仲景每混稱之如痰飲篇之水在心水在肺是也蓋能排臟腑廓肌膚之謂水懸於一處客於一隅之謂飲水是已化之飲飲是未化之水茯苓能化故能治飲非以治水而飲之所在或留於中或據於旁留於中者能渴能嘔據於旁者不能渴不能嘔茯苓之行直道則治留於中者故兼嘔兼渴者皆隸焉他若雖在直道而不在中如厥而心下悸則病在上不在中矣腰以下冷痛腰中如帶五千錢則病在下不在中矣所以然者水在上原足以潤喉舌水在下原無妨於中焦輸化惟其有時在中礙脾之輸斯得竭肺之化不能輸不得化於何而不渴渴則引水自救水溢而化機仍窒於何能不嘔嘔與渴本是證所波及非茯苓所的主也若夫本經所謂口焦舌乾則當於諸補益方參之如腎氣丸治男子消渴小便反多是用桂附蒸動下焦直行不化之水使茯苓守於中以化之也如酸棗仁湯治虛煩不得眠是用知母益下焦之水酸棗仁啓而上之亦使茯苓守於中以化之也試觀茯苓四逆湯附子湯未嘗有水亦竝無渴其用茯苓又可以為疑乎夫二湯所主之候皆係陰壅陽微故振其陽可愈然徒振其陽恐致求直反曲陽雖轉而陰液消亡故用茯苓以轉陽樞而化陰又恐茯苓不足獨當其任故益以人參於陰中化津者為之殿於此見茯苓不特能使陰隨陽化竝能使陽藥不至耗陰陰藥不至抑陽其斡旋之妙有非他物所能竝者卒嘔吐心下痞膈間有水眩悸者小半夏加茯苓湯主之薑能止嘔吐夏能開痞滿而欲其行水則恐非所擅也能行水而止眩悸者其惟茯苓乎況苓桂朮甘湯葵子茯苓散皆以茯苓治眩茯苓桂枝甘草大棗湯茯苓甘草湯理中丸皆以茯苓治悸即太陽病發汗汗出不解其人仍發熱心下悸頭眩身瞤動振振欲劈地者真武湯主之方中茯苓之任亦甚重宜茯苓為眩悸之主劑矣乃桂枝甘草湯小建中湯炙甘草湯四逆散之治悸皆賴桂枝半夏麻黃丸之治悸又賴半夏何哉夫悸之用桂枝與用茯苓有心中心下之分其說見於飴糖其用半夏與用茯苓又有膈間臍下之異其說見於半夏惟其治眩則澤藛湯之因心下支飲而冒眩葵子茯苓散之妊娠水氣身重小便不利灑淅惡寒起即頭眩兩者均係水氣一仗澤藛一仗茯苓其義自應有別然身重小便不利自當屬之下心下有支飲自當屬之上則茯苓澤藛之治眩又顯有上下之別矣於此見悸與眩之病根在心已下者皆為茯苓所宜又可證茯苓之性為由脾及肺而本經於憂恚驚邪恐悸之下著心下結痛一語非無故矣賁豚衝氣盡水氣之所為耶則不可為不用茯苓者解矣賁豚衝氣非水氣之所為耶則不可為用茯苓者解矣或曰賁豚衝氣即別録所謂腎邪者也腎邪之動有挾水者有不挾水者挾水者用茯苓不挾水者不用茯苓此言是也而嫌未推其所以然之故發汗後其人臍下悸者欲作賁豚茯苓桂枝甘草大棗湯主之此用茯苓者也燒針令其汗針處被寒核起而赤者必發賁豚與桂枝加桂湯此不用茯苓者也發汗後動水燒針後不動水其所以然安在夫發汗動水難經四十九難所謂腎主五液入心為汗者也燒針不動水金匱要略所謂從驚恐得之者也病皆涉心故茯苓可不用桂枝不可不用靈樞五色篇曰腎乘心心先病腎為應是已若夫衝氣則所謂傷寒若吐若下後心下逆滿氣上衝胸起則頭眩衇沉緊發汗則動經身為振振搖者茯苓桂枝白朮甘草湯主之青龍湯下已多唾口燥寸衇沉尺衇微手足厥逆氣從少腹上衝胸咽手足痹其面翕熱如醉狀因復下流陰股小便難時復冒者與茯苓桂枝五味甘草湯治其氣衝亦俱用茯苓桂枝第在吐後下後則因中虛致水氣上逆故需朮之堵禦在汗後則水氣先動衝氣隨之故需五味之降攝然病終由腎則緣證加減祇可去桂枝不可去茯苓而兩證之標其所以用茯苓者仍不離乎悸眩是悸眩究係用茯苓之眉目矣非水飲用茯苓其責亦非輕者尤不可不察也夫茯苓之用在氣水轉化之交故補劑中用之使脾交於肺薯蕷丸風劑中用之使陰從陽化侯氏黑散上焦用之則化陽歸陰酸棗仁湯下焦用之則從陰引陽腎氣丸譬諸郵傳之遞接過往之廨舍非是不足以濟道路之窮聯遠近之跡也其顯然可異者尚有在上主氣在下主血之能曰胸痹胸中氣塞短氣茯苓杏仁甘草湯主之曰婦人咽中如有炙臠半夏厚朴湯主之兩者脾氣俱已上行而肺為之阻一則礙其直道故升降不靈一則礙其橫絡故呼吸不利病異方異用意竝異茯苓之轉升為降則同曰婦人宿有癥病經斷未及三月得漏下不止胎動在臍上者桂枝茯苓丸主之曰婦人懷妊腹中㽲痛當歸芍藥散主之兩者心肺俱已下行而肝為之阻一則滯氣凝血隔胎元之吸引故當停反漏一則流痰宿飲混養胎之陰血故雖動不漏然茯苓之闢阻為通則又無不同其在上之功則所謂通調水道下輸膀胱在下之功則所謂水精四布五經竝行絶非治水其功實附於治水蓋人身之經衢惟氣血為之運行血自有營氣之流轉氣則賴津液以行故也酸棗即棘也生坡坂城壘則小生平地則易大小者名棘多刺大則刺少其木高及三尺便開花結子大者至數丈徑圍一二尺木心赤色理極堅細皮亦細鞕文似蛇鱗莖葉俱青花似棗八月結實圓小而味酸核微圓仁稍長而扁參圖經拾遺古來於大棗酸棗棘刺棗仁紛紛聚訟或以為酸棗即大棗之酸者或以為酸棗亦大木或以為噉酸棗能醒睡或以為服棗仁治不眠殊不知皆是也而皆非也夫喬生曰棗叢生曰棘是一類二種設使棗叢生亦不得不為棘棘即養而大之終不得為棗如橘年久則葉生刻而變為枳不聞枳得培植亦可變為橘物類之性固如是耳試以本經大棗主治與酸棗主治較之惟其喬生則氣生厚惟其叢生遂氣力薄厚則甘薄則酸陰陽應象大論云辛甘為陽酸苦為陰又曰味薄則泄厚則通氣薄則發泄厚則發熱故大棗主心腹邪氣是振其中而使之外達酸棗主心腹寒熱邪結氣聚是疏其中而導之外泄大棗主四支重是助其經氣使其轉接之間阻礙不生酸棗主四支痠疼溼痹是鼓其經氣使其轉接之間留著解散惟其力厚則既助十二經之行仍能使全氣內轉故復補少氣少津液身中不足力薄則鼓蕩經氣使外達遂不能復歸致衛氣行於陽不得入於陰此陶隱居謂噉之能醒睡不為無故矣由此觀之本經酸棗主治是酸棗之功能非酸棗仁之功能酸棗自醒睡酸棗仁自治不眠故本經於酸棗氣味上竝不著仁字而隱居亦不言噉其仁可見別録主治乃酸棗仁之主治即其味甘而不酸可證也杏為心果其仁入肺而宣氣桃為肺果其仁入肝而宣血則棗為脾果其仁入腎而宣水決矣雖然棗仁用酸棗之仁不用大棗之仁何也蓋大棗補而仁則泄酸棗泄而仁則補別録云陳棗核中仁味苦燔之主腹痛邪氣酸棗仁則甘以是酸棗仁之用廣於大棗仁矣煩心不得睡水不上濟於心也臍上下痛水不宣而停於所治也血轉久泄者肝無所藉而不藏虛汗煩渴者心無所資而不潤水氣能涵木木得涵而筋骨遂堅筋骨堅而陰氣有所守陰氣有所守則陽亦充於外而肌肉豐氣力優矣心中煩不得臥黃連阿膠湯主之虛煩不得眠酸棗仁湯主之同是心煩同是不寐兩方無一味之同豈不得臥不得眠有異耶抑心中煩與虛煩固不同耶夫寐謐也靜謐無聲也釋名眠猶瞑也後漢書馮衍傳注玉篇眠瞑同泯也泯泯無知也釋名臥猶息也後漢書隗囂傳注僵也廣雅釋詁是寐者能臥而未必安靜眠者且能熟寐而無知不得臥則或起或寢竝不能安於牀席矣於此見虛煩不得眠雖亦靜謐但時多擾亂也心中煩不得臥則常多擾亂且不得靜謐矣夫寐係心與腎相交能靜謐而時多擾亂乃腎之陰不繼不能常濟於心常多擾亂而不得靜謐乃邪火燔盛縱有腎陰相濟不給其爍況一為傷寒本係急疾之病且少陰病僅在二三日以上其急疾抑又可想一為虛勞則本緩疴虛證故其治法瀉火滋陰相去霄壤一以阿膠雞子黃安心定血而外竝主以苦燥之芩連開陰之芍藥一以酸棗仁茯苓啓水上滋而外更益以甘潤之知母開陽之芎藭豈可同日語哉故後世用酸棗仁諸方始終只治不睡竝無他歧相攪乃立異者或以為生用能醒睡是牽合陶隱居之說以簡要濟衆一方為據不知其方用酸棗仁止一兩用蠟茶至二兩且以生薑汁塗炙是以茶醒睡用酸棗仁為反佐若據此為醒睡之典則麻黃湯中有治中風自汗之桂枝亦可謂為止汗耶或以為酸棗仁治不寐乃治邪結氣聚之不寐是牽合本經之文且謂未有散邪結氣聚之物能使衛氣入臟而就安寢者不思仲景用酸棗仁湯明明著虛勞虛煩不得眠之語虛煩不得眠猶可目為邪結氣聚耶虛勞亦豈邪結氣聚可成者耶縱邪結氣聚亦可成虛勞則此不得眠且將與梔子豉湯證相比矣若謂衛氣不得歸臟又與半夏秫米湯相比矣仲景又何別用酸棗仁湯為哉檗樹高數丈葉似吳茱萸亦如紫椿經冬不雕皮外白裏深黃色緊而厚至二三分其根結塊如松下茯苓蜀本圖經凡草木之根成球結塊者其氣必向下縱苦寒而不泄凡物之苦寒不泄者其性必燥能搜剔隱伏之熱檗木根結如茯苓皮色鮮黃味苦氣寒性燥故其為治能使在內之伏熱解而肌肉九竅之病盡除第本經主治所謂五臟腸胃中結熱者當作五臟之熱結於腸胃中解若謂五臟腸胃中結熱遍能治之則檗之功似宜更廣所治之證必不若是之狹矣惟其所主腸痔泄利女子漏下赤白陰傷蝕瘡均係九竅斯不可謂九竅不和乃腸胃之所生病耶劉潛江云腎之陰氣不足則熱自結於胃胃壅結熱則溼土之陰氣無從施化而還病於溼此由腎及胃之徵率是推之則腸胃因五臟熱結而病於溼熱者不少矣詎獨在腎況腸痔泄利女子漏下赤白陰傷蝕瘡何一非挾溼為病不僅是熱耶特本經所主皆下竅之病且俱屬溼別録所主則上竅之病俱不屬溼何哉夫溼本下溜火則上出溼病於下與火相合但火能升津不能升故病於九竅之下者多涉溼病於九竅之上者多聯燥理固宜然無足怪也第五臟之間病連心與肝者必雜血連脾與腎者溼尤劇耳檗之治解溼熱之為病於腸胃則其源之自五臟來者能清其流之及九竅者皆罷緣其色黃固入胃氣寒能勝熱性燥可已溼也至驚氣在皮間肌膚熱赤則肝家之氣已入肌肉而化熱尚未礙津液之流行致化溼也故尤能治之則氣之來自五臟至於胃而熱甚生溼為更可信矣或曰子治本經證以仲景大抵欲明藥之所以用也譬如檗皮仲景以梔子檗皮湯治黃疸用之於身黃發熱者則似檗皮於黃疸不離發熱以為治矣乃大黃消石湯中用之則不必以發熱也其以白頭翁湯治下利用之於熱利下重者則似檗皮於下利亦不離發熱以為治矣烏梅丸中亦用之又不必以發熱矣又何從確然指其所以哉豫謂黃疸與下利之候甚多而表裏寒熱錯雜其孰多孰少不可不辨也凡黃疸之屬裏屬寒者不論舉其屬表屬熱者言之則麻黃連軺赤小豆湯證其標見於太陽小茈胡湯證其標見於少陽梔子大黃湯茵蔯蒿湯大黃消石湯梔子檗皮湯證其標皆見於陽明陽明者有在經在腑之分發熱懊憹汗出皆經證也腹滿小便不利皆腑證也梔子大黃湯證經多而腑少茵蔯蒿湯證有腑而無經梔子檗皮湯證有經而無腑大黃消石湯證經少而腑多試於梔子檗皮湯證以黃疸為裏則發熱為表於大黃消石湯證以腹滿小便不利為裏則汗出為表是汗出為表和則發熱為裏和而檗皮之用正在表裏之間溼熱壅於肌肉是胃中結熱為疸者也下利之所屬尤多然白頭翁湯烏梅丸證只在厥陰一經厥陰尤寒熱錯雜之所則寒與熱之多少尚可循其數以證之也其厥逆無衇汗出身冷純屬寒者無論若兼煩兼嘔衇大衇數讝語欲飲水則屬熱矣試以衇大衇數煩且嘔者為寒熱參半則乾薑黃連黃芩人參湯之寒差輕烏梅丸之寒差重若以讝語欲飲水為純乎熱則白頭翁湯之熱比於虛小承氣湯之熱比於實下利之虛者寒熱參半其寒多而參用溫者皆用檗皮則檗皮之用正在五臟間有以和其熱使其熱不移於腸胃而已要之九竅之病無不本於腸胃腸胃之熱有不係五臟所移者則非檗皮所主統觀黃疸下痢二證之用檗皮者皆比於虛則檗之治熱必虛而挾溼者始為當耳漆樹如柿高二三丈皮白葉似椿花似槐子若牛李六七月以剛斧斫其皮開釘竹筒其中承之汁滴則成漆在筒子內乾者黑如䃜䃜美石黑色堅若鐵石者佳圖經參綱目漆木液也雖出自皮而上自巔杪下及根荄徹內徹外之液無乎不具且其質黏其狀若水斷者得之可續離者得之能合又必著於物方有以施其用此主絶傷補中續筋骨填髓腦取其形以為治也一處既動全身悉赴行而不留如此又何患其五臟不安或緩或急致成風寒溼痹哉此則取其意以為治也形質者物之體氣味者物之用漆為木液已具木水之體體之有益於人身本經主治已盡之矣而其味辛氣溫又有合於金火之用夫金者既成物而難壞必得乎火方能改焉此洪範所謂從革者也惟其質似水而味辛故得為難成難敗之液惟其質似水而味辛流行以趨於火而從革不又似中焦受氣取汁變化而赤者耶故其為物就溫燥處則蕩漾而常似水就寒溼處則凝結而堅如石不又似血之遇熱則行遇寒則凝耶此仲景於大黃䗪蟲丸取以治乾血為得其用之神矣雖然信斯言也則本經用其實處應是乾漆仲景用其虛處應是生漆乃俱用乾漆何哉夫用物之道亦取其生機而已漆非乾不得炒不炒則有毒能害臟腑如人聞生漆氣則生瘡而居乾漆室中未聞有生瘡者惟其炮製之當斯能避害而獲利其機既動氣血自從何得硜硜為穿鑿之見耶且漆亦何嘗終乾既為末而入於胃亦隨諸藥為滓穢惟其氣其味流轉於臟腑筋骨間以成其填補運化之功耳然則乾漆通血宜隨熱藥以為治大黃䗪蟲丸中均係寒藥豈不畏其遇寒則凝耶夫熱自在人身故藥得用寒假使因漆而以熱治則漆之功效未見藥之為害已深譬如蟹何嘗不是寒物漆若遇之竟化為水不復能凝此又何故特物性之相制有如是耳說者或謂蟹外剛內柔其黃應月盈虧為稟金水之質故能敗木火之用或謂漆辛溫蟹鹹寒寒能剋溫鹹為辛子子從母化則其氣自解或謂蟹能逐血漆之氣化似血故為之敗其然豈其然乎上品人三味獸二味禽三味蟲魚三味果三味穀二味菜三味髮髲乃翦髢下髮亂髮乃梳櫛下髮綱目髮以血生血由火成心者屬火而主血以髮還生其血以血還養其心此之謂仍自還心合小腸小腸者受盛之府本輸篇下連膀胱膀胱者州都之官津液藏焉氣化則能出矣靈蘭祕典論水火合德而化氣此之謂神化所以能利小便水道也腎之華在髮六節藏象論水出高原髮者血之餘水者血之類滑攖寧注涕唾淚溺皆同源於腎一涸則無不涸一通則無不通所以主五癃關格不通也小兒之驚責在心氣之怯大人之痓責在衇絡之空咳嗽者心失養而火上炎鼻衄者血為火挾以上出燒為灰迎血至而吹之亦可謂仍自還神化者矣雖然血與水既為同類乃髮遇血則止之遇水則通之何也蓋血與水同源於肺其精者為心火蒸逼而赤遂統於脾藏於肝則謂之血以其行於陰也其粗者下三焦歸小腸膀胱則謂之水以其行於陽也倘心火不蒸變無由盡出於陽水道何能不淤血亦何能不少此髮之用謂之血源濬而水自通倘心火蒸逼水液化血四出水道何能不涸血又何能不溢此髮之用謂之水道利而血自止仲景於豬膏髮煎所以榮血而利水於滑石白魚散所以通水而和血用髮則一命意自殊非與本經同條共貫不能如此隨手更化也李瀕湖謂人尿入胃輸脾歸肺下通水道入膀胱皆其舊路據此則能利水已矣何以能療寒熱頭痛溫氣也蓋中焦者營衛所會即水道之化源也水道化源遲滯阻營衛之交會營病即惡寒衛病即發熱矣頭痛由乎溫氣既忌散又無從清則導水下行之法即降火下泄之法仲景於衇微下利與白通湯應利止衇旺乃反厥逆無衇乾嘔而煩則上有浮陽能合溫劑而生火下陽愈虛浮陽愈猖矣下焦之陰方逆猶可稍用寒涼以助之耶其加此於白通湯中亦治頭痛溫氣類耳後人擴充其旨用治血因火逆亦可謂善體古人者女病新差男與合而染之謂之陰易男病新差女與合而染之謂之陽易其證身體重少氣少腹裏急或引陰中拘攣熱上衝胸頭重不欲舉眼中生花膝脛拘急病似甚重何以用燒裩散即可愈耶不知始病者既愈本無甚大邪不過餘熱未清而染病者係無病之人乃緣精氣泄後熱由虛入擾於精道致使阻礙小便小便既阻熱遂上行而有陰中拘攣等候其身重少氣少腹裏急等事苟非強壯之人房室後常有之不出半日愈矣主以燒裩散者病從是來即使之從是去也或曰條中竝不言小便不利此何以增之蓋溺管即是精竅若交接才已小便隨通其熱原得乘之而泄其得熱上衝胸必係小便反為熱氣所阻否則方下何以特注小便即利句且曰陰頭微腫則愈豈非以來路作去路之證乎於此見人身服物常著何處者即與何處之氣相吸引推而廣之蓋有無限妙用他物矣論龍骨者紛紛異辭彼此辨詰豫則謂均不足信何者醢龍龍斃即古誠有是事其骨亦決難入藥乃圖經復證以北夢瑣言謂龍實有死者若必待龍死乃得其骨則千百年罕覯之物矣蛻骨之說似屬可信然龍之骨豈誠如麋鹿之角蛇之皮蟹之螯耶角可蛻皮可蛻螯可蛻骨又焉可蛻況凡骨必其中有空隙今之龍骨無有也是誠龍之骨耶不知龍純乎氣之物秋冬則隨地皆蟄是故濱海之區龍蟄水底無水之地龍蟄土中至春啓蟄則出土上騰其所伏處土遂黏埴似石而形實龍人得之謂為龍骨其理平實又何異焉或者疑雨為陰謂龍能行雨必與陰為類不知龍陽物也其能噴火固陽之性而雨則陽之所化是故龍噓氣成雲必於上而不於下其安居屈伏則不於上而於下亦可見陽之用雖在升陽之體則宜伏彼龍骨固盛陽伏而息焉之窟宅也其本體是土土為萬物生長收藏之所本若為龍所曾蟄之土則更為水火發斂起伏之所由斂甚者能起而發之發甚者能斂而伏之此其用之神有非他物可比擬者其在於人火離於土而不歸則驚癎癲狂水離於土而不藏則溲多泄利陰不附土而陽逐之則遺精溺血陽不附土而陰隨之則汗出身熱心下伏氣癥瘕堅結蟄而不能興也夜臥自驚恚怒咳逆興而不能蟄也種種患恙一皆恃夫龍骨以療之則其取義於土之能發斂水火又何疑焉彼譫妄狂易汗出煩渴之不用龍骨正以盛陽之結根於土也下痢圊穀裏寒外熱之不用龍骨正以陰水之汨夫土也因是知龍骨之用固為水火不依土設然又必水違土而有火之相迫火違土而有水之相尾者乃為恰合也諸家論阿膠者於阿井水黑驢皮津津言之類多中窾但以合之本經別録主治傷寒金匱功能殊有不盡符者豫則謂阿膠能濬血之源潔水之流何則夫不因經産非關六淫而生血之所氣潰敗以不繼血奔溢以難止內則五臟之氣不凝外則經絡之血不榮所謂心腹內崩勞極灑灑如瘧狀者則仗其取肺所主之皮腎所主之水以火煎熬融洽成膠恰有合於膻中火金水相媾生血之義導其源而暢其流內以充臟腑外以行衇絡也痰與飲皆為水屬血亦水屬水非熱不濁非撓亦不濁水濁於中則滓停於四畔及窪坎不流之處所謂腰腹痛四肢痠疼者則仗其取氣熏津灌之皮假水火烹煉成膠膠成之後隨亦水消火熄恰有合於澄水使清各歸其所俾外廓之氣悉會於中中宮之津得行四末流徹則源自清外安則內自定也云安胎則定係婦人治女子下血為婦人安胎亦疏其源以裕其流云丈夫則無與童稚童稚天真小腹無因火痛者故惟治丈夫小腹痛亦潔其流以通其源耳其虛勞羸瘦陰氣不足即心腹內崩所致腳酸不能久立即腰腹痛四肢酸疼之互文也肝藏血血衰則肝家之氣失所戀而耗散血復則氣得所養而充旺矣千金翼炙甘草湯之治曰虛勞不足汗出而悶外臺炙甘草湯之治曰涎唾多心中溫溫液液皆胸中津不流也黃連阿膠湯證無溼在中何以用芩連黃土湯證無溼在中何以用白朮附子甘草黃土統是觀之阿膠固欲其澄水使清歟抑亦不止於是也津液在中蹇滯不化則非激射外泄必咳逆外吐濬化血之源俾有去路則壅者自消尚何激射咳逆之有名曰導液實以益血一舉而兩利存焉矣火燔於上有溼不足以濟之是以徒見火之燎原不見溼之停伏在今日不過煩擾難安而他日下利膿血即鍾於是矣溼鬱於上有火不足以宣之是以徒見溼之下溜而無火之尉煦在今日不過便後下血而他日土崩瓦解已兆於是矣阿膠隨芩連是化陰以濟陽隨朮附是和陽以存陰名曰益血實以導液亦一舉而兩利存焉者也若夫邪氣牢固劫氣血而結癥瘕則用厚朴烏扇半夏桂枝行氣而使人參防其太濫用紫葳牡丹桃仁䗪蟲通血而使阿膠挽其過當羸瘦過甚氣血空而風氣襲之則用薯蕷白朮甘草益氣以人參率之用地黃芎藭芍藥當歸和血以阿膠導之此鱉甲煎丸薯蕷丸之任阿膠亦不為輕矣陽明病衇浮發熱渴欲飲水小便不利少陰病下利咳而嘔渴心煩不得眠皆用豬苓湯其中有阿膠當以何者為用阿膠確證兩者所患絶異惟渴則均有之得毋緣渴而用之歟殆非也夫五苓散無阿膠亦能治渴陽明病豬苓湯證有怵惕煩躁不得眠少陰病又有心煩不得眠再證之以心中煩不得臥黃連阿膠湯用阿膠則阿膠當為不得眠設矣然太陽病虛煩不得眠梔子豉湯虛勞虛煩不得眠酸棗仁湯皆不用阿膠何也夫固曰阿膠治有津液有水溼不能化血之候梔子豉湯證有火無陰酸棗仁湯證陰虛有火何可與用阿膠者比也人臥則血歸於肝血以枯澀不歸肝者有之血為火擾不歸肝者有之若阿膠所主則有化血之物停而不化反致無血歸肝者也譬如豬苓湯證有發熱溫經湯證暮即發熱白頭翁加甘草阿膠湯證亦應有熱鱉甲煎丸證寒熱不止則發熱亦可謂應用阿膠之證耶溫經湯證至脣口乾燥且不言渴黃連阿膠湯證至用芩連亦不言渴炙甘草湯疊用滋補併不言渴渴者非用阿膠之據也血是水之淳水是血之漓血雖欲其流不欲其泄水但欲其澤不欲其停經衇別論所謂飲入於胃遊溢精氣上輸於脾脾氣散精上歸於肺此其共源也所謂通調水道下輸膀胱水精四布五經竝行決氣篇所謂中焦受氣取汁變化而赤此其分源也故血之病多在泄泄則不流化源反竭水之病多在停停則不澤反能生火水停而生火則豬苓湯黃連阿膠湯炙甘草湯白頭翁加甘草阿膠湯溫經湯皆其治也血不流而化源竭若芎歸膠艾湯所治之胞阻鱉甲煎丸所治之瘧母溫經湯所治之少腹瘀血大黃甘遂湯所治之血室瘀血一似用阿膠行血者殊不知惟其流是以生生不已惟其生是以畜泄有常能不妄行惟其妄行是以畜泄無常而有瘀惟其有瘀是以不流而化源反不繼阿膠者取千里伏流不潰不決之濟水熬統護血肉之皮以成皮者肺之合火者心之合水者腎之合三合相聚不正似血之化源乎化源已續斯瘀自行瘀者行則決泄自止猶可謂之行血乎雖然瘀之為瘀有非阿膠所能通者何則如傷寒之畜血虛勞之乾血産後之瘀血帶下之少腹滿痛所以不用阿膠者良以阿膠止能濬血之源倘中焦無汁可化則非其所能任他如因熱邪而畜者熱邪去而畜自行因舍空而留者逐其所留道自無阻本無藉於阿膠耳玩大黃甘遂湯證水與血俱結溫經湯證已下利數十日仍入暮發熱種種耗陰之候乃僅脣口乾燥能終不渴可知阿膠之用屬陰不虧而不化血者不治血之化源涸也小便非因火煎熬不能成沙石手足非因寒收引不得為轉筋二病之本猶霄壤其可以一物治之耶夫石淋轉筋其流也其源則有消渴傷寒寒熱在何則以傷寒而論消渴是厥陰病不得有寒熱寒熱是少陽病縱渴亦不得為消二者本自難竝此文蓋有朱黑誤書之咎非消渴至轉筋全係本經即全係別録方有條理可尋義致可疏也夫淋者小便如粟小腹弦急痛引臍中轉筋者其人臂腳直衇上下行微弦兩病者消渴可兼有傷寒寒熱亦可兼有也飲水多小便亦多謂之消渴水入不能化陰而已渴是必其氣橫溢橫溢則氣不得下而為淋或筋胖脹手足難以屈伸傷寒陰陽相爭謂之寒熱爭而得汗其氣乃泄倘不得汗亦遂橫溢小便為難或狹有溼則成轉筋治之以雞屎白者獸有小便故無塘糞禽無小便其糞多溏然未有乾溏雜出者獨雞食精則便稀食粗則便乾屎白則得於乾者少得於稀者多惟其原消堅韌者為稀是以能使本稀而結成堅韌者化小便之如粟者既化則橫溢者自順水道自通非特石淋可破即轉筋亦竝可已矣雖然飲水多而小便難不出三五日不成水腫必為泄瀉傷寒寒熱如不得汗必至傳經豈能待而施治殊不知下文云利小便止遺溺蓋惟遺溺故小便不利惟小便不利乃轉筋止遺溺原以利小便利小便適以止遺溺向之不水腫不泄瀉不傳經者正以其遺溺今之破石淋及轉筋者正以其小便利耳不然則素問腹中論所謂鼓脹者既心腹滿矣何以復能旦食耶故惟清氣能升濁氣乃降旦則清明之時心腹雖滿清氣藉此猶能升舉暮則濁陰用事滿必愈增故能旦食不能暮食也雞食精則升降靈遂滌蕩濁陰而有白食粗則橫脹濁遂裹清而白不可見不用其濁乃用其清原欲使其直達直達正以救橫溢也在內結成如石者猶可消則消在外之瘢痕又何難之與有嘗見雞所抱卵未成而斃者剖其殼觀之毛骨已具則白無有腹未全則黃尚存是他日之飛揚騫舉者皆白飲啄遺育者皆黃是白為其陽黃為其陰宜乎白性溫黃性涼矣乃白微寒黃微溫何耶雖然白為毛骨黃為腹臟凡卵皆然非特雞也白微寒黃微溫則雞乃如是耳蔣漢房先生云雞之似巽不一其冠上高厚廣大下則短小雙垂其鳴先發雙短小聲繼則高朗且長所以然者巽一陰居下浸長二陽在上反衰休故體質與衆鳥同飛騫不如衆鳥之健以陰方生之力厚也夫然則卵黃非溫以氣厚故卵白非涼以氣退而將消故於此見黃有涵淹孕育之功白有解散浮陽之效熱火灼爛瘡者外有所傷內火奔而赴之兩火相湊乃久爛難痊癎痓者在內凝固之陰為在外浮陽引動且前且卻也雞子之用分而言之則黃能固其內白能清其外合而言之黃與白本同一氣原相和洽內不助外則外之浮陽自騫舉飛越外不牽內則內之神魂自安定凝固矣再析而言之則白之主目熱赤痛心下伏熱煩滿咳逆及咽中傷生瘡不能語言聲不出何莫非內固而外不靖黃之主心中煩不得臥百合病吐後膿水不凝何莫非外靖而中不安哉白主小兒下泄者因火而泄恃血肉渾淪之氣清以解之使其無苦寒清泄之傷也主婦人産難胞衣不出者卵殼之內有膜雛既出則膜亦即離殼而出也蜂居山谷蜜結石巖者名石蜜其居叢林結樹木上者名木蜜皆以色白如膏者佳若人家作局收養割取者為家蜜最勝春分節後蜂採花心之粉置之兩髀而歸醞釀成蜜從上下垂不著邊際其厚若指故曰蜜脾如遇牡丹蘭蕙之粉或負於背或戴於首歸以供王蜂王所居層疊如臺有君臣之義寒冬無花深藏桶內以蜜為食春暖花朝後復出采花也參本草崇原蜜之質如稠漿具遇隙則下之體其脾從上下垂四旁及下皆無所著又具決不可停之勢乃片片相比雖不相連屬而厚薄短長整齊光潔絶不下溜推其用當為固護陽中之陰各安其分不使泄降矣顧此猶為蜜之未去蠟者言耳考蠟之用本經主下利膿血補中續絶傷金瘡不饑耐老是其固津液之流大都在蠟蠟與蜜既已煉使相離則蜜之用以其形體象脾旁無倚著為能益氣補中以其潤澤豐腴凝定充滿為能安五臟諸不足釀蜜之所風雨不能傷蜂之釀蜜雖常若擾攘卒不亂其行即有震而驚之讋而懾之者亦旋亂旋定此所以於心腹邪氣諸驚癇痓中安五臟諸不足也止痛解毒者甘醇之功除衆病和百藥則緩中之效耳第甘受和白受采蜜甘蠟淡釀於一處煉而別之則甘者自甘淡者自淡不知為蜜不受和耶抑蠟不受和耶是誠有至理當切究也陰陽應象大論曰辛甘為陽酸苦為陰鹹為陰淡為陽統而論之則甘與淡皆陽析而言之則淡之陽勝於甘所謂白受釆也是故蠟之用多在六腑其辟穀止利俱有大驗蜜則主入五臟其潤澤滑利亦有殊功雖然初成之蜜未始不甘既煉之蠟毫無甘味則為蠟不受和無惑矣惟其受和故性寬緩能益能和故性專一能止能澀也別録蜜主腸澼仲景豬膚湯甘遂半夏湯皆以治下利則蜜者信可主下利歟然不可為蜜煎導法言矣蜜煎導法之滑潤大便非假借也則蜜者信可滑潤腸胃歟然又不可為治下利之理中丸言矣蓋仲景之用蜜旨雖甚廣其要實在蜜煎導法中所謂津液內竭是也夫津會於胸液著於骨在胸之津盡摶於飲則飲去而津亦亡故逐飲劑中馭之以蜜使飲去而津不大傷也大陷胸丸甘遂半夏湯在胸之津為陰所霾則熇其陰而津必耗故溫中之劑和之以蜜使陰見晛而津不耗也理中丸薯蕷丸邪痹於液或為骨節屈伸不利或為牽引結急欲開其痹轉恐閡其液則以蜜監之使痹開而液無所與烏頭湯大烏頭煎血液屬也痹而不行而欲開之亦宜蜜之監使瘀去而新留大黃䗪蟲丸下瘀血湯若夫腸澼亦惟久利腸胃液涸滯轉難通之一端耳又豈能泛主諸利不然則豬膚湯甘草粉蜜湯僅豬膚甘草一味之別且止心煩心痛之不甚異竝無下利之同又可以為典據耶是蜜者能治津液不足之心煩心痛即本經所謂安五臟諸不足者諸驚癎痓即可於是而測其用矣仲景諸法有和蜜入藥化蜜入藥化藥入蜜化蜜入水四者之殊和蜜入藥者泄藥得之緩其泄毒藥得之緩其毒熱藥得之和其燥寒藥得之和其洌補藥得之俾留戀而不速行散藥得之俾行徐而不盡量如兩書諸以蜜為丸者是也化蜜入藥者或固護其陰液或滑澤其途徑或資其芳香潤中以啓脾胃或假其至甘以化陰火如兩書諸藥成更化入蜜者是也若夫化藥入蜜惟烏頭湯大烏頭煎二方神矣蓋藥之過燥使化為潤則無燔灼之虞藥之過健使化為緩則無孟浪之患以形而論正似骨節屈伸泄澤之液以用而論則能驅風寒溼雜合而成之痹不然蜜非治痹治疝之物何用之而不爽耶至化蜜入水惟大半夏湯為然則更神矣夫化蜜入水欲水之不衝激也揚之欲其水縱上湧仍就下也以多水煎消其五之四欲其純化為氣以噓枯澤槁也故用治胃反胃反者巢氏所謂營衛俱虛血氣不足停水積飲在胃脘則臟冷臟冷則脾不磨脾不磨則宿穀不化其氣逆而成胃反朝食暮吐暮食朝吐心下牢大如杯往往寒熱甚者食已即吐其衇緊而弦緊則為寒弦則為虛虛寒相搏故食已即吐名為胃反因知胃反非飲不成化蜜入水揚之二百四十遍以水一斗二升煮取二升半皆所以治飲者也牡蠣假水沫之依於面南石上而成其首向東有牡無牝始生如拳四面漸長能至數丈嶄巖如山磈礧如房房中有肉大者如馬蹄小者如指面潮來房開潮退房合合時納小蟲以充腹剔去肉用其殼煮鹽家取而煆之以其灰泥釜云耐水火不破漏參隱居圖經綱目劉潛江云牡蠣鹽水結成塊然不動無情者也然潮漲則開潮落則合極似有情者何以故宣伯聚潮候圖說云圓則之運大氣舉之方儀之靜大水承之氣有升降地有浮沉故月有盈虛潮有起伏是以盈於朔望虛於兩弦息於眺朒消於朏魄月為陰精水之所生日為陽宗水之所從故晝潮之期月常加子夜潮之候月必在午卯酉之月陰陽之交故潮大於餘月朔望之後天地之變故潮大於餘日一晦一明再潮再汐月經於天水緯於下進退消息相為生成斯天地之至信也牡蠣之結緣水沫為潮所蕩而依於石因是漸漸生長假無成有幻泡作堅因潮而生斯情繫於潮其與潮為吐納也固宜夫水陰中之陽潮則陽之動也迎其漲則開以納之是召乎陽以歸陰也逮其退則合以茹之是化其陰以清陽也惟其召陽歸陰故陰得陽以化惟其化陰以宅陽故陽由陰而清愚謂人之生本於水水之所以灌溉一身周流無滯者又端賴夫火假使水不納火則汪洋而無統攝火不入水則燔熾而能焫物水火之相離合陰陽之相激蕩必休作有時消長有度如傷寒之寒熱溫瘧之灑灑者矣驚者氣之散而不收恚者氣之憤而難達怒氣者氣之欲達而不得暢傷寒寒熱溫瘧灑灑象潮來之候驚恚怒氣象潮漲之形以牡蠣迎而納之消而息之是知牡蠣非治傷寒寒熱溫瘧灑灑也治傷寒寒熱溫瘧灑灑中之驚恚怒氣耳潮漲似緩潮落似拘牡蠣者偏能於緩時納物果腹以濟拘時之飢則其除拘緩之義可識矣聚沫而成塊礧即鍾生氣於塊礧中比之聚痰而生瘻遂致瘻中血衇不行動者正相反也使其中吐納生氣鼠瘻自消亦實理之所在耳婦人帶下有胎産乳字等故不比女子一皆由經水不調但使天癸應時如潮之起落不爽又何赤白帶下足慮耶主傷寒寒熱溫瘧灑灑驚恚怒氣所謂化陰以清陽也除拘緩鼠瘻則所謂召陽以歸陰也傷寒金匱兩書用龍骨者七方用牡蠣者十二方龍骨牡蠣同用者五方用龍骨不用牡蠣者二方用牡蠣不用龍骨者七方夫不參其同用不足知其相聯之奧妙不參其獨用不足顯其主治之功能欲參其獨用之最親切有味者在外感莫如蜀漆散牡蠣湯之竝治牡瘧在內傷莫如天雄散之治虛勞白朮散之養胎氣夫瘧之發必由痰固於中痰則水為火搏而成者也邪火搏痰身中之火與俱斯外達無從雖表間但患寒多而不知正患熱盛也故仗蜀漆吐去痰涎以剷其根以雲母龍骨使陽返於土邪達於外當留者留當去者去倘若外更束寒毛竅痹阻則必用麻黃甘草大開其外以散其寒然蜀漆之吐僅使陽從土達雲母龍骨引陽使還土而已麻黃則使陽從水達故當易以牡蠣使當返本之陽歸水中而不得用龍骨矣以是知龍骨之用在火不歸土而搏水牡蠣之用在陽不歸陰而化氣也人之精氣稟於有生之先既已損削必賴後天方能生長以故天雄於至陰中壯陽白朮於淖溼中助氣苟徒倚以入腎適足以耗陰乃欲其生氣生精無是理也用龍骨足斂二物之氣入脾使脾充而氣旺氣旺而精生矣妊娠者鍾陰於下吸陽於上故每經信乍阻胎元尚稚吸取不多則陰陽交阻於土為胸痛嘔渴劣者見此未免用清殊不知削其陽正以傷其胎耳豈若芎藭於血中出其不合盛之陽白朮於中宮扶其不合衰之土蜀椒以降陽氣下歸牡蠣以召入陰中之為愈乎於是又知龍骨之引火歸土可藉以化氣生精牡蠣之召陽歸陰可藉以平陽祕陰矣龍骨牡蠣聯用之證曰驚狂曰煩驚曰煩躁似二物多為驚與煩設矣而所因不必盡同何也蓋驚怖火邪皆從驚發得之故太陽傷寒加溫針必驚少陽吐下則悸而驚是知驚者不必泰山崩於前見聞駭於驟也隨證可致隨處異源善哉素問舉痛論曰心無所依神無所歸慮無所定數言括盡驚之狀是則心無所依神無所歸慮無所定即可謂之驚豈必別有他故也然曰傷寒衇浮醫以火迫劫之謂之亡陽治以救逆豈救逆湯遂可與四逆比耶夫心也神也慮也皆陽之作用也無所依無所歸無所定是陽不守舍矣非陽亡而何雖然陽之亡有別以發汗而致者先動其陰後動其陽故陽動而陰逆僅止陰之逆陽氣乃得奠安以驚而致者先動其陽僅曳動其陰故陽雖動而陰不逆則安其陽召使歸陰自弭帖矣是故衇浮更遭火迫以致亡陽迥非發汗多或重發汗可比桂枝去芍藥加蜀漆牡蠣龍骨救逆湯又豈可與四逆同日語哉然此可為太陽溫針少陽吐下者言耳若虛勞之桂枝加龍骨牡蠣湯中風之風引湯其可以是為說耶夫桂枝加龍骨牡蠣之證曰衇芤動微緊男子失精女子夢交芤動者陽之越微緊者陰之結惟其陽不歸陰是以陰氣為結惟其陰愈結斯陽愈不歸土者生陰之源水者元陽之配土不藏陽水不攝陽則陽之無所依無所歸無所定與因驚者不異矣和其外之陽使受攝於內奠其陽之窟使吸引於外一轉移間安內攘外強幹弱枝之義備焉絶不因驚與因驚之證無有不合矣若夫風引湯之除熱癱癎仍緣邪鬱生驚因驚而甚其與茈胡加龍骨牡蠣湯黍銖不爽者也大率龍骨牡蠣推挽空靈之陰陽與他發斂著物之陰陽者異故桂枝茈胡承氣湯無不可會合成劑而攝陽以歸土據陰以召陽實有聯絡相應之妙此所以治內傷治外感均可隨地奏功無顧此失彼之隔閡也小茈胡湯茈胡桂枝乾薑湯以胸脅滿結而用牡蠣所謂主傷寒寒熱溫瘧灑灑中驚恚怒氣者然驚恚怒氣所以為胸脅滿結何故夫當潮盛漲之時其氣正如怒而不泄惟其怒而不泄斯噴沫聚泡湧於水上乃遂不與水化而隨水激蕩倘適與崖石相著日久遂成有生之物以與水相吞吐人之陰盛漲而寒陽盛漲而熱其飈舉風發之時豈無怒氣當先如噴沫如聚泡者其混處寒熱中者仍隨寒熱為聚散其適著於窔奧之區則遂凝結不散而滿且鞕矣治之以牡蠣是欲致生氣於其間使仍與寒熱相化而俱消也然則腰已下水氣百合病渴不已亦豈噴沫聚泡所可擬耶是則不然是皆病在下而其源在上牡蠣澤藛散證水畜於下上焦之氣不能為之化故類萃商陸葶藶以從上下降澤藛水藻以啓水中清氣上行栝蔞牡蠣則一以上濟其清一以下召其濁而使之化耳況栝蔞牡蠣散證原係百合病既歷久變渴又彌久不差則為上已化而下不化用栝蔞生上之陰以和其渴用牡蠣為下之橐籥吸已化之陽使下歸而化陰濟上之亢通下之道俾溺時得快然百合病遂淨盡無餘又何不可惟侯氏黑散之治四肢煩重心中惡寒不足是陽氣困於內而浮越於四末既以桂朮細辛乾薑振作其中陽矣召四末之陽使歸於內者誰耶則牡蠣之用可知矣因是識召陽歸陰非止一端凡上為陽則下為陰外為陽則內為陰均可以是推之者也文蛤即海蛤之有文理者大者圓三寸小者圓五六分即今吳人所食花蛤也其形一頭大一頭小殼有花斑參唐本夢溪筆談夏小正季秋之月雀入於海為蛤安氏名吉無錫人嘉慶中著有夏時考曰雀羽蟲也羽蟲屬火火炎上故鳥上飛曷為入海而為蛤蓋九月火伏於戌十月純陰金水之令故羽蟲感之而化也蛤屬水水性下故下潛秋冬水勝火雀為蛤象火之伏於水也又離為火為雉為蚌雀雉之類蛤蚌之類外剛內柔皆離之變化也因而思傷寒論病在陽應以汗解之反以冷水噀之若灌之其熱被劫不得去彌更益煩肉上粟起意欲飲水反不渴者非火厄於水而何金匱要略云吐後渴欲得水而貪飲微風衇緊頭痛者非火之溺於水而何惟其火在水中而病故以火入水中而生者治之然厄於水者惡水惡水則火與水未相浹也故直以是使水中之火仍暢茂得生而可已溺於水者喜水喜水則火與水漸相浹矣故必合麻黃杏仁甘草石膏湯加薑棗以清發之乃能已也惡瘡者火為津液所裹五痔者至陰之處為火所伏生動其火正欲其得出於水也則夫咳逆胸痹腰痛脅急鼠瘻義皆附此矣夫血亦水屬也倘使火得入其中而迫逐焉致男子為大孔出血女子為崩中漏下亦必令火有生氣乃能不與血為患也橘樹高丈許其性直竦枝葉不相妨又畏霜洞庭四面皆水水氣上騰能辟霜故生是者為最佳枝多刺其葉兩頭尖緑青色面大寸餘長二寸許四月著小白花甚香結實至冬黃熟包中有瓣相向橫砌瓣中有核圓白而微尖種類不一以不接而種成者為上參事類合璧嘉祐雜志文昌雜録張隱庵曰橘實形圓色黃臭香肉甘脾之果也其皮氣味苦辛性主溫散筋膜似絡衇皮形似肌肉棕眼如毛孔乃從脾胃大絡外出於肌肉毛孔之藥也若中宮濁氣留聚則假氣成形而為瘕熱逆氣則橘皮能達胃絡之氣出於肌腠而中之留聚自通若脾不能為胃散精布氣則水穀之氣遂有壅滯而不利橘皮著肉之膜宛如脾胃相連之絡藉其芳香辛苦以通達之水穀自利矣劉潛江云橘皮味苦辛適均而氣溫若但據其苦泄辛散溫行以為與他行滯氣之物等則誤矣本經於此獨取其利水穀夫後天之氣即水穀氣合於真氣以充身者也水穀利則水穀之氣暢茂而真氣得其助盧氏謂上焦開發宣五穀味熏膚充身澤毛若霧露之溉橘皮有焉夫氣生化於脾肺本以流行為無病寒熱升降或愆常度皆能滯著為病橘皮則無間寒熱升降補瀉之劑胥得合之以奏績而水穀之氣所以充於身者亦能盡其常矣愚按二家論橘皮之所以然善矣特張氏僅及胸中氣而未盡瘕熱逆三字之義夫瘕則有形熱則非寒逆則上衝必盡此三義胸中瘕熱逆氣方確切也瘕之為病借氣聚以成形依物象而成質逮氣散物消則形質亦隨而消散故仲景書有所謂固瘕者有所謂癥瘕者有所謂寒疝瘕者皆其物在上以瘕字足之此則瘕在熱上亦可見因氣聚而成瘕因瘕停而生熱與中寒多食大便不通之固瘕陽明篇寒熱整月不罷之癥瘕瘧病篇趺陽衇緊腹中痛之寒疝瘕水氣篇為不同矣大率瘕之在下者多依寒在中者多依血故固瘕必大便初硬後溏寒疝瘕下之方胸滿短氣而癥瘕為寒熱難止與瘕熱之在上者多因氣而其病為逆氣者又自不同也因熱而瘕則其治在熱因癥瘕而熱則其治自應在氣氣散則非特熱解即逆氣亦隨以平不然味辛性溫之物又豈治熱治逆者耶觀仲景於橘皮僅用以治胸痹胸中氣塞短氣橘枳生薑湯若乾嘔噦手足厥橘皮湯若噦逆橘皮竹茹湯而不以治瘕治熱亦良以瘕熱由氣積而成其著象自仍在氣但得氣通且平即瘕之與熱又何所容哉棗木赤心有刺四月生小葉尖觥光澤其地須牛馬履踐令堅實荒穢則生蟲害棗矣五月開小花白色微青時大蠶方入簇以竹枝擊其枝間振去狂花花繁則不成實六月結實色青白至八月全紅則撼而落之以暴乾者為上正月一日日出時反斧斑駁椎之名曰嫁棗不椎則花而無實斫則子萎而落參齊民要術綱目大棗木紅生刺實熟必丹詎非全稟火德而味甘性緩臭香又純乎屬土以是確為以火生土之物夫火之生土豈以凡火遇物輒令灰燼成土類哉亦良以氣相嬗耳蓋棗本聯木火之德成合火土之用者也夫以味甘性緩臭香之物苟無火氣運用其間則能滯物而不能動物惟有火氣運用則以補中遂能托心腹之邪以安中遂能行十二經之氣以平胃遂能通九竅之出納矣是何也寒邪著人中氣不足以逐之緣少氣也桂枝湯小茈胡湯之類熱邪著人中氣不足以逐之緣少津液也黃芩湯越婢湯之類衇結代心動悸十二經之氣不足也火逆上氣咽喉不利津液不足而胃氣不平九竅不和也炙甘草湯麥虋冬湯推安中之極功能使氣之亂者收則除大驚矣推助十二經之極功能使經氣嬗代者無留滯則除四肢重矣入散劑以安中養脾平胃入補劑以助經氣際邪氣則謂之和百藥也實與甘草之解百藥毒殊又與石蜜之和百藥異矣或曰火土相合則土燥而非生物之土矣曰此則言火土之相爍而非相合也日火之最盛地土之最盛而土潤溽暑大雨時行偏係日在北陸與地對衝時其時也萬物暢茂草木森蔚可謂土燥不生萬物乎棗肉厚含津津液緊帖於肉不能擠泌而分非如他物可壓而取汁也不似土之潤耶即投於火而燔之則液隨火消而成燼不似溽暑之溼在熱中耶而其時之氣雲龍升降也風雷激蕩也以愈閟而愈伸不似棗之質滯膩而性疏通耶則別録所謂益氣強力除煩悶心下懸者亦已得其最奧之旨矣腸澼者津液敗而流不緊帖土中也故亦能治之傷寒論金匱要略兩書用棗者五十八方其不與薑同用者十一方而已大率薑與棗聯為和營衛之主劑薑以主衛棗以主營故四十七方中其受桂枝湯節制者二十四受小茈胡湯節制者六所以然者桂枝小茈胡俱調和營衛之劑也桂枝湯治邪之軒輊於營衛小茈胡湯治邪之出入於營衛曰病常自汗出者此為營氣和營氣和者外不諧以衛氣不共營氣和諧故爾復發其汗營衛和則愈非邪之軒輊耶曰本茈胡證反下之茈胡證仍在者復與茈胡湯此雖已下之不為逆必蒸蒸而振卻發熱汗出而解非邪之出入耶邪之軒輊彼此輕重之謂也邪之出入則無彼此輕重第不能禦而阻之任其欲來則來欲往則往爾其可同用薑棗何也蓋營者榮養也衛者捍衛也榮養者非能禦而阻之欲其禦而阻之不望捍衛者而誰望病常自汗出者視其外似衛盛而營虛究其實則營和而衛疏故再進一步則曰發汗後身疼痛衇沉遲則加生薑矣蒸蒸而振者淺窺之似營強而能託深揣之則衛壯而能振故再退一步則曰脅下痞鞕則去大棗矣是何也以邪在營衛之間固欲其出不欲其入也然薑棗之和營衛薑優而棗劣歟則又非矣觀夫不同薑用之方若當歸四逆湯茯苓桂枝甘草大棗湯同薑用之方若炙甘草湯橘皮竹茹湯皆用棗較之茈胡桂枝為重則以能安中故爾夫中不安則營烏能和衛烏能振且衛之振正以營和之力此實用薑棗之界畫棗之安中和營尚不可見耶果如是則與薑同用之十七方不受桂茈節制者遂無與於營衛歟此蓋有二焉皆有涉於營衛一者營衛之氣為邪阻於外欲開而出之又恐其散之猛也則麻黃劑中加用之以防其太過大青龍麻黃連軺赤小豆越婢桂甘薑棗麻辛附子文蛤等方一者營衛之氣為邪阻於內欲補而達之又恐其補之壅也則人參劑中加用之以助其不及生薑瀉心旋覆代赭吳茱萸橘皮竹茹炙甘草等方防之於外者欲其力勻稱故分數仍桂枝茈胡之法助之於內者欲其和裏之力優而後外達能鋭故棗重於薑此實用薑棗之權輿棗之功能尤於是足見者也其他雖癰膿之在腠理疼痛之在腹內似誠無與於營衛矣而欲排而出之調而達之則仍不能不藉營衛之通行排膿小建中等方可曰用薑棗者無涉於營衛哉然則離薑論棗當無涉於營衛矣豈知轉有以帖切於營氣者棗之為木肌理膩致體質堅嫩宜為至靜之物矣乃令節元辰偏宜斧斤椎擊之非至靜偏喜動耶其花青白幽潔繁茂星布宜為至密之物矣乃開放盛時偏宜杖竹振而落之非至密偏喜疏耶故其實皮寬肉厚味甘性緩氣平俱應乎靜偏能主病之動者營之為氣亦靜矣然其自中焦受氣變赤以來首於胸中行手太陰以次而手陽明足陽明遞至手足厥陰復轉於手太陰潛行暗轉內遍臟腑外徹骨節無一息暫停可謂與靜而喜動有合否其不宜盛不宜衰須恰當其可倘過盛則壅為癰膿溢為吐衄墜為崩漏甚至結為癥瘕滯為臌脹可謂與密而喜疏有合否津液之為物周徹上下遍敷內外實與營氣通連是故崩漏吐衄或至盈盆成桶而未止人之血不若是之多也其所以然者則曳津液皆為血耳人之汗出或至衣被透溼接連時日而未止人之津液不若是之多也其所以然者則曳血皆為津液耳夫棗配薑而論則治血者也離薑而論則治津液者也何也夫血主於心津液彙於腹棗固主心腹不正之氣者也欲其外行恐其太泄越則以棗輔散發之物使循經由軌潛行暗達無一往無前之決裂欲其內守恐其太凝滯則以棗輔補益之品使展布灑陳不遺不濫無壅淤泛濫之積弊此棗之所以為棗與他緩中補益之藥不同者也雖然棗之為棗其功遂盡於此哉上吐下利倉皇奔迫得此則守其津液之外馳半夏瀉心湯甘草瀉心湯水飲壅淤勢宜峻逐得此則抑藥性之太過固元氣之遺餘十棗湯葶藶大棗瀉肺湯水不化津液不澤槁下氣上逆得此則緩其迫促調其衝激苓桂甘棗湯麥虋冬湯邪氣內橫欲越不達欲泄不利得此則馴其急躁消其衝突黃連湯黃芩湯其他聯補藥散藥之不和薯蕷丸通病情治法之相梗附子粳米湯具涵育性情之標韻甘麥大棗湯其功偉矣即反而溯其所以治營衛津血之故又豈有他致哉小茈胡湯證若脅下痞鞕者去大棗加牡蠣甘草瀉心湯生薑瀉心湯旋覆花代赭石湯證皆心下痞鞕而用大棗何也夫本經固曰主心腹邪氣不曰主脅下正可見本經字字不苟仲景絲絲入蔻耳且主心腹邪氣者豈謂泛主心腹間邪停氣滯哉必心腹間因邪氣而中不安脾失養方是大棗所主今三證之痞鞕特於甘草瀉心條注云此非結熱但以胃中虛客氣上逆故使鞕是豈特於安中養脾有合不又於平胃氣有合耶然則痞硬與痞滿何別小茈胡證多有脅下痞脅下滿而不去大棗者又何故夫痞滿陽邪也痞鞕陰邪也是故大黃黃連瀉心湯之痞曰按之濡生薑甘草兩瀉心湯之痞曰痞鞕胸中陽位也脅下陰位也陰邪踞陽位自必以體陰性動者輔正以袪邪陰邪踞陰位則當以體陽性靜者治之矣牡蠣有牡片而無牝片是為純陽而其體質如石又為陰若夫陽邪踞陰位則猶之乎陰邪踞陽位也是故脅下痞脅下滿非以棗治之也特不如脅下痞鞕之忌棗耳棗之治自在中本經之訓可案也然則火逆上氣非氣之有餘耶懸飲內痛非津液之有餘耶而麥虋冬湯十棗湯偏用大棗何也夫氣不下歸而上逆津液不宣布而懸結猶得為有餘哉惟其不足故至是耳且此兩者猶有不同處未可一律論也麥虋冬湯是養脾氣不足平胃氣上逆欲使其由營氣而流轉一身十棗湯是用藥過峻恐不特泄去其飲將盡人之津液胥泄之故以棗約束營氣而存津液也物之性豈拘拘於一偏明者用之自當任材器使而不局不濫斯可矣金匱要略曰病有賁豚有吐膿有驚怖有火邪此四部病皆從驚發得之據本經大棗主大驚宜無不可用矣而不必悉用何哉夫本經固言之矣曰身中不足大驚不可截去身中不足僅以大驚二字概之也其有非身中本不足而用棗者必緣誤治其義只在傷寒論曰少陽不可吐下吐下則悸而驚是故茈胡加龍骨牡蠣湯下後證也桂枝加桂湯發汗及燒針後證也茯苓桂枝甘草大棗湯發汗後證也賁豚湯證則未經誤治故獨不用棗若夫千金風虛驚悸二十三方用棗十一方其方有用獨活細辛羌活白蘚皮銀屑大黃石膏蜀椒菖蒲防己鐵精麻黃者即不用棗於此見棗之治驚但治實中之虛虛中之虛而虛中有實者則其所不能任若實中之實又所不待言矣麻子一類二種斑黑者實饒而皮縷粗惡名曰苴白色者無實而皮縷韌密名曰枲其花謂之勃苴黃枲白苴以採實供籩豆實及作油枲以剝皮析縷作布皆欲得良田不用故墟夏至前布種出大科長三四尺莖方有稜葉狹而長如益母草一莖七葉或九葉宜以流水澆之無流水而用井水則宜曝之以殺其寒六月放勃隨即結實若欲採實即宜拔去白花者否則子不成實實有殼極難去當以帛包置沸湯中浸至冷出之垂井中一夜勿令著水次日日中暴乾就新瓦上挼去殼簸揚取仁則粒粒皆完參齊民要術禮疏綱目劉潛江謂爾雅翼言麥黃種枲枲黃種麥是麻生於木火正旺之時成於金水方饒之日故麻子仁之為用能於木火焦殺中生金水柔滋之化即能於金水滂沛中成木火通明之功唯其金水克諧水火迭化是以中土升清降濁之機栝不愆一身皆受其廕本經謂其補中益氣久服肥健良由乎此是誠能揭麻子仁功用之要神農經奧窔之祕矣特別録所載破積血復血衇乳産餘疾沐髮長潤功能多半在血謂皆由於氣充血乃調容或有未盡然者夫中焦受氣為血決氣篇不誣矣不可為心主血之驗乎心為丁火下交壬水而化為木不可為益乙肝之氣之證乎乙肝受益下交大腸而化為金以行其柔滋之氣而通降者不滯是即血能行氣之源仲景製麻仁丸治脾約取裁之所在矣決氣篇又曰上焦開發為氣氣不主於肺乎肺為辛金下交丙火而化為水不可為益癸腎之血之證乎癸腎受益上交戊土而化君火以行其明爽發越之氣而升者不滯是即氣能調血之源仲景製炙甘草湯以復衇取法之所在矣惟丁壬能化木則肝木澤其所藏之血自行而不積産乳自無餘疾唯辛丙能化水則腎水強其所藏之水自不至因氣乖而腫因氣阻而溺塞矣治風先治血緣血不行招風取中者尤宜仗澤血液之物髮乃血之餘緣血不榮心而枯短者允當用復血衇之劑此別録宣闡藥物之詳確能補本經之未備者也麻仁與地黃皆最能拔地力齊民要術所謂種苴欲得良田不用故墟是也故亦最能生陰津其相比入炙甘草湯則以地黃善宣陰津於陰分麻仁善宣陰津於陽分也其在麻仁丸與芍藥同用則以芍藥善破陰結布陽氣麻仁善行陽滯布陰氣也入陰入陽者物之生理所謂性也破結行滯宣布陰陽者物之能事所謂情也性之與情猶輿馬相輔而行是何也麻仁丸中有小承氣湯即不用麻仁芍藥杏仁不患其大便不通炙甘草湯有人參麥冬地黃即不用麻仁不患其衇不復然復衇通便是二方作用之一端不能會二病之全局故麻仁在炙甘草湯為人參麥冬地黃之先聲以其氣鍾於至陽易入上焦引亢陽為生陽人參繼之為鼓元氣之韋備麥冬繼之以生胃衇之絶地黃繼之以行衇中之血也其在麻仁丸又為小承氣湯之後徑以枳實厚朴鋭而行氣大黃芍藥破而通血皆舉轡疾馳絶無停軌治胃實之不大便有餘治脾約之大便難不足非得杏仁之潤降麻仁之滑澤脾必暫展而復約也此是物之情若其性則極柔之物稟生氣於至陽原係物之常理第麻仁不僅屬陰以其有雌有雄雄之用在皮雌之用在實若概以根實升降之義則其能伸陽於中充陰於外無疑矣若夫種苴須雜以枲及當開花又將枲拔盡是其初則能令陰陽相守繼則能令陰津長裕無疑矣其葉之數不以四不以六唯七之少陽九之老陽是其用之所在譬之於人體氣偏陰者嗜溫體氣偏陽者嗜涼稟陽剛者其作為爽直稟陰柔者其作為廉靜以是知麻仁為物其秉賦雖陰功效悉在陽矣至其殼之堅韌難去須先迫之以熱乃再激之以寒後復暴而乾之挼而去之易易耳不又可知其所謂柔者必伏剛中其所謂剛者必寒熱交和而後代耶善體物者宜識之飴凡穀之黏者皆可為之漬過蒸熟每一石用大麥糵一斗八升和水磨汁傾入其中少假即生飴如蜜而稀色如膠所謂膠飴是也其稍乾者謂之餳其熬令乾鞕牽而色白者謂之糖盧芷園曰糵米作飴宛似水穀入胃醞釀作汁出入未定之時也可以澄飲可以成血然甘能緩中投之不當反致濡滯陶隱居云酒與糖竝米麥所為而品分中上良緣糖以和潤而優酒以醺亂而劣愚謂麴糵雖皆麥所為然麴先屑粉而後盦造為拗折其生氣糵浸令生芽而後磨粉為引動其生機然皆令消米質使成液也酒釀久方成糖片時便就久釀者性反迅速成者性反緩何歟夫拗折者鬱彌久而性益猖生發者萌旋達而氣已暢故酒為緩物之報使糖實急劑之柔佐也然虛煩虛痞虛腫虛滿俱有確證可指其籠統言之者有虛勞虛損虛羸虛弱能知熇熱之為勞傳變之為損尪瘠之為羸疲軟之為弱則乏之為乏亦可擬議得之夫行而無資謂之乏人身之行者非氣血而何夫反正為乏非氣血之當行不行而何人身一天地也噓故納新環周不休氣之道也十二經衇十五大絡血之道也其資皆稟於脾則虛乏者不可謂非脾氣不給矣脾氣不給參芪朮草皆能助之資此獨何藉於飴糖夫補虛乏已下遂繼之以止渴去血則芪朮者皆與渴無干且朮能去溼不能滋燥芪能充外不能充內參草能充內且滋燥矣又與血無干以是見此虛此乏斷非參芪朮草所能補矣雖然虛乏而氣不能行且渴者固多又何以知有當去不去之血夫仲景用飴糖多在建中湯建中湯證多有腹痛此血當行不行之驗也是故飴糖非能去瘀血也能治血當行不行為腹痛者耳故傷寒論金匱要略用建中處甚多然止云治腹痛不云下瘀血或謂本太陽病醫反下之因爾腹滿時痛者桂枝加芍藥湯主之則治腹痛者芍藥之功非飴糖之力也此誠有辨焉何則傷寒陽衇澀陰衇弦法當腹中急痛者先與小建中湯虛勞裏急悸衄腹中痛夢失精四肢痠疼手足煩熱咽乾口燥小建中湯主之虛勞裏急諸不足黃芪建中湯主之婦人産後虛羸不足腹中刺痛吸吸少氣或苦少腹中急攣痛引腰背內補當歸建中湯主之婦人腹中痛小建中湯主之是知桂枝加芍藥湯所主是滿痛小建中湯所主是急痛矣桂枝加芍藥湯即小建中湯少飴糖耳下後邪氣內傳為滿痛是實虛勞産後腹痛是虛僅飴糖一味之轉移治證遂虛實不侔猶不可見飴糖善補虛乏耶桂枝湯在傷寒所治證多矣茲則吸吸少氣也咽乾口燥也裏急腹痛也腹中刺痛也少腹急攣也皆非桂枝湯所曾治以是知即飴糖之功矣蓋土滯以木而疏土虛以木而困故少氣咽乾口燥是脾乏穀氣裏急腹痛乃肝氣侮脾飴糖之柔潤芳甘正合脾家土德而即以緩肝之急以肝固罷極之本虛乏之所從來也是故桂枝加芍藥湯無飴糖即不名建中桂枝加黃芪湯不加芍藥不用飴糖即不名黃芪建中而蜀椒乾薑人參協以飴糖即名大建中是知建中固以飴糖得名耳然則其所謂大小者究何義耶夫以勢合勢分分大小則小建中用芍藥桂甘生薑得十五兩又益大棗十二枚大建中用人參乾薑僅五兩止益以蜀椒二合乃同用飴糖一升則飴糖在大建中湯獨多而勢合在小建中湯體均而勢分此一說也若以力專力薄分大小則辛甘為陽酸苦為陰大建中純用甘辛則力厚氣專小建中兼用酸苦則力敵氣薄此又一說也總之兩建中皆以飴糖為君君尊而臣從命則為大君卑而臣擅命則為小此實大小得名之確指歟而飴糖之所以尊於此益可徹悟矣太陽病小便利者以飲水多必心下悸小便少者必苦裏急也解此者謂緣飲水多乃心下悸故悸皆為飲水侵心殊不思小建中湯所治之悸亦可以水飲言乎故夫悸有心中自動者心液虛也有他處動而連及心者水飲也而水與飲又復有別則以下焦外連衛氣其地曠蕩水飲居之則能上衝外薄渺無涯際故為水上焦之約束嚴水飲若在終不能肆故僅為飲稽之傷寒論所謂傷寒厥而心下悸者當先治水宜服茯苓甘草湯卻治其厥不爾水漬入胃必作利太陽病發汗汗出不解其人仍發熱心下悸頭眩身瞤動振振欲劈地者真武湯主之是上焦之悸也發汗後其人臍下悸者欲作賁豚茯苓桂枝甘草大棗湯主之是下焦之悸也兩者一曰心下悸一曰臍下悸皆係他處連及之文故均為水飲至傷寒二三日心中悸而煩者小建中湯主之傷寒衇結代心動悸者炙甘草湯主之不曰心下臍下而直曰心中固可知為心之虛矣蓋心之用在陽而體屬陰故其取象協於兩陽外麗一陰內守之離自動之悸為內陰欲出而陽不安連及之悸為外陰內侵而陽不安同為陽不安而驗於自動與連及猶不豁然可覩耳但炙甘草之悸與小建中之悸又何以異也夫曰衇結代心動悸是陽之躓曰心中悸而煩是陽之盛陽躓者當滑澤其道路陽盛者當開闢其途徑滑澤其道路則地黃麥冬之功開闢其途徑則重用芍藥之力而其能使陰陽巽而相入在炙甘草湯則麻仁阿膠在小建中湯則膠飴之為功大矣麻仁阿膠能使水定而火凝飴糖則能使火靜而水生此則煩與不煩為炙甘草湯小建中湯界畫者也然觀於發汗過多其人叉手自冒心心下悸欲得按用桂枝甘草湯可以知心液虛之故即可以知炙甘草小建中皆用桂枝甘草之故特彼以汗後液隨汗泄此不注明治後且獨標二三日可見為心液自虛耳盧芷園曰葵有多種冬茂者曰冬葵字從癸從冬皆屬於腎其子易生用治胎産自然入神其花向日而傾有返顧衛根之義觀其能通小便又能治多溺蓋可見矣外臺祕要消中日夜溺七八升用冬葵根五斤水五斗煮三斗每日平旦服二升本經主五臟六腑寒熱羸瘦五癃蓋寒熱雖欲其通然過通則五臟六腑之氣不藏能致肌肉羸瘦水氣雖欲其藏然過藏則溺道泣澀能致小溲閉塞葵性滑養竅能使藏者通返顧衛根使能通者藏若病屬久藏而發者如淋如帶如痘疹如死胎如丹石毒如消渴如癰腫沒頭如腸癰胃疽如肉錐怪證皆有奇徵第有風疾宿病天行病後曾被犬傷者忌之世人但知其能發宿疾不知其能使宿疾不留免他日卒中之虞正其功耳凡物之生各有至理葵多子性滑多子者歸腎性滑者利竅又其花向日而傾返顧其本故仲景於妊娠有水氣小便不利頭眩用葵子茯苓散夫他物利水徑情直行豈復返顧則當防其導胎下墜且小便不利在極下頭眩在極上焉能聯絡為一一味之用具此兩義其精有如此者至別録所主婦人乳內閉腫痛亦取其滑以開閉其色白衛根仍不外返顧血海之義擴而充之其功蓋不止是二者而已甜瓜仲春種之掊坑大如斗納瓜子四枚大豆三枚瓜既出土生數葉則搯去豆以初生蔓弱須假豆扶以出土若豆長又恐搧瓜也地須多鋤則子饒引蔓延生長或以丈計葉大數寸五六月開黃花六七月瓜熟形色不一用瓜蒂須團而短色青緑者良收子須拌鹽藏方不死參齊民要術綱目盧子繇曰瓜象實在鬚蔓間也蒂瓜之綴蔓處也性偏蔓延末繁於本故少延輒腐爾雅云其紹瓞疏云繼本曰紹形小曰瓞故近本之瓜常小近末之瓜轉大也凡實之吮抽津液惟瓜稱最而吮抽之樞惟蒂是以瓜蒂具徹下炎上之用乃蒂味苦而瓜本甘以見中樞之所以別於上下內外誠湧泄之宣劑通劑也劉潛江曰瓜以二月下種蔓延而生是由風木以達水花於五六月其色黃是秉火氣以致土乃吐花即有蒂蒂味苦實即結於蒂上而味甘是又為達水氣以至土其所以舍甘而獨用苦者正以苦能達甘之用也甘之用云何蓋不止達水以至土更先能達水以至火也故蒂之苦其氣本於火瓜之寒其氣暢於水觀其末大本小可知厚孕於水氣火原在水中至夏而火畢達火之畢達正水之畢達也夫土之甘本備四氣而以水火為用至於水火畢達則土之用乃得際於極上胃氣之至於肺以布四臟皆由此也即是以思則其療諸證之功如火能達則風與熱之為患者俱散水能達則溼與寒之為患者俱散水火既達土亦自達矣何況溼熱黃疸其病原在土之體又何不達之有哉觀病如桂枝證頭不痛項不強寸衇微浮胸中痞鞕氣上衝咽喉不得息者此為胸有寒也當吐之病人手足厥冷衇乍緊者邪結在胸中心中滿而煩飢不能食者病在胸中當須吐之皆瓜蒂散主之太陽病中暍身熱疼重而衇微弱此以夏月傷冷水水行皮中所致宜一物瓜蒂湯則知瓜蒂之治胸中實矣觀少陰病飲食入口即吐心中溫溫欲吐復不能吐始得之手足寒衇弦遲者此胸中實不可下當吐之若膈上有寒飲乾嘔者不可吐當溫之則知雖胸中實但兼乾嘔遂不可用矣觀胸上諸實胸中鬱鬱而痛不能食欲使人按之反有涎唾下利日十餘行其衇反遲寸口衇微滑此可吐之吐之利即止則知雖喜按下利但胸中實而痛即可用矣觀太陽病當惡寒不惡寒關上衇細數為吐之過則知凡胸中未痞鞕者皆不可吐矣所以然者瓜蒂屬火為土防水之門閾乃抽吮土氣之物非抽吮水氣之物故主吸地中滋潤以益瓜凡栽瓜者必使其蔓不著田塍若田塍燥則蒂反浥瓜中脂液以救蔓田塍有水則蔓爛蒂落此瓜蒂之僅能抽吮寒氣熱氣溼氣而於水飲則忌之於土之燥者益忌之是吐後腹中飢口不能食不喜糜粥欲食冷食所由見也然則宿食在上者宜吐之則非寒熱溼而與水飲同為有形之物矣此又當作何解夫吐水多係虛證吐食多係實證以土著水則淖非若他物之著土但去其物土猶夫故者比也瓜瓣即瓜子唐本注稱其主腹內結聚破潰膿血最為腸胃脾內壅要藥核之金匱治腹裹膿血之腫癰千金治咳吐膿血之肺癰若合符節蓋瓜之中裹大津液為瓤子即依於瓤內瓤善潰爛子終不因之爛則其能於腐敗之中自全生氣即善於氣血腐敗之中全人生氣矣豫嘗倣是意用治痰之濃厚色黃者多有效由是推之其可用處亦不少矣中品石三味草七味石為從土化金雄黃尤鬆脆易解是質僅似金土性未除且成塊時赤如雞冠有光曄曄既研為末則黃如鵝喙黯淡無華其能解土中浮火著於皮膚者何疑凡土中之火必溼與熱久相醞釀乃成故得以雄黃剛土性寒治之而其味辛辛生皮毛故僅能主其在外者即土中實結之火非所能治也觀金匱面赤斑斑如錦文者名曰陽毒則用之若面目青者名曰陰毒則去之可證雄黃能治中土之火著於外者又即可證陽毒陰毒為由土中溼熱醞釀而成矣即雄黃善殺蛇蛇獨非土中溼熱醞釀以成者乎巢元方云鼠瘻者由飲食不擇毒物所化入於腑臟出於衇稽留衇內不去使人寒熱又非由內及外久蓄而成者耶言惡瘡疽痔死肌而不及癰者以癰裹大膿血潰決而出不得為死肌也死肌不必盡由惡瘡疽痔惡瘡疽痔不必盡為死肌惟由惡瘡疽痔而為死肌者方是由中及外久蓄而成之毒乃得以雄黃主之也若有蟲蝕肛雖亦溼熱所化由內至外第既在外而內無他患則取此外治薰而殺之斯已矣石膏生於石中大塊作層如壓扁米糕每層厚數寸色白潔淨細文短密如束針正如凝成白蠟鬆軟易碎燒之即白爛如粉綱目凡物重則應堅澤則應韌辛則多竄寒則多膩石膏體質最重光明潤澤乃隨擊即解紛紛星散而絲絲縱列無一縷橫陳故其性主解橫溢之熱邪也蓋惟其寒方足以化邪熱之充斥惟其辛方足以通上下之道路惟其澤方足以聯津液之灌輸惟其重方足以攝浮越之亢陽譬之溽暑酷烈萬物喘息僅屬不敢自保惟清飈乍動肅降乃行而化隨爽潔於是欣欣然始有有生之樂焉人病中風而至心下逆氣驚喘口乾舌焦不能息者可以異是病寒熱而至心下逆氣驚喘口乾舌焦不能息者又何以異是別録之治暴氣喘咽熱即本經所謂心下逆氣驚喘也止消渴煩逆即本經所謂口乾舌焦不能息也身熱三焦大熱皮膚熱解肌發汗又所以明熱之散漫充斥也惟本經之腹中堅痛別録之腸胃中結氣及腹脹似熱不僅散漫矣夫熱邪既盛內外相連久延不解焉能不與氣結故暫時散漫繼遂脹滿而堅痛然曰腹中堅痛曰結氣腹脹明其尚未與滓穢相結猶可解以石膏也若不待解肌發汗而汗自出腹中滿痛小便自利則其熱已與滓穢摶聚非承氣不為功矣石膏又烏能為心下有水氣肺脹咳上氣而喘衇浮皆小青龍湯證也多一煩躁則為小青龍加石膏湯證核之以大青龍湯之不汗出而煩躁白虎湯之大煩渴不解竹皮大丸之中虛煩亂是石膏為煩設矣但傷寒金匱用石膏者十一方此才得其四其不煩而用者何多也夫陰氣偏少陽氣暴勝外有所挾內有所虧或聚於胃或犯於心乃為煩煩之由來不一本非石膏所主化其暴勝之陽解其在胃之聚非治煩也越婢加半夏湯候曰肺脹咳而上氣其人喘目如脫狀小青龍加石膏湯候曰肺脹咳而上氣煩躁而喘木防己湯候曰膈間支飲其人喘滿心下痞堅麻杏甘膏湯候曰汗出而喘無大熱是石膏者為喘而設歟夫喘有虛有實虛者無論實者必邪聚於氣軒舉不降然邪又有不同茲四喘者皆熱盛於中氣被逼於上則石膏所主乃化其在中之熱氣自得下非治喘也然則石膏氣寒而形津潤本經以主口乾舌焦不能息宜乎必治渴矣乃傷寒金匱兩書用石膏方竝不言渴越婢湯治風水竝證明不渴白虎湯之治渴者必加人參其不加人參證亦竝不言渴豈石膏之治熱必熱而不渴者乃為恰當乎是可知石膏止能治六淫所化之熱矣故仲景用石膏者十一方同麻黃用者六同大黃用者一同防己用者一同桂枝白薇用者一可同人參用者僅二方而一方可同可不同惟竹葉石膏湯卻必與參同用是石膏之治熱乃或因風鼓蕩而生之熱或因水因飲蒸激而生之熱或因寒所化之熱原與陰虛生熱者無干其本經所謂口乾舌焦乃心下逆氣驚喘之餘波故下更著不能息為句蓋心下既有逆氣而遇驚輒甚則其口張不翕焉得不乾不焦然又當驗其能息與否能息則口尚有翕時乾與焦亦有間時矣他如竹葉石膏證之欲吐竹皮大丸之嘔逆皆適與用石膏相值亦可知為熱致虛因虛氣逆解熱氣自平氣平嘔吐自止非石膏能治嘔治吐矣說者謂麻黃得石膏則發散不猛此言雖不經見然以麻杏甘膏湯之汗出而喘越婢湯之續自汗出證之則不可謂無據矣麻黃為用所以從陰通陽然陽厄於陰其源不一有因寒凝有因熱壅故其佐之者不用桂枝則加石膏桂枝文理有縱有橫石膏則有縱無橫縱者象經橫者象絡經絡竝通與及經不及絡者其優柔猛烈自是不同況因寒者所謂體若燔炭汗出而散從丹溪章句固其所當然也因熱者乃陽猖而陰不與交欲使陰交於陽非泄熱不可第徒泄其熱正恐陰反肆而迫陽故一面任石膏泄熱隨手任麻黃通陰使陰之鬱勃者隨陽而泄柔和者與陰相交是以石膏協麻黃非特小青龍加石膏湯厚朴麻黃湯越婢加朮湯越婢加半夏湯文蛤湯其禁忌較之大青龍湯麻黃湯為弛即如所謂麻杏甘膏湯越婢湯者竝有汗亦治之可見其汗乃盛陽之加於陰非陰陽交和而成亦非營弱衛強而有矣矧證之以千金用越婢加朮湯治肉極熱則身體津脫腠理開汗大泄顧何謂耶夫亦以熱盛於中內不與陰和而外迫逐津液與才所論者無異特恐通其陰而陰遂逆故凡兼惡風者即於湯中加附子耳尚不可信麻黃石膏竝用可治汗出耶然則桂枝二越婢一證謂之無陽者又當作何解夫發熱者太陽之標惡寒者太陽之本熱多寒少標盛本微矣而衇反微弱則非因陽不足乃表陽內伏也表陽之所以內伏正為其本寒將盡無事與相拒於外耳故曰無陽然陽者津液之所從化汗之所由出也不泄其標熱而從陰中通其內伏之陽表氣於何而和營衛於何而調故取桂枝之二以解外取越婢之一以通中此其義也風寒摶熱用麻黃石膏泄熱通陽既知之矣水飲與熱其不相入正同冰炭何亦能合為患耶不知寒與熱猶本異而末同水與熱更本同而末異何也夫寒在人身被陽氣激而化熱既化則一於熱不更為寒水則本屬太陽原能盛熱是以寒既化熱熱已而寒無存水中挾熱熱去而水尚在其同用麻黃在寒化之熱止欲其通陽在水挾之熱更欲其去水矣雖然水與飲固有分且同為水復有近表近裏之分曰風水惡風一身悉腫衇浮不渴續自汗出無大熱越婢湯主之此比於大青龍者也故麻黃分數多曰吐後渴欲得水而貪飲者文蛤湯主之兼主微風衇緊頭痛此比於麻杏甘膏者也故麻黃分數少曰裏水越婢加朮湯主之此則比於麻黃附子甘草湯矣以其是水與熱而非寒故不用附子而用白朮石膏是二證近表一證近裏既彰彰然矣若夫飲則非如水之無畔岸可隨處橫溢也則必著臟腑而後為患曰咳而上氣此為肺脹其人喘目如脫狀衇浮大者越婢加半夏湯主之此著於上者也曰膈間支飲其人喘滿心下痞堅面色黧黑其衇沉緊得之數十日醫吐下之不愈者木防己湯主之此著於中者也著於上者比於表故用麻黃著於中者比於裏故不用麻黃石膏則皆不可闕者也然服木防己湯虛者即愈實者復發則去石膏加茯苓芒消夫曰實乃去石膏不去人參似其助實反在石膏矣然膈間支飲則喘滿色黑固其宜也其關節只在心下痞堅衇沉緊二者痞猶可以桂枝下之堅則非芒消不為功矣痞由於飲猶可專以防己通之飲而至堅則非兼用茯苓不為功矣其用人參石膏取義原與白虎加人參同欲其泄熱生津為已病數十日曾經吐下也屢經剝削繼得和養自然立能應手然終以痞堅而衇沉緊非剝削已極之徵第初投之能獲效必飲中之熱得清而解其再發也縱有熱亦殺於前況經再與前方不愈則病雖不去而熱未必復留矣故於前方去石膏加茯苓芒消不去人參者一則尚緣剝削之餘一則所以馭防己芒消之暴也凝水石生於鹵地積鹽之下精液滲入土中年久至泉結而成石大塊有齒稜如馬牙消清瑩如水晶亦有帶青黑色者皆至暑月回潤入水浸久亦化綱目水必死而後鹹借土為倚伏則生氣復著矣其有受烹於火日結為鹽者性遂轉溫其有才經烹煉自滲入地得成晶瑩如石者歲久火退既未接乎黃泉尚鍾氣於膏壤以形體論則金也然其源本水其所趨亦水故雖伏土中遇水能化陶隱居云末置水中夏月可使為冰是其陰凝之甚肅厲之嚴純乎寒化似非他物能間而其味乃辛則仍能外達皮毛非僅寒中一節已也身熱腹中積聚邪氣是內為本外為標皮中如火燒煩滿是外為本內為標均可以是化水飲之者蓋是物之生原貫徹水土標本當其為水之死固已背陰向陽逮與土化烹煉為鹽則轉而溫乃不肯保其溫復溜於下以變為寒仍與水化而味猶辛則其假散而聯為聚即聚而復為散昭然矣身熱皮中如火燒散也腹中積聚邪氣煩滿聚也聚而能散則在內者釋散而終不能聚則在外者已又何必究其為標與本哉風引湯入此於中以治外熱內滿亦可見其滿之不僅為實而熱則已造其極故與大黃石膏滑石伍以勝外熱而內之滿終不能廢乾薑桂枝矣薑宜原隰沙地四月取母薑種之五月生苗如初生嫩蘆高二三尺葉如竹兩兩對生辛香可愛秋社前後新芽頓長如列指狀色黃尖紫謂之紫薑亦曰子薑釆食無筋自此以漸充壯霜後則老謂之宿薑即母薑也薑惡沮洳又畏日畏熱凡秋熱則無薑故六月間須作葦屋蓋之參齊民要術圖經綱目作乾薑法取白淨堅結者水淹三日去皮置長流水中六日更刮去皮曬乾置瓷缸中釀三日乃成弘景物之燥者不惡溼為恃其氣足以禦之也物之溼者不畏熱為假其氣足以助之也薑則偏生沙燥之地厭惡沮洳且復畏日至為蓋葦棚以避酷暑又曰秋熱則無薑是何故哉蓋四時遞嬗六氣流遷百物生長收藏其間拈一物而諦審之似若氣依物為轉旋究其實理則何物非因氣觸動也耶薑以中夏發生是感火氣以動矣故其性溫乃旋交溼令而薑枝葉長茂根株橫溢是感土氣以昌盛矣故其色黃於是金經一氣以培以充逮交燥令而氣乃全用乃具故其味辛統而計之則火者其稟土者其體金者其用貫而屬之則具火性於土中宣土用於金內薑之能事盡矣蓋土者脾也胃也以厚德載物而敷布一身金者肺也大腸也以節宣諸氣而泌清泄濁假使中宮清氣阻遏而不至肺則氣壅於上胸滿咳逆上氣之病生濁氣扞格而不至大腸則氣滯於下腸澼下利之患作原其所以阻遏扞格者非他則以中土無火故使土用乖而金不效其節宣之職火之所以生土土之所以生金考厥機緘端在是也雖然肺為嬌臟既惡痰涎之裹尤畏炎𭶟之鑠與薑之性誠有酷肖者矣獨肺喜清肅薑非致清肅者也以謂土之生金其機在是不更有說乎夫仲景曰太過可怪不及亦然論衇也臟氣何獨不爾薑之用前固曰緣火不生土土遂不生金此中土之火不及也設土中之火太過豈能保其不礙生金乎病果如是原非薑所能治矣薑有生者乾者之別前人謂薑之皮涼故留皮者辛溫差減止能散發是已而猶有未盡者薑桂之性老而彌辣乾薑受氣足足則上達肺下通大腸外及皮毛中鎮沸逆生薑受氣微微則僅能由中及上故止散外感止嘔吐耳不然乾薑所主本經謂其逐風溼痹別録謂其治皮膚間結氣其病咸在皮毛肌肉間此何說耶以五味乾薑治咳於五味子條詳言之矣猶有未盡則用五味不用乾薑也乾薑分數不等也用五味不用乾薑其旨在射干麻黃湯曰咳而上氣喉中水雞聲是痰非飲與水矣觀小青龍湯小青龍加石膏湯真武湯皆曰心下有水苓甘五味諸加乾薑法又皆隸於痰飲則可見乾薑所治為在中之水飲非在上之痰矣至其分數之不等是愈下則愈少愈上則愈多故用一兩者止真武湯二兩則小茈胡湯厚朴麻黃湯苓甘五味加薑辛半夏湯餘則盡用三兩矣雖然真武湯本不用乾薑豈不因方中有生薑乎小青龍苓甘五味諸劑其寒水之不化正在胸中合之本經乾薑主治咳逆上氣前冠胸滿二字為不虛設矣猶不可知薑為脾肺藥耶或問傷寒病之莫急者也傷寒至陽亡陰逆尤病傷寒之莫急者也仲景用乾薑於乾薑附子湯茯苓四逆湯白通湯真武湯四逆湯皆用之至少反於非傷寒之大建中湯甘乾苓朮湯用之最多何也曰此正仲景神明不測處也夫病根有深淺用法有機勢得其間則批郤導窾刃不傷鋩當其鋭則高城深池守猶難固人傷於寒則為病熱是固陰傷局也乃不勝治法之紊致陽越陰搏焉豈誠陽之虛陰之盛耶故曰衇微曰下利曰煩躁曰頭眩身瞤其陽之衰也驟陰之橫也飄忽而無所附固不得僅用乾薑必竝以附子但乾薑既得附子一主其中一主其下一主守一主走若輕車若熟路風行雷動所當必摧所擊必散陰散斯陽歸陽歸斯病已又何恃乎用之重重則不懼有後患耶此其義見於論中所謂下利腹脹滿身體疼痛者先溫其裏乃攻其表溫裏宜四逆湯攻表宜桂枝湯者也夫既用四逆治裏矣仍有桂枝治表在後設使用薑附重則向所未攻之表證能保其不變為裏證耶惟傷寒少陰病下利圊穀裏寒外熱手足厥逆衇微欲絶身反不惡寒其人面赤色者陽已浮於外陰已逆於內各自樹勢兩不相下故仲景於通衇四逆湯附子仍依四逆之數乾薑倍焉何則其勢相侔其鋒相敵病既植根中氣之虛而中寒自非倍其數不可是仲景於回陽逐陰又非輕用薑者比矣若夫心胸中大寒痛嘔不能飲食腹中上衝皮起出見有頭足上下痛不可觸近大建中湯證身體重腰中冷如坐水中形如水狀不渴小便自利飲食如故勞輒汗出衣裏冷溼久則腰已下冷痛腹重如帶五千錢甘乾苓朮湯證其沉寒痼冷一在於中一在於下一動而猖一靜而徑動者四出剽掠其勢向上為多凡向上者雖陰其中必有陽實中必有虛則既不得用附子為尾逐之師靜者僻居一處食飲二便尚嫻節制然汗出至衣裏溼其寒不衰是雖用附子攻衝之亦決不能驟解故大建中湯治動乃鎮以靜而抑之使平是條侯堅壁於梁甘乾苓朮湯治靜乃撫其循良銷其梗化是姬公毖頑於洛總之前後諸方皆從溫中起見而擊烏合則宜鋭不宜多討積猾則宜圍不宜攻權衡其輕重稽核其利鈍而治法可推推治法之委婉曲折而方義可識識方義之絲聯繩貫而乾薑之用瞭然如在心目間矣然則白通四逆等方其於溫中盡之乎是殆非也夫諸方注意大半在於溫下故其所主證下利及既吐且利者居多則取法實兼本經之溫中腸澼下利別録之霍亂特附子以走下乾薑以守中有薑無附難收斬將搴旗之功有附無薑難取堅壁不動之效是乾薑之治在溫中非諸方之治在溫中也大建中湯甘乾苓朮湯注意在溫中矣乃一則藥協蜀椒一則證原腰冷是其微旨仍不盡在中也微旨盡在中者其惟理中湯乎理中湯所主在傷寒論曰既吐且利寒多不欲飲水在金匱要略曰胸痹心中痞留氣結在胸胸滿脅下逆搶心一者由中而潰決四出一者由上下而并湊於中惟其中無所守是以外者能內內者能外內外可以易位生死不可遂判乎方中參甘氣味柔和能羈內出外入之駛不能制內出外入之令白朮剛乎參甘能制其出入矣猶不能不令出入惟乾薑味辛氣溫能令外不敢入性守不走能令內不敢出蓋惟中虛是以客氣得入惟中寒是以不能逐而使出故理中補虛即其制出之權其驅寒即其制入之威於是加以桂枝則治內寒外熱內虛外實心下痞鞕利下不止表裏不解桂枝人參湯證雜以薯蕷及諸補散則治虛勞諸不足風氣百疾薯蕷丸證間以半夏而去朮草則治妊娠嘔吐不止乾薑人參半夏丸證增以旋覆花代赭石半夏大棗而去朮則治心下痞鞕噫氣不除旋覆花代赭石湯證莫非分理中之半恃薑為卻寒散滿之長城即對待以寒涼如半夏瀉心湯生薑瀉心湯甘草瀉心湯黃連湯乾薑黃連黃芩人參湯按而察之猶有理中之參草乾薑在其中而恃乾薑不淺矣太陽病衇浮緊不發汗因致衄者麻黃湯主之吐血不止者柏葉湯主之少陰病下利便膿血者桃花湯主之病金瘡王不留行散主之婦人陷經漏下黑不解膠薑湯主之夫云因不發汗則知苟發汗必不動血云不止不解則知曾有以止之解之而不應云膿血則與純血有間云下黑則與鮮赤自別云病金瘡則因去血而病非因病而去血蓋失治者其咎為養癰貽患故病甚於此能轉攻於彼誤治者其咎為無益有損故非以已之適以激之而血之為物遇寒則凝遇熱則散摶於陽則得火之色摶於陰則得水之色推是而言則凡病乎血用薑以止之者莫不有確據可尋也其在於經則榮衛生會篇有奪血無汗奪汗無血之文衇要精微論有肺衇搏堅而長當病唾血之文邪氣臟腑病形篇有肺衇微急為肺寒熱怠惰咳唾血之文衇解篇有少陰所謂咳則有血者為陽衇傷陽氣未盛於上而衇滿滿則咳故血見於鼻之文陰陽別論有結陰者便血一升再結二升三結三升之文此皆可以薑治者也其在千金則凡婦人崩漏之少腹弦急或苦絞痛慎火草散五臟空虛失色黃瘦增損禹餘糧丸腰背痛四肢沉重大牛角中人散虛羸少氣治崩中下血方者已上在四卷吐血之胸中塞痛治吐血中塞痛方上氣面如土色柏葉湯胸腹煩滿疼痛乾地黃丸者已上十二卷血利之腹痛龍骨丸五內絞切痛治熱毒下黑血方赤滯下血連月不瘥白頭翁湯羸篤垂死茯苓湯赤白利黃連湯者已上十五卷下竝用乾薑其諸病之兼寒熱者嘔吐者竝用生薑則薑之止血可以循類而求按證以施又何疑於辛溫也哉生者尤良句綴於主治之末其意甚混豈以凡治胸滿咳逆上氣等病均生者優於乾者耶則何不直名之曰生薑而標其目曰乾薑也抑以生者不便致遠久藏薑非隨地皆産故概之曰乾薑可為不産薑處法耶則孔子曰不撤薑食常可為蔬是隨處皆産也愚意生者有生者之功能乾者著乾者之實效仲景於生薑瀉心湯中生薑乾薑竝用真武湯有生薑又可加入乾薑以是知本經乾薑主治當分作兩截讀曰乾薑味辛溫主胸滿咳逆上氣溫中止血為一截出汗逐風溼痹腸澼下利生者尤良為一截以是合之仲景之用生薑凡桂枝小茈胡諸加減法皆所謂出汗桂枝附子湯白朮附子湯桂枝芍藥知母湯桂枝黃芪五物湯抵當烏頭桂枝湯皆所謂逐風溼痹惟腸澼下利無明文然桂枝湯證小茈胡湯證多有兼下利者焉知其不指此耶推而類之則別録之風邪諸毒傷寒頭痛鼻塞即桂枝茈胡之用其桂枝麻黃各半湯治身癢白朮附子湯治風溼相搏初服其人如痹繼而如冒又豈非去皮膚間結氣耶仲景之用生薑即承本經出汗之旨固矣特傷寒論用生薑方凡三十有五而協棗者至二十有九金匱要略用生薑方除經見傷寒論者猶三十有二其協棗者亦一十有八統而計之其不同棗用者僅十之三生薑大棗之相比淺而言之則棗甘薑辛所謂辛甘發散是已殊不知棗之主心腹邪氣通九竅助十二經補少氣則其注意不在甘緩羈辛之駛也宣明五氣篇曰辛走氣氣病毋多食辛凡邪中於表必表氣之虛也但知去邪不知崇正邪去正傷致生他患者不少矣奚如隨勦即撫之愈耶且即棗之功用而論亦已可知守中有走薑之生者雖散逮乾則能守矣是不可謂走中之守乎故凡汗後表邪裏邪未解者多不忌薑如厚朴生薑甘草半夏人參湯證桂枝去桂加茯苓白朮湯證茯苓甘草湯證皆曾有汗甚至新加湯且加重焉又可見薑之不純乎散協棗尤能治汗後虛邪勢將入裏者矣玩生者尤良句以見無生薑處出汗亦可任乾薑即乾薑亦可出汗意其於通行經絡中寓走中有守守中有走之義又何疑哉近世論乾薑生薑者多曉置辨於去皮留皮之別豫嘗取生薑刮去皮暴而乾之則但存其筋無所為薑矣因是知薑非在地中至極老不足為乾薑不去皮不漬不釀亦不足為乾薑蓋凡暴物之道難碎者易乾易碎者難乾以其有老嫩之殊也莩甲厚者易乾莩甲薄者難乾以皮受爍則引在內之津潤以滋之也若薑惟皮與筋為有形其肉則遇水能化故搗薑和水去皮筋澄之可以成粉是乾薑所以必去皮必漬水必盦釀乃得暴乾而肉仍如故也是生薑之走乾薑之守係於老與嫩不係於去皮留皮其去皮留皮係於使之任暴不任暴不係於使之守使之走矣蓋嘗細咀兩薑乾者與生者不特味有厚薄即氣亦有厚薄陰陽應象大論曰味厚則泄薄則通氣薄則發泄厚則發熱惟其發且通斯能走惟其泄且熱斯能守非泄何以能除胸滿咳逆上氣非熱何以能溫中止血非發何以能出汗非通何以能逐風溼痹此生薑乾薑之分矣特本經不言薑治嘔而別録以治嘔屬之生薑仲景於嘔則或以乾薑或以生薑是豈無故蓋嘗檢仲景兩書乾薑治嘔者一十六方生薑治嘔方亦僅與之相埒何以見治嘔必係生薑但注不嘔而用乾薑者有乾薑附子湯茈胡桂枝乾薑湯等方生薑則無之以嘔而加生薑者有黃芩加半夏生薑湯梔子生薑豉湯真武湯通衇四逆湯理中丸等方乾薑則無之此足見乾薑之治嘔為兼及他證而用生薑則專治嘔其嘔而不用生薑則因與他證忌夫亦以生薑得夏氣多故功主橫散乾薑得秋氣多則功兼收斂橫散則上逆無力收斂則氣不四馳然薑之體性究係橫生則非特能禁其上能禁其下竝能禁其既上且下此生薑瀉心湯真武湯所以乾薑生薑竝用為一定不易矣用生薑最重莫如生薑半夏湯及當歸生薑羊肉湯之寒多者皆至一斤夫胸中似喘不喘似嘔不嘔似噦不噦徹心中憒憒然無奈係寒邪挾飲逼迫氣分或寒疝腹痛或脅痛裏急或産後腹中㽲痛係寒邪乘虛逼迫血分氣分者心肺為主故病在上血分者肝脾為主故病在下飲為有形故絞取有形之汁少煎而使其鋭虛乃無形故連質合煎多煮而欲其緩是又一用藥法例可概衆藥不特施之生薑者也其次莫如厚朴生薑甘草半夏人參湯當歸四逆加吳茱萸生薑湯皆至八兩夫發汗後腹脹滿是脾家津氣不宣手足厥寒衇細欲絶內有久寒是肝家陰邪欲逆蓋既因發汗而增病矣乃復重用生薑生薑非散劑耶陰邪橫及四肢於理宜行薑附乃僅用生薑吳茱萸生薑吳茱萸豈能代乾薑附子耶原人身不外陰陽邪氣亦不外陰陽病發於陽者必客於胸中胸中以肺為都會肺者體陽用陰故受寒發熱仍不能不畏寒麻黃湯宣達肺氣邪既得行設肺氣宣達脾不與之灌輸相續肺遂不能節宣諸氣脾家津液橫溢不升用生薑者豈非令繼參甘之益氣厚朴之下氣就其橫以運津液盡餘邪耶病發於陰者必客於腹中腹中以肝為都會肝者體陰用陽故雖因內有久寒至手足厥逆衇細欲絶仍不能無消渴與心中疼熱吳茱萸降在上之熱以就下生薑散在下之寒而使之橫達不然熱就上為咳吐膿血寒就下為下利厥寒豈四逆輩啓生陽於腎中可比耶是生薑在上可以止逆在下可以挽溜在中又可以定傾頽行津液一皆取其橫散之功於吳茱萸湯重用生薑可以知生薑能治肝病於桂枝黃芪五物湯重用生薑可以知生薑又能治腎病何者吳茱萸湯證陽在上而陰在下食穀欲嘔吐利乾嘔吐涎沫頭痛嘔而胸滿則陽盡在中不能安於中且欲上出矣手足厥逆煩躁欲死則僅能擾於中不得達於外矣所以致此者非在下陰邪搏之而何然據於中而不越於上泄於外可知其陰自肝而不自腎矣吳茱萸湯首吳茱萸是導陽下達然僅導陽下達而不剿撫其陰則陽雖下陰仍得與之敵是故參棗所以撫定其陰生薑則能使陰邪橫散不與陽為敵者也然則生薑非治肝乃散自肝上引之陰邪耳桂枝黃芪五物湯證則為陰外裹而在內之陽不振身體不仁如風痹狀陰邪也寸口關上微陽不振也惟尺中小緊方知受邪之所在下而不在上中桂枝黃芪五物湯即和營衛驅風寒之桂枝湯以受邪不在中而在中氣之衛於外者故易甘草以黃芪以不頭項強痛身體不仁則邪非上入而為橫束故倍生薑倍生薑是不欲其上行下達欲其橫散也然則生薑非治腎乃逐在外之陰邪束縛使腎陽外布耳於此見凡係陰邪搏陽當使陰橫散陽乃通暢者生薑皆能主之無論在下在上但在上則任之輕在下則用之重遂可闢某藥入某經之不廣矣金匱附方千金內補當歸建中湯若無生薑以乾薑代之是生薑乾薑可混用也千金治心實熱半夏瀉心湯客熱以生薑代乾薑治小兒利千金牛黃湯嫌兒熱者用生薑代乾薑是生薑乾薑不可混用也由諸條核之則調中可混用解外不可混用傷寒論小茈胡湯咳者去生薑加乾薑生薑瀉心湯乾薑生薑竝用真武湯下利者加乾薑金匱要略以薑夏為劑用生薑者名小半夏湯生薑半夏湯用乾薑者名半夏乾薑散是乾薑生薑之條理明晰者也當歸四逆湯證若其人內有久寒者加生薑理中丸寒者更加乾薑厚朴七物湯寒多者加生薑當歸生薑羊肉湯若寒多者更加生薑千金治婦人虛損甘草丸胸中冷者增乾薑治諸風金芽酒冷加乾薑肝臟門巴𦻝天酒腹中冷加乾薑先患冷者亦加乾薑腎臟門五補丸冷加乾薑是乾薑生薑之不明晰者也由諸條核之曰寒者多用生薑曰冷者多用乾薑寒與冷古今無異詁以愚意度之則散者曰寒著物者曰冷總而繹之則乾薑可代生薑生薑不可代乾薑其故何也夫調可常也守可常也散不可常也走不可常也嘔者多用生薑間亦用乾薑咳則必用乾薑竟不得用生薑蓋咳為肺腑病肺主斂不主散也乾薑本經別録不言炮用仲景則僅用於甘草乾薑湯蓋其厥逆咽乾煩躁吐逆及頭眩多涕唾小便數諸證皆上虛不能制下但用乾薑尚嫌其橫溢而肺益虛故必炮用之較小茈胡以咳而用乾薑易生薑者更進一籌矣況生者味辛炮者味苦辛通而苦降所以抑其性使下也生者色黃白炮者色黑所以別自肺及脾及腎也此之謂以上制下後人每每擴充用之善夫劉潛江之言曰乾薑有生用炮用之異生用者盡金之性以全火之用炮用者存火之體以全金之性蓋氣者火之靈生於火而統於金故生者金之氣暢火之用乃暢炮者火之體守金之氣乃存抑其能引血藥入氣分而生血也夫心陽中之太陽也肺陽中之少陰也心中原有水腎中原有氣肺得腎氣之上至者下降入心火中之水得此如紅爐點化合於胃中之鼓搧其血乃成所以炮用者斂金之性歸火之用使火中之水藉母氣而生化耳至止唾血利血而炮用者蓋火從水化使浮陽不僭以守中者入涼血劑中使寒不凝血乃和耳故曰生者熱而猶散炮者熱而善守也炮薑又有黑不黑之殊不黑者治血分虛寒而無熱若産後血虛發熱之類黑者治中氣虛而化熱以傷血如唾血利血之類然治化熱傷血者須同童子小便泡為宜葛春生苗引蔓延長至數丈紫色而有細刺葉三尖如楓葉面青背淡七月著花成穗纍纍相綴紅紫色似豌豆花結莢如小黃豆莢亦有毛其子緑色扁如鹽梅子核生嚼腥氣深秋采之本經所謂葛穀是也根形大如手臂外紫內白有至七八尺者以入土深者為良參圖經綱目葛與栝蔞土瓜同入土深而引蔓長為使中氣上達之物但二物結實聚而成瓜葛則散而成穀是其功能遂有專與溥之分又二物得酸苦湧泄之陰葛得辛甘發散之陽是其力之所至有入內入外之別又二物之實似心味苦亦應乎心是其量僅及胸中葛則根白氣平味辛無一不似肺是其量可反肺至心者通血衇故彼二物有滑澤徑道之功至肺者開皮毛故葛有散發腠理之效本經三物主治均以消渴為首推其根柢概可想見矣特三物皆自下而上乃葛則散發陽邪而曰起陰氣二物能潤滑枯槁反不曰起陰氣何哉蓋陽以引陽陰以引陰陰主形陽主氣脾為陰胃為陽故二物者止能引脾家有形之津液不能引胃家無形之氣且陰宜升陽宜降胃氣之升不能自至於肺必因於脾乃能至也是其由胃入脾遂曳脾陰以至肺陰陽竝至津氣兼升故本經特書其功曰起陰氣不可誣也身大熱者胃脘之陽鬱遏不能宣達嘔吐者胃氣不由於脾自逆於肺諸痹者脾陰不得胃陽衝發而閉塞也凡諸毒物中人多假人元氣作使而猖獗說見甘草胃家正多氣之鄉能助毒者莫此為便亦莫此為甚提開胃氣使由正道交於脾肺毒勢又焉能不孤毒勢孤正氣行又何患其不解耶諸痹諸毒皆宜活看譬如某物主寒溼痹某物主風痹某物主野葛毒某物主鴆鳥毒則為特指之詞此則凡痹凡毒皆可兼他藥以治之云劉潛江云六微旨大論曰陽明之上燥氣治之中見太陰至真要大論曰陽明不從標本從乎中從乎中者以中氣為化也蓋燥氣為陽明之本陽明為燥氣之標然卻不從燥而從太陰之溼土以化故曰從中也葛根之用即本經起陰氣一語正合於從太陰之溼土以行其化提胃中鬱熱鼓舞其陽從以上行觀其首主消渴可知矣太陰陽明論曰脾主為胃行其津液陰陽別論曰所謂陽者胃脘之陽然陽必根於陰故起陰氣即達胃陽能達胃陽則胃之鬱遏散而頭面肌肉腠理之表凡因胃陽不暢勾留不散者均無不由汗解矣其止脅風痛又似能治肝者蓋陰氣之起固與厥陰風木無異第達胃脘之陽則木氣亦暢故治脅下風氣作痛者用之即由於悲傷煩惱致肝抑鬱而脅痛者亦同諸藥用之則知其能發土氣以達木氣極有妙理豈徒在驅風以論其功哉葛根之用妙在非徒如栝蔞但浥陰津亦非徒如升麻但升陽氣而能兼擅二者之長故太陽陽明合病自下利者葛根湯證太陽被下利遂不止衇促喘汗者葛根芩連湯證咸用之蓋兩者之利為陽盛於外不與陰交陰遂不固而下溜起其陰氣使與陽浹得曳以上行則非但使利止竝能使陽之遏於外者隨胃陽鼓蕩而散矣又太陽病項背強几几無汗惡風者葛根湯證太陽病項背強几几反汗出惡風者桂枝加葛根湯證亦咸用之斯二者又良以撓萬物莫疾乎風燥萬物莫熯乎火風不兼火能疼痛不能牽強火不兼風能惡熱不能惡風惟其風挾火威火乘風勢經絡之間陰液被耗所謂骨節屈伸泄澤者遂不能如其常矣然病之大體究係太陽中風本應項強几几然即項強之尤者只此一端萌芽是火又何能舍其大體但顧此微末哉能鼓正陽驅逐邪風又妙能曳帶陰精澤滋燥火者舍葛根其誰與歸其有汗無汗則委麻黃之去取可耳雖然葛根湯亦治痓痓之項背強几几者反不用葛根何故夫栝蔞桂枝湯所治之項背強几几是柔痓也以痓之燥過於徒有風寒者故用藥遂較退一層當用葛根湯者降而用栝蔞桂枝湯若進葛根湯一層即係大承氣湯夫剛痓者胸滿口噤臥不著席腳攣急齘齒是也今葛根湯所治之痓無汗且小便少既不得外達又不得下泄其勢不能不至氣上衝胸口噤不得語氣既衝胸其去胸滿有幾既已口噤其去齘齒又有幾所爭者臥不著席腳攣急一間耳何況氣既上衝其腳已將攣急口既噤不得語其勢亦將臥不著席耶故曰欲作剛痓欲作云者猶言將成未成也是葛根之解陽邪即所以免枳朴之破泄其起陰氣即所以免消黃之滌蕩名曰開發實所以存陰可見機勢不同治法遂表裏殊異爭此一線機勢使裏解化為表解豈非暗保元氣哉或謂痓病古人皆作挾溼茲則以為挾燥得無戾歟考謂痓挾溼始於孫真人然驗之金匱要略則不容有溼其論痓病之源三條一曰太陽病發汗太多因致痓一曰風病下之則痓復發汗必拘急一曰瘡家雖身疼痛不可發汗汗出則痓三者何處可攙入溼耶要之挾溼自有挾溼之痓解仲景書則不必闌入溼耳或曰賁豚湯治氣上衝竹葉湯治喘方中皆有葛根適與治痓病之氣上衝胸者合且葛根氣平主降向謂鼓胃陽泄脾陰得毋猶有疵乎曰論方甚難但舉方中一味而論尤難何則一方所主之病不止一端所用之藥不止一味欲以一味牽合一端雖亦往往而符然有求之他處卒不可通者如子之所問謂賁豚湯證竹葉湯證正有合於葛根湯所治之痓則極有至理若以其有上氣有喘遂目葛根為降氣之劑則斷斷然不可矣賁豚湯之證曰賁豚氣上衝胸腹痛往來寒熱竹葉湯之證曰産後中風發熱面正赤喘而頭痛若項強則附子用大者是一則氣上衝胸一則面赤項強痓病頭熱面赤目赤皆深有合於痓矣而處方之旨則不然夫往來寒熱茈胡證也氣上衝胸則可見腸胃中無結不必用茈胡腹痛則知其血分必有結而當比用芎藭當歸芍藥又腹痛去脅痛無幾則大棗宜去雖不言心煩與否然用李根皮之止煩逆則又可知其必煩人參亦當去矣夫如是則遂可謂葛根代茈胡為一方主哉殊不知賁豚本氣上衝之候用茈胡更疏土氣則上衝之氣道愈空適足以增其熱用葛根則胃陽振而能遏其衝脾陰順而不助其熱辛甘能散寒熱自除肺氣通調衝逆自定此其不可同日語者也中風發熱喘而頭痛桂枝證也若面戴陽則為下虛遂不可用芍藥而宜加附子又陽不蠖屈於下而蟠於上則不能不以竹葉清之桔梗開之如火之既煙焰不能復返於薪也然既有先聲必有踵至陽之離根而上者未必遽因附子遂猝然止也故用防風使之隨衛氣外達而行一身藉其發散即藉其捍護用人參使安輯中氣內顧根本藉為腹心即藉為禦侮夫如是葛根又協桂枝為一方偏主矣乃孰知桂枝之止逆解肌僅僅行血衇以和津液其起脾陰滋肺氣俾治節不失其常而降令流通灌溉無缺者又豈得以葛根與桂枝竝列而言哉是葛根烏得為降特脾既散精上歸於肺肺又何能不和調四臟灑陳六腑耶然則雖謂之降亦無不可栝蔞三四月生苗引蔓葉如甜瓜葉而窄作叉背面俱有白毛六七月開花似壺蘆花淺黃色實結花下大如拳生時碧如瓜至九月黃熟則如熟柿內結重蔞子扁攢簇蔞中殼褐色仁緑色多脂作青氣根直下生入土深者愈良年久者至長數尺大數圍秋深掘者有粉夏月掘得便多筋絡無粉不堪用參圖經綱目盧芷園曰本經栝蔞主治不分根實別録推廣實主胸痹悅澤人面遂有根實之分故圖經別出天花粉主煩滿消渴夫煩滿消渴胸痹皆胸部病也釋名云消渴者腎氣不周於胸也經云煩滿胸痛引背胸痹也病名雖異因證則同但所施略分輕重耳腎氣不周胸中於腎為絶傷於胸中為不安為虛則能使胸中腎氣得周者於外為除煩滿消渴胸痹於內為安中補虛續絶傷又豈有二哉盧子繇曰氣味苦寒能治火熱體質濡潤能治燥涸故或因液燥涸致熱結聚或因熱結聚致液燥涸而身熱煩滿遂成消渴者悉宜用之胸中者熱搏則煩滿筋絡者燥涸則斷絶熱搏者熱卻則中安燥涸者濡潤則連續究之卻熱潤燥皆益液之功故安中續絶傷必歸本於補虛矣根實功用稍有異同實主鬱遏不能分解根主消渴失於容平靡不以熱為因燥為證顧天花瑞雪之名則思過半矣張隱庵謂草木之根荄其性上行實則性復下降栝蔞蔓延結實之時根粉盡消結實既成根復生粉是以根能啓陰氣上滋實能導痰膩下降此言最是得理愚謂凡物之根荄骨肉渾成即可使揭而開亦不過如遠志黃芪續斷等物肉是肉骨是骨耳未有如栝蔞根浸而搗之則肉盡成粉所餘但存筋衇者此之謂散質簇為聚質凡瓜瓠之屬既已結子成熟後或外皮成殼子留於中外內皆燥其有脂液難燥者又多連穰及殼自內潰爛而出未有如栝蔞實之外皮成殼內結重蔞子攢聚於其間而脂液附焉者此之謂無形附於有形散質簇為聚質性復主升故能使津液上潮主燥涸之煩渴無形附於有形性復主降故能裹痹著下溜主黏膩之結痛下者能上上者還下如環無端造物之妙於斯極矣栝蔞根入土最深且能久在土中生氣不竭故歲歲引蔓發葉開花成實而味苦性寒恰有合於脾臟之德而能為效其用其止渴也則所謂脾氣散精上歸於肺者也腸胃皆隸於脾脾陰效用則腸胃中痼熱又烏能留黃疸者脾津被熱約而不流以致蒸盦而成者也脾熱既解疸亦何能不除短氣肺陰虛也小便過利肺火盛也衝衇隸於陽明為月水所從降若因脾胃陰虛而血涸或因熱結而不流得此涼潤之劑自然涸者滋結者解不通者轉而能通別録之治固與本經理無二致矣栝蔞根實諸本草家咸謂功用略同稍有差別愚則謂其大相徑庭何也栝蔞根主升實主降前且言之詳矣夫升即寓補降即寓瀉故仲景用實多治結治痛治痹阻治逆搶隱然一下藥也根則專治渴凡陰虛火熾肺腎津液不相交濟者咸用之此不可為一補一瀉之驗乎甚者同一小茈胡湯證煩者加實去人參渴者加根更加人參夫人參之為物和緩沖融表未解者不用裏未虛者不用乃一則與之為伍一則不與之為伍亦可以得其物之情矣五常政大論曰陰精所奉其人壽陽精所降其人夭故同一物也升則為陽降則為陰陽則主生陰則主殺雖然此亦以性寒者言耳若氣味溫和又不當作如是論矣雖然栝蔞實非能治實也亦不治虛觀仲景之用栝蔞實在小陷胸湯曰小結胸病正在心下按之則痛在栝蔞薤白白酒湯曰喘息咳唾胸背痛短氣而其衇一則曰浮滑一則曰寸口沉遲關上小緊數是皆陰中有陽且踞於陽位者也夫胸背痛較按之方痛則甚痹則較結為輕咳唾喘息是其勢為上衝而居於心下按之才痛似反靜而不動此其機總緣氣與飲相阻寒與熱相糾熱甚於寒者其束縛反急而為結寒甚於熱者其蔽塞自盛而為痹是故結胸之病伏胸痹之病散伏者宜開散者宜行故一則佐以連夏之逐飲泄熱一則佐以薤酒之滑利通陽栝蔞實之裹無形攢聚有形使之滑潤而下則同能使之下自是治實之方僅能使之下不能使其必通又非純乎治實之道矣何以知不能使之必通蓋有停飲痛甚至不得臥即當加半夏若兼胸滿脅下逆搶心則仍加枳朴桂枝若竟能通又何必如是哉是知栝蔞實之治大旨在火與痰結於陽位不純乎虛亦不純乎實者皆能裹之而下此其擅長矣栝蔞根亦非能治虛也觀小青龍湯小茈胡湯茈胡桂枝乾薑湯中用之皆不過以渴不得用半夏而為之代耳半夏非治虛者也雖然渴不得用半夏何物不可用乃處處代以栝蔞根蓋胸中者清虛之府中氣之所貯中氣者精明純粹不寒不熱不溼不燥不受纖翳之侵者也體中受邪胸中焉能毫無所犯其所犯者非寒即熱非溼即燥寒且溼之動為嘔為噦熱且燥之動為煩為渴兩者之不相兼猶冰炭之不能相入也是故嘔噦者用半夏以止逆使寒與溼不與中氣久混而難解煩渴者用栝蔞根以滋液使熱與燥不與中氣相爍而難復所以栝蔞根與半夏雖非相畏相忌相反而始終不相竝此其旨在傷寒論金匱要略中可尋繹而知者也曰服小青龍湯已渴者寒去欲解也曰服小茈胡湯已渴者屬陽明也以法治之曰嘔家渴為欲解其有支飲者縱得熱藥不渴以是知半夏栝蔞根功用實相反而適相同也其所以不得為補劑者則以是物雖曰滋液亦僅能啓脾家陰津上潮不能使腎家陰津灌注以其入土能深皮黃肉白且其肉聚則成塊散則成粉種種不離土象是為能益液而不能浥其源又烏得為補然則諸湯之配藥何不取浥腎之物直濬其源而取乎僅啓脾陰者也夫煩渴之煎爍中氣其望陰液之滋蓋不啻歲旱之望雲霓也若待濬腎陰滋之其何能及且凡物之取給於近者易成亦易消遠者難待亦難解假使胸中僅為無形之燥熱所爍遠浥有形之腎陰救之燥熱既熄汪洋之水繼至不慮其熱病才已寒病復起耶若是則栝蔞桂枝湯得毋亦與此同耶栝蔞桂枝湯與小青龍湯小茈胡湯同有表邪同宜解外同有裏熱其有不同者小青龍小茈胡證皆未經誤治栝蔞桂枝湯證則因誤治而致一也太陽病證備衇反沉遲為陽證見陰衇非小青龍小茈胡所有二也雖然篇中但言太陽證備竝不提及誤治陽證見陰衇其病已危乃用從容不迫之桂枝湯此互文以見意也篇中首述病狀旋訂病源縷縷可晰其述病源不曰感受何邪而曰太陽病發汗太多因致痓曰風病下之則痓復發汗必拘急曰瘡家雖疼痛不可發汗汗出則痓歷敘三條總因汗下其非感觸即得亦復何言特痓者方經汗下內則陰液暴脫外仍經絡壅滯以云乎陰液暴脫且見陰衇則外證不得仍備太陽今太陽證仍備且項背強几几然則沉為陽不入交於陰遲為衇道泣澀不前矣夫陽欲入陰而陰不承則陰與陽烏能交則陰何自而化陽何自而生太陽證備還治以治太陽之法陰不承陽則必取生陰之速者以益上中之液使得與陽交生陰之速益上中之液者舍栝蔞根其誰取耶是知栝蔞桂枝湯之用栝蔞根蓋使獨當一面其任較之小青龍小茈胡以渴而去半夏加入者為倍重蓋陰在內為陽之守陽在外為陰之使明乎此則將作剛痓之用葛根湯以起陰而泄陽既作剛痓之用大承氣以存陰而承陽一以貫之矣用栝蔞根最索解不得者無如栝蔞牡蠣散蓋百合病不成內傷又非徒外感絶無五臟菀熱八風五痹之實候只在病人意中輾轉不適又不能明言其所以然及從其草蛇灰線處跡而尋之其理似亦有可窮者夫欲臥不得臥欲行不得行飲食或有美時或有不欲聞食臭時如寒無寒如熱無熱得藥則劇吐利如有神靈等全在不可捉摸處口苦小便赤其衇微數則在有形跡處及至一月不解而變成渴則形跡遂大著何況以百合湯洗之而仍不差則病氣為傷中上之陰無可疑者雖然僅曰渴不曰欲飲水且不煩不熱究竟病本無駐足處僅渴之一端為得所依藉耳於此見昔之百衇一宗悉致其病者今則上焦已化而在下者尚未化也上焦已化百衇之病已蠲其半百合遂無所用之而下焦之未化者不得不選用牡蠣使之召陽歸陰而其主腦尤在治上焦之已化者故方中配以從陽化陰之栝蔞根兩物等分標名則升栝蔞於牡蠣之上為一方之統攝也是方也最無意味之中意味萃焉由是思之則栝蔞根之用不得僅以治外感煩渴一端目之矣其次牡蠣澤藛散之用栝蔞根亦甚不易解以栝蔞根多為渴用牡蠣澤藛散證則竝不言渴也雖然此有說焉栝蔞瞿麥丸則渴而用栝蔞根矣又何以用附子此固當與牡蠣澤藛散對待而觀者也夫牡蠣澤藛散之證曰從腰已下有水氣栝蔞瞿麥丸之效曰腹中溫為知腰者在後腹者在前後者陽氣所由升前者陰氣所由降若為水氣所隔則當升者不升當降者不降陽不升則下雖鬱熱上仍不渴陰不降則上縱化熱下則仍寒譬之冬月嚴寒陽氣伏於下則井中水溫出井則冷夏月酷暑陰氣伏於內則井中水冷出井則溫故牡蠣澤藛散證不渴而比投寒泄栝蔞瞿麥丸證雖渴而終用溫暖其竝用栝蔞根一則以助上之陰為寒泄諸藥守禦俾得有恃不恐一則以安上之擾使溫暖諸藥下達俾無反顧之憂於栝蔞瞿麥丸其功在正面在正面故其名居一方之首而不愧於牡蠣澤藛散其功在根柢在根柢故不居其名而無悶於此又可見栝蔞根之為物既能應上焦假熱之渴又能應下焦真熱之不渴謂之能益陰津則可謂之能補真陰亦無不可苦參根黃色長五七寸大兩指許三五莖竝生苗高三四尺葉碎青色極似槐春生冬雕花黃白色七八月結角子生角內凡二三粒如小豆而堅圖經綱目苦參能止溺有餘瀝又能止淚則是收攝水氣之物何以又曰逐水蓋苦參為物本乎土而受疏於木者也惟本乎土故根色黃而三五竝生受疏於木故莖幹獨而色青與脾土之氣結於中而為患於他處不一者但得肝膽之氣疏而逐之使攝歸脾土所當輸泄之道其理毫無以異是所謂以收攝為流通者也人身之屬水者血以流通經衇津以榮養諸竅液以滑澤骨節溼以薰膚充身假使血被火結而成癥瘕津被火結而為積聚液被火結而為癰腫溼被火結而為黃疸其咎皆在土之不能防水苦參味苦氣寒正除火之附於水者且復借肝之疏成土之防而為水之治故美其功曰補中非補中也去中土所生之患則中已受益也然則苦參究竟為利水乎為攝水乎夫苦參非利水亦非攝水而正與利水攝水同使水不為患於他處是功同攝使水歸脾統領復其輸瀉之常是功同利在仲景書溼熱生蟲者苦參湯洗之亦係攝水之效妊娠小便難當歸𦮷母苦參丸主之則利水之效矣當歸春生苗緑葉有三瓣七八月開花似蒔蘿淺紫色根黑黃色以肉厚而不枯者為勝圖經凡用卉草其發芽放葉時可悟其力之所始其吐花結實時可知其力之所竟以一歲配五臟則冬腎春肝夏心長夏脾秋肺以五臟配軀體則肺皮毛心血衇脾肌肉肝筋腎骨當歸發芽於仲春開花於仲秋其功始於肝終於肺始於肝終於肺其物應升而反降者則以體者其性氣味者其用當歸體滑潤故不能升氣厚為陽味薄為陰中之陽陰足以撓陽用不能違體故遂展轉牽率祇能上至於肺外達於皮毛矣其專入血分則以肝藏血脾統血心主血皆在所部之內又其體滑潤象血之質花嫣紅象血之色故其為用一言以蔽之曰治陽氣躓於血分盡之矣陽氣躓於上焦血分則呼吸迫促為咳逆上氣陽邪躓於營衛血分則經衇爭道寒熱洗洗在皮膚中陽氣躓於下焦血分則血海不安漏下絶子中風中惡客氣虛冷皆氣為血撓之所致也衝衇上行主血以時下當歸之氣升體降似之故治逆氣裏急帶衇之性不升不降橫束一身當歸之體用相撓祇能橫行者似之故治腰溶溶如坐水中劉潛江曰當歸味甘次苦次辛又復甘苦為火而屬心歸於血之所主矣苦而有辛是金火相合以孕水也火因金而和於水則氣化金孕水而親於火則血生其始甘者所謂穀入於胃以傳於肺也其終仍甘者所謂中焦竝胃中出上焦之後此所受氣泌糟粕津液化其精微上注於肺乃化為血是也肺合於心而氣化為血衇之所由始肺合於脾而血化為經衇之所由通故血所不足處即有血之生氣以裕之潤之血所乖阻處即有血之化氣以和之行之既能養血又能和血行血隨所引而莫不各歸其所當歸斯言也實得古聖命名之微義於是物之體性備矣而其用亦不外乎是蓋血所不足則氣襲而居之行其氣而且裕之潤之則血生矣血性常流行而乖阻即氣為之也和之行之則氣不為血礙矣氣通利而血流行則各歸其所當歸之謂也少陽之往來寒熱蓋如素問瘧論所謂陰并陽則熱陽并陰則寒者庶幾是矣厥陰之厥深熱深其亦猶此乎而不知非也夫仲景治少陽一於和解故熱去寒亦解寒解熱亦除厥陰之治則有溫有清以是知熱退避寒則厥寒退避熱則熱也然退舍之際寒熱何所匿耶夫氣陽血陰陽不勝陰則寒匿於氣分陰不勝陽則熱匿於血分夫然故治寒必仍照顧血分之熱此當歸四逆湯以當歸為君也治熱必仍照顧氣分之寒此白頭翁湯以白頭翁為君也凡藥能於氣分中開陰氣者多能於血分中開陽氣者少故厥陰篇列六方用當歸者至四而四方皆以治厥則當歸能開血分所鬱之陽氣可知矣矧厥陰熱證之極致曰口傷爛赤曰下利膿血曰必發癰膿無不關乎血分他如赤小豆當歸散之目赤如鳩眼陽毒陰毒之喉痛亦與此類耳然當歸之短不可不知也烏梅丸中有當歸而主久利則以退在偏裨也麻黃升麻湯中有當歸則與他物權均力侔也他凡大便不固者究與滑潤之物不相能此則所宜深計也古人有治風先治血之論豈漫然血藥足以當之蓋必擇辛甘發散者用之風乃能解則芎藭當歸其物也芎藭治風陷於血當歸治風躓於血欲血中之風上行而散者宜芎藭欲血中之風旁行而散者宜當歸以風性喜升喜流蕩故也然仲景治風不用二物即至厥陰亦僅用歸不用芎者則以二物能治羈留之風不能治鼓蕩之風風雖陽邪其驟也止能揚血使沸騰不能入於血其緩也方乘間抵罅入之其至厥陰厥陰性本升血分有熱正慮其升為喉痹為口傷爛赤焉得復用芎藭要知當歸四逆湯烏梅丸麻黃升麻等方用當歸亦止藉其托出血分即繼以他藥推送使解不全委以驅除之任即如桂枝附子湯白朮附子湯甘草附子湯證至骨節煩疼掣痛不能屈伸邪亦未始不及血分特以風本兼溼溼忌滑潤故遂置之不用則治血之言非特不可漫聽即使宜於血分之物如芎如歸尚不得浪用概可見矣侯氏黑散治大風四肢煩重心中惡寒不足者虛勞諸不足風氣百疾薯蕷丸主之治風先治血之楷模蓋在乎此菊花防風細辛桂枝是侯氏黑散中驅逐風邪物也桂枝防風黃卷茈胡白蘞是薯蕷丸中驅逐風邪物也其侯氏黑散之芎藭薯蕷丸之地黃芎藭芍藥是與當歸竝駕齊力者也而菊花薯蕷分數多至十倍參朮甘草亦不啻倍蓰明明以之督率衆品駕馭群才若泥先治血一言使以血藥為長則豈復成方耶即如賁豚湯芎歸芍疊用以治氣上衝胸腹痛住來寒熱似乎其旨在和血袪風矣不知袪風自有生葛生薑不過因其氣上衝必飲邪憑藉厥陰風木之威故臣以半夏甘草之滌飲緩中仍取芎歸與芍開解血分以和肝實乃偏裨之資不可與他物竝論也雖然氣機既已上衝風木勢難自屈設不以芍之開結歸之解散芎之升發使不佐威煽虐則散者雖散衝者自衝不至元氣竭盡不止此疊用之意所在不可不知者也本經當歸治諸惡瘡瘍金瘡別録主溫中止痛皆得為陽躓血中乃金匱要略治肺癰之葶藶大棗瀉肺湯桔梗湯白散葦莖湯腸癰之薏苡附子敗醬散大黃牡丹皮湯諸瘡瘍之排膿散排膿湯金瘡之王不留行散腹滿痛之附子粳米湯厚朴三物湯大茈胡湯大建中湯大黃附子湯大烏頭煎皆置不用於此可見仲景之用藥批郤導窾悉中肯綮之妙也夫氣阻血中必有致阻之由知其由遂拔其本塞其源若從血中通其阻因出其被阻之氣是循流逐末之計矣氣上而不下則阻於上下而不上則阻於下壅而不宣則阻於中外而不內則阻於外上者下之下者上之壅者宣之外者泄之又何暇待當歸且痛多屬寒寒者陰氣更投滑潤之物徒足以泄陽光致下利如當歸生薑羊肉湯亦未嘗不用又何嘗不以之為君耶於此觀之當歸於陽留血分未與血相得者能治之已與血相得而成膿者非其所司也本經云云殆其始爾於陽躓血分之痛能治之陰氣結而痛者亦非其所司也當歸能治血中無形之氣不能治有形之氣故癰腫之已成膿者癥癖之已成形者古人皆不用獨於胎産諸方用之最多則以胎元固血分中所鍾之陽氣也特既已成形則月事不行月事不行則氣滯於血者非一端矣檢胎産諸方用當歸者六方其與他物竝駕齊驅為領袖者當歸𦮷母苦參丸當歸散一方其肩隨他物為督率者芎歸膠艾湯當歸芍藥散溫經湯三方其所主證若氣因血滯為胞阻為㽲痛熱因血鬱為便難氣阻於血而生熱無非血分中無形之蓄聚是以氣行血即安惟當歸生薑羊肉湯之治男子寒疝腹中痛脅痛裏急婦人産後腹中㽲痛全似陰寒結於血分特㽲痛與急痛有別脅痛裏急又與腹痛裏急相殊以是知為氣阻血中乃氣之虛非氣之實也中品草十五味麻黃春生苗至五月長及一尺梢上有黃花結實如百合瓣而小又似皂莢子味甜外皮紅裏仁黑根皮黃赤色長者近尺餘圖經麻黃之實中黑外赤其莖宛似衇絡骨節中央赤外黃白實者先天莖者後天先天者物之性其義為由腎及心後天者物之用其義為由心及脾肺由腎及心所謂腎主五液入心為汗也由心及脾肺所以分布心陽外至骨節肌肉皮毛使其間留滯無不傾囊出也故栽此物之地冬不積雪為其能伸陽氣於至陰中不為盛寒所凝耳夫與天之寒聲相應氣相求者於地為水於人身為精血津液故天寒則地中之水皆凝為冰而不流人身亦然精被寒凝則陽氣沸騰鼓蕩於外為傷寒溫瘧邪熱在表而無汗津液被寒則其質凝聚為水而其中之氣奔迸上迫為咳逆上氣血被寒則衇絡不通為癥堅積聚麻黃氣味輕清能徹上徹下徹內徹外故在裏則使精血津液流通在表則使骨節肌肉毛竅不閉在上則咳逆頭痛皆除在下則癥堅積聚悉破也昔人泥於傷寒衇法篇衇浮而緊一節遂謂寒必傷營風僅中衛附以傷寒無汗中風汗出二語以為麻黃桂枝二湯方柄至大小青龍二湯則既不可隸之寒傷營又不容隸之風傷衛遂別立風寒兩傷營衛一門以為鼎峙殊不知風則傷衛寒則傷營仲景之言也風寒兩傷營衛非仲景之言也夫寒非風何以能及人之身風非寒何以能中人之衛是風與寒寒與風一而二二而一者也柯韻伯曰太陽中風衇浮緊不汗出而煩躁陽明中風衇弦浮大不得汗合而觀之不得以無汗為非中風矣太陽病或未發熱或已發熱必惡寒體痛嘔逆衇陰陽俱緊者名曰傷寒而未嘗言無汗太陽病頭痛發熱身疼腰痛骨節疼痛惡風無汗而喘者麻黃湯主之此不冠以傷寒亦不言惡寒又傷寒衇浮自汗出微惡寒合而觀之不得以有汗為非傷寒矣今人但據桂枝證之自汗不究傷寒亦有自汗者但以麻黃證之無汗不究中風最多無汗者謂傷寒衇浮緊中風衇浮緩不知傷寒亦有浮緩中風亦有浮緊者仲景之論變動不居後人偏為分疆畫界致使執滯難通傷寒中風之說拘則麻黃桂枝之用混何如無汗不得用桂枝有汗不得用麻黃直捷了當也善夫劉潛江之論麻黃桂枝二湯也曰麻黃既以主氣名然寒傷營者用之營則屬血也桂枝既以主血然風傷衛者用之衛則屬氣也營在衇中傷之則邪入深是豈止營病且竝衛病矣故麻黃湯驅營中之邪使之發越自衛而出衛在衇外傷之則邪入猶淺然風邪干陽陽氣不固必由衛不與營和斯汗出耳故桂枝湯散表外之邪引衛氣與營氣諧和雖然麻黃何以能由營通衛本經謂麻黃苦溫夫苦為在地之陰是發於陰出於陽矣猶助以杏仁之疏衛乃能遂其由陰達陽之用桂枝何以能由衛和營本經謂桂辛熱夫辛為在天之陽是發於陽入於陰矣且助以白芍之通營乃能遂其由陽和陰之用蓋風寒既傷於外營衛本皆乖戾特傷之重者無汗無汗則以麻黃從陰中達陽營氣乃通傷之輕者有汗有汗則以桂枝從陽中召陰衛氣乃和謂桂枝不入營麻黃不由衛可乎夫寒著人則水氣鬱水氣鬱則由衛及營其害有不僅至營而止者非如麻黃之氣味輕揚出入無間能使在地之水不凝出地之陽亦不壅者何以使血衇利營氣通耶是營衛之義不可不明麻黃桂枝之用斷不必泥於在營在衛衇法篇所謂衇浮而緊浮則為風緊則為寒風則傷衛寒則傷營營衛俱病骨節煩疼當發其汗者不為虛設矣或謂麻黃治外寒固矣然必謂外寒與身中水氣相應為病則不有佐使用寒藥者乎曰凡用麻黃以寒藥為佐使者大青龍湯麻黃杏仁甘草石膏湯越婢湯古今録驗續命湯文蛤湯皆用石膏麻黃升麻湯用知母石膏黃芩桂枝芍藥知母湯用知母千金三黃湯用黃芩然大青龍湯古今録驗續命湯千金三黃湯治風寒越婢湯治風水文蛤湯治水氣桂枝芍藥知母湯治風溼仍係外寒水氣交關為害惟麻黃杏仁甘草石膏湯麻黃升麻湯外寒未盡裏已化熱絶不與水氣相干但一則曰汗下後不可更行桂枝湯汗出而喘無大熱一則曰大下後手足厥冷咽喉不利吐膿血泄利不止則皆已服他藥夫已服他藥何以知其發病時不係外寒與身中水氣為病耶且麻黃杏仁甘草石膏湯冠以不可更行桂枝湯麻黃升麻湯冠以傷寒則其始為外寒無疑矣而服藥後既已變證仍不離乎傷寒中風此最當著眼者也有汗不得用麻黃斯言信矣然麻黃杏仁甘草石膏湯越婢湯二證皆有汗出汗出更用麻黃獨不畏其亡陽耶雖然汗多亡陽為佐使用溫藥者言耳夫寒邪外著熱氣騰沸原因身中陰氣痹阻不與陽交故麻黃青龍等湯義在使陰交於陽陽氣既和遂和於外著之陰寒為汗設服之過劑則陽才外泄陰即內爭此汗多亡陽之謂矣茲二證者既已有汗陽猶甚盛不與陰和故或逼陰於外為汗或逐陰於上為喘或陽鬱不宣為風水或阻氣於上為肺脹故曰汗下後不可更行桂枝湯若汗出而喘無大熱者可與麻黃杏仁甘草石膏湯曰風水惡風一身悉腫衇浮不渴續自汗出無大熱越婢湯主之曰咳而上氣此為肺脹其人喘目如脫狀衇浮大者越婢加半夏湯主之曰千金用越婢加朮湯治肉極熱則身體津脫腠理開汗大泄厲風氣下焦腳弱可見皆陰與陽爭不能勝陽陽結聚而陰散漫陽上薄而陰不下輸如是而不用麻黃發其陽陽終不能布不用石膏泄陽通陰陰終不能歸故兩方者非特用麻黃且多用麻黃杏仁甘草石膏湯且倍用焉越婢湯然終以陰陽不能相交刻刻慮其陰勝陽負故越婢湯下云惡風者加附子一枚其中仍有生薑三兩可見雖發其陽泄其陽仍不忘夫亡陽矣然則大青龍湯用石膏倍麻黃義莫比於此否曰大青龍湯與越婢湯對待固可以知表氣疏密與小青龍湯對待尤可以知裏氣虛實夫麻黃由表實而用用麻黃彌重者表彌實用麻黃至六兩已矣乃大青龍之不汗出與越婢之續自汗出固可同日而語歟夫皮毛者肺之合肺主衛衛者一身極外之捍衛也故表氣實者不聚於營衛皮毛即聚於肺心者覆於肺下表邪既聚於肺心氣無從發舒故不汗出而煩躁者大青龍主之如盛寒之邪聚於皮毛營衛雖至一身悉腫在內之心氣猶可發舒故無大熱續自汗出者越婢湯主之聚於上則欲其通於營衛為汗外泄耳若在營衛皮毛為腫則不必桂枝之通毋庸杏仁之降此大青龍越婢之殊也若小青龍寒水之化聚於中與大青龍之聚於上又適相對照蓋聚於上能束縛胸中之陽為內熱聚於中則侵損胸中之陽為內寒內熱則煩躁內寒則喘咳嘔噦煩躁故佐以石膏內寒故佐以細辛乾薑然熱比於實寒比於虛實者治宜急急者倍麻黃不急恐石膏增寒於內虛者治宜緩緩者半麻黃不緩恐麻黃細辛亡陽於外此又小青龍大青龍所攸分也中風見寒衇傷寒見風衇此之謂風寒兩傷營衛主持是說者非一人柯韻伯尤在涇非之今之說又與柯氏尤氏所說者異不合大青龍兩條比類而疏通之則是說終為無據矣大青龍扼要為寒水之化聚於上寒水之化有風甚於寒者有寒甚於風者風性急疾故衇緊急絞轉寒性凝重故衇宛轉不暢風甚者內侵亦甚則不汗出而煩躁寒甚者障蔽亦甚則身不疼而但重充其類風甚者能內為實熱寒甚者能外為腫脹其源同則其治亦同而其趨向少有不同則其變必不能同故急治之急治之故用麻黃至六兩也柯氏之說善矣然於下條必增入發熱惡寒無汗煩躁句其理始可通尤氏之說亦甚當然但疏加石膏不及倍麻黃於大青龍意義終未為尉貼今之說又遺卻無少陰證句亦未為全璧也夫少陰證非他煩躁是也煩躁非少陰證也傷寒一日太陽受之衇若靜者為不傳頗欲吐若煩躁衇數急者為傳是煩躁為太陽證矣夫曰煩躁為傳煩躁乃多見於少陰篇是以知煩躁者實太陽少陰兩經接界證也是上下兩條者皆針鋒相對無少滲漏上條冠以太陽中風乃衇浮緊發熱惡寒不汗出而煩躁則與太陽中風應服桂枝湯者異下條冠以傷寒乃衇浮緩身不疼但重且乍有輕時又與太陽傷寒應用麻黃湯者異惟其病屬麻黃證見桂枝病屬桂枝證見麻黃斯合兩方為一方矣中風證不應煩躁而煩躁是風性善生熱亟亟乎將入少陰故不得不以石膏從陰通陽從陽引陰截於中道使從太陽解然不倍麻黃則散發無力恐陰既通陽陽隨陰化熱證未已寒證復起是適以害之也傷寒證應煩躁而不煩躁是寒性善凝聚故身重而將入太陰不得不倍麻黃以發其凝聚然不加石膏則陰無所守恐陽邪散陰亦隨之以竭是適以殺之矣觀乎金匱要略之論飲曰飲水流行歸於四肢不汗出身體疼重謂之溢飲曰病溢飲者當發其汗大青龍湯主之亦可思身重之所以矣麻黃非特治表也凡裏病可使從表分消者皆用之如小續命湯葛根湯之治風麻黃附子細辛湯麻黃附子甘草湯之治寒麻黃加朮湯麻黃杏仁薏苡甘草湯之治溼麻黃連軺赤小豆湯麻黃醇酒湯之治黃桂枝麻黃各半湯桂枝二麻黃一湯桂枝二越婢一湯牡蠣湯之治寒熱則猶有表證有表證者用麻黃本經所謂發汗去邪熱除寒熱也若烏頭湯之治風射干麻黃湯厚朴麻黃湯之治咳甘草麻黃湯文蛤湯之治水則無表證矣無表證而用麻黃則本經所謂止咳逆上氣破癥堅積聚者然所謂從表分消者謂何曰咳而上氣喉中水雞聲曰咳而衇浮是病聚於肺肺者皮毛之合從皮毛而泄之所以分消肺病也曰裏水曰吐後渴欲得水衇緊頭痛是病仍在上及皮毛與風寒不殊矣惟心下悸一證絶不見可用麻黃蹤跡主以半夏麻黃丸其義最為難釋蓋悸者水飲侵心心氣餒縮固應半夏之治飲然用麻黃通心不用桂枝者則以桂枝僅能通血衇不能發舒心陽然究病輕藥峻不宜急治故止服如小豆者三丸日三服以漸去之於此見用麻黃仍欲使之和緩有如此者凡用麻黃發汗治咳逆皆可知其治肺矣治心者除半夏麻黃丸外猶有可證者乎然傷寒金匱除此卻無明文而在千金外臺者可考也千金治心熱滿煩悶驚恐安心散調心泄熱治心衇厥大寸口小腸熱齒齲嗌痛麻黃湯十三卷外臺刪繁療心勞實熱好笑無度自喜四肢煩熱止煩下氣麻黃湯刪繁療衇極熱傷風損衇為心風心風狀多汗無滋潤消虛熱極止汗麻黃湯十六卷范汪療心腹積聚寒中㽲痛又心胸滿脅下急繞臍痛通命丸十二卷皆以麻黃為君則麻黃之通心陽散煩滿可見矣然則在腎獨無用麻黃者乎是亦有之金匱曰病歷節不得屈伸疼痛烏頭湯主之千金有治腎勞熱陰囊生瘡麻黃根粉方亦有治精極五臟六腑俱損傷虛熱遍身煩疼骨中㾓痛煩悶方十九卷外臺有刪繁療勞熱四肢腫急少腹滿痛顏色黑黃關格不通鱉甲湯十六卷皆有麻黃則麻黃之於腎蓋治氣閉精凝虛熱內作之證矣且過者功之對也用麻黃而過在肺則有厥逆筋惕肉瞤在心則有叉手自冒心心下悸欲得按在腎則有臍下悸循其過而稽其功則前所謂麻黃下能通腎氣而上能發心液為汗及除肺家咳逆上氣者為不虛矣本經謂麻黃除寒熱仲景亦有用麻黃治寒熱之方而治寒熱主劑實為茈胡是則茈胡所治寒熱與麻黃所治寒熱當必有別矣傷寒論曰太陽病八九日如瘧狀發熱惡寒熱多寒少一日二三度發衇微而惡寒面有熱色身癢宜桂枝麻黃各半湯曰服桂枝湯後形如瘧日再發者宜桂枝二麻黃一湯曰太陽病發熱惡寒熱多寒少衇微弱者宜桂枝二越婢一湯夫茈胡所主之寒熱曰往來寒熱休作有時則與麻黃所主之寒熱一日二三度發日再發者有別矣且此則曰惡寒小茈胡證則曰外有微熱可見寒熱彼此皆有休時惟茈胡證則不惡寒但有微熱麻黃證則無熱而但惡寒知此則兩證之異昭昭然無可疑矣木通蔓生莖幹大者至徑三寸莖有細孔兩頭皆通含一頭吹則氣出彼頭每節有二三枝枝頭有五葉頗類石韋又似芍藥二葉相對夏秋開紫花亦有白花者結實如小木瓜長三四寸核黑瓤白食之甘美其莖亦有紫白二色紫者皮厚味辛白者皮薄味淡實一物也參唐本圖經綱目張隱庵曰防己木通皆屬空通蔓草防己取用在下之根則其性自下而上從內而外木通取用在上之莖則其性自上而下自外而內此根升梢降一定不易之理後人用之利小便須知小便之利亦必上而後下外而後內也劉潛江云木通之用世類知其通水道本經所載主治一若悉主於血無與乎水者殊不知決氣篇曰中焦受氣是為血則水乃血之母血乃水之精源同派別者也且本經所載木通主治核之素問靈樞如所謂九竅為水注之氣者衇為血之府者營為水穀之精氣和調於五臟灑陳於六腑乃能入於衇者經衇所以行血氣營陰陽濡筋骨利關節者竝未嘗水血分言然則踞其源治水即能治血治血即能治水矣矧又言津液已行營衛大通糟粕以次傳下一若水穀入胃已後苟津液未行營衛未通其糟粕不能下者蓋胃中水穀之精氣上注於肺肺泌其清中之清者歸於心以生血衇營一身泌其清中之濁者仍歸於胃以輸降於小腸膀胱試取本經首言除脾胃寒熱次及通利九竅血衇關節則知木通於肺胃之交真能為之承接疏瀹使其氣化通血化利者即其莖小孔中通兩頭貫徹不有合於主衇之心化血之包絡乎不又有合於自胃而小腸自小腸而膀胱絶無阻隔乎誠使氣化通血化利清者升濁者降則在上之竅自無礙神明之游行在下之竅自能濟糟粕之輸瀉則所謂通利九竅血衇關節者與通利水道又豈有別耶是本經舉其全後世祇得其一節耳抑後人多謂木通瀉小腸者何居夫心主血衇而合小腸小腸者心臟傳化之腑也故先哲有云小腸通利則胸膈血散膻中血聚則小腸壅滯是則血衇通利即其通利小腸之本小腸通利正其通利血衇之功也以是細參之但在下則陽生陰中在上則陰生陽中其機無二上而火中之水在小腸者既和而能化則在下水中之火屬膀胱者亦應之而能化其機亦無二也但不可謂其專司小腸無與於膀胱又不可謂其既入小腸又入膀胱也特病因於膀胱者不得專主此耳然則仲景當歸四逆湯之用木通也為利水道設乎為通血衇設乎蓋古人之用藥也宜於此不宜於彼者勿用與他物不相和洽者勿用功不兩就者勿用夫惟手足厥寒衇細欲絶豈無陰邪水飲阻隔陽氣而然且非水與寒勾不用細辛即桂枝亦導飲下氣之物其與茯苓澤藛同用者不僅一處也特化氣化血各有攸分手足厥寒衇細欲絶氣息之微極矣斯時苟助陽壯氣用附子乾薑等劑原不防廁茯苓澤藛於其間使生者生化者化乃推其源不由氣之不煦而由血之不濡則當歸四逆湯者既不能助陽壯氣反用茯苓澤藛以化其氣為水而通利焉可不謂重虛其虛乎是茯苓澤藛於此雖宜於通利不宜於氣息之微與細辛桂枝洽不與當歸芍藥洽昭昭然矣然則通衇之物不有人參麥門冬乎夫惟血衇之行固以氣亦有血不澤而氣不行者故古人於經衇流通每比之風與水用乾薑附子以振陽猶之熱盛而風生也用當歸芍藥桂枝以生衇猶之決渠以通道也人參之通衇為鼓其橐籥無論已麥門冬之通衇雖亦比於滑澤水道然究協於土之焦枯而不通終未洽乎源之不濬而不達故濬血之源非理心之用不可欲通心之用於十二經十五絡非直探中焦受氣取汁變化而赤之本不可欲探其本舍木通其誰哉且人參麥門冬能使其流不能分其派也能使其來不能竟其委也則所謂功克兩就者其又舍木通而奚屬耶芍藥十月生芽正月乃長出土色紅漸大漸轉而青作叢莖上三枝五葉似牡丹而狹長高一二尺夏初開花其色不一結子入藥用根參圖經綱目芍藥十月生芽三月放花破陰寒凝沍而出乘陽氣全盛而榮故能破陰凝布陽和蓋陰氣結則陽不能入陰結破則陽氣布焉是布陽和之功又因破陰凝而成也特其味苦酸苦者能降不能開故凡陰沍之結於上非開無以致其力者忌之酸則能破能收故凡陰結既破不欲其大泄降者宜之此則所宜分別者也統計兩書用芍藥者六十四方其功在合桂枝以破營分之結合甘草以破腸胃之結合附子以破下焦之結其餘合利水藥則利水合通瘀藥則通瘀其體陰則既破而又有容納之善其用陽則能布而無燥烈之虞雖必合他藥始能成其功實有非他藥所能兼者世之人徒知其能收而不知其收實破而不泄之功也素問陰陽應象大論曰陽之汗以天地之雨名之陽之氣以天地之疾風名之張子正蒙云陽為陰纍則相持為雨而降陽在外不得入則周旋不舍而為風是故營陰結於內衛陽不得入則嗇嗇惡寒淅淅惡風翕翕發熱營與衛周旋不舍則鼻鳴乾嘔營與衛相持而終不相舍則汗出矣與桂枝湯芍藥桂枝一破陰一通陽且佐以生薑解其周旋不舍之維使以甘棗緩其相持之勢得微似有汗諸證遂止此實和營布陽之功斷斷非酸收止汗之謂也蓋用陽藥以破陰結則有便厥咽乾腳攣急之患徒通陽氣不破陰結則有汗多亡陽之禍茲則芍藥之功能非他所克代矣芍藥之任莫重於小建中湯其所治若煩若悸若裏急若腹滿痛為陰氣結無疑惟其治黃則有不可解者蓋小便自利即不能發黃仲景固言之矣今云小便自利何以得成黃耶用小建中夫是以知芍藥能入脾開結也胃能納受膀胱能輸泄水穀之道一若無恙乃病於黃則獨為脾病矣黃者水穀之精鬱於中而變見於外也小便不利為黃是水穀之氣皆不化水穀之氣皆不化是陰陽互結陰陽互結者其不得用芍藥審矣今小便自利而為黃是水氣化穀氣不化水氣化而穀氣不化是陰結而陽不布食入於陰不長氣於陽與溼熱成黃蓋有虛實之判矣夫如是焉得不用建中焉得不重芍藥抑非特此也虛勞篇之衄失精四肢痠疼咽乾口燥似皆桂枝芍藥所宜而不知皆由陰氣結陽不得入故浮游四射耳陰氣開陽氣入則浮火歸元矣非芍藥之功哉仲景於是篇著一小建中湯證於虛勞篇著一大黃䗪蟲丸證可見實證中有虛虛證中有實學者最宜體察也太陽病下之後衇促胸滿者桂枝去芍藥湯主之本太陽病醫反下之因爾腹滿時痛者桂枝加芍藥湯主之同一滿也而芍藥有去取之殊何哉芍藥之用在痛不在滿亦以滿為陽痛為陰耳夫然故建中芍藥最重當歸芍藥散尤重職是故也且皮有分部衇有經紀焉得上下無別乎胸中者陽之府天氣主之腹中者陰之府地氣主之結於上者多屬陽結於下者多屬陰譬之腸胃中燥結則用承氣心下燥結則用陷胸承氣用硝黃陷胸亦用硝黃然必兼蠲飲如甘遂葶藶之類故腹中滿痛多用芍藥如腹滿篇中大柴胡湯抵當烏頭桂枝等湯是也心下滿痛則在所不用如胸痹篇之桂枝生薑枳實湯烏頭赤石脂丸九痛丸等是也宜忌之旨概可見矣抑滿者氣之盛也陽氣盛於陽位則滿陰氣盛於陰位亦滿其見於內者有上下之分陽盛則衇促陰盛則衇弦澀據部位按衇象別痛否則芍藥當用不當用豈不瞭如指掌哉小茈胡湯通衇四逆湯防己黃芪湯皆以腹痛加芍藥前言不為謬矣桂枝加芍藥湯脾約麻仁丸則似用芍藥為下藥者蓋因陰結而地道不行得此即可通降故也乃真武湯則以下利去之甘遂半夏湯則以下利用之何哉夫用芍藥以開結爾甘遂半夏湯證曰衇伏其人利反快利而能快留飲欲去何必更用芍藥甘遂唯心下續堅滿則開結行水在所必須矣真武湯何獨不然既利而水氣行腹痛止則不必用芍藥若痢而腹痛不止則芍藥尚在必用此可意會而得者也太陰篇云衇弱其人續自便利設當行大黃芍藥者宜減之夫不曰不可用而曰宜減之則因陰結而腹痛因腹痛而下痢不得不用芍藥者在此潔古製芍藥湯治痢為有所本矣衇得諸芤動微緊男子失精女子夢交桂枝龍骨牡蠣湯主之火邪者桂枝去芍藥加蜀漆牡蠣龍骨救逆湯主之二證迥乎不同二湯相異僅芍藥一味其同其異必能別之而後芍藥之用可著也夫失精家少腹弦急陰頭寒目眩髮落衇極虛芤遲為清穀亡血失精太陽病以火熏之不得汗其人必躁到經不解必圊血名為火邪其同亡血也其異少腹弦急也亡血之因甚多此則陰不交陽陽氣四射逼血外出急變則亡陽緩變則勞瘵治此之法當審其陰何以不與陽交若少腹弦急則陰結也其不由陰結者必因驚怖陽氣上出陰氣下流也陰氣下流復用芍藥是為更虛其虛必至陰氣亦溢追逐陽氣陽氣無所駐足拔隊外亡不為牡蠣龍骨而收不為桂枝生薑而通不為甘草大棗而緩矣其由陰結者則以陽不得入也若用芍藥陰結既破陽氣遂布陰陽和調氣日生而血自益諸證遂不作矣夫豈非一味之攸繫耶天道下濟而光明是故陽欲其下地道卑而上行是故陰欲其升陽不下濟則旁出四射陰不上行則堅凝寒沍然有陽不交陰者有陰不交陽者陽不交陰陰遂寒沍法當引陽就陰四逆吳茱萸等證是也陰不交陽陽遂旁出法當破陰布陽附子真武等證是也是於用芍藥不用芍藥可以窺其際焉不用芍藥者由陽氣自離窟宅可無論矣用芍藥者又有水與寒之分水性流動故激射四出寒性堅凝故定止不移動故或咳或利或嘔則應之以生薑使追逐四出之邪不動故身體疼手足寒骨節痛則應之以人參使居中而禦侮白朮附子之溫燥以布陽光消陰翳茯苓之通利以開其出路而賴芍藥開通凝結則同蓋陰不開陽不入反足以助泄越者有之矣詎非此一味為之樞機耶芍藥能開陰結溼痹之骨節疼煩掣痛水氣之聚水成病獨非陰結耶皆不用何也蓋芍藥外能開營分之結不能解筋骨間結內能開下焦肝脾腎之結不能開上焦心肺之結也何以故夫外而營分內而肝脾腎皆血所常流行宿止者也芍藥璀璨之色馥郁之氣與血中之氣相宜不與水穀之氣為伍則能治血分之陰氣結不能治霧露水穀之陰氣結故溼痹水氣雖為陰結非芍藥所能開也然則血瘀豈非陰結之尤者而有用有不用其義何居蓋芍藥能治血之定不能治血之動桂枝龍骨牡蠣湯桂枝救逆湯柏葉湯黃土湯赤小豆當歸散瀉心湯旋覆花湯雖為血分之病乃因陽氣逼逐而然不關陰結故不用能治血中氣結不能治血結桃仁承氣湯抵當湯丸下瘀血湯大黃甘遂湯礬石丸紅藍花酒等證皆為血結非血中之氣結故不用辨此之法氣主煦之血主濡之不濡為血病不煦為氣病是以芍藥所主之血證多拘急腹痛也太陰病衇弱其人續自便利設當行大黃芍藥者宜減之以胃氣弱易動故也夫芍藥豈大黃之儔歟殊不知芍藥開陰結大黃開陽結品物迥殊開胃和中則同故以相提竝論耳曰若胃氣不和讝語者少與調胃承氣湯曰以小承氣湯少與微和之是視大黃不甚重也曰若厥愈足溫者重與芍藥甘草湯曰防己黃芪湯證胃中不和者加芍藥是視芍藥不為輕矣曰發汗後惡寒者虛故也芍藥甘草附子湯主之不惡寒但熱者實也當和胃氣與調胃承氣湯其寒熱虛實之機用大黃芍藥之義不昭昭然若發蒙乎然則芍藥甘草附子湯芍藥附子孰為主蓋兩物功齊力侔者也芍藥甘草得桂枝湯之半盡太陽未盡之風邪附子芍藥得真武湯之半抑少陰方興之水氣太陽病熱邪未除將合少陽者於芍藥甘草湯中加黃芩寒熱未除將入少陰者於芍藥甘草湯中加附子以此言之則發縱指示者芍藥其附子黃芩不過追逐得獸之力耳瞿麥苗高一尺葉尖小青色似地膚葉又似初生竹葉莖纖細有節梢間開花大如錢紅紫粉白數色根紫黑色形如細蔓菁子頗似麥用其蕊殼參圖經綱目凡花色斑斕味苦氣寒者大都為火化瞿麥花開午月亦適得火令之正但用其蕊殼不用其實是宜治火腑之病矣乃其實凡至乾爆則迸出不留故物之不當留者皆能決而去之小腸多血為泌別水穀之腑其所存留不過蓄血與宿水耳此本經主治所以首關格諸癃結小便不通而以破胎墮子下閉血為殿也肉中之刺及癰腫目中之翳皆非所宜留者遇此能不奔迫悉去耶至別録膀胱邪逆霍亂仍是宿水停留為害至養腎氣長毛髮兩語則別有意義蓋無宿水攪混則腎水清靜腎水清靜則精氣充強古人謂鬚下生屬水眉橫生屬木髮上生屬火瞿麥本從火也而花色燦爛是亦同氣相求之意耳衇浮小便不利微熱消渴者五苓散主之衇浮發熱渴欲飲水小便不利者豬苓湯主之小便不利有水氣其人若渴栝蔞瞿麥丸主之夫均用利水則皆有水氣可知且同為小便不利而渴其用藥殊異乃爾何也然此固有傷寒雜證之分亦即此可見豬苓澤藛能治動而不化之水瞿麥則能治停而不行之水矣夫五苓散證其上有太陽病發汗後大汗出胃中乾煩躁不得眠之源可見係胃乾求助於水水不行而為患病自寒來仍不能離辛甘發散之旨豬苓湯證其上有陽明病衇浮緊發熱汗出不惡寒反惡熱身重之源可見亦係胃熱飲水而停特以陽明屬燥金不比太陽寒水之化故辛甘不用改參入鹹味湧泄以除熱也栝蔞瞿麥丸證固係水停為患特其方下注云以腹中溫為知又可見其為本寒標熱矣本寒標熱用辛甘則嫌於助熱用鹹湧又嫌其助寒故別出清上溫下之法以瞿麥茯苓二味抉作病之由此固難與前兩證竝言者也以是知水之動而不定者非瞿麥所能治矣百合根如大匙色白數十百片相裹以其瓣種之三月生苗高二三尺一莖直上四向生葉似短竹葉色青近莖處微紫至四五月莖端開白花長五寸六出垂紅蕊結實似馬兜鈴此有數種惟白花者入藥參圖經綱目於邪氣腹脹心痛之候能利其大小便以愈之似為通利之物矣何以復能補中益氣耶不知惟於通利中能補中益氣方足為百合而其用可明也夫百合之根味甘色白是土金合德也其葉四指其花六出是金水相生也花葉者凡物發舒之氣根荄者凡物復命之源今發舒者四指六出而外射復命者十百相攢而內抱故曰百合百者推數之極也小便者化於肺而出於膀胱金水之相接也大便者化於胃而出於大腸土金之相接也設使陽不化陰大小便不利焉其治固無與於百合矣若陰不濟陽雖化而不能出則舍百合其誰與歸然須審定其滴滴歸源之故未可謂大小便不利凡緣陰不濟陽者皆可用百合也且大便不通則氣阻於下而腹脹小便不通則飲停於上而心痛者比比也豈遂盡可以百合治之乎雖然大腸燥熱大便不通則小便必利膀胱不化小便不利則大便必溏故夫大小便俱不通既腹脹復心痛者方得為土不生金金不化水於是而百合遂為確然不可易之物矣引土氣以就金導金氣而下注茯苓豬苓澤藛之功偉矣而無與於大便土鬱奪之金鬱泄之大黃芒硝枳實厚朴之能事盡矣而無與於小便若大㦸芫花甘遂葶藶能大小便俱通矣而不能補中益氣能補中益氣復大小便俱通吾知無與百合竝者矣何則根荄其體也花葉其用也其用外出黃體內抱以是知其所通利者邪氣而正氣仍不失內顧也雖然吾猶有說焉凡通降之物直行者多此則橫行何也蓋其葉四指而不昂其花六出而下垂其根千百相攢而橫疊善夫經衇別論之論小便曰水精四布五經竝行是知水氣自肺抵膀胱元非一線直行者也然則百合病治法輾轉不離百合論中不言有邪氣何耶夫此固不待言有邪而可喻者也傷寒論凡言太陽病吐之後下之後發汗後則甚多未有吐之後下之後發汗後更加一者字之例曰吐之後者下之後者發汗後者可見其病發於汗吐下後矣倘不有邪何以施汗吐下耶玩百合知母湯可以見汗則傷氣邪搏於氣分為消渴熱中也玩百合代赭湯可以見下則傷血邪搏於血分為血衇中熱也玩百合雞子湯可以見吐則傷上邪擾於心為煩懊不寐也玩百合地黃湯可以見不經吐下發汗則係百衇一宗悉致其病無氣血上下之偏矣所謂百衇一宗者何平人氣象論曰胃之大絡名曰虛里出於左乳下其動應衣為衇宗氣是最近於心乃著邪焉是以意欲食復不能食常默默欲臥不得臥欲行不得行飲食或有美時或有不欲聞食臭時如寒無寒如熱無熱皆心中輾轉不適之狀口苦小便數身形如和其衇微數皆心中熱鬱氣悗之徵以此例之邪氣腹滿心痛蓋有若合符節者而治法始終不外百合則以心本不任受邪心而竟為邪擾則不責將之謀慮不審即責相之治節不行今邪阻於上而不下行為肺之不主肅降無能遁矣故欲徵其愈期亟宜驗其小便凡溺時必肺氣下導小便乃出今氣拄於頭即欲下行上先有故則肺形之軒舉不垂氣之支結不降亦又何疑乃頭中之不適復分三等其最甚者至氣上拄而為痛其次則不痛而淅淅然又其次則因小便通而快然即此驗其軒舉支結之淺深微甚既瞭然如指掌矣況合之以百合地黃湯下云大便當如漆百合滑石散下云微利者止服熱則除則百合之能利大小便又豈有殊於本經之旨哉要之百合病之邪是餘邪以其多在發汗吐下後也百合所治之邪是虛邪以其利大小便仍不失返顧根本也百合之性從橫行而下行以其形也百合之用能使痰涎別於津液以其漬之則白沫自出也即別録所謂除浮腫臚脹痞滿寒熱通身疼痛乳難喉痹何莫非邪阻肺氣能橫不能下止涕淚又莫非津液能上不能下耶百合之能事盡矣知母形如菖蒲而柔潤葉至難死掘出隨生四月開青花如韭花八月結實參隱居圖經陶隱居云知母形似菖蒲根白色葉至難死掘出隨生須枯燥乃已則其具金之色秉至陰之性與土極相浹者惟其具金質而與土浹故陰氣有餘遂能生水此其入肺腎胃二臟一腑為不可易矣劉潛江云味甘而苦苦復兼辛雖苦居其勝然以甘始以辛終且其四月花則氣暢於火八月實則氣孕於金是不謂其入肺胃氣分不可也豫按主消渴此其入肺也熱中此其入胃也夫然故陽明火刑太陰大熱煩渴者在所必需第消渴之病小便少者古人謂之消渴小便多者謂之渴利消渴者多用知母而兼行水渴利者多不用知母而兼溫通蓋小便少者多由胃熱胃熱則下焦反無陽不能化水小便多者多由腎熱腎熱則吸引水精直達於下臟攝其氣府瀉其質為至速矣兩者審證之權衡用藥之精理也知母能益陰清熱止渴人所共知其能下水則以古人用者甚罕後學多不明其故蓋水能為患正以火用不宣也火用不宣更用知母是以水濟水益增泛濫矣不知病變之極難以常理論也夫人之所恃以為生者曰氣血所以播遷鼓舞使氣血互相生化者曰陰陽陰陽之徵兆曰水火無火則水汪洋四射無水則火爍石流金者其常也然不有火盛水反不流者乎每土潤溽暑大雨時行之際溝澮多盈及清風戒寒水遂以涸夫人豈無因熱而渴因渴而引飲因飲多水不化而腫者故千金外臺兩書用知母治水氣各一方千金曰有人患水腫腹大其堅如石四肢細少勞苦足脛即腫少飲食便氣急此終身之疾服利下藥不瘥者宜服此藥微除風溼利小便消水穀歲久服之乃可得力瘥後可常服其所用藥則加知母於五苓散中更增鬼箭羽丹參獨活秦艽海藻也外臺曰古今録驗澤漆湯療寒熱當風飲多暴腫身如吹衇浮數者其所用藥則澤藛知母海藻茯苓丹參秦艽防己豬苓大黃通草木香也其曰除風溼利小便曰療寒熱當風飲多暴腫可見本經所著下水之效見於除肢體浮腫而知母所治之肢體浮腫乃邪氣肢體浮腫非泛常肢體浮腫比矣正以寒熱外盛邪火內著渴而引飲火氣不能化水水遂泛濫四射治以知母是泄其火使不作渴引飲水遂無繼蓄者旋消由此言之仍是治渴非治水也於此見凡腫在一處他處反消瘦者多是邪氣勾留水火相阻之候不特千金方水腫腹大四肢細即金匱要略中桂枝芍藥知母湯治身體尪羸腳腫如脫亦其一也金匱方邪氣水火交阻於下千金方邪氣水火交阻於中阻於下者非發散不為功阻於中者非滲利何由泄此千金方所以用五苓散金匱方所以用麻黃附子防風然其本則均為水火交阻故其用桂朮知母則同也桂朮治水之阻知母治火之阻於此遂可見矣或問寒熱者氣水火者質也氣有相阻兩不相下者矣質則原相制剋兩者相值不火涸水即水滅火未有能相守不相賊者今曰水火交阻得無於理有不可通乎曰氣者質之帥也氣至質則隨之是故暴病之所至者氣久病之所至則質且人身之氣本欲其相制相制則兩相守而不相離故曰相火之下水氣承之君火之下陰精承之今者一則腹脹堅大如石而四肢細一則身體尪羸而腳腫蓋病有標本一處有病則一身之氣赴而救之故本既病延及於標然本者其力必厚既能為患於一處復足以浮游四出騷擾他處如茲二證者火之力尚優游水之力僅足以相距且欲卻焉則但治其水不治其火病烏能已不然古人治病最不肯誅伐無過既為水病水病者惟土勝火勝乃能愈又安可投助陰之知母耶二方知母分數在金匱方居第二等則以頭眩短氣溫溫欲吐皆火為患也在千金方居第三等則少勞苦足脛即腫為水稍能自立於此見長沙華原心心相印有如此者𦮷母二月生苗葉隨苗出莖細青色葉亦青似蕎麥七月開花碧緑色形如鼓子花斜懸向下上有紅衇有子在根下內心外瓣瓣形如聚貝黃白色四方連纍相著而有分解苗枯則根亦不佳圖經劉潛江云𦮷母八月採取其受金氣之專其味苦勝辛微辛在苦後是苦合於氣之微寒以歸於辛皆二陰至肺之處也況其白象金乎第苦合微寒是在地之陰也焉能遽至於在天之陽以治肺則當參其葉隨苗出之義而體其但有直透更無濡留矣但有直透能開熱之結更無濡留能達肺之鬱此言也與說詩者謂善療鬱結之疾合以諸氣憤鬱固屬於肺也但豫有說焉陽性開發陰性凝聚陰聚之陽且散之今云在天之陽不得在地之陰乃結熱而成鬱則容或有不然者況本經所臚主治均屬陽為陰鬱之候耶是皆誤於以𦮷母為其根而遺卻其附根以生連纍相著且有分解一層矣故以其葉隨苗出證其性之速而無濡留則可以為能從地而直透於天則不可若謂苗自此透其性必升則附子亦附根而生苗自此出且其味辛性溫氣復雄健絶倫遂可謂升之至者乎若謂藥物入胃必藉升始能及上則性降者入胃能不藉胃氣宣發遂可直從胃降乎試思傷寒煩熱淋瀝邪氣疝瘕喉痹乳難金瘡風痙何一非陰結而陽不舒散故皆當得陰鬱散而陽乃伸此夫人能知者矣故豫以片言決之曰𦮷母善橫解心胸間鬱結之疾何者即物言物則𦮷母固心微而辦厚心在中而瓣在旁此所謂橫解也𦮷母固附根而生連纍相著且有分解以其入肺故能治附肺而結之氣此所以不曰肺而曰心胸間也夫鬱積也詩晨風鬱彼北林傳聚也漢書揚雄傳注滯也左昭二十九年鬱湮不育注結束也釋名釋姿容縛也文選西京賦置羅之所羂結注謂收斂之也曲禮上德車結旌注無與有形焉得為積為聚為滯無與於陰何者為束為縛為之收斂且心胸間陽之都會也陽縱盛無所謂鬱與結比之腸胃間陰雖盛祇能痛能泄不得為鬱結理正同也故腸胃中善病陽鬱鬱則成燥鞕心胸中善病陰鬱鬱則聚涎唾是故𦮷母者治涎唾之藥也惟心胸間聚涎唾斯陰不下降而傷寒有煩熱淋瀝之候咽嗌間聚涎唾斯有邪氣者陽難上達而有喉痹之候不化血歸衝而有乳難之候疝瘕者涎唾自心胸阻任衇之行也風痙者涎唾聚心胸督衇不得陰以灌溉也惟金瘡則無與於涎唾然血出既多陰匱而無以續氣聚而不及化則反鬱結於心胸間為涎為唾者有之矣主以𦮷母使之速化化則能變而赤也或曰涎唾二字在金匱要略則曰多唾口燥在千金方則曰涎唾多心中溫溫液液而說文玉篇廣韻皆謂為口液則金匱千金所指當在口中之液又烏得聚心胸間縱使聚心胸間矣其與痰飲水氣何異而金匱肺痿肺癰咳嗽上氣篇痰飲篇咸不用𦮷母何也曰口之液固生於口中即貯於口中者歟抑亦分夫輸脾歸肺之津而上以滋於口者也生於口而即貯口決無之理則其生也捨心胸間更在何處惟其不隨氣以熏膚充身澤毛不為液以注於骨使骨節屈伸潤澤不為津使腠理發泄汗出溱溱不變為赤而入營中以周行經衇此所以為陰鬱此所以為陽不化耳痰飲水氣則與是異蓋皆劫水之未化者為之其被火爍而稠者謂之痰其遇窪則停而稀者謂之飲其漫無拘束而隨處浸溢者謂之水氣與涎唾屬已為肺化而不宣布者自迥不相侔如之何可以肺痿痰飲等篇之治概𦮷母之用耶未化之水宜化故其治法近外則散著裏即溫稍下則利已化之水宜分恐因其滓濁而遂及其精微此𦮷母之開解鬱結正以使清者歸清濁者歸濁護清而不留濁去濁而不傷清試證以白散之治是護其清者不使巴豆劫爍無餘也當歸𦮷母苦參丸之治是分其濁者隨苦參而泄入於下也黃芩苗長尺餘莖幹粗如箸葉從地四面作叢生類紫草葉細長青色兩兩相對六月開紫花根長四五寸色青黃老則中空圖經徐洄溪曰金之正色白而非黃但白為受色之地乃無色之色耳故凡物之屬金者往往借土之色以為色即五金亦以黃金為貴子肖其母也草木至秋感金氣則黃落故諸花實中凡色黃耐久者皆得金氣為多愚按人之臟腑中空者惟肺與腸胃黃芩中空色黃恰有合於金與土之德其生苗布葉開花成實皆當陽盛之時則其性屬陰其氣薄其味厚故又為陰中之陰氣薄則發泄味厚則泄故不為補劑而為泄劑肺主氣泄肺者無非泄氣分之熱腸胃主通調水穀泄腸胃者無非泄水穀中溼熱血者因氣調而行因氣滯而阻故凡氣以熱滯致血緣氣阻者得氣之調則行此黃芩之專司也劉潛江曰黃芩主諸熱黃疸腸澼泄利逐水是本經固以治溼熱推之與張潔古所謂瀉肺火治脾溼者不殊矣乃羅天益謂肺主氣熱傷氣黃芩能瀉火益氣利肺則其說不同何歟曰黃芩專主上焦陽中之陰者也蓋惟下焦陰中有陽而氣生故陰恆由命門以升上焦陽中有陰而氣化故陽恆由膻中以降今者上焦陽實陰虛則氣無由化氣不化則熱阻生溼故本經所謂指陽實言也潔古所謂指陰虛氣不化言也齊其本末約其初終皆為熱搏於氣與羅氏所謂瀉火利肺者豈有異耶肺之熱除則陰下降入心心氣既和斯惡瘡疸蝕火瘍悉消於是膻中之陰自和胃以浹於脾脾得陰濟遂能復其健運而黃疸泄利能已胃得陰和遂能復其通降而痰熱胃熱自除且能消穀大腸者肺之合小腸者心之合上竅阻則下竅亦阻上竅通則下竅悉通腸澼水氣能不解耶如此則黃芩能清氣分之熱是已乃亦能治血分之病何歟蓋黃芩所主血分諸病本由乎氣上焦陽中之陰治肺得降陰於心血分之源濬矣源既濬則流自清又何患血閉及淋露下血耶夫陽中之陰化氣化乃行氣化行水道乃暢故本經逐水下即繼之以下血閉血與水一而二二而一者也雖然黃芩於肺熱屬氣虛者即不可妄投以氣虛即陽虛陽虛更用黃芩是虛虛也故黃芩治氣分之熱為專功大腸次之清心胃之熱者由肺而推及之未有肺熱心胃能清者也小腸膀胱又因心胃既治而推及之未有心胃留熱而血能和血不和而水道能清者也仲景用黃芩有三耦焉氣分熱結者與柴胡為耦小柴胡湯大柴胡湯柴胡桂枝乾薑湯柴胡桂枝湯血分熱結者與芍藥為耦桂枝柴胡湯黃芩湯大柴胡湯黃連阿膠湯鱉甲煎丸大黃䗪蟲丸奔豚湯王不留行散當歸散溼熱阻中者與黃連為耦半夏瀉心湯甘草瀉心湯生薑瀉心湯葛根黃芩黃連湯乾薑黃芩黃連人參湯以柴胡能開氣分之結不能泄氣分之熱芍藥能開血分之結不能清迫血之熱黃連能治溼生之熱不能治熱生之溼譬之解鬪但去其鬪者未平其致鬪之怒鬪終未已也故黃芩協柴胡能清氣分之熱協芍藥能泄迫血之熱協黃連能解熱生之溼也小柴胡證腹中痛者去黃芩加芍藥心下悸小便不利者去黃芩加茯苓夫腹中痛未必非氣血之結而心下悸小便不利亦何以決知其非氣熱而生之水且本經明言黃芩能逐水別録明言黃芩能除小腹絞痛利小腸而遽去之何耶殊不知治腹滿痛腹痛繞臍痛少腹㽲痛有可用寒藥者惟腹中痛者必無中熱之理仲景是以於厥陰篇特標其旨曰腹中痛若轉氣下趨少腹者此欲自利也其他如真武湯之腹痛小便不利小建中湯之腹中急痛附子粳米湯之腹中寒氣雷鳴切痛當歸生薑羊肉湯之腹中痛及脅痛裏急抵當烏頭桂枝湯之腹中痛逆冷手足不仁致痛雖殊治痛亦異用溫藥則同以是知腹痛下一中字則與凡痛有別用黃芩諸方必無此矣彼小腹絞痛者乃熱氣迫血血結少腹而痛與鱉甲煎丸大黃䗪蟲丸王不留行散之用黃芩不殊也小便不利原不必忌黃芩小便不利而心下悸則不容更用黃芩何則仲景云太陽病小便利者以飲水多必心下悸小便少者必苦裏急也彼雖論血結此亦可借以喻氣結曰飲水多而心下悸則非熱阻所化之水矣熱阻所化之水可以黃芩逐飲水而停蓄者其可以黃芩逐之耶蓋水氣凌心為悸必寒水乃然若熱化之水氣則脾家上升瀰濛之氣中焦變化取赤之汁終日周流於膻中而稟命於心君若均能致悸則無病人有不悸時耶李瀕湖言有人素多酒欲少腹絞痛不可忍小便如淋諸藥不效偶用黃芩木通甘草三味煎服遂止王海藏言有人因虛服附子藥多病小便閟服芩連藥而愈大抵黃芩之用凡氣分有餘挾熱攻衝他所者乃為的對若他所自病不係熱氣攻衝者則不可服服之必益虛其氣他所之病反足以攻衝於氣矣或問黃芩湯治何等證其證腹痛與否若腹痛何以用黃芩若腹不痛何以用芍藥曰其證身熱不惡風亦不惡熱或下痢或嘔腹則不痛蓋芍藥甘草大棗桂枝湯裏藥也以不惡風故不用薑桂黃芩甘草大棗小柴胡湯裏藥也以不往來寒熱故不用柴胡以其常熱故不用人參若不嘔則竝不用半夏生薑至芍藥則竝不因腹痛而用以桂枝湯證原無腹痛也亦不心下痞硬以不去大棗也夫芍藥甘草湯治傷寒汗出誤服桂枝湯後足脛拘急已見其能破陽邪於陰分矣加以黃芩不益可見陽分之熱甚盛攻於陰分為利非陰中自有愆陽之結耶仲景於厥陰篇云傷寒衇遲與黃芩湯除其熱腹中則冷不能食可知黃芩湯證之衇必數黃芩所治之熱必自裏達外不治但在表分之熱矣黃芩治自裏達外之熱千金歷有明文芍藥湯治産後虛熱頭痛若通身發熱者加黃芩慎火草散治崩中漏下赤白青黑腐臭不可近熱多者加知母黃芩道人深師增損腎瀝湯治風虛勞損挾毒腳弱疼痛下焦虛冷胸中有熱其熱多者加黃芩又可知陰虛氣盛熱自內出者黃芩亦能治之而不但治感觸所化韞中達外之熱矣李瀕湖自緣感冒咳嗽既久且犯戒遂病骨蒸發熱膚如火燎每日吐痰盈碗暑月煩渴寢食既廢衇浮洪偏服柴胡麥虋冬荊瀝諸藥月餘益劇皆以為必死其尊人以謂李東垣治肺熱如火燎煩躁引飲晝甚者宜一味黃芩以瀉肺經氣分之火遂按方用黃芩一兩煎服次日身熱盡退痰嗽皆愈於此益可知黃芩所治必肺經氣分之熱肺經氣分之熱必晝甚於夜也黃芩本經主黃疸腸澼泄利金匱要略及傷寒論發黃證皆不用泄利證兩書除諸瀉心湯外亦絶不用今以千金方參合而考之亦頗有意義可尋也千金治黃方凡有黃芩者多云一身面目悉黃金匱要略中所載有身體盡黃者有額上黑者有面青目黑者可知疸證非一身面目悉黃者不可用矣千金治熱利冷利疳溼利小兒利用黃芩方多有壯熱一語可知泄利無熱者不可用矣大抵氣主充周無處不到凡病有彼此不相侔者必非氣分之病黃芩主氣分之熱於此不可以相證乎千金治小兒核腫壯熱有實方及治小兒熱毒入膀胱中忽患小便不通欲小便則澀痛不出出少如血須臾復出地膚子湯治小兒落牀墮地如有瘀血腹中陰陰寒熱不肯乳哺但啼哭叫喚蒲黃湯皆有黃芩考茲數證均為氣熱攻血亦徹其病本之治別録所謂黃芩治小兒腹痛者於此可明其旨矣即其治小腹絞痛亦當與此不異蓋傷寒金匱兩書僅有腹痛去黃芩之文大率黃芩所治之小腹絞痛必煩熱必口渴必小便有異於常捨此則非所宜矣紫菀三月內布地生苗其葉二四相連紫色本有白毛五六月開黃白紫花結黑子根甚柔細參隱居圖經盧芷園曰菀即古鬱字故治鬱結其色不一取色紫味苦者以治胸中寒熱結氣夫胸中者肺之部分也肺中有火內鬱而為咳喘肺熱葉焦外發而為痿躄所以致五臟不安用其色以行肺之用用其氣以散肺之結用其味以順火之性而助肺之降以諸氣憤鬱皆屬肺也倘無結氣而用之未免亡走肺之津液矣劉潛江云經曰宗氣積於胸中出於喉嚨以貫心衇而行呼吸是非金火合德氣乃行乎夫肺為氣主胸中固肺所治也然必貫心衇以行呼吸者緣心為衇主衇乃血舍由離中有坎故火出於水而氣生水至於火而血化是元氣呼吸之本實下根於腎上主於心非肺氣所能獨治也設使水不至於火而氣不能化血於是火遂不為金用而肺虛肺虛則咳逆上氣作矣更火不合於金而刑於金輕則喘咳重則咳唾膿血且有虛而成勞者矣紫菀色紫質柔為水與火合紫者赤黑相兼也凡物煮之則柔是為水火合德其味苦勝辛為火為金用水既與火合火既為金用寧有胸中寒熱結氣不散咳逆上氣不除者耶抑痿蹶屬何因亦以紫菀療之也痿論曰肺者臟之長心之蓋也有所失亡所求不得則發肺鳴鳴則肺熱葉焦發為痿蹶夫有所亡失則思所求不得則慮舉是二端以類推其煩心耗血皆能致肺之陰氣消而葉焦舉矣舉痛論曰悲則心系急肺布葉舉上焦不通營衛不散熱氣在中故氣消矣是不可證肺之熱而葉舉者皆由於心歟然則肺所以主氣而行營衛治陰陽者豈徒恃有八葉葉中有二十四空行列分布以行諸臟之氣哉蓋亦以心主其下有心包絡之生血不致因熱鬱蒸令陽中之陰上與清虛之肺合故能行營衛治陰陽耳知此則紫菀之所以安五臟療痿蹶者固的係火為金用矣雖然紫菀所主治尚當推尋其故使輔之者各得其當乃收全功如在上熱壅以致包絡陰傷則宜清熱在下陰傷相火竝於包絡則宜益陰若肺之陰氣不足陽氣益微則宜補益不得以切於治而徒手使之則善矣款冬花根紫色葉似萆薢叢生十二月於根畔開花黃青紫萼去土一二寸初出如菊花萼通直而無子圖經劉潛江云易繫辭曰一陰一陽之謂道素問陰陽應象大論曰積陽為天積陰為地故在天則陰為主而生陰在地則陰為主而生陽然天之陽不得陰和則為亢陽不能化陰以降地之陰不得陽和則為窮陰不能化陽以升人氣應之故腎為陰中之陽能上際乎天肺為陽中之陰能下極於地然肺必得腎氣至而降腎必得肺氣至而升腎不升則水氣腫滿之患作肺不降則咳逆上氣喘息喉痹之病生是故咳逆上氣喘息喉痹者陰中之陽不上朝以致陽中之陰不下降也款冬花氣得天之溫味其辛甘發散本為至陽之物特當隆冬天地閉塞之候以堅冰為膏壤吸霜雪以自濡且其花不麗於莖端不緣於葉際偏附近於赤黑相兼之根則不謂其能在陽吸陰以歸於下而從陰生陽不可驚癇者陽不依陰也寒熱邪氣者陰陽不和而相爭也治諸驚癇寒熱邪氣言凡陰陽不和陽不依陰陰不附陽之證得此在陽吸陰從陰生陽之物則陰陽自相依附而和也紫菀款冬花仲景書他處不用獨於肺痿上氣咳嗽篇射干麻黃湯中用之射干麻黃湯即小青龍湯去桂枝芍藥甘草加射干紫菀款冬花大棗也小青龍湯蓋即麻黃湯桂枝湯合方去杏仁大棗生薑加細辛五味乾薑外以發表內以下氣消飲者今咳而上氣喉中水雞聲則為風寒混於氣水飲混於痰痰礙其氣氣觸其痰上焦心肺之間勢將鬱而生火故生薑易乾薑以熯飲為散飲紫菀易桂枝以通營為化營款冬易芍藥以破陰為吸陰大棗易甘草以緩中為補中加射干協五味以下氣仍是小青龍局法已化峻為和寓補於散矣紫菀款冬雖不得為是方主劑然局法之轉移實以紫菀款冬變故千金外臺凡治咳逆久嗽竝用紫菀款冬者十方而九則於此方亦不可不為要藥矣然二物者一則開結使中焦之陰化血一則吸陰下歸究之功力略同而其異在千金外臺亦約略可見蓋凡唾膿血失音者及風寒水氣盛者多不甚用款冬但用紫菀款冬則每同溫劑補劑用者為多是不可得其大旨哉敗醬春初生苗深冬始雕初時葉布地似菘菜而狹長有鋸齒緑色面深背淺夏秋莖高二三尺而柔弱數寸一節節間生葉四散如繖顛頂開白花成簇結小實其根白紫頗似柴胡綱目醬之為物以穀蒸盦而成已與生氣絶遠然晝被日迫夜吸露華與天地之生氣相吐納則又別著生趣逮其陳且敗則雖未至臭穢特於生意遂無絲髮可繫矣是物之根作陳敗醬色即其氣亦復似之偏生於早春至深冬始雕是無論生長收藏溫涼寒熱俱不能閡其欣欣向榮之性所謂極無生氣之中偏具無限生機者也人身血液津唾被寒熱逼爍至成一切癰疽疥痔日漸敗壞此物偏能引致生氣俾寓於其中以漸化死為生亦可為元之又元矣豫敏求曰醬緣日逼而成夏月成之尤速俗傳暑候酷日暴之之水有毒取作浴湯必生瘡癰則醬豈能無毒是物能敗醬中之毒故以為名本經取治火瘡赤氣疥瘙疽痔之因暴熱而成者其義正與此合暴係日暴之暴不作疾速解也徽人以是物作齏云食之不生瘡癤紫參苗長一二尺莖青而細葉似槐五月開花色白似蔥花亦有紅紫似水葒者根淡紫黑色如地黃狀肉紅白色圖經古人於本經不置解釋經旨自明近人於本經多為疏箋經旨反晦蓋古人於經熟讀紬繹其意自然貫串聯絡而精粹處遂躍然心目間近人則先有一種意見牢固於中如所謂苦能降復能通寒能勝熱復能滑泄者是以經文飾我意見非以我學識破析經義迎而悉之也如紫參本經主治即以前數語敷衍之誰曰不可然心腹積聚寒熱邪氣柴胡亦能主之九竅菖蒲亦能通之大小便大黃亦能利之究亦何必紫參此經旨所以晦也若謂心腹積聚寒熱邪氣以利大小便而可解則近之矣然以通九竅一語橫梗於中又屬何故豈在上之七竅亦可為心腹積聚寒熱邪氣出路耶是其旨仍晦而無可與於深思力索心知其故矣豫蓋因別録而有悟焉夫紫參味苦氣寒必心腹積聚寒熱邪氣既已化為大熱者方得用之以其能使從九竅泄也夫腸胃大熱其勢欲上行者必過於通欲下行者必過於塞故在上之病為唾血為衄血皆可證其過於通在下之病為腸中聚血為癰腫諸瘡皆可證其過於塞過於通者化其氣而病自除過於塞者必去其質而後已此所以云利大小便不云利涕唾泗洟也夫邪非本輕決不上行邪非重濁必不下壅各因其性而通利之所謂適事為故耳紫參根包紫黑外深內淺固已可見其入血而花或白如蔥或赤如蓼可見其遇血在上能化其氣以止之遇血在下能逐其質以通之矣即如仲景用紫參兩方一則咳而衇沉是病在上而徵見於下一則下利肺痛是病在下而急反於上豈非用其既清化在上之標則藉其通在下之本耶知此則凡病在血而上下雙當其患者為紫參之的主可一言決矣石韋生陰崖險罅處其葉如𫞉長者近尺闊寸餘柔韌如皮背有黃毛而多斑點凌冬不雕參圖經綱目盧子繇曰石者山骨韋為之皮秉水之用火之體從堅凝閉密中暢達敷布故主勞熱邪氣致五癃者蓋假石性之栗悍宣通水道捷於影響石性至剛縱使火煆金鑽能通其質不能通其氣雖然端溪之硯蓄水不冰此水之溫氣漬於石也丹硫之穴其水可浴此石之溫氣貫於水也故夫至柔方能馳聘至剛老氏之者不吾欺矣夫此猶為石溫水溫久積漸使然者言耳若石既稟陰剛之性所處又陰崖險罅水聲人跡不經之所宜乎為陰之尤矣乃偏生極柔極韌之石韋何哉且其味苦屬陰氣平復屬陰若論陰陽交和而後生氣得鍾豈有此物生於此處之理殊不知苦原火化平本秋容化於火而能柔是以得鍾生氣於至剛之處出於夷而自險是以能存危栗於巉仄之區意之所洽即理之所在理之所在即功效之所自矣熱而曰勞且附以邪氣則其內倚巉巖之骨可知癃閉不通兼五則因勞熱而氣化遂失其樞致水氣頑礦如石可見此時若以寒劑泄其熱則水勢愈湧熱仍不除若以熱劑通其閉則適助其熱氣化仍不能轉故必以稟陰氣而萌芽於堅頑巉削之石中者使附骨之陰氣發生而勞熱消勞熱消而氣化遂得轉一舉而無微不入無患不除焉古聖人之因物揣情因情度勢因勢除弊又豈後人廣絡原野顧此失彼之智可同日語耶或問五癃唐以前人無疏及此者後世多以五淋目之特五淋皆小便不通之候古人文尚簡本經既曰五癃閉不通矣復曰利小便水道得無有復而其間有賸義歟曰稽之素問宣明五氣篇膀胱不利為癃五常政大論其病癃閟王注癃為小便不通則以五癃為五淋蓋亦未為非是若更證之以奇病論之有癃者一日數十溲甲乙經之氣癃虛則遺溺似有漏義焉蓋熱冷氣沙勞五淋者皆小便之不通而別其源徵其象有此五種也若靈樞五癃津液別篇之溺也氣也汗也泣也唾也則所該者廣五淋僅溺之一端矣訓詁之書說文最為近古其於癃下不詁為小便不利而詁為罷病亦可見癃之為病非暴病非實病矣故夫癃之虛者溺多汗多泣多唾多氣出而不反也實者溺祕汗祕目乾舌燥氣結而不解也凡診病之道虛中當求其實實中當求其虛癃本罷病罷病之中又有虛實如此者焉於此見本經石韋主治勞熱為虛邪氣為實邪氣著於勞熱是虛中有實癃為虛閉不通為實五癃閉不通亦是虛中有實石韋之為物惟其稟質柔軟是以能治虛熱惟其發生於剛悍是以能通閉結惟其性平是以能下行利小便水道之功為尤擅於此又可見凡氣虛熱結目乾口燥無汗便閉者石韋均能治之而於通小便為最善以是較之訓五癃為五淋者其義豈不廣且博耶即推之千金治血淋之石韋散治虛勞渴無不效之骨填煎及治五勞七傷八風十二痹方可以思矣白薇莖葉俱青頗類柳葉六七月開紅花八月結實根黃白色類牛膝而小八月采圖經中風而至身熱肢滿忽忽不知人狂惑決非一朝一夕之故矣乃曰暴豈暴中風者固能如是乎許學士曰凡人平居無疾苦忽如死人身不動搖默默不知人目間不能開口啞不能言者或微知人惡聞人聲但如眩冒移時方寤此由身汗過多乃至血少氣屏於血陽獨上而不下氣壅塞而不行故身如死狀氣過血還陰陽復通故移時方寤名曰鬱冒亦名血厥婦人多有之宜白薇湯此正與本經主治固少有參差者惟本事方不言身熱肢滿可見一有邪一無邪耳夫有餘而往不足隨之不足而往有餘從之故血暴虛而氣代之充液暴衰而陽襲以入原理之常無足深怪第當其時而偶中風邪則更引動一身之氣傾國之陽以敵邪名曰禦外侮實則內已竭然究以其得病之暴受邪必微設使徒緣外狀不辨夙因而施之以或散或清是不異於操刀殺之矣於斯時也解外更無庸急安內斷不可緩故須藉白薇之遇春輒發者一若使之專力解外而不知正賴其味苦且鹹一徑直下純乎降而絶無升者以返其陽氣於浮越失據矣試參爾雅名之曰葞曰春草謂其絶無與於取透發之微或弭亂之大不可也更參其根似牛膝柔軟易曲謂其於導陽下返尚係強制也可乎邪氣寒熱痠疼汗出後受溼也溫瘧洗洗發作有時汗出熱乃盛也故仲景於婦人乳中虛煩亂嘔逆者竹皮大丸中用此而有熱者更倍之艾二月宿根生苗成叢其莖直生白色高四五尺葉四布狀如蒿分為五尖丫上復有小尖面青背白有茸而柔厚七八月葉間出穗如車前細花結實纍纍盈枝中有細子霜後始枯五月五日連莖刈取暴乾收葉綱目張茂先曰積艾三年後燒之津液下流成鉛錫夫是之謂藉陽通陰又曰削冰令圓舉以向日艾承其影則有火夫是之謂隔陰化陽藉陽通陰以艾灸病之法也隔陰化陽以艾入湯之例也異法方宜論中臟寒生滿病者其治宜灸焫痛生於內者其治宜毒藥仲景於陰壅陽微者每用灸法而湯中入艾必挾寒劑在傷寒論金匱要略可循其緒而推之也曰衇浮熱盛反灸之此為實實以虛治必咽燥唾血曰微數之衇慎不可灸因火為邪則為煩逆追虛逐實血散衇中火氣雖微內攻有力此可見灸之為法能治陽虛陰蔽而追虛逐實行血衇中者也曰吐血不止曰婦人有漏下有半産後下血不絶有妊娠下血假令妊娠腹中痛為胞阻柏葉湯有乾薑馬通之溫柏葉之寒膠艾湯有阿膠地芍之寒芎歸之溫此可見皆以艾隔陰而化其陽矣雖然灸法猶易明也隔陰而化陽奈何蓋陰蔽而格陽陽浮而不入陰斯時也以陽藥通陰則助浮陽之焰以陰藥攝陽則增陰滯之凝設非以此交而通之承而化之無十全法矣譬如別録所列主治吐血婦人漏血其義既已可識而下利下部䘌瘡不謂之溼在中而陽不得下不可也以是參之然乎否耶中品草六味木十一味王瓜三月生苗其蔓多鬚葉圓如馬啼而有光面青背淡澀而不光六七月開五出小黃花成簇結子纍纍殼亦粗澀徑寸長二寸許上微圓下尖長七八月熟有紅黃二色殼中子如螳螂頭人謂之赤雹子其根即土瓜根也如栝蔞根之小者於細根上又生淡黃根三五相連須深掘二三尺乃得正根澄粉甚白膩參衍義綱目王瓜與栝蔞種種頗同故其性情亦多相近者特栝蔞實中結蔞子攢蔞上故為啓脾陰以奉極高之心肺王瓜蔓上多鬚根根疊接三五相連故為行脾精以輸經絡隧道又栝蔞之蔓光滑王瓜之蔓粗澀栝蔞之子酸王瓜之子酸苦是其性有純駁之分純者主益駁者主行故栝蔞功用多在滋養王瓜則專事通行似適相反然亦有相竝而不相背者蓋胸膈能乾涸枯澀經絡間豈不能乾涸枯澀但胸膈緣枯澀而不行者必係燥痰凝結經絡間緣枯澀而不行者必係瘀血敗液觀其不但曰消渴而曰消渴內痹不曰血閉癥瘕而曰瘀血月閉寒熱酸疼又如別録所謂婦人帶下不通小便數不禁四肢骨節中水竝推挽備見之辭可見其致病之源皆有物留著而其物僅能留而不能結又烏可謂非緣所行之道枯澀不通如舟之阻淺者耶經衇別論所列飲入胃至下輸膀胱周回曲折乃爾其經由之道豈能不藉滋溉而有所耗減者乃消渴之為病則飲水一斗小便亦一斗飲已即溺是其必不回環而徑情直行不使他處得滋且溉可見矣則向之所謂四布竝行之地庸詎非因內痹而不納耶又庸詎非因不得滋且溉而遂內痹耶五臟生成篇諸血者皆屬於心人臥則血歸於肝肝受血而能視足受血而能步掌受血而能握指受血而能攝臥出而風吹之血凝於膚為痹凝於衇為泣凝於足為厥彼其風吹之能凝則熱爍之亦能澀澀則太衝衇不通月事遂不能應然究係澀而非結結則近在一處澀則遍體皆然在一處者為癥為瘕為痃為癖已耳遍體皆然則氣道不利陰陽相軋而陰勝陽為寒陽勝陰為熱溼阻為酸熱阻為疼矣脾陰既周徑道滑澤何澀不利何阻不通譬之行舟阻淺縱縴挽棹揚百夫齊奮竭平生之力不見其功一朝水溢舟浮踴躍歡騰揚帆遠引舟中之人盡色飛神旺意氣百倍而謂水溢為益氣又寧有愧詞哉愈聾亦愈氣道不能滑利之聾因泣澀而聰氣不自腎上潮聲聞不自耳下達者耳非老年精氣衰竭之聾也雖然消渴月閉之因不少矣何以的知其為內痹泣澀而致者夫內痹泣澀亦必有外候可尋如消渴則病源所謂大渴數飲其人必眩背寒而嘔千金所謂日就羸瘦咽哽唇口焦燥吸吸少氣不得多語心煩熱兩腳痠外臺所謂口乾數飲水腰腳弱膝冷小便數用心力即煩悶鈔廣濟方是也月閉則金匱要略所謂帶下經水不利小腹滿痛經一月再見是也且血結則不能通通則不得為結血結月閉而發熱者有之矣未有血結月閉而寒熱者縱使有之若酸疼則終非血之所能兼矣總之土瓜根之治大率皆似通而實不通之候故別録所載既云婦人帶下緊接以不通四肢骨節間有水小便仍利與金匱所謂經水不利月事一月再行者若合符節即陽明津液內竭大便不通之不容下者以此導之則亦可知其旨趣之所在矣海藻有二種一種馬尾藻生淺水中如短馬尾細黑色一種大葉藻生深海中葉如水藻而大拾遺凡水草皆鍾生氣於水中特菖斛之屬托根於水底之碎石藻則托根於水底之泥蒲荷之屬托根於泥矣其枝葉能出水藻則搖曳水中縱能及水面而不能出水且藻之為物其枝葉非兩兩對生則節節連生其莖柔而不脆其葉碎而不亂夫水者象人之血及津液涕唾水之中象身水之上象頭石象骨泥象肉能出水者其義為從血液涕唾而出行於清空不能出水者其義為僅通行血液涕唾中而不能及頭至於兩兩相對節節相連柔而韌碎而整其義舍人身之經衇而誰擬哉此猶凡藻皆同者也若夫海藻則魄力更大氣味更雄且其氣寒寒則勝熱其味苦鹹苦則降泄鹹則湧泄降而湧者行水之術也苦為火味鹹為水味水火相結最難解者無如痰是以為治經衇間熱痰鬱結最宜之物癭瘤為氣結硬核為痰結痛及癰腫為熱結靈樞寒熱篇黃帝問於岐伯曰寒熱瘰癧在頸腋者何氣使生岐伯曰此寒熱毒氣留於衇而不去者也帝曰去之奈何岐伯曰鼠瘻之本皆在於臟其末上出於頸腋之間浮於衇中未著於肌肉外為膿血是癭瘤瘰癧雖根於五臟其患止能及頸腋不能上頭者正為海藻之所主較之於荷於蒲專治頭目之疾者可對待觀矣癥瘕為病其因不一其治之者亦不一夷考本經禹餘糧主癥瘕大熱龍骨主癥瘕堅結鱉甲主破癥瘕牡丹皮主癥瘕瘀血留舍腸胃鱉甲主癥瘕堅積蜚虻主癥瘕寒熱蜚廉主癥堅寒熱䗪蟲主血積癥瘕白堊主寒熱癥瘕目閉積聚附子主癥堅積聚血瘕蜀漆主癥堅痞結積聚雚菌主癥瘕諸蟲巴豆主癥瘕結聚堅積其餘主癥瘕積聚者有曾青苦參桑黑耳鳶尾葶藶大黃甘遂主癥瘕血閉者有太乙餘糧卷柏紫葳主癥瘕結氣者有陽起石殷孽今海藻所主者曰癥瘕結氣則可知非蟲非血無寒熱無積聚在腹中而不在腸胃在經衇而經衇不結是為氣而堅者矣至腹中鳴其因亦不一在丹參曰腸鳴幽幽如走水在桔梗曰腹滿腸鳴幽幽今海藻則曰腹中上下鳴夫幽幽者其聲細以暗若但曰鳴則轟轟然聲大矣且彼在腸此在腹腸中之聲必曲折斷續腹中之聲必砰訇直遂又一則如走水是其㶁㶁流澌之狀可稔一則兼腹滿是其嗚嗚難達之意可知而此上下於腹中是其或由上而下或由下而上來往循環相連不斷又可想矣至十二水腫又有蕘花亦下十二水者但彼曰十二水則十二經衇有水非必腫也觀於小青龍去麻黃加蕘花是矣此則下十二水腫可見必十二經衇有水已經外見浮腫乃可用矣雖然癭瘤硬核但不上頭耳不能必結於經衇所至之處即以經衇所至之處而起及其漸大亦不能不旁溢及他癥瘕腹鳴則斷斷非經衇間病十二水者謂腫起於十二經之水則可謂水但腫於十二經衇則不可若此者又將何說以通之即夫經衇必有起訖靈樞經衇篇歷敘十二經衇始於手太陰終於足厥陰曰肺手太陰之衇起於中焦肝足厥陰之衇從肝貫膈注於肺是衇之起訖在中下二焦中焦者結癥瘕之常所下焦則聚水之窟穴也癥瘕若結於下焉知其不涉及血水若聚於中焦焉知其不為嘔且泄猶可以苦降鹹湧之海藻治之耶中焦為陽之會下焦為陰之歸氣者陽水者陰陽病於陽位陰病於陰位理宜然矣故仲景於海藻僅治腰已下水氣牡蠣澤藛散中用之以傷寒暴病水能堅氣未必能堅耳防己莖如葛蔓延而甚嫩苗葉小類牽牛折其莖一頭吹之氣從中貫而出彼頭根外白內黃如桔梗實而香內有黑紋如車輻解其青白虛軟氣腥皮皺上有丁足子者不堪用參藥録圖經主風寒溫瘧熱氣猶言但治此病之熱氣以明倘有他氣當更兼他物以治之也諸癇除邪猶言但能為此病除邪以明若有他故亦當更兼他物以治之也利大小便猶言此熱此邪用此物治不從汗泄不從吐越必從大小便而出也所以然者防己味辛主通氣平主降根白象肺肉黃象脾紋黑象腎肺主皮毛脾主肌肉腎主水液其紋象車輻之解內自中出外不及皮其義為病自腎出外抵肌肉者凡所臚證悉能治之也然則溫瘧與癇皆腎病乎夫瘧論曰溫瘧者得之冬中於風藏於骨髓之間因遇大暑邪氣與汗皆出此病藏於腎其氣從內出於外則所謂自腎及肌肉者非耶千金曰病先身熱掣瘲驚啼叫喚而後發癇衇浮者為陽癇病在六腑外在肌膚猶易治也病先身冷不驚掣不啼呼病發時衇沉者為陰癇病在五臟內在骨髓極難治也又曰癇有三種有風癇有驚癇有食癇風癇者緣衣暖汗出風因入也初得之時先屈指如數物者風癇也驚癇者起於驚怖大啼乃發作也食癇者其先不欲乳哺而吐先寒後熱乃發癇也蓋非腎氣上凌不至卒倒無知非腎氣挾帶痰涎上蒙乎心外貫血衇不至手足搐搦筋衇掣瘲且陽癇外抵肌膚陰癇內鍾骨髓猶可謂非內自腎外及肌肉之病乎至別録所謂傷寒寒熱邪氣通腠理則猶之主寒熱溫瘧之熱氣也中風手腳攣急則猶之為諸癇除邪也去膀胱熱利九竅止泄即所謂利大小便也癰腫惡結諸瘑疥癬蟲瘡皆溼壅於肌肉而成風腫水腫亦風水鬱於肌肉之疴均本經主治之餘波矣防己之為物有黑紋貫於黃肉中其用為治水侵於脾無惑矣然仲景治風水皮水所謂身重汗出惡風水氣在皮膚中四肢腫聶聶動者均與此合以身重固係脾病四肢為脾之合故也獨木防己湯之膈間支飲己椒藶黃丸之腸間水氣一在上一在下似不關乎脾者亦皆用之何也蓋此上下盡病治其中也夫支飲不關乎下何以用芒硝腸間有水氣不關乎上何以用葶藶故衇沉緊面色黧黑即病根於下之徵口舌乾燥乃病及於上之驗支飲之心下痞堅腸間水氣之腹滿雖於脾有略上略下之差然究竟不得不為脾病且病在上吐之則愈在下下之則愈吐下之不愈病不在中而何在哉此可見水飲等病在經衇肌肉者多虛在胸膈腸胃者多實在胸膈者猶實中之虛惟在腸胃乃為實中之實耳然虛者反挾熱實者反挾寒此其間則亦有出蓋惟其虛與熱斯飄於外舉於上惟其實與寒斯著於內沉於下此防己黃芪湯防己茯苓湯所以用芪用朮木防己湯所以用參己椒藶黃丸所以用椒目也防己地黃湯地黃最重防風桂枝次之防己甘草最少偏以防己名湯且冠於地黃之上何歟夫固因證之主為之名耳靈樞顛狂篇曰狂言驚亂善笑好歌樂妄行不休者得之大恐取手陽明太陽太陰素問舉痛論曰恐則精卻卻則上焦閉閉則氣還還則下焦脹故氣不行今曰病如狂狀妄行獨語不休不與精卻而上焦閉者合乎用地黃是治精之卻也用防己是治上焦之閉下焦之脹也曰無寒熱恐其誤以為外感也曰其衇浮恐其直以為內傷也夫氣之乍動上下拂逆顛倒命曰傷而實未有所去命曰無所傷則方之奉我生者且倒戈反與我為難矣然與我為難之氣終不能復奉我以生如火之既煙焰則不能復反於薪而既煙焰之薪中非不有未燃者在也故治之之道以補為行以行為補以補為行是地黃之潤下使得大便而已下焦之脹即藉以益精髓而安其居使不卻也以行為補是防己逐腎氣之貫於肌肉血衇者使潤其道而通且降防風使氣之可復反者還於衛以布一身則血衇肌肉中得其常不反攻以凌於心也如此又何能不以二物名湯又安得不以防己冠地黃耶傷寒論曰發汗過多其人叉手自冒心心下悸欲得按者桂枝甘草湯主之彼因汗多心虛胸中飲氣凌心此則血衇中水氣凌心然胸中之飲乃實有是物血衇中水則但有其氣竝無其質故一則實煎與之一則以酒浸取汁亦僅取其氣也防己之莖如木故名木防己後世以其出漢中故又名漢防己非二物也故仲景但以防己名湯則曰木防己湯連他物以為名則除去木字以便稱謂耳後人以莖為木以根為漢及治風治水之用均可弗論紅藍花冬月布種至春生苗葉如藍夏乃有花花下作梂彙多刺花出梂上乘露采之釆已復出至盡而罷梂中結實白顆如小豆大其花釆得熟搗以水淘之絞去黃水者再三乃捏成餅陰乾入藥搓碎用紅藍花初搗出水色黃黃水去盡方有紅色以染布帛其紅甚鮮澤而味辛性溫其有力於行血固宜開寶所臚産後血運口噤正與仲景六十二種風合蓋口噤非風不能成也腹內惡血不盡絞痛又與腹中血氣刺痛合蓋但瘀作痛定而不移曰絞曰刺仍是氣為之也治血者因其始黃終赤德協火土故能徹上徹下治氣者因其味辛性溫辛則能散溫則能通因是而思則其有異於他物之通瘀矣牡丹於二月宿梗上生芽發葉三月開花五月結子黑色如雞頭子大根黃白色可長五六寸大如筆管圖經心為牡藏牡丹色丹屬心氣厚味薄為陽中之陰心者體陰用陽其所主血衇今有物焉入其體調其用而宣通其所主則不謂其入心而何哉味辛則能通氣寒則能降是以不為補劑而為通劑凡血之所至氣必至焉血不宣則氣亦壅氣壅則不能衛外而為固於是陽與陰相爭氣與血相薄而為寒熱血宣氣行外入者不解自去此牡丹之首功在鱉甲煎丸所由取重也大抵牡丹入心通血衇中壅滯與桂枝頗同特桂枝氣溫故所通者血衇中寒滯牡丹氣寒故所通者血衇中熱結桂枝究係枝條其性輕揚故凡沉寒痼冷未必能通牡丹則本屬根皮為此物生氣所踞故積熱停瘀雖至成膿有象皆能削除淨盡此則非特性寒性熱之殊矣牡丹有枝有葉有花有實皆所不用獨用其根者則以凡物有實則生氣係於實根株遂朽此雖成實生條布葉之具仍在於根是其氣全在根非莖條花葉所能該耳是其微義不可不觸類旁通者也嘗讀素問大奇論而疑之謂心衇滿大癇瘛筋攣肝衇小急癇瘛瘲攣肝心同為血臟滿大小急之殊不啻霄壤何以發病正相同也解之者曰心屬火火有餘則衇滿大而血乾涸肝屬木木感寒則衇小急而氣窘迫不知癇因於驚驚則氣血亂氣亂則入於經衇心氣為之滿大血亂則出於血室肝氣為之小急是心之盛與肝之衰理實相連不可分也雖然此非牡丹所能治也由驚而癇由癇而瘛瘲或由中風而瘛瘲此則牡丹之所能治矣本經言牡丹主中風瘛瘲驚癇邪氣明瘛瘲有由於中風者有不由於中風者曰中風瘛瘲則與瘛瘲之不由中風者有別矣驚癇有有邪氣者有無邪氣者曰驚癇邪氣則與驚癇之無邪氣者有別矣再證之以別録所主時氣頭痛客熱五勞勞氣頭腰痛風噤癲疾則凡風熱之中血分者為牡丹所專治無可疑矣獨是牡丹入心通行血分能行血中久痼瘀結雖至化膿亦所擅長假如血結不流不有血衇虛而縱弛者乎不有衇隨血聚而拘急者乎不有因血結而熱生因熱薰而驚癇者乎由此以觀則牡丹之用未為不廣也巢元方曰寒溫失節致臟腑虛弱食飲不消聚結在內漸染生長塊段盤牢不動移者為癥言其形狀可徵驗也又曰冷熱不調飲食不節積在腹中或腸胃之間與臟相結搏其牢強推之不移曰癥又曰産後臟虛餘血不盡為風冷所乘血則凝結成癥由是推之癥堅不必皆由瘀特動者為在氣不動者為在血故癥不能不謂為血分之病則病癥堅者不必不有瘀特瘀有不為癥堅者故曰癥堅瘀血也癥堅瘀血有舍於臟腑之隙者有留於經絡之交者不能盡在腸胃惟在腸胃者為牡丹所主故曰治癥堅瘀血留舍腸胃也何以知其在腸胃耶蓋在胃必妨食飲在小腸必妨溲溺在大腸必妨大解氣血既結則不能流動之氣血聚而歸之故腹中既有形兼嘔血者溺血者下血者皆為牡丹所宜以此類推百無一失矣仲景治癥堅瘀血用牡丹者推桂枝茯苓丸溫經湯兩方兩方所主之證不得云在腸胃也其亦有說歟夫桂枝茯苓丸證胎動在上漏下不止是為癥在小腸故血從前陰下也溫經湯證少腹裏急腹滿煩熱唇乾下痢是瘀在大腸故穀道窘急而痢也且病有暫有常自其同者觀之則熱迫衝任而下血滯積腸胃而腸澼計亦不甚相遠也自其異者觀之則妊娠下血必不久而胎墮決不能按期自行自止至三月矣腸澼暮即發熱不劇必差未有常常如是能至數十日者此何以故則以下血腸澼為暴病故也若癥堅瘀血積久方病既病亦不驟愈故雖同在腸胃而有久暫之殊遂使治有天淵之別本經於癥堅瘀血在腸胃必下留舍二字者此也或謂瘀在大腸未必下痢或者阻礙水道故小水入大腸而下痢歟非也夫滯在大腸亦能下痢瘀何獨不然若小便則必不以瘀而礙傷寒論云小便不利者為無血也小便自利者血證諦也以小便由氣化氣分無病小便必調為可據矣溫經湯證暮即發熱手掌煩熱脣口乾燥大黃牡丹湯證時時發熱自汗出復惡寒可知瘀血癰膿在大腸者必兼表證蓋大腸與肺為表裏大腸病必延及肺肺主皮毛則寒熱矣溫經湯證少腹裏急腹滿下痢而不云小便不利大黃牡丹湯證少腹痞按之即痛如淋小便自調又可知大腸雖逼處膀胱但氣不病終不為膀胱害也牡丹本經主療癰瘡金匱要略中排膿散排膿湯王不留行散皆不用腸癰二方則一用一不用千金方治諸疔腫癰疽瘡漏皆不用腸癰三方畢用之可知牡丹為物非特主癥堅瘀血留舍腸胃即癰膿亦必涉及腸胃方可用矣然牡丹何以獨能去腸胃中壅結瘀積也蓋心屬火而主降牡丹氣寒味辛微苦辛則能開苦則能降故心交於腎而膀胱之化行若有所隔礙者牡丹在所必須此腎氣丸用之也非特此也胃者受盛之府腸者傳化之府既受而盛則非火莫化既化而用則非火莫行牡丹非能助火之行也凡火結不行者牡丹能開降之此所以專主留舍腸胃中癥堅瘀血也腎氣丸之治在金匱要略中有四而皆涉及小便與牡丹無涉者也牡丹果何為者哉金匱真言論云北方黑色入通於腎開竅於二陰水熱穴篇云腎者胃之關關門不利故聚水而從其類也夫腎兼畜水火火不宣則水不行水不行則火益餒於是不行之水鬱而生熱益餒之火暗而不燃水中有熱則小便反多火中有寒則小便不利水中有熱火中有寒非牡丹色丹氣寒味辛苦者孰能治之此桂附之壯陽地黃之滋水雖能為之開闔不能為轉其樞則牡丹之功不小矣是方也養陰之力雖厚振陽之力亦雄養陰之力厚恐其水中之熱延留故必以牡丹泄陰中之陽者佐之振陽之力雄恐其燥急而難馴故以山茱萸於陰中攝陽者輔之也白前生洲渚沙磧上苗高尺許其葉似柳根白色似牛膝白薇輩但比白薇粗長堅直脆而易斷參開寶蒙筌劉潛江云別録白前主治首言胸脅逆氣夫胸中固肺所治脅則陰陽升降之道路也次言咳嗽上氣氣升降之相隨即陰陽之分而合者也升多降少則或陰或陽皆能病之如下之真陰不足即無以召上之陽而氣不降上之真陽不足即不能生下之陰而氣亦不降此皆屬虛固非白前輩所能治惟後天之病外邪所感如痰熱上壅賁豚上衝之類所謂上實下虛下實上虛者隨其所主而以是為先導庶幾近之此其所當然固如是矣其所以然卒未明也豫謂白前與白薇形本相似故其功能亦復相似但一雖柔軟以其味鹹苦更加以氣平故力反能自上抵下一則粗長堅直絶似力益猛者然脆而易折究竟進鋭退速且味甘微溫自然降力覺緩是其形質受牽制於氣味即遂其所欲詣亦不過自上及中止矣雖然方其胸脅逆氣咳嗽上氣之際縱使鹹苦而平直達於下之白薇終不能參一臂之助以其柔軟故也而此則堅剛俊爽一往無前不過不能耐久乘興而行興盡即止耳若如澤漆湯之治咳而衇沉在上竝以生薑之橫散紫參之下泄在下竝以桂枝之止逆澤漆之收水偏得成其治下之功又可謂僅及中乎剪裁之妙輔相之宜原用藥之權衡也或曰桑根白皮本經以之主傷中五勞六極羸瘦崩中衇絶補虛益氣舉天下之虛證幾盡治之宜補劑無與匹者矣乃後賢視之其功一若甚狹何哉豫則謂不然考千金於五臟之勞大旨以四氣調神大論中逆四時之氣一節為主因分析其輾轉虛實致使關格生勞於六極則以陰陽應象大論天氣通於肺至治五臟者半死半生為總論分列風論痹論五臟四時所受病於筋衇肉氣骨五極之下以臟氣法時論五臟虛實見象綴之惟精極則以謂通主五臟六腑之病候獨歸重於腎是勞不盡屬於虛極有以異於竭既有盛有衰有虛有實又有四時之邪繩貫其間其為虛證已無幾矣況勞極之病有由傷中者有由傷外者有羸瘦者有不羸瘦者桑根白皮之所主僅傷中之五勞六極且羸瘦者不既已不廣歟所以然者桑根白皮為物甘辛而寒寒者其氣下歸於腎甘辛者其味上達於肺脾肺脾者水津運化之通衢腎者水津歸宿之廬舍上焦運化不愆則中之傷者以漸可瘳下焦歸宿有方則外之羸者以漸能旺且其物堅緻韌密潔淨無瑕剔其皮為紙則牢固難敗以其葉飼蠶則吐絲連續故於崩中衇絶之候又能補虛益氣明其於內崩則能補虛而去者可復於衇絶則能續氣而斷者可聯也曰桑根白皮還瘦為豐固有諸矣別録以之去肺中水氣肺中有水必面浮又以療水腫腹滿臚脹非過不羸瘦乎夫惟其不羸瘦轉有以知其羸瘦矣水為有形之物必其胸腹中有空隙乃能容之如其肌肉豐盈氣道充滿則水更居何所且脾肺之氣化連屬水道之通降得常所以治羸瘦者正其所以治水又豈有二致哉惟其葉甘寒之外不兼辛而兼苦則有異於根皮而清虛肅降之氣過之故主寒熱病之汗出者斯不得牽連前說耳竹類甚多入藥惟取䈽竹淡竹苦竹三種䈽竹堅而促節體圓質徑皮白如霜苦竹有白有紫甘竹似篁即淡竹也江河之南甚多北則鮮有冬春苞筍土中聞雷則發旬日間即落籜而成竹莖有節節有枝枝復有節節有葉枝必兩葉必三愈近根則節愈促而管益厚根有雌有雄雌者多筍當自根下第一節觀之隻者為雄雙者為雌其根喜向西南行故必取根之西南者栽園之東北隅耐溼耐寒然不宜水淹淹即死故但得覆以泥而不可澆水也齊民要術圖經志林綱目憶聞諸蔣漢房先生先生名雲一蓉龕侍御從孫諸生精於易為博物窮理之學者曰震為蒼筤竹其取象為陽在下奮迅振動陰在上飄零解散又上坎下兌曰節其取象則根為陽莖為陰節為陽管為陰葉則陰之陰根則陽之陽故其出土時最有力此義於竹之用甚確切有味何者惟其陽出而陰散陰既散而陽遂暢陽既暢而天氣清明此非春夏雷雨之象乎蓋其先數日必有暴暖鬱蒸木津礎潤隨繼以翛然之風雷雨乃作是故咳逆上氣不似陰為陽擊飄揚於上乎溢筋急惡瘍不似木石之津潤或遂潰爛乎益氣止渴補虛下氣者陽振而能蒸津液以上滋也主風痓者使經衇不為溼熱所攘而拘急也夫陽不能暢乃為鬱蒸陽之不暢以陰為之纍也陰纍陽者或發其覆或披其郤然皆以清陽之無力陰翳之膠固斯不得已而出此若夫陽既有力陰復輕微徒割雞而用牛刀所纍者雖散豈不畏其所伸者遂倔強莫制耶是故竹葉所主之咳逆上氣非風寒閉塞之咳逆上氣亦非氣不歸根之咳逆上氣乃微陰纍陽之咳逆上氣譬如暑月行人在烈日之中反不喘驟入林下稍得涼爽喘反作者是也其所主溢筋急非寒則收引之筋急亦非水漬胖脹之筋急乃陽不伸而津阻之筋急譬如鬱蒸之令筋膠諸物雖置高燥處亦能橫脹短縮者是也竹葉為物飄蕭輕舉灑然微陰正欲解散之餘取其陽遂透陰遂消是故金匱竹葉湯治産後中風發熱面正赤喘而頭痛乃陽無根而上泛復為陰翳所纍遂以桂枝附子人參甘草大棗生薑回其陽用竹葉率葛根防風桔梗以解散其陰蓋風寒所著之陰與為陽纍之陰固自不同不得全仗葛根防風桔梗而能解也傷寒論竹葉石膏湯治大病解後虛羸少氣氣逆欲吐乃強陽既未全衰於中微陰不能無擾於上徒以石膏人參半夏麥門冬粳米甘草安其中又恐其陰隨寒藥入內不如以柔潤者和陽輕清者散陰之為愈蓋正旺之陽與方衰之陽原自有別非若白虎湯證可徑情直行也至若皮茹原係運輸津液上朝之道路其中雖有屬陽之節為阻其外實一線上行竝無留滯內之阻正以外之通而得生故治中氣之有阻而逆者如相激為嘔啘相爭為寒熱相迫為吐血相逐為崩中何莫非以陽格陰陰不流通奔突外出之候若在外得通在內自可轉旋即不能自致通暢更為或和其陰或和其陽亦自有力而少隔閡如橘皮竹茹湯之治噦逆乃於中宮用陽和陰竹皮大丸之治婦人乳中虛煩亂嘔逆乃於中宮用陰和陽皆一舉可平故目其功能曰安中益氣以是知竹皮之功全從在外轉旋在內之氣比之竹葉從在上解陰翳而暢在中之陽者又不侔矣吳茱萸木高丈餘皮青緑色枝柔而肥葉似樁闊厚而皺紫色三月開紅紫細花七八月結實於梢頭纍纍成簇而無核嫩時微黃熟則深紫顆粒緊小參圖經綱目一歲氣候從溫而熱從涼而寒如晷斯移以漸而進不容駐足此其常也獨可異者芒種以後屆乎小暑自溫轉熱之際氣候反寒或者以為由於溼也然溼亦何事獨盛於是時哉殊不知寒與熱由日道之發斂從前歲冬至日自南陸以漸北移其氣發揚昌明遞至夏至行北陸已極乃轉移就斂而南斯時也氣之發揚於外者將收而不及驟就軌範由是天地屢交霪霖作焉霪霖已後氣才就範但爾時陽氣盡浮於地不得上升又不能下降以是酷熱之時氣多瀰漫不暢記曰土潤溽暑大雨時行正紀此也人氣應此由腎而肝由肝而脾脾為水穀之會氣至於是必偕其精微以上行苟有所阻則非特上者不能上竝下者亦不能下矣是其所由阻者水穀之陰阻而不得遂其升降則陽氣也吳茱萸柔條緑樹開花暮春儼然木火通明之秀質乃花後直至七八月間已過溼熱氣交之候始結實焉又必至季秋收斂已甚才熟是其質稟於木火用宣於燥金偏於陰陽溼熱交阻難分難解之處批大郤導大窾因其固然猶之以無厚入有間恢恢乎若有餘地故能使水升火降以復其運用之常蓋痛者阻而不動也咳逆者因阻而上搏也寒熱者因阻而相爭也內阻則外閉故腠理不開風邪得客也則吳茱萸主治所謂下氣止痛咳逆寒熱逐風邪開腠理者一由溫中之功以是而巍然冠於前也雖然除溼血痹者亦豈由溫中之力耶夫血之所由生非中焦受氣變化而赤者乎以溼困脾遂無可取氣以變化血痹而不化脾乃轉受其困則非溫中孰能治之然溼血痹之證云何大凡脾滯於中斯食積痰飲無不由此而阻阻則氣不行而血隨之故中焦有物始無形而繼有形者皆是也雖然味辛氣溫之物於理固升茲何以獨謂其升陰而降陽夫吳茱萸之辛其中有苦且以苦始又以苦終惟其苦轉為辛而知其能升陰辛歸於苦而知其能降陽原係理之常無足怪也據仲景之用吳茱萸外則上至顛頂下徹四支內則上治嘔下治痢其功幾優於附子矣不知附子吳茱萸功力各有所在焉得竝論附子之用以氣故能不假系屬於無陽處生陽吳茱萸之用以味故僅能撥開陰霾使陽自伸陰自戢耳歷觀吳茱萸所治之證皆以陰壅陽為患其所壅之處又皆在中宮是故乾嘔吐涎沫頭痛食穀欲嘔陰壅陽於上不得下達也吐利手足逆冷煩躁欲死手足厥寒衇細欲絶陰壅陽於中不得上下竝不得外達也傷寒論中但言其所以而未及抉其奧金匱要略則以一語點明之曰嘔而胸滿夫不壅何以滿謂之胸滿則與不滿有間可知不在他所矣然則溫經湯獨不以吳茱萸為主歟何以其滿在腹且云少腹裏急也此蓋有在氣在血之不同故所處之地亦不同然其係於壅一也夫手掌煩熱非太陰證所謂四肢煩疼乎即其主證唇口乾燥核之六節藏象論所謂脾胃大小腸三焦膀胱為倉廩之本營之居而其華在唇四白者亦豈能外於中土乎惟其在血則不得不在下是即本經所謂溼血痹者也或曰古之人皆以吳茱萸為肝藥今若子言則似脾藥矣不既顯相背耶豫謂中品之藥以疏通氣血而治病烏得以五臟六腑印定之且土壅則木不伸而為病土氣疏通則木伸而病已蓋其施力之所在脾所愈者實肝病也謂之為肝藥又何不可之有與梔子木高七八尺葉似兔耳厚而深緑春榮秋瘁入夏開小白花大如酒杯六出中有黃蕊甚芬芳結實如訶子生青熟黃中仁深紅可染帛一云染梔子花六出雖香不濃郁山梔子花八出一株可香合圃入藥用山梔子皮薄圓小刻房七稜至九稜者佳其樹喜溼而畏寒故園中宜穿井頻灌溉之冬月於北面厚夾籬以蔽風寒參圖經山谷詩話盧芷園曰梔子有色故主色變凡苦寒之物能下能堅惟梔子反使堅結者解而上出火空則發之義也故竝作湧泄之劑如五內邪氣胃中熱氣結而未實者易於分解已成燥堅者非所宜矣五內邪氣之後繼以胃中熱氣則所謂邪者未必盡熱矣胃中熱氣以前冠以五內邪氣則所謂熱者未必有邪矣梔子苦寒湧泄其可治非熱之邪無邪之熱耶不知五內邪氣而能為面赤酒皰皶鼻白癩赤癩瘡瘍又烏得云無熱胃中熱氣乃竟致面赤酒皰皻鼻白癩赤癩瘡瘍又決非勞傷虛熱仲景云凡用梔子湯病人舊微塘者不可與服則可見五內寒邪胃中虛熱乃非梔子可勝耳據此則五內邪氣胃中熱氣皆為面赤酒皰皶鼻白癩赤癩瘡瘍述病由而廬氏主色變之說遂不可易矣夫盧氏之言誠無以易第有當分析者不可不知也梔子味苦氣寒稟性嚴肅乃偏開花結實於陽氣極盛時固有以知其體陰而效用於陽矣其花白蕊黃仁赤五色之中惟具其三故所主面赤酒皰皶鼻白癩赤癩亦惟此三色其他若青黑痣斑之類概不能治是亦與茜草紅花蘇木色赤而治血者無異矣然世俗搗梔子敷傷經夕之後敷處僅變青黑不為黃白與赤又曷故哉夫梔子非能治傷特傷之淺未及筋骨僅在肌肉者則或氣阻生火將變為紫將變為赤乃至閡血成膿故急以解煩慍之物敷之俾火不生而氣行竟無變赤變紫之咎則青黑者即勝夫赤紫之色也連類而推則仲景以之治黃均貫於此矣雖然論色之義猶有當細意體貼者夫五氣之遞運青而赤赤而黃黃而白白而黑黑而青梔子則以白花而結黃實黃實既成中有赤心是與四時之序適相逆也五色之中獨闕相屬之青黑乃其葉當火土金主令時則青黑光滑屆冬及春初則萎黃而仍不雕是與四時之色又適相逆也與四時之序逆不可附會收清肅之氣於土中以除其煩懊乎與四時之色相逆不可附會於溽暑鬱蒸中偏能鼓蕩其暢茂嚴肅之用乎不然何以其木頻喜溉沃酷畏風寒也仲景用梔子實具此二義於熱邪煩懊證取其於土中收清肅之氣以勝之則梔子豉湯梔子甘草豉湯梔子生薑豉湯枳實梔子豉湯皆是也於溼熱成黃證取其於鬱中鼓暢發之氣而開之則茵蔯蒿湯梔子大黃湯大黃硝石湯皆是也特於清肅中偏同豆豉之散發於暢發中偏協大黃之蕩滌何歟夫煩懊非特上焦陽盛也蓋下焦陰亦逆而阻陽之降焉用豆豉泄其下焦之陰使交鬱蒸之陽於以供梔子清肅下行之化也試即離豆豉未離梔豉局之梔子厚朴湯梔子乾薑湯觀之一以寒下而中宮氣壅則佐以枳朴之開泄一以溫下而陽氣不羈則佐以乾薑之守中亦以湊梔子之清肅耳發黃者火迫於中津液不能自行則蒸盦而成焉用大黃推其火以遠於津液即津液中火有未盡則藉梔子之嚴厲以暢其機也試即不用大黃之梔子檗皮湯觀之則於黃疸中竝兼發熱發熱則其陽猶足達於外而結於內者未深遂不必大黃之峻利但用梔子清肅暢達之可耳於此見梔子於煩燠之火是化之而非析之於黃疸之火是暢之而非瀉之也既曰凡用梔子湯病人舊微溏者不可與服又曰下痢後更煩按之心下濡者為虛煩也梔子豉湯主之何也夫下痢有熱證實證便溏則一於虛寒而已梔子豉湯治熱證不治實證下痢後煩可見非虛寒證矣矧加一更字益可見下痢時本煩及痢止而煩愈甚熱證已定矣然尚恐其屬實也故必按之按之而鞕者小承氣證也必按之濡始審為梔子豉湯證焉是兩條之義相去殊遠非混也然則便舊微溏者誤服梔子湯應何如夫固曰梔子於熱溼燥得令時反能暢茂條達而葉本青黑於寒與風得令時則蓄縮黃瘁其遇中虛中寒亦惟氣萎敗而傷土增其下痢已耳然則同以梔豉枳實大黃成方治差後勞復挾宿食者則曰枳實梔子豉湯治酒疸心中懊憹或熱痛者則曰梔子大黃湯且枳實梔子豉湯枳實僅三枚而反以名湯梔子大黃湯枳實用五枚而反讓梔子居首何也夫治煩非治黃比前固曰一取其清肅一取其暢達耳梔子大黃湯則竝煩與黃悉治之若仍用梔豉煎法先煮枳實梔子後入豆豉則嫌於治煩熱而非治黃故不分先後四味同煎若別出方名則嫌於治黃不治煩熱故仍以梔子稱首曰梔子大黃湯正以其不盡合梔豉法也枳實梔子豉湯盡合梔豉法矣以勞復加枳實復以宿食加大黃本無黃證可治又有煩熱可憑詎可別出方名不謂之梔豉耶譬如梔子厚朴湯梔子乾薑湯無豆豉而仍以梔子冠方以梔子冠方為其有煩也茵蔯蒿湯大黃硝石湯何嘗不治黃何嘗無梔子而方名不出梔子則梔子者為治煩之要劑歟梔子為治煩要劑仲景治煩不必以梔子各有故焉蓋煩非一類所當審察辨明而後梔子之用可無誤也夫病在表有煩熱在裏有煩躁與梔子所治之煩天淵固無庸辨若夫小建中所治之煩悸小茈胡所治之煩嘔瓜蒂散所治之煩滿饑不能食黃連阿膠所治之煩不得臥豬膚湯所治之下痢咽痛胸滿心煩烏梅丸所治之得食而嘔又煩桂枝所治之解後復煩白虎所治之煩渴亦與梔子所治之煩有別而無庸辨曰發汗吐下後虛煩不得眠若劇者必反復顛到心中懊憹此方是梔子所治之煩夫發汗吐下後是陽邪內入也陽邪內入不因汗吐下後則為裏實故曰陽明病不吐不下心煩者可與調胃承氣湯若夫汗吐下後有乾嘔煩者有衇浮數煩渴者有胸滿煩驚者又非梔子所宜則梔子所治之煩必係誤治以後胸中煩滿而不鞕不下痢者方為合劑也然則大茈胡湯證為下後有煩有嘔與梔子生薑豉湯證究有何異蓋此中分別相去徑庭亦何難辨夫若嘔之與嘔不止心下急之與虛滿鬱鬱微煩之與反覆顛倒心中懊憹已不啻天淵況茈胡證仍在耶且論病必先理其本末茈胡證仍在句中含無限兼證嘔不止所以別於喜嘔心下急所以別於胸脅滿鬱鬱微煩所以別於心煩喜嘔耳豈得與煩滿懊憹而或嘔之梔子生薑豉湯比若此可相比則下後汗後之晝日煩躁不得眠者亦可相比乎不揣本而齊末此之謂矣枳木如橘而差小高五七尺枝間多刺葉亦如橘但橘葉兩頭尖枳葉有兩刻耳春生白花至秋成實八月采圖經厚朴木高三四尺徑一二尺葉似槲葉四季不雕五六月開細紅花結實如冬青子生青熟紅其中有核七八月熟甚甘美皮鱗皺而厚膚白肉紫多液者佳參圖經綱目橘踰淮北變而為枳即在江南但年歲久亦葉生刺遂不可食故江南有橘有枳淮以北則有枳無橘是枳與橘本一類二種橘乘陽明宣發之氣則味辛甘枳秉陰冽斂降之氣則味苦酸辛甘故主胸已上逆氣苦酸故主胸已下滯氣同為入中有宣泄之殊矣夫人身之氣陽欲其下藏陰欲其上朝逮有病則陽上逆而陰下泄若上逆下泄皆不得透達則中宮之病也中宮之病尚偏於有餘者多故病於上者隨其性以宣發之氣不能無傷病則已去是橘皮所以主瘕熱逆氣止咳嘔利水穀也病於下者亦順其性以泄降之是枳實所以主除寒熱結止痢且利五臟也寒熱結之義云何人之受熱感寒乘於陽則發乘於陰則結比於表氣則發比於裏氣則結發者開之使出宜解散不宜降泄結者導之使行則宜降泄不宜解散所謂病在陰應攻其裏也若久結不解留於中則肌肉損削溜於下則下痢結滯結滯能下斯腸胃流通氣機暢茂此枳實所以有止利長肌肉之功也利五臟之義云何脾胃主行穀氣於五臟五臟稟穀氣而後能周流無滯脾胃滯則五臟皆滯滯於中則痞痛脹滿滯於旁則痰澼停水腸胃通則脾氣宣穀氣行此枳實所以有除胸脅痰澼脅風痛逐停水破結實消脹滿心下急痞痛之功也獨大風在皮膚中形如麻豆苦癢世俗所謂風疹者是宜解散豈降泄所能愈乃反推為枳實首功何耶試思風本流動之邪皮膚中又營衛所在為環周不休之處兩動相合猶能為如麻如豆之形而不散此非寒熱結而何夫形諸外必有諸內皮膚中者正肌肉之間胃脾所主也脾胃本有寒熱相結肌肉間氣自不能流轉風復襲之於是內外相引表裏相通屈伸進退雖如麻如豆而或起或伏正以其根於內也拔其根枝葉又焉所附治裏之物偏有此解表之能不推之為首功可乎中風傷寒頭痛寒熱正三陽表證也厚朴非表藥何以獨推為首功耶夫厚朴固非表藥驚悸氣血痹死肌又豈盡表證也本經之旨蓋謂厚朴主傷寒中風頭痛寒熱之或驚悸或氣血痹且有死肌者耳劉潛江謂草木能四時不雕者或得於純陰或得於純陽如厚朴則所謂純陽者故取木皮為用而氣味苦辛色性赤烈也夫味之苦者應於花赤皮紫是味歸形也形色紫赤者應於氣溫是形歸氣也苦能下泄然苦從乎溫則不下泄而為溫散若苦從乎寒則直下泄如枳實是已且氣之生化在中土此物雖味苦苦後覺有微甘所以直歸中土而散結氣斯言也可為治傷寒中風根於中土者之確據也夫傷寒中風變幻雖多大旨不越乎傷陰傷陽二者傷陰為燥化則驚悸傷陽為溼化則氣血痹驚悸實包譫妄煩懊等候氣血痹實包脹滿嘔泄等候兩候者皆與表邪連橫表以裏為根柢但散其表不究其裏則枝葉不能復生裏以表為應援但通其裏不究其表則外邪因之內陷此厚朴不必治傷寒中風而傷寒中風內外牽連者必不可無厚朴此所以推為首功歟所謂死肌當與他死肌有別後世論證有謂之麻者有謂之木者仲景無是也在仲景書則麻曰蟲行皮中木曰不知痛處麻為表氣久虛之候木為陽氣拂鬱之候此條死肌當作木解斯厚朴之用可無惑劉潛江曰枳實味苦而辛苦多辛少苦中又含酸意夫苦酸湧泄其氣又寒且結於降令故本下行之性乘降令之旺以就陰最烈而速厚朴始嘗之苦苦中微微有甘最後有辛意非辛也乃苦溫之餘烈俗所云麻味也然則厚朴從苦溫以散結者不若枳實從苦寒以泄滯歟夫氣以溫熱為升為補苦甚者轉從升補以散之以寒涼為泄為降苦甚者轉從降泄以導之故厚朴之治宜於寒或宜於溼枳實之治宜於熱或宜於燥各從其對待以投之反是則厚朴施於燥熱之結者猶可借從治以奏功若枳實誤施於寒溼是氣本下而復降之不惟無盈且有害矣或曰仲景於枳朴每多聯用說者謂其善泄胸中至高之邪乃今一斷之曰治中得無有戾於古人耶豫謂至高之用決非枳朴可治何則枳朴所泄者氣上焦氣分有病必兼停飲宿水故也夫上焦為化陰之所其氤氳之氣主變為津而下溉下焦乃能化氣氣於是乎為柔和不為剛烈以上焦原係脾肺太陰所主太陰本溼土之化也若上焦不化陰則氤氳之上湊者咸壅遏而為痰為水故仲景治上焦多用杏仁桔梗葶藶甘遂陷胸等湯可按矣若夫中焦雖水穀雜居而傳化物而不藏譬土之於水立能治之使盡以胃與大腸俱屬陽明陽明本燥金之化也苟中焦有壅滯不化但以峻藥導之滯雖去而滯之所薰蒸留於腸胃者未去則豈不能勾引新穀新邪據舊滯之位以為患故仲景治中焦縱已投硝黃亦必協枳朴承氣等湯可驗已兩書中用枳實之方十有七用厚朴之方十有四而枳朴聯用者八方八方之中與大黃同用者六譬之西人之製火器焉大黃則藥枳朴則木炭也譬之古人之製徑弩焉大黃則矢枳朴則機栝也故夫枳朴聯用不同大黃者僅二方曰枳實薤白桂枝湯曰梔子厚朴湯二證者一由表邪方熾而誤下故心腹煩滿臥起不安乃卻欲出表而不得故方名但出厚朴不出枳實以厚朴之性原向表也一由裏氣壅逆故心中痞留氣結在胸胸滿脅下逆搶心乃氣欲下歸而不得故方名但出枳實不出厚朴以枳實之性原向下也於此可見枳朴之同而異發汗不解腹滿痛者宜大承氣湯腹滿不減宜大承氣湯腹脹不大便者宜大承氣湯其熱不潮未可與承氣湯若腹大滿不通者可與小承氣湯微和胃氣勿令大泄下病腹滿發熱十日衇浮而數飲食如故宜厚朴七物湯腹滿痛而閉者宜厚朴三物湯支飲胸滿者宜厚朴大黃湯是枳朴明為脹滿設矣而方中分數惟小承氣湯枳朴最少厚朴七物湯厚朴三物湯即小承湯惟以枳朴多用而易其名且表證多者厚朴多表證少者厚朴少於此可見枳朴之異而同同異之間枳實之所以泄滿厚朴之所以已脹者可窺矣於枳朴二味之不相聯者又有以見其用與表藥連屬者多與裏藥連屬者少也蓋兩者一係木之皮又味苦氣溫一係橘之變種又氣疏峻而性泄降輔裏藥則為發蹤指使輔表藥則為搜捕反側發蹤指使者必謀之審而處之當故宜聯用搜捕反側者必持以靜而發以猝故不宜聯用觀夫表證方盛裏復不和者恃以降泄其裏而表亦和大茈胡湯病屬於陰邪係夫陽者恃以泄其陽而陰自達四逆散病起由表反覆由裏者恃以廓清其裏而表方得開枳實梔子豉湯氣阻於上不得升降者恃以開泄而升降復常橘枳生薑湯氣逆於上不得下反內逼者恃以下其氣而內不擾桂枝生薑枳實湯此枳實之用與表藥相聯者也麻黃半夏乾薑五味子細辛為小青龍湯麻黃石膏杏仁為麻黃杏仁甘草石膏湯合二方更加厚朴遂主衇浮而咳夫衇浮為在表二方本皆表劑小青龍本主咳必加厚朴竝以首冠方名者則以散斂溫涼欲各抵其所而不能皆緣邪聚致胸中逼仄不有寬而廓之者則諸藥難盡其能此首功之所在縱首列其名亦有何愧厚朴麻黃湯或下或未下桂枝證不罷而喘仍與桂枝湯但加厚朴杏仁以杏仁能使上衝之氣達於絡衇厚朴能使上衝之氣達於表分所以聯絡桂枝之解肌俾幾陷腸胃之邪仍回營衛桂枝加厚朴杏仁湯此厚朴之用與表藥相連者也雖然枳實厚朴皆與桂枝相連枳實則連茈胡不連麻黃厚朴則連麻黃不連茈胡何也蓋連桂枝者欲其下氣散飲此枳朴皆有之功能連麻黃者欲其橫出開表連茈胡者欲其通中泄裏以枳實無橫出之權厚朴無直達之技也枳朴二物仲景不甚令與補劑竝用有之則所謂心中堅大如盤邊如旋杯水飲所作枳朮湯主之發汗後腹脹滿者厚朴生薑甘草半夏人參湯主之是也兩證者一則中有形外不言脹滿一則外脹滿中不言有形參朮補中之辨於此可測其奧枳朴之分亦因可瞭然矣夫兩證之由皆係中虛而虛復有微甚之別其候又有久暫之殊枳朮湯證緣脾氣濡滯所受於胃之精微不能速化以上輸停於心中日積月纍以至成形厚朴生薑甘草半夏人參湯證緣汗後肺氣外薄失於吸引脾津致脾氣隨津橫溢四出若能聚而不散猶是虛中之實散而不能聚允係虛中之虛惟其為虛中之虛故縱重用泄滿化飲然必久煎使之氣淳而力優柔厚朴生薑甘草半夏人參湯以水一斗煮取三升為虛中之實故縱用補中而不重枳朮湯枳實用七枚白朮止用一兩且必少煎使其氣鋭而力雄猛以水五升煮取三升而注之曰腹中軟即可見其患鞕不患滿也藉此又可見古人治病每因勢利導不加逆折腹滿者其機橫溢故用厚朴隨橫溢以泄其滿中堅者其機根固故用枳實隨根固而泄其堅一橫一直之用即枳朴至理之所在矣二物之用厚朴偏於外枳實偏於內厚朴兼能治虛枳實惟能治實既言之詳矣若夫厚朴始終只在氣分枳實卻能兼入血分則於王不留行散厚朴半夏湯枳實芍藥散排膿散見之蓋金瘡者血去既多自無瘀滯故但流通血分縫紉瘡口提去熱毒既皆有其物矣惟疏導氣機者能不屬之厚朴耶咽中帖帖如有炙肉吐之不出吞之不下乃氣著於咽惟其帖於旁不哽於中斯可用著表之疏氣藥惟其有所帖方足見為有形之痰於是小半夏加茯苓湯遂與著表疏氣之厚朴伍矣此所謂只在氣分者也腹痛煩滿不得臥是小承氣證若在産後則非特為氣分壅結血分且必有留滯破陰結布陽氣芍藥能利血中之氣破熱結墜堅氣枳實能利氣中之血氣利而滿減血利而痛已此枳實芍藥散製劑更狹於小承氣其效反有過於小承氣者若加桔梗雞子黃為排膿散則內有物象形而托其膿雞子黃象膿外有以會意而達於表桔梗味辛色白為歸肺與皮毛此所謂兼入血分者也統而言者厚朴利氣利氣之著於外者也枳實利氣利氣之懸於中者也厚朴除滿是除脹滿枳實除滿是除堅滿枳實除滿而且除痛厚朴除滿而不治痛不徒偏內偏外兼虛兼實已耳秦皮其木小而高似檀枝幹皆青緑色葉如匙頭許而不光竝無花實根如槐其皮有白點而不粗錯取以漬水水便碧色唐本圖經凡草木稟地力偏厚鋭欲接於天則喬聳而瘦稟天氣偏厚頻資溉於地則圓短而大稟天地之氣俱厚則高大稟天地之氣俱薄則叢生凡物氣稟乎天味稟乎地色與香則雖出於物亦不能不囿於氣味故香麗於氣色麗於味其入於人身則得於天者行陽得於地者行陰所謂從其類也雖然氣之寒者涼者從陽入陰味之辛者甘者從陰出陽色之青者赤者不能不上行臭之腥者臊者不能不下降秦皮者高聳而小味苦氣寒色青以碧為稟陰氣厚而行於陽夫色之青碧暢茂盛長之應也氣味之苦寒嚴厲肅殺之應也本經之於風寒溼痹洗洗寒氣除熱是於嚴厲肅殺中行暢茂盛長之化也仲景之於厥陰病治渴欲飲水之熱利是於暢茂盛長中振嚴厲肅殺之威也而其用在皮凡木之皮主抽吮津液以上行故肝膽之火上行而水不繼者服之有功其皮又青而有白點皮者肺之合目之白睛為肺所主故白晴有青翳白膜者服之亦有功少精者地氣不吸於天也帶下者陰精不返於陽也引其陰以交於陽致其陽以行於陰即陰陽應象大論所謂精食氣精化為氣者是也山茱萸木高丈餘葉似榆二月開白花如杏四月結實未乾時如酸棗赤既乾皮甚薄中有核圖經李瀕湖謂山茱萸吳茱萸甚不相類未審何緣同名豫則謂惟其同類是以同名耳蓋至九十月之交萬象簫索惟三種茱萸吳山食纍然朱實燦爛可觀且三物者榮茂最早收成反遲均為善物朱者丹也臾者善也廣韻云以是得名詎不允協耶且山茱萸於氣交溼令與吳茱萸俱有行所無事之概惟吳茱萸則既開花而於是時不結實山茱萸則既結實而於是時不長茂竝作遊行跌蕩之態故其主病關中上且在心下者尤為異曲同工第結實於秋者其性嚴烈故辛竄而峻結實於春者其性醇和故酸潤而溫惟其酸潤而溫故氣深穩而力優柔不然則心下既有邪氣寒熱在外復有寒溼成痹譬如天下之事已至內外云擾又何可以溫中解之以溫中而能悉解內外云擾必其秉疏通之智鎮定之識施練達之才行敦厚之政者也故山茱萸之主心下邪氣寒熱逐寒溼痹也以游行無礙於中土之資入其中而據之乃施其春和發越之令俾出於外則隨汗而能泄俾入於腸胃則隨下而能通在於中者既行閉於外者又安得而不動是知所謂邪氣寒熱與寒溼痹者必係肝以虛而失其疏通之職土遂磽瘠不能運邪肌肉應之亦為寒溼所著而痹阻此本經之旨皆論其因於中者耳若夫別録則又參出陰虛而火浮於上陽弱而水脫於下兩節夫陰以靜為職陽以密為功故生氣通天論曰陰者藏精而起亟也陽者衛外而為固也陰不起亟則徒火在上而頭風風氣去來鼻塞目黃耳聾面皰陽不衛外則小便多汗出惟得溫和潤澤之物鎮於中更以酸味招而收之斯浮於上者回脫於下者固既回既固氣自含蓄於中陰又安得不強精又安得不固陰強精固五臟又焉得不安九竅又焉得不開闔合節耶總之山茱萸之長在結實於春而備受夏秋冬之氣不吐不茹能常保其酸溫之氣味常布其煦育之清標在陰則能使陰諧而陽不僭在陽則能使陽祕而陰不耗山茱萸之功力畢於此矣或言山茱萸瀕湖謂五月采實不得竟泥元古之別録夫自別録千金翼外臺祕要至圖經均云九月十月采惟圖經載一云五月采與此小異明明別著一說不可為憑王摩詰山茱萸詩云朱實山下開清香寒更發幸與叢桂花窗前向秋月則於五月釆之說更何如耶紫葳凌霄花也野生蔓才數尺得大木依附而上即高數丈年久者藤大如杯春初生枝一枝數葉光長有齒深青色自夏至秋開花一枝十餘朵大如牽牛花頭開五瓣赭黃色有細點秋深更赤八月結莢如豆莢長三寸者其子輕薄如榆仁馬兜鈴仁其根長亦如兜鈴根狀秋後釆之綱目紫崴附木而生直上顛頂其象為入肝其花先黃後赤燦爛彌久其象如血故所主多肝家血分之疾然其治崩中也止治産乳餘疾之崩中其治寒熱羸瘦也又止治癥瘕血閉之寒熱羸瘦且治癥瘕血閉矣則其性似行血之物也乃偏能治崩中又善養胎何也夫紫葳性寒寒則能涼血味鹹鹹則能凝血蓋嘗見宰豕羊雞鶩者必先取器貯水與鹽以承其血攪和而煮之則血凝為塊既能涼血復能凝血又何患其不能養胎産乳之餘血氣潰亂剽疾故為崩中若他崩中則不必血不凝矣寒以涼之鹽以凝之其能止不凝之崩中亦易易耳惟癥瘕為病有血閉者有血不閉者然皆屬裏與表無與則不必有寒熱癥瘕血閉而有寒熱且羸瘦則必血與邪熱相攪血欲凝而不得邪欲出而不能因以內結癥瘕外相凌薄氣日耗而肌肉日漸消瘦若用紫葳實一舉兩得焉仲景鱉甲煎丸行氣消瘀和中解外各有其物所以必用紫葳正由此也豬苓生楓樹下其皮至黑作塊似豬矢肉白而實者佳隱居松下有茯苓竹下有雷丸楓下有豬苓則凡樹下皆有苓未為妄也第凡樹皆有寄生皆有螵蛸而入藥必取在桑者張隱庵則豬苓之必取在楓者又何疑焉然本經主治多有不必穿鑿解者如延年益壽輕身神仙等無論矣有謂能行水上者與鬼神通者則神聖之言該括衆理非淺學所可強明如此味所謂主痎瘧解毒蠱疰不祥均有偏於鬼神之感應而言測其意旨豈不以豬苓出自楓下而楓者泥之可以致雨爾雅疏歲久能生癭瘤遇暴雨驟雨能暗長三五尺謂之楓人越巫取之作術有通神之驗取之不以法能自化去南方草木狀老者能為人形述異記化為羽人化書而其木無風自動天雨則止物類相感志其癭又有風神居之埤雅述舊記既具此種種靈異又係得其餘氣生於幽隱之地下者能不益著奇功驅鬼魅之老瘧解邪惑之毒蠱與疰而召休徵哉獨利水道一語乃實理所在有非迷離倘恍之說所能解者蓋凡草木所生之物入土即放芽發葉其有不放芽發葉者則感地下陰溼潰爛無餘惟茯苓豬苓得木氣而生於地下既不茁萌挺莖又不潰腐消敗是其卻溼可知乃復久而不變則非特能卻溼且能化溼氣為生氣矣雖然茯苓可利水道豬苓亦利水道則凡木之苓皆能利水道是豬苓不必定以生楓下者且茯苓豬苓儘可混用乃仲景書中茯苓豬苓各自為功又每相連為用似若斷難相混者何哉蓋亦可察物理而知之矣夫松之概挺拔徑正楓之概柔弱易搖松之理粗疏楓之理堅細松之葉至冬益蒼翠而不雕楓之葉至冬遂鮮赤而即落是其一柔一剛顯然殊致茯苓屬陽治停蓄之水不從陽化者豬苓屬陰治鼓蕩之水不從陰化者是故仲景以豬苓名方者其所治之證曰陽明病衇浮發熱渴欲飲水小便不利者豬苓湯主之曰少陰病下利咳而嘔渴心煩不得眠者豬苓湯主之曰諸病在臟欲攻之當隨其所得而攻之如渴者與豬苓湯曰嘔吐而病在膈上後思水者豬苓散主之統而核之莫不有渴若五苓散則其治有渴者有不渴者至茯苓入他方所治之病則不渴者居多蓋渴者水氣被陽逼迫欲得陰和而不能也與之豬苓使起陰氣以和陽化水譬之楓葉已丹遂能即落也或曰豬苓之化水與茯苓異是則然矣凡淡滲之物皆上行而復下降澤藛亦其一也所以與豬苓茯苓異者其旨安在是其義已見澤藛條中所謂澤藛能使水中生氣上朝二苓則能化之者是也惟五苓散豬苓湯用澤藛使未熟之水就上矣乃既用茯苓使從陽化又用豬苓使從陰化此則不能不剖其疑夫水既曰生則不使從陽化何以令其熟若使徒從陽化又置渴於何所此亦淺顯易明不勞深釋者也中品獸二味蟲魚五味果一味穀八味菜三味史記大宛多善馬馬汗血其先天馬子也是知馬之氣最盛者能使血隨汗出即劣亦能不使血停於中散之以行衇絡矣然獨用其通何也蓋馬通之治治血之因寒而停遇隙以溢者何以知之則以別録謂其微溫仲景用於柏葉湯知之夫血緣火迫溢出必不用性溫者為治且不使與乾薑艾葉為伍矣馬一身之物非性寒即有毒均非能鍾生氣於人身者惟通則性溫而為養馬一身之餘縱使一切性寒有毒之骨肉臟腑皆賴此以生長則人之身其因寒因傷而血停因血停而吐衄崩漏者均能行以散之不容其再停矣然謂其止渴何也夫惟止渴一語獨隸於婦人崩中之下亦可知崩中則一身津液隨血而流遂不足以上滋固無與於吐衄金創小小下血者矣論羊肉者多以金匱真言論南方赤色入通於心其畜羊為證謂火畜性熱可以已虛寒又為血肉可以補形之不足若以周官六畜之分隸司徒主牛宗伯主雞司馬主馬及羊司寇主犬司空主豕而言誠不得不謂之火畜然馬亦隸夏官同為火畜非無血肉獨不可已虛寒而補形乎且賈子胎教篇不謂羊為西方之牲乎淮南子時則訓注不謂羊為土畜乎不又謂羊為土木之母乎呂覽孟春注不謂羊屬土乎是又當作何說矣易兌為羊兌之為卦二陽在下一陰居上陽牽於陰雖奮而不剛陰比於陽柔和而力厚象羊之性抵狠難移易夬注又史記項羽本紀狠如羊貪如狼羊之體馴擾易制為發於火充於土其究為適口可悅之物故首主緩中緩者急之對急即仲景所謂寒疝脅痛裏急産後腹中㽲痛者藉其陽足以抉陰而陰仍比陽不受陽之傷也西北彌寒生羊彌豐肥南方所生則瘠而味劣故又能於虛勞寒冷中補中益氣藉其氣之生長宜於寒也胎生之易者無逾於羊故又主字乳餘疾字乳必傷血肉乃有餘疾藉血肉之充以補之也羊目無神反有遠視五行傳注羊畜之遠視者是其陽直達於上以與陰濟而能遠燭故又主頭腦大風汗出藉其陽能和陰不使陽加於陰也安心止驚則無羊之詩所謂矜矜兢兢不騫不崩馴擾之得宜眠食之得所固有與人相從而無忤者亦取其意為虛弱之軀思患預防之治耳露蜂房古人多謂須用如甕如桶者今肆中蓋不多覯惟用木上者大則如碗小則如甌其形如蓮房十百攢簇界畫渾圓大小均稱其質似紙外包褐色中管青白其蒂以漆繫於木枝而倒懸焉大率皆木皮水土醞釀而成者也三月諸花盛開時蜂始營構旋構旋生子於中夏則子成小蜂猶子母皆聚於是深秋則蜂去至明歲蜂來則別營他枝不戀舊巢也箸録巢氏云小兒壯熱者是小兒血氣盛五臟生熱熏發於外故令身體壯熱大致與溫熱相似而有小異或挾伏熱或挾宿寒所致若不歇則變為驚極重者亦變癇或搖頭弄舌或睡裏驚掣數齧齒是欲發癇其已發者或口眼相引目睛上搖或手足掣縱或背脊強直或頸項反折十歲已上為癲十歲已下為癇潛夫論貴忠篇哺乳太多則必掣縱而生癇由是而言瘛瘲即掣縱也說文瘛瘲小兒病掣收引也縱弛放也瘛瘲者熱甚而手足一掣一縱相連不已也素問玉機真藏論疝瘕弗治腎傳之心病筋衇相引而急名曰瘛則瘛為收引又何疑焉以是知本經露蜂房所主驚癇瘛瘲小兒伏熱宿寒之所為也寒熱邪氣癲疾成人受邪鬱伏之所為也是皆得於氣血素盛之人其以露蜂房主之之故則有說焉夫蜂房縱風搖而能常安常定遇酷暑而偏以生以育且其界限分明秩然有序其孔一直到底竝無歧互似經衇經筋所容之隙是其於酷熱之中反鍾生氣不畏生風能約束一身秩然有序之孔道使經衇間氣血不至橫溢經筋自無引縱弛縮之患矣雖然巢氏不又云風癲者由血氣少則心虛精神離散魂魄妄行因為風邪所傷故邪入於陰成癲疾乎則是物必又能於陰中拔出風邪也夫蜂靈迅飛揚色黃且赤其物固應屬陽其所營之房己卻不能入內惟生子於其間逮子既成蜂亦即出而不能入風本陽邪恰似蜂之飛揚不定而鍾其氣於艱入難出之陰中仍涵煦淹育使其所鍾還象己之飛揚外出不能復入可不謂於陰中拔出風邪之驗耶要之蜂性自陽蜂子自陰故本草載諸蜂子皆言性涼癲癇等疾其根鍾於內者屬陰其發見於外者皆陽素問大奇論曰心衇滿大癇瘛筋攣肝衇小急癇瘛筋攣又曰二陰急為癇厥二陽急為驚可見驚病於上癇病於下今之所主原因驚致癇為由外而內用露蜂房之意在內則使之外出在外則使其出有序而不得亂行列也用露蜂房之義止兩端一者病從外入使仍從內出此會意也別録同蛇皮亂髮燒灰酒服治諸惡疽附骨癰根在臟腑暨歷節腫出丁腫惡衇諸毒是也一者病客於燦然排歷之處能除去之此象形也外臺同細辛含治牙齒風蟲痛肘後炙焦酒服治鼻中外渣瘤是也然仲景於鱉甲煎丸用之為會意耶為象形耶夫亦兩者皆兼之矣瘧病自經入此為象形而結根於內此為會意烏季韶曰凡痘出點粒漫渾顆界不明用露蜂房隨即顆粒秩然痘亦從內外出之候欲其界畫顯明者即此亦可悟其功能矣鱉水居陸生穹脊連脅其甲四圍有肉裙故曰鱉肉裹甲無耳以目為聽純雌無雄與蛇及黿為匹夏日生卵於涯渡河隔水望之卵自孚化而出性畏隙光暴之日中無恙置隙光之下輒死又畏蚊噆之經夕則死綱目鱉無雄以蛇為匹蛇迅疾善竄鱉則蹣跚不前而色青是斂風於木也鱉無耳以視為聽是并水於木也夫熱不以風不清風不以雨不息以熱生風者因雨而遂和此其性謂之水木之化肉者柔也陰也甲者剛也陽也以肉裹甲此其形為柔中有剛陰中有陽水木之化乃鍾於柔中有剛陰中有陽之內是故癥瘕堅積之在心腹者可除痞疾之外有寒熱者可去凡竅之能開能闔者屬陽口目是也不能開闔者屬陰耳鼻前後陰是也鼻生息肉後陰生痔核前陰遭蝕腐非柔中有剛陰中有陽而何故亦能去之仲景用藥在處宗法本經又在處別出心裁擴充物理精奧以啓悟後學如病於外根據於內者用鱉甲煎丸煮鱉甲令泛爛如膠漆然後同諸藥熬令成丸是化剛為柔法欲使剛者不倚巖附險隨柔俱盡也邪盛於中達於上而不得泄用升麻鱉甲湯則鱉甲與諸藥不分次第一概同煎是以剛摧柔法欲使柔者隨剛通降也何則雖結為癥瘕所苦仍在瘧之不止則可知昔日之有外無內今日之重外輕內者他時必至重內輕外有內無外也故於外仍不離桂枝湯大茈胡湯小茈胡湯大承氣湯之治其葶藶石韋瞿麥之通水四蟲桃仁紫葳牡丹之通血猶不過隨行逐隊去其閉塞未有能使內者仍外分者仍合者故主以堅鞕之物煮令稀稠統率衆品并歸於外之寒熱寒熱遂亦差也熱毒壅結無論在陰在陽皆咽與喉俱痛惟驗其面發赤斑斑如錦文且唾膿血者為在陽面目青且身痛者為在陰竝用升麻鱉甲湯治之者以其病雖由於氣不得升降其源實由於血壅結不行升麻之通通其氣耳故必以水木并化自下而上直通於目之鱉甲以竝之且其味鹹性平清血熱而主降主開但得喉中之結解則上下通和邪熱自然透達也於此更可悟血以熱結不通熱以血阻更增者竝宜鱉甲主之推之後人所謂補陰補氣除癖行瘀莫不由此矣蠐螬狀如蠶而大身短節促足長有毛生糞土中者外黃內黑生舊茅屋土者外白內黯以背滾行乃駛於腳春末夏初輒縮短而殼硬漸成蟬形中夏已後剖背而出化為蟬參拾遺綱目或問莊子戶內之煩壤雷霆處之當作何解夫亦當知春夏者陽必暢而後寧苟有遏抑則激薄有聲是為雷霆屋宇之下天之陽與地之陽既艱於相接已加以糞掃之穢積而不除斯地之陽益祕鬱難達能不奮決砰訇激射而出耶夫是謂至陰之中必有至陽由此推之則理之所同然蓋有指不勝屈者即蠐螬一物亦所謂至穢之中必有至清者也夫糞壤穢氣抑遏清化化為蠐螬俄而為蟬嘹喨聲清吸風飲露如是則蠐螬之用宜乎下除穢濁上透清陽矣而本經云云猶在中不在上下在血不在氣何也夫未化蠐螬已前固最穢濁既蛻為蟬以後始最清潔當其為蠐螬則已雜乎濁未至乎清人身之有形可按有跡可尋已離乎濁未至乎清者舍血更何似矣血仍至清者也惡血瘀血破折所傷之血則清而未離乎濁矣況血生自中焦脅下者方離中焦猶未甚遠正在化源所近遂變濁焉則不以離濁向清者治之而誰以故曰主惡血血瘀痹氣破折在脅下堅滿痛月閉也雖然以蠐螬泛治瘀血在中不在上下猶非善計何者惟瘀血在中而痹氣致清氣不上朝者方為大合之劑故下著目中淫膚青翳白膜句仲景所用通瘀不下一二十味獨於兩目黯黑之乾血證用躋螬後人循此而識之蠐螬可無誤用矣蜚虻大如蜜蜂腹凹褊微黃緑色善噉牛馬血衍義說見水蛭下䗪蟲似鼠婦而大形扁如鱉甲有斷紋似鱗但自左及右通連無直紋也生鼠壤及屋壁下溼處小有臭氣參唐本圖經繆仲醇云䗪蟲生下溼土壤中得幽暗之氣故其味鹹氣寒以刀斷之中有白汁如漿湊接即連復能行走故今人用之治跌撲損傷續筋骨有奇效夫血者灌溉百骸周流經絡者也血若凝滯則經絡不通陰陽之用互乖寒熱洗洗生焉鹹寒能入血軟堅故主心腹血積癥瘕血閉諸證血和則營衛通暢寒熱自除經衇調勻月事時至遂令婦人有子也劉潛江云仲景治畜血用水蛭虻蟲治乾血則復加䗪蟲蠐螬為其能化血導血助水蛭虻蟲以成功而不濟其悍以致決裂為乾血因於虛勞故也試觀鱉甲煎丸止用䗪蟲蜣螂而置虻蟲水蛭則可知破血之功不在䗪蟲蠐螬矣産後瘀血腹痛仍用抵當湯內之大黃桃仁卻以䗪蟲代虻蟲水蛭其義亦可思矣愚謂參土瓜根散䗪蟲之用益可知也夫經一月再見而曰不利乃桂枝所主所謂通中不通者也滿痛不在脅下腹中而在少腹乃芍藥所主所謂陰結陽不布也二病者由於帶下則因帶而經絡泣澀用土瓜根是滑澤其塗徑用䗪蟲是連絡其斷續也且通而謂之不利必其經衇仍通泣澀則在絡土瓜根本治絡中泣澀之物䗪蟲則治絡中斷續之物矣陸農師謂䗪蟲於申日過街故名曰過街蟲夫曰過則從橫穿可知直行曰經橫行曰絡絡固經之橫者也䗪蟲之主絡中泣澀斷續其亦取象於此歟梅先衆木而花花似杏其老幹如杏嫩條緑色葉似杏有長尖樹最耐久性潔喜曬澆以塘水則茂忌肥水其實亦如杏初生青至小滿前脆嫩過後則黃而爛造烏梅法以梅子核初成時摘取籠盛於突薰之令乾即成矣參齊民要術陸氏詩疏廣群芳譜廬子繇曰梅先春而花吸冰雪以自濡色青味酸入厥陰肝肝色青肝味酸也故主吮泄腎液以潤筋膜經云味過於酸肝氣以津談說酢梅口中酸出吮泄之力可徵矣是以對待水液焦涸致熱煩滿悶及上氣令心不安與偏枯不仁致肢體痛及死肌惡肉青黑志者咸可濡以潤之藉子母更相生耳梅之花苞於盛冬開於先春梅之實結於初春成於初夏故梅之用能吸寒水以成制相火之功其所以吸則厥陰風木為之體所以制則少陰君火為之用是何也風木者宣發之氣而其味酸則主乎收君火者昌明之氣而屬少陰則主乎靜今夫因氣逆亂不收為上氣為滿相火隨之以逆為煩皆緣心不靜不能御諸氣而使之降又不能使相火聽命而定而不動也梅之實當君火主令時安詳不擾而育其真遂以長而成且至於熟安於是時者必見宜於是時是以能致心之安心安則諸氣相火咸惟命是聽上氣熱煩滿均毋敢作矣雖然上氣肺病也煩滿胃病也梅非治肺治胃者也是又何說焉夫肝屬木木得津潤遂暢茂條達一身之壅塞皆除其有不津則氣亂為逆逆於肺則為上氣逆於胃則為煩滿治之以梅亦直探其源耳水衰不能養木內因也火逼而致津枯外因也無間內外皆可治以梅耶然則梅能吸人之氣以為津不吸外來之寒溼故因津枯而為煩為滿則內外因一也亦又何別特腎陰虛不能上濟者不得用此耳其能治肢體痛何也是蓋宜連下二句讀謂梅能主肢體痛偏枯不仁之死肌也夫死肌有肢體不痛不偏枯不仁者是津氣凝滯不主滑澤膚腠也則有肢體痛偏枯不仁者不可知為津氣枯膚腠不得滑澤耶試觀古今方書有用梅治肢體痛偏枯不仁之方否此無他肢體痛偏枯不仁是液枯死肌則津枯也夫液所謂穀入氣滿淖澤注於骨骨屬屈伸泄澤補益腦髓皮膚潤澤者津所謂腠理發泄汗出溱溱者梅之為物能撮氣以為津不能撮穀以為液彰彰可見也則其治止能吸氣化津通在外之死肌又何疑焉且證之以下文青黑志與死肌何異其與在內之肢體痛偏枯不仁可強使之同耶即此可以知梅之用矣本經菊花主皮膚死肌朮主風寒溼痹死肌細辛主風溼痹痛死肌雄黃主惡瘡疽痔死肌枲耳主周痹四肢拘攣痛惡肉死肌白蘚主溼痹死肌不可屈伸厚朴主氣血痹死肌礬石主鼠瘻蝕瘡死肌青琅玕主癰傷疥瘙死肌白芨主癰腫惡瘡敗疽傷陰死肌䕡茹主蝕惡肉敗瘡死肌地膽主鼠瘻惡瘡死肌斑貓主惡瘡疽蝕死肌蜀椒主逐骨節皮膚死肌麋脂主癰腫惡瘡死肌由是觀之死肌之為物因於瘡癰十之六因於風寒溼痹十之四未有無因而致者也有之則藜蘆之去死肌也夫癰腫疽瘡血滯也風寒溼痹氣閉也藜蘆之所去痰停也則津枯與三者不如四維之恰相配合耶然則化為津之物多矣乃何獨取諸梅蓋以渴者言及梅而津溢化氣為津無有速於此者且本有津而能致之者他物或猶能之若於最濁最涸之餘欲思甘露之滋舍此誠無可他求矣且麥門冬天門冬地黃非不生津然其功也溥欲令專至一處而去些微之死肌不能也人參黃芪非不能行氣致津然其力也緩欲其不助肢體痛而不可又何能治偏枯不仁之死肌譬之堪大受者不得以小知使之惟梅技有專長效有偏至恰於諸木雕殘已極之候獨吐氣而揚其英焉是則因梅可以明死肌之故因死肌可以見梅之用者也仲景用藥多緊帖本經獨於梅似若未盡其功能而取以治厥治蛔又非本經所載殊不知只消渴氣上撞心已該下氣而心中疼熱飢不欲食又該除熱煩滿安心矣何則梅實生青半熟紅全熟黃醃之則白蒸之則黑能具五色之全而青時酸紅時甘酸黃時甘多於酸白者鹹苦黑者苦酸五味又具其四其所以用烏梅者豈不以能從肝而媾心腎乎夫黑而酸水生木也酸緣蒸熟而變苦木生火也故凡衇微而厥膚冷其人躁無暫安時即非所宜若病者本靜乃復時煩須臾復止得食而嘔又煩斯為合用是知厥為陽氣不伸吐蛔為陽氣因不伸內爍津氣致蛔無所吸受而上出故曰蛔聞食臭出厥非臟寒從醫宗金鑑其實仍是氣上撞心心中疼熱之現據其用梅仍是吸水以濟火非有他也然則謂仲景用梅但得本經之一節則可若謂治厥治蛔非本經之旨則誤矣擴而充之後人以之治吐治利何莫非因仲景烏梅丸推類及之若夫白梅之蝕惡肉仍是去死肌青黑志之旨黃梅漿之解暑渴仍是安心除煩滿下氣之用特其變酸為鹹苦則致津之外自有軟堅去鞕之功變酸為甘則致津之中更有調燮陰場之效循是以思梅之功蓋猶未盡乎此而所以啓人元悟尚是仲景用梅有以誘之耳大豆黃卷以黑大豆於壬癸日浸井華水中候生芽長五寸取出陰乾或取皮用別録參綱目盧子繇曰大豆作黃卷比之種於土而生芽者異矣始生之日黃黃而卷曲直之木性備矣木之為物臟真通於肝肝藏筋膜之氣也夫筋聚於膝膝屬溪谷之府故主溼痹筋攣膝痛者象形從治法也惟稻與菽竝喜於水中放芽特稻喜水養菽宜乾燥故種稻者浸水中俟其有萌而後布種菽則直種於土以稻稟金水之氣而成菽飽火土之氣而熟性元不同培養自宜異耳溼痹者生氣為溼所閉不能宣達也閉於水中暢發生氣之物宜乎能治之矣乃不以稻糵而以菽糵者何夫溼痹而筋攣膝痛則為下部病矣溼閉於下者宜升稟金水之氣者則降故必以飽火土之氣者升而散發之溼不閉則筋自舒筋既舒則膝自不痛比之稻糵善使痰溼食滯下行者正相對照耳舒筋之物有木瓜薏苡牛膝何以茲獨取大豆黃卷夫木瓜治轉筋非治筋攣薏苡治筋急拘攣不治筋攣牛膝治筋攣能降而不能升既治筋攣又欲其溼升者舍大豆黃卷無別物矣所以者何溼流關節關節之大者無如膝而又最近於腹溼既痹于此勢不能下又不能升與其逐而下之仍無出路莫若就近使上於腹或從小便或從汗出而解仲景薯蕷丸治風氣百疾取此與茈胡桂枝防風白斂為伍亦豈不以其能發耶赤小豆夏至後下種苗高尺許葉本大末尖圓峭而小至秋開花淡銀褐色有腐氣結莢長二三寸皮色微白帶紅豆形緊小平頂以赤黯色者入藥其稍大而鮮紅淡紅色者竝不治病綱目人身陽非陰不生陰非陽不化水火者陰陽之徵兆故火貫水中則水用宣水藏火中則火體靖水用宣則五液各歸其所而無水溢之患火體靖則諸氣各由其道而無煎灼之疴癰腫膿血火反灼水也水腫者火不行水也雖然癰腫膿血是血分病水腫是氣分病何以赤小豆均能治之蓋氣血皆源於脾以是知血與水同源而異派濬其源其流未有不順者矣穀氣者歸脾豆又以象形為腎穀赤小而緊則又被心氣於腎所謂貫火氣於水中蓄水氣於火內乃其要則在乎本歸脾能吸火精防水溢也吸火精火生土也防水溢土剋水也然凡物之於人能抑其盛者不必能起其衰能起其衰者不必能抑其盛癰腫膿血為火之有餘水腫則火之不足赤小豆兩者兼治既損其盛又補其衰洵神已乎而不知有餘而往不足隨之不足而往有餘從之故其湊於陰者即不足於陽也矧氣血同以穀而化化穀同以火為用設使陰陽不平火隨化機而滯於血則氣分之火自衰而為患於此即不為患於彼故氣分為水腫亟提血分之火使轉而和陽則腫已血分為癰膿便撮其中之熱轉隨陽分而泄則癰亦已以同為脾家化氣化血之火也試觀仲景之用赤小豆瓜蒂散豈不以火入陰中水無所藉以行遂結於胸乎麻黃連翹赤小豆湯豈不以火蒸於中不能化外之溼溼盛於外不得交在中之陽以相化乎赤小豆當歸散豈不以熱迫於血而陽分反無熱乎亦良以凡豆均鍾生氣於晚春告成實於早秋獨此則布種生苗於中夏成實必至秋盡是其色紅體小稟氣於火者偏徘徊涼風清露之中而成其質則其偏能引火氣達于火退之處而拔火氣之正盛以轉就涼爽之區又何疑焉豫以赤小豆治腫凡陽水益見其功因悟及此渴有虛實渴而小便多者虛渴也渴而小便不利者實渴也兩者均於消渴病見之傷寒中仍有飲水不化水停生熱而渴者尤實中之實此其驗當以衇浮數或水入即吐或自汗出為憑蓋腸胃之受盛有限水入之無節難量故滿則泄則溢矣此則以傷寒而論若雜病亦有水與熱相搏而不相入者則水不能化津火適足以耗液相搏則寒熱不相入則消渴或陽結於上陰溜於下為泄利或不泄利為腹脹滿或反逆於上為吐或入於幽隱成澼皆可以利水已之但察其水係未化者以五苓散治之使其上而後下若其已化則直以赤小豆通之可也酒用稻米精鑿浸七日蒸成飯攤一夕每米一石入小麥麴屑二斗水一石酵一小杯踹和密蓋二日性發則其中如沸然後揭蓋以木耙攬之日二三次候糟沉酒浮乃止滿百日遂無完飯壓去糟取酒煎熟盛甕泥封愈陳久者愈佳世之於酒不謂其引藥性上行即謂其引藥性入血不曰性熱而驅寒即曰性速能行氣然別録主治不曰引藥性助藥力而曰行藥勢豈不以是藥本治是病特其機勢不張藉此以行之耶不曰解散邪毒而曰殺百邪惡毒氣豈不以邪與毒之躁烈者受解散而不受殺惟沉痼及積冷非解散所能治者必以此劫而行之耶夫稻米之性本熱且滯而鬱而激之變濡遲為迅烈觀其隆冬沍寒之際不假烹煉自然如鼎之沸使其質如粥之糜以漸而消不可謂其不行氣散結也以穀而竟消成汁始則變白為黃久則變黃為赤其性復動蕩不羈不可謂其不行血去瘀也而其大旨所在則有不僅是焉請以仲景之用酒言之傷寒論金匱要略兩書凡水酒合煮之湯三炙甘草湯用酒七升水八升當歸四逆加吳茱萸生薑湯酒水各六升芎歸膠艾湯酒三升水五升即此可見補陰劑中以此通藥性之遲滯散寒劑中以此破伏寒之凝結而用之復有輕重之差矣凡以下丸者五下散者六薯蕷丸腎氣丸天雄散是藉以行補藥之滯九痛丸赤丸侯氏黑散是藉以通邪氣之結大黃䗪蟲丸土瓜根散是藉以逐隧道之澀當歸芍藥散當歸散白朮散是藉以和血衇之壅矣凡以洗藥者三則為抵當湯調胃承氣湯大承氣湯之大黃是駛者復益之以駛欲其過而不留去病而不傷正耳而去邪者復有防己地黃湯之防己防風桂枝甘草漬四物絞取其汁合地黃汁服之不取其助補劑之行反取其增散藥之烈是欲其合散藥隨補藥以驅邪仍不傷正也紅藍花酒之但漬一味寓驅風於行血之中即行血於驅風之內是欲其血和風自滅也其用意微而情最曲屈者莫如鱉甲煎丸之煎鱉甲為膠合諸藥成丸下瘀血湯之煮丸而服一則用於最先一則用於極後是則破癥堅邪氣者欲其自內而外去癥瘕積血者欲其自上而下故其所取有在藥內有在藥外之別也能深研乎此可以知行藥勢之說矣白酒酒之新篘者也其色白其味甘辛其氣輕揚故為用在上焦之肺而治胸痹詳見薤白下許叔重謂禾為嘉穀二月生八月熟得時之中又謂禾木也木王而生金王而死則禾之實正與麥相反何以能養人若出於一也夫惟人原具中和之氣養之之物豈得一途且粳與麥性不同亦不但生熟之時如麥喜乾惡溼粳則穀雨浸種即在水中逮三伏酷暑天氣愈熱則禾愈茂引水愈多甚至每株每日消水數升一交立秋必放去其水暴令土燥作坼至處暑節復淋以水使之浸潤始漸漸從秀而實是其備得木土之生成水火之烹鍊以就於金而成化育較之於麥蓋有偏全之不侔麥則外寒內溫粳則表裏如一更有純駁之殊故其功效益氣止煩止泄與麥略同而麥之養肝氣止煩渴消穀止利未免各有所止矣蓋五臟六腑皆有氣肺心肝皆能為煩脾腎皆能為泄益則諸氣皆益止則諸煩諸泄皆止惟其不言何臟之氣及何處所發之煩之泄愈以見其用之普也抑藥物之性有宜協於寒者有宜協於溫者有宜協於補者有宜協於泄者惟粳則仲景用於寒劑中如竹葉石膏湯白虎湯白虎加人參湯用於溫劑中如桃花湯附子粳米湯用於補劑中如麥門冬湯獨於泄劑中不用為與甘草殊科惟其與甘草殊科是以不同甘草之滯中不同甘草之壅氣得為日用尋常不可缺取材尤富矣或問仲景用粳米者六方煮法凡分三等於白虎湯白虎加人參湯麥門冬湯附子粳米湯則米藥俱下米熟湯成於桃花湯則先煮米汁後入他藥於竹葉石膏湯則先煮藥物後方入米其中亦具意義乎曰據別録稱粳米益氣止煩止泄竹葉石膏湯證曰虛羸少氣是取其益氣桃花湯證曰下利便膿血是取其止泄白虎湯證白虎加人參湯證皆有煩渴麥門冬湯之火逆上氣咽喉不利附子粳米證之胸脅逆滿嘔吐不可謂無煩是三等煮法適合別録三件功能矣然其所以先煎後入而取其止泄益氣則又必有故蓋後入則所煮之時少煮時少則得味寡而得氣全先煎則煮時多煮時多則氣散而味全陰陽應象大論曰陽氣出上竅陰味出下竅夫虛羸少氣固上竅病下利則下竅病也至真要大論曰補上治上制以緩補下治下制以急急則氣味厚緩則氣味薄以適其所至是故桃花湯用粳米一升竹葉石膏湯止用半升非此之謂乎若夫煩雖中央之病然終近於上故麥門冬湯用粳米三合白虎湯白虎加人參湯六合附子粳米湯半升未有如桃花湯數者至其與藥同入不分前後則又欲其同寅協恭各擅其事無相奪倫斯誠理紛治劇之規模矣造麥麴法用小麥連皮井水淘淨曬乾六月六日磨碎以淘麥水和作塊楮葉包扎懸風處七十日可用綱目李瀕湖云素問麥屬火心穀也鄭康成曰麥有孚甲屬木許叔重云麥屬金金王而生火旺而死三說各異別録麥養肝氣與鄭說合孫真人云麥養心氣與素問合夷考其功除煩止渴收汗利溲止血皆治心病當以素問為準蓋許以時鄭以形素問以功故立論不同愚謂此非確論也夫感金氣而生其性不能不清涼收肅得木氣而長其用不能不條達舒和及火氣通明遂爾成熟則其功能自然同氣相求歸之於心矣是何也蓋古人種麥之候早則白露晚則秋分齊民要術今東南晚寒概以霜降遍種的為金氣正王之時既已下種放芽田中猶無妨騰踏雖至折萌露根無害也才過立春即勾撥田塍之土蓋之謂之削麥削麥之後滿田皆土不覩麥芽斯時方行根入土其基乃固及至清明麥苗尚僅寸餘自是日漸繁茂然屆立夏尚不過尺許既過立夏遂勃然挺發不及一月已苗而秀秀而實實且綻滿堅結矣故夫遲重者金性之驗挺發者木用之兆速成者火體之符也且為金為木亦不必禮疏說文也如金匱真言論東方青色入通於肝其穀為麥猶不可謂之屬木藏氣法時論肺色白宜食苦麥羊肉杏薤皆苦猶不可謂之屬金惟五常政大論升明之紀其穀麥從革之紀其穀麻麥赫曦之紀其穀麥是亦正以平氣從其當偏氣藉其助即六元正紀大論所謂歲穀閒穀者也夫歲穀者得其歲氣之當而生如升明之紀之於麥是矣故食之者以全其真安其氣而閒穀則為他歲之氣宜能輔本歲之偏勝故食之者或賴以去其邪或賴以保其精或賴以避虛邪是乃屬火入心之的據矣若更欲他援以證屬金屬木則又不僅禮疏說文淮南時則訓食麥與羊注麥金穀也地形訓麥秋生夏死注麥金也春秋說題辭麥之為言殖也寢生觸凍而不息精舍刺直故麥合芒事且立也即說文亦不止麥金也金王而生火王而死一義如來一來二縫象芒束之形又不可附會其為木乎考別録所載小麥主治客熱煩渴咽燥小便不利可謂其非肺病漏血唾血可謂其非心病養肝氣可謂其不入肝遡仲景諸用小麥方用白朮散養胎若心煩吐痛不能食飲者加細辛半夏若嘔者以醋漿水服復不解者以小麥汁服是入心而其用在肝咳而衇浮用厚朴麻黃湯婦人臟躁悲傷欲哭數缺伸用甘麥大棗湯是入肺而其用在心以麥粥下枳實芍藥散主癰膿是入肝而其用在心若必欲求其所以入肺入心入肝之故則既非影響揣度所能得并不僅其生長後速先遲所能該蓋猶之於人五官百骸外廓也智巧勇力內藏也人之生也五官百骸具於前智巧勇力成於後具於前者承父母之體氣成於後者效師友之作為天之四時五行萬物所由稟受以生效法以成者也夫小麥既稟清涼收肅之氣以具其外廊謂之入肺可已而不知清涼則火不燔收肅則木不肆是其體入金用在心肝矣及其勃然挺發暢茂條達以遂其長謂之入肝可已而不知暢茂則火用宣條達則憤鬱解是其體入肝用在心肺矣乃至倏爾成實圓渾堅綻以底於成謂之入心可已而不知圓渾能和木堅綻能益金是其體歸心用仍在肺肝矣故後世有麩涼麨平麵溫之別主治各殊即別録亦謂作麴則性溫消穀止利作麵則更溫不能清熱止煩皆可深思熟計者也或問麴別録只言其消穀耳至後世乃以之消障翳消瘀血消胎氣消癥結者何且仲景處方專精畫一非如後世既欲其食又畏其䭇者也乃薯蕷丸補劑復沓之中更用消散後人之智豈作俑於此乎曰藥物之專精者誠非一端可盡譬如解則無所不解柴胡是也散則無所不散麻黃是也下則無所不下大黃是也通則無所不通通草是也何獨於麴疑之夫麴之為物原係日用尋常培人生氣之麥乃拗折其性使異於䭔飪之類玉篇䭔蜀人呼蒸餅為䭔飪大熟也不能生人元氣又異於豉醬之類不能發人鬱遏何則以彼蒸熟此生盦也故蒸熟者助人已化之元氣發人已化之鬱遏生盦者以其能不化自化是故別録著其功曰消穀止利夫穀不消而為利正其病欲不化自行耳得不化自化之麴焉有不愈者哉取此類推則障翳也瘀血也癥結也皆生氣之不化而為患者與胎氣正同有以別於凡障翳凡瘀血凡癥結之日引月長牢固堅凝者總以穀不消而利為準則麴之性之用可得而窺矣若夫仲景處方補中有消正其精義入神之處如其以硝黃之峻攻為調胃承氣而用益氣之甘草以諸蟲桃仁乾漆大黃之通瘀為大黃䗪蟲而獨重益血之地黃假使薯蕷丸補氣補血之物無所不備倘無散風消聚之藥佐助其間則臟腑填實氣血不行又何以發生生之機為轉旋陰楊之本且其方原為虛勞諸不足風氣百疾設耶方中薯蕷三十分為君藥無論已其參苓朮草乾薑大棗之補氣不啻倍於君藥其芎歸地芍麥冬阿膠之補陰僅四十五分而桂枝防風黃卷柴胡白斂之驅風至三十三分可見其意之所在為使血藥佐風藥以去邪氣藥輔君藥以扶正扶正之物過多未免嫌其不能靈活故用十一分之杏仁桔梗以開肺而出治節更用十分之麴以啓脾而納糧儲豈如後人補則連篇填塞運則纍牘峻削之可比哉至於大麥播種之時與小麥同及其收穫早於小麥者半月而性情遂種種不同大麥芒甲連心帖肉與小麥之稍振即離異一也大麥色青者與小麥之色赤異二也大麥理疏質獷屑粉粗脆與小麥之肌粉肥膩異三也大麥味鹹與小麥之味甘異四也是其稟金水之氣以生正同逮接木令則勃然長茂為尤盛蓋不至火王已自成熟其為性寒氣降助木疏土無異議矣故其功效曰主消渴除熱夫惟有兼熱之消渴不兼熱之消渴兼熱者火雖鬱遏而其機外向故藥用得金水之化者仍不妨雜以木土之用使清和之中具發越之義不比不兼熱者一於陰竭陽亢非特必取金水之清寒滋潤且當以助火蒸化津液之品為佐使陰從陽化矣又曰益氣調中夫惟調中者未必能益氣益氣者多足以滯中茲則其疏暢之德究屬穀氣終足以生中氣和脾胃明此所益之氣為中氣與小麥之養肝氣有別仲景以大麥粥下白朮散治妊娠之渴又以之下硝礬散治女勞成疸竝於治肝腎劑中偏寓和胃之義也或問胎前宜涼服白朮散至渴尚不轉用涼劑乃僅以大麥粥止渴豈以大麥粥之寒能敵蜀椒之溫耶女勞成疸宜補乃偏不用補以大麥粥下硝礬散豈以大麥之益氣能勝硝礬之破泄耶曰胎前宜涼為火下迫胎者言耳曾謂胎火上浮上熱下寒者亦可涼乎女勞宜補為恣縱傷陰者言耳曾謂恣縱之後有溼熱乘虛襲入猶可治以補乎譬之初生之兒綿裹不宜太厚然又不可竟使凍也房室已後勿刺勿泄未聞敗精瘀血凝塞隧道亦可補也故徐忠可之論白朮散曰取椒性純陽以陰為歸者使攝上焦氣分之熱下達亦除腹中偶感之寒而使平然猶入陰而不能養陰故以牡蠣氣化純雄性偏陰之物使散凝結以和陰其論硝礬散曰硝能散虛鬱之熱體輕脫而寒不傷脾礬能卻水所到之處邪不復侵如紙既礬即不受水滲是二方者一以化上逆之陽一以禦下侵之溼一片神機非寒熱之可論無補瀉之可別則亦當以寒不傷胃補不滯中之大麥為粥飲散而使之入胃以分布焉彼散者僅服方寸匕而粥極少亦飲一升是其粥多散少雖謂在白朮散中能敵蜀椒之熱在硝礬散中能勝硝礬之泄無不可已造淡豉法以黑大豆六月內淘淨水浸一宿瀝乾蒸熟取出攤席上候微溫蒿覆每三日一看候黃衣上遍不可太過取曬簸淨以水拌乾溼得所以汁出指間為準置甕中築實桑葉蓋厚三寸密封泥於日中曬七日取出曝一時又以水拌入甕如此七次再蒸過攤去火氣甕收築封即成矣綱目大豆為物皮黑肉黃故其用能致陰氣於土而貫土氣於陰觀別録以之除胃中熱痹傷中淋露散五臟結積內寒盡之矣然水不得土則漫溢不行土不得水則不黏易潰能使土遂黏而不潰則本經以之塗癰腫是也能使水得防而易行則別録以之逐水氣是也其性本重入水即沉浸之水而使為黃卷則益重而下行善發極下之閉鬱蒸之火而使為豆豉則變輕而上行善發上焦之韞結張隱庵曰豆為腎穀色黑性沉罯熟而成輕浮主啓陰藏之精上資是矣故其治煩躁滿悶也非特由於傷寒頭痛寒熱者可用即由於瘴氣惡毒者亦可用也蓋煩者陽盛躁者陰逆陽盛而不得下交陰逆而不能上濟是以神不安於內形不安於外最是仲景形容之妙曰反覆顛倒心中懊憹惟其反覆顛倒心中懊憹正可以見上以熱盛不受陰之滋下因陰逆不受陽之降治之不以他藥止以豆豉梔子成湯以梔子能泄熱下行即可知豆豉能散陰上逆矣生氣通天論曰陽氣者靜則神藏躁則消亡故陽與陰和則相合相媾而不相離不和則相擊相拒而不相入陰之所在即陽之所在也虛勞喘於吸不喘於呼此陰之拒陽兩腳俱疼而冷此陰不含陽散其陰之鬱遏使陽得達乎其中此豆豉之秉土德宣水化而輕揚導達之功為不淺矣曰仲景用豆豉多於汗吐下後何也曰豆豉之功在除煩躁滿悶煩躁滿悶非汗吐下後不多見也雖然汗吐下後兼煩躁兼滿悶者不少矣於何定其為梔豉湯證夫汗後有亡陽證則煩躁而不滿悶有內熱證有內實證則煩而不躁下後有結胸證有痞證則滿悶而不煩躁吐後有煩滿而無躁蓋煩躁則非實滿悶則非虛惟其虛實之間斯為發越泄降所宜用於此猶不可定豆豉為開發上焦鬱抑宣導陰濁逗遛耶然則葛稚川取蔥豉湯治傷寒初起非歟夫稚川固言之矣曰凡初覺頭痛身熱衇洪一二日便以蔥豉湯治之則其為熱邪非寒邪在陽明不在太陽明甚何則寒邪應惡風惡寒此但言身熱寒邪當衇數衇緊此則言衇洪證之以仲景所謂傷寒三日陽明衇大者詎非若合符節且梔子與蔥白一係泄熱一係通陽泄熱者縱通陽者衡縱則能通上下之道此所以宜於汗吐下後表邪已減之時衡則能達外內之情此所以宜於病初起卒難辨識之際是在先在後關梔子蔥白不關豆豉又可明矣曰梔子煎湯證亦未見必有滿悶也此則論中所載多矣曰胸中窒曰心中結痛非滿悶之謂耶特按之心下濡句切宜著眼究恐煩滿為實熱證也若論煩躁則在陰者多在陽者少如少陰有吐利躁煩四逆者有自利躁煩不得臥者有吐利手足逆冷煩躁欲死者厥陰有熱少厥微指頭寒默默不欲食煩躁者有衇微手足厥冷煩躁者皆以有衇微四逆而無滿悶知其非陽經證不得治以豆豉矣然陽經之煩躁陰經之煩躁其因究有別也應如何而審之夫煩未有非陽盛者躁無有非陰逆者特陽經之煩躁是陰陽相搏陰經之煩躁是陰陽相逐相搏者其力足相敵而兩不相下相逐則陽既敗北陰復追之也是故陽經之煩躁雖輕揚之豆豉散其陰逆有餘陰經之煩躁即沉重之薑附輔其陽弱不足也雖然豆豉味苦氣寒本屬陰以之治陰逆則寒因熱用熱因寒用非歟夫氣寒氣涼治以寒涼行水漬之此五常政大論文也注家謂熱湯浸漬則寒涼之物能治寒涼試檢傷寒論諸用豆豉湯皆不以生水煮甚者枳實梔子豉湯先空煮清漿水更入枳實梔子再下豉僅須五六沸即已成湯如金匱要略梔子大黃湯以治陽而非治陰遂入藥不分先後是其秉經訓何如嚴耶又如瓜蒂散證在太陽曰胸有寒在少陰曰手足寒衇弦遲在厥陰曰手足厥冷衇緊更明明為寒非如諸梔子豉湯證之竝未言寒也而瓜蒂苦寒豆豉又苦寒亦以熱湯下豉煮汁和瓜蒂赤小豆末服正與以寒治寒之旨相符其證為邪與痰飲因陰陽相搏而結於胸中斷可識矣於此見陰翳之所在即陽氣之所阻驅散其陰翳陽氣自伸此豆豉之功陽氣既伸其實者隨即引而越之使不經無病之所虛者隨即抑而下之使不傷未敗之氣此瓜蒂與梔子之力夫故曰胸中實曰虛煩而用豆豉可竝行不背也說者謂仲景之六經是區分地面所該者廣雖以衇為經紀凡風寒溼熱內傷外感自表及裏寒熱虛實無乎不包素問皮部論曰皮有分部衇有經紀其生病各異別其部分左右上下陰陽所在諸經始終此其立說之源也柯韻伯六經正義觀於廣濟療骨蒸肺氣每至日晚即惡寒壯熱顏色微赤不能下食日漸羸瘦方用豆豉蔥白生地黃甘草童子小便張文仲療虛損慘悴不食四體勞強時翕翕熱無氣力作骨蒸方用豆豉梔子杏仁童子小便服後四體益熱即服豆豉蔥白生薑生地黃童子小便仍不離陽明蔥豉法外臺十六卷刪繁療膽腑實熱精神不守瀉熱梔子煎方用豆豉梔子甘竹筎大青橘皮赤蜜千金療心實熱或欲吐不出悶喘急頭痛瀉心湯方用豆豉梔子小麥石膏地骨皮茯苓淡竹葉仍不離太陽陽明梔豉法信然以是類推則刪繁之以理中茯苓湯治衇實熱極血氣傷心使心好生赫怒口為變赤言語不快消熱止血氣調衇以鱉甲湯治勞熱四肢腫急少腹滿痛顏色黑黃關格不通者竝用豆豉甚者千金以豆豉地黃二味搗散酒服治虛勞冷骨節痛無力崔氏枸杞酒取豆豉以枸杞湯淋秋麻子粉煮汁取半浸麴取半浸米和地黃蒸飯釀成酒治五內邪氣消渴風溼下胸脅間氣頭痛堅筋骨強陰利大小腸填骨髓長肌肉破除結氣五勞七傷去胃中宿食利耳目鼻衄吐血內溼風疰補中逐水破積瘀膿惡血石淋長髮傷寒痹氣煩躁滿悶虛勞喘吸逐熱破血及腳氣腫痹亦悟別録虛勞喘吸兩腳疼冷之旨矣蓋上者陽之所治下者陰之所治陰翳於上則陽與陰搏為煩躁陰翳於下則陰勝陽伏為疼冷豉之為用在上則取蒸盦已後之輕揚在下則取其本體之色黑性沉能於極下拔出陰翳變沉伏為輕揚其實一理也蔥之為物其下層層緊裹而色白其上空中鋭末而色青其實又含孕兩者而白黑若求象形於人身捨目又誰似哉則能補目中不足無惑矣莖蔥之去葉者也汁搗全蔥而絞出者也莖性平汁性溫則陶隱居白冷青熱之說不虛矣然其一主發表一主止血者何居夫其層層緊裹之中莫不莖葉悉具特既出為葉則溫未出內含則平此其間自有精義可容思索蓋內苞者為陽涵於陰既已透達則純平陽矣傷寒寒熱骨肉痛是陽氣外出與所中之風寒爭而不勝也中風面目腫喉痹不通是陽氣為風寒所束縛欲透達而不能也蔥莖中飽具從陰達陽之葉直至根柢其數難稽躍躍欲透而仍未透乃復中含稠涎外包緊束是其發表也能使陽仍不離於陰則與他物之發散異矣血亦氣之汁從氣而化隨氣而行內陰外陽上頂下踵周流灌溉無有已時此其常性也乃或上而不下則為吐為衄下而不上則為溺為利設使邪火內停正當中焦受氣變赤之處則迫氣化血迫津化血就近則湧陽明為衄就便則溜太陽為溺蔥汁正上下流通出陰貫陽之液其辛溫之性味又足以驅散內停之邪火使化者循常行者復故是以不特別録著其止溺血後世且復闡其止衄血矣肝者陰中之陽胎者靜中之動不使陽羈於陰而肝家留邪其用在蔥之氣不使動閡其靜而胎氣不寧其用在蔥之液能如是則謂其安中利五臟也夫何恧焉蔥至難死任憑藏弆但置陰處未曾浥爛臨風日不至枯極寸根著土即便森然夫生氣皆陽氣也死氣皆陰氣也於死陰中得一線生陽即可栽培扶植使之回於黍穀則仲景通衇四逆湯白通湯用蔥之義矣蓋病至下利圊穀裏寒外熱手足厥逆衇微欲絶身反不惡寒面赤色一段陰寒景象僅僅外熱面赤身不惡寒數事可以知陽之未盡然亦已離根而浮於外矣下利厥逆無衇乾嘔而煩陽之尚不澌滅亦祇一線之煩而陰寒下盛逼陽上越已經昭著乃均賴難死之蔥莖培種微陽即以剔去陽中依附揣情合理於仲景微意不既確切而尉帖耶特通衇四逆湯證腹痛者去蔥加芍藥此則猶有說焉夫陰經下利無用芍藥者何則太陰病衇弱其人續自便利設當行大黃芍藥者宜減之以胃氣弱易動故故真武湯證若下利者去芍藥加乾薑其他則僅有桃花湯證腹痛而又下利於此可見純陰下利之候本無腹痛也蓋陰之逼陽有散有結論其證則渙散者盛結聚者微故其治法散者直隨陽之所在而使生根不然則陰陽遂離散矣結則尚可破散其陰冀陽得轉而布於其間較之隨地培陽者為猶易也此芍藥與蔥之異致芍藥與蔥之性即可於此識之本經別録所載蔥之目有實有莖有根有汁是其用各有偏勝而不得相溷仲景用蔥凡五處在白通湯白通加豬膽汁湯旋覆花湯皆但曰蔥至言其數則曰幾莖亦可知即本經之蔥莖矣而本經其莖已下別録即緊注之曰蔥白則五方所用均蔥白也更夷考本經別録四目則蔥白者下不連根上須去管何則以別著根而其名為白則必不兼用其青也乃今之用旋覆花湯者動曰蔥管積習相沿蓋不知何人作俑矣旋覆花湯之證在五臟風寒積聚篇曰肝著其人常欲蹈其胸上先未苦時但欲飲熱在婦人雜病篇曰寸口衇革婦人半産漏下夫革者外兼有餘內純不足也常欲蹈可見肝之著而氣不得條達不曰渴而曰欲飲且所欲飲者不喜寒而喜熱更中插先未苦時句則令欲蹈時已不欲熱飲則肝之著非他乃外寒內熱陰蓄陽陽不得達耳再證之以衇弦而大之革亦為外陰逼迫內陽虛憊此猶不以旋覆花去其在內堅韌之陰蔥白通其在內敝疲之陽以緋帛之新者和其血絡而誰恃哉故蔥之為用仍是別録除肝中邪氣一語無他甚奧微義則不用白而用青者其意究何居耶薤八月栽根正月分蒔最宜肥壤數枝一本則茂而根大葉狀似韭韭葉中實而扁有劍脊薤葉中空似細蔥而有稜至滑澤露不能貯二月開細花紫白色根如小蒜一本數顆相依而生五月葉青則掘之否則肉不滿也參衍義綱目或謂金瘡瘡敗有二義一者金瘡則肌肉既敗而成瘡瘡敗則先瘡而更敗是分疏本經之義一者金瘡因風寒而潰敗是附別録義於本經愚意兩說皆是而究未能鑿然指所以用薤之故也夫薤味辛性溫體滑氣薰凡辛溫者類躁烈而不能滑澤惟此滑澤之至露且難留故取其辛溫以開之滑澤以行之溫中散結四字實用薤之主腦矣以此義傅之金瘡瘡敗遂可見金瘡不敗則非薤之所主其所以敗非更著風寒而何別録更廣其旨即他瘡之敗由風寒者莫不可治以是物藉其溫中有行蓋血留而氣不能行無金瘡他瘡之殊也特他瘡則血因滯阻金瘡則血方出驟止為異耳血留氣阻必生鬱熱風寒又入之斯寒熱相搏而潰敗試思血氣留阻鬱熱昌熾之際庸得以味辛性溫者治之耶故別録復申其義曰搗塗之明其可敷而不可服猶嫌辛溫足以助火為風寒在外鬱火在內也寒熱者陰陽相搏水腫者水火相搏陰陽水火相搏而成寒熱水腫者多矣當以何者為用薤之準耶是則宜以金匱要略之栝蔞薤白白酒湯傷寒論之四逆散而究其歸耳夫胸痹喘息咳唾胸背痛短氣寸口衇沉而遲關上小緊數可見其寒在上熱在中而不能相入少陰病四逆泄利下重可見其寒在中熱在下而不能相交辛溫散寒之中復有滑澤焉足以使兩不相下之氣相交而相入猶不可悟除寒熱去水氣之旨耶然則曰歸於骨者其義何居夫骨以液之滑澤利其屈伸之用薤之為物滑澤極矣又復有辛溫之性可驅內著之風寒是其能歸於骨豈賸語哉薤之為物胎息於金發生於木長成於火是以其功用能於金中宣發木火之氣金者肺與大腸也喘息咳唾胸背痛短氣非肺病而何泄利下重非大腸病而何善夫徐忠可之言曰人之胸中如天陽氣用事故清肅時行呼吸往還不愆常度津液上下潤養無壅痹則虛而不充其息遂不勻喘唾乃隨咳而生胸為前背為後中氣側則前後皆痛上之氣不能常下則下之氣不能時上而短更驗之以寸口沉遲關上小緊數之衇遂鑿然為陽壅於脾而不布陰凝於肺而不宣用栝蔞以踞脾而流動凝結之陰用薤白以踞肺而招徠壅滯之陽尤妙在白酒之為物方從穀中泌出清液味甘辛而色白為自脾入肺動蕩不羈之品使於脾肺之間疏通濬瀹令陰陽巽而相入蓋以肺原嬌臟受柔不受剛故耳泄利矣則不應下重既泄利而仍下重是去者自去留者自留不得但以去者為病矣矧四逆本係脾胃中陰寒凝結不能布陽氣於四末耶是故四逆泄利為少陰病而下重則當究其下焦有熱下焦之熱隨泄而不能和中焦之寒中焦之寒徒泄而不能濟下焦之熱此其間必有結滯在腸胃中隔蔽陰陽使不能通也雖然四逆散中柴胡疏腸胃中結滯芍藥開陰結布陽氣重以甘草之和枳實之破不患其結滯不去中下不交矣又必重用薤白何歟蓋方其兩相拒未必即能兩相洽也順其滑泄之性而其中仍寓辛溫開解於是陽之中得以納陰陰既入陽又去其風寒附會為戾者則陽亦伸而與陰浹矣世之論胸痹之用薤白曰滑利通陽泄利下重之用薤白曰滑可去著而不知其間條理委曲周密有如此者蘇以二三月下種或宿子在地自生其莖方其葉圓而有尖旁有鋸齒而背皆紫者佳八月開細紫花成穗作房結子細如芥子色黃赤葉以五六月採莖子以九月采綱目盧子繇曰詳紫蘇之色香氣味體性生成致新推陳之宣劑輕劑也故氣下者可使之宣發氣上者可使之宣攝葉則偏於宣散莖則偏於宣通子則兼而有之張隱庵曰庭前植紫蘇見其葉朝挺暮垂因悟草木之性感天地陰陽之氣而為開闔者也蘇色紫赤枝葉空通其氣朝出暮入有如經衇之晝行於陽夜行於陰是以其葉能發汗者血液之汗也枝莖能通血衇故易思蘭用其莖通十二經之關竅治胸膈飽悶通大小便止下利赤白豫亦常用其細莖不切斷治反胃膈食吐血下血多奏奇功蓋食氣入胃散精於肝濁氣歸心肝藏血心主衇血衇疏通則食飲自化陽絡傷則吐血陰絡傷則下血通其衇絡使血有所歸吐下自止是言最有體物之致但毗陵為紫蘇之所産其朝挺暮垂誠然但緣日暴所致非有他故設其日天陰則不暮垂矣且凡霍香薄荷豨簽皆然不獨紫蘇也其色紫中空能入血衇則韙矣然劉潛江之言其入氣分猶有進於是者紫蘇莖葉味辛有甘辛勝甘劣以二三月下種八九月收成而釆其葉則於五六月當未吐花時夫以大火之令而釆味辛之物豈不以全火之用金乎金為火用則氣化以火原出水中而金固為水母陽不得陰不能化也故其為用之大概曰下氣除寒中正以其色赤入心心火固氣之靈味辛入肺肺金固氣之主金火合德其氣溫和是心肺合而營諸陽也若然則自能歸脾胃所以其味辛後有甘也乃子繇不特取其宣發且有藉其宣攝者其義亦甚精當蓋肺為陽中之少陰陽不得陰則氣不化金為火用則氣化氣化則極其宣發此易知也惟陰為陽守陽無陰則火僭而氣亦不宣金為火用則宣中有攝究之攝亦所以成其宣耳是以外而六淫可藉宣而驅內而七情亦可藉宣而開謂之溫中達表詎不然歟此仲景於厚朴半夏湯用之以治婦人咽中如有炙臠確取其能宣氣也下品石六味水五味草四味竈之體為土其用則烹飪烹飪之主在水火然水火與釜金薪木同受土範則竈者悉具五行而土為之綱者也凡烹飪者欲令水與物和然必盛之以金煉之以火物始與水相浹焉是成物之和在水成水之用在火蔽火之爍以金資火之燃以木而均稟節制於土則是土者豈僅伍生物之功抑且攢簇五行交媾水火以全其用而奉生人為最要矣人身之水其受化於火範於金土而蔭於木以奉人身為最切者捨血其奚似是以婦人崩中吐血止咳逆止血胥賴之矣雖然竈中黃土治何等崩中吐血此所當急知者也夫血主於心統於脾藏於肝主猶領也史記天官書太白主中國正義統猶本也禮祭統釋文制治也荀子彊國篇然其所以統之注藏懷抱之也禮學記藏焉修焉注是故不能領攝者病在心如本經心腹內崩崩中衇絶等治是也阿膠桑根白皮不能制治者病在脾如本經崩中下血崩中下血五色等治是也石膽鮀魚甲不能懷抱者病在肝如本經崩中漏下及凡言漏下赤白等治是也丹雄雞則竈中黃土所主乃脾病而崩中者也夫以土為血本者如興雲致雨必由於地以土而制治血者如江河之行必循於地苟地蔽其氣則生長無源若失其防則潰決四出下則為崩為泄上則為咳為吐則竈中黃土之用乃脾不能制治夫血也土之所以不能防水者或以土之不埴或以水力過猛或以久溼濘淖觀仲景黃土湯治血在便後與甘草地黃白朮附子阿膠黃芩竝用則竈中黃土之功能於脾家調運水火者也夫土得溼則濘復暴以熱則憤起比之於癰腫恰無以異以常燔而不傷之土氣浥之則向之憤者消矣即此亦可并證血病者也炒鉛丹法用鉛一斤土硫黃十兩消石一兩鎔鉛成汁下醋點之待沸時下硫一塊少頃下消少許沸定再點醋依前下硫消待為末則成丹矣若轉丹為鉛則用連鬚蔥白汁拌丹慢煎煆成金汁傾出則還為鉛綱目述丹房鑒源吐逆胃反陰隨陽升也驚癇癲疾陽劫陰亂也其證迥異其源同乎是蓋有同焉者矣夫火之氣勝則能消水水之力厚則能滅火假使火雖盛而水力不衰水雖旺而火能驅迫其相激蕩相追逐而彼此不相下不至兩敗不已矣吐逆胃反者火雖能激水於中而下之陽既已無主驚癇癲疾者陽雖能攪陰於外而中之陽亦已散亂病有在中在下之不同其源於兩不相下則一也鉛丹之物其妙在質本色黑屬水之鉛以硫消幻變成丹則改屬火比之水為火激而升陰為陽攪而亂無異也但水本潤下以火迫故遂喜升而不就下陰本凝定為陽攪故遂拂亂而不向安此其始固由於火與陽之驅迫及其繼不能不責水與陰之樂從惟是物雖被硫消威脅鎔煉成丹然終能不失重鎮下墜之性一加煎沸還復為鉛定靜堅凝依然故物施之於水火陰陽之相搏其有不陽斂而陰復其位火歸而水遂其潤乎除熱下氣總言其功能之所竟也然惟陰陽水火雖爭而兩皆不虧兩皆未敗者宜之若施之於乏極而動及一勝一負者正亦禍不旋踵故仲景用之惟雜茈胡承氣之間乃為當耳代赭石體重質堅而色赤確是金從火化金從火化非血而誰僧贊寧曰代赭石煮以酒醋插鐵釘於內扇之能成汁此其證矣夫血者流行經絡臥則歸肝於以分布五藏灑陳六府而中焦金火之交媾則其化源也設金火交媾之際乃有熱焉斯受氣不清逮歸肝而日遺其熱積銖纍寸不至為腹中毒邪氣不止在女子則因是衝任不固惡露綿綿如沃泉之懸出而下漏代赭石之質之色正帖切其化源而味苦氣寒能去其熱源清則流自潔斯其所以為主治歟夫肝為風木之藏而藏魂其病發驚駭其經入毛際繞少腹環陰器賊風者肝熱盛而生鬼疰精物惡鬼則肝熱而魂不安幻為種種形象耳即別録所謂帶下百病産難胞衣不出陰痿不起諸候莫不在肝部分血痹血瘀又莫非肝之運量不靈而其最要是除五藏血衇中熱一語是一語者實代赭石徹始徹終功能也仲景用代赭石二方其一旋覆花代赭石湯是邪在未入血衇已前其一滑石代赭湯是邪入血衇已久蓋同為下後痞鞕於心下則熱雖在化血之所而未入衇若入衇則其氣散漫不能上為噫矣惟其不見聚熱之所而輾轉不適焉斯所以為百衇一宗悉致其病也玩百衇一宗悉致其病核之除五藏血衇中熱可不謂若合符節也哉戎鹽生河涯山坂之陰土石間蓋海潮澆山石經久而凝著石上者形塊方稜成垛明瑩而青黑色參唐本圖經戎鹽藉水而結嵌土石間似目晴一狀如纍碁層疊包裹似目晴二鹵水必濁戎鹽則瑩似目睛三色惟青黑似目晴四鹹能使火降寒能使火清是以允為明目治目痛清火降火之物矣其堅肌骨正與食鹽同而其所以異者食鹽則劫痰涎而使吐戎鹽則挽血液而使凝也夫食鹽未嘗不能凝血而終滲泄津液戎鹽未嘗不滲泄津液而終凝血者良亦以食鹽假火日烹煉其成易其化入津液亦易戎鹽自然而生其成難其化入津液則難其為鹽能凝血雖同而傷津液不傷津液則相徑庭矣故別録以之主溺血吐血齒舌血出仲景以之利小便止血者止血之因火迫而散亂利水者利水之不歸壑而漫於土也然則戎鹽所主之心腹痛食鹽所主之心腹卒痛同乎否乎夫固可以一卒字而較二鹽之情性矣且凡心腹痛之宜於鹽者定係留痰停飲惟其飲之稀力能攻衝擊撞乍發乍止故以食鹽劫而吐之飲去而卒者遂已惟其痰之稠勢則凝固膠粘久留不動故以戎鹽化而滲之痰去而不卒者能已若欲驗諸其外則除卒與不卒尚有緩急二者可憑急者必有欲吐不得欲下不能等狀緩者必有咳吐而仍留泄利而不去等候不可不察也成鹽之法不一大率海鹽乘潮漬土取土承鹵煎煉而成此長蘆登萊兩浙閔廣所同也鹵鹽則刮土煎煉而成池鹽則引池水於鹵地恃南風吹結而成此河北山西所同也井鹽不經土但取井水煎成此滇蜀所同也兩淮海豐取鹵與海鹽同惟不取煎煉亦不恃風以日曬而成陝甘之間鹽生於崖并不藉煎煉風日矣數者皆食鹽也蘇子瞻曰江河泉澤之水凡通者皆甘惟入海則鹹人身津液皆甘惟溺則鹹以是知鹹雖水味然水至鹹必往而不反非通流之水矣參天慶觀乳泉賦意往而不反之水死水也煮鹽者無論池井與海竝取往而不反者令其先與土洽繼以火熸則遂成鹽變水成金易寒為溫此其概耳鹽不必盡以水也凡斥鹵之處地中之氣即可成鹽淮南取鹽惟擇不毛之地墾治成場築而堅之灑以海水令其透溼上蓋以灰不一二日運灰入池沃之以水鹵遂漫出矣鹽不必盡以火也淮北之成鹽以日河東之成鹽以風然日固火氣之宗南風之烈亦火氣之化大抵鹽者非他皆不能流通之水不生草木之土用火炙治以成而其性溫則於人亦治水與土之頑礦而已然觀乎別録所主傷寒寒熱胸中痰癖心腹卒痛皆以吐而奏功鹽亦何自能令人吐哉夫圖經之言可信也曰鹵盛之候秉炬以照炬為鹵氣所衝隨即熄滅其氣上行概可見矣葛稚川曰傷寒時氣溫病頭痛壯熱衇大取鹽一升以湯送之腹中當絞而吐更覆取汗便差又曰卒腹痛用食鹽一大把多飲水送之忽當吐即差又曰取上好鹽先以大豆少許含口中勿咽須臾水當滿口至水近齒更用方寸匕抄鹽內口中令與水一時咽療暴得熱病頭痛目眩卒心腹痛及欲霍亂痰飲宿食氣滿喘息久下赤白積聚吐逆乏氣少力顏色痿黃瘴瘧諸風以是察之鹽入人口能令人津液升而裹之於是復多飲水以激之乃能作吐非鹽能令人吐也其能耗精泣血即在此矣然則所謂下部䘌瘡堅肌骨者亦當吐而獲效耶則仲景之言尤可信也曰頭風用大附子一枚炮鹽等分為散沐了以方寸匕摩疾上令藥力行其為摩治亦概可見矣藥性論曰下部蝕瘡炒鹽布裹坐尉之葛稚川曰下利肛痛不可忍者熬鹽包坐尉之千金翼曰瘡癬初生者嚼鹽頻擦之外科精義曰潰癰作癢以鹽摩其四圍即止由是察之鹽摩人身能令風火消除肌肉堅固不必其服之也其能令人咳肌肉胝皺亦即此矣陶隱居謂以鹽醃魚肉則能經久不敗以沾布帛則易致朽爛而未申明其所以然陳訒齊曰是能使易朽爛者不敗反使不敗者易朽爛也夫鹽入口則劫津液而聚之聚之即所以散之矣血肉之物能不敗者取其散去津液而受日暴火炙也布帛之類能致敗者因其鹵氣溼浥縱日暴火炙益易朽爛也是可見其功亦可見其過矣陶隱居云鍛鐵竈中灰爾兼得鐵氣療暴癥大有功案鐵有二種鑄鐘鼎釜鑊者曰生鐵作刀劍器械者曰熟鐵生鐵被火則流熟鐵被火能軟而不能流故治生鐵曰冶治熟鐵曰鍛而熟鐵為器必以椎擊去其落欲其厚薄屈曲亦須錐擊乃就故訓詁書多以鍛為椎擊之義廣雅釋詁鍛椎也莊子列禦寇釋文鍛謂錐擊之是鍛乃治熟鐵之名不得與冶混也所以然者冶能使鐵流鍛能使鐵柔不可不分矣鐵竈畜火古人用木炭木炭之灰今人謂之爐灰以濯油汙鍊生絲矧鍛鐵者在摧剛而令柔使柔而不使流益能化堅癥無疑矣故別録以主癥瘕堅積去邪惡氣者即浣垢汙之義也仲景鱉甲煎丸取和鱉甲與酒煮令泛濫如膠是先消藥之堅然後消病之堅理之中復有理焉可謂神而明之矣炊粟米熟投冷水中浸五六日味酢生白花名曰漿水煎枳實梔子豉湯礬石湯服蜀漆散赤小豆當歸散半夏乾薑散白朮散皆用之穀少水多多從少變其義為穀化於水水行穀氣故凡病穀不從水化及水不能化物者用之暴雨驟降未歸窪下漫流地面者名曰潦水此暫未歸壑非即刻就下則不久自乾麻黃連軺赤小豆湯用之取其溼熱不久注於土黃即愈也急流水置大盆內以杓揚之水上有珠子相逐取珠子用之名曰甘瀾水隨激上泛隨停即消凡水氣不受土防而上逆者取其潤下之性縱遭激揚縱有形跡亦即消散復其就下之性也故茯苓桂枝甘草大棗湯大半夏湯以之煮水令沸如麻名曰麻沸湯水中之氣正揚取其得藥物之氣薄且先上行而後就下也故大黃黃連瀉心湯附子瀉心湯所以解心下濡而痞以假借氣味應假病也凡水皆就土流獨泉水從土出而土不隨之以汨亦不隨之以流諸百合病皆溺時頭有所苦故以之煮諸百合湯取其令溺時頭不痛不淅淅然不眩也井中平旦第一次所汲為井花水井水本留而不行且以經宿之澄尤清且潔以至定至靜之清寒平至定至靜之熱癱瘓此風引湯所以有取乎是也附子每歲以上田熟耕作壟十一月播種春月生苗其莖類野艾而澤其葉類地麻而厚其花紫瓣黃蕤長苞而圓實類桑椹子細且黑九月釆根其品凡七本同而末異其初種之母為烏頭附烏頭旁生者為附子又左右附而偶生者為鬲子種而獨生無附長三四寸者為天雄附而尖者為天錐附而上出者為側子附而散生者為漏藍子雖皆衇絡貫注相須而不相連附子以花白者為上鐵色者次之青緑者為下其形以蹲坐正節角少者為上有節多鼠乳者次之形不正而傷缺風皺者為下天雄烏頭皆以豐實盈握者為勝楊天惠附子記參乘雅半偈烏頭老陰之生育已竟者也天雄孤陽之不能生育者也附子即烏頭天雄之種含陰苞陽者也老陰生育已竟者其中空以氣為用孤陽不能生育者其中實以精為用氣主發散精主斂藏發散者能外達腠理故主中風惡風洗洗出汗咳逆上氣斂藏者能內入筋骨故主歷節痛拘攣緩急筋骨不強身重不能行步而味辛性鋭兩物略同故除風寒溼痹破積聚邪氣之功亦同附子則兼備二氣內充實外強健且其物不假系屬以氣相貫而出故上則風寒咳逆上氣中則癥堅積聚血癖下則寒溼踒躄拘攣膝痛不能行步無一不可到無一不能治惟其中畜二物之精斯能兼擅二物之長其用較二物為廣矣凡物之性雖曰水流溼火就燥然陽祇能引而上陰祇能引而下乃附子獨能使火就下者其義何居蓋譬之爇燭兩條使上下參相直先熄下燭之火則必有濃烟一縷自燭心直衝而上比抵上燭則上燭分火隨烟倏下下燭復燒附子味辛烈而氣雄健又偏以氣為用確與火後濃烟略無殊異能引火下歸固其宜矣惟恐在下膏澤已竭火無所鍾反能引在上之火升騰飛越耳故夫膏饒則火聚火聚則蒸騰變化莫不由是而始生氣通天論曰陽氣者靜則神藏躁則消亡又曰陽氣者精則養神柔則養筋此生氣生血貫百骸運四末之所由也曰開闔不得寒氣從之此癥堅積聚血瘕之所由也氣通則積散積散則火歸火歸則腐熟五穀以之泌別清濁以之蒸騰津液使薰膚充身澤毛亦以之易陰霾為晴朗轉乖戾為太和均無不以之矣元史載蒙古人治金瘡垂斃者急剖牛腹裹其人於中輒活假牛之熱血以銲人之生氣其亦附子治金瘡之遺意也歟劉潛江云先哲謂附子能益火之源以消陰翳夫陰翳者陽不足陰不能運化也故有真陽虛則外來之寒邪以同氣相感而病者如三陰傷寒中寒寒疝之類有真陽虛本身之陰氣不得合化而病者如脾虛腫脹藏寒脾泄之類所因固殊陽虛陰壅非異故均可用附子助陽以逐陰是即所謂消陰翳是即所謂補虛散壅也雖然其補真陽豈特以散壅為功陽之虛而上浮者即能於極上收之如腎厥頭痛之類陽之虛而筋節緩機關弛者即能於筋節機關強之堅之如腰腳冷弱之類種種為功直似澤槁為潤轉剝為復者矣更可思者據其大辛大熱既恐其消陰乃虛寒下血者偏以之固血又恐其助陽乃陽淫化風者偏以之散風蓋血橐於氣聚氣守而血自止風淫於陽浮陽歸而風自散功真理當又何費解之有哉特是物為入陰中之陽如用於水虛火熾者固禍不旋踵矣即用於水不足而火不生者謂非倒行逆施可乎化原不滋漫曰使陰生於陽是混于陽中之陰之物而論其為憒憒甚矣少陰四逆泄利下重用四逆散若腹中痛者加附子中風手足拘急百節疼痛煩熱心亂惡寒不欲飲食用千金三黃湯若先有寒者加附子風水惡風一身悉腫衇浮不渴續自汗出無大熱用越婢湯若惡風者加附子産後中風發熱面正赤喘而頭痛用竹葉湯若頸項強者加附子附子之治風寒非直治風寒也陽氣不榮風寒侵侮陽振而風寒自退附子之利關節非直利關節也筋得寒則攣得熱則弛筋弛而關節自舒與麻黃桂枝茯苓白朮有異矣心下有水氣乾嘔發熱而咳用小青龍湯若䭇者去麻黃加附子霍亂既吐且利寒多不欲飲水用理中丸若腹滿者去朮加附子附子之治水非直治水也水寒相搏為䭇是中寒非外寒也去中寒而水無與搏矣附子之治滿非直治滿也濁氣上則脹是陰逆非氣盛也陽見晛則陰翳消矣此又與甘遂大黃有異也腹痛自利小便不利四肢沉重疼痛用真武湯若嘔者去附子加生薑夫水本趨下過顙在山非其性也必有激之使然能激水使上非陽不能故嘔病必胃中有火胃中有火者宜散不宜行是又附子生薑味辛性溫相同而其用有不同也傷寒論用附子之方凡二十可加入之方二內用生附子者惟乾薑附子湯茯苓四逆湯附子湯白通湯通衇四逆湯四逆湯六方六方之中乾薑附子湯茯苓四逆湯四逆湯三證為表病誤治而致餘皆少陰自病而乾薑附子湯茯苓四逆湯通衇四逆湯三證外皆有熱以愚觀之則凡用生附子者無論有熱無熱外皆兼有表證何則白通湯無表證何以用蔥白即通衇四逆湯可推而知者也若附子湯之身體痛骨節疼可謂非表證否且背微惡寒者對身有微熱而言夫手足逆冷不待病人自言他人可按而知者也背惡寒則病人不言他人何從知之若病人不有微熱而遍身寒譬之冬月嚴寒但知畏之不能指定何處矣本經附子主風寒邪氣殆即生附子之用也兼有表證者用生附子宜乎合表藥用者皆生附子矣而桂枝加附子湯桂枝去芍藥加附子湯桂枝附子湯白朮附子湯甘草附子湯麻黃附子細辛湯麻黃附子甘草湯桂甘薑棗麻辛附子湯竝用炮附子其猶有說歟夫諸證者皆表病盛裏病僅見一端故方中皆表藥多僅用附子以帖切其裏乾薑附子湯茯苓四逆湯附子湯白通湯通衇四逆湯則純乎裏證矣純乎裏證僅見表證一斑故絶不用表藥惟附子用生者以示開導解散之義謂嫌於無表藥也於是知權衡表裏之道重獨見不重叢多引而伸之則寒熱也虛實也上下也皆可以此類推生附子之用又不可泥於專治表證一面矣病以傷寒名宜乎以附子治之最確矣殊不知寒水之氣隸於太陽既曰太陽則其氣豈止為寒故其傷之也有發於陰者有發於陽者其傳變有隨熱化者有隨寒化者烏得盡以附子治之惟其氣為寒折陰長陽消附子遂不容不用矣雖然氣為寒折陰長陽消其為機甚微而至難見請以數端析之知其機得其竅則附子之用可無濫無遺矣曰下之後復發汗晝日煩躁不得眠夜而安靜不嘔不渴衇沉微身無大熱者乾薑附子湯主之曰發汗若下之病仍不解煩躁者茯苓四逆湯主之二證之機皆在煩躁下條煩躁已外不言他證良亦承上而言惟下條則晝夜煩躁上條則入夜猶有間時其他則不嘔不渴無表證衇沉微是可知無表證而煩躁則附子必須用也曰太陽病下之後衇促胸滿者桂枝去芍藥湯主之若微惡寒者去芍藥方中加附子湯主之曰傷寒醫下之續得下利圊穀不止宜四逆湯夫不當下而下其氣不為上衝必至下陷上衝者仍用桂枝以胸滿惡寒故加附子下陷者無不下利但係圊穀則宜四逆若非圊穀衇促胸滿而喘乃葛根芩連湯證則下後陰盛不論上衝下泄皆須用附子也曰太陽病發汗遂漏不止其人惡風小便難四肢微急難以屈伸者桂枝加附子湯主之曰發汗後惡寒者芍藥甘草附子湯主之曰太陽病發汗汗出不解其人仍發熱心下悸頭眩身瞤動振振欲劈地者真武湯主之夫發汗本以扶陽非以亡陽也故有汗出後大汗出大煩渴不解衇洪大者白虎湯證有發汗後不惡寒反惡熱者已調胃承氣湯證今者仍惡寒惡風則可知陽泄越而陰隨之以逆於是審其表證之罷與不罷未罷者仍和其表已罷者轉和其裏飲逆者必通其飲皆以附子主其劑是可知汗後惡風惡寒不罷者舍附子無能為力也過汗之咎是以陽引陽陽亡而陰繼之以逆誤下之咎是以陰傷陽陽傷而陰復迫陽陽亡者表終未盡故多兼用表藥陽傷者邪盡入裏故每全用溫中此又用附子之機括矣其有不由誤治陰氣自盛於內者曰傷寒表不解心下有水氣乾嘔發熱咳且䭇者小青龍去麻黃加附子湯主之曰少陰病始得之反發熱衇沉者麻黃附子細辛湯主之曰少陰病得之二三日麻黃附子甘草湯微發汗以二三日無裏證故微發汗也是三者陰氣盛而陽自困曰傷寒八九日風溼相搏身體疼煩不能自轉側不嘔不渴衇浮虛而澀者桂枝附子湯主之曰若其人大便鞕小便自利者白朮附子湯主之曰若其人汗出短氣小便不利惡風不欲去衣或身微腫者甘草附子湯主之是三者陰溼盛而困陽均之用附子以伸陽用表藥以布陽不緣亡陽其義實與亡陽為近即本經所謂主風寒咳逆邪氣寒溼踒躄拘攣膝痛不能行步者也其附子湯真武湯通衇四逆湯白通湯白通加豬膽汁湯四逆加人參湯四逆加豬膽汁湯四逆散等所主皆係陽衰陰逆均之用附子以振陽用薑草以止逆不緣傷陽其義實與傷陽為近即本經所謂溫中者也總之汗後下後用附子證其機在於惡寒否則無表證而煩躁未經汗下用附子證其機在於衇沉微是則其大旨矣乾薑附子湯證曰不嘔不渴桂枝附子湯證亦曰不嘔不渴真武湯證曰若嘔者去附子加生薑嘔者胃熱渴者陰傷胃熱陰傷宜乎不得用附子矣然而白通加豬膽汁湯通衇四逆湯證之乾嘔四逆湯烏梅丸證之吐桂枝芍藥知母湯證之溫溫欲吐附子粳米湯證之嘔吐腎氣丸證之消渴栝蔞瞿麥丸之渴均不廢附子何耶蓋有聲有物曰嘔有物無聲曰吐有聲無物曰乾嘔有聲者有火無聲者無火有物者實無物者虛實而無火者用之本經所謂破積聚者也虛而有火者亦用之本經所謂溫中也是故非乾嘔非吐非嘔吐者仲景不用附子以嘔係實而有火雖真武湯本宜用者且去之此其驗矣渴之與嘔情本相違故曰先嘔卻渴者此為欲解先渴卻嘔者為水停心下於此見非但嘔者不用附子嘔而渴者益不用附子矣腎氣丸證栝蔞瞿麥丸證之渴非陰傷也陽衰不能化陰也夫人之身水非火不能蒸騰火非水不能螫藏腎氣丸栝蔞瞿麥兩證水下溜而火逆衝正賴附子之性溫下趨使水得溫而上火得溫而歸非特與傷寒之渴不同竝與他證之渴均不同矣六氣感人不能純一其有相兼又多殊致故有相連比者有相乖錯者相連比者燥與火溼與寒之類也相乖錯者溼與火寒與燥之類也若夫溼與燥寒與熱則終不能相兼風則隨氣皆可相混故曰風為百病長矣其有連比最廣近則為患最迫遠則為害最深者莫如痹蓋痹以風寒溼三氣相合而成風以動之寒以凝之溼以滯之動則目前有切骨之痛凝與滯則刻下無舉手之效故仲景用附子他處常不過一枚惟桂枝附子湯白朮附子湯用至三枚甘草附子湯附子湯二枚桂枝芍藥知母湯二兩此其間不為無故矣然身體疼煩不能自轉側衇浮虛而澀且不嘔不渴或大便鞕小便自利表證多而裏證少骨節疼煩不得屈伸近之則痛劇汗出短氣與身體痛手足寒骨節疼衇沉及諸肢節疼痛身體尪羸腳腫如脫溫溫欲吐則表證少而裏證多何以附子之用反重於表輕於裏耶蓋風寒溼之氣惟其在表斯為尤猛故諸肢節疼痛不得屈伸近之痛劇皆猶有間時猶有間處若夫身體疼煩不能轉側則一身筋骨悉痹而無間矣且惟其為表病斯目前雖急迫愈期反可早冀何則在裏則入之深入之深則出不能速故桂枝附子湯白朮附子湯下注云三服盡其人如冒狀勿怪此以朮附并走皮內逐水氣未得除故使之爾而他方下則不言冒可見兩方取效視諸證為捷矣若夫溼中有熱復有寒則寒著氣分熱著血分氣寒血熱則脾必下陷凡脾氣下陷氣血兼病則必下血氣血既已分科先後自當審察故大便堅者必便在血後大便泄者必血在便後此可的知其先血後便為實先便後血為虛矣實者利溼和血病自可痊虛則必溫涼兼用燥潤兼施故黃土湯用附子白朮黃土甘草除氣分之寒地黃阿膠黃芩療血分之熱其理自不可易也然是方也以黃土為君而濡血三味煦氣三味似乎任均力侔而不知仲景於他味用三兩為常事惟地黃止用三兩附子用至三兩皆絶無僅有則附子之用於他物不又可因此而識耶製方之最奇者無如附子瀉心湯然玩濡痞惡寒汗出之文即可知真假對待之證遂施以真假對待之治又可知惡寒汗出為附子之確治矣配合之最不侔者無如大黃附子湯然玩脅下偏痛發熱衇弦緊之文即可知寒熱對待之證遂施以寒熱對待之治又可知驅寒不避虛實為附子之確功矣方相似所治之病極不相似者無如薏苡附子散薏苡附子敗醬散然一則曰胸痹緩急一則曰身甲錯無熱腹皮急濡如腫無積聚衇數此為腸內有癰夫無積聚同也無身熱同也而一痹於胸一腫於腹痹於胸者有緩處有急處腫於腹者其皮雖急按之則濡亦可見胸中為清虛之府縱有留著不過寒熱痰涎無結為癰膿之理腹中則濁陰所歸氣血痰滯無不可留著遂結為癰癰而成膿其衇必數是以胸痹不言衇腸癰則言衇數也又可見附子之除癥堅積聚血瘕必或緩或急縱腫急而按之則濡斯其有以異於他物矣表裏之錯雜者無如竹葉湯然發熱頭痛桂枝湯證兼喘則桂枝加厚朴杏仁湯證再兼一面赤何遂不用杏朴并斥芍藥復入人參附子之溫補桔梗之開提葛根防風之發散竹葉之清熱耶不知面赤有表證有裏證表證者二陽并病也必微汗出不惡寒此為陽氣怫鬱在表裏證者戴陽證也必下利圊穀手足厥熱衇微欲絶身反不惡寒此為裏寒外熱今者謂為表證則不得有喘謂為裏證則無厥逆下利病由産後中風裏虛外實若以裏治則嫌於有表證以表治又嫌於裏虛遂於通衇四逆湯以熟附易生附以生薑易乾薑桔梗者仍是方中治咽痛之劑於桂枝湯則去芍藥之開陰結易以附子之治陰逆人參者仍合乎新加之義更加竹葉葛根防風使在表者為寒為熱淨盡無餘淺視之為補散錯雜之方細揣之則通衇四逆湯桂枝湯合方也於此又可見附子主風寒咳逆邪氣自有治風寒咳逆邪氣之道矣用附子之方極平正通達者惟腎氣丸附子粳米湯而腎氣丸之用甚廣附子梗米湯僅一用此義亦不可不思也腎氣丸金匱要略中用者凡五處其在中風篇則曰腳氣上入少腹不仁在虛勞則曰腰痛少腹拘急小便不利在飲家則曰短氣有微飲當從小便去者在消渴則曰小便反多在婦人雜證則曰轉胞不得溺合五者而觀不言小便則言少腹小便者聚于少腹轉輸於膀胱靈蘭祕典論曰膀胱者州都之官津液藏焉氣化則能出矣能化氣者非附子而誰是腎氣丸之用雖廣其因陽不足不能化陰陰不足不能化陽則一也至於附子粳米湯之用雖隘然亦不可不旁通而測識之蓋腹中雷鳴胸脅逆滿嘔吐甘草瀉心湯證也不下利則瀉心證不備多腹痛則可知其為寒胸脅逆滿嘔吐小茈胡湯證也無寒熱則茈胡證不備多腹中雷鳴切痛則可知其有裏證無表證有寒證無熱證於是溫中之法遂不能不施矣然其溫中不用理中而用附子梗米是又必有故夫理中守而不走之劑也以乾薑較附子則此動而彼靜以大棗梗米較參朮則此和而彼補又以半夏之能升能降可滑可燥主持於中何其不有天淵之異耶天雄仲景書惟天雄散中用之而天雄散又不言所主何病但附於桂枝龍骨牡蠣湯後實使人無以測知其故雖然細意紬繹上文亦可得其概矣夫云男子平人衇大為勞極虛亦為勞以下凡六節僅出一桂枝龍骨牡蠣湯湯後即附天雄散方豈不以六節之中其證何者合用桂枝龍骨牡蠣何者合用天雄散令人自擇之耶夫曰男子則不可以婦人混之矣曰平人則不可以病人混之矣蓋六節中有云陰寒精自出痠削不能行者有云精氣清冷無子者有云陰頭寒者是即天雄之所主歟天雄乃附子之類其性為陽氣充實于中而不他化者精之為物遇陰則凝遇陽則行今陰既寒而精自行又焉得不以陽氣充實不泄者治之耶以此推本經附子天雄主治略同之處凡欲其走者以附子為佳欲其守者以天雄為善大致亦可識矣烏頭之用大率亦與附子略同其有異者亦無不可條疏而件比之也夫附子曰主風寒咳逆邪氣烏頭曰中風惡風洗洗出汗咳逆邪氣明明一偏於寒一偏於風一則沉著而回浮越之陽一則輕疏而散已潰之陽於此見附子沉烏頭浮矣附子曰除寒溼踒躄拘攣膝痛不能行步烏頭曰除寒溼痹一主治踒一主治痹踒躄拘攣是筋因寒而收引陽氣柔則能養筋又何患其不伸寒溼痹是氣因邪而阻閉陽氣強則能逐邪又何患其不開於此見附子柔烏頭剛矣夫惟其沉方能柔惟其散則為剛沉而柔者無處不可到無間不可入散而剛者無祕不可開無結不可解故附子曰破癥堅積聚血瘕烏頭曰破積聚寒熱於此可見其一兼入血一則止及氣分矣金匱要略烏頭赤石脂丸聯用附子烏頭治心痛徹背背痛徹心其義最為微妙沈明宗曰邪感心包氣應外俞則心痛徹背邪襲背俞氣從內走則背痛徹心俞藏相連內外之氣相引則心痛徹背背痛徹心即經所謂寒氣客於背俞之衇其俞注於心故相引而痛是也夫藏為俞氣之所根俞為藏氣之所駐謂其連屬則諸俞總在足太陽一經經衇與藏竝不相通也故治俞者未必能及藏治藏者未必能及俞附子烏頭以氣相屬係不相連而同施竝投焉則可知兩物為用溫藏之寒即能外及俞之痛治俞之痛即能內及藏之寒故方中蜀椒乾薑赤石脂皆用一兩并附子烏頭二物亦僅及其數可見雖用二物原若只用一味而其感通呼吸之理已寓於其間矣引而伸之觸類而長之則栝蔞根實竝用蘼蕪芎藭竝用蜀漆恆山竝用古人皆必有意義於其間所當深長思者也大烏頭煎治寒疝只用烏頭一味令其氣味盡入蜜中重用專用變辛為甘變急為緩實烏頭之主方矣且篇中論衇甚詳尤在涇釋之尤妙曰弦緊衇皆陰也而弦之陰從內生緊之陰從外得弦則衛氣不行惡寒者陰出而痹其外之陽也緊則不欲食者陰入而痹其胃之陽也衛陽與胃陽竝衰外寒與內寒交盛由是陰反無畏而上衝陽反不治而下伏所謂邪正相搏即為寒疝此用烏頭之衇也曰寒疝繞臍痛自汗出手足厥冷曰拘急不得轉側發作有時陰縮此用烏頭之證也此外用烏頭之法猶有二證一則曰病歷節不可屈伸疼痛者烏頭湯一則曰寒疝腹中痛逆冷手足不仁若身疼痛灸刺諸藥不治者抵當烏頭桂枝湯烏頭湯比於麻黃抵當烏頭桂枝湯比於桂枝尤可知烏頭為治陽痹陰逆之要劑矣夫不可屈伸而疼痛者陰之實強者也逆冷手足不仁者陽之大痹者也陰實強而仍知疼痛則陽猶強而能與之對待陽大痹而至手足逆冷不仁則全乎陰用事陽遂不能與之爭矣是故烏頭湯用麻黃以兼泄其陽抵當烏頭桂枝湯則用桂枝以伸其陽用麻黃者仍輔以黃芪補氣行三焦欲令其陽氣不傷用桂枝者仍輔以薑棗和外欲令其陰氣不泄麻黃為峻劑峻則如大烏頭煎法使甘緩之蜜變其鋒鋭之厲桂枝為緩劑緩則無事更緩故令與桂枝另煎合服以收相合而不相爭奪之功此用猛將之權輿實使烏頭之妙諦也至赤丸治寒氣厥逆烏頭之任在茯苓半夏之下細辛之上可知其病由飲作飲停則陽痹陽痹則陰逆陰逆則寒生而厥矣其用烏頭亦不外如右諸方之旨矣半夏二月生苗一莖莖端三葉淺緑色頗似竹葉而光亦似芍藥葉根相重生上大下小皮黃肉白五月釆者虛小八月釆者實大以圓白陳久者為佳圖經半夏味辛氣平體滑性燥故其為用辛取其開結平取其止逆滑取其入陰燥取其助陽而生於陽長之會成於陰生之交故其為功能使人身正氣自陽入陰能不使人身邪氣自陽入陰使正氣自陽入陰則內經所謂衛氣行於陽不得入於陰為不寐飲以半夏湯陰陽既通其臥立至是也不使邪氣自陽入陰則傷寒論所謂若能食不嘔為三陰不受邪半夏則止嘔專劑也傷寒寒熱陽證也傷寒寒熱而心下堅則陽去入陰證矣咳逆裏證也胸脹而咳逆則表裏參半證矣頭為諸陽之會陽為陰格則眩咽喉為群陰之交陰為陽搏則腫痛腸鳴者陽已降而不得入氣逆者陽方升而不得降汗出者陽加於陰陰不與陽和凡此諸證不必委瑣求治但使陰不拒陽陽能入陰陰陽既通皆可立已是故半夏非能散也陰不格陽陽和而氣布矣半夏非能降也陽能入陰陰和而飲不停矣不容殫述之功贅此數言孰曰尚有遺義哉大小茈胡湯茈胡加芒硝湯茈胡加龍骨牡蠣湯茈胡桂枝湯治傷寒寒熱心下堅之劑也小青龍湯小青龍加石膏湯射干麻黃湯厚朴麻黃湯澤漆湯越婢加半夏湯桂苓五味甘草去桂加乾薑細辛半夏湯治胸脹咳逆之劑也小半夏加茯苓湯治頭眩之劑也苦酒湯半夏散及湯治咽喉腫痛之劑也半夏瀉心湯生薑瀉心湯甘草瀉心湯治腸鳴之劑也葛根加半夏湯黃芩加半夏生薑湯竹葉石膏湯麥門冬湯大半夏湯下氣之劑也本經主治惟止汗一語仲景無專方餘則悉相印合或問半夏傷寒寒熱非心下堅者不用咳逆非胸脹者不用以及咽腫腸鳴無不可屬之下氣今以葛根加半夏黃芩加半夏生薑等湯係之豈治嘔即所謂下氣歟曰他物下氣未必不止嘔如本經橘柚吳茱萸之類是也他物下氣未必盡止嘔如本經旋覆花杏核仁之類是也半夏下氣未必盡因止嘔如心下堅胸脹咽腫腸鳴是也半夏止嘔又未必不盡因下氣如金匱要略厚朴七物湯白朮散竹葉湯是也蓋非氣逆則不嘔故千金方婦人虛損篇遠志湯若其人心胸氣逆者加半夏淡竹筎湯氣逆者加半夏竹葉湯氣逆者加半夏小柴胡湯胸中煩而不嘔者去半夏可見嘔緣氣逆氣逆由水與氣相激則半夏允為的對之劑矣曰然則本經著他物之功凡曰上氣者與此蓋有別矣其所以別者安在曰考本經菖蒲五味子牡桂射干芫花杏核仁皆著其功曰主上氣然未有不連及咳逆者是知凡主上氣之病皆能使逆氣自上焦而降半夏等主下氣則僅能使氣不自中焦逆為其別矣雖然金匱要略曰火逆上氣咽喉不利止逆下氣者麥門冬湯主之論證則曰上氣論治則曰下氣又可見諸氣湊於肺者謂之上氣氣自中焦上逆不必至肺即謂之上氣亦無不可特半夏主中焦氣逆不治諸氣奔迫于肺也且本經於杏核仁既曰主咳逆上氣又曰下氣則又可見上氣下氣終不可混上氣下氣終不可混則半夏下氣之功斷在中而不在上又何可混耶問小青龍湯渴者去半夏小柴胡湯胸中煩而不嘔者去半夏渴者去半夏豈煩而不嘔口渴者遂盡無用半夏者乎曰是不然蓋證必有因因水與氣相軋而成者皆不得有渴及不嘔而煩若其因有不同則溫經湯所主婦人下利暮即發熱少腹裏急腹滿手掌煩熱脣口乾燥舉一病三者胥犯之矣何者其病之因緣瘀血在少腹故也夫氣主煦之血主濡之氣留而不行是氣有餘血壅而不濡是血有餘氣有餘便是火血有餘亦生火特氣分之火能消水耗陰血分之火不能消水耗陰能消水耗陰者見證在正面不能消水耗陰者見證只在側面故不曰身熱心煩而曰手掌煩熱不曰口渴引飲而曰脣口乾燥則又何害其中宮水停氣搏可用半夏哉若夫氣分之病嘔與渴本相背馳故曰先嘔卻渴者此為欲解先渴卻嘔者為水停心下此屬飲家嘔家本渴今反不渴者以心下有支飲故也此屬支飲又曰支飲者小半夏湯主之半夏之治嘔其反覆推明也如此至嘔渴竝見之候如豬苓湯之咳而嘔渴五苓散之小便不利渴欲飲水水入即吐均不用半夏其嚴又如此即嘔家有癰膿不可治嘔膿盡自愈一節雖不言及半夏而不用半夏之旨已隱然陰寓于其中蓋半夏為治嘔專劑今者嘔病中兼患癰膿癰者衇必數衇數者口必渴則知其嘔緣火氣犯胃非復氣與飲搏矣擴而充之則非特嘔而渴者不用半夏雖謂之萬病見渴則均不與半夏相宜可矣青龍柴胡陷胸承氣建中半夏方名皆有大小之稱將以寒涼為大耶律之青龍則可易而之他則不可通矣將以溫熱為大耶律之建中則可易而之他又不可通矣柴胡之大不以能和半夏之大反以能和陷胸之大取以當病之急承氣之大最忌用之不審又他當用大者不可先試以小而承氣獨以是垂法他既用小者不可更繼以大而柴胡偏以是建功既無一定之例可援又無對待之義可審是六方者將無偶粘以大小之名竟無絲粟意義於其間耶是蓋不然夫青龍興雲致雨者也陷胸摧堅搜伏者也承氣以陰配陽者也建中砥柱流俗者也是四方者以功命名則當大任者為大當小任者為小惟柴胡與半夏則以藥命名以藥命名則柴胡主疏主疏則疏之大者為大疏之小者為小半夏主和主和則和之大者為大和之小者為小雖然諸嘔穀不得下未得為小胃反嘔吐未必為大而用大小半夏湯將毋倒置耶是又不然蓋嘔而穀不得下病在胃胃反嘔吐病亦在胃第穀不得下之嘔是胃逆有火可見胃猶有權至於朝食暮吐暮食朝吐宿穀不化胃幾於無權矣故小半夏湯劫散其火胃中自安大半夏湯則將轉磽瘠為膏腴用人參不足又益以白蜜即水亦須使輕揚泛濫不欲其性急下趨化半夏之辛燥為宛轉滋浥之劑小半夏湯是耕耘頑礦而疏通之使生氣得裕大半夏湯是沃潤不毛而肥饒之使生氣得鍾於此見半夏之和有大有小可潤可燥不拘拘然局于化飲定中又可見小半夏湯所謂駟馬駕輕車就熟路王良造父為之先後者也大半夏湯所謂何意百鍊剛化為繞指柔者也同以薑夏二味成方或為小半夏湯或為半夏乾薑散或為生薑半夏湯此薑夏之殊性可測識薑夏之功能可循按也夫薑夏同以味辛為用薑之性主於橫散夏之性主於降逆嘔也噦也喘也莫非上逆之病特嘔者有聲有物乾嘔與噦皆有聲無物有物者為實無物者為虛乾嘔與噦又有虛實之殊蓋乾嘔者氣動而不寧噦者氣定而相搏是乾嘔者虛中之虛噦則虛中之實矣觀小半夏湯主諸嘔穀不得下主支飲不渴主黃疸小便色不變欲自利腹滿而喘因除熱為噦半夏乾薑散主乾嘔吐逆吐涎沫生薑半夏湯主病人胸中似喘不喘似嘔不嘔似噦不噦徹心中憤憤然無奈一則氣逆而實一則氣逆而虛實者佐以走而不守之生薑虛者佐以守而不走之乾薑又夏之性烈于薑之性然薑適足以制夏之烈故實者夏倍于薑虛則夏薑相等此小半夏湯與半夏乾薑散非特意義不同抑且製劑迥別實則多與而疊與焉虛則僅服方寸匕又用漿水煎之以和其性固難竝日語矣若夫生薑半夏湯證全在病人意中而不見諸形象迷悶之極諒不能以降逆一途冀其發越故倍生薑搗治取汁先煎半夏而後內之使薑之氣鋭夏之氣醇散力迅疾降力優柔其與小半夏湯用意正相胡越尤斷斷不能相提竝論矣凡以半夏下氣者須識此裁成輔相之宜乃不貽膠柱鼓瑟之誚半夏之用惟心下滿及嘔吐為最多然心下滿而煩者不用嘔吐而渴者不用前既言之詳矣其治咽喉猶有在少陰喉痛外者乎其亦有宜用不宜用者乎夫咽中傷生瘡不能語言聲不出者苦酒湯但咽中痛者半夏散及湯此少陰證也咳而上氣喉中水雞聲射干麻黃湯火逆上氣咽喉不利止逆下氣者麥門冬湯婦人咽中如有炙臠者半夏厚朴湯此則非少陰證也炙臠言其形水雞言其聲生瘡不能語言聲不出言其痛楚之狀不利言其有所阻礙於此可見半夏所治之喉痛必有痰有氣阻於其間呼吸食飲有所格閡非如甘草湯桔梗湯豬膚湯徒治喉痛者可比矣非特其治咽喉有宜忌也即其治眩治腸鳴亦莫不各有宜忌如曰卒嘔吐心下痞膈間有水氣眩悸者小半夏加茯苓湯曰假令瘦人臍下有悸吐涎沫顛眩者五苓散於此即可見眩因於水乃為半夏所宜然水在膈間則用水在臍下則不用此眩之宜忌矣半夏瀉心湯生薑瀉心湯甘草瀉心湯皆有腸鳴皆兼下利則知腸鳴而不下利者非半夏所宜矣發汗後腹脹滿者厚朴生薑甘草半夏人參湯主之先渴後嘔為水停心下小半夏加茯苓湯主之卒嘔吐心下痞膈間有水眩悸者小半夏加茯苓湯主之妊娠嘔吐不止乾薑人參半夏丸主之婦人咽中如有炙臠半夏厚朴湯主之傷寒固與雜證不同表已解者亦與雜證不異妊娠又與雜證不同然有病者亦何能大異於無妊之病是故四方者其中皆有小半夏湯在乃所治之病迥不相侔何耶夫小半夏湯治中宮氣水相忤欲逆於上之劑也水勝於氣則加茯苓氣虛水逆則加人參氣水竝盛結而阻閡胃脘則加厚朴紫蘇茯苓原理密相貫半夏之功用竝未異於常也若夫傷寒表解裏未和其氣既不上衝又不下泄徒脹滿於胸中不日晡潮熱不繞臍痛不口燥咽乾不汗出不小便自利則不得為陽明而用承氣不手足自溫不衇緩不時痛時止則不得為太陰而用理中然徒脹滿則於太陰為近陽明為遠蓋氣無約束則脹水無約束則滿既脹且滿又何能不上逆為嘔下泄為利耶加理中之半於小半夏湯中使半夏生薑斡旋中宮俾勿上逆使人參甘草填補中宮俾勿下泄然又恐其補勝於和也故於承氣中擇厚朴之除滿者與補相對待焉不得為補劑亦不得為泄劑又不得為汗劑實為和中之劑其著力處全在小半夏湯半夏之用神明變化極矣病發於陽而反下之熱入因作結胸病發於陰而反下之因作痞所以成結胸者以下之太早故也同為邪氣自外至內而結胸言熱入痞不言下早可見病發於陰者之非熱始終不可下矣始終不可下者反早下之則陰邪必自外入內陰邪自外入內其溜於下部者無論已其竊踞於陽位者治法舍半夏其誰與歸是故半夏瀉心湯生薑瀉心湯甘草瀉心湯旋覆花代赭石湯皆莫不有半夏是半夏者陰邪竊踞陽位之要劑也蓋凡陰陽相協乃成生氣故物性之熱者多生於沍寒其性寒者多生於暄暖半夏生於三陽開泰之後成於一陰才姤之時則其鍾陰氣達初陽可知矣能達初陽則雖陰而不能潤惟鍾陰氣故雖燥而仍能入陰稟此陰陽相間之德滑燥悉具之能又何得不從陽入陰治踞於陽位之邪哉雖然痞仍有不用半夏者大黃黃連瀉心湯附子瀉心湯是也結胸亦有用半夏者小陷胸湯是也夫惟有所入則必有所挾所入既有陰陽所挾亦必有陰陽設所入既為熱所挾又為熱兩熱相合其鋒必盛所入既為寒所挾復為寒兩寒相并其凜必深故治熱不嫌大黃芒硝之峻治寒不厭人參乾薑之溫特其所踞之地不可不究胸中雖陽位實飲之所聚故縱用消黃仍不能離甘遂葶藶即用參薑仍不失兼半夏芩連也若夫所入係寒所挾則熱所入係熱所挾則寒於是不能不以輕鋭無著之寒泄其所挾之熱以寒溫錯雜之製治其所挾之寒此大黃黃連瀉心湯小陷胸湯之所以主也譬之水性河最橫淮次之江則寬廣安行者也乃今日者淮之地見奪於河其水反入於江則淮之地既為河所占則不能不以治河之法治之淮之當治者以既入於江反不必治矣半夏之病是陰邪踞於陽位陽位之邪無論其自外而入自內而合凡現在所見之證不屬夫陰則不得概用於此不可見耶傷寒發汗若吐若下解後心下痞鞕噫氣不除旋覆花代赭石湯主之傷寒胸中有熱胃中有邪氣腹中痛欲嘔吐者黃連湯主之半夏之所與其剽徑乃爾傷寒解後虛羸少氣氣逆欲吐者竹葉石膏湯主之火逆上氣咽喉不利止逆下氣者麥門冬湯主之胸痛不得臥心痛徹背者栝蔞薤白半夏湯主之胃反嘔吐者大半夏湯主之半夏之所與又淡宕如是在剽徑中正賴其驅飲醒中不得儕卑賤卒伍也居淡宕中尤仗其下氣和脾則允為監制劇職矣夫物貴因時用須審勢諸湯所主頭緒雖繁然撮其要不過胸痞嘔吐上氣心痛已耳胸痞尚濡寧用大黃黃連瀉心湯不用半夏嘔吐至食入口即出需用乾薑黃連黃芩人參湯不用半夏上氣莫甚於肺癰喘不得臥乃葶藶大棗瀉肺湯不藉有此心痛最劇是心痛徹背背痛徹心烏頭赤石脂丸豈藉加茲以是而論則半夏遂可無用乎殊不知半夏之妙正在不用處有以見其用耳合乎溫燥隊中見煩則不用見渴則不用合於清潤隊中偏為煩與渴之良劑如竹葉石膏湯麥門冬湯雖不言煩渴用清甘若是其多則豈盡能無而大半夏湯中人參白蜜以補以潤決非絶無煩與渴者審乎此則為剛劑中鋒鋭柔劑中斷制其功豈可泯耶下品草十九味大黃正月內生青葉似萆麻大者如扇根如芋大者如碗長一二尺其細根如牛蒡小者亦如芋四月開黃花亦有青紅似蕎麥花者莖青紫色形如竹根黃色中貫赤紋切之有黃汁參唐本圖經盧芷園曰大黃稱將軍將軍者所以行君令戡禍亂拓土地者也味大苦氣大寒似得寒水正化而炎上作苦苦性走下不與上炎者反乎參同契云五行相克更為父母素問云承乃制制則生化是故五行之體以剋為用其潤下者正炎上之用乎則凡心用有所不行變生疢難者舍同類之苦巽以入之不能彰其用矣蓋心主夏主熱火主神主血衇主病在五臟主心腹部位若腸胃之間心腹之分夏氣熱火之鬱神情血衇之結瘀閉宿留致成癥瘕積聚變生寒熱脹滿者皆心用不行大黃能蕩滌之是謂推陳推陳者正所以行君之令闢土地安人民阜生物是謂致新致新者正所以調中化食安和五臟者也或曰開土地滌腸胃利水穀皆脾所司何為行火用也曰火有用而靈正當生土火無用而息正當瀉土顧其名自得之矣大黃之用人概知其能啓脾滯通閉塞蕩積聚而已豫以為盧芷園行火用一語實得火能生土之機括何者大黃色黃氣香固為脾藥然黃中通理狀如綿文質色深紫非火之貫於土中耳千金諸風門仲景三黃湯心近熱者加大黃肝臟門犀角地黃湯喜忘如狂者加大黃解五石毒門人參湯嗔盛者加大黃以此見土氣必得火氣貫入而後能行火氣必得土氣之通而後能舒火用不行則積聚脹滿癥瘕遂生土氣不行則煩懊譫妄嗔恚竝作兩相濟而適相成胥於此識之矣或謂如是則本經首推大黃通血固不妄矣乃仲景偏以為承氣何哉曰自金元人以順釋承是理遂不可通爾試以六微旨大論亢則害承乃制之義參之則承氣者非血而何夫氣有餘即是火而火不徒燃必著於物是故津液精唾便溺涕洟留飲宿食及血皆火之膏也因火盛而膏耗膏耗則火愈燃火愈燃則膏更易竭故必增膏以配火斯火復而膏亦復然其所著不一故為病亦不一治之者黃芩知母門冬地黃皆所以增膏靖火者也其所著之物不一則其所著之處亦不一故黃芩主著肺與脾者知母主著肺腎與胃者門冬主著心肺與胃者然諸味所治皆火僅著津液精唾未必涉血其同為著於血又同歸心與脾者惟地黃與大黃為然特地黃氣薄味厚為陰中之陰大黃氣味竝厚為陰中之陽故地黃所主是血虛火盛大黃所主是火盛著血緣血虛而盛者究係無根之火故能著血能著津液精唾不能著留飲宿食若夫火盛而能著血則無處不可著矣故著隧道則為血閉寒熱著橫絡則為癥瘕積聚著腸胃則為留飲宿食大黃通血閉貫火用於土中在隧道則隧道通在橫絡則橫絡通在腸胃則停滯下本經著其功曰蕩滌腸胃推陳致新通利水穀調中化食安和五臟詎有濫歟乃或者以其推逐迅疾斤斤然計較其不可用之處纍牘連篇殊不知執定緣火盛著物非緣陰虛陽亢二語又豈有他歧之誤耶桃核承氣湯抵當湯抵當丸下瘀血湯下瘀血者也柴胡加龍骨牡蠣湯鱉甲煎丸除血閉寒熱者也大黃䗪蟲丸大黃牡丹湯破癥瘕積聚者也大陷胸湯大陷胸丸己椒藶黃丸大黃甘遂湯桂苓五味甘草加薑辛半杏大黃湯袪留飲者也厚朴七物厚朴三物湯厚朴大黃湯推宿食者也火有微盛著有淺深宜緩宜急為湯為丸審而處之而後知用大黃之法也血液津溺涕唾人身已化之水氣也飲人身未化之水氣也火氣著於血液津溺涕唾則血液津溺涕唾結而不行遂不能泄澤骨節滑利諸竅用大黃去著於血液津溺涕唾之火使血液津溺涕唾得復其常可已未化之飲非血液津溺涕唾比也火亦著之仍可以大黃去其結耶是則不然蓋大黃之用惟在火結於人身實有之物飲之為飲雖已在人身未與人身浹則猶在虛處未在實處也未在實處之物縱為火著即以大黃去火火去飲能仍留為患故大陷胸湯丸己椒藶黃丸大黃甘遂湯皆有藉乎甘遂葶藶不全恃大黃已然則溼熱發黃者亦用大黃夫溼又非飲比乃瀰漫霧露之氣也又何能與火結而茵陳蒿湯梔子大黃湯大黃硝石湯均不離大黃之峻且速耶是又不然蓋發黃之溼非外感之溼所謂瀰漫霧露者也考傷寒金匱所載疸證一則曰但頭汗出餘處無汗齊頸而還小便不利則當發黃再則曰發熱汗出此為熱越不能發黃夫汗即津也小便乃溺也所謂溼乃緣津與溺外不得越下不得泄而生則仍是人身實有之物反非如飲之未化者矣雖然觀所謂穀疸者曰食飽則微煩頭眩小便難曰風寒相搏食穀即眩穀氣不消胃中苦濁濁氣下流小便不通陰被其寒熱流膀胱曰食即頭眩心胸不安是穀疸者兼有食而非徒溼矣酒疸曰小便不利胸中熱足下熱曰腹滿欲吐鼻燥衇沉弦曰心中懊憹或熱痛是酒疸之熱之盛又非穀疸可比矣於此見大黃之用火不盛者必滯兼實滯乃為得當也或曰柯韻伯曰厚朴倍大黃為大承氣大黃倍厚朴為小承氣是承氣者在枳朴應不在大黃矣曰此說亦頗有理但調胃承氣湯不用枳朴亦名承氣則不可通耳三承氣湯中有用枳朴者有不用枳朴者有用芒硝者有不用芒硝者有用甘草者有不用甘草者惟大黃則無不用是承氣之名固當屬之大黃況厚朴三物湯即小承氣湯厚朴分數且倍於大黃而命名反不加承氣字猶不可見承氣不在枳朴乎夫氣者血之帥故血隨氣行亦隨氣滯氣滯血不隨之滯者是氣之不足非氣之有餘惟氣滯并波及於血於是氣以血為窟宅血以氣為禦侮遂連衡宿食蒸逼津液悉化為火此時惟大黃能直搗其巢傾其窟穴氣之結於血者散則枳朴遂能效其通氣之職此大黃所以為承氣也不然驗其轉失氣何以反贅於小承氣下不責之倍用枳朴之大承氣耶柯韻伯謂凡藥之生者氣鋭而先行熟者氣純而和緩故大承氣之用仲景欲使芒硝先化燥屎大黃繼通地道而後枳朴除其痞滿此言是也夫緩則久留鋭則退速故大陷胸湯先煎大黃後入他物茵陳蒿湯先煎茵蔯後入大黃梔子一以結胸熱實按之石鞕且衇沉緊從心下至少腹鞕滿痛不可近是上下皆痹雖用甘遂芒硝之鋭猶恐其暫通復閟則反使大黃當善後之任變峻劑為緩劑一以溼熱不越瘀熱於裏渴飲水漿小便不利是內外皆痹究之一身面目悉黃勢必不能一下皆退故為內急外緩則大黃梔子當前茅茵陳為後徑峻者任其峻緩者益其緩一物而處以權則其物應之而適當病情更可知藥之性固所宜究用藥之巧尤所宜參矣惟傷寒論以瀉心湯治心下痞金匱要略以瀉心湯治心氣不足吐血衄血痞者實證大黃用麻沸湯絞汁吐血虛證大黃與他藥同煮豈不以實非真實故鋭藥鋭用能使其無所留戀虛則真虛故鋭藥緩用能使其從容不迫耶然究兩證之源似皆不得指為實熱而竝用大黃者其義何居魏念庭曰病本陰邪入裏何以反用寒藥蓋關上衇浮其陽勃勃欲出是陽為陰格也故名之曰氣痞氣痞陽也若以陽藥濟之陽益浮於上不幾成關格乎惟急瀉其陰陽亦隨之以降陰邪凝結者去真陽於是流布矣此傷寒論之義也盧芷園曰瀉心者瀉血分有餘之邪使之相平乎不足之氣也心有不足血無所主兼并舊畜之瘀鬱遏盛甚而致暴焚載血上行倉皇洊妄非下有形安克效哉顧苦寒下法似乎降火不知火之成患正在不得上炎有形者去火空斯發心氣無虞不足矣故知心氣不足之從來實在堅凝閉密之寒火得疏通安問堅凝閉密者乎則奚為治火實是治寒此金匱要略之義也二者一以氣分虛痞故取其氣不取其味一以血分瘀結故氣味兼取焉一方而氣血虛實之轉旋咸備明乎此則用藥遂無滯義矣仲景用大黃每諄諄致戒於攻下而於虛實錯雜之際如柴胡加龍骨牡蠣湯鱉甲煎丸風引湯大黃䗪蟲丸等方反若率意者今之人則不然於攻堅破積則投之不遺餘力而凡涉虛者則畏之如砒鴆殊不知病有因實成虛及一證之中有虛有實虛者宜補實者自宜攻伐乃撤其一面遺其一面於是虛因實而難復實以虛而益猖可治之候變為不治無怪乎醫理之元今人不及古人遠甚也柴胡加龍骨牡蠣湯風引湯澀劑也澀劑用大黃似乎相背不知仲景用藥必不浪施夫柴胡加龍骨牡蠣湯為證暴風引湯為證緩暴病既以柴桂解外人參薑棗益中龍蠣鉛丹鎮內則大黃似可不用矣然解外可以已一身盡重不可轉側益中鎮內可以已煩驚胸滿讝語非大黃不為功小便不利非茯苓烏能通是大黃茯苓實一方之樞紐必不因此礙龍蠣之澀矣緩證既用桂甘龍蠣又益之滑石石膏赤白石脂寒水石紫石英於五臟間似亦網羅良備矣然癱癇而曰熱必其風聚熱生挾木侮土故脾氣不行積液成痰流注四末如上諸物止及肺心肝腎作病之本最要在脾舍脾何以行氣四旁故大黃者所以蕩滌脾家所聚而乾薑之守而不走實以反佐大黃使之當行者用當止者止是大黃乾薑又一方之樞不閡夫澀者也鱉甲煎丸大黃䗪蟲丸攻劑也攻劑用大黃似乎適當其可不知二證者一由外感一由內傷然皆有所結內傷者自血以及氣故先有乾血而延及氣外感者自氣以及血故寒熱不止而後為癥瘕皆有所聚又皆聚於血故大黃率諸飛走靈動之物以攻堅則同但自於氣者窮其源以人參乾薑益之自於血者探其本以芍藥地黃濟之亦非徑情直行孟浪以投之者也大黃固將軍隨所往而有所督率烏得以卒伍卑賤視之哉後之人鑒乎此則知大黃實斡旋虛實通和氣血之良劑不但以攻堅破積責之矣大黃之用至賾而不可惡於四方見之矣他如六氣之中風引湯治風大黃附子湯治寒茵蔯蒿湯大黃硝石湯梔子大黃湯治溼調胃承氣湯麻仁丸治燥大陷胸湯丸大黃甘遂湯治水六經之中調胃承氣湯大陷胸湯丸治太陽大小承氣湯茵蔯蒿湯麻仁丸治陽明大柴胡湯治少陽桂枝加大黃湯治太陰大承氣湯治少陰氣血之中大小承氣湯厚朴七物湯厚朴三物湯厚朴大黃湯治氣桃仁承氣湯抵當湯丸鱉甲煎丸大黃䗪蟲丸大黃牡丹湯下瘀血湯治血亦可謂至動而不可亂矣雖然於此中猶當舉一以反三焉如厚朴三物湯厚朴大黃湯小承氣湯藥味同而方名異茵蔯蒿湯大黃硝石湯梔子大黃湯均治黃而佐使殊皆不可不辨其所以然得其所以然而用大黃之精意愈顯矣原夫三物成湯其制方之意豈不以大黃通其陰枳朴通其陽乎然就通陽之中又有朴通上枳通下之別小承氣湯較之大承氣湯大黃之分數同厚朴得大承氣四之一枳實得二之一厚朴三物湯則與大承氣同在承氣湯則曰其熱不潮未可與承氣湯若腹大滿不通可與小承氣湯微和胃氣勿令大泄下在厚朴三物湯則曰痛而閉夫痛而閉與腹大滿不通亦非大相徑庭何以陽藥之多至於此極蓋陰主痛陽主滿言滿不言痛是陽病陰不病言痛不言滿是陰病陽不病病者為不足不病者為有餘重泄其有餘以就不足輕泄其不足以配有餘觀小承氣之三物同煎則欲大黃之有餘力厚朴三物湯之先煎枳朴後納大黃是欲大黃之無餘威非特小承氣用大黃多厚朴三物用枳朴多且可證惟其治血乃為承氣矣若夫厚朴大黃湯之治是飲飲在陰而陽亦滯不能為之運動與諸結胸證不殊故大陷胸湯用大黃六兩大陷胸丸用大黃八兩此亦用六兩為非無因矣明乎此方可知大黃分數之宜慎梔子大黃湯之候曰酒疸心中懊憹或熱痛茵蔯蒿湯之候曰穀疸寒熱不能食食即頭眩心胸不安大黃硝石湯之候曰腹滿小便不利而赤此表和裏熱懊憹太陽證也故佐以梔豉穀疸陽明經證也故佐以茵蔯表和裏實陽明府證也故佐以硝石黃檗府證者倍大黃陽明經證半之太陽證又半之明乎此又可知大黃佐使之宜擇斯二者俱了然豁然則大黃功能庶幾無餘蘊矣問金匱要略嘔吐篇既曰病人欲吐不可下矣又曰食已即吐與大黃甘草湯不自相矛盾乎按此蓋當分別觀之夫欲吐者其人意中欲吐仍未得吐不由食與不食食已即吐可見不食則不吐矣王太僕曰內格嘔逆食不得入是有火也病嘔而吐食久反出是無火也食久反出且為無火何況欲吐仍無所出耶是其一有火一無火有火者實無火者虛實者宜下虛者不可下章章明矣然則傷寒論之食入口即吐本篇諸嘔吐穀不得下與此正同何以一用乾薑黃芩黃連人參湯一用小半夏湯此獨用大黃之峻重耶然食入口即吐食才入口未嘗及咽也嘔吐穀不得下能入咽而不能下也食已即吐能及食竟則已下矣而不能留也三者一係寒熱相格內外交鬪故應機病發不待及其鋒鍔一係停飲在中內方盛滿納物即溢故可入不可下一係下脘為物壅塞無從傳化故不能留而反出焉然此與反胃亦無以異乃胃反嘔吐諸條何以仍不用下蓋胃反是脾不磨故朝食暮吐暮食朝吐此是胃氣不納故食已即吐夫胃能納脾不能運其病猶緩胃且不納定不能游溢精氣上輸於脾所謂胃氣生熱其陽則絶者詎不勢迫且切而急以大黃瀉陽以救陰耶大凡峻藥多治急病急病在人身每伏於不可見知之處如此證之用大黃亦其一也他如柴胡加龍骨牡蠣湯證僅以胸滿讝語而用少陰大承氣湯證僅以口燥咽乾而用大黃䗪蟲丸證僅以肌膚甲錯兩目黯黑而用苓甘五味加薑辛半杏大黃湯證僅以面熱如醉而用皆其機甚微其勢甚猛如鹵莽草率鮮不以為不急之務而忽之葶藶冬即萌芽初春生苗葉高六七寸似薺根白色枝莖俱青三月開花微黃結角子扁小如黍粒微長黃色圖經葶藶根白子黃味辛氣寒恰合從肺至脾之用其萌芽於寒水得潤下之性長茂於風木具通達之能收成於火令擅速急之長從肺及脾自上抵下通達遠急又何憂乎癥瘕不消積聚不散結氣不化飲食停滯得為寒熱哉然此猶上脘中宮之患也其最切近於肺為極上之害者尤莫如水水熱穴篇曰夫水其本在腎其末在肺故肺為喘呼腎為水腫肺為逆不得臥分為相輸俱受者水氣之所留也蓋水雖就下滿則必溢溢則盛於皮毛攻其所合而反上動下寧若欲循其本從下泄之其留於上與外者必不能隨之順流而下故當從上泄之此本經主治所以及破堅逐邪通利水道別録主治所以及皮間邪水上出面目浮腫也淮南子云大㦸去水葶藶愈脹於此可見腫而不脹非上氣喘逆者非葶藶所宜矣肺癰喘不得臥肺癰胸滿脹一身面目浮腫鼻塞清涕出不聞香臭酸辛咳逆上氣喘鳴迫塞支飲不得息者皆與葶藶大棗瀉肺湯水證胃家虛煩咽燥欲飲水小便不利水穀不化面目手足浮腫與葶藶丸下水則葶藶之用前說不可云不善矣惟是牡蠣澤藛散治腰以下水氣鱉甲煎丸治瘧母己椒藶黃丸治腸間水氣其病皆不在上又何以用之殊不知葶藶本經原主癥瘕積聚結氣破堅逐邪通利水道故凡水氣堅留一處有礙肺降者宜用之如腰下水氣瘧母條中原不具證惟腸間有水氣者明摘腹滿口舌乾燥為據猶不可識腸為肺合為水所留能使氣阻化熱致口舌乾燥則葶藶之功不難即此窺之矣矧大㦸芫花甘遂等非不治堅癖難下之水特其水皆汪洋四射不比葶藶所治之水上不下故古人多以泄氣閉目之也尤在涇曰大陷胸之治在胃大承氣之治在大小腸大承氣專主腸中燥糞大陷胸并主心下水食燥糞在腸必藉推逐之力故須枳朴水食在胃必兼破飲之長故用甘遂愚謂甘遂僅著驅飲之效葶藶更兼蕩食之功故大陷胸湯但用甘遂大陷胸丸并用葶藶也桔梗春生苗莖高尺餘葉似杏葉而長垂四葉相對而生夏開小花紫碧色頗似牽牛花秋後結子根大如指白色圖經素問皮部論曰在陽者主內在陰者主出以滲於內氣海腸胃之氣在陽者也五臟間出納之氣在陰者也在五臟者肺主出氣腎主納氣肺不出氣則氣逆亂於氣海而腎無由納腎不納氣則氣逗遛於腸胃而肺愈無由出胸脅痛如刀刺是氣海中氣不行也腹滿腸鳴幽幽是腸胃中氣不行也氣海腸胃之氣皆不行於是驚恐與悸作焉驚者氣亂也恐者氣下也悸者氣不行則水內侵心也桔梗色白得肺金之質味辛得肺金之用而苦勝於辛苦先於辛辛者主升苦者主降已降而還升是開內之滯通其出之道也六府之氣舒五臟之氣達上焦之痛中焦之滿下焦之鳴何患不一舉而盡除三焦之患除又何患其氣之亂且下飲之聚哉惟氣怫於內故邪留於外寒熱邪留於陽也風痹邪留於陰也五臟腸胃既利氣血既和在外之邪又烏能容故可不著意而自除氣通則陽旺陰消故納穀自加蠱毒自下矣海藏東垣丹溪皆謂桔梗入腎豈不以仲景治少陰喉痛耶殊不知桔梗主喉痛仍是治肺非治腎也夫足少陰直者從腎上貫肝膈入肺中循喉嚨挾舌本支者從肺注心中腎家邪熱循經而上肺不任受遂相爭競二三日邪熱未盛故可以甘草瀉火而愈若不愈是肺竅不利氣不宣泄也以桔梗開之肺竅既通氣遂宣泄熱自透達矣雖然此舉其暫者言耳曰咳而胸滿振寒衇數咽乾不渴時出濁唾腥臭久久吐膿如米粥者非氣停即飲停飲停即熱生氣血為之潰腐耶亦主以桔梗湯而注其效曰再服則吐膿血豈非火清則熱行氣宣則腐去也由此而推謂腎家之熱為肺所阻者其一端也肺家有熱氣不宣泄何獨不能阻腎之氣使熱復生於下哉又曰亦主血痹血痹之衇寸口關上微尺中小緊是病亦關於腎蓋血痹由於氣痹氣開則血開上竅通下竅自通也通衇四逆湯咽痛者去芍藥加桔梗利止衇不出者去桔梗加人參芍藥開陰結止腹痛下利桔梗開陽結亦止腹痛下利可知戴陽之候有結於陽有結於陰桔梗芍藥之用隱然相對待矣利止必腹痛先已腹痛已則結已開無所事芍藥竝無所事桔梗況結既開正嫌其虛又烏可復用開泄人參之補肺桔梗之開肺又隱然相對待矣於此知桔梗之苦先於辛苦歸於辛苦者以開提腸胃畜積辛者使從肺泄為出路諸家謂為升提謂為舟楫似矣其實又有故焉如此者寒實結胸無熱證者治以白散散中用桔梗為疏通氣分之主夫開導胸中之氣仲景於大承氣湯小承氣湯梔子厚朴湯莫不用枳朴此偏不用何哉蓋病有上下治有操縱結在上者宿痰停飲也故凡結胸無論熱實寒實寧用甘遂葶藶巴豆不用枳朴如大陷胸湯丸白散是也結在中下始熱與實浹氣隨熱化則於蕩滌邪穢中疏利其與邪為伍之氣大小承氣等湯是也況桔梗之用使氣上越而不使氣下泄今病在至高固宜操上而縱下不使中下無過之地橫被侵凌故曰病在膈上必吐在膈下必利也熱邪與停飲結治以瓜蔞而佐之者反用半夏黃連寒邪與停飲結治以巴豆而佐之者反用桔梗𦮷母於寒因熱用熱因寒用之中反佐以取之可謂精義入神以致用者矣排膿散即枳實芍藥散加桔梗雞子黃也排膿湯即桔梗湯加薑棗也排膿何必取桔梗蓋皮毛者肺之合桔梗入肺暢達皮毛膿自當以出皮毛為順也散之所至者深湯之所至者淺枳實芍藥散本治産後瘀血腹痛加桔梗雞子黃為排膿是知所排者結於陰分血分之膿桔梗湯本治肺癰吐膿喉痛加薑棗為排膿湯是知所排者陽分氣分之膿矣二方除桔梗外無一味同皆以排膿名可見排膿者必以桔梗而隨病之淺深以定佐使是桔梗者排膿之君藥也旋覆花二月生苗多在水旁大似紅藍而無刺長一二尺莖細葉似柳六月開花如菊圓而覆下七八月採花圖經蘄陽李氏謂旋覆花俗傳露水滴下即生蓋亦不然新城王氏名象晉著有群芳譜則謂花梢頭露滴入土即生新根嘗劚地驗其根果不相聯屬是說也豫亦親試之矣凡花梢露本從根出而帖於上以敵日暴比之水從腎而布於五臟為五液者何異其還下滴得土而別生根比之五液下注而或滲於膀胱或行於衛氣或入於營氣者何異況黃通於脾鹹先入腎恰合水隨低窪而歸壑氣由三焦而下行之義以是則稱之曰補中下氣除水去五臟間寒熱詎不可也第補中之物必味甘性平旋覆花則鹹鹹者水之去而不返者也故其為用惟堪俾從小便出所謂補中不過為其必歸於土任土之宣布輸送不若甘遂葶藶輩一往無前有傷中氣而已兩脅者陰陽之道路升降之要樞水不歸土而結滯於氣道則為驚為悸主結氣及脅下滿驚悸即下氣除水之功也然則仲景以之治在上之心下痞鞕噫氣不除在下之半産漏下何也蓋水能從下行則氣道可暢而參甘大棗得以施其補中之力氣能下返則血源遂裕而蔥與新絳得以逞其通絡之功絡通則血澤氣順則痞除原無甚深妙義也藜蘆三月生者葉青似初出棕心又似車前莖似蔥白青紫色高五六寸有黑皮裹莖似棕皮根似馬腸根長四五寸許黃白色二月三月採根陰乾圖經青紫為心腎肝膽之色黑為腎色黃白為脾肺之色青屬木於病應風紫為赤黑相兼屬水火於病應痰與熱黑屬水於病亦應水以青紫黑裹之莖採於二月三月正當莖槁大氣返於黃白之根將透發而未透發其象為舉肝膽心腎之風水痰熱盡從脾肺而宣自下而上自內而外非吐劑而何咳逆者風水痰熱之客於脾也舉肺脾之風水痰熱而盡除之又何憂乎咳逆與腸澼泄利哉頭有瘍及疥瘙惡瘡是風水痰熱在上病關乎肺非上湧之品不為功蟲係風水痰熱醞釀而成其病關脾氣之在內者死肌係風水痰熱漸漬而致其病關脾氣之在外者脾家風水痰熱被藜蘆一掃而清則諸病焉能不瘳耳不入湯用者湯則降散則升又湯取氣散取質用質則應病速而去亦亟湯則恐其氣味留連腸胃間其毒足以纍人元氣耳藜蘆味辛入肺去風氣寒除痰熱而性主湧吐故凡風痰之壅於上者用之可令隨病除病無誅伐無過之咎仲景以藜蘆甘草湯治手指臂腫動其人身體瞤瞤者夫手指臂為手陽明太陰兩經經由之地腫則為溼動則為風謂非風與痰壅於肺部可乎瞤者動之微動者潤之著瞤則惟己獨知動則人皆可見當其風痰上壅其所主之經既已躍動昭彰人身之氣血衇絡無不應之蓋亦將自瞤而動矣吐去風痰肺家已治且安所主之經絡自然通暢一身之與相應而欲效之者悉除矣徐洄溪曰凡有毒之藥皆得五行剛暴偏雜之性以成人身氣血乃天地中和之氣所結故服毒藥者往往受傷瘡疥等疾久而生蟲亦與人身氣血為類故人服之有傷氣血者必能殺蟲惟用之得其法乃有利無弊否則必至兩傷不可不慎也又云毒藥解毒各有所宜如燥毒之藥能去溼邪寒毒之藥能去火邪辨證施治神而明之非僅以毒攻毒四字可了也射干春生苗葉似蠻薑而狹橫長疏如翅羽故一名烏翣其中抽莖高二三尺似萱草而強硬疏長正如長竿六月開花六出或黃或紫或紅而以紫色者為勝狀如蝴蝶瓣上有細紋其色白故名紫蝴蝶花花後結房大如拇指房四隔一隔十餘子大如胡椒色紫極鞕咬之不破參圖經綱目射干紫花六出上界白文恰似水火相結於金之界域所用又其還原反本之根而味苦主降氣平復下降降之甚者非特下行且能橫散故其所主首為咳逆上氣喉痹咽痛不得消息蓋既有喉痹復兼咽痛且無止息之時則非水火相結於肺之部位而何肺屬金火者金之所畏水者金之子能泄金之氣易通卦驗云冬至射干生可知因水氣盛而動之物則必能動水氣其開花以四月又可知因火氣盛而舒展之物亦必能舒展火氣乃至七月即莖葉盡槁其氣復返於根則可知其動水氣舒火氣均能使從金之界域各歸其所自來此所以治咳逆上氣喉痹咽痛不得消息也此所謂散逆氣也腹中者大腸所居大腸亦屬金腹中邪逆明逆氣自大腸而上也食飲大熱者水穀之氣不下行又不旁出壅於胸中為患即別録所謂因胸中熱氣而咳唾言語氣臭得此亦能下行且解散也夫胸中水穀之氣本係精微原供上奉以敷布五臟灑陳六腑若上有肺部之結則不能引其清者於上下有大腸之逆則不能傳糟粕於下於是胸中之氣清不得為清濁不得為濁居清虛之位偏化為重濁之味暫則但涉氣久則將涉血凡似此者非咎肺不降大腸不宣而誰咎哉上竅不通則下竅亦不通上竅通則下竅自通即用射干之微旨也別録療老血在心脾間一語最是耐人思索將主統之不善而有所留耶則主血統血云者調劑運量之謂非若肝之實有所藏也惡乎得有所留將經之不留轉而有所留耶則手少陰從臟走手足太陰從臟走足不在臟間則在手足間皆非留血之地縱手足間有老血又決非射干之所能治也將絡間有所留耶則橫行曰絡即有所瘀亦決非射干直行者所能治蓋讀仲景金匱要略而後知心脾間即內經所謂募原者也夫心氣自左而降脾氣由中而升升降交錯之間正受氣變赤之地設升降之源不清則所受之氣自濁或不能變聚為痰涎或既變赤不能敷布灑陳於是凝結臟腑空隙之所脂膜之間其處在中之左左之中則非左脅而誰故素問瘧論曰瘧間日發者由邪氣內薄於五臟橫連於募原也其道遠其氣深其行遲不能與衛氣偕行不得皆出故間日乃作也金匱要略曰瘧當瘥不瘥者此結為癥瘕名曰瘧母用鱉甲煎丸其中正有烏扇二者與別録射干療老血在心脾間正相吻合於此見心脾間老血由於結氣氣之結由於腹中邪逆腹中邪逆由於飲食大熱飲食大熱之見於外者為咳吐言語氣臭其見於內者為胸中熱氣是致病之由診病之法悉舉無遺本經素問金匱要略均一以貫之矣喉中水雞聲比之喉痹咽痛不得消息同乎否耶蓋氣必因痹而阻喉中必由阻而有聲且其聲不他似獨似水雞則決可知為氣與水阻矣氣與水阻之候其正治在小青龍特無表證而又不腫故以射干紫苑款冬花大棗易桂枝芍藥甘草俾散為和以收為降雖紫苑款冬大擅其功然號無邪而實有飲謂涉虛尚屬實終不能不仗射干降氣開結之猛力故其名獨冠一方之首是亦可悟射干與麻黃合而名方之義矣善夫徐忠可曰肺痿有咳有涎沫無上氣喘逆則凡遇上氣喘逆及有臭痰者為肺癰無臭痰只水雞聲者為火吸其痰然水乃潤下之物何以逆上作聲近見拔火罐者以火入瓶罨人患處立將內塞吸起甚力始悟火性上行火聚於上氣吸於下勢不容已上氣水聲亦此理耳此非瀉肺何以愈之故治此病以加射干開結下水為上也常山汴西淮浙湖南州郡出者莖圓有節高者不過三四尺葉似茗而狹長兩兩相當二月生白花青萼五月結實青圓三子為房海州出者葉似楸葉八月有花紅白色子碧色似山楝子而小蜀漆是其莖也八月九月採之其草暴燥色青白者可用若陰乾便黑爛鬱壞矣參唐本圖經凡藥物非鱗介飛走未有云氣腥者惟仲景用蜀漆必注曰洗去腥則可見其氣之惡劣異於他草木矣而以二月生九月收其花又色白萼青故其功能為自肺及肝凡惡劣之氣結為病者皆能從而入之所謂同聲相應同氣相求也人身惡劣之氣鍾為病者在肺無如痰涎在腸胃之間無如募原之邪在肝膽之間無如積聚故痰涎之發為咳逆寒熱募原之發為瘧積聚之凝為腹中癥堅與痞蜀漆竝能治之在上在中者以吐而除在下者以利而解亦各從其類也楊仁齊云常山治瘧人皆薄之瘧家多畜痰涎黃水或停瀦心下或結澼脅間乃生寒熱法當吐痰逐水豈容不用水在上焦則能吐之水在脅下則能破其澼而下其水但須有所佐助必克收功其有純熱發瘧或蘊熱內實之證投以是物大便點滴而下似泄不泄者須得大黃為佐泄利之而愈矣則知是物之用正欲其吐且下今人每每欲以他物制之使不吐未免違其所長然雖不吐終能直抵病所激之使動則亦未可厚非也瘧病之本由夏傷於暑熱氣盛藏於皮膚之內腸胃之外營氣所舍之處遂令人汗空疏腠理開因得秋氣汗出遇風及或以浴水氣舍於皮膚之間與衛氣并居衛氣行至畜邪之所則兩邪相薄先則陽邪從陰為寒繼則陰邪并陽為熱先寒後熱此為寒瘧其有先中之邪舍之深者內薄於五臟橫連於募原則其道遠其出遲不能日與衛氣相從故有間日作者有間兩日作者甚有病因與是反者則先熱後寒為溫瘧有陽邪獨發不返於陰則但熱不寒為疸瘧大率邪之深者痰涎必多痰涎愈多則寒益盛故金匱用蜀漆散治多寒之牡瘧更加蜀漆則治溫瘧附外臺牡蠣湯方亦治牡瘧即三法以觀蜀漆之用及用蜀漆之法均可窺矣蓋痰涎深伏幽隱非蜀漆和漿水湧吐之法無以發越更須龍骨雲母使不當去之火有所歸斯陽從龍起陰隨湧泄庶胸次得以廓然其痰涎益深則寒氣亦益深甚且寒反居後則蜀漆更加半分至牡蠣湯中牡蠣即蜀漆散中龍骨之義蜀漆得雲母專去陽邪依陰故以龍骨為佐牡蠣湯中麻黃即蜀漆散中雲母之義蜀漆得麻黃專開陰邪之固閉故以牡蠣為輔升降得宜收放由我此用蜀漆之權宜亦用諸毒藥之通義也傷寒衇浮醫以火迫劫之亡陽必驚狂起臥不安者桂枝去芍藥加蜀漆牡蠣龍骨救逆湯主之其加蜀漆也成聊攝謂是山澤通氣取以泄陽熱之氣方中行謂是散火邪之錯逆張隱庵謂是從陰達陽以清火熱魏念庭謂去芍藥加此為奏迅疾之效黃元御謂是吐瘀腐而療狂尤在涇謂是去胸中邪結氣徐五成謂是辛散火邪喻嘉言程郊倩并不解及於此愚按泄熱正須芍藥辛散豈無生薑通陽豈無桂枝惟吐腐去結庶為近理然同一火逆也前此曰火逆下之因燒針煩躁者桂枝甘草龍骨牡蠣湯主之夫吐之與下必吐傷甚而下差緩與其吐之而仍治以桂枝甘草龍骨牡蠣何如下後亦不過用此之愈乎曰衇浮熱甚反灸之此為實實以虛治因火而動必咽燥唾血可見衇浮被火應至吐血今更吐之是速其血耳矧千金外臺兩書非痰非瘧不用是物則是方之有舛訛無疑故愚不敢強為附會云甘遂苗似澤漆莖短小而葉有汁根皮赤肉白作連珠狀大如指實重者良參唐本蜀本圖經甘遂根皮赤肉白金就火裹何憂不流而味苦下趨氣寒協水實重者其性著裏如連珠則節節疏通雖有挾束仍能開縱故專行著裏之水無問頑堅也水熱穴篇之論水曰水病者下為胕腫大腹上為喘呼故腎為之本肺為之標大腹腹滿面目浮腫標本俱病矣尤在涇之論陷胸證曰胃為都會水穀竝居清濁未分邪氣入之夾雜痰食相結不解則成結胸大小腸者精華已去糟粕獨居邪氣入之但與穢物結成燥糞而已大承氣專主腸中燥糞大陷胸并主心下水食糞在腸必藉推逐故須枳朴水食在胃必兼破飲故須甘遂留飲宿食去則水穀之道利矣金匱要略用甘遂半夏湯治雖利心下續堅滿又用大黃甘遂湯治水與血結於血室於此見水能為疝瘕癥堅積聚之根并可見泄利者大黃不得用甘遂仍可用蓋其性徑情直行不稍留戀故非特能行停蓄泛濫之水即徘徊瞻顧欲行不行之水并其所長矣白斂二月生苗多在林中作蔓赤色葉如小桑五月開花七月結實根如雞鴨卵而長三五枚同一窠皮黑肉白一種赤斂花實功用皆同但表裏俱赤爾圖經昔人多謂白斂以能斂瘡得名此義終覺未妥夫癰腫瘡疽或有當斂而解者結氣不可斂而散也熱不可斂而除也帶下赤白不可斂而止也然則其根色白屬肺氣平屬金味苦象心赤蔓象血衇得無與肺朝百衇之義合否蓋尚未然若衆赤蔓共成一白實則合矣衆白根共生一赤蔓又可以為肺朝百衇乎四氣調神大論曰秋三月此為容平玩容平二字正合斂字之意蓋方經夏三月散發已極如人意得志滿諸事惟所欲為一旦遇尊嚴有道之人不自知其不能肆意遂志而心為之斂氣為之消容為之平此豈有道之人呵叱之束縛之而使之然耶今夫涼飈倏動暑意默消鳴蛩吟階白露被野向日盈溢之溝渠溽潤之土地又孰使之不漲又孰使之淨潔推其故則謂之諸物就斂然斂之為斂果可與聚斂厚斂同日語哉不得已以一字解之曰肅肅者清肅也清肅氣振則暑熱自消結聚自解故夫暑熱之氣壅於血則為癰腫疽瘡壅於氣則為結氣壅精明之光耀則為目赤壅神氣之游行則為驚癇壅營衛之周流則為溫瘧內與血壅則為陰中腫痛內有溼壅則為帶下赤白莫非凝血衇之流行而然是則清肅之白氣纍纍者不一貫通於赤蔓之中以消散其蘊隆開解其菀結此本經白斂主治之義也雖然壯年不有驚癇溫瘧乎男子不有陰腫淋瀝乎獨稱小兒女子何也夫惟嗜欲之失節思慮之過度營求之不遂皆能生火而閡血之流氣之行小兒則無是也衝任之不咸而氣逆裏急內結七疝婦人則無是也夫然則知循經而阻之熱與氣血間熱臟腑間熱腸胃間熱骨節間熱肉腠間熱皮膚間熱皆有異矣金匱薯蕷丸類萃補益以為君復類萃開結消導以為臣虛勞諸不足之治古之人固如是也獨風氣百疾桂枝以行皮腠大豆黃卷以行肌肉防風以行筋骨柴胡以行腸胃惟結於血衇間者不能不用白斂也任為最輕職為最下故其分數殿一方之末大㦸春生紅芽漸長叢高莖直中空葉長狹如柳折之有白汁三四月開黃紫花團圓似杏花及蕪荑花根似細苦參皮黃肉黃白有紫色者浸於水中水色青緑參蜀本圖經綱目十二經皆屬於五臟大𦺩芽紅莖中汁白花黃紫根皮或黃或紫漬水則青具五行之色味苦氣寒功專降泄而合德於水是以十二經皆有水至腹滿急痛而成積聚者能治之其莖中空惟其中空斯能外達是以中風在表難泄而至皮膚疼痛者亦能治之水滿則上溢風急則上冒故為吐逆水行風息吐逆之根已拔是以亦能治之澤漆一名貓兒眼睛草一名緑葉緑花草一名五鳳草江湖原澤平陸多有之春生苗一科分枝成叢柔莖如馬齒莧緑葉如苜蓿葉葉圓而黃緑頗似貓睛故名貓兒眼莖頭凡五葉中分中抽小枝五莖每枝開細花青緑色復有小葉承之齊整如一故名五鳳草緑葉緑花草搯莖有白汁黏人其根白色有鞕骨方家用治水蠱腳氣有效尤與神農本經文合自別録以莖有白汁誤以為大㦸苗故諸家襲之爾綱目凡物之行水者必能傷陰養陰者未必能行水何則水陰屬也氣不薰身充膚澤毛泄澤骨節屈伸而化為水則既已傷矣若又使往而不返能無倍其傷乎養陰者能使陰滋不能使陰若霧露之溉使陰滋者適足助水之瀾決非濬水之源以導其流能變懷山襄陵為膏壤埴墳者也若既行水而又妙能使陰氣不至不足者其惟澤漆乎何以言之夫腎主五液入心為汗入肺為涕入肝為淚入脾為涎自入為唾四十九難不似澤漆之白汁貫莖徹下徹上一本在下五歧在上歧端各生燦爛之花乎腎者主受五臟六腑之精而藏之故五臟盛乃能瀉上古天真論不似澤漆之五歧原出一莖收花成實已後則精氣原歸於本乎惟其能使方為大腹水氣四肢面目浮腫之水仍歸於分布五液之腎使腎既平均方瀉其有餘則水消之後又豈致陰氣不足耶夫然則凡病水者胡不皆用此免事後之周章乃古人不常用何哉蓋腎家之水與火同居故惟與火同病之水澤漆能化之能行之否則不能矣何謂與火同病則皮膚熱是也水病者不皆皮膚熱惟皮膚熱之水病則澤漆所專治矣然則大腹水氣四肢面目浮腫且皮膚熱之病婦人亦應有之條中特提丈夫者何夫丈夫之腎以氣為權衡婦人之腎以血為權衡澤漆者能化氣不能化血倘婦人病此而用澤漆水氣既回於腎腎家或值血實或值血虛實則水與血混虛則水入血中雖兩者竝仍可治然至水血攸分恐腎氣不能無不足之患也金匱要略曰咳而衇沉者澤漆湯主之夫但曰咳而衇沉似未足盡病之情狀何以見定當用澤漆湯按此亦發凡起例處也咳之為病木與水氣相連故大青龍湯小青龍湯越婢湯射干麻黃湯均防咳之能為水而水仍有陰陽內外之分陽且外者不外如龍之興雲致雨以汗而解陰且內者水徵雖見咳究未除終不可忘在上之病源但顧在下之水氣故厚朴麻黃湯治咳而衇浮仍是大小青龍加減若衇沉者終不得與五苓十棗同科澤漆湯用澤漆為君使水氣還歸於腎先煎久煎使其力緩厚然後以和陽化飲復入其間當歸者歸當散者散不似治水亦不似治咳咳無不止水亦無不行所謂衇得諸沉當責有水者也誠使水猖於咳原不能不治水若咳甚於水亦焉可不專力治咳故曰咳而衇浮者厚朴麻黃湯主之咳而衇沉者澤漆湯主之似乎泛指之詞實欲治病者得風便轉使不滯於當前而能以證參衇相與為推移者矣學者於此等處非特不容忽且尤不可泥歷考澤漆治水非不暫與防己大黃葶藶甘遂輩相合成方而決壅瀉實然終其與人參白朮茯苓桂心薏苡等治因虛成水者居多如千金與鯉魚人參甘草生薑赤小豆茯苓麥虋冬同用治或從消渴或從黃疸致內虛不足營衛不通血氣不化氣實皮膚中遍身洪腫四肢無堪喘息不安腹中嚮嚮脹滿眼不得視崔氏與白朮生薑橘皮桑根白皮元參郁李仁杏仁同用治水腫盛滿氣急喘咳小便澀如血古今録驗與鯉魚人參甘草茯苓麥虋冬同用治水在五臟令人咳喘上氣腹大嚮嚮兩足腫目下臥蠶胸滿隱痛吸吸寒熱小便數少甚至古今録驗與鯉魚人參甘草茯苓澤藛杏仁同用治緣三焦決漏精液不通水氣都行致通身手足面目腫食飲減少且云年八十病大困者服此亦差可見澤漆所治之大腹水氣四肢面目浮腫必兼喘咳上氣小便不利者澤漆誠行水中返顧根本之劑哉蕘花苗似胡荽高二尺許莖無刺花細黃色六月收參唐本蜀本傷寒表不解心下有水氣乾嘔發熱而咳若微利者去麻黃加蕘花如雞子大熬令赤色注云下利者不可攻其表汗出必脹滿去麻黃惡發汗夫太陽與陽明合病下利者與葛根湯其中未嘗無麻黃不慮其脹滿何哉蓋葛根湯所治證其表但有風寒風寒者標在外本亦在外小青龍湯證則本雖風寒標已化水風寒雖仍在外水飲則已內連若徒發其外則在外之風寒才散內連之水氣必隨出於表於是水入經隧為脹滿不可與葛根湯同論也雖然治水之出於表者有防己有大㦸治水之為咳喘者有芫花此則用蕘花者何蓋防己主傷寒溫瘧熱氣此則未化為熱也大𦺩治風與水在皮膚疼痛此則不疼痛也芫花治因水咳者僅能下氣不能治利故主以蕘花然主治惟與芫花為近故後世或有以芫花代者焉於此見蕘花與芫花功用略同而芫花惟下氣行水蕘花兼破飲食積聚利水道差有別矣狼牙苗似蛇莓而厚大深緑色根黑若獸之牙蜀本牙者其形狼者其性狼腸直鳴則後竅皆沸是物能通中且專治陰中之疾其形似牙故以狼牙目之凡物生溼地者多燥狼牙出淮南冤句江東汙下處川谷性偏不燥善治因溼為病者則以其生氣鍾於溼中即能轉溼氣為生氣又味苦化溼氣寒勝溼熱故凡係邪氣熱氣所生之疥瘙惡瘍瘡痔咸賴之為治矣雖然邪熱所生之恙但去邪清熱無不可愈何為獨取狼牙蓋嘗以金匱要略參之知狼牙所治疥瘙惡瘍瘡痔之必由蟲也曰少陰衇滑而數陰中蝕瘡爛者以此洗之夫衇滑數而瘡爛自是溼熱為病但曰蝕則非蟲不能已陰中生瘡可以有蟲則疥瘙惡瘍瘡痔何者不可有蟲陰瘡中有蟲可以狼牙治則疥瘙惡瘍瘡痔有蟲何者不可以狼牙治耶然殺蟲之物亦多唯取狼牙必又有故蓋諸疾者非一殺蟲能了與其兼用清熱化溼殺蟲何如用一物三者竝擅其長之為愈乎且人之肌肉因溼熱而潰腐蟲即借人之潰腐以為生氣狼牙者固借溼熱之氣為生氣者也同氣相求以毒攻毒用藥之巧莫逾於是捨其便利而委曲繁復是求農黃之智不出此也特九痛丸雜狼牙於附子乾薑吳萸巴豆人參中治連年積冷流注心胸痛冷衝上氣及腹脹痛口不能言豈諸辛熱者必藉茲苦寒為之導乎不知所謂狼牙者正以其性似狼鳴則後竅皆沸也夫冷滯至口不能言則在中機針閉矣設但攻其積積去機針仍不能開又當用何法開之則何如用鳴則通通則鳴之物為善乎商陸春生苗高三四尺葉青如牛舌而長莖青赤至柔脆夏秋開花作朵根如蘿蔔而長赤花者赤根白花者白根赤者不可用八月採參蜀本圖經劉潛江云商陸春生苗夏秋開花八九月乃採其根本經用以主水腫疝瘕痹尉除癰腫豈非取其導陽入陰歸於陰中氣分以散結消腫耶即別録所謂療胸中邪氣水腫痿痹腹滿洪直疏五臟散水氣夫亦自胸而腹遂并見其由心肺而及肝腎方得謂之直疏夫水陰也腎納五臟之陰者也直疏五臟氣以歸腎令水氣散以腎能聚水生病則使水或留或行宜消宜散不為病者亦惟腎耳雖然檢古方書有治石水之檳榔散及治陽水之疏鑿飲子均用商陸豈不嫌其漫無別擇乎不知兩者之用商陸所謂急則治標之義皆取其導陽氣以化陰邪疏陰邪以導陽氣耳蓋陽水之本由於陰虛陽不能化而標病之甚者乃陰邪也陰水之本由於陽虛陰不能化而標病之甚者亦陰邪也同是陰邪為之標舍氣實能食之時不因其小大不利以取其水而救其標乃漫云治本逡巡畏縮緩不及事直待正氣盡化為水馴至不治則所謂羊已亡而計補牢果何益之有歟即其敷貼石癰堅硬不作膿者張文仲方商陸根搗擦燥則易取軟為度亦治溼漏諸癤腹中暴癥有物如石痛刺啼呼不治百日死千金方多取商陸根搗汁或蒸之以布藉腹上安藥勿覆久即易晝夜勿息痃癖如石在脅下堅硬聖惠方取生商陸根汁一升杏仁一兩浸去皮搗如泥以商陸汁絞杏泥火煎如餳每服棗許空腹熱酒服以利下惡物為度胥能散之就其能散成形之物於陰分則其疏五臟之氣而散陰結者固可不言喻矣即本經所謂治疝瘕痹及尉除癰腫者不又可於此見之耶異哉李瀕湖謂商陸沉降而陰其性下行專於治水與大𦺩甘遂異性同功也夫所貴於治本經者為能審名辨物知其各有所宜耳若商陸之功不過與大𦺩甘遂埒埒等也則用大𦺩甘遂已耳又何取於商陸哉夫大𦺩甘遂味苦商陸味辛苦者取其降辛者取其通降者能行逆折橫流之水通者能行壅淤停畜之水取義既殊功用遂別豈得以此況彼也仲景書中十棗湯用大𦺩甘遂大陷胸湯甘遂半夏湯大黃甘遂湯均用甘遂不用大𦺩則甘遂之與大𦺩固自有異矣獨於大病差後腰已下有水氣者牡蠣澤藛散中偏取商陸謂非商陸有異於大𦺩甘遂乎商陸不用赤花赤根獨有取於白花白根者蓋以其色之白恰配其味之辛以為攻堅破頑之用下病者上取上病者下取牡蠣澤藛散治腰以下水氣不行必先使商陸葶藶從肺及腎開其來源之壅而後牡蠣海藻之軟堅蜀漆澤藛之開泄方能得力用栝蔞根者恐行水之氣過駛有傷上焦之陰仍使之從脾吸陰還歸於上與常山之蛇擊其首則尾應擊其尾則首應者不殊也是故商陸之功在決壅導塞不在行水疏利明乎此則不與他行水之物同稱混指矣白頭翁正月生苗作叢狀似白薇而柔細稍長葉生莖端如杏葉上有細白毛而不滑澤近根處有白茸根紫色深如蔓菁其苗有風則靜無風則搖圖經溫瘧為病緣素問論證與金匱要略不同其旨遂歧而以為罕有之候殊不知素問與金匱要略本無所異素問是述其所以然金匱要略遂補其所當見正可謂若合符節者矣瘧論曰溫瘧者得之冬中於風藏於骨髓之中至春則陽氣大發邪氣不能自出因遇大暑腦髓爍肌肉消腠理發泄或有所用力邪氣與汗皆出故熱熱已則氣反入而寒金匱要略曰溫瘧者其衇如平身無寒但熱骨節疼煩時嘔白虎加桂枝湯主之夫冬中於風必隨陽氣之伏而入也陽氣發矣何以尚不能自出蓋惟應時而動故曰陽氣惟不肯應時而動故曰邪氣曰腦髓爍肌肉消腠理發泄明明所依者漸不足恃方浩然有去志然尚不去也遇大汗出乃始出焉始終只與陰糾連故汗出熱作汗收熱止其所謂寒者必不如寒瘧之寒栗鼓頷故曰身無寒但熱而邪依於陰既久遂相浹洽故衇如平若使衇不平原為汗出輒復熱衇躁疾之陰陽交非溫瘧矣骨節疼煩正以見邪之藏於骨髓嘔正與汗同亦陽隨陰出也故主以白虎加桂枝湯白虎湯固治汗後身大熱者也如此猶不可明溫瘧者病以時發汗出而熱乃作夏間常有之病也然則不與疸瘧無別乎夫疸瘧熱止則無寒今必稍有寒也疸瘧者無端而熱作此必汗出而始熱此其所以別矣白頭翁根色紫紫為赤黑相兼正與熱依於骨髓合而近根處有白毛毛為肺所主白又其色是使水中之火達於金從皮毛而解也故曰主溫瘧狂𬌺寒熱偏考字書竝無𬌺字玉篇有𬌺字注云犬張耳貌後漢書陳忠傳狂易殺人注狂易狂而易性也當是狂易之誤苦本主降性溫則主發故也他如熱依於血為癥瘕依於飲為積聚依於痰為癭氣依於腸胃中脂液而腹痛者竝能主之曰逐血者承癥瘕而言也不曰逐飲痰脂液者色紫之物原能入血不能入飲痰脂液且附飲痰脂液之熱既去則病自可除不必更逐也他如因血出而熱隨出者為金瘡為鼻衄因津液下溜而熱隨出者為毒利亦竝能主之故仲景於厥陰熱利産後下利皆用之正其旨耳別録止載蘆根而不及葦莖大率生水中者多與水為事其根能啓水精上滋治消渴客熱則其莖必係導痰熱下流而治肺癰矣凡有節之物能不為津液隔閡者於津液之隔閡而生患害尤能使之通行此千金所以有葦莖湯歟連翹有兩種大翹生下溼地葉狹長如水蘇花黃子似樁實之未開者作房翹出衆草小翹生岡原上葉花實皆似大翹而小唐本廬子繇曰本經所列連翹主治合陰陽內外而言誠開闔之樞鍵也故主熱結在中為寒熱鼠瘻瘰癧其本在臟其末在頸腋間也若蠱毒則但沉於臟癭瘤癰腫則但浮於衇咸屬寒熱為病因熱結為形證者也其功力與夏枯草相等但夏枯草偏於從本秉寒水化令故上徹顛頂下及趺踵連翹偏於從末秉容平氣味故外彌膚腠內遍五中至解邪熱結於心理則一矣連翹赤莖獨上秋來結萼莖端花後分瓣作房中含黑子乾則振之皆落而不著莖其房剖之即解片片相比氣甚清馥其形屬火其氣屬金當夫溽暑之候諸氣懈弛血衇僨湧懈弛者多顛躓僨湧者易壅淤僻仄徑折最善顛躓之所也故鼠瘻瘰癧氣多於血之候恆生於頸腋平原曠蕩尤善壅淤之地也故癰腫惡瘡血多於氣之候恆生於背腹及夫結為癭漫為瘤又何莫非氣遭炎𭶟而顛躓壅淤逮至涼飈倏動萬象清明庶類遂剝落紛紜頓然改舊故草雕於上葉辭於樹水涸於瀆與連翹之治寒熱鬱結何以異哉雖然本經以寒熱起以熱結終而臚列諸證其間當亦必有意義蓋鼠瘻瘰癧無偏寒偏熱之證癰腫惡瘡癭瘤則有但因寒結者故宜以寒熱鼠瘻瘰癧為句以癰腫惡瘡癭瘤熱結為句而用連翹斯無誤矣傷寒論傷寒瘀熱在裏身必發黃麻黃連軺赤小豆湯主之因瘀熱在裏句適與連翹功用不異郭景純爾雅注一名連苕苕軺聲同字異耳而今本傷寒論注曰連軺即連翹根遂以本經有名未用翹根當之陶隱居云方藥不用人無識者故唐本草去之豈仲景書有此六朝人皆不及見至王好古忽見之耶噫亦必無之事矣蒴藋或謂即是本經陸英或云非是瀕湖氏亦不能主持其說今疏本經陸英如右而附以別録蒴藋條既不能的指其物世又竝無用者姑從闕疑芫花宿根舊枝生莖紫正月二月開花有紫赤黃碧白數種作穗似紫荊花實落後方生葉色青厚則黑根皮黃似桑根入土三五寸有白似榆根者收釆當及花時葉生花落即不堪用參蜀本圖經張隱庵曰草木根荄之在下者性欲上行花實之在上者性復下降此物理之自然也芫花氣味辛溫花開赤白稟金火之氣化主行心肺之氣下降故治咳逆上氣喉鳴而喘以及咽腫而短氣稟火氣故治蠱毒鬼瘧稟金氣故治疝瘕癰腫辛溫有毒故殺蟲魚愚謂所注甚當惟以開花赤白為稟金火之氣猶為牽合以花不止赤白兩色也夫開花成實者收藏之氣也生枝發葉者生長之氣也凡物莫不既生長而後收藏芫花獨花實在前枝葉在後偏具收藏於散發之先是謂以斂降為體開解為用故確與肺合德主肺病最多肺在極上所主皮毛又在極外乃偏屬金而主收藏咳逆上氣喉鳴喘咽腫短氣皆肺病也其發葉生枝反退居於斂降之後而當火令之始又可不謂得火氣而榮準之於此或庶幾矣仲景於飲之劇者類萃甘遂大𦺩芫花為十棗湯解之者咸謂病既急迫用藥不嫌其峻是已然終無以三味之殊體帖病情而為之說者夫謂不嫌峻則驅飲之物豈止三味若謂以其功用相近則一味足矣何必三味愚因此細參而後知三味之蠲逐飲邪用各不用其與病情甚為帖切也夫甘遂用根且須形類連珠體實重者是其性為著裏再核之以甘遂半夏湯治雖利心下續堅滿不可知其為飲在裏縱不利而不減者用乎大𦺩用根皮其莖中空是其性為著表再參之以治一身十二經之水及中風皮膚疼痛吐逆又不可知其為飲在表而兼吐逆者用乎芫花用花且其物先花後葉是其性為著上再其主治為咳逆上氣喉鳴喘咽腫短氣更不可知其為飲橫於上者用乎曰太陽中風下利嘔逆表解者乃可攻之其人漐漐汗出發作有時頭痛心下痞硬滿引脅下痛乾嘔短氣汗出不惡寒者十棗湯主之夫上為吐下為利外為汗出內仍心下痞硬滿引脅下痛自非甘遂大𦺩芫花何以使淨盡無餘而後知仲景之用藥決非漫無分別也下品木六味獸三味蟲魚六味果三味穀一味巴豆木高一二丈葉如櫻桃而厚大初生青色久漸黃赤季冬漸雕仲春漸發仲夏舊葉落盡新葉齊生即開花成穗其色微黃五六月結實作房七八月成熟漸漸自落一房二瓣一瓣一子或三子子仍有殼以殼上有縱紋隱起如線一道至兩三道者為金線巴豆最為上等圖經巴豆大黃均峻逐委積之劑徐之才則謂巴豆畏大黃何也夫本經稱述兩物之功能在大黃曰蕩滌腸胃推陳致新在巴豆曰蕩練五臟六腑開通閉塞已明明一則許以如水濯物一則許以如火爓物矣釋名釋帛練爛也煮使委爛也火既見水焉得而不畏然則三物備急丸竝用之何也是緣沉寒錮熱膠固臟腑空隙處猶物之垢汙牢著非徒濯徒爓所能潔必水火合而烹焉舍是更無他法可使淨耳雖然本經稱之仲景用之其義極精極審不得草草讀過也何者夫曰練則非堅韌不克任矣曰滌則非浮泛不能去矣曰五臟六腑見其所入之遍有一處不任其練者即不可施曰腸胃見其止能至此而不及乎他曰推陳致新則滓穢去而清光來去其陳正以保其新也曰開通閉塞則僅能鑿孔使通其因通而出者不能別擇可否也故在傷寒論斤斤分別於但下與丸下之別耳所以然者大黃貫火用於土中僅關取義已靈迅如是況巴豆氣熱味辛誠如烈火性峻十倍於大黃且隱起金線縱繞其殼則不特直行下泄橫行之勢有更猛者張隱庵曰凡服巴豆即從胸脅大熱達於四肢出於皮毛然後復從腸胃而出惟其橫行故首主傷寒溫瘧寒熱惟其直行故繼破癥瘕結聚堅積留飲痰癖大腹水脹無一非沉錮深邃難伐之患蓋即其代葉之由可以深思而得之者夫至季冬始漸雕然猶不落也及仲春新葉發故葉才去然猶不盡落也是其陽剛之至不畏寒沍已可概見至四月全脫開花結實即於是時其為乘陽氣而暴烈迅發有莫禦之勢無疑也逮至八月始熟則其性向金水又斷斷乎可識矣是故仲景用之諦審極詳在傷寒治寒實結胸則佐以氣力單薄之𦮷母桔梗導其機而緩其勢又必以熱粥冷粥劑量其間使之當行則行當止則止在卒暴中惡則既同大黃以為牽制復用乾薑守住其脾不使傾笥倒篋盡出無餘外臺因之如九痛丸之竝以乾薑附子人參走馬湯之合以杏仁亦一寒一熱一補一輕正得仲景家法故均得附入金匱要略中編書採方者亦可謂詳慎之至矣椒樹高三四尺似茱萸而小有針刺葉堅而滑四月結子無花但生枝葉間顆如小豆而圓皮紫赤色八月採遍處皆有惟蜀中生者肉厚皮皺其仁光黑如人之瞳仁故謂之椒目參圖經綱目金凝重而不動火炎上而不降其常性也試熾炭於爐投金於火久則金鎔就下若水流矣火亦隨之而流金火之相鍛有如是哉椒不花而結紅實於四月是其直稟陽剛火德而飽吸溼土燥金之氣至內膜白子光黑乃為成就是其以陽熯溼以火鍊金昭然可見且其子光黑渾圓旋轉如珠則又象水斯所以為從在上之肺挾火直抵於腎無惑也然則凡火不歸下皆可以椒引之使歸歟是又非矣夫紅皮之內白膜之表不有黃肉在其間乎請觀分金之爐必有土為之範量其高下之差分為數道以就金銀銅鐵之所貯重者歸於極下輕者以次而上設無此範則五金就窪仍雜一處金不能極其所至火又何能自往耶以是知椒之引火下歸必藉土為之範也土脾胃之氣也胃主降胃病則吐逆脾主升脾病則泄利泄利者火不在下吐逆者火反上逆能使火不上逆而下歸是金之挾火下流以就土之範也是椒之能事也由是言之則中宮有邪成咳逆者治以椒使肺金得降氣火不升痰涎開拓固猶拔刺雪汙矣下文則多有難明者曰溫中逐骨節皮膚死肌骨節間得有死肌耶不知此當連下句讀言能逐骨節間寒溼痹痛亦能逐皮膚間有死肌者之寒溼痹痛也夫風氣盛者為行痹寒氣勝者為痛痹溼氣勝者為著痹痹而偏重於骨節或在皮膚且有死肌是之謂著而由於溼又皆痛是由於寒故曰逐骨節皮膚死肌寒溼痹痛明其無與於風也椒本行中道以能溫中故其量得及於骨節皮膚然於骨節皮膚間祇能使凝重者行不能使流動者行惟痹既流動則必中氣有權能鼓舞邪氣俾不著而為患也若更溫其中是徒以損陰耗氣而無當矣然既云寒與溼矣其間豈有火耶椒固善治火者也夫惟痛則固有火矣蓋寒與溼均火之所畏況既痹著於物火至此而為之阻則兩相搏而痛所謂諸痛皆屬火有寒方痛者也雖然逐字之上首以溫中則中不受溫者縱有痛痹著痹不可用矣痛之末殿以下氣則痛痹著痹之不必下氣者不可用矣是所當意會者也病者靜而時煩須臾復止得食而嘔又煩烏梅丸證痛嘔不能飲食腹中寒上衝皮起出見有頭足上下痛不可觸近大建中湯證非動病耶又何以用椒也夫靜固寒也時煩得食即嘔非火耶痛固寒也有頭足能上下非火耶二者均嘔均不能飲食則寒與火交戰於中逆而上行為不受土之範矣椒固就火以致金使火因金以歸下者也火歸則土安寒無與軋遂自就戢而旋退可不謂之返動為靜耶然則椒固下降之物烏梅丸何以能主久利也夫利豈止一端硝與大黃皆能治之椒之治利則非以其降蓋火能生土土能防水致火以熯土使水不就窪下沁而入焉以成其生化謂非治利之善法可乎之二證者皆嘔核之以厥陰心中疼熱則又皆痛是椒之治必痛嘔相兼始得用矣乃烏頭赤石脂丸證有痛而無嘔王不留行散白朮散則痛嘔皆無是又何說哉殊不知妊娠於嘔為常候以衝衇不降致胃氣逆上也屢逆豈能不痛金瘡詎有不痛者耶唯烏頭赤石脂丸既有附子則不應有嘔而方中烏附乾薑蜀椒外又加以赤石脂則焉知其無利核之以烏梅丸之除久利則胸痛而利者亦椒之所主歟即王不留行散中非特蜀椒并有乾薑厚朴則不但痛而胸滿且必有嘔又均有黃芩芍藥豈得謂必無利耶是在明者以意消息之耳己椒藶黃丸既用防己葶藶大黃雖無椒目腸中之水亦不能不去何俟有此夫既云有水氣則不得口舌乾燥有水氣又口舌乾燥且腹滿明明氣與熱阻於中津隨水溜於下也熱者陽邪水者陰類陰承於陽則陽必上出是口舌乾燥者其初見之微徵過此以往在上之熱方將熾而未肯衰昭昭可見逐其留中之熱大黃固立能裁決除自中以上之熱自中以下之水葶藶防己亦宜所不辭特前此上引之熱不知盡熱邪耶抑亦有身中陽氣雜於其間也腸間有水而口舌乾燥則為有津液雜於其間設但逞一下之快不計正氣之纍及則在中之熱在下之水雖去身中之陽與陰亦且不克自支椒者自火而歸於水其目之漆黑光澤而渾圓則水象之確著者也故能使從水中泛出之火原歸水中於以薰蒸水中所雜之津仍朝口舌蜜丸僅與一丸先食而服焉用藥已急中有緩服法尤緩中之緩正慮剋削人元氣耳即方後口中有津液渴者加芒硝是在土之津不下溜而攻下可益峻矣於此猶不可悟椒目之用耶或曰昔之人皆謂椒為肝家物而子獨以色紅味辛謂為得金火之用似絶無與於肝者傷寒論祇烏梅丸中用椒實為治厥陰之方其說猶可通耶豫曰是說也得五行之一端而未及乎全體也今夫彌大地之用皆在土而土之翕受敷施由於日之發斂然不得金以耕則土自土日自日猶不能生物是成土之用在金與火土既耕矣物既生矣而不得日則雖有水而物不受其滋土之所生者無他惟木耳是見土之用惟木與水故夫金火者所以致土之翕受木水者所以致土之敷施試觀本經所主諸證土氣不守中則邪氣襲而咳逆生土氣不運外則寒溼停而胃痛作是厥陰病之氣上撞心心中疼熱煩躁吐蛔下利何一事非土乏金火之助遂不能布水氣於木木乃燥裂強梗耶由是而推可以知別録之所主凡六腑寒冷心腹留飲宿食腸澼下利水腫黃疸莫非土氣之不守中凡傷寒溫瘧大風汗不出風邪瘕結莫非土氣之不外運但使火隨金金就土土得盡當然之用則又何患之不除特治泄精及女子字乳餘疾兩事似有難明者然核千金之治虛勞寒澼飲在脅下決決有聲飲已如一邊下有頭足衝皮起引兩乳內痛裏急善夢失精氣短目䀮䀮惚惚多忘大建中湯治五勞七傷百病補虛益精大通丸治虛勞不起囊下癢汗出小便淋瀝莖中數痛溺時赤黃甚者失精劇苦溺血目視䀮䀮見風淚出莖中冷精氣衰兩膝腫不能久立起則目眩補虛方卷十九及治産後大寒冷所為心痛蜀椒湯治産後餘疾寒下凍膿裹急胸脅滿痛咳嗽嘔血寒熱小便赤黃大便不利澤蘭湯治産後下利藍青圓治産後虛冷下利赤石脂圓治陰下挺出方卷三總不過火不燠土土不防水水或泛濫妄行或就窪停淤之候則其用椒之意亦不能大遠於前所云云矣皂樹高大葉如槐瘦長而尖枝間多刺夏開細黃花結實有多種以長且肥厚多脂而黏者為勝其樹多刺難上採時以篾箍其樹一夜莢悉落有不結實者鑿樹為孔入生鐵三五斤泥封之即結莢以鐵槌樹即自損鐵碾碾之久則成孔鐵鍋爨之多爆片落綱目盧芷園曰皂莢喜鐵得鐵即有所生鐵器遇之而壞有吸鐵精華之能然皂為北方之色鐵為五金之水味辛且鹹子母相生默相感召如此如肺有寒邪黑痰膠固不可拔而為喘咳膺胸咽喉之疾者宜之凡嚏則肺氣通於鼻皂莢一嗅輒嚏若磁之吸鐵其亦肺邪之出路歟劉潛江云皂有不結實者鑿孔貫以生鐵便能結莢是此木之生化原在金也夫風木變眚皆由於不得化風木屬陽陽極於上不得陰以化則陰從之此上竅壅塞之所由若陽實而陰不化斯下竅壅塞之所由皆風木之化窮也惟皂莢得金之辛歸水之鹹是木得金化以趨水乃孕育而無窮所謂有化乃有生他風劑之以驅散為功者固萬萬不侔也豫謂皂莢之治始終只在風閉風閉之因有二端一者外閉毛竅如風痹死肌邪氣一者內壅九竅如風頭淚出是已故劉潛江但釋風所以閉竅之義全體自明第陽不化而陰從陽實而陰不化兩語尚宜辨析以壅上竅者多挾痰涎壅下竅者多係燥化故也夫生人之陰本上行陽本下降況陽冒於上不化陰而化火則陰必上救上救之陰不能濟陽徒被陽爍變為痰涎益生壅阻以清明七竅本屬坎離之化故也陽下沉而為實縱使陰亦下溜惟被其蒸逼倏而遂乾以腸胃本皆陽明燥化故也雖然是皆陽氣耳又何以指之為風夫惟上竅本清陽之出入下竅本濁陰之所泄使但為陽氣又何以生壅阻且既上至心肺未有不從陰化者苟不從陰化則非風而何其陰之溜下至於腎亦未有不從陽化者苟不從陽化亦只是風而已況毛竅之間得津則通不得津則痹痹而且有死肌斯津之不至明矣亦非風之搧何以得至於此故本經他處於痹有謂之溼痹者有謂之風溼痹者有謂之寒溼痹者有謂之風寒溼痹者惟此則但曰風痹而仲景之用皂莢則惟皂莢丸一方所治乃咳逆上氣時時唾濁但竝不得眠亦可見其氣自上而痰自隨氣不從陰化痰不從陽化矣更徵以千金桂枝去芍藥加皂莢湯方治肺痿吐涎沫不必開陰以布陽卻宜從金以化木又可見其陰與陽之相從徒相軋而不相入矣用是物者尚其識之訶梨勒株似木梡花白實如梔子青黃色皮肉相著七月八月實熟時採六稜黑色肉厚者良圖經凡草木果實既已暴乾猶皮肉相著者獨訶梨勒為最惟其皮肉相著方得似脾與肺緊相帖也脾緊承於肺而上輸斯胸中無痰涎冷氣之停肺緊接於脾而下降斯腹中無宿滯脹滿之阻況溫則能升苦則能降苦則主泄溫則能開故為宿物痰涎上壅則喘下壅則利之妙劑如金匱為散治氣利千金為丸治氣滿閉塞不能食喘息可徵也夫下利氣者當利其小便蓋氣之所阻即痰涎之所留而痰涎尤為柔滑之物能阻氣不能錮氣故氣有時得自泄而終不能通此所為氣利者也非小便利則痰涎不能行氣終難暢故當利其小便然竟不出利小便方乃緊接以訶梨勒散訶梨勒豈利小便者哉不知惟脾緊承於肺肺緊接於脾則小便之源如弓矢之已彀滿如徑弩之已發機其勢有不能不利者且服散必以粥粥即最利小便之物也雖然此為痰留於上氣阻於下者言耳若夫痰留於下氣阻於上則其上為喘息與下為氣利一也其服丸以食者病人方不能食反以食為治何哉蓋大小腸雖皆傳化之腑然泌其清而入膀胱其權主於脾別其濁而入大腸其權司於胃然皆總統於肺是食之自入而出由於胃飲之自入而出由於脾脾與胃同宮相偶皆聽命於肺訶梨勒之由脾而肺即可知亦由胃而肺也不然下文云不忌得利夫食豈能致利訶梨勒亦非致利者其以強令食為治或者不能無利即利正是痰涎已順氣得通之候也故曰即止梓皮疏理色白其木細膩堅糯糯同糯為百木之長以木莫良於梓也生子著角中其角細長如箸長且近尺冬後葉落角猶在樹參詩義疏爾雅翼梓內堅結而外疏理味苦氣寒其色白白無色也故主有熱有色而當解外之證傷寒論傷寒瘀熱在裏身體發黃麻黃連軺赤小豆湯中用之取其助解表變黃色為無色也肘後傷寒及時氣溫病頭痛壯熱衇大生梓木白皮湯取其解散變赤色為無色也方中竝不言赤色然得病一日即壯熱衇大焉有色不赤者哉五臟皆滿惟肺差空六腑皆空惟膽獨滿五臟之精均相灌輸六腑之物均相傳化惟膽有汁澄之不清撓之不濁故為木中之水所以資木使生者惟其為水木相連斯上可以泄火氣之昌熾下可以定水氣之憑陵水火相濟之源實具於此矣乃人有五志一事感觸五者殽亂賴膽以決之是故熱則不眠寒則減食壯則橫溢怯則畏葸豬獨不然自生至壯眠食已外更無他營可見其膽之清靜非尋常可比傷寒熱渴者土中之火昌獗也厥逆無衇乾嘔煩者水見潰決與火相背也惟其火達於水而水流更駛惟其水不濟火而火焰批根呼吸之際危亡立臻苟不因物付物取極近極親之豬膽汁鋭而入焉則孤陽在上能與薑附抗而陰方奔迫不隨人尿改出前陰矣是何也蓋木應春為生生之所自始卻浥水上行故能苦寒而不助泄水之上正可濟火之違故能除嘔止煩其回陽復衇固無藉於茲而扶危定傾端有資於反佐也至陽明津液燥極取是以通大便則但用其苦寒滑潤無甚深妙義矣曹青巖問陰吹證所謂穀氣之實者得無脾胃之虛歟豫謂不然脾虛則穀入不運而泄瀉胃虛則嘔吐而穀不得入又何得為穀氣之實曰然則當作何解其用豬膏髮煎又何義曰臟氣法時論云五穀為養五果為助五畜為益五菜為充在強健藜藿輩但得穀氣足恃脾胃固已旺矣稍近膏粱者其穀氣必得助而後流動得益而後滑澤得充而後傳化徒恃穀氣斯有壅遏之弊矣論語謂肉雖多不使勝食氣孟子則謂七十非肉不飽正為食氣肉味不可偏廢也豫嘗見有先樂後苦年高溏泄者得肉食則便反堅有常豐暫儉者偶蔬食則雖飽不適有本苦偶腴者一得肉食泄瀉便作可見肉食與穀氣必使劑量得中方可無病故五常政大論謂穀肉果菜當食養盡之倘若過之則傷其正況六淫之迫於外七情之擾於中其間苟有調處不當焉能不變生患害耶陰吹而正喧者穀氣厚而肉食不足以滑澤之也然何以獨病婦人而不兼及男子蓋男子近前陰處窄而滿縱施泄已後亦不容穀氣流入女子近前陰處寬而空若經後産後穀氣之實者襲而據焉繼乎此者遂源源而至以是小便為之不利故其下注者乃如失氣竝有聲而喧焉豬膏肉之至肥至澤者也以之調和穀氣即以潤大便是直探其源病原涉及血分且小便不利佐亂髮以利小便且使血之被傷者仍自還神化是兼徹其流義之明暸可識者也試觀其治諸黃諸黃中有穀疸其源正與此同惟其不大便是以得為陽明病惟其非火迫津枯是以衇遲微煩頭眩者氣猶上衝也正與陰吹正喧對陰吹正喧是以不為黃微煩頭眩是以尚未為黃小便難則致穀疸致陰吹之本也兩者吻合如此又何疑榖氣之實豬膏之用哉脂在腰曰肪文選與鍾大理書注膏即脂也以有角無角異其稱耳家語執轡注脂羊屬膏豚屬肪膏解蝕肉蟲之毒乃以肉之極厚者餌之使不蝕人也至金匱要略陰吹證豬膏髮煎導之必有誤蓋證甚奇特方極和平服之乃得有濟導之則其力又烏能及耶豬膚緣本草不載說遂多歧有謂宜用燖豬時所起皮外毛根之薄膚方中行駁之者謂其簽劣無力且與熬香之說不符宜用其外皮去內層之肥白喻嘉言或謂膚周於身水以濟火能內通外達張隱庵張令韶或謂其性寒故能退熱散邪方中行或謂能潤燥周禹載或謂能滋土程郊倩或謂其除客熱成無己尤在涇或謂豬之津液在病能治上焦虛浮之火柯韻伯甚有謂其入腎滋陰透表散邪者魏念庭吁亦甚矣清利肥甘之物滋潤或有之通利或有之謂退熱散邪則斷不能通者也豫嘗讀少陰用大承氣三證而有會心焉蓋下利咽痛胸滿心煩即急下三證之涉虛者何以言之夫咽乾即咽痛也第虛者刻入膚內實者燔熾膚外耳下利即自利清水也所結既堅則為純青結之未堅止言其利耳心下痛即心煩也夫火侵爍乃盛為痛虛火游衍則僅為煩耳腹脹即胸滿也不大便故氣盛於下既下利則氣盛於上耳少陰邪結太盛纍及陽明陽明既堅則竟治陽明陽明清斯少陰之邪亦泄正餒邪微雖亦纍及陽明陽明所結不堅則當一面撤少陰之火一面逐陽明之實如豬膚在少陰則清入膚內燥在陽明則調穀氣之實合白蜜在少陰則除心腹之邪在陽明則增腸胃之液其用白粉正猶調胃承氣之用甘草原欲豬膚調穀氣之實而推送之遂以穀氣之精者令先與之相得使協成厥功也淺而視之莫不謂邪結烏得為少陰下利終未可為陽明而孰知證固有連類及之者故衇浮而遲表熱裏寒下利圊穀及食穀欲嘔均得隸之陽明少陰病有瓜蒂散證有豬苓湯證況虛火游衍之的係少陰穀氣不流之確屬陽明耶然則此之下利緣何證其涉及陽明夫少陰下利兼煩者有之兼咽痛者有之未有兼胸滿者以胸滿故知其涉陽明也且少陰通篇無滿字惟豬膚及大承氣湯證有之尚不可為據歟以是觀之則豬膚之用仍不外乎豬膚特較之豬膏則輕薄而及外耳說文隤下隊也玉篇㿉下腫也釋名陰腫曰隤氣下隤也又曰疝亦言詵也詵詵引少腹急痛也廣雅㿉陰病也巢氏云㿉者陰核氣結腫大也差㿉者陰核偏腫大也皆緣氣擊於下所致氣偏乘虛而行故偏結腫也愚按疝與㿉本不同類疝繫於心㿉繫於肝故金匱寒疝列之腹滿宿食間狐疝列之趺蹶手指臂腫轉筋蛔蟲間聖濟總録曰陰氣積於內復為寒氣所加使營衛不調血氣虛弱故風冷入腹成寒疝邪氣聚於陰陰器腫大則成陰疝一名頽疝又曰小兒哺食過度脾胃尚弱不能消磨則水穀之精減損無以榮其氣血致肌肉消瘠腹大頸小黃瘦謂之丁奚若兼發熱者謂之哺露說莫詳矣皆不用蜘蛛則宜體會全文以證之夫別録曰主大人小兒㿉統詞也故仲景則曰陰狐疝氣偏有大小是與寒疝有間矣其要尤在時上時下其用蜘蛛正為其時上時下也曰小兒大腹丁奚分詞也明大人無此證也然其所以用蜘蛛則為三歲不能行故何則夫瘦削骨立頸小腹大正似蜘蛛之形蜘蛛之行正賴其大腹其腹中本無絲行輒絲隨之至欲所詣處仍能收絲於腹使相引而直架有遂循絲以往來上下是其騰踔盤空非腹中之絲不可較之用足蓋誠十百其功丸服蜘蛛必泄泄則能行此所以治丁奚不能行矣若治陰狐疝氣則以其晝隱夜現時時上下為桂枝嚮導且其營構必自左右旋右為上左為下則欲其上而不下也結網必自外而內得食則自內而外以之監桂枝是欲其外而不內也要之疝與㿉相較則疝屬寒㿉屬氣是蜘蛛之能宣氣也丁奚與脹相較則脹為實中之虛丁奚為虛中之實是蜘蛛之能泄虛中實也而其所入則必在極下則又兩者同之矣在山野者名山蜞在草中者名草蛭在泥水中者名水蛭大者謂之馬蜞今名馬蟥入藥取在水中之小者崇原徐洄溪曰凡人身瘀血方阻尚有生氣者易治阻之久則無生氣而難治蓋血既離經與正氣全不相屬投之輕藥則拒而不納藥過峻又能傷未散之血故治之極難水蛭最喜食人之血而性又遲緩善入遲則生血不傷善入則堅積易破借其力以攻積久之滯自有利無害也後人以虻蟲水蛭仲景每兼用之遂以謂攻堅破瘀莫過二味試問攻堅破瘀者甚多獨抵當湯抵當丸大黃䗪蟲丸何以用此二味又何以竝聯用此二味至桃核承氣湯鱉甲煎丸下瘀血湯亦未嘗不欲其攻堅破瘀又何以二味俱不用成氏所見進乎是矣云鹹勝血血畜於下勝血者必以鹹為主故以水蛭為君苦走血血結不行破血者必以苦為助故以虻蟲為臣此二味聯用之故也而未及所以用此之故張隱庵張令韶之見更進乎是矣云虻蟲水蛭一飛一潛皆吮血之蟲也在上之熱隨經而入飛者抵之在下之血為熱所瘀潛者當之此二味所以竝用之故也而未及所以不用此之故夫虻蟲固治血積堅痞癥瘕寒熱似與瘧久不愈相當矣而不用者則以鱉甲煎丸之瘕結於脅下今抵當湯抵當丸大黃䗪蟲丸曰少腹硬滿曰少腹鞕曰腹滿則可見虻蟲之所主在腹與少腹不在脅下也然則腹中有瘀血著臍下宜用虻蟲之至矣乃下瘀血湯方後注云當新血下如豚肝是其瘀尚新則虻蟲止治腹中臍下已凝之瘀不能治新瘀矣水蛭者本經固言其能利水道抵當湯丸證水道本利故假此使血隨水下桃仁承氣湯證不言小便自利并不言腹滿是非特水蛭不得用虻蟲亦不得用矣合而推之虻蟲之性飛揚故治血結於下而病在上者水蛭之性下趨故治血結於上欲下達而不能其逐瘀破積兩者相同而一為搜剔之劑一為滑利之品惟其滑利故能墮胎惟其搜剔故治喉痹結塞耳蜣螂頭扁鼻高目深背有甲黑而光腹翼下有小黃子附母而行晝懦夜猛見燈光則飛觸物即墜以土包糞轉而成丸雄曳雌推置於坎中覆之而去數日有小蜣螂出蓋孚乳於中也參拾遺蜀本綱目蜣螂喜撲火且善取糞為丸包以土推曳而埋之坎中得毋以是二者遂謂能息腸胃之火去是宿滯而已大人癲疾狂易耶則於小兒驚癇瘛瘲腹脹寒熱又當作何解諸說者謂痓與癇不甚相遠痓之胸滿口噤臥不著席腳攣急齘齒者可大承氣湯與驚癇瘛瘲腹脹寒熱亦不甚相遠也以病患有久暫之殊正氣有盛衰之異故有承氣蜣螂之別爾然則承氣蜣螂竟可混稱竝視耶不知承氣之汗出小便自利轉失氣皆用蜣螂者所無別録所云蜣螂治手足端寒肢滿賁豚又為承氣證所不有以是為別猶不可乎夫是亦豈不有理第承氣與蜣螂為用懸殊其可不相比而證明之耶驚癇癲狂神識必不慧然必與陽明讝語有別腹脹與腹滿痛有別寒與熱與潮熱又有別所以然者承氣證是邪傷陽明之陰蜣螂證是邪傷陽明之陽傷其陰故蒸逼津液四射而出傷其陽故衇道泣澀四肢寒滿四肢者諸陽之本寒則非火滿則為虛自與四肢實能登高者有間也蜣螂者味鹹氣寒巢至不潔之地其性見火則怒怒則飛飛之力甚猛撲火既息猶不已也必觸物乃墮是其秉氣於陰以追赴撲滅陰中之陽邪仍折旋反覆留生氣於腸胃糞穢之中不使決裂潰敗又恰與久瘧結根於下陰陽戰亂於上者有似故仲景於鱉甲煎丸用之其風溫被火有驚癇瘛瘲太陽被火有驚狂起臥不安皆非是物所宜正以其病在陽而不結根於陰故也鼠婦似衣魚形而其色如蚓背有橫紋蹙起多足大者長三四寸生下溼處甕器底及土坎中家無人則生參衍義圖經綱目五癃之外別有氣癃五癃說已見石韋氣癃則甲乙經所謂足厥陰衇動喜怒不時發頽疝遺溺癃者也夫足厥陰之衇從膕內廉循股陰入毛中過陰器抵少腹從極幽隱處上出乍喜乍怒則氣有所壅衇有所停阻礙水道以水道之行正在是下行也鼠婦生極幽隱之所極下溼之處且喜居壅器之底通地氣不通天氣者又必其室無人跡往來以人往來則天氣行也故主氣癃以其生氣正在極淖溼祕悶中也婦人月閉血瘕癇痓寒熱利水道言能於月閉血瘕癇痓寒熱諸證中利水道形容其必於血氣閉塞之中且因壅淤而上行旁出之候也鼠婦利水白魚亦利水又皆氣血交阻但白魚所主是寒溼阻氣因而及血鼠婦所主是氣阻及血因壅溼熱故有異云衣魚出久藏衣帛書紙中其形稍似魚尾分二歧能蠹衣帛書紙始則青老則有白粉觸手即落斷之如銀參拾遺圖經綱目浮假而痛推移則動謂之疝瘕是病在男子惟寒溼間於氣分為然在婦人不能不波及於血蓋病正當隱處且屬有形若經候來盛則雖有所襲亦能乘勢而除惟其去者過多環陰之血道空虛斯所襲者異以奠居為梗此所以異於男子也然曰婦人則尚有異於女子其故亦當考也夫女子多鬱經事不暢者有之火載血升者有之既無胎産之去復少崩漏之證祇嫌血去不及不畏血去太過斯環陰之血無從空虛而疝瘕所以獨標婦人也但傷寒畜血必小便自利今病涉下焦之血小便反不利者何故夫畜血是純血病疝瘕是氣阻血分仍屬氣病不然則推移不能動矣此婦人疝瘕小便不利既異於女子又異於男子雖病涉血仍為氣病者也衣帛書紙木之餘氣色白善鑽金之鋭氣此白魚之性能於木氣閉塞中為穴以通之之故矣而衣帛書紙必遭浥溼始生白魚燥則無矣故白魚之性又能於木氣閉塞中化溼氣使流行從穴而得達環陰之血室衇絡皆足厥陰肝所主者也血室之溼既去厥陰之衇遂通則非特小便利并疝瘕亦能愈矣仲景於小便不利連出三方而不言證其蒲灰散茯苓戎鹽湯無論惟滑石白魚散中用白魚亂髮均從血中通利其亦欲使人循方而知其所以治之證歟至摩項強背起不明其故不敢強解諸本草皆不載此味惟本草拾遺於蟲魚部下品附有故緋帛緋帛等味所主大率多瘡腫諸患蓋取其出自蠶故入蟲部而染緋必以紅藍花故能入血合而繹之則通絡之物也新絳之義應不外此其所以協蔥與旋覆花主婦人半産漏下則以其本係血肉而染絳為能行絡中之血而不傷矣盧子繇謂杏為心果心主衇故杏有衇絡桃為肺果肺主毛故桃有膚毛此言解杏與桃是矣第果之與仁終應有異且杏仁桃仁本經主治仲景用法皆不謂杏主衇桃主毛也然則將奚從愚按素問五常政等論論運氣太過不及而約以穀食所宜當有彼此取舍之殊蓋氣有偏旺偏衰穀食所主亦有彼此肥瘠耳要而言之則藏氣法時論所謂五穀為養五果為助原為平人察藏氣之偏而裒多益寡稱物平施以底於無過不及非為治病立論也是故杏有衇絡則以之助心桃有膚毛則以之助肺然果是一物造就之功能仁是一物所鍾之生氣凡物惟不偏不倚相制相援生理乃具使杏有衇絡仁遂助衇絡桃有膚毛仁亦助膚毛偏倚極矣無相制相援之妙又何得為生理所鍾哉夫血無氣不流氣無血不澤血不流則衇絡阻而氣先湧逆氣不澤則腠理塞而血遂壅淤故杏主助衇絡仁即主通衇絡之氣桃主助膚腠仁即主疏膚腠之血是杏之生氣鍾於金成於火桃之生氣鍾於木就於金金必鍛冶乃能為物木必斫削始克成材實理如是非附會也是故論治病者但取其杏有衇絡仁則主降氣桃有膚毛仁則主疏瘀斯降氣為降何等之氣疏瘀為疏何等之瘀皆可瞭然不必牽連杏為心果桃為肺果矣本經桃仁所主瘀血是通血之物皆能治者也血閉而成瘕且雜邪氣則非尋常血閉為因氣不行血遂阻滯者矣杏仁所主咳逆上氣賁豚是下氣之物皆能治者也雷鳴由於喉痹且當下氣則可知其非尋常上氣為血絡不通氣被壅逆者矣更推以仲景之用桃仁無不與是吻合者本經曰桃仁主瘀血血閉瘕邪氣似乎凡由血閉而成瘕其無邪氣者不足當之矣乃仲景用桃仁承氣湯抵當湯丸鱉甲煎丸大黃牡丹湯所治證誠因邪氣而致若大黃䗪蟲丸桂枝茯苓丸下瘀血湯亦可謂因邪氣而致者乎愚以為是亦皆因邪氣而致者也夫五勞虛極羸瘦至腹滿不能飲食肌膚甲錯兩目黯黑非積年纍月不能成而推原其本曰食傷飲傷飢傷勞傷經絡營衛氣傷無不由於外因非本實之先撥也惟憂傷房室傷為七情內因之咎然能至積年纍月不過腹滿不能飲食肌膚甲錯兩目黯黑則亦未免因憂因房室致外感耳若夫內有宿癥苟一身之生氣皆為血阻則不應有孕有癥仍能得孕非因邪氣之入內與血結僅阻於一處不害生氣之流行闔闢耶至産婦腹痛其因惡血未盡與枳實芍藥散而必可瘳其不瘳而血反瘀於臍下焉若不由邪入斷無此病細探而力索之則仲景之用桃仁與本經之所主有不爽銖黍者矣蓋桃仁以今日所鍾生氣而言氣薄則泄味厚則發以他日所造就而言花色紅潤實有膚毛其泄且發遂為內自血分外達肌腠矣前聖之因物品能後聖之開來繼往息息相貫心心相印有如此者然桃仁所主血閉瘕邪氣皆內證也其外候云何然此可考核而知者也仲景書竝千金附方用桃仁者凡九其方中同用之物既因大黃芒硝虻蟲水蛭可知其為附於裏證矣不可因瓜瓣丹皮桂枝芍藥而可知其為附於表證耶是故用桃仁證之外候有三曰表證未罷曰少腹有故曰身中甲錯何以言之蓋桃仁承氣湯證曰太陽病不解抵當湯證曰表證仍在抵當丸證曰傷寒有熱葦莖湯證曰咳而有微熱鱉甲煎丸證曰瘧一月不解大黃牡丹皮湯證曰時時發熱自汗出復惡寒以是知其必由表證來也桃仁承氣湯證曰少腹急結抵當湯證曰少腹鞕滿抵當丸證曰少腹滿大黃䗪蟲丸證曰腹滿不能飲食大黃牡丹皮湯證曰少腹腫痞下瘀血湯證曰腹中有瘀血著臍下以是知其少腹必有故也大黃䗪蟲丸證曰皮膚甲錯葦莖湯證曰胸中甲錯大黃牡丹皮湯證之前條曰腸癰之為證其身甲錯以是知其身中必有甲錯處也雖然風寒為病皆有表證畜水停痰皆能腹滿腸癰竝不用桃仁用桃仁者乃腫癰是三者果可為確據耶夫固有辨矣曰太陽病六七日表證仍在衇微而沉其人發狂者以熱在下焦少腹當鞕滿小便自利者下血乃愈曰傷寒有熱少腹滿應小便不利今反利者為有血也是知表證未罷必少腹滿乃得窺桃仁證之一斑少腹滿矣必小便利乃得為桃仁證之確據腸癰雖不用桃仁然前條起首云腸癰之為病明係發凡起例之詞下條起首云腫癰者明謂腫癰即腸癰之別腸癰可該腫癰則腫癰亦可有甲錯矣況三者謂不必比連而見得其二即用桃仁可也若三者一件不見竟用桃仁則必無之事矣循是而求桃仁之所當用又豈有他歧之惑哉麻黃湯大青龍湯麻黃杏仁甘草石膏湯麻黃加朮湯麻黃杏仁薏苡甘草湯厚朴麻黃湯文蛤湯皆麻黃杏仁竝用蓋麻黃主開散其力悉在毛竅非藉杏仁伸其血絡中氣則其行反濡緩而有所傷則可謂麻黃之於杏仁猶桂枝之於芍藥水母之於蝦矣然用麻黃者不必盡用杏仁在傷寒金匱兩書可案也惟喘家作桂枝湯加厚朴杏子湯佳凡麻黃湯證多兼喘則凡用杏仁皆可謂為喘設矣乃小青龍湯偏以喘去麻黃加杏仁其故何歟此其義蓋見於金匱痰飲篇夫支飲冒而嘔既以服桂苓五味甘草去桂加薑辛半夏湯水去嘔止矣則不應腫腫而無水即所謂無水虛腫為氣水也氣水發其汗即已宜得用麻黃乃不用麻黃而用杏仁云以其人血虛則其故有在矣然則杏仁遂為補血之劑歟斯殆非也夫杏仁外苞血絡內韞生機無水虛腫為氣水分明氣乘血絡之虛襲而入之遂為腫也得杏仁致生氣於血絡推而行之於以化腫氣為生氣於以除壅遏而得節宣腫遂愈矣喘者腫之根腫者喘之漸治腫以是治喘即以是猶不可知杏仁之所治乃氣入血絡壅腫而不得外達之喘耶曰太陽病下之後其氣上衝者可與桂枝湯若不上衝則不得與又曰太陽病下之微喘者表未解也桂枝加厚朴杏仁湯主之汗能傷陰下後氣上衝雖是邪還陽分然欲由外解必經血絡而後及於肌膚汗多恐血絡既虛則邪入之遂生壅腫故加厚朴杏仁一從直道下降一從血絡外出仍與治腫同一理也雖然麻黃協杏仁所治之證多有不喘者蓋亦皆以血絡壅遏不能外達用之玩麻黃連軺赤小豆湯證所謂傷寒瘀熱在裏身必發黃條只一瘀字其關於血絡可知矣然則大陷胸丸麻仁丸茯苓杏仁甘草湯礬石丸之用杏仁盡以其能行血絡之氣耶蓋亦有之而稍異夫旁通直降杏仁之性兩者兼備是以合麻桂而播其先聲協硝黃而壯其後徑且大陷胸湯證猛於大陷胸丸證麻仁丸證劣於小承氣湯證大陷胸丸中全有大陷胸湯不必杏仁葶藶而可通麻仁丸中全有小承氣湯不必麻仁杏仁芍藥乃能降所以然者大陷胸湯所主無心已上證小承氣所主無不足證假使大陷胸丸證用大陷胸湯則結胸縱解項強如柔痓難除麻仁丸證用小承氣湯則衇浮雖愈枯檣難澤延於下後能保其在上與不足之餘患不幻為他變耶是故項強如柔痓者結胸餘威乘血絡虛而溢於上也衇澀者大便鞕小便自利之消耗既使胃中液乏復能吸傷血絡也是杏仁在大陷胸丸為葶藶引導以勦捕餘黨在麻仁丸則為麻仁引導以安帖反側均為善後起見耳觸類而長之則産乳既傷其內金瘡復傷其外血液內外交泄衇絡勢將中絶之候不可知杏仁乃添補血液劑中開通內外之使耶胸痹胸中氣塞短氣是飲閉於上經水閉不利臟堅癖不止中有乾血下白物是溼閉於下飲閉於上能使水液皆化痰涎溼閉於下能使血液皆成白物在上者宜利之利之而橫溢者不能全去也在下者宜卻之卻之而方來者猶將化也故茯苓杏仁甘草湯中用杏仁乃為茯苓旁搜溢入之飲礬石丸中用杏仁乃為礬石直通血衇之氣其一橫一直之間已足見杏仁在直劑中能橫在橫劑中能直已引而伸之則咳逆為由下而上逆喉痹為由橫而阻中以至金瘡賁豚無非一橫一直亦無非自下而上不又可見杏仁原一線直達之物而善帶曳橫阻之邪以出本非能橫行者耶或問傷寒金匱兩書何以獨大黃䗪蟲丸一方桃仁杏仁竝用曰夫仁生氣之鍾於極內者也核其骨也果其肉也溫分肉澤筋骨斷藉仁中之生氣至理所在毋可易也然其氣之出於外面溫澤分肉筋骨必先剛而後柔乃桃則肉白而骨赤杏則肉黃赤而骨白於此可見桃仁入血分而通氣杏仁入氣分而通血衇矣乾血之為物非氣血竝堅癖不能成若氣煦血濡有一件足自立必不致血之乾且阻氣之行而至虛極羸瘦腹滿不能食矣大黃䗪蟲丸澤血通血搜血消血既皆有其物非桃仁之入阻血中行氣杏仁之入阻氣中行血又何以使兩者成和而化乾物為潤物起死物為生物耶觀礬石丸所主曰婦人經水閉不利藏堅癖不止中有乾血下白物盡血病也偏用杏仁千金葦莖湯所主咳有微熱煩滿胸中甲錯盡氣病也偏用桃仁其故亦可思矣李樹大者高丈許枝幹如桃葉緑而多性最耐久得三十年老雖枝枯子亦不細與桃竝時花花小色白淡泊纖穠香雅潔密夜間尤艷實熟稍後於桃種類甚多味甘酸苦澀不一色亦青赤白不一大率皮赤肉青味甘苦帶澀者為多參齊民要術格物叢話別録李核仁主治瀕湖不得其解改為僵仆踒折瘀血骨痛豫因是遍訂宋元槧本及千金翼均與今大觀本同蓋廣韻躋同隮書微子今爾無指告豫顛隮馬注隮猶墜也言因升高而墜也疊云僵仆躋者所以別於躓與跲也躓與跲即今所謂傾跌蹉跌也傾跌蹉跌者曲身或側身著地僵仆與登高而墜則俱直身凡人至跌無有不曲身側身期能自立而免者有之則必眩暈昏昧不自知也從高下墮不自主也是僵仆躋之跌與傾跌蹉跌之跌有以異矣此其異奈何夫委屈以思自免者其氣血聚而遭震驚以散則其傷與瘀反甚不自知不自主者其氣血雖有宿恙而不震驚則其傷與瘀反不甚李核仁援以杏核仁桃核仁之例為肝之果而其用在脾脾者生氣生血之源以其傷不甚無事過於攻通則亦濬其源而流自順雖至骨折亦或可無妨也惟其入脾故實能調中惟其味甘苦氣平故除中宮痼熱而根則其所自本凡花實核仁莫非由此而發且萌蘖於極寒之時說文蘖伐木餘也是其性必有所同然故為大寒大寒之物而主運津上升故主消渴與心煩逆津不隨氣斯氣急促而奔突故又能主奔氣仲景於賁豚湯用甘李根皮佐最重之生葛以運津而緩氣之逆其義蓋取諸此米醋三伏時用倉米一斗淘淨蒸飯攤冷盦黃曬簸水淋淨別以倉米二斗蒸飯和勻入罋以水淹過密封暖處三七日成矣綱目劉潛江云醋之用類以為取其酸收然主消癰腫除癥塊諸證酸收者何以能爾蓋尚書木曰曲直曲直作酸本屬陽陽鬱則發此作酸之義也夫木本陰中之陽陽在陰中奮決欲出而尚不能離陰是就陽畜陰中即有陰得陽舒之妙乃天地人物之出機也然則酸味之物其功悉能若是耶蓋惟米醋為能然也夫粳米大益胃氣沁心肺以為生血化氣之源用以醞釀為醋使合德於肝能收即能散斂其陽之淫以歸於陰還以奪其陰之壅以舒其陽之用蓋血者本於心之能化而後有脾胃之生本於脾胃之生而後有肝之藏他物能如是哉愚謂惟其抑心脾之生化使歸肝臟是以肝木充沛能效疏土之職癰腫者土之結滯也水氣者土之痹窪也邪毒者土之不宣也其消之散之殺之大率功效多在脾土所主之肌肉故在傷寒論協半夏雞子白治喉間生瘡在金匱要略合黃芪芍藥桂枝治黃汗可以悟其旨之所在矣用漬烏梅蒸之米上是挽酸泄使入土中和以膽汁用為導法是引苦降俾泄中有收後世擴充其治使同雀糞潰癰疽同釜底墨消舌腫同泥消火傷沃炭清血暈焠石塗乳癰煮熟沃疔腫亦無過於散脾心肝三家熱壅而已第一卷第二卷第三卷第四卷第五卷第六卷序曰蓍婆學醫七年師見其勤且敏也一日與劚藥盛藥具令遍察國中凡草木不中藥用者悉為取來蓍婆求之不獲空器以復其師師大稱賞焉佛氏主宏悟豫以為非是本經為神農親定設如彼所云則凡典章法度經世大則在黃帝時規模略具何以歷唐虞三代其制乃備孔子猶欲兼收節取如虞樂夏時殷輅周冕也夫肖物刻範因弊設防究之未事已前證之成驗已後經制固應如是藥物豈獨不然蓋一人效技必備數十百藥而用始周一藥意旨必歷數十百人而情乃確如果學七年所見竟無非藥一日嘗藥至遇七十毒則今所傳本經者蓋可旦募明之而旬日間得期於通矣曾謂其易如是哉陰陽紓斂期之以時日終不能無愆高下燥溼限之以方罫猶恐其有忒何況取以研核物之形色氣味用以衡量人之強弱疾厄自宜積歲月乃得要領以故歷數十年始增一物更千百年得一會歸不然周秦以上三百六十五味固託始神農漢魏以下迄於齊梁藥物已倍何不聞又有神農耶自是以降增至三百餘種者有拾遺綱目增百餘種者有唐本開寶其嘉祐圖經皆至七十餘種不及五十種者指不勝屈善夫宇文虛中稱唐慎微為士人治病概不受酬但以名方祕録為請以故士人於經史書中得一藥名一方論必録以告遂積成卷軸為證類本草噫古人之勤乃爾訂本經疏證訖豫春復以常用之藥為請續疏如右自知詒誚然固有所本與憑空增藥異矣鄒澍識上品石一味草十七味鍾乳係山洞石穴中陰處溜汁所成凡仰視石衇湧起處即有乳狀下垂如倒生山峯峯端漸鋭且長如冰柱柱端輕薄中空如鵝翎係石液滴瀝且滴且凝而成以色潔白微紅碎之如爪甲中如雁齒光明者為善參桂海志吳氏本草圖經乳與泉皆山石中潤澤之氣所結而性體不同為用迥殊者以乳得其陰而化於陽泉得其陽而化於陰耳惟得其陽故專行流動旋轉空隙之地惟化於陰故仰出而性寒惟得其陰故專行嶄巖犖確艱阻之所惟化於陽故俯出而性溫其在人身一則似溺似津行陽道而質清冽一則似液似精行陰道而質稠黏也質稠黏而性溫形中空而有竅體潔白而通明何能不明目益精通百節利九竅下乳汁石屬金而性下行何能不主咳逆上氣五臟主藏精而不瀉精既充盈且能彼此輸灌五臟又何能不安特味甘氣溫其用在補則祇有合於肺虛且寒氣餒不降絶無與於風寒熱溼之客為咳逆上氣者矣故千金於肺虛冷有補肺湯第二方第四方第五方於氣極有鍾乳散於咳嗽有鍾乳七星散又七星散大都合溫補藥用之是明目為明精氣不充神光昏暗之目益精為益陰寒痠削氣化清冷之精安五臟為安氣失聯絡不相裒益之五臟通百節為通骨屬乏澤屈伸不利之百節利九竅為利氣道窘澀開闔不便之九竅下乳汁為下衝衇既上無陽以化之乳汁其與一切外感及他內傷均無涉也夫補之為補於無形易有形難精乃五臟液之至粹其成尤不易乃觀鍾乳功力多在補精且若不甚難者千金治陰痿精薄而冷方云欲多精倍鍾乳是鍾乳之益精甚速也殊不知有形之生長消歇皆視無形為指使陰陽應象大論所謂精食氣精化為氣則氣為精母古訓甚明即以泰西所謂質具之德傳生之用而論其義亦為氣聚生火火盛迫液儘可頃刻而成初非難事即鍾乳之所以生原石中潤澤之氣被陽氣蒸逼而流既已液中有氣氣中具陽其蒸騰變化亦又何難況觀於別録之義尤有遞相補綴之妙譬如調兵剿狄則令禁兵守要害腹裏之兵防邊以易邊兵出塞為其風土合宜人情不甚相遠耳鍾乳之用具有此義調在上未虛之陽和在下失偶之陰而恃其甘溫氣味踞守於肺使源源繼進務令火下歸而水上濟成不偏不倚平治之功此益氣之下所以復贅補虛損一言而腳弱疼冷下焦傷竭強陰均一以貫之矣乃世俗所謂補精動以質膩性寒者當之名曰以類相求豈知無陽則陰何由生是以不阻於中即滯於下初為胃減續為便溏馴至心之化物無權肺之治節失職而斃宜乎視補精為甚難之事也孰知以陽生陰推近及遠為易易耶黃精三月生苗高一二尺葉如竹葉不尖而短兩兩對生莖梗柔脆頗似桃枝本黃未赤四月開青白花狀如小豆花結子白如黍粒亦有無子者根橫行如嫩生薑亦如萎蕤黃色蒸熟則黑參圖經綱目黃精根既黃幹復本黃末赤是其歸根復命在火土之化以為補中益氣確鑿無疑或謂其獻技效能在青白之花青以勝土而除溼白以勝木而除風豫則以為牽強附會謂青屬木獨不可以助風乎謂白屬金獨不可以凝溼乎安在其能除風溼也且黃精之補中益氣本為除風溼耳非補中益氣除風溼兩分功效也蓋黃精之寬緩猶夷決非治外受風溼之物所謂風必淫於外而不反之陽所謂溼必滯於內而不化之氣惟氣滯於內而不化津化血斯陽淫於外而不反本還原此風溼是一氣之不諧非兩氣之互合矣不然烏得以補中益氣之物治之耳且氣血陰陽皆綱維於中焦惟其脾輸心化方足供一身運動然脾輸賴肝之疏心化藉肺之布倘肺不布則心所化之陽淫於外而為風肝不疏則脾所輸之精滯於中而為溼青者風氣白者燥氣風溼之病得風燥之化行溼遂不能拒風於外風遂不能旋溼於中風則仍為陽氣而內歸溼則化為津血而外布此青白之用所以密托於本黃末赤之體而脾之力尤在行氣於四末此其兩兩相對之葉又確然象人之手與足黃精功用在四支痠疼遲重不為風雨而增不因晴明而減又復中氣虛餒者即輕身不饑亦一以貫之矣菖蒲生水石間葉如韭中心有脊無花實經冬不雕根盤屈有節一根旁引三四根旁根節尤密釆之初虛軟乾方堅實折之中心色微赤嚼之辛香少滓圖經火媾於土變而為金其已趨於金未離於土者為石石之異於金以擊之能碎而有火也石之異於土以堅剛而不化於水也惟然則設有石者清於水而水不能入含夫火而火不能出陰與陽相拒而不相謀水與火相守而不相化下之氣不能交乎天上之氣不能交乎地又何自沾生趣而為物賴以發育耶人身靈明猶火蓄石中人身軀體猶石能蓄火假使軀體為寒水所蒙靈明為痰涎所壅則運動不周視聽不協可謂非因內不能出而外遂不化乎菖蒲者不藉纖毫土氣生於水底碎石之間隔水能通以無竅為有竅自地接天以不聯為聯且其氣芳烈味辛溫有陽畢達有陰悉布劉潛江所謂非至陰之貞不能發至陽之光發至陽之光乃益暢至陰之用者信矣否則外有風寒溼痹內為咳逆上氣者何以不治痹亦不治咳而用此況補五臟者非一開心孔可了事而明耳目出音聲又豈通九竅所堪致也蓋視聽言動皆靈明之用然靈明猶燈藉膏乃燃火者氣之靈氣者火之使而氣曳水以行水由氣而阻行氣即所以行水行水即所以濬靈明靈明暢而氣條達氣條達而水流通水流通而靈明遂有所依曰開心孔補五臟利九竅明耳目出音聲一而已更何憂乎風寒溼痹中之咳逆上氣哉至別録所增主癰瘡溫腸胃小兒溫瘧身積熱不解皆火為水遏欲出不得與前旨不異惟於痹則專及四支不得屈伸於九竅則偏止小便過利又獨重耳聾何也夫固因其節數耳津液之流不為節礙倘使無節不將傾瀉淨盡乎是故菖蒲需促節者一有取於節宣一有取於節制宣則不壅所以主四肢溼痹不得屈伸也制則不濫所以止小便利也不壅則濁去不濫則清澄澄徹清瑩映物所以能明而耳遂不聾要之菖蒲不可徒視為開邪亦不可徒視為崇正邪開而正自崇者有之正崇而邪自開者有之故凡水液渾濁為神明之翳者咸有取於是也菟絲子初夏生苗亦有根苗如絲綜及長延著草木其根自斷無葉有花白色微紅香亦襲人六七月結實極細如蠶子土黃色九月收采參圖經綱目兔無雄陰獸也然狡獪若猿竄疾若蛇則其用皆陽矣兔微物也故諸獸與遇皆欲得為餐兔或無可遁則聳尻伏地他獸近而搏焉則環後足以蹄之他獸多反傷兔已乘蹄遁是其絶有力處深伏於踵所用之陽皆在是菟絲之根猶其踵也為四月盛陽所迫屈蠖之陰竝從陽化如絲如縷宣布無方則猶其狡獪竄疾也逮至七月感受初陰遂結為實實中無他不過稠黏絲縷屈曲蟠繞於中則猶其抵穴伏處也陰者陽之種乃遇陽輒化而宣布陽者陰之用乃遇陰輒屈而歸根是其能聯屬浮越無根之氣化為生陽以媾於陰而返本還元歸於窟宅為不動之陽故其治可分為四端曰不激則不化是別録療口苦燥渴之義也不空則不布是本經主續絶傷補不足之義也不媾則不結是本經主明目益氣力肥健別録主養肌強陰堅筋骨之義也不遇窟則不伏是別録主莖寒精自出溺有餘瀝寒血為積之義也遇陽斯布即以布為歸遇陰斯屈便用屈為發如環無端正似其絲上結實實中藏絲所以為上品要藥雖然傷寒通衇四逆證之面赤戴陽茯苓四逆證之身有微熱皆浮越之陽何不用是物化為生陽而使之歸也夫太和之元氣固有陰有陽以相播蕩而為生化與駁戾之邪氣亦有寒有熱以相激逐而為患害者烏可同日語則菟絲者焉能以優柔溫潤之氣折暴戾嚴肅之陰而令陽得歸耶牛膝秋收子至春種之其苗方莖暴節高二三尺青紫色節如鶴膝又如牛膝葉皆對生頗似莧而長且尖韋備秋月於節上生花作穗結子如鼠婦有澀毛皆帖莖倒生九月采根以極長大至三尺而柔潤者佳中有白汁圖經參綱目寒溼能成痹不能成痿痹能為四支拘攣膝痛不可屈伸痿則不能曰寒溼痿痹四支拘攣膝痛不可屈伸將痿痹遂可無別耶且素問於二者各自為論皆辨之明且晰不言其因有同焉者何也蓋痿與痹皆筋節間病而寒溼有已化有未化未化則浸淫筋節為病已化則薰灼筋節為病素問論痹多病於浸淫論痿多起於薰灼痹論曰其留連筋骨間者疼久曰在於筋則屈不伸痿論曰肝氣熱則膽泄口苦筋膜乾筋膜乾則筋急而攣以是知四支拘攣膝痛不可屈伸細體之原有分別概目之則固有因同者在矣牛膝之治此妙在不必問其已化未化但執定其病在筋節間痛而不可屈伸者皆能已之蓋其體柔韌似筋而一線直下上生之莖有節下達之根無節不用其莖但用其根是可知筋節間病凡自下而上者則以此自上而下長於下短於上者因其上行轉而下達且柔則可屈直則可伸安在其有不合也然則曰逐血氣傷熱火爛何也夫熱火爍烙肌肉血氣沸騰其應自上而下者必為之阻反逆而上出其應自下而上者遂為之吸引以入於其中上出者遇筋節亦能停留上引者在下遂由是乾涸停留者可致四肢拘攣乾涸者能得膝痛不可屈伸以是知血氣傷熱火爛亦四肢拘攣膝痛不可屈伸之源與因寒溼為痿痹者所傷雖殊然推類至盡原有不異者在矣牛膝之治此妙在其味苦本係火化其體柔潤中有白汁上短下長又協水形是為納火氣於水中化炎上為潤下火者受傷之本水者制火之資能使火隨水而下水抑火而平則血氣被熱火傷爛又安有不除也況胎者原係火養水中水澄而不流火定而不搖者也驅其水使流引其火使隨水又焉有不墮者哉然則別録續增所主皆融會本經之旨而擴充者也大率強者使柔槁者使潤上者使下斷者使連阻者使通盡抑火令就水助水令充行之治獨老人失溺一語正相背此無他不過火不入水而氣不攝溺仍是苗短根長凝陽於陰之治耳詳見秦艽下惟莖色青紫葉皆對出開花節間又有澀毛帖莖倒生當明其賴水火之交混始不閡於關節就關節之阻撓為收成之所自即欣榮以向長覩逆折已具形於是牛膝之功能性味盡在隱約中呈露其天真矣茺蔚喜生近水溼處春初生苗如嫩蒿入夏長三四尺莖方如黃麻莖葉如艾而背青一梗三葉葉有尖歧寸許一節節節生穗叢簇抱莖四五月間穗內開小花紅紫色亦有微白色者每萼內有細子四粒粒大如同蒿子有三稜褐色其草生時有臭氣夏至後即枯其根白也綱目火是氣之靈水是氣之粹氣和則火麗於水為精明氣乖則水拂於火為水氣水氣盛而精明衰益精明正以除水氣除水氣即以益精明茺蔚子得水之餘也而能會神聚精於火也子是氣之精莖是氣之道氣盛則血順而流行氣衰則血違而留滯留滯於節而癮疹癢去癮疹正以行氣血行氣血即以除癮疹茺蔚之莖得木之條達而偏開花結實於節也蓋嘗讀易而玩夫節焉節者陰陽適均之分限而在下者整在上者微此其取象也節者陽上出以化陰而下者猶粗上者愈精此其義旨也乃茺蔚者開花結實不上不下適當其節是子為遇陰陽之相值以翕其和莖為就陰陽之相續以致其通彼陰陽欲相續而不通為癮疹作癢陰陽既相值而不和為水泛目暗得此何能不和且通耶雖然世之視茺蔚也美厥名曰益母任以職曰行瘀行瘀是已血行不止者又復資之婦孺咸知村野廣用而實堪取效乃本經絶無一言道及豈古人之智不若今耶曷不究夫別録乎試觀盛夏蘊隆日近如炙土焦如渴而水反盛漲在人則津液消耗而百衇反憤盈是何故哉以諸陰盡為陽所劫持也不然血既逆矣烏得更為大熱而心煩頭痛絶似外感之所為耶婦人當胎産時血亦已傷矣而種種患害復皆本於血血既為逆則一身所聚之水氣及津液涕唾便溺何者不可從血以為患益母者不及盛暑已告收成明明不與浮陽為伍且當夏氣初動隨即處處會精聚神於陰陽交屆之節是益母行瘀非行瘀也取其未及盛滿先留餘地也益母止血非止血也取其不劫持陰氣盡化為血也由是言之則莖葉所主仍是其子除水之功特通暢條達令其行所當行止所當止奏效更長耳車前子春初生苗葉布地如匙面中抽數莖作長穗如鼠尾花甚細密色青微赤五月結實如葶藶赤黑色綱目或問車前之子治氣根葉治血同一本也而二其德且顯然有彼此之殊其故安在夫車前疏利水道之物也氣水相阻而結澀血水相隨而流蕩得此則行者行順者順恰似治氣治血若究其實子亦何嘗治氣根亦何嘗治血善夫徐洄溪之言曰凡多子之物皆應屬腎腎者人之子宮也車前多子自當隸腎特質滑氣薄則不能補而為輸泄人身賴腎以輸泄者非水道而何且葉又先莖而生莖又先葉而槁然葉終不如莖之高莖終不如葉之廣一則透空而出一則帖地而生正似氣呼吸於中血盤旋於外氣易成易傷血難長難竭也又其物不生於耕撥空鬆之土亦不生於築治堅實之土獨於道旁人畜所踐而不常踐處則出根雖不長入土甚固欲拔其莖一撮即起欲拔其根必全引其葉用力拔之方得離土苟一葉不在引中則餘葉皆脫根仍在土兀然不動而根色白葉深青莖青白子黑不又似生於金土膠固之中適被四月正陽火化乃各分道揚鑣歸於色青色黑之肝腎耶是可知其功能所由在虛處之土與火其作用境界在實處之肝與腎而上則發始於胸膈下則直竟於前陰矣雖然千金外臺子多入於補劑葉僅恃之疏泄何也夫其味甘固近於補氣寒則終歸於泄兩者本無異特水流氣順則下益於精血蕩水隨係上釀有火故子之治非特氣癃而痛水道不利而溺澀因溼而痹者可除即目赤痛而不明者亦可已蓋水與氣相阻則火生火在水中於是一身宜得水之益者反遭火之纍氣順水流斯火清火清斯還受益而不受纍故充類之極功曰養肺強陰益精也根葉之治非特血行之金瘡衄鼻可除即血停之瘀血血瘕下血亦可已蓋惟血之流蕩忘反必緣火迫火既迫血血無以繼則水隨之於是水亦竭而小便為之赤能去血中之火正以其能去水中之火故充類之極曰止煩下氣也反而觀之則水道不利證任是溺澀氣癃溼痹目赤凡不痛者則非車前子可治其金瘡血不止衄鼻瘀血血瘕下血凡小便不赤不煩不氣逆者皆不得用車前根葉矣木香形如枯骨味苦黏牙者良圖經強志之義具見遠志木香氣溫味辛苦其氣芳郁宜乎性剛而散發者豈亦能凝神於精攝陽於陰耶夫燈燭之譬在於遠志原喻以芯剔翳沁膏厥功懋矣然膏中有故獨不能使燈不明乎即膏中有故係滓厚而沉濁者猶非木香能為力也燈既張矣飛蛾青蟲集焉漬於膏而難出將死未死宛轉蠕動膏蕩搖燈亦為之不明非剛者挑而去之不可此木香所為強志也夫木香之首功為主邪氣則明非膏中所自有矣曰毒曰鬼皆陰也必麗於陰然毒而曰疫鬼而曰溫不猶么麼之類雖屬夜出然能飛揚者乎是木香之治治陰厲之氣反受質於陽善飛揚而著人身之陰者則導而出之於陽以成其神不搖於精陽自攝於陽而不耗夫陰之功能入於陰以其似枯骨也能去陰中之客陽為纍以其氣溫味辛也能不耗降以其質粘牙也故夫淋露者火在水中致水流澀夢寤魘寐者神歸陰分為熱所擾皆陰中不靖棲陽不穩之病與遠志之使陽歸陰而陽不受翳纍者原大相徑庭至於別録所增治療若主氣不足致毒鬼溫邪之伏於陰氣劣不行致陽之不得遍於外皆注本經而推廣之詞獨行藥之精一語他味不常有夫藥物行陽行陰者多矣若陰中行陽陽中行陰者則較寡而此非特於陰中行陽且能於陰中行陰藥之精微使合於陽而成化育則亦以其味辛在苦中而其質粘牙而不粘舌比之龍骨粘舌而不粘牙者為不侔以彼之攝火於土則知此為攝火於水仍能使交於火矣遠志有大葉小葉二種大葉者似大青而小小葉者似麻黃而青亦似畢豆葉三月開花亦有紅白二色紅者屬大葉也根長及一尺色黃黑去心用參圖經綱目或問劉潛江於遠志自詡陰中醒本作發陽陽中宅陰兩語為中肯不知當否豫謂譬之燈膏盈而火暗者必挑其芯此陰中醒陽之意也譬之燭必芯具而膏始得附必火燃而膏始得融此陽中宅陰之意也兩語者誠為扼要且人之智慧聰明記憶志力運動皆火其精血津液涕唾泗洟便溺皆膏火以化膏為用膏以資火為用而火之餘燼不可使留以翳夫火故隨其所翳挑而剪之遠志者苗短根長苗名小草根長尺餘根之長有以見其入膏之深苗之短有以見其剪翳之淨此益智慧耳目聰明不忘強志倍力之說也陽之所在即陰之所隨陰之所資即陽之所運兩者必膠黏融液竝無乖隔斯得運動靈開闔利苟有纖塵干於其間即機關窒強矣遠志者根似牛膝葉似麻黃惟其入陰者深出陽者淺外出之力為入下之性所掣是以不能如麻黃之大發其陽隨竅皆透而僅能去九竅之翳纍此除邪氣利九竅之說也震動於上能使陽離於陰泄澼於下能使陰離於陽離之甚者上傷及下下傷及上離之淺者則僅傷中若上久震動在中津液遂漓而有陰不攝陽之兆惟使陽能入陰陰從陽化乃得兩氣復相聯聚遠志者從上下下最為有力猶不能及泉從下上上終不能及其根之分寸故僅能使由上病而傷中者復此咳逆傷中補不足之說也三項之中最精微者置之極後極籠統者反著最前何也是蓋順病之高下以為言且以明遠志之用雖廣而其實在由陽病以纍及陰其於由陰病而纍及陽者猶隔膜也至若別録所著皆本經注腳曰去心膈氣皮膚中熱面目黃即所謂咳逆傷中補不足也曰定心氣止驚悸即所謂益智慧耳目聰明不忘強志也古今注本草家類以遠志本經有不忘強志之文別録有益精之文遂互相牽合謂惟能益精故有不忘強志之效不知味苦氣溫性燥之物豈是益精之品必也精本不虧而運精之神有翳纍故撥去其翳纍而神自清神清而精自融液謂為益精可也本神篇曰腎藏精精舍志又曰腎盛怒而不止則傷志志傷則喜忘其前言明明因暴怒引火上浮致神離於精耳精亦何從驟虧惟引其火使歸於精精與神相合而自復又何必益精千金雜補門治陰痿精薄而冷方後注欲多房室倍蛇牀欲堅倍遠志欲大倍鹿茸欲多精倍鍾乳亦可見用遠志者為堅志意非益其精之謂也遠志何以能堅其志蓋房室之事源發於心心有所憶謂之意意之所存謂之志其志不回則其火不散而陰不泄此即與不忘強志倍力之經文一貫矣於此見善忘即志不堅志之不堅即神之注於精不純一其取義仍在遠志之苗短根長自上下下苦溫以醒發其火耳益精云乎哉龍膽宿根黃白色下抽根十餘本大類牛膝直上生苗高尺餘四月生葉似柳葉而細亦如嫩蒜莖如小竹枝七月開花如牽牛花作鈴鐸形青碧色冬後結子苗便枯圖經龍膽至苦極寒論其性體定能逢熱則清遇火則折宜乎降泄無餘堪與大黃鬪技爭捷矣乃其功效不曰蕩滌不曰推逐而曰主骨間寒熱驚癇邪氣續絶傷安五臟一若自內達外者何夫無平不陂無往不復惟其苦寒屆至極斯不泄不降已寓其間蓋苦本主發龍膽苦之至而兼澀澀者至苦之中有至酸也酸稟春之發育苦稟夏之暢達乃相聯屬焉則其寒非極泄而為極入矣味陰而氣陽陽唱則陰隨故味之暢發不能違氣之深入然進鋭者退必速氣寒既引味苦以深入而寒力先退苦力方優能不謂其功為暢發極內之火邪耶極內者何在軀體為骨在五志為神則龍膽之用在驅體為除骨間寒熱在五臟為除驚癇邪氣又何疑焉極內所藏自極精微其行止動作皆暗相輸灌默相交會而有邪氣干於其間則有形者為斷絶無形者為不安曰續絶傷安五臟者即骨間寒熱除驚癇邪氣散之效驗也雖然深中有淺淺中亦有深皮毛血衇固不得為深矣在軀體之內豈無捨五臟間神志外亦有深焉者乎別録緣其如此故又補出驅六腑間邪熱一層六腑中氣之極深者第一則膽中清淨之氣其次則腸胃三焦中水穀運行之氣熱邪干膽中清淨之氣則為熱泄下利干腸胃三焦中水穀運行之氣則為胃中伏熱腸中小蟲熱泄下利之上又冠以時氣溫熱者明下利非由時氣溫熱其故則在水穀不得為熱泄也龍膽之功由淺及深在淺則去著物之熱在深則除不著物之熱陰陽應象大論曰陽化氣陰成形此天地之規模以生人生物者也惟此能於陽分和化氣之樞於陰分去成形之纍猶不可謂鍾生氣於病中化病氣為生氣耶本經列之上品治非無由而後人視為苦寒峻利殊失厥旨故其續增主治如黃疸狂煩疥瘡癰腫喉痛等證盡是有形間病然能於水中求火之所在則亦不能不服其苦思深得也石斛叢生石上其根斜結甚繁乾則白軟五月生莖似小竹節節間出碎葉生皆青色乾則黃七月開花紅色十月結實節上自生根鬚人亦折下以沙石栽之或以物盛挂屋下頻澆以水經年不死參圖經綱目凡水土媾乃生木草木類也未有草藉水石而生不資纖土者有之則石斛是凡水石相漬縱千百年水不爛石石不耗水惟既生斛則若石挹水以灌斛斛因石以引水石屬金內應乎肺水則內應乎腎是石斛者引腎陰以供肺通調下降者也斛以五月生其時則陰姤於下而勢浸長陽拔隊而浮於土以十月實其時則陽復於下而力頗厚陰連引而際於天是其功用究竟為助肺降而泄陽使下引腎升而交陰於天夫陰沉於下而不動陽痹於中而不散氣結於上而不降其中之傷為何如但使陰濟於上相和而下交陽歸於下成化而上濟斯可謂主傷中除痹下氣否耶脾肺腎既受益則心與肝自不能不受益五臟皆受益斯虛勞羸瘦何能不復而其歸著則盡由於強陰蓋斛固得金水之專精而莖生青乾黃花紅原具五藏之全也益精補內絶不足除腳膝冷疼痹弱此其故皆在肺腎不連平胃氣長肌肉逐皮膚邪熱痱氣定志除驚此其故皆在熱氣中痹得別録一證本經益明而用者遂有可遵循此古人用意深處所宜細繹者也要之石斛自是補劑然其調處陰陽交聯上下有扶危定傾之概遂不得但目為補劑故施之於外感凡火痹於中氣結於上陰伏於下者尤見收功莫測以意消息而用之也可巴𦺩天生山林者葉似茗生內地者葉似麥虋冬而厚大至秋結實經冬不枯根如連珠宿根青新根白紫用之皆同以連珠多肉厚者為勝唐本參圖經夫風邪之於人其始能令人毫毛畢直其繼能令人多汗惡風已耳陰痿不起豈大風邪氣所能致耶不知陰痿不起非外中之風猶口燥舌乾非外受之燥也然內涸之燥有口燥舌乾可憑陰痿不起非風所能致何以知其由大風邪氣此則有說焉三百六十五日分為七十二候凡羽毛鱗介草木生壯老死於其間者何限而獨著為生殺之表率者在立春第一候曰東風解凍在立秋第一候曰涼風至是風為生殺統領物當生壯設遇涼風必遭抑遏物垂老死設遇東風亦緩憔悴玉篇憔悴憂貌惟物有屆時難挽之期故風無久違氣候之異此夏令風從西北冬令風自東南胥有之特終未見積月纍旬不能休止也人自生至病原不得常以陰痿不起為病適當二八已後八八已前不因精血之虧不緣元氣之損而肢體疲罷筋骨懈弛志氣虺頽觀其狀似蒲柳之易衰究其歸實樞機之完密豈不似物當生壯忽值涼飆惟旋轉其風則以厲階為榮資譬之行舟適才石尤打頭極費縴挽忽而揚帆鼓枻不由人力是巴𦺩天之主陰痿不起強筋骨安五臟補中增志益氣不必謂之治風直謂之轉風可也雖然巴𦺩天能轉蕭索為溫茂其故安在蓋惟其色紫紫者陽入陰中陰隨陽唱之驗也而紫中間白白則符於蕭索然間歲則變青青非鼓動陽風之色乎紫之多不能泯白白之少非特不化於紫且能轉而為青是蕭索實溫茂之所由溫茂乃蕭索之所發有紫色為根柢而此則發其機耳鍾陽氣於陰中而陰賴以化布陽氣於一身而陰隨以生此小腹陰中相引作痛及頭面遊風所以竝能療也設使火原偏旺水原偏衰縱有陰痿不起少腹引痛雖昧者亦不恃此為救援矣赤箭春生苗初出如芍藥獨抽一莖挺然直上高三四尺莖中空色正赤帖莖杪之半微有尖小紅葉四月梢頭成穗作花灰白色宛如箭簳且有羽有風不動無風自搖結實如楝子核有六稜中仁如麵至秋不落卻透空入莖中還筒而下下潛生土內根如芋去根三五寸有游子十二枚環列如衛皆有細根白鬚雖相須而實不相連但以氣相屬耳根大者重半斤或五六兩皮色黃白即天麻也赤箭是其苗乘雅或曰陽極變陰發轉為斂天麻之莖實有焉宜乎能出陽入陰為功甚巨今觀本經別録所著一若殊狹何哉曰循環之數天地僅足自主不能制物也火燃而難離水流而莫返能使不淨盡無餘其用已不小何況水火之相遭火金之相鑠餘燼遺鏐珍藏什襲不令同腐敗者均為棄物其功詎不大哉肌肉以火而豐陰以火而強力以火而大氣以火而盛然皆具往而不返之機其取義猶赤莖之直上支節不生而孰知竟其所至轉陽為陰遂生六稜之實且不墮他所仍入莖中而歸根復命是其往而能返謂之益氣力長陰肥健不亦可乎然則有游子十二圍環其根又何義夫以環於中而言則脾胃也以十二而言則臟腑之數也經衇之數也臟腑經衇以氣血而環周一身氣之所歸氣海也血之所歸血海也氣旋繞於上則支滿旋繞於下則為疝氣血離而旋繞他所則下血氣血竝而旋繞他所則癰腫皆瘦削陰痿無力少氣之根得歸其所當歸不旋繞其不當旋繞則不特益氣力長陰肥健且消癰腫支滿疝下血焉是本經述其正面別録抉其底蘊矣主蠱毒惡氣者俾正氣不助為虐是取其功用殺鬼精物者彤矢為陰類所畏是取其形象也劉潛江云天麻在方書云療風惟羅氏謂其治風大明謂其助陽氣兩說不相謀果孰是耶夫人身惟陰陽合和以為氣而風木由陰以達陽故陰虛則風實陽虛則風虛助陽氣者正所以補風虛也是故虛風為病有緣於清陽不升濁陰不降致肝木生發之氣不得暢而生者有因脾胃有病致土敗木侮而生者天麻為物根則抽苗直上有自內達外之理苗則結子下歸有自表入裏之象即其有風不動無風自搖乃暢其風之鬱而不使濫靜鎮其風之變而不使羣動暢風鬱乃自內達外之功鎮風變乃自表入裏之效就其一往一來而已能使靜作動返動為靜是其功用斷在根而不在苗風為六氣之首人身元氣通天之本也元氣出於地風化即與之竝育竝行故其治小兒驚氣風癇開寶眩暈頭痛元素皆風虛之不能達於陽也可謂自內達外然亦不外乎自表入裏之體其治諸風溼痹開寶冷氣𢂽痹癱緩不隨甄權可謂自表入裏然即具有自內達外之用是則天麻之用殆亦侈乎所云木乘土虛是木居其實矣何以亦曰風虛蓋胃者五臟六腑之本食氣入胃首即散精於肝中土虛則風木之化源傷可不謂風虛乎就風氣之能達是為宣陰挽風氣之能回是為和陽和陽則所謂自表入裏者也宣陰則所謂自內達外者也卷柏宿根紫色多鬚春生苗似柏葉而細碎拳攣如雞足青黃色高三五寸無花子多生石上去下近石有沙土處用之圖經味辛氣溫之物性秉於陽計其狀當魁梧奇偉而胡為其攣拳曲跽也攣拳曲跽之物即使治攣拳曲跽之病且何故哉說者謂春分之時陰方離於陽是物以發故能使陰與陽交合而主至陰之地為邪所薄者豫謂不然友人陸君子全幼時畜此為戲具言其乾時黃萎拳曲絶無可愛但漬之水中則挺發森秀之概扶搖動蕩之致蒨翠蒼碧之色片晌間炫目驚人及去水令乾黃萎拳曲猶故屢漬屢乾不為敗壞且徐氏藥對謂其生於立冬為桑螵蛸陽起石使是其能於至陰中尉帖以醒陽於至陽中委曲以和陰試觀本經別録所主何莫非陰中之陽不達陽中之陰不順耶則是物為體陽而就陰用陰以起陽無疑矣藍種頗多然不離乎生甚晚而長最速以夏茂而饒汁盧子繇謂肝主色自入為青青出於藍而深於藍則以色用為入肝矣其多汁而氣寒則為及腎味苦而性通徹則為及心劉潛江謂其取精於水長養於火以達其木之用木用達則水火合和之氣畢達舉五臟之鬱為火者皆由此而達正氣流行邪氣渙釋故曰解毒毒固熱入人身而脅人正氣為附從者正氣不為所脅而自行所當行毒又焉能為患有不解散者哉豫謂如此疏藍亦既明徹矣第其所以內理痰火外療盛熱者謂何夫木盛遇熱則津生天地之軌則也人身則有壯熱而陰反耗陰耗而熱益猖者投以寒涼正患其拒而相搏改與滋養又恐其壅而不化惟此津隨熱極而生熱以津濟而解者豈不適相當耶此其療盛熱也至如痰火則上之陽不入陰而與之化反灼陰而使之消若增陰則徒能隨陰以消暫延一時之涸竭若散火則并陰使盡且不與陰濟之火又焉能化而得散此其充熱以津化津入熱為至理所注矣然急難稍延者用藍汁緩能及濟者用藍實微而未猖者用青黛各擇其宜焉可矣絡石生陰溼處冬夏常青其蔓折之有白汁葉圓如橘正青色其莖蔓延莖節著處即生根鬚包絡石上花白子黑參唐本圖經石者土欲化金而未成也於藏氣為帖緊相承之脾肺絡石者木水土相參之化也於藏氣為間於脾腎之肝肝主疏泄暢達者也乃絡石疏泄暢達獨於帖緊相承之脾肺依附甚固則凡脾肺所主肌肉皮毛間倘有邪氣附著生氣不榮吸攝津液以資啓溉致津液乾涸仍無濟於生氣者得此疏泄暢達焉不特枯竭轉而榮茂且乾涸轉而潤澤矣何則以脾肺本主津液相輸灌也惟然則於死肌癰傷口乾舌焦癰腫不消喉舌腫水漿不下固有會矣特謂其主於風熱何也夫不因風熱則死肌癰傷口乾舌焦癰腫不消喉舌腫水漿不下又何自而來但其味苦溫苦溫非治風熱者茲則所宜闡明者矣蓋諸證者火結非假津涸非真乃陽劫陰以自資陰被劫而不得化故惟陽能入之陰則不能入也設使用寒必被陽格用熱又屬耗陰惟苦以發之溫以散之相比成功仍是冬夏不雕寒暑皆榮之物生乎陰而長於陽絡於陰而伸夫陽者至真要大論所謂微者逆之甚者從之是矣雖然別録所係大驚入腹除邪氣則氣亂而邪從以入也其所謂養腎主腰臗痛堅筋骨利關節不與他主治大相徑庭耶蓋人氣升降如環無端第下者必化於腎而後能升上者必化於肺而後能降絡石之於肺雖邪阻氣撓顛連如石亦能化而通之行而降之若是假使在上已無病而下之機關猶未轉則儘利其上其在下者能常自窒乎矧絡石原生於陰溼處則其機關本自下而上其奏功則自上而下耳徑庭云乎哉蒺藜葉如初生皂角葉齊整可愛刺蒺藜狀如菠稜子及細菱三角四刺實有仁白蒺藜結莢長寸許內子大如芝麻狀如羊腎而帶緑色綱目蒺藜子鋒穎四出堅鋭銛利謂非象金不可而其味苦其氣溫則又皆屬乎火是之謂金與火遇火在金中夫金與火之接也始則相守繼則就鎔終則交流相守則金之蕪雜難消者消就鎔則金之凝重不動者動交流則火之炎上不下者下凝重者動謂之形隨性化炎上者下謂之性隨形化其在人身性本於氣形充於血兩者不咸則有性與形違而為積聚喉痹者有形與性違而為惡血癥結乳難者得此交相化而適相成之物又烏能不已耶而別録又恐後人誤會本經用蒺藜泛治腹中惡血癥結積聚也故其命意措辭若謂就金言金在上治上焉者夫曰身體風癢則疾必不在分肉筋骨而在肌膚皮毛固肺之合也又況頭痛咳逆傷肺肺痿皆火守於金之病火與金本相仇因相仇而致病則以相守而生長之物化病氣為生氣猶不可謂極允帖之治乎而後人識透此關莫妙於大明以此益精療水藏冷小便多止遺瀝泄精溺血夫火金相仇為病於上但得其就鎔下流則併化為水且非冷水而為暖水又何水藏精溺二道之不受益也夫然故沙苑蒺藜之刺在莖而不在實實形正似腎者則金火之交鎔向下竝在莖中而實遂大擅益下之功於精溺二道更著良猷矣肉蓯蓉二月叢生大木間及土塹垣中生時似肉皮如松子有鱗甲苗下有根廣扁柔潤長尺餘色紫黑浸挼去黑水鹹酸味六書故挼按揉也宛如殷紙摺疊成卷殷赤黑色參圖經陽翳於陰其氣終伸陽蠱於陰其氣則撓何也翳陽之陰冽而易摧蠱陽之陰柔而難破也然蠱於陰而不必於陰則其性常欲伸惟伸者自伸蠱者自蠱故推其源為陰蠱陽究其實已陰隨陽矣於此而有物似焉其入於人身能不伸陰中之陽而撓陽以育陰耶河西今甘肅最寒沍八月已冰二月未泮大木間及土塹垣中又日光所不屆適當其時在地之陽奮然欲出上無所引旁有所撓於是生蓯蓉質柔而屬陽氣溫而主降乃火為水制故色紫黑而味甘酸鹹陽不遂其升陰方幸其固乃不直伸而橫溢故形廣扁而皮有鱗甲須陰乾者炙之以火恐陰消於陽也必浸去酸鹹味者欲全陽之用也夫然故味酸可去鹹可去而甘不可去色紫可去黑可去而殷不可去遂可知其義取於陰蠱其用惟在陽伸去其陰之蠱正以佐其陽之伸五勞七傷者或因用力而劫陽於外或因用心而耗陰於內俾陽就陰範陽供陰使是為補中因其衰而彰之之治也莖中陽盛而陰為所迫則熱且遺陰盛而陽不相下則寒且痛助其陽即以和其陰而痛自除因其重而減之之治也陰陽相浹精氣相抱斯藏精而不瀉之五臟自安五臟既安而精何能不充陰何能不強而施化遂非浪舉矣婦人癥瘕亦陰不柔而陽遭困者方宜黃帝問五勞七傷於高陽負負曰一曰陰衰二曰精清三曰精少四曰陰消五曰囊下溼六曰腰一作胸脅苦痛七曰膝厥痛冷不欲行骨蒸遠視淚出口乾腹中鳴時有熱小便淋瀝莖中痛或精自出有病如此所謂七傷一曰志勞二曰思勞三曰心勞四曰憂勞五曰疲勞此為五勞見千金石韋丸下孫真人曰五勞者一曰志勞二曰想勞三曰憂勞四曰心勞五曰疲勞七傷者一曰肝傷善夢二曰心傷善忘三曰脾傷善飲四曰肺傷善痿五曰腎傷善唾六曰骨傷善饑七曰衇傷善嗽凡遠思強慮傷人憂恚悲哀傷人喜樂過度傷人忿怒不解傷人汲汲所願傷人戚戚所患傷人寒暄失節傷人故曰五勞七傷也千金腎臟門補腎論其述五勞略同七傷則有異即孫真人之論亦有兩端蓯蓉所主究以何者為是夫此固不必深求其合第別其用力用心可矣且蓯蓉須補中者乃可用設中氣自旺而不必補則非所宜如善飲善饑等候何嘗不蒸騰有力運化有權猶可以味甘性溫之物與之乎與之是使渴者益渴饑者益饑也然則宜補中者果安在夫蓯蓉之生精固優故能撓夫氣氣固旺故不致汨於精五勞七傷名目雖多約其歸不越傷氣傷精二種傷氣者如燭之燃芯盡而膏亦竭也傷精者如舟之行水涸而棹難鼓也是故或精枯於下而火浮於上或火熾於上而引精自資中央者須火下畜其氣乃生生乃固火既違順容納自拙得此以氣致精藉精行氣之蓯蓉使火回精聚則在中之生氣又何能不受益耶就使善飲善饑亦難保無精竭火離仍須補中者是故謂補中於五勞七傷僅得治法之一節則可謂蓯蓉於補中猶有所隔閡則不可謂蓯蓉之補中僅得施於五勞七傷則可謂凡補中者皆得用蓯蓉則不可以本經固云主五勞七傷補中不云補中主五勞七傷也蓯蓉之用以陰涵陽則陽不僭以陽聚陰則陰不離是其旨一近乎滑潤一近乎固攝別録所謂止利者為取其滑潤耶抑取其固攝耶夫別録固不但云止利而云除膀胱邪氣腰痛止利是亦可識其故矣誠分而言之則利有泄瀉腸澼腰痛有氣血痹阻膀胱邪氣有淋濁畜血為寒為濕為熱均無不可若遽與蓯蓉是使陽錮而終難伸陰敝而終難化可治之疾不反致難治歟惟合而言之則因其氣之本相連屬欲就陰而陰不容遂轉隸於陽而還攻夫陰陰復不受則或乘勢纍墜下迫或痛甚不止故曰除膀胱邪氣腰痛止利不曰除膀胱邪氣腰痛下利也此痛不常有惟久病久利始見之千金方冷利增損健脾丸治丈夫虛勞五臟六腑傷敗受冷初作滯下久則變五色赤黑如爛腸極腥穢者中用蓯蓉可證矣其不利者亦必腰痛而小便有故方與之宜上品草十七味木九味續斷三月以後生苗幹四稜似苧麻葉兩兩相對而生四月開花紅白色似益母花根如大薊黃白色節節斷皮黃皺小薊二月生苗四月高尺餘多刺心中出花頭如紅藍花而青紫色大薊苗根與此相似但肥大耳四月釆苗九月釆根竝陰乾用圖經續斷與薊不獨其根形相似竝有治血之功即薊之訓亦可作續小戴記樂記封黃帝之後於薊注薊或作續是其物原一類二種以其根之斷不斷為別可也斷不斷既有別則其義自已分故別録於續斷所主之血曰漏於大薊所主之血曰沃漏者對斷而言是有所傷而漏泄也沃者對不斷而言是沃於此而滲出也受傷而漏泄者器也受沃而滲出者土也欲土之不易滲必使之厚欲器之不易傷必使之堅甘者固以厚土而苦原善堅裏也則二物之同工二物之異調既可舉其概矣況斷者折之不能斷以其筋膜堅韌也不斷者折之反易斷以其肌肉豐腴也故續斷之功能曰續筋骨大薊之功能曰令人肥健是猶不可識其體用之全乎兩物之根皆黃白兩物之花俱帶紅是脾輸精以歸肺肺奉津以從心心受之而化為血血者周流無滯之物挾苦則主降挾甘則主緩降則其功止能及下緩則上下皆得受益故續斷主治竝係下焦大薊主治并該吐衄此其同中之異也胎以奉養豐澤而安乳以血衇疏通而易移其疏通使及乎他則機關可利惡血可行斷傷能續腰痛能止移其豐澤使奉乎他則血可保精可養然恃以疏通者氣恃以豐澤者血血是已化之氣氣是未化之血血者難成氣則易續兩物花時不甚相懸而兩物之生幾間二月則氣以疏通而速血以濡緩而遲其實原歸一本此其異中之同也誠如是言則續斷之本經別録薊之大者小者皆可混而無別乎夫續斷本經但言味苦原取其堅則相續故傷寒不足處邪氣乘而橫梗焉續其經衇依法流行俾無空隙而橫梗者自不能容金而生瘡癰而致傷跌而為折氣有斷而血亦有所不繼也立其氣血之幹斷者自續不繼者自源源而至然當橫梗不續而能入則必有通之者存故別録更推其味必有辛辛者通也而注其因傷而漏者必由內惟其由內故楨幹立而枝節自成此續斷之別録原以注本經而暢其義非有所增飾舉其粹以疏之亦不得為混矣薊之養精保血原不獨言小者特大者力雄乎外小者力聚於內舉其大者而小者自可知非小者不能止沃與吐衄大者不能養與保也是別録於大小薊根之養精保血原未嘗不混以養精保血屬小薊則後世之強生分別耳要而言之養精者能養之不能充之保血者能充之且能固之血充且固自得令人肥精有所養自足令人健然筋骨非精莫續斷折非血莫聯既能續筋骨復堪聯斷折豈反不得為精之充血之固耶是故元氣之受傷有輕重而物之功能遂有難易也且充固之力而僅得補罅漏是其功在內而不見乎外原無罅漏而更得充且固是其驗遂著於外矣故續斷之力在內而不顯薊之力在外而得彰在內者補中有行在外者行中有補劉潛江之言本未嘗無謂特以形用之物自當論其形不必斤斤然攀附於陰陽攛改其氣味耳漏廬俗名莢蒿莖葉如白蒿花黃生莢端莖長似細麻如筯許有四五瓣七月八月後皆異黑於衆草蒿之類也常用其莖葉及子未見用根唐本漏廬體狀大似白蒿凡以蒿名者不一而足漏盧既似蒿何獨靳一字稱謂不以相假耶不知諸蒿與漏盧莫不生以春中瘁以秋杪惟蒿於夏秋之交繁盛馥郁一若助陽明燥金之化掃太陰溼土之軌者故於溼熱糾紛之候最所擅長專以氣為用遂以氣為名漏廬則氣不芳烈但於初生之時已顯陽明之白於陽明之令又顯太陽之黑故不以氣名而以色稱禮祭義焄蒿悽愴注蒿氣蒸出貌釋名釋地土黑曰盧盧然解散也曰漏盧者固謂其能使溼滲泄而熱解散也夫溼與熱比原未嘗必為人患試想中宮絪縕之氣所以輸脾歸肺者為何豈不藉以奉生身轉氣化哉特偶有所偏則相遭而不相下或溼壅熱而不行或熱劫溼而就燥故在膚腠則為風瘙疥癢在肌肉則為癰疽瘡痔在筋節則為痹痛拘緩在骨骱則為疼重攣急此皆諸蒿得為力其間藉氣之蒸出足以透達其溼性之耗散足以消除其熱矣國語晉語使民蒿然忘其安樂注蒿耗也苟溼壅於內欲蒸出而不能熱熾於外欲消耗而莫及為惡瘡疽痔溼痹而皮膚熱焉則蒿遂無所施技而當導其溼使就太陽寒水氣化然後耗散之性能達於皮膚是蒿令溼熱并合而除盧令溼熱分背而散若目以蒿詎不枉盧之所以為盧也然則本經謂其下乳汁別録謂其止遺溺旨適相反何歟夫溺以溫化而通乳以清純而下遺溺因乎熱乳不下亦因乎熱非有二也惟其利水由於除熱是以能使不應行者歸於應行而應行者不得應行而不行則漏廬者謂為瘍證逐溼之劑可也營實薔薇子也薔薇野生林塹間春抽嫩蕻唐韻蕻草菜心長也小兒搯去皮刺食之既長則成叢似蔓而莖硬多刺小葉尖薄有細齒四五月開花四出黃心有白色粉紅二種結子成簇生青熟紅其核有白毛如金櫻子核八月釆之根釆無時綱目凡草木之叢生者非一根生多莖則每根各生莖未有莖多根多而離地之所自彙為一者則薔薇是是其莖之氣并於下根之氣并於上必有交互之理凡草木生刺於莖者必刺根深在莖中莖皮連蒙刺上縱削去之莖必有節未有才剝即刺脫非特脫去無傷皮之痕即削去其皮莖間并無刺根之跡者亦惟薔薇是是其贅於外者可使離於內脫於外者可使不傷其內交互之理蓋即寓於此矣其理云何曰實主歸藏則收功於內根主發散則收功於外而已何以言之夫癰疽惡瘡結肉跌筋敗瘡熱氣陰蝕不瘳病根皆在關節之外而致關節不利則是邪從外擾用能使內者安而外者自脫非所謂病在外而使收功於內乎五臟客熱邪逆氣疽癩諸惡瘡金瘡傷撻病根咸在肌肉之內而致肌肉久不斂則是邪從內外達能使外者斂而內者自和非所謂病在內而使收功於外乎不然則泄利必隨腹痛未有腹痛不瘳泄利先止者自當曰止腹痛泄利矣而曰止泄利腹痛何哉營實方書用者甚罕薔薇根皮則千金外臺於口瘡為必需之物亦可見為病發於內而甚於外外不差則內決無可安之理者所倚藉矣丹參二月生苗高一尺許莖方有稜青色一枝五葉葉相對如野蘇薄荷背尖皺且有毛三月至九月開小花成穗如蛾紫色中有細子根大者如指皮丹肉紫長尺餘一苗數根參圖經綱目腸鳴幽幽如走水寒熱積聚癥瘕煩滿不必盡由心腹邪氣而冠以心腹邪氣者見諸證若不由心腹邪氣則不得用丹參也心腹邪氣不僅為腸鳴幽幽如走水寒熱積聚癥瘕煩滿而首揭心腹邪氣者見諸證外若更有他病縱係乎心腹邪氣亦不得用丹參也然則別録所載諸證若心腹痼疾結氣風邪留熱固與本經相應而相發明矣惟養血及腰脊強腳痹豈亦可係於心腹邪氣耶係乎心腹邪氣者尚除腸鳴幽幽如走水寒熱積聚癥瘕煩滿外不得用丹參況不係心腹邪氣烏乎可用殊不知養血主腰脊強腳痹正所以發明腸鳴幽幽如走水寒熱積聚癥瘕煩滿係心腹邪氣所為耳何以言之夫腹而冠以心則非胸中腹中之謂邪氣而揭以心腹則非表邪裏邪之謂心者主運量血衇腹者主容受水穀血衇者水穀精微之所由敷布水穀者血衇運量之所以資藉不正之氣結於兩處所資既滯運量遂不靈而極滑利道遠之所先受其殃強者強痹者痹矣故惟腰脊強腳痹而不發熱不痠疼方可以知病在血衇而係乎心故有煩惟心煩而不發熱不痠疼方有以知病在水穀之氣滯而係乎腹故有滿既煩且滿則氣之環周不休者將盡為之痹而尋其治遂不得不求之於能養血者矣丹參之養血在取其色丹參之色外丹而內紫紫者赤黑相兼水火竝形之色也水火竝形而和原係太和之象惟其內雖紫而外則丹丹不能入紫不能出則紫為寒熱積聚丹為致生氣於寒熱積聚之象惟能致生氣於寒熱積聚中故逢春半而苗莖勃發數根而共一苗一苗而發多枝一枝而標五葉葉必相對且皺而有文有毛是其內引肝脾所統所藏之血一歸心之運量敷布於兩兩相對之經衇且外及乎皮毛尤可貴者三月開花九月乃已他物之發揚底蘊無有過於此者惟其如是方有合乎血既盛而華遂不易衰則其能使在內之血方與熱為水穀之氣所搏激而為聲凝而成塊者無不血復為流動之血熱化為溫煦之氣而敷布周浹豈復有腸鳴幽幽如走水之寒熱積聚與癥瘕煩滿之患哉曰益氣者正詡其流動溫煦之功否則味苦氣寒安能益氣茜草十二月生苗蔓延數尺生草木上方莖中空有筋外有細刺數寸一節每節五葉葉如烏藥葉而糙澀面青背緑七八月開花結實如小椒大中有細子根紫赤色綱目桂枝附子湯白朮附子湯甘草附子湯為寒溼風痹補中者也茵陳五苓散小建中湯小半夏湯為黃疸補中者也奈何茜根亦能為寒溼風痹黃疸補中夫惟入必有蹤守必有界使寒溼風外據氣遂應之而成痹溼熱內蘊又招外邪而為疸樞機悉在氣化患害不出筋骨則欲為之補中誠無踰於諸方矣孰知能為痹者豈但筋骨凡膚腠肌肉血衇皆能致之即如血衇有壅營氣遂痹而不與衛諧衛失營歡捍禦弛縱如是外有寒溼風則得而乘之內有溼熱則不得而驅之此其所謂補中固宜有異於氣化為之者而必以茜根之色赤莖空者為行其壅而通血衇矣雖然此其功在行壅則謂能通血者有之而別録偏以之止血主內崩下血何耶夫衇絡結澀則血不四周血不能四周則不為內崩下血且將何往通其衇絡正以使血不內崩此最淺近易明者也特驗證之法主治之所以然尚宜明晰體究耳茜以十二月生苗二月三月釆根七月八月開花結實是取其氣方行於莖時也其根紫赤其莖緣物中空不似血之行於衇乎莖上有刺不似衇之有絡乎數寸一節每節五葉不似衇之有穴有會乎葉糙澀而不光不似血之結澀乎能使血行於衇且偏使結澀乾涸之所自通停頓會聚之所不滯是主治之所以然也若驗證之方則別録固已言之矣曰踒跌是也蓋絡衇不澤則機關必有弛處行動之時遂善跌矣然則膀胱不足何也血氣形志篇曰太陽常多血少氣夫足太陽膀胱者州都之官津液藏焉氣化則能出矣是其用重在氣也而其經支別之多穴會之多甲於十二經幸其灌輸相通呼吸相濟猶足以自立而血且結澀焉尚能為有餘哉蘭喜生陰地幽谷葉如麥虋冬而闊且韌長及一二尺四時皆青花黃緑色中間瓣上有細紫點根土黃色一本數十株大如筯頭虯曲而耎形似續斷故名土續斷其花初冬即發春仲乃開畏寒惡熱最利和風疏蕩灌水宜令常溼又不得沮洳參本草衍義素問奇病論帝曰有病口甘者病名為何何以得之岐伯曰此五氣之溢名曰脾疸夫五味入口藏於胃脾為之行其精氣津液在脾故令人口甘此肥美之所發也此人必數食而多肥肥者令人內熱甘者令人中滿故其氣上溢轉為消渴治之以蘭除陳氣也津液在脾不輸化而上溢自關水道不利積久相因陽盛者為內熱中滿陽虛者為胸中痰癖故宜以辛平氣味不燥復不滋者引而利之除而去之水道既通肥甘自化本經素問原默相印合無二致也畜蘭家論溉灌之法曰凡水須用雨水河水皮屑水魚腥水雞毛水浴湯尤善積久陳水上生緑苔者大忌井水雪霜尤忌春雪一滴著葉則一葉焦枯觀此則病之受清洌者與此不相宜矣其論位置之法曰不宜太高高則衝陽亦不可太低低則隱風地不必曠曠則有日亦不可太狹狹則蔽氣觀此則著於四畔之病亦與此不宜矣其論趨向之法曰前宜面南後宜背北蓋欲通南薰而障北吹也右宜近林左宜近野欲延東日而避西陽也觀此則病之偏寒偏熱者又與此不宜矣惟其獨標清化不厭肥甘飽飫肥甘偏培清化可謂鍾清化於肥甘引肥甘從清化者非耶此素問之旨也惟其愛趨陽和乃嫌烈日最喜疏蕩復惡寒風可謂延溫煦以化陰引陰凝使隨陽者非耶此本經之旨也蔣漢房曰他草他花芳者皆得收藏以為香獨蘭陳則絶無香味故取其新鮮以化陳腐有貴者喜蘭畜百千本命僮司之其僮竊取花瓣露珠積成盈甌一夕啜之覺沁入遍體皆為爽然而口氣清芳者經時歷月因致多壽是其化陳為新之功固何如乎李瀕湖等毒口詆蘭以為盜竊蘭名而以孫兒菊為真蘭不知所謂真蘭者其功能果得與素問本經切合如此否也忍冬藤生覆草木上莖苗紫赤色宿蔓有薄皮膜之其嫩蔓有毛對節生葉葉似薛荔而青有澀毛三四月開花長寸許一蒂兩花二瓣一大一小如半邊狀長蕊花初開者蕊瓣俱色白經二三日則變黃色新舊相參黃白相映故呼金銀花氣甚芬芳花四月采參唐本綱目李瀕湖謂忍冬古人稱其治風除脹而後世不知後世稱其消腫散毒而昔人未言乃知古今之理萬變不同不可一轍論也嗚呼以寒熱身腫為瘡癰猶之喻日形以銅槃喻日光以燭也以寒熱為風以腫為脹則扣槃得聲捫籥得形而謂為日矣金匱要略曰諸浮數衇應當發熱而反灑淅惡寒若有痛處當發其癰師曰諸癰腫欲知有膿無膿以手掩腫上熱者為有膿不熱者為無膿前則言痛而不言腫後則言腫而不言痛亦可謂之風痛膿脹乎是知言痛則腫在其中言腫則痛在其中互文見義無不可者則寒熱身腫非癰膿而何且古人措意命物必有精詣從紫莖以開白花從白花而轉黃色不似由血衇生腫腐即腫腐致潰膿耶人身氣血以是而變生為死即使草木精神以是而變瘁為榮者與之此所謂鍾生氣於病中化病氣為生氣者也故其所主不出於由寒熱而身有腫處由腫而遂痛由痛而肉腐由腐而潰膿善夫後人之以是治熱毒下利膿血也亦以血衇遇熱而腫痛而腐潰而下膿血然究其源亦必始於寒熱乃當則所謂寒熱身腫者古今不易之理未嘗稍變謂為萬變不同不可一轍論也冤矣地膚子根獨條叢每根發二三十莖莖有赤有黃柔弱不勝舉一條之上復發多枝葉青而細七月開黃花旋即結子圖經參唐本盧芷園曰地膚子味苦氣寒得太陽寒水氣化蓋太陽之氣上及九天下徹九泉外彌膚腠故地膚之功上及頭而聰耳明目下入膀胱而利水去疝外去皮膚熱氣而令潤澤劉潛江曰膀胱與腎為表裏而屬太陽太陽者主統陽氣護衛一身所謂衛出下焦為陰中之陽者也膀胱有熱而小便不利固病於府之陽不得宣然其源莫不成於藏之陰不能濟於本經以補中益精氣踵於主膀胱熱利小便之後遂確可知在府之陽和則在藏之陰清在藏之陰清則在府之陽宣陰陽合同以化為氣矣但觀其去根不多隨即分枝莖葉周遭四出層擁而上非其不離陰之厚以為陽之茁者乎原從陰之厚以宣陽還從陽之宣以歸陰故方書用之治淋與目疾不一而足也豫謂信如此則似地膚子之性主上行者無如太陽本下行衛氣之發韌也亦下行惟其下行極而上少陰遂曳之復升是利水去熱助太陽之降而補中益精氣則資少陰之升之謂也試核以張隱庵根莖升子降之義則莖葉搗汁主利治目熱暗子主利水兩俱諧適於星羅碁布中引陰以除膀胱之熱即從絪縕化育中引氣以承少陰之行於以上徹耳目外達皮毛咸得其益可謂補中益精氣也不然苦寒斷非補中之品疏利決無益精之能何可恃耶杜若生陰地苗似廉薑葉似薑而有文理根似高良薑而細又似旋覆花殆欲相亂味辛香花黃子赤色大如棘子中似豆蔻參隱居唐本蜀本豆蔻即今草豆蔻也苗似蘆葉似山薑杜若輩根似高良薑當春花作穗嫩葉卷之而生初如芙蓉穗頭深紅色葉漸展花漸出而色漸淡亦有黃白色者實若龍眼子而鋭皮無鱗甲中子若石榴瓣十月采圖經參唐本蜀本肉豆蔻春生苗實以豆蔻而圓小皮紫緊薄中肉辛辣六月七月采圖經白豆蔻苗類芭蕉葉似杜若長八九尺冬夏不雕花淺黃色子作朵如葡萄初出微青熟則變白拾遺圖經詠美人香草者古云杜若不云豆蔻今云豆蔻不云杜若蜀本云杜若子如豆蔻則杜若者豆蔻之根豆蔻者杜若之用至草豆蔻肉豆蔻白豆蔻則皆豆蔻之別種矣其所以古今異尚者蓋取氣為用之物愈南愈佳邃古以來僻壤未通土産之物何由識拔故杜若者別録謂生武陵後世聲教日擴沅湘已南遂有百粵百粵已外聯及島夷故草豆蔻生於閔肉豆蔻生於粵而白豆蔻則自番舶來非是者不中藥用也且肆志者今甚於古恬淡者古勝於今恬淡者為病多取乎藥物之發肆志者為病多取乎藥物之降根者本發實者本降故根之功用日泯實之功用日著始自人情之趨嚮遂感騷客之雅懷今時杜若無有識者豆蔻則人多囊貯為爽口之需此藥物興滅之由即世道升降之會也杜若今人不用且無有識者而仍疏之亦使人知諸豆蔻為杜若之類非古人不知用也且根之用今時仍有高良薑高良薑子即紅豆蔻所謂講明杜若之用即可以擴充高良薑之用至根實之異以云乎味則辛者在根為升在實為通苦者在根為發在實為降甘者在根為緩中在實為橫散以云乎氣則溫者在根為煦在實為疏是故以根而言杜若於中則主胸脅下氣溫中以胸脅下氣結而不解多由水飲芳香流氣之物使飲與氣和斯解以明中無從寒而化者則不受溫遂非杜若之所可治也於上則主風入腦戶頭腫痛多涕淚出以涕淚由風鼓而出芳香流氣之物使風不鼓津乃解以明上無涕淚雖頭腫痛則不勝升煦亦非杜若所可治也所以上則關風木而中則關寒水者以風原飄揚而上水原順流而下寒主凝水風主激水杜若之治則上可及巔而下止及胸脅自腹已下雖有水飲與氣相結非杜若可為力以杜若原主升也以實而言則諸豆蔻之味極後皆涼涼者收肅之象也白豆蔻之味惟辛故其治最在上為自肺及胃疏滯去冷之用曰主積冷氣止吐逆反胃消穀下氣皆係上焦之患草豆蔻辛後有微甘則其治在中為脾胃間疏滯去冷之用曰主溫中心腹痛嘔吐皆係中焦之患肉豆蔻辛中帶苦故其治最在下為自胃及大腸疏滯去冷之用曰主溫中治積冷心腹脹痛霍亂中惡冷疰嘔沫消食止泄皆從中及下之患大率三物之所長而與衆疏滯去冷不同者惟在味後之涼涼為收肅故上中得之則止嘔吐中下得之則止泄利皆以其收肅也疏在前而收在後亦順氣中良劑哉無怪乎嗜者之多也別有草果者因瀕湖混於草豆蔻條中後人遂以草豆蔻主治當之詳其味極辛其氣猛而臭似斑蝥以驅脾胃寒溼鬱滯辟嶺南瘴癘猶可若屬以溫中心腹痛嘔吐用不勝任徒削人元氣用者審之沙參二月生苗葉如初生小葵葉而團扁不光八九月抽莖高一二尺莖上之葉則尖長如枸杞葉而小有細齒秋月葉間開小紫花長二三分狀如鈴鐸五出白蕊亦有白花者竝結實大如冬青實中有細子霜後苗枯其根生沙地者長尺餘大一虎口黃土地者短而小根莖皆有白汁深秋釆者白而實春月釆者微黃而虛小綱目氣者物之陽味者物之陰沙參於氣得其陰於味得其陽苦屬火甘屬土所謂質陰用陽者人身質陰用陽惟脾與肺以其體柔而動性降而處高也而沙參發於早春釆於深秋偏膺酷暑餘化開紫色之花不似肺挹土氣以供火氣之化乎抑其任炎𭶟之逼爍終白汁之流漓不似中焦之化津化血竝行不悖無相奪倫乎曰補中益肺氣明所以益肺氣者由於補中也曰血積驚氣除寒熱者何謂能於兩項病中除寒熱爾蓋寒熱皆由陰陽相爭血積則阻氣之行氣亂則礙血之流多有成寒熱者沙參藏白汁而開紫花開紫花而仍藏白汁氣亂者按而收之優而柔之血積者迎而化之條而行之則血與氣遂道順而暢達寒熱有不止者哉此言其因也若其狀則別録所謂者是夫胸痹本氣病然有心痛而無腹痛胸痹而心腹俱痛則涉於血矣惟假氣之澤滑血之流血之積者自隨氣而化而氣之阻者自隨血而行此津枯血阻氣遂不利之胸痹也頭痛皮間熱本外感證然未有不惡風惡寒者即但熱無寒為陽明熱病始得之一日亦必惡寒今頭痛皮間熱乃結熱邪氣所成既明無與於風寒則其為氣亂而生熱熱蒸而血沸矣惟布津以柔氣順氣以定血氣之亂者自隨血而化血之沸者自隨氣而化此津枯氣入血因沸逆之頭痛皮間熱也氣行血隨血澄氣靜此之謂五臟安溯五臟之所以安能外於補中乎氣血之不利因此而利則氣血之利者因此則為利人矣故曰久服利人龍鬚叢生狀如粽心草及鳧茈苗直上夏月莖端小穗開花結細實竝無枝葉綱目凡物之生必與天地之氣相呼吸既與天地之氣相呼吸則必獻技效靈以昭秉畀之所自在動物則革角爪牙在植物則枝葉氣味是也獨石龍芻者無枝無葉味淡氣微森然叢立於風日雨露中謂其不與天地之氣相呼吸則亦開花結實謂其與天地之氣相呼吸則漠然無鍾賦之情狀可紀此物之祕其氣而不發泄者然惟如此乃發泄愈甚耳夫無葉之草麻黃木賊皆為發泄之尤然猶有枝鳧茈之苗足與此類然其用猶在根此則不用其根與花與實但有取於不生枝葉之莖直已兼麻黃木賊之發泄遏鬱鳧茈之消磨通降而胥擅之矣蓋其外似毛色白而甚纖發泄之驗也中似穰彌疏而有間通降之驗也第通牽於發發掣於通則力不純氣不猛故凡心腹邪氣緣內虛不足痞滿身無潤澤而應汗者取六分之發四分之通小便不利淋閉風溼鬼疰莖中熱痛而應利者取六分之通四分之發以正氣實則邪并正氣虛則邪漫惟其并而後可或發或通徑情直行解一面則面面自然消渙惟其漫則僅可發中寓通通中寓發兩路開導邪氣方得流行且取其無葉無枝不至別出他歧更生患害此摧剛以柔用分為合之權衡也薇銜叢生似茺蔚白頭翁其葉有毛莖赤花黃根赤黑色有風不動無風獨搖參唐本蜀本水經注氣鼓津溢火動水隨科其咎固係鼓動之非宜究其歸應思隨從之何易薇銜根黑兼赤雖已火攪水中然發莖但赤則僅火動而水不動故卒能花開黃色下足以致水氣之轉輸上即可吸火氣為生氣而收縮夫陰陽兼操乎動靜是其有風不動為不受病氣憑陵而無風獨搖為暗使元氣生長矣夫風溼痹靜病也風溼痹而歷節痛則其患在動矣悸氣水病也悸氣而為驚癇之掣縱吐舌之伸縮則其患在火矣即鼠瘻癰腫固亦靜病乃實由於賊風之動動者能使之不動不動者能使之動竟已可制病之變幻而況化火氣為生氣浥水氣得灌輸以大會於中黃和調於上下則癥之暴者為適動而才靜水之可逐者為方靜而今動痿蹶之得受療者為上逆而咳所發素問生氣通天論猶不可以皆已乎爛醉受風酒之氣隨風氣而外飄揚酒之質侵脾家而中遲鈍是以身熱懈惰汗出如浴惡風少氣治其中治其質則朮與澤藛優為之治其外治其氣則惟薇銜是賴矣槐極高大其木材堅重有青白黃黑等色其葉有大而黑者有細而青緑者有晝合夜開者竝以季春五日而兔目十日而鼠耳更旬而始規二旬而葉成四月五月開黃花當未開時狀如米粒花以是時采六月七月結實作角連珠中有黑子以子連多者為好十月上巳日釆之圖經參綱目陽淫於上不與陰浹則津自不攝陽實於下不與陰浹則血自不藏而陽則咸化為風特在上為風虛在下為風燥斯其異耳風虛且津不攝則五內邪氣熱而目暗風燥且血不藏則五痔火瘡而絶傷然欲求其本皆當責之於肝所謂木熱則津溢肝熱則血漏是也肝木之熱何以取治於槐周禮四時改火冬取槐檀非以其能生木耶且開花於陽之極盛結角於陽之未衰而得味為苦得氣且寒可不謂當至陽之化育得鍾純陰之性味乎血者源於水而成於火正與是相肖故為入肝涼血之劑無惑也然其花與實之別何在蓋花者開散之告終實者生發之能始故婦人乳瘕子藏急痛病之在內者則於子有專功治皮膚風腸風瀉血赤白利病之連外者則於花為獨效同為涼血而用有內外之殊是其別矣枸杞二月生葉如石榴葉而軟薄五月再生七月復發隨開小紅紫花便結紅實形微長如棗核其根皮如遠志圖經晷度愈西收肅愈甚枸杞為物葉歲三發木氣最暢乃當收肅之候且花且實此之謂以金成木色赤屬火火衰畏水火盛耗水枸杞之實內外純丹乃飽含津液嚴寒不墜此之謂從火制水以金成木是於祕密中行生發故主五內邪氣從火制水是於焦涸中化滋柔故主熱中消渴此一根之功一實之效已明晰曉示無復遺義然所謂周痹風溼者卻宜何所取裁夫周痹在血衇之中隨衇以上隨衇以下由風寒溼客於外分肉之間迫切而為沫沫得寒則聚聚則排分肉而分裂分裂則痛因邪而成沫以沫而致痛謂不似其實之嵌紅色於津液中包津液於紅裹內不可夫惟津液與紅釀成一體是以能使風與溼相攜而化不相逐以爭曰周痹風溼者以味苦氣寒之資不能已寒特可治周痹之屬風溼者雖然別録所著下胸脅氣客熱頭痛是升而有降之功補內傷大勞噓吸堅筋骨強陰利大小腸是降而得升之益仍可一係之根一係之實者又緣何而有此效夫實主退藏根主生發原草木之恆性則實際水土而轉生發根極暢茂而轉退藏獨非草木常理乎特枸杞者其水木之氣究竟須得金火乃能致功就下胸脅氣治客熱頭痛固呈效於至高而補內傷大勞噓吸者又豈不在心肺蓋水木之用成於金火然火之所以麗金之所以位卻終賴水火之精華奉養乃克就昌明治節之勛往還相承周旋相濟而實有益於形體者則曰堅筋骨強陰是已後人所謂枸杞根能退有汗之熱枸杞實能益心中之液不甚有意乎琥珀乃松樹枝節榮盛時為炎日所灼流脂入土歲久為土所滲泄而光瑩之體獨存其地有琥珀則旁無草木入土淺者五尺深者八九尺取純赤晶瑩摩呵吸草者佳本草別說參衍義松脂能流入地遂可謂通五淋乎琥珀自黃變赤遂可謂消瘀血乎淺之乎論琥珀矣夫豈不曰松脂入地千年乃成琥珀耶松脂為物遇熱能流得火能燃惟淪入地中日久化成其能燃之性被水養而至難燃能流之性被土養而至難流遂火化為色水化為光故其殷赤是火麗於水也其晶瑩是水凝於火也火阻水而成淋水違火而為瘀不藉之可消可通耶且消瘀血非行瘀血通五淋非利小便曰消則可見能化死為生曰通則可見能使止為行是故欲知非行瘀非利水之故則當審所謂消瘀血通五淋者必在五藏不安魂魄不定中施其作為而後此義可明魂神之凝於氣者也魄神之凝於精者也五臟有所不安精氣有所不攝則魂魄遂不定蓋魄藏於肺肺不安則治節失職而火阻夫水魂藏於肝肝不安則疏泄失宜而水違於火此其證必精神恍惚夢寐紛紜驚惕不安語言少序即使有瘀而不得行攻伐有阻而不得極導泄之候故以此呼吸噓植其精神膠黏其水火而後可消可通也若因瘀滯而成瘕癖因邪火而致淋瀝者原非所宜用小便數大便必鞕大便溏小便必難此通塞之由陽分也津液饒大小便俱利津液竭大小便俱祕此通塞之由陰分也然有大小便不利但得大便通小便即隨之行者有得小便行大便乃隨之通者此又不得以陰陽言蓋大腸盛滿能使膀胱亦阻膀胱盛滿能使大腸亦阻耳此其故當驗之於虛實實者須先通大便虛者宜先行小便雖未必盡能準此以是體之亦思過半矣曰主大小便不通利水道除邪氣非先通小便乎榆皮所以能於大小便俱不通證先行小便何故夫凡木之液多由其皮輸引津液故去皮輒死榆則去皮仍生可見其內外皆能輸引也是通小便中寓通大便意特皮之力終優於木且正服其皮所以小便應先行也然木皮輸引津液本以上資非以下溉而謂能行小便詎不悖哉周官曰以滑養竅戴記曰堇亘枌榆兔薨滫髓以滑之則榆者以滑竅而使之通耳非通利也且大小便之通滓穢固欲其下津氣卻欲其升非必相偕盡下不得為悖也然則滑竅耳又烏得云除邪氣夫邪氣者不過下文別録所注腸胃邪熱氣而已腸胃有邪熱氣而大小便不通但大小便得通邪熱氣且能自解何況以竅澀而致不通腸胃間因畜邪熱則通後邪熱氣又為所據耶然則其仁養生論謂令人善瞑別録則僅謂療小兒頭瘡痂疕疕頭瘍又謂禿也何也夫榆當春先生莢以成實至莢土𠩋乃生葉是就生氣為收氣也既能就生氣為收氣定能即收氣中延生氣小兒生氣最盛頭尤當生氣之衝而為瘡且結痂疕有不脫者哉若令人瞑則固生氣之收能育生氣而不傷育同育得初春便實之物自然隨發涵育與收中寓鬯何異鬯同暢楮有兩種雄者皮斑而葉無丫叉三月間開花成長穗如柳狀不結實雌者皮白而葉有丫叉亦開碎花結實如楊梅初青緑色至六七月漸深紅色乃成熟八九月采水浸去皮穰取子用樹極易生葉多澀毛摘斷其枝葉均有白汁綱目參圖經水不為火用而不充周一身火不能驅水而畜縮委頓是非水盛亦非火衰直二氣不相濟耳濟之奈何則取水周一身之物被火逼而生生且最速者引動其機括於是陽起而不痿水行而不腫水火既交氣道遂順而流行有力於以充上而目明充外而肌膚澤詎非理之合情之當哉楮生極速三年可成大樹而其布種之時必雜以麻使其同出於地冬則賴之以幛嚴厲春則焚之以資發育齊民要術種楮法取子和麻漫散之屆冬留麻勿刈為楮作暖明年正月初附地芟殺放火燒之若不和麻種率多凍死不燒者楮瘦而長亦遲逮其成樹也則白汁貫中徹上徹下隨取而隨有隨去而隨盈及其結實也則味甘氣寒以致生氣於畜縮之火中藉火以植其生浚水以交於火而起陰痿去水腫益氣充肌膚明目非治外感也亦非治內傷也乃撥動關鍵使不替其素所常行已耳夫水之充周火之化物不僅一端隨處異名隨地致用自其體言不能不謂之一氣貫注自其用言則彼此相制界劃截然故楮之實葉莖皮白汁別録各推所主如療癬癮疹癢逐水利小便惡瘡生肉小兒身熱食不生肌細尋其故究不外於本經數語大率使陰氣順則陽不鬱陽氣暢則陰自行然汁主皮裏膜外之疴莖除水火不和之病水在皮而腫則因皮以行水火在上而壅則用葉以散火竝欲聯兩氣而和不使偏一隅而滯即後人以之治血亦可於是而擴其旨矣五加春月於舊枝上抽條苗葉俱青莖轉赤色似藤而作叢有刺如薔薇高三五尺有至一丈者葉生五枚作簇者良每一葉下生一刺三四月開白花結青子至六月漸黑色根若荊根骨硬皮輕脆芬香皮黃黑肉白取皮入藥參圖經綱目按素問衇要精微論中診得心衇而急此名心疝心為牡藏小腸為之使故少腹當有形也王注心為牡藏其氣應陽今衇反寒故為疝則心腹疝氣腹痛乃陰之遏陽矣痿論曰肺熱葉焦則皮毛虛弱急薄著則生痿躄王注躄謂攣躄足不得伸以行肺熱則腎受熱氣故耳則躄不能行乃陽之劫陰五加皮一物既能主陰遏陽又能主陽劫陰劉潛江曰腎肝氣虛故病於溼溼者陰之淫氣也陰淫則陽不化而為風風者陽之淫氣也陽淫則陰愈不化而更病於溼至病溼固已陰錮陽陽蝕陰而成溼熱矣生氣通天論曰溼熱不攘大筋緛短小筋弛長緛短故迫促而氣詵詵上行弛長故懈緩而不能束骨利機關則疝之與躄皆歸一本五加皮氣味辛苦及溫散其陽實之淫氣行其滯窒之陰氣是其袪風淫以宣溼者即賴其逐溼淫以清氣也所以然者根皮之黃黑顯然水土和於下肉之白又顯然邪氣淨於內而骨之鞕不更可見和於外淨於內而其中遂不得不強乎此行於下者也其行於上者莖則赤而有刺子則青而變黑不又顯然下既強而陽上行陽既行而邪遂解邪既解而陰乃復順乎五色分絢五葉交加是謂五加覩名可思義也曰益氣曰堅筋骨曰強志意皆身半已上事曰疽瘡陰蝕曰囊下溼小便餘瀝皆身半已下事惟五加之莖柔以似蔓故而根鞕於上則以柔而濟其強於下則以剛而勝其溼曰風弱五緩虛羸補中益精當觀其所以除邪而後可以明其崇正矣蔓荊苗莖高四尺小弱如蔓對節生枝初春因舊枝而生葉類小楝至夏盛茂開花作穗淺紅色蕊黃色白色花下有青萼至秋結實斑黑如梧子大而輕虛八月九月采圖經參綱目筋骨間寒熱而為溼痹拘攣其邪定聚於關節欲去關節間寒熱與濕一當使行一當使散蔓荊實蓋均有焉柔條似蔓就舊發新生必對節似經衇之周行無間過節不停所謂行也開花成簇瓣淺紅蕊黃白萼青似關節之流行屈伸泄澤筋骨所謂散也兩者之所以然尤在味苦而氣微寒苦主發寒主泄耳目者精神之簇於一處者也齒者形質之簇於一處者也精神混以邪氣則昏暗形質混以邪氣則動搖行其邪散其邪精神形質遂復其常故在目曰明在齒曰堅目與齒即九竅之三既利其三遂推夫餘再合以別録之風頭痛腦鳴而利九竅之故并可識矣雖然盡蔓荊實所治之證皆病形不病氣舉蔓荊實之性情功用皆在血不在氣而別録誇之曰益氣其義何居劉潛江曰至陰虛則天氣絶蔓荊實成於涼降故能涼諸經之血以湊夫陽之所在使陽得陰以化而陽道行所謂以陰達陽由陽徹陰者也是故氣之虛者欲補而此能清其氣以達之氣之戾者欲散而此能清其氣以化之既於氣有造謂為益氣可也試核之頭痛則腦鳴目暗則泣出非津不凝於氣耶津得凝於氣氣自健於行不可云與氣無涉也辛夷木高三四丈其枝繁茂正二月開花紫白色花落乃生葉夏初復生花初出枝頭苞長半寸而尖鋭儼如筆頭重重有青黃茸毛順鋪長半分許經伏歷冬葉落則苞漸大至來年正二月則苞坼花開似蓮花而小如盞紫苞紅焰作蓮及蘭花香當苞未坼時采用之蜀本參綱目無五臟身體寒熱而風頭腦痛者是陽淫極上不得陰交而化風非辛夷所可治也五臟身體寒熱而不風頭腦痛者是邪連中外不隨陽氣而透達亦非辛夷所可治也惟風頭腦痛之屬五臟身體寒熱者乃可以辛夷治蓋辛溫本主開發且其樹雜植衆木間必高於衆木然後止而其花不開於枝不附於葉而獨出於木杪杪小也木細枝況不待葉發而花先開不待葉雕而花先茁自今夏及來歲之春雖日生日長皆甲而不坼必至四序竝經乃刳苞以出而所用者即其方開未坼之花以是知所謂五臟身體寒熱風頭腦痛者必腦本有宿風營為巢窟凡表間感寒感熱五內任疚任勞均不外發不下泄而獨出於上引動宿風為頭腦痛則取其歷久不開今始開之氣以發越之而覆其巢不使易種於茲即所謂面䵟亦於此取義大抵病之所營即正氣之所注而神亦於是乎萃曰眩冒身兀兀如在車船之上正疏其病根及病未發時情狀也由是推之則小小有勞水小感冒隨即鼻塞涕出面腫引齒痛發而即愈不久復作經年積歲無有已時者正與此相符曰溫中解肌利九竅則其巢之所由覆邪之所由去固已瞭如指掌矣上品木五味獸三味蟲六味果四味穀二味菜三味桑寄生從桑枝節間生葉似橘而厚軟莖似槐枝而肥脆三四月開花黃白色六月七月結實黃色如小豆斷其莖色深黃擠其實中有稠黏者為真圖經寄生必假桑之餘氣而成耶何他樹亦有寄生枝葉狀態如一也凡樹皆有寄生枝葉狀態如一則應自有種然未見有不寄他樹能自獨生者此蓋猶人婉孌柔媚而無特操不能自立者故爾雅載其別字曰宛童然托身得地亦能有所作為故張隱庵謂為餘氣寄生之物善治餘氣寄生之病若肌膚為皮肉之餘齒為骨之餘髮眉鬚為血之餘胎為身之餘而能充之堅之長之安之是亦最善體會矣豫則更有說焉果木截接不能兩生此則既有寄生復不礙樹蓋截接者出於人力之勉強寄生者出於天地之自然勉強者原欲竭滋液以奉所接自然者僅分餘波以資所寓然其力出於本根則一也人身本根非腎而何以能滋贅疣之物而主腰痛及小兒背強是又可知此腰痛背強非因乎虛非因乎痹乃腎中滋液不敷布以潤所當潤資所當資而留於中反礙氣之流行矣得此婉孌柔媚之物本專為寄豭者引其氣豭牡豬使潤所當潤資所當資豈不兩俱安善哉然何以必欲得在桑上者夫桑本柔涼潤澤其氣上及巔頂旁抵四肢觀圖經述桑枝本主上氣眼運肺氣咳嗽遍體風癢乾燥水氣腳氣風氣四肢拘攣再以其上所寄生者而推之是必尤能發其餘澤以溉其所贅矣托滋液而團結於上者非目而何其實主明目毋容詳釋也杜仲木高數丈葉如辛夷亦類柘其皮類厚朴折之內有白絲相連江南人謂之檰圖經杜仲之治曰主腰脊痛別於因風寒溼痹而為腰脊痛也曰補中益精氣堅筋骨強志以能主腰脊痛而究極言之也蓋木皮之厚無過於杜仲猶人身骨肉之厚無過於腰脊木皮皆燥獨杜仲中含津潤猶腰脊之中實藏腎水腎者藏精而主作強此所以得其敦厚津潤以補其中之精竝益其精中之氣而痛自可已然敦厚津潤氣象沖容魄力和緩何筋骨之能堅志之能強殊不知味之辛即能於沖容和緩中發作強之機而於敦厚津潤中行堅強之勢且其皮內白絲纏聯緊相牽引隨處折之隨處密布是其能使筋骨相著皮肉相帖為獨有之概非他物所能希也雖然堅筋骨強志皆腰脊以內事謂之補中益精氣可矣陰下癢溼小便餘瀝腰脊以外事何又能除夫腎固主收攝一身水氣分布四藏以為泣為涎為汗為涕為唾而伸其變化云為是之謂作強是之為技巧假使所居之境所治之地而滲漏不已關鍵無節又安得筋骨之能堅志之能強故惟能除陰下癢溼小便餘瀝而後筋骨可堅志可強實皆腰脊以內事不得云在腰脊外也即別録所注腳中酸疼不欲踐地尚是腰脊以內事蓋惟下一欲字已可見其能而不欲非欲而不能也夫腳之用力皆出於腰設使欲而不能是腳不遵腰令今曰不欲則猶腰之令不行於腳故曰尚是腰脊以內事女貞因子自生最易長葉厚而柔長四五寸面青背淡凌冬不雕五月開細花甚繁青白色結子纍纍滿樹黑色九月實熟其木肌白膩今人以放蠟蟲故曰蠟樹綱目參圖經或謂本經於女貞實既謂中虛可補五藏可安精神可養矣更謂百疾可除似近誇誕試於凡中之虛五藏之不安精神之失養百疾之不可名狀者咸不究而投之鮮不敗事又何能冀其有功豫則謂不揣本而齊末即目之為誇誕也亦何不可夫女貞之放蠟蟲也唯恐蟲不在樹甚且樹下不得有寸草有則蟲居草間不肯復上須棲止葉底遍樹周行而嚙其皮咂其脂液乃得生花剔蠟以為用設使他樹遭此蠹蝕不及一載定致枯槁惟女貞則能經三年祇須停放三年又復如故且其所成之蠟遇火遂爇爇同焫燒也蓋燭不淋而其光之清迥非他膏他脂能及則所用之實全具此理不即可尋思其功用乎自春夏秋當生長之會乃常蝕肌吮血身無完膚仍不廢開花結實至嚴寒飆烈他草木剝落無餘猶獨逞翠揚華挺然繁秀是所補之中必被火氣剝蝕之中所安之五藏必被熱氣騷擾之五藏所養之精神必氣被火耗不能化育之精神而所除之百疾必火熱遊行無定或內或外或上或下變幻無方之百疾夫相火之下陰精承之故凡火之病人賴有陰精相應以為康復之階苟所病不止一處則陰精雖欲應而不能遍及於是得之東又失之西向乎南又遺夫北蘇長公云使人左手運斤右手執削目數飛鴻耳節鳴鼓首肯旁人足識梯級雖大智有所不暇及夫燕坐心念凝默湛然朗照縱物無不接接則有道以御之而女者如也大戴記本命貞者定也精定不動惑也釋名釋言語定於中而不動惑於外猶之湛然朗照之中自有道以御夫物任物之奔馳變幻而無容心焉則所耗遂不能敵其所生病雖百變不能為人大害是之謂補中安五藏養精神何誇誕之有哉自於精而言則當日之剝削不能礙今日之充盈自於火而言則今日之充盈正以供他時之朗照女貞實全體大綱具於是矣丁香樹高丈餘類桂葉似櫟凌冬不雕花圓細紫白色二三月開至七月方成實出枝蕊上形如丁子大者為母丁香小者為公丁者均紫色圖經參海藥丁香花於春其色紫白是於生發中成和水火紫為水火相間之色而致其用於收也白為金色金主收斂實於秋其色紫而味辛氣溫是於收斂中成和水火而致其用於發也辛溫為發夫非發不腫非斂則風水毒不結而惡氣不留霍亂不心痛矣是故發中有收所以使邪去而正不傷收中有發所以使正旺而邪難駐然用其實而不用其花究似斂多而發少殊不知生長收藏機會是物之先天而氣味乃物之見在味辛氣溫豈有過斂之理特其中機括自有非純發可能該者才得識其於風水毒腫惡氣心痛能行邪氣之結而充正氣之威矣雖然據別録宋本參附而論則所謂霍亂心痛者壅脹也所謂風水毒腫者諸瘡也齒疳慝也壅腫用辛溫固其宜矣諸瘡及齒疳慝可以辛溫治之歟不知宋本固有溫脾胃句冠其首矣夫中宮輸運遲鈍蓄水成痰因痰生熱其變見於外者自有熱而無寒然徒清其熱則根柢溼痰必復層疊外透若得標遂知其本何如直剿其本之為愈耶故知痰溼阻中有礙氣道者縱有熱徵亦不妨恃此為求本之治矣沉香其木類椿櫸多節葉似橘花白子似檳榔大如桑椹紫色味辛若斷其積年老木根經年其皮幹俱朽爛其木心與枝節不壞者即香也堅黑為上黃色次之綱目木能沉水必堅緻而不易敗若易敗則粗疏而不沉水矣沉香為物豈特堅緻沉水且筋節之剛徑肌理之韌密詎易敗壞乃曰斷其木根經年即皮幹俱朽爛何如是之速哉然則朽爛者其粗疏之皮幹堅緻者皆朽爛所不及而存然剛徑韌密於內似可恃中保外以緩朽爛朽爛敗壞於外容或由外纍中以損堅緻乃朽爛自朽爛堅韌自堅韌兩不相及亦兩不相顧何其界畫清析因是知嶺表天地氣候有異於中夏夜必寒是海氣之瀰漫也晝必熱是日道之密邇也溼以日迫而不得散日以溼蒙而不得熯熯乾貌說文火盛貌玉篇故液樠之木惟此地為多液樠倘緣傷蠹若得泄者則流而為脂膏其不得泄則祕而為潰腐原其未傷蠹時則皆木中之生氣也流而不潰腐則精氣在脂膏如乳沒血竭蘇合之類祕而遂潰腐則精氣自在不可潰腐者即沉香是理勢然矣然則脂膏者治在外血衇之病不可潰腐者治在內氣道之病又何疑焉療風水毒腫者取其精內凝不隨外病而沸溢也去惡氣者取其氣內守不受外病之侵擾也精內凝氣內守而復芳香流動既不遲滯又不破削自能使當上者上當下者下非特為氣之領隊抑能為精與神之領隊而運轉於中不致偏留於一處凡用必取其堅而黑者殆以是夫麝藏香處草遂不生若故有草則黃瘁持過花下花為萎謝倘近瓜果瓜果立枯是其散敗生氣捷於俄頃則麝有香宜即倒斃乃不礙其奔馳狡迅夫固當究物之動植以為說也植物者形多於氣動物者形氣相侔香本麝食香草毒物而結若因香因毒能致倒斃亦何待已結成者且結不在清虛之所只附筋骸之外肌肉之間又在下體是故有香之麝雖形骸柴瘠而峻健自如可知能散附形醞釀之氣不能散呼吸氤氳之氣矣附形醞釀之氣物所自贅者也呼吸氤氳之氣吐納天地者也夫苟能散與天地吐納之氣將草木瓜果遇之當連根盡劚劚同斸斫也說文不生者永不生不花者永不花不實者永不實奚但斃麝耶故本經別録載其所主皆屬客氣依附有形相媾而成之病絶無上體清空氣分之疴就溫瘧之風藏骨髓蟲蠱之毒入腸胃癇痓之熱依血衇胎元之形具子宮及繩之附面翳之附睛數端可識若凶惡鬼邪徑犯清虛為神明翳纍者可決定其不得用矣更玩中惡心腹暴痛脹急痞滿一節又宜識凡病非來之暴一時無所措手非候之急百藥無可效靈者亦不輕用雖則曰驅除附形之邪不礙無形之所然附形有邪尚嫌峻利倘誤認無形為有形無邪為有邪豈不立夭人命耶用以治內病者審之凡牛有黃則身上夜有光眼如血色時復鳴吼恐懼人又好照水人以盆水承之伺其吐出乃喝迫之即墮水中取得形如雞子黃重疊可揭拆成片輕虛而氣香者佳圖經方春疫癘牛飲其毒則結為黃和氣流行則牛無黃宗忠簡之言是也宋史本傳澤知萊州中使索牛黃澤云云然黃非為牛病者特為牛禦病耳是何以然蓋疫癘之著物必乘其瑕而不攻其堅故凡志意僻則入於內筋骨弛則薄於外惟牛則穿勒內御能順而不能僻鞭策外加能健而不能弛乃口鼻卻已噓吸夫邪并不得出入其不適為何如然以內與外相較其性順而力健故病駸駸欲入於內觀其多鳴吼恐懼人可知也乃以其用力最純始終無間健能資順而順不愆於度順能隨健而健得循其常是邪欲入終不能入欲出終不能出而順與健早已撮其精氣之英華鎮於中以消弭之則黃是已人身之病寒熱熱盛外因也驚癇狂痓內因也惟其志意有僻是以外因得乘惟其外因已乘志意是以情智乖舛惟既情智乖舛而肢體有愆常度是以不可但攻六淫而遺內患譬如傷寒亦有從寒熱而熱盛因熱盛而譫妄狂走者然終不兼驚惕瘛瘲背強反張也夫然則凡病如傷寒而其來不驟如昏讝而肢體牽縮者牛黃之所主也鹿角寸截外削粗皮內去淤血浸滌極淨熬煉成膠浮越囂張之氣頑梗木強之資一變而為清純和緩凝聚膠固自然其用在中收四出浮游之精血鍊純一無雜之元氣於以為強固之基施化之本也試舉一端而言如本經以之主婦人血閉別録以之療崩中不止治閉宜通治崩宜塞一物耳云何通塞竝擅不知腎者主水聚五臟六腑之精而藏之故五臟盛乃能瀉五臟盛而不瀉五臟不盛而瀉五臟不盛而不瀉皆病也以故不瀉者正所以成其瀉瀉者必早有不瀉者可恃血非水屬歟以止崩中為通月閉初基又焉得為竝擅若以為竝擅則通閉與安胎腰痛與肢疼多汗與淋露吐血與下血皆不容兼有其功總推極其兩端以令人得所主腦耳鹹能收集津液甘善敷布精微鹿角之鹹既成白膠則轉而甘甘以鹹為先天則敷布有序而不至傾盡底裏鹹以甘為化身則收集有度而不至慳吝嗇施試思傷中之候既已勞絶羸瘦從何收集無所收集將何敷布無所敷布羸瘦又焉能復勞絶又何能續耶惟其即集為布藉輸作收徑道既澤中權有資而化生氣於空濛充形骸以膏潤曾謂補中益氣為廋詞哉要之一物也蹐駁則行蹐小步也說文駁龐雜也清純則補一病也蹐駁者實清純者虛即鹿角所治之惡血留血癰腫較白膠所治之吐血下血崩中言其同自有純駁之殊言其異則又皆係血是藥物之炮製煎煮之久暫遂別有所專長於此可見水族離水則殭陸蟲沒水輒斃惟龜常湛於水可生終令居陸亦生此所以能治水之病人亦能治火之病人并能治水火相齧而病人也輕狡者遲重則殆遲重者不能輕狡惟龜背腹自遲重首尾四支自輕狡此所以能治中病應外外病應中并能治中外有病而不相謀也衷甲者以其堅為蔽以其裹為衛惟龜雖有甲而縱橫成理片片可土𠩋雖可土𠩋而上下緊裹無稍罅隙此所以能治當開不開之病當闔不闔之病并能治開闔參爭之病也漏下赤白小兒囟不合非不闔乎癥瘕非不開乎痎瘧非開闔之參爭乎五痔陰蝕非水火之相齧乎溼痹四支重弱非中外病之相應乎此本經之所臚也若別録之所增骨中寒熱傷寒勞復肌體寒熱欲死驚恚氣心腹痛不能久立猶中外之相應矣頭瘡難燥女子陰瘡猶水火之相齧矣雖然舉本經別録所列之證均可不別其因盡用龜甲治之歟則非矣夫龜生理之異在乎無間水火而人之一身無不以水火為樞機諸證者能審明水火之參差進退以為患則又何不可知其所主之病之別耶蓋氣張而體不隨之開者此能助之開氣翕而體不隨之闔者此能助之闔火無水養而亡命奔迸者得此能使水存於中而招火外歸水為火格而延緣遊溢者得此能使火熄於外而引水內濟以至水停關節而火之途徑難通火燔骨幹而水之滋溉難及均藉此以交互聳動之曰龜甲善滋陰亦淺視龜甲甚矣螳螂驤首奮臂修頸大腹二手四足善緣而捷以鬚代鼻喜食人髮能翳葉捕蟬深秋乳子作房黏著枝上即螵蛸也房長寸許大如拇指其內重重有隔房每房有子如蛆卵至芒種節後一齊出故月令云仲夏螳螂生綱目螳螂作窠生子於深秋成形出見於仲夏可謂隨陰之斂謐而藏隨陽之昌熾而出何以本經別録所列功能殊不與是意符也蓋螳螂本微物而其不自量力賈勇效能有若強陽之不可遏者則深秋之所藏是令陽入陰中仲夏之所出是令陽從陰出也於陰痿之候能為益精而使生子非其陽入陰中於女人之病能行血閉而不腰痛非其陽從陰出耶疝瘕本陰氣之結因傷中而為疝瘕則是陽氣之結矣水道不利本陽氣不化因五淋而水道不利則是陽陷陰中而此曰主傷中疝瘕通五淋利小便水道不可謂非使陽入陰中陽從陰出矣雖然疝瘕之屬傷中者陰痿之屬陽不入陰者腰痛五淋之屬陽陷於陰者當與凡疝瘕凡陰痿凡腰痛五淋有異而後可用是物於何別之別録所謂虛損五臟氣微是傷中之狀也所謂夢寐失精遺溺是陰痿之源也由是而推腰痛五淋亦必有傷中陰痿之象兼見焉則其別亦既瞭然矣要之是物之氣平味鹹固具下行歸腎之機其必取諸桑上者又具自肺而下之概一在極上一在極下盤旋交引中氣自得靈通於是陽之出入陰之闔闢自合度焉因是知傷中二字實為諸證綱領由中及外之病而先轉在外之樞以定其中是亦可謂妙於化裁矣石決明形長如小蚌而扁外皮甚粗內則光明煥發一邊背側一行如穿成者緣行列孔以七孔九孔者佳一邊帖於石崖之上海人乘其不意泅水得之為其所覺則緊黏難脫矣綱目參圖經障目病總稱也翳多屬痰痛多屬火痰火阻於精明之道上引之氣遂不能達精明而反達痰火於目所以為翳痛也此為外障青盲則精明虧乏無以上榮故黑白分明瞳子無異直不能鑑物耳此為內障然是二者致病有先後之殊或由痰火久溷精明遂不上朝或由精明衰減痰火乘機上擾今曰目障翳痛青盲乃因痰火而致青盲非因青盲而痰火竊出石決明之粗皮外蒙正如痰火之隔蔽去粗皮而光耀煥發正如精明之遂得上朝目者肝竅目中精明則腎家陰中之陽故其光藏於黑珠之內肝特襄以發升舉之氣而奉之於目耳是則石決明之用不過撥蕪纍而發精光乃目之曰鎮肝清肺其意何謂蠡魚即鯉魚形長體圓首尾相等細鱗黑色有斑點花文頗類腹蛇有舌有齒有肚背腹有鬣連尾尾無歧形狀可憎氣息鮏惡鮏魚臭也說文食品所卑綱目鯉魚脅鱗一道從頭至尾無大小皆三十六鱗每鱗有一小黑點圖經二魚在水中與其類奔突擊撞均非能安居游泳者然鱧魚縱遭水涸能伏處泥中久而不死是其性向下鯉魚力躍懸流乘霧飛行空際是其性向上乃鱧魚偏主在上之水鯉魚偏主在下之水何耶夫固因其性下故能使在上之水行性上故能使在下之水動也他魚死則鱗無光澤惟鯉魚雖醃而成鮓以鹽米釀之使如葅熟而食之也釋名鱗間金色猶閃爍是其得水之精能資火之照者而其膽之精氣本通於目為善治目病因水不滋而火遂熾者矣腥物欲其乾必以醃者為鹽能滲去其津液也鮑魚不因醃而暴乾則津液未嘗滲去故臭耳凡魚津液在而氣臭餒敗隨之乃偏不餒敗且其味甚鮮是明明能使不流行之津液氣變而質不變血遭傷折不去而瘀非氣變質不變乎得此同類之物鼓舞其機斡旋其氣氣仍行血仍活矣女子崩中血不止是致生氣於已離經而未行之血中猶之轉瘀血為活血矣然則校是物之長亦頗有益於人而素問謂為利腸中且傷肝則反以剋削目之其故何歟夫腹中論之論鮑魚汁原謂其有利於腸中及肝之受傷者正以其能使腸中津液肝家藏血已變而未敗者皆得轉死為生耳不然豈有氣竭肝傷之病復利其腸傷其肝耶藕生池澤以蓮子種者生遲藕芽種者易發清明時於藕節間穿泥成白蒻蒻土下白莖也竝生二枝一為藕荷其葉帖水其下旁行生藕至四五月復出亦必二枝一為擎荷其葉出水其一旁莖作花花開於六七月有紅白等色心有黃鬚鬚內即蓮房花褪後房中成菂菂蓮實菂在房如蜂子在窠房枯子黑其堅如石八九月收心去黑殼謂之蓮肉肉中生薏薏蓮心具葉二枝從上下生倒折向上若種蓮者此即一為帖水一為藕荷矣藕色白有孔有絲大者如肱如臂凡五六節花紅者蓮佳花白者藕佳綱目荷之為物若分析而言根則藕與節莖則帖水與出水實則菂與薏取義皆應有別而本經乃概之曰藕實莖一似可任其相混而不必分者何哉夫實之從上倒生先具花葉之莖而獨無藕質根之從下挺出先成藕之質而花最後期雖以次長養究一氣回環故蒔蓮者不能不先生藕而後發花蒔更種也蒔藕者亦不能不葉先茁而藕續成是本經之主補中養神益氣力除百疾者斷不嫌其混別録之主熱渴散血生肌者又不嫌其析蓋以氣言則菂之生藕為自陽入陰藕之生菂為從陰出陽陰陽回環遞相生化實所以開水土之黏固花發時遇烈日則挺拔遇陰翳則萎瘁曳至陰以媾至陽凝至陽而成化育又所以聯火土之相生曰補中養神則亦何庸析也若以血言則花葉之得以交於陽全藉莖藕之引於陰藕非水不能生莖非藕無所浥而色赤之花獨據其物生長斂藏之會一如中焦之受氣取汁長藕者以是而終結蓮者以是而始故凡血以熱結津以熱耗者咸賴此布散調劑以通徹其陰陽交宣其水火曰主熱渴散血生肌則又何可不析也要之血以氣之煦故不至滯而不行行而妄出氣以血之濡故不至化火劫陰陰隨火竭然血而痼氣終成滅頂之凶氣縱耗陰猶有遺荄之結此水漲沒荷則根莖花葉無有不死而水竭土坼則僅枝葉槁而藕難卒壞是其托命於陰畏陰之橫而不畏陽之熾斷可識矣蓮者不偶也藕者不連也藕本自連因節界之而不連蓮本不連因相攢聚而連是陰陽雖出於偶奇然實陰根於陽陽源於陰矣乃奇者外開而中有物蓮肉劈之則成兩瓣而中含薏偶者外連而中無物是據於上者為坎蹲于下者為離人之身不坎係腎而離係心乎今且反之則所謂取坎填離以離濟坎者兩端之用已諧其所受益自必在中而命為補中養神無慚矣劉潛江之言曰主水土相交而出地者陰中少陽也其性主升陽升而陰隨者則水氣達而土氣亦達乃成上行之地道焉斯為補中以水得交於火也主水火相媾而下歸者陽中少陰也其性主降陰降而陽隨之則火氣暢而土氣亦暢乃成下濟之天道焉斯為補中以火得交於水也夫其鍾天一之靈以透發地二之德自初生之蒻以及出水之荷無不隨其莖而有經緯隨其節而有貫串不獨成藕者衇絡井然竅穴洞徹也且其出水生花者由花生芷芷生蓮蓮生菂菂生薏頓其數種色相即一花實之中有終其水中之火以上行始其火中之水以下徹者蓋蓮從藕根抽莖開花以至結實皆自下而上而實中之薏包含根莖花葉形復倒垂有歸根復命之義而細驗其經緯貫串雖些微而具全體觀其始而黃黃而青青而緑緑而黑中含白肉內隱青心是或火土相生土木相合金木相媾致水土之氣達而終其經緯條達之化火土之氣暢而始其經緯條達之化者皆在此一花實中故蓮實非特交水火以益土更即土而能行水火之升降若藕及藕節荷葉及蒂後人類用以活血不知能達水中之氣即是和血血固源於水而成於火者也達水者自下而上以資血之始暢火者自上而下以資血之生水氣不得化而血病者猶其從上下生一線生機具藕全體乃能裕血化源為血證利益耳芡莖三月生葉帖水大於荷皺紋如縠縠皺紗蹙衄如沸面青背紫莖葉皆有刺其莖長至丈中亦有孔有絲五六月生紫花花開向日結包外有青刺如蝟及栗毬花在包頂如雞喙剝開內有斑駁軟肉裹子纍纍如珠璣殼內白米狀如魚目其根狀如三稜煮食如芋綱目芡莖不弱於荷莖其長且倍焉然任蠖屈於水中而葉終不離水面者地之氣能隔水以交天天之氣不能越水以交地則承接於天者究在水而不在土也故夫芡開花向日向日結包與天上之陽相噓吸而成實則為秉氣於陽矣夫水中之氣不能出水又何異腰脊與膝為溼所蔽不得交於陽耶乃芡者偏能共水外之陽噓吸以鍾生趣故主為溼痹腰脊膝痛補中腰脊膝固皆繫屬水藏而資陽氣以運動者也被水氣蔽而為痛則受陽之益而痛已矣資始於水下之土資生於水外之火火土相鍛則成金而偏在水中具堅剛之性潔白之色不受泥之汙日之暴則受日暴泥汙以為病者均藉此可已曰除暴疾正對主溼痹腰脊膝痛補中而言非特能致陽於陰并能起陰禦陽也心之志耳目之聰明皆陰中之生氣而注於陽者能於精中益氣以交陽則志之強耳之聰目之明正有不期然而然者特精盈而氣不能攝之以交於陽者則可精不足而有是則無益矣蓬藟用根覆盆子用實本係一類而有二種一種藤蔓繁衍莖有倒刺逐節生葉葉大如掌狀類小葵面青背白厚而有毛六七月開花小白就蒂結實三四十顆成簇生則青黃熟則紫黯微有黑毛狀如熟椹而扁冬日苗葉不雕雖枯敗而枝梗不散者蓬藟也一種蔓小於蓬藟亦有鈎刺一枝五葉葉小而面背皆青光薄無毛開白花四五月結實亦小於蓬藟而稀疏生青黃熟烏赤亦頗同冬月苗雕者覆盆也參隱居綱目蓬之義為叢山海經海內經元狐蓬尾注短而不暢莊子逍遙遊釋文引向注非直達者也莊子逍遙遊夫子猶有蓬之心也夫注纍係也漢書司馬遷傳集注案藟爾雅疏所引本草皆作藟詩樛木葛藟纍之南有嘉魚甘瓠纍之釋文皆云作藟蓬藟猶蓬纍蓬纍猶扶持史記老莊申韓列傳則蓬纍而行索隱謂其短曲相簇圖經云苗短不盈尺牽引連屬作互為扶持之狀也其莖㦸刺外鋭體質內柔其葉厚而有毛凌冬光澤其花白其氣平是皆有合於金之降金降者火必隨故所結之實先青黃而後紫黯味且酸鹹又甚有合於金曳火以歸水水承火以滋木矣金降火歸水溫木茂上下之轉旋順常根柢之精神牢固不可不曰安五臟益精氣矣五藏安精氣益自然火凝於水而志強水資於火而力倍長陰有子特餘事耳曰療暴中風身熱大驚者別録恐人徒認為補益之品無與於外感而言之也蓋根固主發如上功能雖皆比於斂藏然以發為藏決不至連邪氣而胥斂之矣暴中風身熱大驚則邪客於外氣因誤治而亂於中也譬如太陽燒針則驚少陽吐下則驚是邪已被劫而零落僅存矣即用是以安擾亂之氣而不助未盡之邪雖於龍骨牡蠣外別樹一幟又何恧焉特當析其火不歸土陽不就陰斯屬龍骨牡蠣若氣不歸精則屬是可耳至覆盆子雖與是同類異物然體狀之同固不能該其吸受之異吸受之異卻善承其秉賦之同則其根於發中寓藏而子即於藏中用發夫其體狀不異花色實色竝同惟一結實於三秋一成熟於五夏則根之發不能禁其子之收而收之盡為作用於下若子之媾金體質狀似金木用得氣是木以歸火火金復相鎔鍊自必下流且其下流正為來年生發之基能不謂降中有升耶故其所主之益氣輕身正同而力獨優於令髮不白是其挽氣下歸復為上發之地者更魁群絶倫非蓬藟之所能及矣胡麻即脂麻也有黑白赤三色其莖皆方秋開白花亦有帶紫豔者節節結角長者寸許有四稜六稜者房小而子少七稜八稜者房大而子多皆隨土肥瘠而然其莖高者三四尺有一莖獨上者角纏而子少有開枝四散者角繁而子多皆因苗之稀稠而然也其葉有本團而末鋭者有本團而末分三丫如鴨掌形者故古人多謂其種不一云綱目胡麻穀食也而味甘氣平臭香悉合土之德宜乎其主傷中然曰主傷中虛羸則似與傷中而不虛羸者無與也虛羸與否於傷中果有異乎夫胃剛而靜脾柔而動剛者主容納柔者主運用中虛之病縱少容納但能運用得宜未必遽至虛羸以脾固善撮一身之陰陽而裒益調劑之也若運用不靈雖容納猶濟則不為壅閼必至泄澼於是素仰資給者遂無所藉而連比受傷不至氣餒形瘠不止於此可見肌肉削氣力萎五內損是脾病而非胃病能補五內益氣力長肌肉是治脾而非治胃冠以傷中隨贅以虛羸非無故矣然則胡麻之能是為通壅閼乎為止泄澼乎夫壅則不泄泄則不壅通其壅正以止其泄耳通其壅奈何蓋脾之職在敷布津液以上升壅不敷布也泄不上升也氣餒形瘠乏津液也胡麻為物植必上旬必截雨腳自生及長以至成實遍體無不滑澤結角上聳雖實滿而不垂不似他穀穗中有實即俯首也實排角中不易剔去須角口開乃倒豎而抖擻之已還藂之藂叢也三日一抖擻四五遍乃能盡齊民要術是其飽含脂液之實性善帖上而不肯下恰有切於脾之用脾用既宣又有何壅性善及上烏能作泄是以本經命曰填髓腦又非無故矣然則胡麻之益陰如是而不能除煩止渴何也夫除煩止渴是津之用今者所主是液之用夫腠理發泄汗出溱溱是為津穀入氣滿淖澤注於骨骨屬屈伸泄澤補益腦髓肌膚潤澤是為液液屈伏於極內津宣發於極外故生津之物若蔗梨菱藕其汁易出與胡麻之液非磨蒸擠壓不得出者不同也又烏能除煩止渴哉雖然參別録所主而稔其有互相關會者蓋津比於氣液比於血故氣行則津隨津至則氣達液充則血盛血衰則液耗然觀奪血無汗奪汗無血血原未嘗不能濟津之不繼滲灌溪谷滑澤骨節血又烏得不浥液之有餘此金瘡血去澀痛者用胡麻止痛是引液以補血之脫也傷寒溫瘧大吐後用胡麻治虛熱羸困是引血濟津而使與液相噓吸也二者勢雖不同而理則一一者何因陰去而陽遂困也是仍不外冠首之傷中虛羸句矣若夫青蘘自較其實輕浮而達外藉其潤澤宣發以滑利邪氣之痹而不行是可知其風寒溼痹必腠膚燥澀而久駐不解者冬瓜三月生苗引蔓大葉圓而有尖莖葉皆有刺毛六七月開黃花結實大者徑尺餘長三四尺嫩時緑色有毛老則蒼色有粉其皮堅厚其肉肥白其瓤白虛如絮可浣練衣服其子在瓤中成列霜後采之綱目劉潛江謂冬瓜苦瓠皆行水僅有宣陽達陰之分豫則謂兩物已大相徑庭兩物所治尤不可同日語蓋苦瓠苦寒冬瓜甘寒苦瓠之肉能乾冬瓜之肉不能乾苦瓠用瓤子冬瓜用肉其意固迥別矣苦瓠治大水四支面目浮腫冬瓜治小腹水脹浮腫與水脹固皆氣水兼病然浮腫在外水脹在內且一能上及面目一祇下在小腹不又分隔天淵況一曰下水令人吐可見其水不擇大小便而下猶或不及則在上者并自吐去是其急疾何如一曰利小便止渴可見必化其水小便始利而當其化時猶能泌其清者上朝為津是其宛轉若何而可一律視之歟蓋凡物之津潤者類不堪久藏惟此屆冬方釆之物自然經歲不至浥爛譬如醃菹乾肉必以冬成方得經久耳然用其外廓而能化在內之氣與水何故夫冬瓜初實其瓤亦如一切瓜瓠裹大津液充滿無間及其飽經霜露瓤子空懸於中其津液既未外泄又非內耗乃盡浥於肉中而晝受暴煉夕蔭露漿已盡拔其浮濁乃獨留其精純斯能久而不壞也人身津氣在肌肉間者非衛氣而何衛氣者起於下焦上行以護衛一身剽悍急疾晝夜五十周不自暫駐冬瓜者既挹小腹間水中之氣行於肌肉隨衛氣敷布且能上止其渴矣其所餘水能不自化隨小便以出耶苦瓠冬瓜功用其分界在此然所治之腫與脹皆屬熱而不屬寒則其孚合處不可竟指為同又不可全闢為異以其氣均寒也至其子之治煩滿不樂則更有說焉夫含漿裹液而生者必不樂乾然不乾又不堪作種惟冬瓜之子初生於盛津包襭之中續成於漲落津消之後而以十月收采即以十月種植見齊民要術究竟竝未嘗乾乃亦隨即萌達溯其在瓜之日磬懸於中系絡於肉足見其當津液盛漲時能由絡以輸其肉及至消落已後又能隨絡以吸取於外是其常與津液相往來不必論其乾與澤者煩是水之不足滿是水之有餘能使滿通於外即已水交於內而煩與滿竝除矣其可為面澤亦即引津外敷之效耳白芥八九月下種冬生可食至春深莖高二三尺其葉花而有丫如花芥葉青白色莖易起而中空亦有中實而大者性脆最畏狂風三月開黃花甚香郁結角如芥角其子大如梁米黃白色綱目白芥子布種於秋盡採實於夏初以生以長咸在冬春而於夏秋反若無所與者殊不知發生於冬長養於春皆其胚胎之際而夏秋則其原始要終之會也味之辛得於秋盡氣之溫得於夏初是辛感於水而生溫孕於寒而育溫不能離辛辛不能離溫則辛溫之用皆萃於水矣辛者所以通溫者所以發痰冷阻中則氣難橫達而一於上行為上氣氣難橫達則痰冷益無所泄而惟留於胸膈於是礙脾之磨蕩而黃發於面一溫而胸膈痰冷無不發越一辛而氣機上逆無不宣通皆由橫達之功竝非泄降之力故後世稱其能除皮裏膜外之痰四支骨節之痛亦為此耳然得謂凡痰凡痛皆可治以是歟蓋亦有界限矣夫大則空虛小則堅實他物之恆情惟白芥之莖小者反中空大者反中實仍係一類二種可同為用中空者象痰之逼窄氣道中實者象痰之壅腫徑隧是故用以治內其證必兼上氣用以治外其證必兼腫痛則凡痰在骨節及皮裏膜外之候必裏有痰而外為腫痛已久而按之不空者方與此宜以是為其畛域可也中品石三味草二十七味磁石色紫黑而澀其中有孔孔中黃赤色其上有細毛性吸鐵能虛聯數十針或一二斤刀器回旋不落者佳參圖經衍義周痹不僅由風溼風溼不盡為周痹特肢節中痛周痹有之風溼亦有之若云風溼周痹則嫌於但由風溼之周痹而無與於未成周痹但因風溼之肢節中痛矣周痹者在血衇之中隨衇以上隨衇以下遍身皆可及也而曰肢節中痛得毋無與於身歟肢節中痛則四末皆可及也而曰不可持物得毋無與於足歟肢節中痛不可持物則暴病宿病皆可有也而曰洗洗痠削得毋無與於新病歟夫靈樞周痹篇之言可稽也曰風寒溼氣客於外分肉之間迫切而為沫沫得寒則聚聚則排分肉而分裂也今不得寒則不聚不聚則不外排分肉而內入骨節矣曰分裂則痛痛則神歸之神歸之則熱熱則痛解痛解則厥厥則他痹發今不分裂而內向則不熱不厥而但洗洗痠削矣曰此內不在藏外未發於皮此周痹風溼所共也曰獨居分肉之間則與風溼不同矣所以然者磁石所主既能於真氣不周之證使之周即未至於真氣不周者亦治之蓋磁石者以質而論則取其有毛之石石中有孔為重墜下降自肺及腎也以色而論則取其石色黑孔中黃赤而獨無青為有降無升也自肺及腎倘腎家不空如石中無孔則雖降亦無所用此所以不能治軀體之痛矣有降無升倘痛在足膝如石已至地則於何更墜此所以止能治肘腕中痛矣然重墜者僅得直行肘腕者理須旁及在旁之病從直道治之能有濟耶不知臂有六經其在內廉則太陰為之長在外廉則陽明最居前太陰陽明表裏也太陰病則陽明為之開其去路陽明病則太陰為之浚其來源總欲使其得至胸中則自能遂其降矣何況肘腕之病之根何必不在胸中胸中通則肘腕何必不自舒耶曰刺周痹者必先循其下之六經視其虛實及大絡之血結而不通及虛而衇陷空者而調之尉而通之其瘛堅轉引而行之而磁石則治虛之法備矣然又謂除大熱煩滿及耳聾何也夫曰及則不得作一線觀亦不得作兩截觀蓋凡耳聾之大熱煩滿者治之大熱煩滿而不耳聾者亦治之內以別於腎氣竭絶之耳聾外以別於風熱暑溼之大熱煩滿也聽之為義如水影物無水而物無影此原難復之候有水而物無影則由水濁有影而竝無物則由風狂磁石之所主蓋治水濁之疴何者水所以濁或由溼蒸土浮或由鬱熱水泛而大熱煩滿則由肺動而腎隨之且過中不懼所主之脾抵上不凌所畏之心此其病似實而非實似虛而非虛是經衇篇所謂所生病者也母病本輕緣子救而轉盛子原無病因救母而生災是以手太陰之煩與心胸滿足少陰之口熱舌乾遂相湊為大熱煩滿矣得此以石吸金自肺及腎之物焉能不水靜其波而歸其壑金遂其重而下溉耶於是知別録所稱強骨氣除煩通關節皆即本經之所主其養腎氣益精乃自腎吸肺憑恃母氣之功小兒驚癇則金水相安火自不炧之效消癰膿鼠瘻頸核喉痛又水不上泛火遂清靜之功況鍊之為水則朝肺之百衇皆隨之順流而下溉以養腎而榮精能不令人有子哉陽起石雲母根也所出之山常有溫暖氣盛冬大雪獨此不積其形似雲頭雨腳鬆如狼牙色黃白而赤猶帶雲母者為上置雪中倏然沒者為真寫紙上日中揚之飄然飛舉者乃佳參圖經綱目庚辛玉冊主崩中漏下是欲血之止破子藏中血癥瘕結氣是欲血之行以陽起石一物而兩操血之行與止其故何歟陽起石雲母根也天之氣交於地而地氣不應則從乎地而生雲母天之氣交於地而地氣應者則從乎天而成陽起石夫當絪縕相感之際原冥漠無眹眹目精也惟其凡感斯應故質陰而常從夫陽遇陽則起惟其有茹必吐故性陽而不離乎陰逢陰輒消主崩中漏下者起其迫血之陽而血自止即書之於紙見日則飛之義也破子藏中血癥瘕結氣者釋其凝血之陰而血自行即縱使大雪其處不積之義也雖然吐衄便利金瘡獨不可起其陽迫而止之乎水與血摶內有乾血獨不可釋其陰凝而行之乎奚為惟崩中漏下之止子藏中血癥瘕結氣之行也夫以大地絪縕萬物化醇之氣之結化男女媾精萬物化生之處之病既精且專不假他求則亦不能他及故寒熱腹痛無子是子藏中陰凝而陽與爭也陰痿不起補不足是陰莖中陰凝而陽不起也兩者皆在交感之所惟其不預他處病是以能不遺本處病可貴者惟此期必效者亦惟此素問病能篇怒狂者因陽氣暴折而難決也使服生鐵落為飲以其氣疾也本經鐵落主風熱惡瘡瘍疽瘡痂疥氣在皮膚中一者病在內一者病在外其源雖同然流之異者治必異可以一物治之乎夫內有熱而不能化若外有阻滯處則歸并於阻滯隨所在而成瘡若外無阻滯表氣完固則盛壅於內引氣上逆而為怒本固同而末亦未嘗異也不可以一物治之乎鐵落者鐵中之粗礦也不被火鍛則不出其落愈出其鐵愈精鐵無火不精火非鐵不凝風熱惡瘡瘍疽瘡痂疥是鐵之不精也怒狂是火之不凝也去其粗而精自純火自凝謂為兩端可哉然則別録曰除胸膈中熱氣食不下止煩不正與素問奪其食則已相背戾歟夫素問固曰陽明者常動巨陽少陽不動不動而動大疾則為怒狂非正以陽明并操巨陽少陽之權耶奪其食則陽明餒巨陽少陽得復秉其操矣若不奪食則以鐵落下其氣可也若本不能食而胸膈中熱氣亦盛則陽明之氣本非因食而旺則雖不食猶當下其氣矣不然則奪其食矣又何更下其氣為哉葈耳實即蒼耳子莖高四五尺有黑色斑點葉如葵四畔寬紐七八月開細白花結實如婦人耳璫外殼韌刺毛密布中列兩仁宛如人腎乘雅蒼耳枝節繁茂離奇屈曲末盛於本縱橫四布似蔓非蔓實結於巔剖而出之宛如人腎腎所主者液也液之所至上出於腦為髓旁行於肢體為骨節屈伸泄澤外行於肌腠為汗出溱溱無非腎氣所屆乃蒼耳子之象腎形者偏在其末故能隨液之所至布氣以驅風寒溼也雖然其味甘其氣溫謂之益液亦何不可僅謂能布氣而驅風寒溼視之無乃太隘耶則補精益液之物必滋柔而茲則強梗也必味勝而茲則氣勝也且其莖枝色青則有合於發生之木氣青中間黑色斑點則有合於雜風寒溼在發生中仍不礙其榮茂故謂行精液中氣以資發生則可謂竟補益精液則不可矧青者應風黑者應寒是其莖白者應燥是其花舉青與黑之精英盡宣布於色白之花而成實故曰能驅風寒溼目之以補精益液烏乎可是故風頭寒痛者腦間固有風復因寒激也風溼周痹四肢拘攣痛者風寒溼著其液窒礙其滑澤也惡肉死肌者風溼著其津腠理遂不通也使腦髓津液中氣行而不滯去而不留則諸患又何能不除耶即後人所擴充亦可以此意會悟而無不合矣元參二月生苗高四五尺莖方而大作節若竹色紫者有細毛葉生枝間四四相值形似芍藥七月開花白色或淡紫色花端叢刺刺端有鈎最堅且利八月結子黑色一種莖方而細色青紫葉似脂麻對生又尖長似槐柳邊有鋸齒開花青白子黑褐亦如其時根都科生一根五七枚生時青白乾即紫黑本草述大寒者固密嚴厲之寒火氣遇之則折微寒者輕揚飄灑之寒火氣遇之則化苦發氣者也鹹泄氣者也元參味苦鹹而氣微寒故能於火氣之鬱伏者發而化之散漫者泄而化之其所由然則以其根生時青白乾即紫黑耳青白者萬物成始成終之色也乃忽發紫赤之莖見水火之互形寒熱之錯雜且其葉衝決四出其花鈎棘堅利徒具傷害之態絶無沖和之概向所謂成始成終者竟成寒熱交戰之禍災將不獲其終幸而火既西流露已降白鈎棘堅利之花仍為肅降形色而結實不赤不紫獨得為黑則無成有終者在此即其根生則青白乾則變黑者義亦在此矣其在於人青者溫升也白者肅降也溫升之氣媾於上則為肅降之資以歸於腎倘上媾而不為之化新者不化陳者遂不能復上陳陳相因積聚於中是其氣發於陰而亂於陽出於血分而交互於氣分故在婦人産乳之後尤多有之惟宣其飄灑輕揚之化則降者自降歸者自歸是元參之功本經所謂補腎氣者在此別録所謂定五臟者亦在此矣盧子繇曰元參味苦為已向於陽氣寒為未離於陰云補腎氣者是補腎氣作用之樞機非補腎臟主藏之形質也劉潛江曰元參所療皆本於氣之化熱故為熱所結之氣不限上下不分虛實皆可肅清矣夫實為邪實除邪不能全藉元參則假元參化氣之并於邪者虛為正虛補虛尤不可全藉元參則假元參助氣之歉於正者惟然故凡血液痰飲六淫七情已離乎陰未盡著於陽趨於熱遂與熱俱化者服此能使化於熱者仍轉趨於陽者仍歸邪勢不能誘引正氣為附從正氣即能抵拒邪氣之侵犯此別録所列功能均可以此義裁之矣秦艽根土黃色而羅紋相交糾長一尺以來粗細不等枝幹高五六寸葉婆娑連莖梗俱青色如萵苣葉六月中開花紫色似葛花當月結子以文左旋者為良圖經秦艽主寒熱邪氣寒溼風痹且將胥六淫而盡治之所不及兼者惟燥耳其所造就抑何廣耶夫是條之讀當作主於寒熱邪氣中下水利小便又主於寒溼風痹肢節痛中下水利小便蓋惟寒熱邪氣證可以下水利小便愈者無幾寒溼風痹肢節痛證可以下水利小便愈者亦無幾此秦艽之功殊不為廣然必於兩證中求其的可以下水利小便愈者而後秦艽之用得明則已費推敲矣況下水利小便復不得作一串觀是秦艽所主確亦實繁且殷也凡苗短根長之物皆能攝陽就陰凝陽於陰如遠志者可驗特彼則著於神志茲則隸於六淫著神志者攝火於水而精自靈動隸六淫者化邪於水而溺自流通惟測識其有水可以化邪此邪能從水化有溺可以泄水此水得隨溺通斯秦艽之用方無誤也但屬寒邪雖有水氣祇可使水從寒化不得化寒為水如小青龍湯證真武湯證是也風寒溼三氣雜至合而成痹其驟者雖有水氣亦祇可令從溫泄不得化水而泄如白朮附子湯證甘草附子湯證桂枝附子湯證是也惟寒邪已與熱搏其勢兩不相下兼有水停於中是其趣向本亦將從水化與夫痹已經久但行於外而絶於中則均當使其合一就而下之縱使小便不利亦自能去不然寒熱邪氣之下何以不係他證而肢節痛亦寒溼風痹所固有亦何必更係此三言於下耶特通身攣急之候則不必更論其新久以寒溼風氣既遍於身則已與中聯絡遂不得俟其但肢節痛而後與秦艽以秦艽原羅紋密織遍網合身也後世以之治黃疸是寒熱邪氣中有水之明驗以之治煩渴是寒溼風痹中有熱之確據白芷根長尺餘白色粗細不等枝幹去地五寸已上春生紫葉相對婆娑闊三指許花白微黃入伏後結子立秋後苗便枯以黃澤者為佳圖經苗短根長本主攝陽入陰以行陰中之化遠志秦艽莫不如是惟白芷則以其味辛色白性芳潔而專象陽明燥金故宜歸陽明第陽明主腸胃為穢濁之所叢集而性潔者喜行清道則其最相近而相隸屬者莫如血海故其用為入衝衇為之行其陽用以去其穢濁蕪翳陰之既成形者水火之屬血也淚也涕泗也津也溺也今觀夫水一若流行坎止任其自然絶無為之推挽者然試思其所處之勢或平坦曠蕩而常停不動若無風以澄泌其間則凡納垢入汙必不終日而泥滓騰揚淤濁泛濫或高下懸絶而傾瀉無餘誠有風以宣障其間則仍能傾者平瀉者畜如潮汐之逆行如東風之溢漲則亦可知其故矣女人漏下赤白風頭侵目淚出肌膚枯槁非水無風以宣障耶血閉陰腫寒熱非水無風以澄泌耶是皆陽明血分所屬上則陽明經衇所及下則衝任所行也雖然衝任者上行陽明者下行以為有所隸屬是何言歟蓋惟其相竝而相違斯可以為節宣若相竝而相順則直推送已耳故素問骨空論之述衝衇也曰挾少陰而上行難經二十八難之述衝衇也曰竝足陽明之經夾臍上行惟其相違乃所以相攝且此以論衇絡而無與於藥也若夫白芷辛溫則其氣味為上行苟竝衇而論則陽明下而此則上衝衇上而陽明偏下一順一逆之間可見陽明能致衝衇不咸而白芷則宣陽明之流是漏下赤白者陽明穢濁墜於衝而衝遂為之逆也血閉陰腫寒熱者衝衇氣盛陽明不能勝也衝衇能鼓陽明之氣於上以和陰則自無風頭侵目淚出之疴陽明能運衝衇之血於外以和陽則肌膚自長而潤澤是白芷之用為其善致陽明之氣於衝衇善調衝衇之血隨陽明而其功只在去陽明之濁翳致衝衇之清和矣淫羊藿生大山中根紫色有鬚一根數莖莖如粟稈而細如線高一二尺一莖三丫一丫三葉葉長二三寸如杏葉青色又如豆藿面光背淡甚薄而細齒有微刺四月開白花亦有紫花者經冬不雕生處不聞水聲者良參圖經綱目諸疏本經家類視陰痿為陽不充淫羊藿之性偏寒則難於置說以故改寒為溫辛溫之物治陰痿固當矣不知於陰痿絶傷莖中痛小便不利亦有當否耶夫絶之訓為過後漢書郭泰傳注陽過盛陰不得與接陰過盛陽不得與接之謂也又訓為斷廣雅釋詁陽道斷不得至其處陰道斷不得至其處之謂也假云陰過盛陽不得與接則莖中痛云陰道斷不得至其處則小便不利有是理乎陰痿絶傷莖中痛小便不利者陽盛於下陰不能與相濟也陽盛則吸水以自資故小便不利陽壅則溺道阻塞故莖中痛淫羊藿為物妙能於盛陽之月開白花是致涼爽於陽中也其一莖之所生必三枝九葉是導水聯木以向金也一水數三木數九金數導水以接火則火聚聯木以生火則火安致金以就火則為火劫而停者皆應火金融液而下游火聚則陰不痿火安則莖中不痛傍火之物下流則小便利不可謂無是理也益氣力強志正與遠志之強志倍力對彼則陽為陰翳此則陽盛格陰彼去翳而陽光舒此陰入而陽光斂陽舒則力寬裕而優厚故曰倍陽斂則力宛展而不衰故曰益本經之所主皆有理可通若云性溫主真陽不足縱使有說能辨亦決不得一線貫注如此即如別録所載瘰癧赤癰能消下部有瘡能洗出蟲又豈性溫補真陽者可為力哉是以丈夫久服令人無子必更為有子而後可通矣明者自能稔之狗脊根黑色長三四寸大兩指許或有金黃色毛或有鞕黑鬚簇之大似狗之脊骨肉青緑色苗尖細碎青色高一尺以來葉兩兩對生正似大葉蕨又似貫衆葉細而有齒面背皆光參圖經綱目凡獸之脊負重者坳帖而不撓行遠者平挺而矢發絶有力者穹突而傾前狗則便儇狡捷之尤也故其脊坳突隨時折旋任意奔竄則挻捕逐則傾回轉如風蹲起如浪乃草之根有以似其形則能通關節可知矣黑主腎青主肝腎者作強之本伎巧所由出肝者罷極之本屈伸所由發相連而周運一身出於下者為堅強出於上者為便捷乃草根之皮肉有以似其色則能利機括可知矣人之脊為骨之長凡骨之屈伸以節節之能屈伸以脫脫則屈伸之機括究在筋而不在骨惟脊寸寸有節節皆不脫仍能屈伸是骨也而含筋之用為一身關機之所屬狗脊者皮黑肉青緑律以肝主筋腎主骨之義絶似骨含筋用周痹者風寒溼之氣內不在臟外未發於皮致真氣不能周也故其治在刺法則痛從上下者先遏其下後脫其上從下上者先遏其上後脫其下是截其流以探其源狗脊之所治腰背強是其源關機緩急寒溼膝痛是其流關機緩急所謂左急右緩左急者也寒濕膝痛所以別溼熱膝痛風溼膝痛也夫衆痹之痛各在其處更發更止更起更居以右應左以左應右是以不得為周今曰關機緩急則非以右應左以左應右矣曰寒溼膝痛則必更發更止更起更居各在其處矣故關機緩急冠於周痹之前而寒溼膝痛係于周痹之後以明寒溼膝痛之非周痹惟關機緩急乃為周痹而腰背強則狗脊之主證為兩病之所均有也此本經之最明析周詳遙應靈樞周痹篇黍銖無漏者也雖然味苦氣平則性專主降惟其苦中有甘平而微溫乃為降中有升降中有升是以下不能至地本專主降是以上不能至天而盤旋於中下之際為活利之所憑藉非補虛亦非泄邪有邪者能活利無邪者亦能活利是以頗利老人句著於周痹膝痛兩證之外以見其不專治邪耳其別録以療失溺不節更治男女有異何也蓋溺雖出於膀胱而啓閉由於腎啓閉之以時猶關節之以利利者過利必有不利者過于不利利者以時則不利者利矣所以然者腎固主藏五臟六腑之精而敷布於周身百節者也故以啓閉之機關可驗屈伸之機關以屈伸之機關可揣啓閉之機關用是知狗脊所治之失溺不節必機關有倔強之萌者矣治痿者獨取陽明陽明者主宗筋宗筋主束骨而利機關病涉宗筋男女自應有別腳弱俯仰不利痿之似而緩急之根關節重則痹之似而亦緩急之根其源於溼一也特宗筋縱者其病也疾宗筋縮者其病也徐故男子用狗脊遇弱而無力即應投之女子用狗脊雖至關節已重可也茅春生苗布地如針三四月開花作穗茸白如絮隨結子至秋乃枯根牽連長冗經寸成節柔白如筋甘甜如蔗乾之夜視有光腐則變為螢火乘雅參崇原王輔嗣易注茅之為物拔其根而相牽引故曰茹茹相牽引之貌今觀夫茅皆生墳壤凡欹傾處有茅則不崩潰以其互相牽引能使土相屬也低窪積水之地則不生有茅處則不積水以其體滑能瀉水也然生於燥土而偏多津榮於春夏而偏色白花茸茸然白而有光偏開於初夏葉枯後猶挺然殷赤雖至得火即燎亦不萎是其於至陽中得濃陰於至陰中得堅陽惟其於至陽中得濃陰故凡勞傷虛羸證中能為之補中益氣也於至陰中得堅陽故凡瘀血血閉證中能為之除寒熱也夫勞傷虛羸之須補中益氣者定係火爍夫土而土不黏瘀血血閉之能為寒熱者必是陽翳夫陰而陰不服土不黏即崩析之初階陰不服即戰陽之著象得生於剛土十百比連互相牽引而多津之物使陰行於中陽散於外斯土遂受益而成發育之功陰得和陽而解鬪爭之擾名曰補虛非補虛也濟陰氣于陽中則陽自不偏剛而不能化氣耳名曰通血非通血也和陽氣於陰分則陰自不蓄怒而與陽相爭耳不然別録是為本經點睛者也其應勞傷虛羸補中益氣則曰除客熱在腸胃止渴堅筋其應瘀血血閉寒熱則曰婦人崩中耳利小便者即其不受積水之能事其苗下水者即利小便之尤有力耳劉潛江云白茅初春而芽屆夏而花用其根采以六月豈非以其始於木暢於火成於土乎故味為甘甘者專乎土也然當火土司令時偏不稟其燥熱而獨全其甘寒是能於至陽中稟清和之陰即以清和之陰轉達其至陽之化者也觀本經所主非以其裕陰和陽乎固非謂其以通利為能然亦不以止畜為功蓋其能行能止者皆陽從外而依陰陰從中而起陽流行坎止得應自然之節耳即謂其甘寒能和血血和而通塞不爽其度者猶淺之乎視先聖之言也其扼要只在熱散而陰和陰和而陽愈宣蓋在天之陽無陰則無以化猶在地之陰無陽則亦無以化也前胡春生苗青白色似斜蒿初出時有白芽長三四寸味甚香美苗高一二尺葉如野菊而細瘦七月內開黲白花與蔥花相類黲音慘淺青黑也說文暗廣韻又類蛇牀子花八月結實實紫色或皮黑肉白有香氣圖經參綱目陶隱居曰茈胡前胡為療殆欲同之李瀕湖曰茈胡主升前胡主降為不同豫謂言其同正足見古人立言深渾言其升降有殊雖亦未可厚非然立言之旨不如古人亦於此可見蓋二月生苗初出時有白芽七月開花氣香味苦兩物正同故其去結氣除痰推陳致新明目益精亦同惟茈胡主腸胃中結氣前胡主心腹結氣茈胡主飲食積聚前胡主痰滿胸脅中痞足以見茈胡之阻在下前胡之阻在上在下則有礙於升在上則有礙於降去其阻而氣之欲升者得升欲降者得降但舉目前而名之曰升曰降於理固不為悖特其功能竝不在升與降效驗乃在升與降耳夫在下之阻必係陽為陰遏茈胡之治能暢陽而仍不離於陰故陰亦得隨陽而暢在上之阻定因陰不從陽前胡之治能化陰而復不擾夫陽故陽亦得同陰以化陽暢則升陰化則降跡雖異而理則同命之曰同誨後學之真摯也命之曰異啓發後學之警悟也吾輩從事於此正宜領其啓迪之益雖然為學貴有心得主持勿眩陳言前胡主治以療字係痰滿於前以治字格傷寒於後得無痰滿云云者皆非外感傷寒云云者皆非內因歟而云風頭痛則仍不離於外因云推陳致新則仍不離於內積也夫陰隨陽化陽從陰降是為胸中太和之氣痰者陽為陰裹陰從陽滯也至滿於胸脅以為痞結於心腹而阻氣在內無同心協力之氣以拒邪則在外自有陰寒肅厲之氣相干犯是內因者即招外邪之根柢外邪者即托內因之枝節也前胡既能以仲春發育之氣化陰寒為溫煦復能以初秋涼爽之氣不使陽熾陰窮故相裹而不相離相持而不相下者得此遂相和洽而無相奪倫痞者為之開結者為之解固無論矣即緣內乖所招外侮既無根柢可憑更於何處托跡曰風頭痛去痰下氣治傷寒寒熱推陳致新言惟痰氣在中斯風得乘之而為頭痛惟宿熱在內斯寒得與相爭而為寒熱去其在裏之勾引而在外者自無所容是治字者界於兩語之中以為間隔非提曳全文而為領袖也然則所謂傷寒寒熱推陳致新者得無嫌於推去舊熱招引新寒乎夫惟服攻下之劑方能推送在中陳腐新邪遂乘而內入前胡氣味形體均在解散之列焉能引邪入裏推陳致新者解散相因積聚之熱招徠新化和煦之陽使拒外相侵陵之寒之謂也白鮮苗高尺餘莖青葉稍白如槐亦如茱萸四月開花淡紫色似小蜀葵子纍纍如椒根似蔓菁皮黃白而心實其氣息都似羊羶圖經凡草之根多於花實後津氣返本方自堅實獨白鮮於花實後則虛耗豈非取其極升長時津氣反下行乎凡草之氣無論香臭腥臊多發於枝葉花實獨白鮮藏羶氣於根豈非取其剔幽隱之邪乎故氣之因下蔽而致上泄病之因內不通而致外結窒者能主之蓋物莫能兩大優於此必絀於彼頭面多汗咳吐痰涎究竟所去者少小便不通不爽詎非所壅者多此黃疸淋瀝所由成惟極於上者能使之下斯上者解而下者亦解矣且治病之法兩源而歸并一處則當兩路剿除兩歧而共出一源則須直探一致今內之結腫能緣隙而外溢外之強直不得破結而內訌此女子溼痹死肌不可屈伸起止行步只源於陰中腫痛者可以專攻其內而外自解也凡上擾者多風則下結者為溼內壅者惟熱則外溢者是風臭之羶者本屬風既已藏於根柢則可除上冒外迸之風味之苦者本化燥氣之寒者本已熱既已託於體質則可除內鬱下蔽之溼熱此其所致雖有兩途然溼熱遏甚而拒風風氣阻礙而生溼熱在白鮮功用原可視同一轍此四肢不安小兒驚癇婦人産後餘痛之屬風時行腹中大熱飲水大呼欲走之屬溼熱不妨舉一物而盡治矣萆薢作蔓生苗葉俱青葉作三叉似山薯又似緑豆葉花有黃紅白數種亦有無花結白子者根黃白色多節三指許大莖有刺者根白實無刺者根虛軟軟者為勝春秋釆根暴乾圖經參唐本或謂劉潛江於萆薢約化陰導陽四字為宗旨推而廣之誠得左右逢源之妙不知萆薢何以為化陰導陽而本經別録所主何因可以化陰導陽愈也豫謂能化陰者以其或不花而實也能導陽者以其根多節也夫物之與氣必相感化而發又必相感化而藏感化之候即其極榮之際草木當花非其時乎而萆薢者不硜硜於花亦不硜硜於不花即花亦其色不一均無礙得成歸根復命之實味苦秉火氣平秉金金火相媾其所趨向蓋不問可知其必在陰矣何況節之義為陽出於陰陽阻於陰而終能上出又且迭出迭微陰陽因得相稱是其象明著於節卦猶不可為趨於陰而化導於陽而伸證耶是故化陰能使陰氣化也導陽能使陽氣伸也腰背痛骨節不強陰痿失溺老人五緩非陰不化而陽不伸乎風寒溼周痹及惡瘡不瘳之熱氣傷中恚怒關節老血非陽不伸而陰不化乎若恃他物則化陰者未必能導陽導陽者未必能化陰縱兼取而竝收焉亦已彼此各效其長而不能一氣聯絡矣又何以利機緘調緩急耶惟導陽即以化陰化陰即以導陽斯視陰陽如一氣平偏側為太和而止者自行行者自利矣善夫潛江之言謂萆薢為足三陰藥而足三陰即足三陽化原如陽虛則陰必實能化陰而導陽以達詎非補陽之助乎若陰亦不足難遽補陽亦惟益其陰氣而借化陰者以導於陽耳更如益血而不有此以化陰導陽則驟補之血不將與亢陽杆格乎故亦須是以轉其樞蓋腎為至陰脾為太陰而肝則陰中少陽經所謂一陰為樞者固化陰導陽之關鍵也即如後世咸謂此能分清濁夫陰化則清升陽導則濁降故能止小水之數又療小水數而莖中痛是非其化陰而清升者乃所以止便數導陽而濁降者乃所以療莖痛乎然又何以見其入足三陰也夫有花有實有莖有葉而獨用其根故有以知取其入下矣況莖有刺者根白實莖無刺者根虛軟而虛軟者為勝不更可知取其鬆發於內而條帖於外哉抑其團結於下而扶疏於上又確然其根與莖之概且葉必三叉則其底裏之具於中效驗之著於外舍足三陰其孰克似之即其化陰而不致陰虧導陽而不使陽亢亦於此可尋其端矣大青春生青紫莖圓似石竹高二三尺葉長三四寸面青背淡對節而生八月開小花成簇紅紫色似馬寥亦似芫花結青實大如椒顆九月色赤根黃參圖經綱目時氣頭痛大熱所謂太陽病不惡寒者也太陽病不惡寒者得有口渴不得有口瘡口渴者熱只在氣分口瘡則熱於依形矣金匱真言論曰中央黃色入通於脾開竅於口藏精於脾是口瘡者熱依脾胃也巢氏曰發汗下後表裏俱虛毒氣未盡而薰於上故喉口生瘡則口瘡者不得發於病初起時是頭痛大熱口瘡為發汗下後病仍不去牽連表裏之候非太陽初得病即能竝見此也大青所以治此者為其青葉發於紫莖紫花結為青實紫者火依於水之象青則從內達外之色故能使在內附於津液之熱傾裏透達也且其開花以八月結實以九月而釆之以三月四月是取其鋒湧外出之氣不發泄於草而發泄於人身也況其實見霜便赤又可見熱在內蒸騰外出倘遇寒遏而熱勢益劇至成斑疹或為喉痹者亦惟此能發之矣惡實即牛蒡子也一名鼠黏子三月生苗起莖高者三四尺葉大如芋葉而長四月開花成叢淡紫色結實如栗球而小萼上細刺百十攢簇一球有子數十顆其根大者如臂長者近尺其色灰黲七月釆子十月釆根綱目參圖經惡實明目以象形也其象形奈何則以其殼象目之胞胞上有刺象目之睫然則謂補中除風傷何也夫以惡實明目正為其能補中除風傷耳風氣通於肝風傷即肝傷肝傷則中無所疏泄而亦傷中傷斯上注之氣不精而目之明減矣惡實以木氣盛時生苗起莖以初交火令開花紫色不正似肝家升發之氣挾血上注為精明乎在水穀之氣其升發精微也亦賴以清濁攸分而不混是中之受益固已矣能不謂因除風傷而補中因補中而目明乎雖然此皆風傷已後陰陽乖錯情景也不審知風傷當時形狀何以見目之不明中之不足由風傷乎夫風傷時形狀非他即下文根莖之所主是已傷寒寒熱汗出內風與外邪相搏兩不相下也中風面腫內風不受外風也消渴熱中逐水內風外風相拒難解遂化熱而致水漲也此非皆本身風氣受傷之源耶味辛者擅通氣平者擅降況是開花結實後氣已退藏於密將為他日生發之基者其能不使內風受驅逐外風之傷而使外風遂無所應不能內侵以為傷又何疑矣後世不用根莖惟取其實以治若此等證於理雖亦有可通者但欲述是物之所以然不得不如是界域分明耳水萍俗名浮萍季春生池澤止水中或云楊花所化一葉經宿即生多葉葉下有微鬚即其根也有背面皆緑者有面青背紫赤若血者謂之紫萍入藥為良綱目時至季春天氣晴暖楊花始飄萍非必生於楊花然適生楊花後暖氣正盛晴爽方多陽欲畢達以隔水而未諧水欲漲溢以值旱而未得夏小正三月時則有小旱四月越有大旱乃不生于流水而生於止水者以流水順化止水軋化軋化正以其隔陽氣也隔陽氣何以生萍則以值旱而水不得漲溢也故其為狀外帖水面內含血絡乘夫陽而發於陰引水氣而交於火轉不相續為聯絡致兩相拒為成和故能於人身凡水不化於陽而外不得澤肌腠上不得潤咽嗌下不得通調膀胱為暴熱身癢水氣消渴者使陰際陽而化火交水而和上奉下通外彌遍體且不特淪浹無間即鬚髮亦藉此以鬱蔥蓬勃矣獨謂其勝酒酒氣悍以清能後穀而入先穀而液出且更勝之速何如也夫勝酒兩言列於暴熱身疾下水氣長鬚髮止消渴之間可見其行於外行於下能不讓酒之速特酒以氣為用則熱與水雖去而氣亦傷故凡酒後溺多汗多者口必渴萍則以質為用熱與水去而陰液反裕并能止消渴亦可知萍之帖水而平能使水氣生動而不使水氣消耗觀於暴萍者必下承以水始得乾萍乾而水不耗不可識其性耶地榆宿根三月內生苗初生布地獨莖直上高三四尺對分出葉葉似榆而稍狹細長如鋸齒狀青色七月開花如椹子紫黑色根外黑裏紅似柳根道家燒作灰能爛石圖經凡物之色赤應火而黑應水何以火誠赤而水無色也人之身氣似火而血似水何以血反赤而氣無色也夫亦所謂積厚流光耳星星之然於燈燭涓涓之盛於杯杓杯俗作杯通作杯說文又何嘗赤又何嘗黑惟其勃發燎原回光返照斯不勝其赤幽元深邃驀地無見乃不勝其黑試分之挹之猶赤固非赤黑亦非黑是故無色乃色有色乃非色也人色之著於形體何莫非以赤驗火以黑驗水至於周流之氣血不有火盛而血益赤火衰而血遂淡乎是知有色者係火胎水中無色者乃水交於火以故氣鼓血行血隨氣順為生人之符氣違血散血窒氣壅為病人之本地榆之根黑外赤內水火不相入而偏際風木之極盛時生三月遇風木之受制時榮七月不似氣血之相違乘間插入風邪以為病乃轉能化風氣為生氣以開紫黑色花遂可驗氣已入血血已隨氣耶夫紫黑固水火相間之色也婦人乳病甚多此乳字當作生産解漢以前生産皆謂為乳曰産後者始自金匱要略也不被風者不痓金匱要略曰新産血虛多汗出喜中風故令病痓痓不必皆痛故産後痓不必盡可以地榆治惟痓而且痛乃地榆所專主也以是推之七傷帶下病亦非風不痛巢元方曰婦人帶下六極之病衇浮則腸鳴腹滿衇緊即腸中痛衇數則陰中癢痛生瘡衇弦則陰疼掣痛浮緊數弦皆有風象者也則地榆者不治別因之帶下并不治七傷帶下病之不痛者惟能為七傷帶下病止痛又可見矣何況血去氣散風乘虛入而為惡肉風乘營衛之相遭而鼓蕩為汗金瘡被風而痛不可瘳不皆為地榆所屬耶別録之止膿血諸瘻惡瘡熱瘡産後內塞作金瘡膏皆於本經推類言之惟消酒除消渴補絶傷則其義若別有在者然氣盛而鼓風入血何異血虛而風乘以入風入而更耗其血何異風入而大耗其津液風橫梗於氣血之間何異氣血之不相續則仍是血虛氣違為根本風氣攪擾於其間乃為病而治之以化風氣為生氣致氣血使調和得巽而相入矣澤蘭生水旁下溼地二月宿根再發紫莖素枝赤節緑葉葉對節生光澤有歧八九月漸老枝頭成穗作花紅白狀似雞蘇久之花瓣轉白絨裂如球球中有子一粒絨著子上色黑味苦臭香氣烈即千金花也佩蘭澤蘭同類異種但以莖圓節長而葉光有歧者為佩蘭莖微方節短而葉有毛者為澤蘭氣味俱疏淡而功用自別乘雅紫者水火相間也白者氣也赤者血也紫莖素枝赤節明明水火相混於內逼氣於外有血為之阻也誠如此者阻於中則為大腹水腫阻於外則為身面四肢浮腫阻於軀體則為骨節中水若澤蘭者雖已如是乃非特不閡其生全且難禁其芳烈而色緑光澤之葉相對以生層出無已復開花成實焉可謂鍾生氣於血阻氣滯所成之水腫使阻閡自阻閡生發自生發而水腫自能消解者非耶雖然血何以阻氣氣何以為血所阻蓋氣傷而無以推行夫血則血滯血傷而無以滑澤夫氣則氣阻氣已阻矣而血復隔閡之幾何其不化水而成腫也故乳婦內衄中風餘疾皆氣血竝傷之餘復氣傷未至餒敗血傷未至枯涸則紛紛零亂之氣血踞於流行之衢橫於四達之隘而血阻氣滯氣阻血滯實不足也而已翻成有餘既無從下又不可補捨象形之物致生氣於其中而誰恃哉再徵之以金瘡癰腫瘡膿亦復何異皆為其虛中有內塞之者耳火衰則化水火盛則化膿曾無甚分別也高良薑春生莖葉如薑苗而大瘦如碧蘆高一二尺許花紅紫色如山薑花春末始發初開花抽一幹有大籜包之籜竹皮也類篇籜坼花見一穗數十蕊鮮妍如桃杏花色蕊重則下垂如葡萄又如火齊瓔珞及翦釆鸞枝之狀每蕊有心兩瓣其子名紅豆蔻似草豆蔻微帶紅色二月三月釆根用圖經參桂海志凡味辛氣溫芳香之物類取其陰中通陽而用其根則有取於從土外達凡根采掇於花實後者類取其收藏釆掇於花實前者類取其散發若釆掇於臨花發時則一取其去病之速一取其去驟來之病也高良薑以春末開花采根於二三月而所主是暴冷斯其義詎能外是哉雖然暴冷與痼冷又何別耶夫痼冷於人身已有奠居之所人身元氣已有附從之者不比暴來之冷破空而入主客之勢既未相親格拒之形又已著見試觀下文所謂胃中冷逆霍亂腹痛者為何如證乎若胃肯受其冷冷以胃為窟者則必下泄決不上逆若霍亂手足厥者縱自吐利必不腹痛為非浸淫潰敗之由此暴冷之所可徵高良薑之所可用也至其子則性向下矣故其功能在下而亦與根不甚相差百部根春生苗作藤蔓葉大而尖長頗似竹葉面青色而有光根下作撮如芋子一撮乃十五六枚黃白色二月三月八月釆暴乾圖經百部主咳嗽上氣按其形象當謂似肺朝諸經衇得經衇之軿輳集其益而病已矣殊不知根下撮如芋子至十五六枚之多咸黃白色白為肺本色黃乃脾色則似肺致脾氣以布於他矣尚得謂諸衇朝於肺乎蓋咳嗽上氣既已習熟遂難倏止則向之引風寒痰熱為咳者至無所資則轉引脾家輸肺之精以為賴藉百部根當能於肺朝百衇時各令帶引精氣輸于皮毛於是毛衇合精行氣於府府精神明留于四藏而氣歸於權衡咳嗽上氣焉有不止者此其咳嗽上氣為何如咳嗽上氣可憬然悟矣蘹香深冬宿根生苗作叢肥莖絲葉五月莖粗高三四尺六七月開花頭如傘蓋似蛇牀花而色黃結子大如麥粒輕而有細稜青色八九月釆實陰乾參圖經綱目蘹香子之主諸瘻非以其葉至莖杪轉即下垂耶諸瘻之在頸腋原以痰氣不得上下故耳蘹香子之主霍亂非以其葉上出不矗過莖端下垂不重引莖屈耶霍亂之為吐利原以中宮不支遂致崩潰故耳古人曲體物情深諳病本徵理按旨帖切求合者蓋如此學者所宜三致意也然是物也唐人始筆之書而千金方於霍亂僅一二用於諸瘻則不用外臺祕要方於諸瘻常一二用於霍亂則不用自日華子著其有治乾溼腳氣腎勞頽疝陰痛開胃下氣之功後之人遂一以為治疝之劑非特忘其能主諸瘻霍亂并所謂乾溼腳氣腎勞陰痛胥辨髦置之矣用蘹香子者世宗日華則當究日華所以用之之故凡物感深冬之氣區萌達櫱其屬陽者定非天之陽凡藥物能生發地中之陽者甚多然其為用不過驅陰霾助蒸騰強陽氣行脾著有一端已耳惟蘹香則自生長至成實經歷四時蔚然長青生氣蔥鬱而枝枝挺直葉葉倒垂如絲如縷極清析而不亂是其伸於上者皆行於下之先機比之腎中有陽乃萎頓而不伸遂致下部陰氣盤旋屈伏比連壅腫者適相反對而其味辛氣平不剛不燥伸其固有之陽開其障蔽之氣行於下而不冒於上試思腳氣頽疝陰疼有一病在腎之上否曰腎勞者明腎因勞而陽不伸因陽不伸而濁氣遏之遂使清氣不能周於下也疝病非一有寒疝有頽疝寒疝者寒勝頽疝者氣勝寒疝病於少腹頽疝病於睪丸茲曰腎勞頽疝亦可知其疝之非因寒而為腹中㽲痛者矣開胃下氣者緣其氣之平而芳味之辛後有甘也於此更可見諸痿之升不能升降不能降與霍亂之過於升并過於降為一體其用蘹香可愈均以其能開胃下氣而諸氣自條達升降合度耳薑黃宿根春末生先花次葉花生於根與苗俱出紅白色入夏花即爛而無子葉青緑長一二尺許闊三四寸有斜文如紅蕉葉而差小秋末漸雕於八月釆根切片暴乾用根盤屈黃色類生薑圓而有節唐本參圖經鬱金四月初生苗似薑黃花白質紅末秋出莖心無實根黃赤取四畔子根去皮火乾用之唐本參圖經血結而氣違血脫而氣澀此其病固在血而其咎實在血中之氣與大氣相混淆也血中之氣謂何即中焦之營氣所以帶引血液行於衇中者也此其氣清純雖與水穀之悍氣同出中焦然一則直達上下一則周流表裏設清氣混于悍氣隨而直達則上為嘔血吐血衄血下為大便下血悍氣混于清氣不隨而周流則滯為惡血結為積血陷為血淋尿血溢為金瘡常破不能生肌大率血之結且滯者必與氣違故血積必下氣血之陷者氣因之遂澀故血淋尿血必為痛也鬱金何以能治蓋以其本行血中之氣又其取用者為四畔之子根固係屬于正根而實不與正根混連者為清純與剽悍原各鍾生趣雖呼吸相通而有別也獨鬱金主治竝不言能除風熱消癰腫薑黃主治則云破血除風熱消癰腫功力烈於鬱金何也互文見義其理可徹也心腹結積疰忤不關血分不為下氣風熱癰腫不結於血不必冠以破血此其於薑黃蓋取其根盤結而有節也氣與血相阻即氣與血相違氣因血而盤旋血得氣而固結一若有節以礙其流行者殊不知流行自若轉因有節而生氣得鍾花在葉前透達精英甚猛比于鬱金行血中之氣者為更速大抵二物均以春盡方芽屆秋便殞有花無實花白而紅皆秉火金之氣化而榮遇土金之氣化而歸於土一似心肺之媾于上而生血遂順流於中而稟脾之統轄其能濬血分之源行血中之氣又何疑矣特一則即根而盤錯一則離根而圓渾見其氣稟有純獷之殊故其趨向有上下之別大凡氣結血中作痛下氣在上而不見血者用薑黃氣陷血中作痛下氣在下而見血者用鬱金庶無誤矣補骨脂莖高三四尺葉小似薄荷花微紫色實如麻子圓扁而黑九月采圖經骨髓腎精皆水屬也凡水遇寒則凝得熱斯流今曰腎冷精流于理已不合加之骨髓傷敗而冠以風虛冷風虛冷者果能使骨髓傷敗腎冷精流乎夫惟風虛冷乃能為骨髓傷敗腎冷精流固也然有二義焉一者風冷而水遂涸也一者風虛而水不漲也風冷而水遂涸驗之於四時之序風虛而水不漲驗之於潮汐之候夫風從西北者為冷風風從後來者曰虛風一歲之中熱則水漲寒則水消一潮之上東南風則水漲西北風則水不漲蓋凝則成形釋則成氣者陽也凝則成氣釋則成形者陰也故曰陽化氣陰成形此水所以盛于夏減于冬也至陰之氣當冬令閉密嚴厲則水凝為寒也轉瞬春融不必霖雨水自能盈則寒釋為水也天氣且然何況人身當五勞七傷之餘遭簫索飄零之局髓之充于骨精之藏于腎者何能不化而為肅殺嚴厲以應之於是靜而不動者為之傷敗焉動而不靜者為之流散焉於斯時也得不以溫和之氣踞于水中轉冷風為融風自然傷敗者復完冷流者復聚此則必有取于花紫而實黑且味辛氣熱之補骨脂矣補骨脂何以能踞水中而轉融風夫花紫固已赤黑相兼水火相入且黑實正是水色而味辛氣熱即伏其中則辛之通熱之行直如風自東南來解凍澤物轉寒氣為溫氣也婦人血氣墮胎者承上之詞亦以血氣虛冷傷敗而不能係胎元也此物當與天雄之治陰寒精自出巴𦺩天之治大風邪氣陰痿不起互參也縮沙蜜苗莖似高良薑高三四尺葉青長八九寸闊半寸以來三月四月開花在根下五六月成實五七十枚作一穗狀似白豆蔻皮緊厚而皺如粟文外有刺黃赤色皮間細子一團八隔可四十餘粒如黍米大微黑色圖經益智子葉似蘘荷長丈餘其根旁生小枝高八九寸如竹箭無葉二月花萼作穗連著實叢生莖上五六月實熟大如棗中瓣黑皮白核中仁細者佳圖經參南方草木狀或曰詳觀縮沙蜜益智子形象氣味不過與諸豆蔻等致用土金已耳而核本草主治若一能宣火之用於水一能攝水之氣於火其義何居曰以形象言則二物皆挺發高大而一則係實於根一則別係低枝花實皆蓄縮於下是其導氣使歸不與諸豆蔻之導氣以行者同此其一也以氣味言則氣之香者屬土天地間水火無土不能相入味之辛者屬金人間水火無金不能互交導之行者升降自由金木導之歸者往返自隨水火是其交通陰陽不與諸豆蔻之分理陰陽者同此又其一也然二物各有親切著裏之理在縮沙蜜則皮黃赤而核微黑味兼酸且鹹也是火土之效用卻固護夫水辛通之循職卻歸根於水故曰主虛勞冷瀉宿食不消赤白泄利腹中虛痛下氣皆火土之氣隔礙不能下交於水而水無防範恣性橫流之候也在益智子則皮黑核白味兼微苦也是水之衛乎外能致火之斂於內苦降之循其職能致水遂滋火而火明故曰主遺精虛漏小便餘瀝益氣安神補不足利三焦調諸氣皆水氣不斂不能上交於火而火萎餒不能自持之候也以大致而言則諸豆蔻主通二物主攝就二物而言則縮沙蜜主降益智子主升然縮沙蜜之降乃去其有形以歸無形益智子之升乃致其有形以稟無形而其歸根復命之元實亦與諸豆蔻等為恃其辛涼收肅之力蓋南國氣候冬月類無退藏嚴密之令而夏月之發越多晝酷暑而夜即涼爽是諸物之育秀於是者皆發中寓斂與中土之發者自發斂者自斂又不同也莎草根即今香附子其葉如老韭葉而鞕光澤有劍脊稜五六月中抽一莖三稜中空莖端復出數葉開青花成穗如黍中有細子其根有鬚鬚下結子一二枚轉相延生子上有細黑毛大者如羊棗而兩頭尖采得燎去毛暴乾用綱目理有常然物莫兩大戴角者無齒附翼者兩足無可妄增減也乃莎草者既挺莖成穗結實如黍復根引連續實如羊棗上已葉發繁茂下更根縷猥多其氣可謂盛矣然益當究其所由既無偉岸之莖又乏魁碩之根而繁盛如是可知其生氣獨鍾於根與葉之間比之人身則胸中也縷析之根則縈洄臟腑之衇絡也條秩之葉則周浹一身之經衇也惟內行之氣不縷析瀠回外行之氣不條秩周浹斯胸中為熱充氣於皮毛而熱已是除胸熱即以充皮毛充皮毛正由除胸熱氣聚於內而不達氣餒於外而不繼則皮毛為悴內氣得達則為益氣外氣得繼則為長鬚眉是益氣即以長鬚眉長鬚眉正由氣益雖然是皆氣為之病調氣即以除病也奈何後之人皆謂為血中氣藥氣主煦血主濡煦者能生而不能澤濡者能澤而不能生故但啓發胸中之熱使出皮毛而無血介於其間何以稱充但透達在內之氣使抵鬚眉而無血介於其間何以稱長曰充曰長非為其血隨氣行氣曳血展氣不耗血血不阻氣耶所以然者正由其根絲縷曲屈而生實生毛其葉光澤柔韌而不折不撓也要而言之是物之概鍾於下者陽澤於上者陰故後世以之治氣多鬱而不達之氣以之治血多下而不上之血言其兩到則有升降之殊言其獨詣則擅闔闢之能矣霍香二月生苗莖方有節中虛作叢甚密葉似桑而小薄七月擢穗作花似蓼房似假蘇子似茺蔚五六月未擢穗時釆莖葉暴乾踰時則性緩無力矣圖經參綱目乘雅霍之為言護也太陽用事護養萬物也白虎通德論巡狩霍者萬物盛長垂枝布葉霍然而大風俗通山澤香土之臭也小戴記月令注由是言之則霍香乃得火之發舒暢茂得土之敦厚化育者也既能發舒暢茂則惡毒陰厲者逢之輒消既能敦厚化育則惡毒陰厲者遇之輒化緣於乘春以生遇夏即茂屆秋擢穗開花體天地之正令而體方有節叢密虛衷又具天地之嚴整惟其氣味不內存而外馳故終為宣導良劑能剿除亂略以扶危定傾不能坐鎮雅俗以消化頑梗不然其能豈止於為風水去毒腫為霍亂去惡氣心痛耶雖然風水霍亂仲景述之甚析辨之甚明傷寒論金匱要略可考也乃風水證竝無毒腫霍亂證竝無心痛何也夫惡毒之氣與六淫之偏勝固是有別而人身元氣則原有常被其傷犯者皆猝然之間閡其機關也非俄頃之故則殊途而同歸者終不能有纖微分辨於其中故風水本係風病若間有腫而難移之處則當明其為毒霍亂本係寒病若兼心痛則當知為惡氣惡氣與毒無風寒之引原不能深入人身臟腑風寒無惡氣與毒則僅能為風水霍亂而不得有腫及心痛是故仲景只道其常至其兼候變遷要令人深思旁搜以應之此古人之書所以疏而該也若使霍亂篇水氣篇必羅致瑣屑如此則雖百倍其籍且不能備即霍香之用亦緣此可明若厥逆無衇之霍亂身重汗出惡風之風水不以之治矣鱧腸苗似旋覆花葉似柳而光澤莖似馬齒莧高一二尺許花細而白實若小蓮房其苗實皆有汁出須臾變黑俗謂之旱蓮草亦謂之金陵草八月采陰乾圖經黑固水色水卻不黑其有黑者東海著黑水之洋則水之極窪不更他引處也禹貢雍州黑水則水之極僻不通他流處黑殆引水使歸之壑不更移徒之窟歟說者謂天本蒼蒼而目之為元則以其幽遠不可窮然則極下者黑極高者亦黑是黑者陰陽之廓而不可踰越已旱蓮質本不黑即其汁亦何嘗黑乃出之俄頃遽變為黑此則方才踰越遂止不行之驗也故其所主之證只長鬚眉一端已可證其以黑護血為甚固以血澤黑為甚速也而血液之妄出若吐若衄若金瘡均中無黑者惟下利則有如汙泥如敗醬皆緣色黑之物潰血液遂隨之以出況針灸瘡痂必黑至發而洪血必黑者已破是可見黑敗而汁不固者須以汁出而能變黑者止之血屬水而載火以行黑非能止水乃以拒火者也以黑物止血須識此義而用旱蓮則當以中見黑為準中品木五味獸五味蟲三味果三味穀五味菜四味木耳生朽木上無莖葉竝無根株帖生於樹體似薄革形彎曲如人耳之邊其良毒悉隨木之性今僅有黑者其黃白金諸色絶無有也參綱目朽木之氣上結為諸菌其液上結為木耳猶枿松之氣下淪為茯苓其脂下淪為琥珀也琥珀利水消瘀其性下通則木耳止漏除癥其性上出夫血生於氣氣生於穀而血注於經凡多血之經皆主下行惟衝任起於下流極處而主上行血至於是賴衝以容之任以妊之挹引而入儲蓄經月二衇既滿乃得下出故曰血海言為衆流所歸應期以生潮汐也然肺以朝諸衇心以攝諸衇朝之而不能布政令歸之而不能定約束則衝失其容任失其妊遂不上朝不歸往矣於是不由政令之氣不遵約束之血如巵無當而系系延延不竭不爽名曰漏下赤白汁以見與整月乃行之經稠黏不斷之帶均有異也桑耳者取其肅降綢繆之氣化以入肺而布政令更取其挹液變色之形質以入心而定約束政令既均約束不愆則諸衇諧暢和調非特不上稟而下滲漏者可已即不滲漏而結成癥瘕釀成積聚者亦可通以女子帶下癥聚固竝屬任衇為病也陰痛陰傷而成寒熱亦由氣火挾血下注而不上承致氣血爭道陰陽交戰耳要而言之結為耳者木之液也致液為耳者木之氣也不結於別時而獨生於盛夏多雨時者大地間生氣收藏發越由微至者無一息暫停即使枯木朽株偶賸精英不致徒歸泯沒乃復隨氣賦形因色達用其入於人身有感斯通故雖枯槁之餘氣不盛不能致液液不靈不能變色皆以時令之發越雨露之濡潤媾合以成形溯源以成色黃者入脾以止泄金者入肺以除飲且竝有益氣不饑之功焉非氣之盛液即隨之以布耶特市肆所售恐非釆自桑者即不皆釆自桑亦終有益氣不飢之功矣檳榔木大如桄榔高五七尺正直無枝皮似青桐節如桂枝葉生木巔大如楯頭又似芭蕉其實作房從葉中出旁有刺若棘針重疊其下一房數百實狀如雞子皆有皮殼春生夏熟肉滿殼中色正白肉易爛不耐數日以灰煮熟熏焙令乾始可久留圖經草木有節必因中空中不空必因有枝不中空又無枝蘗而有節者則惟檳榔草木之葉叢生者必由地起不由地起亦必有枝蘗既非地起又無枝蘗而發於木杪者亦惟檳榔是其葉間所生之果上行極而下者非特行於內無或留阻即行於外縱有留阻之跡亦不礙其流轉之氣然檳榔之通行節間無復留礙而主消穀逐水何竟與甘遂之有節中實除留飲宿食破癥瘕積聚利水穀道者同其理蓋根是生發所攸繫故主升實為退藏所歸著故主降甘遂草根檳榔木實甘遂既可因味苦氣寒而下趨檳榔又何不可因味辛氣溫而上出況一株直上旁無歧互至五七丈方得發葉是其氣之坌湧上出甚烈但以歸根復命其升甚者降亦必甚故其實為下行特既沾水土旋可上生則降之後仍復能升本不必以其味辛氣溫也是故消穀者引穀下行及抵土中使之消磨還能令氣上出逐水者導水下行俾及通調之道還能令精微上奉是其行中道之功除痰癖者搜剔之疏通之不使隱處遐僻是其行旁側之力水穀通調氣機流鬯自無邪氣敢干其間生蟲作祟若一於降而總為破泄有如甘遂則人之比於果實終日咀囓何不見猝有大害耶可以知其故矣治宿食宜消治溲滑宜固消之與固顯相背馳決非一物所堪兼有而本草著録方家循用實能竝擅其長何也夫腎為陰藏而中有陽膀胱寒水之府而號太陽是其實皆體陰而用陽者烏藥色黑乃氣味辛溫且開花結實均以夏月不正體陰用陽者乎金匱真言論曰北方黑色入通於腎開竅於二陰即本草云主膀胱腎間冷氣皆推本之論蓋惟此陰中之陽德協地下之暖他日生發之氣於是而化盛長之氣於是而始中惡心腹痛蠱毒疰忤鬼氣盛長之氣所擊散也宿食不消天行疫瘴生發之氣所化導也夫然則膀胱腎間冷氣既攻衝背膂而親乎上者不猶烏藥之從黑根而生樹卻已轉冷氣為發育條達之氣耶特宜知溫而辛非溫而甘苦酸鹹者此僅能使陰中有陽而不條鬯者發不能使陰中無陽者生此則大有徑庭不得混合至其偏止小便滑數則巢氏曰小便利多者由膀胱虛寒胞滑又曰小便數者膀胱與腎俱虛而有客熱乘之故也是可知滑是滑數是數滑數兼稱自係水藏水府虛寒客熱乘之之故不得但作虛觀是透發其固有之陽以拒夫外來之熱化導而使之散耳特本草明言用葉而後人所製縮泉丸卻仍用根或者猝不得葉而根則肆中所常備究以其出於一本氣味不甚相遠亦可借用歟龍眼木高二丈許似荔枝而葉小凌冬不雕春末夏初生細白花七月而實成殼青黃色圓如彈丸核若木梡子而不堅肉白有漿甚甘美其實極繁每枝常三二十枚白露後采圖經甘肥黏厚之物決難治邪藉云治邪又豈堪安志安志矣何以復厭食夫厭讀為壓抑也謂壓抑穀氣使淫氣輸精入於經衇也諸衇者皆屬於心心有所憶謂之意意之所存謂之志衇氣諧暢經隧流通所憶既端所存胡妄五臟間遂氣攝於液志凝於精如金城湯池之不可攻尚何邪氣更敢干哉所以然者龍眼殼色青黃固象以木疏土肉本潔白轉而紅紫又象金火交媾化汁為赤味甘且厚恰大展力於中五臟之邪不能干與志之安總賴中之宣布則厭食為是物之功能主腦矣不然厭食而不及飲是安志而非定志強志主五臟邪氣而非除五臟邪氣又何為者耶竊嘗論之五志統於神而神行於氣氣復囿於精所以精減則氣耗氣耗則神衰神衰則志慮絀也如是者雖補救有方綴聯有物凡含氣於味者能從精而益氣寓味於氣者能從氣而安神仍有鉗氣於精攝神於氣者然皆僅能通其一節而不能統會其全體如龍眼者由脾而血衇由血衇而心上不能關鍵於肺下不能帖著於腎肝又何以云不使五臟得受邪氣耶不知五穀為養五果為助五畜為益五菜為充原非治病之物曰厭食則明明取為食之助以奉生非可恃以攻堅補缺者也奈之何欲與藥石竝列而言哉但凡居處之致慎飲食之合節能補偏救弊於日用尋常之間俾有所生而無所損則所謂主五臟邪氣者在此古人重治未病周官所以列食醫於疾醫瘍醫前也鬼箭生巖間小株成叢三月生嫩條長四五尺條上三面如鋒刃如箭羽黃褐色若柏皮葉似野茶對生四月開碎花黃緑色結實如冬青子削取皮羽入藥參圖經拾遺綱目下血汗出而不腹滿是産後鬱冒虛證汗出腹滿而不下血是傷寒陽明實邪腹滿下血而汗不出是癥瘕瘀血在中惟其崩中下血腹滿汗出竝見所以虛不成虛實不成實為邪因虛而難越虛因邪而益劇矣然此邪得以衛矛而除顧名思義則當得於已虛未虛之際夫捍衛不疏邪不得入不自警覺不護以戈矛惟其虛方伊始失於防範是以懼實邪之踵增禦侮耳所謂禦侮奈何蓋衛矛之外向者乃其皮莖之在中則猶圓也然苟儘其皮之圍以廓於外仍其莖之度而懸於中則外內不相接氣力不相連不得云衛且無所為矛矣惟其皮摺疊於外而其莖著帖於中斯呼吸相續還往相資在人身猶氣不因血之漏而汗出不休血不因氣之越而崩下不止遂有以使其在中之滿消而邪得除試以貫之鬼毒蠱疰何莫非正有間而邪得入邪既入而正遂虛即更合於別録所主之中惡腹痛白蟲及皮膚風毒腫千金外臺每以此治心痛皆可以知其所由矣血非與熱搏不為惡血癰腫猶可以性溫者治之乎豈知鹿角之自下上上歧中出歧兩兩相參燦然竝列絶似足三陰經也夫脾肝腎聯處中下均主引精血上奉其有藏氣不咸無以蒸騰精血而或為留熱或至滲泄若不用性溫之物何以使留者行陷者舉耶縱使惡瘡癰腫邪惡氣留血在陰中有挾熱者不妨以他物別除其熱鹿角則仍引其中未敗之血隸原統之經而上縈焉以免誅伐無過之咎至於折傷血瘀或血衇不續而腰脊痛或血衇留阻而少腹急痛者正須此通其流行之路而後病可已惟其性溫是以能致氣行惟其氣行是以能動留血故別録歸結其功而美之曰益氣無慚也已凡獸血皆不能至角惟鹿則角中有血是本能引血至上者況茸乃當舊角才解積血岔湧將欲作角之時逞其曳引之力正厚取其推送之勢方張而下溜者轉而上供餒怯者易而雄駿斯不特漏下惡血可止即驚癇寒熱中且能為益其氣強其志矣齒為骨之餘與角為骨之餘則能生角者不能轉而生齒乎別録所謂虛勞灑灑如瘧正以擴充本經驚癇寒熱之旨不但能益氣強志已耳就寒熱灑灑如瘧而羸瘦者或兼有四肢酸疼或兼有腰脊痛或小便不固或精自遺泄或溺中有血則此灑灑如瘧者不得徒以寒熱視之當知其精血不充陰陽相賊害宜建其作強之機益其雄壯之勢矣其他主治則猶角之所能而此更加靈耳羚羊角中胎似木其象疏以直外廓似革其象徑而曲然直不能穿曲而上出曲不能遮直使中止卒至直者愈出愈微曲者愈鋭愈厚而後已是直載曲以行曲包直至竟乃色白味鹹氣寒出於火畜之巔則為溫暖間發金水清寒之化上出而濟木火之窮矣木火之窮奈何在本經則目不明也心氣不安也常魘寐也別録則邪氣驚夢狂越僻謬也蓋火出於上必得陰濟然後能明猶燈之燃終賴有膏膏乏則燈暗而遇風輒炧矣起陰於至下以交陽於極上謂之益氣亦何愧哉凡陰墜陽中能從陽化非金水清寒之氣隨其所在而醒之又何能上出而與陽交惟難挽其下溜之性定至五液注漏而後已醒其陰使隨木氣而上出此惡血注下所以止也陽居陽位最易灼陰非金水清寒之氣隨其所在而濟之又何能下歸而從陰化惟難改其上炎之性必至格拒飲食而後止濟其陽使化津液而下潤此食噎不通所以止也傷寒時氣陰化陽之病也溫風注毒陽灼陰之病也陰化陽而熱僅在肌膚則起其陰使與陽浹陽灼陰而熱伏在骨間則導其氣使出於表不皆得相濟而相化耶信斯言也則羚羊角者必將胎溫廓寒外疏內徑而後可今者寒無內外之分且偏疏內而徑外又何說以通之耶蓋傷寒時氣寒熱熱僅在肌膚此厥陰厥熱相循之候也溫風注毒熱伏在骨間溫瘧熱隨汗發之候也夫以厥深熱亦深而言則必熱盛寒亦盛惟其熱中有寒則寒中必復有熱是緣表裏不相聯而不解使之聯而欲其解正用其疏內且性寒也以汗出熱發而言則必汗止熱亦止矣惟其熱因汗作汗出熱隨是緣表裏相聯而不解使之聯而欲其解正用其徑外且性寒也夫惟徑外以濟其流疏內以剷其本本撥而流易清流清而本遂徹總因其體有歧而性無歧也犀之於草不辨良毒於木專啖棘刺抑皆能化之其解毒已可見矣而其靈異若夜有光若分水若辟塵若蠲忿若驚飛禽走獸若駭雞則又何蠱疰能中邪鬼能侵瘴氣能染而尚迷惑魘寐之有哉本經所著功效帖切近裏如是奈何別録復以為傷寒溫疫頭痛寒熱證中療諸毒氣也且諸者不一之詞傷寒溫疫頭痛寒熱證中有幾種毒氣亦當明析以示也金匱要略曰面赤斑斑如錦文咽喉痛吐膿血者名陽毒曰面目青身痛如被杖咽喉痛者名陰毒則凡有表證而皮膚間有故者即為毒然有陽毒陰毒而不用犀角者以無表證也其用犀角者如古今録驗蒲黃湯小品芍藥地黃湯之動血面黃竝見外臺祕要二卷延年大青湯之發瘡如豌豆外臺祕要三卷古今録驗犀角丸之皮膚淫淫液液延年蒴藋膏延年牡丹膏之身癢風騷癮疹犀角竹瀝膏之熱毒疹癢外臺祕要十三卷皆外有表證而兼肌膚有故是可以為據乎李瀕湖曰犀角文如魚子形謂之粟文文中有眼謂之粟眼黑中有黃花者為正透黃中有黑花者為倒透花中復有花者為重透惟其外發花文性本苦寒故能治內壯熱而外復有所發矣其內壯熱而外咽喉有故者亦同此例則如廣濟療喉痹急疼悶妨不通方古今録驗療喉痹塞射干丸射干湯療喉痛腫結毒氣衝心胸羚羊角豉湯竝見外臺祕要二十三卷是也而其取義則又不在花文陳藏器曰犀角長而且鋭中有白星能徹其端竝堪通氣是以佳者名曰通天是又會意於能自中而徹於巔以去其阻礙矣以是解別録之諸毒氣尚有此義否乎其餘若腳氣若寒熱瘰癧及諸瘻竝多用此均可以是義推之也犀角本經別録無片語及治血乃後人偏以之治血且不特治血已耳如外臺祕要古今録驗蒲黃湯治吐血小品芍藥地黃湯兼治衄血竝見二卷近效黃連犀角湯見五卷刪繁升麻湯竝治利血見六卷舉凡血證吐衄下利崩中已耳而犀角者但崩中不主外胥吐衄下利而盡主之其功亦不淺矣本經別録概不一及何耶夫本經別録所謂毒蓋已該氣血於其間矣夫犀角苦寒所治者熱熱至可稱為毒其奔衝攻突於人身又有何擇況所謂吐衄下利者竝兼見於傷寒溫病天行疫毒瘧利中則又與療傷寒溫疫頭痛寒熱諸毒氣何異總以其自根至頂一線直通原無上下可分且有表證可驗但去其熱毒是剷病之根本非治血也而又安問其吐衄與利耶是可知捨本經別録所主而浪稱治血乃金元已後人作俑漢唐無此法也故友魏君培之嘗戲語豫曰犀角是倒大黃子之乎豫問其所以則曰千金云如無犀角以升麻代之傷寒雜治門木香湯下云毒盛者加犀角無犀角代以升麻升麻能於外寒內熱之毒使悉舉上行而散則犀角於內外皆熱之毒亦使悉舉上行而散猶大黃之下熱毒也可不謂大黃之倒者乎豫玩其言蓋殊有味也夫升麻之用在金貫水中水從木升以發越金氣而歸功於暢水犀角之黑質黃花非土貫水中乎其白星在中從根至頂一線直透非水從金達乎而咂而呼吸者可通氣出入非土金之氣皆由此發越以歸功於暢水乎然氣寒固屬水而味苦卻屬火寒載苦歷土抵金而直達於上則水之所至火皆與浹而無所謂相搏相擊焉是水之暢即火之和水火暢和即金土無不諧以是知所謂毒即火之依於金土者也試更思古人用以治氣噎可謂火之依於金乎救急療咽喉中氣噎方在外臺祕要八卷治胸膈氣脹廣濟枳實丸心腹刺痛廣濟麝香散久心痛腹痛古今録驗犀角丸竝在外臺祕要七卷可謂火之依於土乎甚而至療頭面熱風頭旋眼澀廣濟方在外臺祕要一十五卷眼赤頭痛延年竹葉飲在外臺祕要二十一卷耳腫廣濟方在外臺祕要二十二卷可謂不直達於頂乎雖然小品犀角湯張文仲犀角湯治下惡血猶可謂火依土金乎深師黃連犀角湯范汪麝香散竝見外臺祕要二卷猶可謂向上之治乎夫火不依土何以血遂變色而利不使火毒上出何以療下部瘡䘌謂非性向上而去依附金土之熱不可也由此推之則大黃僅能除自中及下之火犀角能使火之自下及上竝透泄無餘又大黃是蕩滌犀角是分解且有使與水相浹之義焉魏君可謂深知犀角者矣內自腑臟外及肌膚上至巔頂無毒不解無熱不除則犀角者可謂至陰之精歟非也夫首為陽人物一也矧出於首之端且堅剛不撓者安得為陰況非特其體陽即其致用亦在陽特成功則在以陰濟陽耳何謂致用在陽蓋其解毒除熱非令毒與熱如水之涸如火之熄如金之鎔如木之燼也乃於毒使毒散於熱使熱透耳何謂以陰濟陽蓋可以犀角治者其毒與熱必著陰苟非透達所著不散設使浪散其陰必耗惟犀角則能既散所著復不耗陰耳雖然此其功用上文皆已宜闡更有可為據而未及發者焉外臺祕要之用犀角治中風是也見十四卷近效薏苡仁湯則曰療暴風手足癱廢或四肢𢂽痹延年獨活湯則曰療歷節風流入腰腳古今録驗防風湯則曰主身體四肢節解疼痛如墮脫腫按之皮急千金排風湯則曰手足腫廣濟犀角丸此在十五卷則曰四肢煩夫頭為諸陽之會四肢則諸陽之本也陽之所以化風者在上則獨亢而不與陰交在四旁則壅間而不得陰濟也壅閼而不得陰濟則陽盛而癱廢𢂽痹節解腫急疼煩生焉癱廢等患得犀角而可解則可見陽所壅閼處犀角必至而達之竝不徒達之必且裕其陰以續陽而使陽達矣所謂四肢為諸陽本者為陽衇皆起於四肢也而陰衇則皆終於四肢是陽之壅而不行實緣陰之斷而不至也則所謂致用在陽成功在以陰濟陽者豁然可明假猛厲之威驅隱賊之毒操制勝之氣厭素伏之禽別録虎骨主療似只如是竝無甚難明者特今世用虎骨全注意甄權治筋骨毒風攣急屈伸不得走注疼痛一節得無以其能生風者之骨矯強悍疾若是正所以使筋骨因風遂不能動搖者起歟然筋骨因風溼而攣急致不能屈伸較之因風者其多不啻倍蓗因溼而用虎骨詎非大害亦何以的知其不因溼而必因風耶夫固當以走注疼痛一句足之矣溼係遲滯之氣能阻於一處為病不能走注而痛也驗之更有一法風以動生溼由動去凡攣急之候搖動而痛甚者為風痛緩者為溼何如蚱蟬即蠐嘈所化也方首廣額兩翼六足以脅而鳴吸風飲露溺而不便性畏日仲夏始化三十日而死蟬蛻是蠐螬化蟬時所蛻殼也乘雅穢濁瀰漫遏抑清化清化無以自伸乃旋與相噓吸變死為生得成蠐螬潔白為體蠕動其形然不能出於穢濁之表猶氣清而質濁者也由是而鍊清於中蛻濁於外清既足以自立濁遂結而成衣剖背以出一旦而高騫於樹嘹喨揚聲則已復厥清化矣是其清化於人為陰中之陽所以發聰明應萬殊者也假使因風因痰而生熱因熱因恐而致驚因驚因熱而為癇為癲則固恃以動靜云為者且為之閉鬱而不得自主以此神具理足之物導其噓吸之機濬其騫揚之路而授以鍊蛻之方陰中之清陽既達裹纈之穢濁自消然本經不直曰主癇癲而曰主小兒驚癇夜啼癲病寒熱何也夫蠐螬與蟬皆化於春夏被遏者固屬陽所遏者亦非陰也假使清陽為至陰所遏亦能化蠐螬而成蚱蟬耶故夜啼寒熱皆清氣之欲伸而不得伸濁氣之欲閉而不得閉有陰陽相爭清濁相干之道焉特小兒欲竇未啓思慮貞淳濁氣干之而不能入大人則情緒紛綸神志龐雜濁氣干之而竟能入故有煩擾與不慧之分惟小兒堅固於神懦弱於氣大人蕪纍於神昌沛於氣故夜啼者神之作用寒熱者氣之作用更當知啼以夜者寒熱必於晝以夜則濁之淤愈甚而晝則氣之昌有加也至婦人乳難胞衣不出則會意其善蛻竝無甚深妙義然即此推之其用蓋有不止此者擴而充之可也烏賊魚生海中形若革囊口在腹下八足聚生口旁其背上只有一骨厚三四分狀如小舟形輕虛而白又有兩鬚如帶甚長遇風波即以鬚下矴粘石如纜腹中血及膽正如墨可以書字但逾年則迹滅耳皮黑色肉白色九月寒烏入水則化此過小滿則形縮小圖經海舟遇風勢虞漂覆則下矴魚非畏漂覆者何以亦下矴不知魚固優游涵泳於水若掀舞簸蕩非所樂也況云九月寒烏入水所化過小滿則形縮小是烏本以不勝風力故下矴而為魚雖既為魚豈忘風猛且思休息若不下矴終無休息之期小滿已後風力自微而此物防範勇敢之氣亦遂懈是以形轉小不曰瘠而曰縮人身之氣猶風也血猶水也血由氣而化以氣而行氣由血而澤以血而安若血有所脫則氣遂獨勝而激揚飄驟不能絪縕相感而相化於是怒則促血妄出而成漏巵弛則任血結聚而為癥瘕得此輕虛潔白骨之似氣者既能從空際下矴於水而為魚轉危殆為安居復能水中下矴於石更便安居牢固焉可會意夫攝氣入血固氣即所以固血氣順而血不能不順矣若命曰澀或命曰通其理均有所隔觀其肉能益氣強志不可為攝陽入陰之證耶論蠶者當從其㒩㒩屢化之意㒩作倮謂蠶也蓋當其為卵不厭霜雪及至成蠶竝忌西風此其在陽固蠕動靈活在陰則堅貞不搖之一驗也其自有生以至成繭僅二十二日之暫乃眠起三次起則叨食無度眠則噤口停茹此其動必返靜以靜攝動之一驗也一眠祇六七日始生色黑繼而白白而青青而復白白而黃黃而更白黃則停飼白則慢食青則緊餵是白為青黃關鍵此其能事終始之一驗也至其所以致殭之故或因熱而驟令風涼或因不除沙而沙中生熱或因小時陰氣蒸損究竟直而不撓白而不涅此其縱自捐驅不遭汙染之一驗也然其驕稚難養動輒罹患非特畏寒暖之侵迫更劇畏聲色之非常與小兒之易熱易驚何異受熱受驚而搔擾則以受熱受驚至死而不騷擾者應之可知其無與於口噤反張手足強直之驚癇矣能滅黑䵟即不違汙染也令人好顏色即屢變而終歸於白也惟男子陰瘍女子崩中赤白産後餘痛則應更體會夫已上諸病皆陰在上不隨陽化故致陽跌蕩而陰凝滯用之是使陰隨陽化也若陰在下而陽不與化則陰焉能不或如泥淖之難釋或如漏巵之無當巵酒器玉篇但究是物之所食葉間豈得無津雖則食而不飲者固應便而不溺此則縱使食中含飲然其津液終留於中供他日密縷聯綿之化而無所謂溏便焉是亦可知其漏之所以止淖之所以釋矣又豈陽盛而驅陰陰窮而自敗者可竝耶夫三眠之蠶化已不一然其成繭之後復有變蛾退連等化則其性氣又異惟其自此而化止者則莫如殭而不腐白而不汙者為恰如其當此所以有取於白殭蠶也歟木瓜狀如奈春末開花深紅色入夏綴實如小瓜而有鼻鼻乃花脫處非蒂也皮薄色黃香而甘酸津潤不木者佳參綱目木瓜發葉開花於春成實於夏其氣且溫似全秉木火之化者無如其味酸甘其質津潤其皮始而終黃其肉先白而後赤是其用又全在血液故兼核其體用為假木火之盛焰行血液之柔滋夫柔滋生於木火則非陰膩可比威焰宣於血液又非固益能儔用陽攝陰使陰不得澌盡以陰和陽令陽迫逐流亡木瓜功力大概具於是矣雖然溼痹無非邪氣邪氣已為溼痹而疊稱溼痹邪氣何也夫陽以陰痹而窮陰以陽窮而痹合之則似陰陽相膠分之又似陰陽相軋惟攝其陰以從陽宣其陽以布陰斯邪氣化而溼痹開溼痹開而邪氣退方足徵木瓜之功見木瓜之用而疊稱之不為無故矣然則霍亂吐下間以大字轉筋之下綴以不止其故何歟夫霍亂即是吐下吐下便名霍亂但小小吐下未必遂致轉筋霍亂大吐下則中氣潰敗血液暴亡筋失所養而絞旋收引焉若僅見於手足者猶係血液不能遠及四末如在四末不急施治則由外及中病遂危殆故轉筋入腹則死也然曰轉筋不止則又可見吐下止而轉筋不止何者上文之稱大正所以截吐下使成句惟霍亂大吐下句與下文不屬則不止者僅轉筋非吐下亦不止矣霍亂既止血液當復轉筋自應漸止乃猶不止始用木瓜則以霍亂者其源轉筋則其流耳古人治病貴求其本故仲景於霍亂理中五苓四逆加參加豬膽汁竝料及過經傳外且有桂枝小和諸法亦不為不備矣而無用木瓜者以本未嘗言轉筋也譬如應用理中五苓時原不必有轉筋即有轉筋亦當急救其本無暇泛及其標倘至四逆桂枝時又焉能必不有轉筋有轉筋則四逆桂枝中何妨加入木瓜耶如入木瓜所以收合血液之餘宣布筋骸之養也說者謂惟酸能集津液而梅與木瓜為尤甚故談梅可以已渴呼木瓜名書木瓜字可以止轉筋二者畢竟如何分別不得互為用蓋酸者陽在陰中蠕蠕以動之義也但氣平者靜而降氣溫者柔而行生氣通天論曰陽氣者靜則養神柔則養筋惟其養神故主安心下氣除熱煩滿惟其養筋故主霍亂大吐下轉筋不止神者行於血衇血衇不咸則為死肌筋者絡於骨節骨節不利則為溼痹是其不得互相為用處且梅究得春氣多夏氣少木瓜則得春氣少夏氣多春氣者撮陰以榮陽夏氣者用陽以宣陰撮陰以榮陽故主自內而外出用陽以宣陰故主由中而旁推此其分別矣柿高樹大葉圓而光澤四月開小花黃白色結實青緑至八九月乃熟生柿置器中紅熟者為烘柿即火柿也樹上自熟者為軟柿其核形扁狀如木鱉子仁而堅硬其根甚固謂之柿盤綱目柿生色青而味澀熟色紅而味甘色青味澀象金木之相戛擊色紅味甘象火土之相煎爍木能與金戛擊則病必在金火乃與土煎爍則病必在土曰通耳鼻氣主腸澼不足非肺與大腸病而何曰解酒熱毒止口乾壓胃間熱非脾與胃病而何緣金本制木木無所畏乃金為熱壅而令不行火原生土土不受生係溼鬱成熱遂反畏火也所以然者青則宜發而澀反收紅則宜急而甘反緩是謂色與味相軋相軋則其物應消敗乃生生之理偏寓於相軋之中斯病之因通而反塞因塞而反通應行而不行不應行而行者皆能使即相軋而化為相生矣何則有肺熱形證自應喘促乃偏不喘促而塞於耳鼻大府不通自應腹滿乃偏不腹滿而為腸澼此之謂因通反塞因塞反通酒氣流行最速乃偏聚熱成毒而為口乾後穀而入先穀而溺出則其氣應下行乃偏自胃而上湧此之謂應行而不行不應行而行清肺熱而耳鼻通壓胃熱而口乾止其治在彼其效在此曰化相軋為相生何不可也火柿者不由本分以人力強青為赤強澀為甘斯其功用自應較狹然所謂療金瘡火瘡生肉止痛者仍是治肺與胃以金瘡火瘡必係皮毛肌肉間病也至其蒂孟氏食療謂能主咳逆噦氣其味澀而性平仲景云傷寒大吐大下之極虛復汗出者其人外氣佛鬱復與之水以發其汗因得噦所以然者胃中寒冷故也夫已大吐大下大汗出矣表氣何因尚是怫鬱必其吐下皆不合法病在表而反治其內也當其吐下時表病原未嘗不內入此為極虛矣乃病終連於表及吐下之威已殺則仍勃然而發於外表氣更自怫鬱無如醫者但見其外之熱不究其中之虛復與之水冀其汗出孰知反增其寒於是外之熱欲內濟其寒而不能內之寒欲外逐其熱而不得寒熱相擊遂厄厄作聲而噦作焉柿之蒂當初夏即生既於盛暑時能吸酷熱之氣入柿以化為寒又於三秋能吸清肅之氣入柿以變赤是其交通陰陽轉旋寒熱之功為何如抑可知其不治但寒之噦亦不治但熱之噦即咳逆亦可於是而得悟其治矣枇杷木高丈餘肥枝長葉大如驢耳背有黃毛陰密婆娑可愛四時不雕盛冬開白花至三四月成實作球生大者如雞子小者如龍眼熟時色如黃杏微有毛皮肉甚薄核如茅栗黃褐色四月釆葉暴乾用圖經參綱目劉潛江曰冬氣閉藏夏氣蕃秀草木花實多應其時惟枇杷於盛冬作花仲夏綴實是陽藏於陰之候而反陽出於陰陽出於陰之候而反陽凝於陰為陰盛時能使陽舒陰微時能使陽畜是其下氣乃和陽以就陰其止啘乃暢陰以從陽豫謂間啘於中上云卒而下云不止是來驟而去不速也枇杷開花何妨稍遲結實不嫌稍疾乃竟於嚴厲閉密中吐英揚秀一似有所促迫而不得遲者有卒之義焉既花已後直俟六陽盡浮一陰初姤時實方成熟一似有所推挽而不得疾者有不止之義焉卒啘不止者陰不和陽陽不入陰也取其花能陰和於陽實能陽入於陰以治有氣不下啘不止者哉雖然其取義在花實而所用在葉何也夫花仍有主頭風鼻流清涕之功實原有止渴下氣利肺氣止吐逆之效但花不耐采實不任藏以其易浥爛也獨葉堅厚青翠四時不雕隨用隨采無須儲蓄蓄亦甚易且惟不雕是以得氣充為花實所係而效其靈若花實則效靈於氣者也又何可竝特不能如花之入極上實之能潤燥耳穭豆除顆粒緊小外其皮黑肉黃正與黑大豆同故其致陰氣於土貫土氣於陰本原不異惟大豆之箕鞕而為梗穭豆之苗柔而成蔓大豆田中有草則不蕃穭豆則偏不特生惟喜攀附他草故一則沉著一則輕揚沉著者行水道輕揚者行血衇理固然矣夫陰氣之被於土土氣之鼓夫陰其頓然蓬勃生發以輸肺行三焦致通降者雖藉資於火而實忌火之盛以火盛則耗陰而適以礙其流也其泌別精純於輸肺之餘灌溉於心以盤旋屈曲經隧間者固最喜涼和然宜陽有以煦之設使無陽則如寒令之水消而停被風而凝故大豆性平治水道因熱而受傷所謂胃中熱痹傷中淋露癰腫水氣皆是也穭豆性溫則主血絡不動而招侮所謂賊風風痹産後冷血皆是也雖然衍義有豆淋酒方治産後百病則用大豆熬熱酒沃與此略同如何謂大豆不治血衇間病及因風致病耶夫彼方所治原謂餘血水氣背強口噤煩熱瘛瘲口渴身頭皆腫身癢嘔逆直視手足頑痹頭旋眼眩竝係虛熱中風而此則為冷血且彼牽連一身此則僅在一處所以謂之賊風風痹況皆恃酒酒固善行藥勢者也因是思一豆之用不特小大之異專溥之殊要當參其性之溫與平莖之柔與剛始能得其確勿以俱聯酒為用漫無區別也秫即粟之糯者粟粱屬顆粒較小於粱粱穗大而毛長粒粗粟穗小而毛短粒細苗俱似茅種植之時燥溼之宜把勞之法一同於穀收刈欲晚以其性不零落早刈則損實也綱自參齊民要術靈樞邪客篇伯高之論半夏湯也曰補其不足瀉其有餘調其虛實而去其邪陰陽已通其臥立至湯僅秫米半夏兩味耳何者為補何者為瀉補瀉難稔陰陽何由可通耶夫邪之客人也必乘其虛氣之不能入也必畏其實譬之兩軍相對欲戰未能欲和不果高壘深溝孰肯相下勝負未分師老糧匱於斯時也忽得一介通問相諭以勢相導以理謂一逞之難恃行成之可貴知己知彼而許成焉乃剷壘湮溝通盟誓而釋嫌隙補瀉之意亦如是矣半夏生於陽長之會成於陰生之交能使人身正氣自陽入陰能不使人身邪氣自陽入陰則秫米生於陰姤之前成於陽復之會者能使臟腑陰氣通於陽而接夫陽能不使臟腑邪氣據於陰而遏夫陽流水力逆則揚以緩之葦薪火熱則徐以持之爰以八升之水取其清五升煮取止一升半既令其八之三隨濁而棄復令其十之七隨火而化僅取其十六之三以為劑則皆清濁別白陰陽相入之餘又與心輸氣平之剷壘湮溝何異不可謂決瀆壅塞經絡大通陰陽和得者耶雖然合半夏而論因未嘗不有理但論秫米則僅以其生成之時竟謂其通陽而不遏陽凡物以生以成合是時者亦多何足遽信其能夫食以養陰說在禮經食氣入胃隨即淫精淫氣入衇入筋載在素問則其氣之入陰有非他物急足爭先能及其速者且凡糯皆溫而此則微寒協乎糯之黏而齊乎粳之涼同於粳之暢而異於糯之壅粳者入於陰而行於陽糯則行於陽而滯夫陰試思飯與酒之於人可知已而秫者作飯則同粳釀酒亦同糯是其從暢而不從壅和陽而更益陰亦又何疑即其植蒔不異粳糯而收穫偏遲且不零落尤可見其堅帖夫陰而待陽之至矣寒熱者陰陽相爭也大腸不利者陰陽相拒也觀千金治瘧三方治瘧間發夜發乃梔子湯恆山湯及食鴨肉成病方則其所謂止寒熱利大腸者可知矣盧子繇曰稻黍稷麥菽曰五穀皆可區萌達糵也糵者生不以時人力可為是從止而動由終而始矣經云五穀為養各有所入則糵者亦當各從其類蓋五穀本具水火土金木五行升出中降入五氣故宣五穀味開發上焦與上焦開發宣五穀味事同而理異木火金水當建土為本土者行之長也升出降入當標中為樞中者氣之機也其所以為本為樞主宰陽出陰入者人身中黃之生氣也中黃之生氣出則穀味宣宣則開發上焦薰膚充身澤毛若霧露之溉中黃之生氣入則穀味成成則淫氣於五臟而五臟安散精於五形而五形駐斯腑精神明留於四臟氣歸權衡權衡以平氣口成寸矣然中黃生氣固為正氣之主亦須行氣均平始得承生氣之出以出生氣之入以入以互為關鍵設正氣稍有廢弛則亦為之少息是必察何臟之有歉何行之失和而以專司之穀糵養之充之即以成其所自始亦即以成其所自終也如麥實有莩甲為肝穀黍莠善舒散為心穀稷長五穀為脾穀稻粒如秋霜為肺穀菽實莩甲堅為腎穀五穀為五臟養則五糵為形氣充充之養之正承中黃生氣以出以入耳然則穀糵功力豈獨快脾健胃消食化積而已乎扁豆二月下種蔓生延纏葉大如杯團而有尖八月開花其花狀如小蛾或白或紫有翅尾形莢生花下嫩時可為菜茹霜後則收子入藥用白花而實潔白者圖經綱目豆體橢圓然首大尾小輕重有殊凡布種必重者向下及既茁萌則首轉向上觀其出土已後首連尾分兩瓣橫披下垂可知矣惟扁豆則須粒粒插之使首向上不然則浥爛土中不能生發以其體肥重不能轉身也肥重之物自應歸脾而色白法金則性主向下結子多則宜歸腎益脾氣而性向下及腎謂之和中下氣猶不恰當耶然則仲景云扁豆寒熱者不可食何也毋亦因其肥重能壅肌肉間氣致邪不得泄歟非也夫扁豆花白實白實間藏芽處更有一條其形如眉格外潔白蓋棚引蔓其上枝葉遇日愈烈愈矗立不撓自有一種嚴肅之概故俗謂久避暑豆棚下能作瘧有寒熱者不可食蓋為此耳然則枝葉陰森而結實溫又何故夫不有蘊隆何由嚴肅是故陰森之氣緊承暑後而豆者枝葉之種也惟其溫是以引蔓大惟其引蔓大能蔽日光故為陰森此其入於人身非特益脾氣且納使歸腎竝可見其能由腎而布陰氣於彌際矣霍亂者本應吐下云吐下不止見其外已現表而裏仍吐下應止猶不止也用其葉者蓋使陰邪之在內為吐下者盡蔓延敷布於外并裏證為表證且不畏酷烈之日也菉豆四月下種苗高尺許葉小而有毛至秋開小花莢如赤豆以緊小兩頭平色鮮緑者為佳綱目生則冷痢熟則和平食物恆性也乃菉豆稟氣固寒生研絞汁服反不若煮食之下行者何蓋菉豆皮寒肉平其寒本自向外生研絞汁其氣最全且停頓於中彼丹毒煩熱風疹藥石發動熱氣奔㹠固係向上向外之火得此汁狙伺於外達之地隨其熱而化之導之濟剽疾以柔和緩徑突之衝逆似取義在肉之平不知實賴皮之寒配外出之火也若煮熟則其性寒性平者既以相和而互相入矣不與熱隨水結而成腫氣為熱激而上出者正同乎藉其素不相入之寒與平已得相化而和洽者就其結與激處以解釋之而腫消氣下熱壓毒解由是觀之熟者下行非下行也去其相拒而自下耳生者外出非外出也順其飆發以緩之耳所由然者菉豆生枝作葉於溼熱磅礡之會開花結實於涼飆肅降之餘其平足以耐煩燠其寒足以靖浮焰又屬穀食其味且甘故凡病發下中而上達外出者可恃以開釋而化導之假使倚物之實火無根之虛陽原非所能治也齊民要術曰種韭者治畦欲極深為其根性上跳也又曰治畦畢以升盞合地為度布子於圍內注韭內生不向外長圍種令科成也夫惟上跳是以根養髮而莖葉除胃中熱利為病於人惟其內生是以莖葉歸心而安五臟子止夢泄精溺白又云一種永生注韭久也惟其一種永生是以可久食矣雖然歸心者未必能安五臟能歸心安五臟者未必能除胃中熱利病人以臟自臟腑自腑也能止夢泄精者未必能止溺白能止溺白者未必能止夢泄精以溺道自溺道精道自精道也陶隱居曰韭殊辛臭雖煮食之便出猶熏灼以豫所知韭非特穿胃過腸其氣尚烈也即其質亦不化故千金治誤吞叉方暴韭令萎蒸熟勿切食一束即出是其能纏裹叉以出耳胃中積物化熱成利病人能更堅韌於叉乎況其質在腑其氣歸心所謂食氣入胃濁氣歸心淫精於衇衇氣流經經氣歸於肺肺朝百衇輸於皮毛毛衇合精行氣於腑腑精神明留於四臟者是不特歸心安五臟本此而無臟腑之分即後世藉以治胃脘瘀血者亦本於此矣巢氏曰小便利多者由膀胱氣寒胞滑故也腎為臟膀胱腎之腑其為表裏而俱主水腑氣不能溫臟故小便白而多金匱要略曰夫失精家少腹弦急陰頭寒目眩髮落衇極虛芤遲是知陰陽本宜相稱若陽不足陰遂無所衛而不固亦無精溺之分矣生氣通天論曰陰者藏精而起亟也陽者衛外而為固也夫起亟起陽也為固固陰也是陰陽有交相濟之道焉是故陽之固在乎聚而不在乎盛陽之聚在乎不散而不在乎堅牢觀夫韭之布子四圍而科生於中足以見其陽之聚其翦之則不期而復故不翦亦不能格外加長足以見其不助陽之盛根久盤結則不茂足以見其不使陽堅牢任自熬煮可萎縮而不可糜爛足以見其藏精不泄則起亟為固功用尚不可知其故乎假蘇即荊芥也二月布子生苗辛香可茹方莖細葉似獨帚葉而狹小淡黃緑色八月開小花作穗成房房如紫蘇房內有細子如葶藶子狀黃赤色連穗收采用之綱目諸病源候論曰瘰瘻病之生或因寒暑不調故氣血壅結或由飲食乖節故毒流經衇皆能使血衇結聚寒熱相交久則成膿而潰漏又曰瘰癧瘻者由風邪毒氣客於肌肉隨虛處停結如梅李棗核等大小兩兩相連在皮間時發寒熱此言其因也靈樞寒熱篇曰瘰癧鼠瘻在於頸腋者皆寒熱之毒氣留於衇而不去此言其處也又曰鼠瘻之本皆在於臟其末出於頸腋之間浮於衇中末著於肌肉而外為膿血此言其本也夫在前曰喉嚨在後曰項背今曰頸腋則在側矣喉嚨屬陽明項背屬太陽頸腋則屬少陽少陽者陰未盡化陽氣尚稚已出乎陽未離乎陰也未離乎陰故風入則搏血已出乎陽故血結則留溼陽氣尚稚故氣易結聚陰未盡化故血易壅瘀荊芥為物妙在味辛而轉涼氣溫而不甚芳香疏達可使從陽化陰而氣中結聚得破從血驅風而血中壅瘀得行溼痹得去氣不結聚血不壅瘀溼不停著則寒熱除而鼠瘻瘰癧之在頸腋者雖至已潰成瘡既無來源則亦烏能不已善夫劉潛江之言曰荊芥以春令布子生苗歷夏及秋方開花結子故全乎辛之味者以成其溫升之氣也然嘗之先辛後苦俱帶涼味是又升中復兼降矣本乎氣之溫成乎味之辛者合春和之升舉是為能達陰氣俾陽得乘陰以出也而血藏之風遂不病出乎餘味之苦更成於轉味之涼者合秋爽之肅降是為能和陽氣俾陰得先陽以暢也而風藏之血亦不病蓋以氣味全似挹天氣以接引地氣能升而達在地之鬱陰即能降而化在天之亢陽故雖不專主於溫升然佐升散得宜不特外因風寒而陽鬱即內之七情致血分有滯以涸陽者皆得仗此紓陰以達之雖亦不專主於涼降然佐清降得宜不特內因肝熱而陽僭即外之六淫致血分有熱以迫陽者皆得仗此裕陰以和之蓋風藏不離乎血原相因以為病惟此則能相因以為功所以不可與他風劑例視而欲達陽必思所以紓陰欲和陽必思所以裕陰則庶幾善用此而獲成效矣香薷四月生方莖尖葉似白蘇而細有刻缺亦似黃荊葉而小九月開紫花成穗有細子十月采參圖經綱目霍亂係水之潰決水腫係水之停漲通塞迥殊狀候絶異乃一物竝可治之則兩病本有聯合之理千金方以兩病竝隸於三焦良以三焦者決瀆之官水道出焉水道不通汪洋無制若齧土而頽則為霍亂若充廓而停則為水腫原理之常無甚異也特香薷一物能兼治二者則應究其所以用經衇別論曰飲入於胃游溢精氣上輸於脾脾氣散精上歸於肺通調水道下輸膀胱水精四布五經竝行合於四時五臟陰陽揆度以為常也則似水道之行全由脾肺膀胱絶無與於三焦者不知其游溢散精通調下輸皆三焦為之也何以故營衛生會篇曰上焦出於胃上口竝咽貫膈而布胸中走腋循太陰還至陽明是非其輸脾之道乎又曰中焦亦竝胃口出上焦之後此所受氣泌糟粕蒸津液化其精微上注於肺衇乃化為血是非其歸肺之道乎又曰下焦者別回腸注於膀胱而滲入焉是非其下輸膀胱之道乎合於四時五臟陰陽揆度以為常者即五癃津液別篇所謂天暑衣厚為汗天寒衣薄為溺與氣是也則三焦者詎非導水之江河耶夫三焦屬少陽少陽為相火故其決齧為病停蓄成災厥由有二一者陰霪一者暖漲陰霪者火衰不能激水暖漲者火盛反致水溢香薷則治暖漲者也夫暖漲不似夏月之溝澮皆盈乎而復土潤溽暑大雨時行苟無日以烜之風以蕩之其為決齧匪難為停蓄則固然也獨香薷者偏以四月感相火而生歷屆溼土燥金以暢茂條達至寒水得令乃告成功一似乎輸脾歸肺導入膀胱之旨直截了當不假炫飾而其味辛氣微溫即具天暑衣厚為汗天寒衣薄為溺與氣於其中三焦運化既通停蓄且不能則又何從決齧耶世人於香薷類以為發汗或以為利水究竟問其於何發汗於何利水則亦終是渺茫孰知別録於霍亂證下下腹痛兩字即是利水之端於水腫證上冠一散字即是發汗之旨試思仲景辨論霍亂最詳何以獨無腹痛外臺祕要列水腫之用香薷者曰水病洪腫氣脹曰風水暴水氣水曰卒腫滿身面皆洪大則可知其浮於外而不行者則能為之汗阻於下而不行者則能為之利是其治水為行火土中化乃目為夏月麻黃夫麻黃雖能治水然實行金水中化者無從混稱亂指也薄荷宿根經冬不死二月生苗清明前後分之方莖赤色其葉對出初蒔形長兩頭圓蒔移植栽種及長則尖凡收薄荷須隔夜以糞水澆之雨後乃悉刈收則味涼不爾不涼也綱目參物類相感志吐下則脹滿應減下氣則宿食應行即不減不行亦宜以寬中理氣消導順降為治何取於薄荷不知薄荷之涼大有似乎豆蔻輩原能寬中理氣消導順降者也特其芳烈外發不似豆蔻輩內藏所以重在散發而治內不專耳設使惡氣宿食既已內擾仍復托根於表則非薄荷之內解其結外劚其根何以使表裏盡除略無遺患耶傷寒發汗自有專劑又何取於薄荷不知寒之來係賊風所引則與凡傷寒異曰賊風者冬之南夏之北春之西秋之東風也曰賊風傷寒則定是夏令傷北風之寒其乘虛也甚其入人也深非麻黃桂枝葛根青龍調解營衛者所能治薄荷之辛溫芳烈足與假蘇香薷等原能開散風寒者也況其轉味之涼又能和中調氣假使賊風傷寒雖從外入內已成窟則非薄荷之外剿其從內覆其穴何以能一舉兩得耶所以然者此物産於南不産於北莖方赤色葉相對生中春而發秋盡乃萎原具夏氣之全足發沍寒之覆是以於滯氣之外有所連客感之內有所據者均能使拔茅連茹不勞再舉但驗其根不畏寒苗不畏暑則可以得其消息之所在矣下品草十三味木三味獸一味蟲二味菜一味虎掌初生根如豆大漸長大似半夏而扁纍年者其根圓及寸大者如雞卵周回生圓芽二三枚或五六枚三月四月生苗高尺餘獨莖上有葉如爪五六出分布尖而圓一窠生七八莖時出一莖作穗直上如鼠尾中生一葉如匙裹莖作房旁開一口上下尖中有花微青褐色結實如麻子大熟即白色自落布地一子生一窠九月苗殘取根用大者為虎掌又名天南星小者為由跋乃一種也圖經參綱目病有少腹盛上下左右皆有根名曰伏梁裹大膿血居腸胃之外治之每切按之致死此下則因陰必下膿血上則迫胃脘生鬲俠胃脘內癰也居臍上為逆居臍下為從勿動亟奪腹中論人有身體髀股䯒皆腫環臍而痛是曰伏梁此風根也其氣溢於大腸而著於肓肓之原在臍下故環臍而痛不可動之動之為水溺澀之病奇病論心之積名曰伏梁起臍上大如臂上至心下久不愈令人煩心以秋庚辛日得之腎病傳心心當傳肺肺以當旺不受邪心復欲還腎腎不肯受故留結為積五十六難據此則腸胃癰之類也病始於腎本係水液挾邪為心所不勝若肺能受之則咳逆吐痰病斯已矣此亦不必心為之傳肺之職故應爾爾乃肺不任此欲上不得欲下不能逗遛腸胃之外薰蒸水穀之氣衝於上則為心痛寒熱溜於下則為溺道結澀浸淫於下體則髀股䯒胥腫此時正皆天南星所主矣天南星何以能主此則以其色白入肺性燥劫液使癰中水液化以為氣而布散焉正猶肺之肯受邪俾從咳逆吐痰可愈也然此當在未與血結之先苟已與血結雖亦可藉以分消氣分之結則已不能不仗佐使之妥適矣不然千金抵當湯治婦人月經不利腹中滿時自減竝男子膀胱滿急方何以於傷寒抵當湯退虻蟲而進是耶婦人月經不調篇然則治風癲之鴆頭丸及令霍亂永不發方皆有是何也盧芷園曰天南星名色性氣合屬燥金味苦氣溫又得火化為肺之用藥與易稱熯萬物者合其德固當治風第可平諸疾生風不可平風生諸疾以其體堅實細膩非真燥故其治諸暴強直支痛裏急筋縮軟戾皆風從燥已也劉潛江曰南星四月生苗九月采根是火之氣歸於金取火為金用者也火為金用而金之氣益烈即以同氣相求者直相從而破其所結之戾氣故其所治非陰虛而陽不能化之風乃陽虛而陰不得化之風是其旨皆在散陰結於暢陽霍亂之發癲之為風陰結而陽不得暢陽虛而陰不得化也是可知因痰而生風者去其痰而風自不得生特陰虛之燥痰畏此正如砒鴆耳草蒿即今青蒿二月生苗莖粗如指而肥軟與葉竝深青色葉似茵蔯而面背皆青至夏高四五尺七八月間開花細黃花下便結子大如麻子中有細子九月采其根白鞕根莖子葉皆有香氣俱堪入藥綱目參圖經疥瘙本溼熱為病至結痂而癢則溼已化燥矣惡瘡亦溼熱病也而至生蟲則已溼迸流漓燥遂在內矣瘡既劫溼之具疥復生蟲之橐則主疥瘙痂癢惡瘡者不遂為治燥熱之劑乎然苦寒之物治溼熱者有之如芩連是也茲獨苦寒而治燥熱則以其芳者說者謂芳香實能助燥烏能治燥是不明陽明燥金所以繼太陰溼土之故耳溼浮於外內本已燥加以清飆蕩滌餘暑倏消則外浮者亦散遂純乎為燥是誠在轉瞬間不然別氣相續必漸致此何獨緊相承踵相接耶即以芳香論在春夏時芳香之物應時生長者不一然其氣皆發揚而茲獨斂肅是其為由夏屆秋由溼轉燥而留有遺熱在內者之的劑矣即驗其立秋已後定節節生蟲既已生蟲仍不妨開花結子其蟲又不嚙梗致敗不蠹節潰出但自循梗而下入土化他物故凡取蟲者過時即無亦可見此是夏間陽氣遺留在內所化合之於治留熱在骨節間豈不符哉青箱二月生苗長三四尺葉闊似柳而軟莖似蒿青紅色六月七月開花如雞冠花上紅下白但雞冠花穗或有大而扁或團者此則梢間出花穗尖長四五寸狀如兔尾子在穗光黑而扁與雞冠子莧子不殊根亦似蒿根而白獨莖直下生根八月采子參圖經綱目青葙形象生長與青蒿頗同特其收成較蚤蓋當溼熱盡浮內方轉燥之際故其為用似同於青蒿實戾於青蒿夫邪之在人原欲同氣相引豈肯鬱鬱獨居第阻隔既成追攀莫及則有遺留之患若邪正在表外熱方昌則在內者孰不欲就我同岑共商留去斯所以俱患身癢但視其一則疥已成痂惟餘不盡一則風方㿋擾肌膚豎裂㿋瘙同皮起也已可測其或為留熱在骨節間或為邪氣在皮膚中留熱在骨節間因斂肅而及故就其斂肅而消之邪氣在皮膚中因散發而用故就其散發而驅者是青蒿助行秋令青箱猶逞夏時一采於秋末一釆於夏初而就其長以足其勢固已示人區別之方利導之旨矣要而言之邪氣皮膚中熱係發汗證以風瘙身癢惡瘡疥蝨則不可發汗所謂瘡家雖身疼痛不可發汗汗出則痓是也蟲䘌係可攻證以邪氣皮膚中熱則不可攻所謂病人表未解者不可攻攻之利遂不止而死是也活人書云䘌病之候齒無色舌上白甚者脣黑有瘡其初得或如傷寒或因傷寒所致則此之脣口青當即轉黑之機而邪氣皮膚中熱正合傷寒之候千金有青葙子丸治傷寒後結熱活人有雄黃鋭散治䘌統而觀者則凡瘡癢而外候如傷寒者為不可易之劑矣貫衆春生赤苗葉大如蕨青黃色面深背淺兩兩對生如狗脊而無鋸齒莖三稜大如筯其涎滑有黑毛叢生四月花白七月實黑根連卷而生皮黑肉赤曲屈而有尖觜觜通嘴黑鬚攢簇大如伏鴟其苗隨處透出無論縱橫一根百十頭經冬不死參吳氏本草圖經綱目貫衆之根裹纈層疊莖鬚錯出四射恰有合於腹中其初出莖鬚頑梗粗澀恰有合於邪氣其外黑內赤味苦氣寒恰有合於為寒所束之熱氣然其四射之莖無不可生青放葉即皆生理之所敷則其義為重疊包裹之邪氣熱氣自隨所過經絡四散而導發於外諸毒者邪熱久祕不得宣泄之所成也邪熱既散毒於何有蟲者緣溼熱而出遇隙而居善伏於生氣不屆之地貫衆隨處孔隙隨處生機岔湧一任沉於水委於冰雪皆不閡其生全苟使臟腑空隙鍾氣盡能如是蟲何由居況頑梗粗澀之莖鬚雖發於外而根於裹纈層疊之極內千金外臺以之治蟲專治腎家之蟲為非無所本矣且其功能豈僅在是形連卷而不密則可以疏癥瘕中氣血葉對生而不隻隻獨也則可以去頭風之偏內之赤不能越外之黑則可以止金瘡之血外之黑終能限內之赤則可已崩漏衄血皆以其既喜生於山又必近於水置燥處而不枯浸水中而不爛為具剛體而行柔化畜滑潤而出頑梗而治喉痹治物哽解藥毒消頑腫均於此取裁矣何首烏春生苗葉相對如山芋而不光澤其莖蔓延竹木牆壁間秋開黃白花似葛勒花結子有稜似蕎麥而細小才如粟大根大者如拳各有五稜瓣似小甜瓜此有二種赤者雄白者雌其藤夜則相交晝則解故有交藤夜合之名圖經劉潛江云何首烏之用或取效於氣血之結而經衇壅者如主瘰癧消癰腫療頭面風瘡五痔止心痛是也或取效於血氣之劣而形器損者如益氣血黑髭鬢悅顏色長筋骨益精髓是也何其病之迥異而同歸於治歟何首烏傳讚曰雌雄相交夜合晝疏盧子繇曰觀其夜合晝疏則通於晝陽之闢則闢夜陰之闔則闔矣夫氣血皆一陰一陽之所化也陽為開之陰為闔之則氣血之結者以開為功而即具有闔之用氣血之劣者以闔為功而即具有開之用惟開闔盡其神而氣血之生化乃得不竭豈非不易之元理乎蓋他藥得陰陽之分而此獨得陰陽之合他藥得其分者不必出於合此味之得其合者以其能出於分也或曰此味與地黃同其畏忌將無與之竝能益陰歟曰陰陽之開闔此味全具謂其補陰與地黃同功亦何不可但不與地黃同其沉滯者其義所當參也蓋陰陽之開闔其於腎若地黃則能為陰之闔不能為陽之開也又肝膽根於至陰達於至陽亦本開闔以行氣血之生化茲味合於元始握其樞機在風實者陰不能致於陽而使闔也風虛者陽不能達乎陰而使開也既合於至陰為闔至陽為開則風之療也安能不首推茲味乎威靈仙莖梗如叉股四稜葉似柳葉作層每層六七葉如車輪有六層至七層者七月內生花淺紫或碧白色作穗如莆薹子亦有似菊花頭者實青根稠密多鬚似穀每年旁引年深轉茂一根叢鬚數百條長者二尺許初時黃黑色乾則深黑故俗稱鐵腳威靈仙圖經參綱目味苦氣溫火也而生於早春釆於深冬將毋假火之性氣能伸木之屈曲泮水之冰凝歟不惟是也其釆後於衆草效則捷於衆草非效捷也百卉未萌是先挺發似風之播揚鼓蕩驅馳獨疾故曰主諸風也遇木而莖爭先歸水而根稠密乃屆火令反不花不實濡滯留連非濡滯留連也不浪作葉必六七葉排比齊生周圍四出狀如車輪是為一層層出不已至於六七似臟腑間結壅非止一處故曰宣通五臟也是豈徒伸木泮冰而已哉夫曰諸風則其發必驟曰宣通五臟則其因必久況五臟之待宣者非他即所謂腹內冷滯心膈痰水久積癥瘕痃癖氣塊膀胱宿膿惡水腰膝冷痛者是是五臟者不得率爾宣通諸風者又難遲遲責效惟威靈仙既具賁育之勇復有慶忌之捷而不為揚干之亂行甚嫻不識之部伍皆緣其根荄色本為黑形復似鬚稠密而長年深轉茂無非水象倚於水而行氣以行氣為化水層層決排縷縷疏瀹使陰不化而陽淫為風者息則陽不和而陰淤為淀者通是主諸風即所以宣五臟宣五臟即所以主諸風而不即不離不疾不徐頓然脫釋惟其能息是以能通若諸風緣五臟乾澀不通而成者得此立貽殃禍萹蓄春中布地生道旁苗似瞿麥葉細緑如竹赤莖如叉股節間開花甚微細青黃色根如蒿根圖經劉潛江曰浸淫疥瘙疽痔及蟲皆溼熱病也萹蓄類能治者得弗為通利之劑乎然盧子繇謂其引蔓促節節節開花若封而闢闢而封復不得目以通利似有逐節以為通能通而必循其節者不失之駛疾不致有遺慝更為搜微抉隱之善劑哉抑當為血分之氣藥即其多主殺蟲而言蟲從風化卻本於溼不化而從風如斯所長不使血分聚溼而風自平此所以能治自溼化之風熱而殺蟲也豫謂蓄聚也天子升車之石貌之曰扁詩白華有扁斯石傳則自卑斯高之階也然積少致多之文類從扁篇編是也充狹致廣之文亦從扁偏遍是也此其中有浸淫之義焉從浸淫而疥瘙疽痔與蟲生焉則以聚為患自卑而高自少而多自狹而廣匪節莫駐歷階不愆者此能治之故號曰萹蓄馬兜鈴春生苗如藤蔓葉如山芋葉六月開黃紫花頗類枸杞花七月結實棗許大如鈴作四五瓣其根名雲南根似木香小指大赤黃色七月八月釆實暴乾圖經肺熱咳嗽痰結喘促厥由甚多堪以馬兜鈴治者將必有據如劉潛江所述因於寒溼久而痰滯氣道迫隘亦痰結喘促者固無人不知非所可用矣即其所引楊氏云虛勞少血津液內耗心火自焚遂使燥熱乘肺咯唾膿血上氣痰潮嗽連續不已者亦豈有必用是之理乎豫以謂其於春夏布蔓發葉由於木火以達者必繞樹而升其於秋冬繫鈴成實由於金水以成者必象金而降則其所治之熱為緣木而升之熱其所治之痰為附金而壅之痰木者金所侮也由木之熱至能傷金則所謂侮反受邪侮而受邪寡於畏也木以無道侵凌所畏亦必已外強中乾其氣升其血亦必動於是肺受其熱遂失職於治節而壅結於痰涎痰以火而膠黏血緣痰而乖錯謂此為肺熱咳嗽痰結喘促然乎否乎若血不乖錯何以下為血痔痰不壅結何以上為瘻瘡觀其匪能自立偏出高巔如鐸如鈴率皆下向下向者即他日上出之發蹤上出者即後時下向之根柢而苗春花夏結實非晚偏至霜降已後葉已盡脫鈴已四裂纍纍駢懸猶傲睨寒風浸淫霜雪而不墜此其苦寒為何如苦寒亦可見其雖下向而用不在降泄不在降泄則痰結何由解喘促何由平殊不知痰之所以結者因乎火火緣木而升者因乎鬱鬱極斯升之火譬之荏弱者聲素難高行素難遠一旦受侮彌深情極激發有不自知其聲之高行之遠者鬱固由此而伸結亦由此而解矣故似此象形之物先理其鬱發之源次解其浮越之火而因火壅結之痰自隨氣而化津液因痰逼迫之喘促自隨火而下歸烏在其藉降泄而痰結得解喘促得平肺熱罷咳嗽遂不作耶骨碎補生木上或石上多在背陰處引根成條扁長略似薑形上有黃赤毛及短葉附之又抽大葉成枝有丫缺頗似貫衆面青緑色上有黃點背青白色上有赤紫點春生葉至冬乾黃無花實圖經折之不死插之輒生翦枝移續劚根重栽皆草木恆性詎足為異未可以療傷折也然則倒插亦生橫埋亦生雖切之成塊暴之至枯摘其一葉分其一瓣無不可生者遂可以療傷折乎此不過水與土正相媾草木偶得之遂乘此生發耳又烏足以療傷折且傷之為傷豈無差別在皮肉曰傷破在筋衇曰傷斷惟在骨乃曰傷折傷既在骨而遠望水土之滋凝草木之聯屬其傷處敗壞久矣惟骨碎補者寸寸折之寸寸皆生處處折之處處有汁無藉根株之係不致血液之漏故曰主破血止血補傷折言能不使瘀結者留滯不使流動者妄行而補苴傷折如未嘗傷折也所以然者苦本堅裏而內含水自應腎之體溫本生發而能運水自應腎之用此後人所以察其幾微而謂為補腎以除耳鳴齒病皆可以是義推之矣白附子生沙中獨莖似鼠尾草穗細葉周匝生於穗間匝環繞根形似天雄長寸許乾者皺文有節如竹參唐本蜀本綱目白附子所主其旨在節節之為物以體象論則為陰陽之限以變動論則為用陽布陰而其威之所竟力之所加又為在下者厚愈上乃愈微也在下者厚則主心痛血痹之謂愈上愈微則為面上百病行藥勢存焉蓋血痹由尊榮人骨弱肌膚盛重因疲勞汗出臥不時動搖加被微風而為身體不仁如風痹狀則其始病於血衇以漸內應於主血衇之心乃為痛矣當未痛時原不妨用黃芪桂枝五物湯可愈既至心痛則不得不藉白附子之陽氣布散血衇中陰邪仍有限制不相侵越遍檢千金方用白附子惟堅癥積聚篇小狼毒圓一方可服餘則盡係外敷外敷之中除一齲齒蟲痛方外餘則盡為面藥夫䵟皰黶𪒟皆溼熱滯氣之所為氣既滯而不生光華澤復澀而反增晦黯則行氣宣澤之中斷不能不有用陽布陰之物駕馭其間以行藥勢其為治固甚精微而其功力亦云微矣以是二義而擴充之則在上用之以氣行津在下用之以氣行血與痰溼皆可無微不入矣夏枯草冬至後生苗至春高一二尺莖微方葉對節生似旋覆葉而長大有細齒背白三四月於莖端作穗長一二寸穗中開淡紫小花似丹參花結子亦作穗一穗四子交夏至便枯於未枯前釆之綱目參唐本劉潛江曰人身之陽在上則化陰在下則化於陰人身之陰在下則生陽在上則生於陽夏枯之種在地陰也而遇一陽則生苗焉由是以漸挺莖發葉結穗開花成實皆為陽效其用矣而遇一陰則枯瘁猶不可謂陰在下能生陽陽在上能化陰乎結癥腳腫溼痹皆陰陷於下不生陽也瘰癧癭氣鼠瘻頭瘡皆陽極於上不化陰也得此又烏能不愈乎況有陰以成陽則陽之用不窮用陽以化陰則陰之源遂裕陽用窮則無以生血陰源裕則有以化氣故古人稱其治目珠疼至夜輒甚及點苦寒藥劇者苦寒止能折陽此竝能化血也又稱其治失血後不寐仿半夏湯意代以夏枯草半夏僅能導陽入陰此又能使陽從陰化也後世擴充其旨如用以補肝明目治女子血崩産後血暈當識此義馬勃生溼地及腐木上於五六月卒然而發紫色虛軟狀如狗肺彈之粉出夏秋釆之有大如斗者衡之不過錢許參隱居蜀本劉潛江曰五六月時火土極盛百昌踴躍既傾盡底裏矣即已腐已化者偶有生氣遺留其間亦乘之以成形彈之粉出可知偶然假聚不久仍歸消化耳故藉以對待浮而在上偶寄而未即化之證使歸於無何有也斯為妙於取裁劉潛江曰海金沙無花實其氣專鍾於葉而成沙則不同於吐其華而凝其元惟得氣之流散者以致其自然之化機而已然如蒲黃而色黃赤則有可參者夫腎主水而脾主溼是腎水之用寄於脾也此其治必在於色黃者小腸行水而合於心心主血血乃水之化血和而水化自行此其治必在於色赤者方書但知其治血淋膏淋石淋等證詎知其種種所患皆本於溼土之氣不能運也而又有火以合之乃結聚於水道有如是乎要知此物是於土中布其流散之用而并達火之麗於土以病於水者則可以思其功之所在固不徒在行水之臟腑而已楝實木高丈餘其長甚速葉密如槐而長三四月開花紅紫色芬香滿庭實如彈丸生青熟黃十二月釆圖經參綱目凡物耐寒者必畏熱耐熱者必畏寒惟楝實屆夏已生迄冬在樹故世俗之訕不甚長進不易傾覆者曰楝樹子整年如此是則其遇暑而不浥爛逢寒而不拆裂擬定守正遂可謂堅持元氣之補劑歟殆非也夫楝實在夏則核嫩裹津充滿於殼在冬則津消核斂表裏相懸裹津待暑是布陰以使陽和即其主溫疾傷寒大熱煩狂也斂核禦寒是戢陰以讓陽通即其利小便水道也溼不混於熱熱已化於水水逞陽通而下行曾何蟲之不除疥瘍之不瘳耶即後世專以之治疝疝獨非陰縛其陽陽困於陰乎陰既戢而陽得伸陽垂和而陰已布亦無非賴小便之利水道之通與前義不相悖即其止上下部腹痛義亦豈能外哉郁李木高五六尺枝條花葉皆若李惟子小如櫻桃赤色味甘酸核隨子熟六月釆根竝實取核中仁用圖經郁李性潔最喜和風暖日溉宜清水而不欲肥廣魏芳譜其木色正白皆金化也而開花粉紅結實正赤是為金從火化人身金從火化者非由肺行三焦之水道耶大腹水腫面目四支浮腫由於水道不行小便不利則水壅於火而還病於金矣猶能不更濬其源使金復由火而化水遂自三焦而通哉曰利小便水道正以使其水不從汗泄不向下混行也然則其氣味之酸平又作何解夫酸者木之發育也平者氣之順降也核中之仁本以生發夫木而木之生發本以條鬯諸氣惟酸則有曲直之義曲直者不徒一於升舉又不肯一於卑俯應伸則伸應屈則屈正其生理之從容而不強梗且兼得氣之平是其盤旋潤澤於上條達通輸於下精者自不混濁以泄粗者自不附清而留澄其源乃欲順其流耳至根則潔白爽肅之氣安於土中自能使在中溼熱不混經氣上病於齗齒以立堅固之本者也鈎藤狀如葡萄藤中空而通長八九尺或一二丈大如拇者置酒甕中以氣吸之則酒涓涓出莖間有刺正如鈎鈎紫色葉細長參衍義綱目大奇論曰心衇滿大癎瘛筋攣肝衇小急癎瘛筋攣肝衇騖暴有所驚駭肝腎竝小弦欲驚二陽急為驚夫盛滿偏於一處則他處之不足可知弦急偏於一處則他處之縱弛又可知巢氏曰小兒血氣不和熱實在內心神不定所以發驚甚或搖頭弄舌或睡裏驚掣或數齧齒則為欲癎若口眼相引目晴上搖手足掣縱背脊強直頸項反折則為癎又曰驚癎者因驚怖大啼乃發也夫相引掣縱應弦急強直反折應盛滿謂非氣血至此忽被牽掣遂與他處不相流通若倒鈎逆注者然可乎舉痛論曰驚則心無所倚神無所歸慮無所定故氣為亂況發於寒熱後者非特正方以茲逆注邪且難免拘留此所以有取於鈎藤之紫色空中任是處處倒鈎逆注而衇絡決不因之以塞紫者水火相參之色凡陰陽氣血寒熱皆於此取義焉可也色紫而氣寒則協和氣血分解寒熱之用已具於中矣矧復中空則交通陰陽調劑上下之德抑又可泯乎不然則別録僅以之治一病後人遂不可因此為三隅之反矣獺狀似青狐而小毛色青黑似狗膚如伏翼長尾短足水居食魚能知其歲水之大小可驗穴而得之他獸肝葉皆有定數惟此則一月一葉其間又有退葉也綱目參圖經巢氏云注之言住也言其連滯停住也人有先無他病忽被鬼排擊當時或心腹刺痛或悶絶倒地如中惡然得差之後餘氣不歇停住積久有時發動連滯停住乃至於死死後注易旁人故謂之鬼注所以可用獺肝治者其注必在臟腑臟腑皆有定所定數獺肝獨應月增無定靈變之氣為鬼所駭遂不敢停也又云蠱是合聚蟲蛇之類以器皿盛之任其相噉存其生者即名為蠱能變化為毒害遺毒於飲食間以為人害食人腑臟其狀心切痛如被物齧面目青黃驗此之法須病人唾水中沉者是蠱浮者即非此其毒必藏匿津液中所以可用獺肝治者獺入水剿捕諸魚凡水居者見之咸遁而肝尤其靈異所萃故益為之懼也寇氏云常縻置獺大水甕中獺於水中旋轉如風而水為之成旋攏起四圍高舉中心凹下觀者駭目咳久不止者水飲上湊所為也得旋轉水而使中心凹下之物飲亦成旋下趨而咳止矣至卻魚鯁則因其所畏以制之水土合德為蚓以其食水土而生也然其始也便土而不溺水其竟也化水而不化土則是資氣於土資形於水無怪乎其似水之曲折似土之遲滯矣曳水以輳上則土濡潤假土以範水則水安流傷寒狂謬是土不濡潤也大腹黃疸是水不安流也然傷寒狂謬非熱不成大腹黃疸非水不作以水土相黏之病而投以水土相黏之物幾何不增之焰而益其猖耶夫不究其氣味為鹹寒乎鹹能使水不為土範寒能使土不為火困乃取其竟之化非取其始之合也然則奈何不據其始而要其終蓋他物雖死猶或得全而難毀惟蚓則無論炮製生用逮至成劑可服定已化水竝無得全之道又焉能遺其已化取其未化哉且所謂蛇瘕諸蟲皆假溼熱之氣而成截血液以為資者其有取乎此亦用以釋假合之氣而全血液之流行耳若取其未化則直以蟲養蟲已矣又成何理耶雖然衍義謂為腎風下注病不可闕圖經謂為腳風藥中必須是又增治風一節何哉夫陽盛而不與陰交陰停而不從陽化皆風也蚓性下行從土中致水以化其熱熱消則風熄陰暢則陽和矣非特此也蚓之出地必以夜而其便土也不於地下而於地上則是在下能化無形之熱致有形之水在上能去有形之滯退無形之熱故凡其治耳聾鼻瘜舌腫牙疼喉痹頭風可一貫推之矣鯪鯉似鼉而短小色黑似鯉而有四足能陸能水日中出岸開鱗甲如死令蟻入其中蟻滿閉甲而入水蟻遂浮出因接而食之圖經五邪五臟偏駮不調之氣駮混雜以非氣之正故謂之邪耳五邪何以能致驚啼悲傷驚啼悲傷何以可用鯪鯉甲治蓋氣固偏駮不調加以非習見習聞之事分不應受之愆驟相委致遂至驚而啼驚而啼則其氣共并於肺肺為邪并而滿外因泣出而虛是其傷不能不責之於悲而其實則究由於氣之并使來源不甚逼迫則去路自有程度肺屬金石金之未純者鯪鯉能穿而過之此其取裁之所在也至於瘻則巢氏所謂由飲食之毒入於腑臟隨腑臟而行於所主之衇稽留衇內不去使人成種種患害甚至壅潰成瘡外漏而中仍結阻亦豈非五邪留於內五液傷於外者耶若夫由癰腫不潰肌內憤盈者則取其潰陽之旨決而通焉特裹大膿血之候外既潰則內無結故潰後不得用也瓠以正二月下種生苗引蔓延緣其葉似冬瓜葉而稍團有柔毛嫩時可食五六月開白花結實子列瓤上整齊白而長謂之瓠犀霜降後采參綱目瓠結蔓間幾經兩時在夏則自小而大在秋則自溼而乾自小而大者凡物皆然自溼而乾則瓠有異於他物矣惟當其溼也固是津氣之溢以故肉厚瓤滿充塞無罅逮交秋令漸乾漸堅以至瓤懸於中肉殼於外當日之津遂淨盡無餘而其殼則堅若衷甲入水而輕舉不沾瓤則微如縷絮列其子而燦然不亂有濟於用人顧取其殼生氣所繫物實在於瓤然抽吮津氣以資其長運量津氣以成其堅則其蒂其蔓不無有力焉蒂原在瓠之上者也其在於人湯飲入而汪洋不流滋膩入而黏著不化以致津與氣相混充於皮肉廓於腑臟腑臟不能行氣於外皮肉無以輸津於內而為大水面目四肢浮腫則取其瓤子製劑服之以其曾經若此而能蕩練津氣從溼至乾從浮至斂內猶生氣燦然外竟皮肉堅固者其理既若合符節其效自應如桴鼓矣內外氣交自然清升濁降特恐一時不能順從向下或如瓠之仍由蒂蔓而消則能令人吐耳若他瓜蓏之屬有能堅而不能乾者南瓜之類有能乾而不能堅者栝蔞之類有能乾能堅而脆薄易敗者絲瓜之類其始非不充沛如瓠其成卻不相等惟此獨異則惟此獨擅其功但當知其所抽吮者係夏月之津氣乃陽中之陰水雖陰類而病於陽者宜之若水證而見衇沉肢冷舌白溏泄者服此非特不能行水且適足以戕陽觀於其味苦其氣寒概可識矣卷一卷二卷三卷四卷五卷六卷七卷八序曰班氏藝文志謂醫經者原人血衇經絡骨髓陰陽表裏以起百病之本死生之分而用度針石湯火所施調百藥齊和之所宜經方者本草石之寒溫量疾病之淺深假藥味之滋因氣感之宜辨五苦六辛致水火之齊以通閉解結反之於平蓋自是醫經經方遂分連絡之者本草經則其樞紐矣乃志不載其書然帝紀平帝元始五年徵天下通知逸經古記天文曆算鍾律小學史篇方術本草及以五經論語孝經爾雅教授者所在為駕一封軺傳遣詣京師至者數千人樓護傳護少隨父為醫長安誦醫經本草方術數十萬言世不忽其書故習而傳之者代不乏人其得至今存者惟梁貞白先生陶氏書為最古今案其文既歷載本經總序於前復患諸藥一種雖主數病而性理有偏著立方或致疑混赴急抄撮恐不皆得研究故將本經序大病之主已下一節循其所列剖而析之分為八十三項件繫主治藥於下方贅之序末是陶氏實注本經而得本經與醫經經方連絡交會處矣豫治仲景書既由不明藥物主病之所以然用力本經有本經疏證本經續疏之作矣繼治孫真人王太守書覺與仲景書猶未相承接遂立志究竟病名古今相沿之準病證彼此不侔之故而證以藥物主治之由得是編以為鵠反覆尋繹參互研訂然後知一證也隸之此病則屬虛隸之彼病更屬實一藥也投之彼病則逐實投之此病反補虛於仲景書以此推其緒於孫真人王太守書以此要其歸蓋自是而漢人唐人醫學醫經經方旨趣得連為一貫焉篇中附北齊徐氏唐蘇氏蜀韓氏宋唐氏所增其精詣幾與陶氏捋而徐氏所續九項實有稗補證明之功亦隨例詮釋而不削也道光二十年九月五日武進鄒澍序貞白先生名宏景梁時隱居茅山自號華陽隱居實始集別録附入本草經中徐氏名之才北齊尚書令封西陽王著藥對蘇氏名恭顯慶中與長孫無忌許敬宗等修定本草李績表上之今名唐本草韓氏名保升孟蜀重廣唐本草并稍增注釋名蜀本草掌氏名禹錫宋嘉祐時奉詔重修本草名嘉祐補注本草唐氏宋大觀時蜀人取諸家本草彙而集之竝采入經史中言醫事隨類附入名證類本草凡藥稟賦絶類則功用廣博然推其端緒要有歸著譬如麻黃其異在所産之地冬不積雪則其歸著在鼓發陽氣衝散陰邪故凡束縛難伸之風賊風攣痛蔽錮盛熱之寒傷寒乍揚更抑之熱溫瘧迫隘不順之氣上氣咳氣皆所能療誠得謂一種可主數病矣然不能治筋骨懈弛之風陽氣漏泄之寒鼓蕩不羈之熱隨火衝逆之氣稽其效曰出汗亦僅能令霾中見晛不能令旱處致霖曰下氣卻祇能於橫中闢道不能於直下鑿渠又可謂性理有偏著否耶太陽病項背強几几汗出惡風者桂枝加葛根湯反無汗惡風者葛根湯用麻黃不用麻黃其別在汗咳而衇浮者厚朴麻黃湯沉者澤漆湯用麻黃不用麻黃其別又在衇立方之日不洞曉是理易致疑混陶氏序肘後百一方云常居間佚乃可披檢方書或從祿外邑將命遐征或宿直禁闈晨宵隔絶或急速戎陳城柵嚴阻忽遇疾厄拱手相向搢紳君子且然何況貧家野居能不向單行經用赴急抄撮以求活此時而欲研究方書探討經義證其非是豈特不能且不暇矣為此編者筆墨省減病名既得原委藥味遂可別擇循證求病因病得藥從藥檢宜誠可謂探之囊笥庸豎均可成醫者嗟夫世風遞易遵守殊規徒知寒可攻熱熱得療寒補概益虛泄能除滿欲適燕而北其轅固不為非是殊不知自吳直往定抵海濱從滇徑徂輒歸西域遂致韌發坦途詣終茅塞惟古人所指示曲盡攸宜縱使羊腸鳥道循是遄征必可屆四通八達此昔日之僻徑即今日之廣衢而今日所謂廣衢乃金元已來所別闢也甘苦之義其旨淵微冷熱之宜其情直遂注此於下相得益彰意簡要而用專精矣療風通用防風溫主大風頭眩痛風行周身骨節疼痹煩滿防己平溫療風腫及中風手足攣急秦艽平微溫療風無問久新通身攣急獨活平微溫治中諸風溼冷奔喘逆氣皮肌苦癢藥性論芎藭溫主中風入腦頭痛寒痹羌活平微溫主賊風失音不語多癢血癩藥性論麻黃溫微溫治身上毒風𢂽痹皮肉不仁藥性論蜀本鹿藥溫主風血去諸冷益老起陽天麻平治諸風溼痹四肢拘攣海桐皮平主腰腳不遂頑痹腿膝疼痛海藥蛜祁平威靈仙溫主諸風宣通五藏去腹內冷滯心隔痰水藥對楓香平治𤺋疹癢毒臣薏苡仁微寒主風筋攣急屈伸不得君主風溼痹下氣萎蕤平治中風暴熱不能轉動者君巴㦸天微溫治風邪氣君治一切風日華側子大熱治溼風大風拘急使治冷風溼痹大風筋骨攣急藥性論鱉頭血治口僻臣山茱萸平治風氣臣主頭風風氣去來鼻塞目黃耳鳴面皰淡竹瀝及葉大寒主風癔疾臣癔心意病也集韻牛膝平主風攣急君細辛溫主風攣急君主風溼痹痛死肌菖蒲溫君并桂心大熱吹鼻中主風瘖君梁上塵微寒以小豆大吹鼻中治中風使葛根平治暴中風臣治金創中風痓欲死煮汁飲之口噤不開多服生葛根自愈肘後白鮮皮寒治風不得屈伸風熱臣主頭風治一切風痹筋骨弱乏通小腸水氣日華白薇大寒治暴風熱四肢急滿不知人臣證類天虋冬平大寒主諸暴風溼偏痹強骨髓附子溫大熱𦝫脊風寒杜若微溫主風入腦戶頭腫痛多涕淚出麥虋冬平微寒羚羊角溫應作寒微寒治一切熱毒風攻注藥性論主中風筋攣附骨疼痛生摩和水塗腫上孟詵犀角寒微寒散風毒藥性論治中風失音熱毒風日華藁本溫微寒除風頭痛能治一百六十種惡風鬼疰流入腰痛冷能化小便通血藥性論天雄溫大溫主大風寒溼痹歷節痛拘攣緩急黃芪微溫主大風癩疾蒺藜子微寒治諸風癧瘍破宿血藥性論葈耳實溫葉微寒主風頭寒痛風溼周痹四肢拘攣痛惡肉死肌菊花平主四肢游風利血衇日華狗脊平微溫治男子女人毒風軟腳邪氣溼痹藥性論莽草溫主風頭癢可用沐勿令入眼柏子仁平主風溼痹治風潤皮膚日華蔓荊子微寒微溫治賊風藥性論當歸溫大溫主惡血內塞中風痓汗不出烏喙微溫主風溼寒熱歷節掣引腰痛不能行步萆薢平主冷風𢂽痹腰腿不遂手足驚掣藥性論躑躅溫主賊風在皮膚中淫淫痛欒荊溫主大風頭面手足諸風辛夷溫主風頭腦痛小天蓼溫主一切風虛羸冷手足痹疼無論老幼輕重浸酒及煮汁服之乾蝎溫療諸風癮疹及中風半身不遂口眼喎斜語澀手足抽掣烏蛇溫主諸風瘙癮疹皮膚不仁頑痹天南星溫主中風除痰麻痹下氣破堅積烏頭溫大熱主中風惡風洗洗出汗除寒溼痹白花蛇溫主中風溼痹不仁筋衇拘急酸棗仁平主筋骨風研末作湯服之藥性論鼠黏子平除風傷牛黃平療中風失音口噤日華枳殼微寒主風癢麻痹通利關節牡刑子微寒平根主心風頭風肢體諸風解肌發表唐本引別録風之病人也大率有三有感而即發者有既入人身盤旋氣血間久乃成病者有人身陽氣自應風化為患者感而即發如傷寒溫熱時氣等類是已既入人身盤旋氣血間久乃成病如風眩頭面風等類是已此篇大旨為諸病提綱挈領獨於人身陽氣自應風化為病者加詳何謂人身陽氣自應風化蓋陰性凝聚陽性發散陰聚之陽必散之則陰陽固互相為用矣然不有陰氣凝聚陽在內不得出奮擊為雷霆者乎不又有陰氣凝聚陽在外不得入周旋不舍而為風者乎是故風者陽氣之變眚也其卦為巽巽者陰初凝而完聚陽始退而嬌強強者力不能散聚之紉密聚者偏不受強之提撕於是相搖相曳相摩相蕩而周旋不舍焉而抑揚飄驟焉必得雨而風乃息雨固陰陽之既翕而化焉者也故夫人身之陽在上則欲其與陰化而下歸在下則欲其化陰而上出設使在上不與陰化在下不能化陰斯陽亢無以升降於是為出柙之虎失繫之猿而窮而無歸咆哮狡獪百變不已窺篇中大意陽之鬱者伸之陽之徑者緩之陰之結者破之陰之竭者濡之隨其所在而澤陽因其所近而招陰增膏以定火之炧溉水以拯木之枯總不出用陰和陽一語就病以徵藥即藥以審病紛紜膠擾之中未始不可隨處洞徹源委也風眩菊花平主風頭眩腫痛目欲脫淚出飛廉平主頭眩頂重躑躅溫虎掌溫微寒主風眩主風眩目轉藥性論杜若微溫主風入腦戶頭腫痛多涕淚出眩倒目䀮䀮茯神平療風眩風虛茯苓平白芷溫主頭眩目癢鴟頭平主頭風眩顛倒癇疾蜀本伏牛花主風眩頭痛藥對芎藭溫臣防風微溫主頭眩顛倒火風溼痹臣主大風頭痛惡風人參微溫主頭眩轉君兔頭骨平臣主風眩巔疾證類蔓荊實微寒主風頭痛腦鳴目淚出薯蕷溫平主風頭眼眩朮溫主風眩頭痛目淚出蘼蕪溫頭中久風風眩陽在上不與陰化在下不能化陰均之風也何以在下之風有腸風胃風則為飧泄也又有風祕風燥則為便艱也在上之風有卒仆無知痰涎湧逆也又有頭風眩痛涕洟唾淚也此不特有淺深之殊抑亦有開閉之異蓋陰之錮者陽必鬱則陰固錮陽而陽亦爍陰也陰之漏者陽必動則陰固背陽而陽復迫陰也故夫閉者益閉開者愈開閉者之致斃是陰竭陽亡開者之及危乃陰離陽決雖然閉之弊斷有甚於開試思風頭眩痛非卒倒無知之輕者乎痰涎湧逆非涕洟唾淚之甚者乎然參繹前篇與此篇義旨又有以知閉者宜醒陰導陰以濟陽開者宜順陰和陰以平陽為同中之異矣順陰和陰以平陽奈何試以燭炧則淚垂波蕩則舟旋證之夫燭炧淚垂者咎在陽而不在陰波蕩舟旋者咎在陰而不在陽但風息則非特燭不炧即波亦不蕩矣是豈不可并合而論然不有膏不堅而燭垂淚者乎不有水激搏而舟旋轉者乎水激搏而舟旋轉是地勢之傾欹也膏不堅而燭垂淚是氣候之過暖也療風無藉乎崇土此篇偏疊隸以參朮薯蕷療風何資於滲痢此篇乃竝列以茯神茯苓而菊花之苦平而降蔓荊之辛寒而升朮之苦溫而守性殊楚越而收淚之功則同其可謂順陰氣使就下和陰氣使歸壑平陽氣使寧謐者非耶考仲景治眩多著意於水與飲故苓桂朮甘湯真武湯五苓散澤藛湯均不得謂為治風則風眩之必兼治水從可識矣頭面風芎藭溫除面上游風去來目淚多涕唾忽忽如醉薯蕷溫平主頭面游風天雄溫大熱療頭面風去來疼痛山茱萸平微溫除面上瘡主能發汗藥性論莽草溫辛夷溫治面腫引齒痛牡荊子溫蔓荊子微寒平溫久服令人光澤脂緻藁本溫微溫微寒長肌膚悅顏色辟霧露潤澤可作沐藥面脂蘼蕪溫葈耳溫蜀本何首烏微溫療頭面風藥對皂莢溫主風眩使巴㦸天微溫主頭面風君療頭面游風白芷溫主頭面風臣可作面脂防風溫主頭面來去風氣臣蜂子微寒微溫主面目黃久服令人光澤好顏色證類杜若葈耳實溫葉微寒頭面風亦在上之風也其主治多用溫升核以陽在上不與陰化之義相悖否夫豈知頭面風固在上其所以然卻在下哉靈樞邪氣臟腑病形篇黃帝曰首面與身形屬骨連筋同血合氣天寒則裂地凌冰或手足懈惰然而其面不衣何也岐伯對曰十二經衇三百六十五絡其血氣皆上於面而走空竅其精陽氣上走於目而為睛其別氣走於耳而為聽其宗氣上出於鼻而為臭其濁氣出於胃走脣舌而為味其氣之津液皆上燻於面而皮又厚其肉堅故天熱甚寒不能勝之也是豈非其末在上其本在下歟巢氏曰頭面風者諸陽經衇為風所乘也諸陽經衇上走於頭面運動勞役陽氣發泄腠理開而受風謂之首風是豈非招風取中之故歟觀篇中一則曰游風再則曰去來詎非其病既不常在亦不竟除來本無期去亦無跡其來也或目淚或涕唾多或忽忽如醉或頭痛或生瘡或腫或不光澤或面目黃色其去也倏然若失則其陽氣暫弛而病生稍張而病罷猶可不使陽化在下之陰令上出而為光澤脂緻以長肌膚潤顏色乎是其於風眩一則水乘風以上激一則火委頓而不上炎烏可同日語也然機關既在下何以不病於下而病於上夫適所謂陽不固而非陽衰陽衰則病於下矣然至用天雄不可不謂陽衰是則有說焉夫遠行勞力汗出於腎經有明文運動勞役而至陽氣發泄不能不謂傷自腎始而陽之發泄有多端其已發而未泄者則因其上而越之矣若已發已泄繼踵而不止慓悍而難禁者能不按而收之乎若發泄過甚根柢將傾者能不因其衰而彰之乎夫固難以一途論也充陽以運陰滯散火以靖陽氣息風以奠陽位和陰以達陽光名曰治陽實以治陰中之陽名曰治下實以使自下而上推其變而會其元古人之用意密矣哉中風腳弱石斛平主腳膝疼冷痹弱石鍾乳溫療腳弱疼冷下焦傷竭殷孽溫主腳冷疼弱孔公孽溫主腰冷膝痹毒風藥性論石硫黃溫大熱主腳冷疼弱無力附子溫大熱腳弱冷疼不能行步豉寒主虛勞喘吸兩腳冷疼丹參微寒腰脊強腳痹除風邪留熱五加皮溫微寒療躄小兒不能行女人腰脊痛兩腳疼痹主賊風傷人軟腳𦟡腰藥性論竹瀝大寒大豆平豆黃主溼痹膝痛孟詵天雄溫大溫主關節重不能行步除骨間痛側子大熱風痹歷節腰腳疼冷藥對木防己平治攣急臣治男子肢節中風毒風不語主散結氣擁腫藥性論獨活微溫主腳弱君主手足攣痛勞損藥性論松節溫治腳膝弱君主久風風虛腳痹疼痛牛膝平治痛痹治腰膝軟怯冷弱藥性論證類胡麻平中風腳弱之候與頭面風適相對照其治自應推在上之陽回入陰中以強之已耳乃復列入性寒通利者過半是何故歟夫既曰弱則非拘急攣縮可比卻甚有似於痿既曰腳則非頭項身體盡然又不全係於風何則風性善行不能但駐一處弱者筋弛而不束骨也生氣通天論曰溼熱不攘大筋緛短小筋弛長緛短為拘弛長為痿又曰有傷於筋縱其若不容痿論曰心氣熱則下衇厥而上上則下衇虛虛則生衇痿樞折挈筋縱而不任地果爾則行溼以去熱使陰得以上濟通血以導氣使陽得以下蟠而自上下下之化通矣又烏得但恃引火回陰之一端耶然則直曰痿可矣何得命之曰中風夫風固陰性凝聚陽在外不得入則與之周旋不舍而為者耳特凝聚之中果何氣哉試思氣交之令天氣迷蒙地氣抑遏土木生潤階礎流漿非陰之凝聚溼與熱耶而旋即雷雨洊至洊同瀳水至也說文必首御以風是風非溼與熱凝聚而生者耶乃是時也膠柔弦弛任是堅脆之物必轉溼潤焉則所謂中風腳弱非飄揚淒掩之風亦非掀天刮地之風直是醞釀於溼與熱中欲出而未得出欲息而不得息者彼痿則雖間亦有挾溼如所謂肉痿者餘則均係熱灼陰消皮毛血衇肌肉筋膜骨髓直乾枯焉耳此風與痿之所攸分即本書不載痿之由已再核篇中凡性溫者所主必云冷云痛間有性平性寒者所主亦有疼與冷焉是其轉移陰陽之浮滯散發陰陽之抑鬱暢達生氣之留連撥正經衇之違逆具握化機力專效捷自有常理於中而非可以常情測者尤宜具眼觀也久風溼痹菖蒲溫平主風寒溼痹茵芋溫微溫諸關節風溼痹痛天雄溫大溫主大風寒溼痹歷節痛拘攣緩急附子溫大熱主寒溼踒躄拘攣膝痛烏頭溫大熱除寒溼痹細辛溫主風溼痹痛死肌蜀椒溫大熱逐骨節皮膚死肌寒溼痹痛牛膝平主寒溼踒痹天虋冬平大寒主諸暴風溼偏痹朮溫主風寒溼痹丹參微寒除風邪留熱石龍芮平主風寒溼痹心煩邪氣茵陳蒿平微寒主風溼寒熱邪氣松葉溫主風溼瘡生毛髮松節溫主百節久風側子大熱主風痹歷節藥對薏苡仁微寒主中風溼痹筋攣君躑躅溫治風使主賊風在皮膚中淫淫痛柏子仁平主風溼痹君益氣除風溼痹獨活微溫治風四肢無力拘急君證類天虋冬平大寒葈耳實溫葉微寒主風溼周痹四肢拘攣痛蔓荊子微寒微溫主溼痹拘攣痹之訓為冷疾荀子解蔽篇注為溼病說文則風者其冷溼之所化歟是蓋不然若本無風而風為冷溼所化則痹論不得云有風氣勝者矣然則此篇但云風溼而不云寒則寒者得無風溼之所化歟是又不然痹論云風寒溼三氣雜至合而成痹則為病之由固三者兼受矣曰雜至謂錯雜而至不拘孰先孰後也曰勝謂其氣較之他氣為盛也曰行曰痛曰著則病之情狀已該其中矣然則篇中以緩急淫淫周痹為風勝以拘攣歷節偏痹為溼勝以痛為寒勝而治風以散治寒以熱治溼以滲可矣何為乎寒熱雜陳通補互用豈痹亦有屬虛屬熱者哉夫風為陽寒為陰溼為陽中之陰則邪既有陰陽矣何況人身亦有體質之不齊陰陽之偏旺氣候之勝復而感觸動蕩於其間豈能執一以為則而無臟腑之違從氣血之消長耶故曰痛者寒氣多也病久入深營衛之行澀經絡不疏則不通皮膚不營則為不仁陽氣少陰氣多與病相益故為痹寒陽氣多陰氣少病氣勝陽遭陰故為痹熱其逢溼甚者陽氣少陰氣盛兩氣相感故汗出而濡也又曰痹在於骨則重在於衇則血凝不流在於筋則屈不伸在於肉則不仁在於皮則寒具此五者則不痛凡痹之類逢寒則急逢熱則縱據此則又豈得按其始以定治乎然則何以不及五臟諸痹之治夫篇中除煩平喘通利血衇養營定驚伸引筋骨下氣止嘔之物亦何嘗闕顧謂不治五臟痹耶或謂仲景云風之為病當半身不遂或但臂不遂者此為痹其辨嚴矣何以篇中治痹之物盡治風之物夫此則邪之力有大有小耳譬諸寇盜力大者徑情直行無敢與忤力小者誘引相得萃於一隅然正其治化之端通其出入之道招徠其脅從殲戮其巨魁剿大剿小一也焉用別乎特風多猝然而至痹每積漸乃成故以久風溼痹標名非謂更有驟風溼痹相對照也賊風攣痛茵芋溫微溫療諸關節風溼痹痛附子溫大熱主寒溼踒躄拘攣膝痛側子大熱治冷風溼痹大風筋骨攣急麻黃溫微溫主五藏邪氣緩急風脅痛芎藭溫主寒痹筋攣緩急杜仲平溫治腎勞腰脊攣傴日華萆薢平主腰背痛強骨節風寒溼周痹狗脊平微溫主腰背強機關緩急周痹白鮮皮寒主溼痹死肌不可屈伸白芨平微寒主賊風鬼擊痱緩不收葈耳溫主風溼周痹四肢拘攣痛豬椒溫主風寒溼歷節疼證類石斛平逐皮肌風痹藥性論漢防己平溫主中風手足攣急靈樞賊風篇黃帝曰夫子嘗言賊風邪氣令人病今有不離屏蔽不出室穴卒然病者何也岐伯對曰此皆嘗有所傷於溼氣若有所墮墜惡血留於內而不去卒然喜怒不節飲食不適寒溫不時腠理閉而不通其開而遇風寒則血氣凝結與故邪相襲而為寒痹其有熱則汗出汗出則受風雖不遇賊風邪氣必有因加而發焉帝曰夫子之所言皆病人所自知也其毋所遇邪氣又毋怵惕之所志卒然而病者何也惟因有鬼神之事乎岐伯對曰此亦有故邪留而未發因而志有所惡及有所慕血氣內亂兩氣相搏其所從來者微視而不見聽而不聞故似鬼神據此則賊風者卒然而發正與風溼痹之積久乃成者相反矣顧賊風未必盡為攣急攣急未必盡由賊風則賊風攣急者其如飛尸如鬼擊不假有因卒然而發之攣急歟然前此種種諸風篇未必竟無攣急此篇種種諸證又未嘗皆攣急謂前此諸攣急非卒然而得則可謂今此卒然得者雖不攣急亦得命為賊風攣急可乎然核此篇僅痱緩不收皮肌風痹兩者無攣急餘則不可屈伸機關緩急風脅痛關節風溼痹痛皆攣急也矧痱緩不收上明著賊風鬼擊耶惟卒然得者與不卒然得者所主藥物大同小異是則宜參究耳雖然論病則當嚴別所由論治卻宜實據現在使風以陰陽不合化而病者必推前此五載十年曾患感冒以為據是猶曆家之推曆元縱有合而無相干涉也但是見氣之壅滯則調其氣見血之泣澀則和其血見痰之湧逆則利其痰見溼之阻礙則行其溼風之由外入者鼓舞元氣以驅而散之風之由內成者提曳陰陽以和而息之縱是驟然而得積久而成能外是哉且前此諸篇有和血者矣有行溼者矣而未宣明其所以然得此賊風篇一證而後所以和血所以行溼乃能瞭如指掌則所謂喜怒不節飲食不適寒溫不時及志有所惡或有所慕檢前此諸篇亦未嘗不有互相吻合者總在臨時進退推移以求其合而無失之拘執無失之附會斯可矣暴風瘙癢蛇牀子平主大風身癢煎湯浴之藥性論蒴藋溫主風癢癮疹身癢溼痹烏喙微溫主丈夫腎溼陰囊癢蒺藜子溫微寒主身體風癢景天平主風疹惡癢茺蔚子微溫微寒莖主癮疹癢可作浴湯青葙子溫寒主邪氣皮膚中熱風瘙身癢楓香脂平主癮疹風癢藜蘆寒微寒主頭瘍疥瘙惡瘡蜀本烏蛇平主諸風瘙疹疥皮膚不仁頑痹諸風藥對葶藶子寒主暴風使主暴中風熱痱癢枳實微寒主大風在皮膚中癢君主大風在皮膚中如麻豆苦癢殼莖主身癮疹煮水洗臣證類枳殼微寒主風癢麻痹仲景云太陽病得之八九日如瘧狀發熱惡寒熱多寒少衇微面反有熱色者未欲解也以其不得小汗出身必癢又云寸口衇遲而緩遲則為寒緩則為虛營緩則為亡血衛緩則為中風邪氣中經則身癢而癮疹又云衇浮而洪浮則為風洪則為氣風氣相搏風強則為癮疹身體為癢癢則為泄風久為痂癩氣強則為水難以俯仰巢氏云游風在於皮膚逢寒則身體疼痛遇熱則瘙癢又云人身皮膚虛為風邪所折則起癮疹據是則風瘙癢證均係營衛有邪或寒為熱折熱為寒折欲內不得欲出不能故耳夫心主營肺主衛熱折者病關於心營故血衇不咸而為癩寒折者病關於肺衛故氣機沸逆而為水此篇中所列除諸治下體溼癢外餘皆行心肺之物矣然行氣者倍多利血者絶少則以諸痛癢瘡雖屬心火但癢究在皮膚皮膚間氣既行病氣已難駐趾任是血衇間尚有邪氣湧出亦可隨氣而行竟使不能更聚惟其瘙癢本涉於陰借陽分為藏納者則宜從陽分透達其陰滯以為掃地無餘之計且病原係暴起則若是者本無多耳要之暴風瘙癢與賊風攣急均是暴病而一病於陽一病於陰病於陰故用搜逐之物多病於陽故用疏利之物多已屬兩相對待又相并而對待夫久風溼痹為卒然而得積久乃成之規模治風者七篇其衇絡條理如此統會而觀之則非特久暫之分可明即上下內外之別均瞭如指掌矣傷寒麻黃溫微溫中風傷寒發表出汗去邪熱氣葛根平杏仁溫時行頭痛解肌心下惡前胡微寒傷寒寒熱推陳致新茈胡平微寒傷寒心下煩熱諸痰熱結實胸中邪逆大青大寒時氣頭痛大熱口瘡龍膽寒大寒時氣溫熱熱泄下利芍藥平微寒時行寒熱薰草平主傷寒頭痛上氣腰痛升麻平微寒時氣毒癘頭痛寒熱牡丹寒微寒時行頭痛客熱虎掌溫微寒朮溫防己平溫傷寒寒熱邪氣利大小便石膏微寒大寒時氣頭痛身熱牡蠣平微寒傷寒寒熱驚恚怒氣𦮷母平微寒傷寒煩熱淋瀝邪氣鱉甲平犀角寒微寒傷寒溫疫頭痛寒熱諸毒氣羚羊角寒微寒傷寒時氣寒熱熱在皮膚溫風注毒毒在骨間蔥白平傷寒頭痛豉寒傷寒頭痛寒熱煩躁滿悶人溺寒寒熱頭疼溫氣芒消大寒主時疾壅熱藥性論生薑微溫傷寒頭痛鼻塞藥對栝蔞寒主煩熱渴發黃臣莖葉療中熱傷暑蔥根寒主頭痛發表臣大黃大寒使溫瘴熱疾利大小便日華雄黃平君白鮮皮寒主時氣出汗臣主時行腹中大熱飲水大呼欲走射干微溫治時氣病鼻寒喉痹陰毒使茵蔯蒿平微寒主發黃臣通關節去熱滯傷寒用之拾遺梔子大寒臣主時疾除熱及消渴口乾目赤腫痛藥性論青竹茹微寒主頭痛臣溫氣寒熱吐血崩中筋溢寒水石大寒主五內大熱臣主時氣熱盛五臟伏熱胃中熱煩滿止渴水牛角平主溫病使療時氣寒熱頭痛紫草寒主骨肉中痛臣葈耳微寒臣主中風傷寒頭痛孟詵虎骨平主傷寒療傷寒溼氣證類知母寒療傷寒久瘧煩熱脅下邪氣半夏微寒主傷寒寒熱心下堅仲景纂傷寒論用藥幾至百品今且未得其半果足盡傷寒之治耶殆有說焉傷寒論是曲鬯其流而此則疏瀹其源也詳傷寒論兼證有風溼痹有風眩有水氣有下痢有大便難有小便不利有黃疸有咳逆有痰飲有宿食有腹脹滿有腹中鳴有心下急結有心煩有喉痛有吐血有衄血有耳聾有目赤有瘀血有好眠有不得眠一一推明其傳變之由處以確當之治茲則已各分門類可別尋而得矣惟溯其得之之病曰傷寒曰時行曰中風曰瘟疫曰寒熱曰溫瘴曰溫病曰傷暑以別其受病之故而推其始得病時所隸之證曰頭痛曰心下惡曰胸中邪逆曰大熱口瘡曰熱泄下痢曰驚恚怒氣曰淋瀝邪氣曰諸毒氣曰筋溢曰骨中痛以審定其緣何而連引及是以訂其治則而利導其陰陽馴擾其偏駁使不至傳變無方與傷寒論實互相為用而適相成者也夫以寒遏陽而陽暴張以熱劫陰而陰驟耗當其正氣未動固不難發越其寒以安陽解散其熱以存陰也無如其來也非一途其宅也非一處何況勾引之者藏匿之者皆人身平昔失職之氣血乃相與合縱連衡根株蔓引苟不分崑岡玉石直謂將而必誅則既患病之人其無愆之陰陽有幾能不決裂潰敗哉故據其源令轉相化誘而使滯者開鬱者解外者徹內者通就其素相入而入因其故相和而和於是不相浹者浹不相容者容以致乎陽能納陰陰能附陽而復其太和焉試核篇中陳藥凡四十一味其未經傷寒論用者得二十一味參二十一味之性情功用皆在溫暑瘴疫痰溼毒火中與傷寒之源迥別其傷寒論常用而篇中闕如者除諸兼證可別尋主治外皆係溫補填攝之物則亦可悟源異者不可混施以求合流同者不必引繩以致歧六淫之外加二氣之內戾總在直據當時無泥陳迹則揚扢疏瀹各盡其長耳謂此篇補傷寒論之闕也可謂此篇闡傷寒論之義也亦無不可大熱凝水石寒大寒腹中積聚邪氣皮中如火燒石膏微寒大寒口乾舌焦不能息滑石寒大寒身熱泄澼黃芩平大寒諸熱知母寒消渴熱中白鮮皮寒時行腹中大熱飲水元參微寒狂邪忽忽不知人大黃寒大寒腸間結熱心腹脹滿沙參微寒皮間邪熱苦參寒除伏熱茵蔯蒿平除頭熱鼠李根皮微寒竹瀝大寒梔子寒大寒胸心大小腸大熱心中煩悶胃中熱氣蛇莓大寒人糞汁寒白頸蚯蚓寒大寒傷寒伏熱狂謬大腹黃疸芒消大寒五藏積聚久熱胃閉藥對梓白皮寒除熱使煎湯洗小兒壯熱一切瘡疥皮膚瘙癢地膚子寒主五內熱利小腹君主皮膚中熱氣小麥微寒主胃中熱使除熱止躁渴咽乾木蘭皮寒主身大熱暴熱面皰臣主身大熱在皮膚中去面熱赤皰水中萍寒主暴熱身癢臣主暴熱身癢下水氣理石寒君除營衛中大熱結熱解煩毒石膽寒主肝臟中熱臣牛黃平主小兒熱癎口不開君主驚癎寒熱熱盛狂痓羚羊角微寒主熱在肌膚臣垣衣大寒主發瘡主暴熱在腸胃白薇大寒臣主暴中風身熱肢滿忽忽不知人景天平主身熱小兒發熱驚氣君主大熱火瘡身熱煩邪惡氣升麻微寒主熱毒君除心肺風毒熱壅藥性論龍齒角平主小兒身熱臣角主驚癎瘛瘲身熱如火葶藶寒主身暴熱利小便使主身暴中風熱痱癢利少腹藍葉實寒主五心煩悶君主天行熱狂日華蜣螂寒主狂語頭發熱使主小兒驚癇瘛瘲腹脹寒熱大人癲疾狂易手足端寒楝實寒作湯浴通身熱主溫病使主溫疾傷寒大熱煩狂荊瀝大寒主胸中痰熱臣去心中煩熱小兒心熱驚癎拾遺大熱即傷寒論所謂身熱不惡寒反惡熱者也果爾則應隸之傷寒不得別為條目且陽明病雖身熱不惡寒反惡熱其始得之一二日必惡寒也然則諸病皆有熱惟此病之熱獨盛他病不足與侔者方可謂大熱歟果爾則仍應諸病為綱而熱乃其中一證今觀篇中所主均係熱盛而他病生非他病居先而熱續增也故夫大熱者雖有所在之不同所本之或異然終不惡寒無休息縱兼他病然推其故總由此而纍及乃得獨標一目自成一證耳觀夫內有所因而熱獨著於外外有所因而熱獨逼於內上有所因而熱獨伏於下下有所因而熱獨浮於上雖同為熱而已各殊其分矣何況內者有在腸在臟在胃在肝在心肺在胸中之異外者有在肌膚有在皮間有身癢有發瘡有肢滿之異上者有頭熱有口乾舌焦之異下者有伏熱有泄澼有大腹黃疸有小便不利之異若不因其輕而揚因其重而減有形者導之於內有邪者漬形為汗而但執寒因熱用為治可乎雖然大熱者火盛也火盛必濟之以水乃篇中病因有緣溼而熱盛者治法有利水而熱除者豈溼與水非但不足以息火之怒而反足以資火之燃耶夫水火之相濟也必其相和而後能相受不和則兩相拒而不相下不受則兩相賊而適相殘故病本不盛以相拒而增以相賊而劇惟導去其相拒相賊者而病於以減焉非反也所謂適事為故耳然則均之溼熱也水自行而火自盛如身熱泄澼者此又何說哉夫身熱泄澼者垢汙因熱而積於中也垢汙因熱而積於中則澼者非特可滌垢亦且可泄熱乃垢不去熱又不減則其故不在流行之水火而在留著之形質陽無所入而轉盛陰無所交而自行故其治必使形質能隨氣化而後氣化得行焉又不可與尋常溼熱竝論也寒者熱之熱者寒之固經訓也第以謂如火之熯水水之沃火則非矣何以言之夫人身之陰陽相須以為生相違而致病設病乎水者以火熯之水未竭則離火而水仍病水已竭則死矣病乎火者以水沃之火未熄則水乾而火仍燃火已熄則亦死矣故治病之道貴乎能使陰陽相入而相濟以成和相入之道無他在乎能巽順耳故易大傳曰巽入也試核此篇之旨或全陰以配陽或化陰以從陽或浥水以滋火或迎火以致水陰格陽而陽怒者抉其陰而陽自暢陽蝕陰而陰消者裕其陰而陽自飫甚且引其至故所經行之道而陽通導其至故所舒散之化而陽泰而無一味逆折之意於其間對待而觀之則以熱治寒之道可知矣推而廣之則宜補而用填塞之方宜泄而行罄盡之計救涸轍之鮒而抉西江之水療七年之病而求三年之艾均可謂不識時宜鹵莽滅裂者矣奈何從事於此者不思絲絲入蔻耶或謂陰陽必相入而後得成和是固然矣第相入不徒恃巽順也如易大傳雖以巽為入春秋傳之入猶可以順釋之歟是何不可之與有夫外之師而克入必其內有釁內之人既出而復得入必其內有應今試以篇中實證附之外師之入虛證附之出者之入焉有無釁而可攻無應而得還者歟釁者民心之不順其上而固結焉者也應者民心之不忘於我而繫戀焉者也因其不順而損之因其不忘而益者非巽順以入之之謂歟說者謂堯舜是順民之心湯武是逆取順守然易大傳不又曰湯武革命順天而應人乎是知成和必以相入相入必以順也勞復鼠糞微寒時行勞復豉寒竹瀝大寒胸中大熱煩悶人糞汁寒時行大熱狂走解諸毒蜀本大黃大寒蔥白平犀角寒防己平虎掌溫牡蠣微寒除營衛虛熱去來不定生薑微溫芒消大寒主時疾擁熱證類鱉甲平茈胡平微寒麥虋冬平微寒差後勞復元氣正傷病體增病自宜益劇則堵禦之方補救之術應加廣矣奈何仲景辨髦視之寥寥數則且并陰陽易差後勞復食復之治胥在焉可不謂太簡乎殊不知傷寒正病外別六淫內析六經推極其變固已毫無罅漏但既係病愈復病則必有復病著象故更隨象設法以示人就地剷除之義蓋六經正文已要其終此則更原其始耳倘不應時獲驗而更變幻披猖不仍有六經正文在乎是篇繼述仲景之志剖析仲景之義尤妙在不即不離間直謂全在藕斷絲連草蛇灰線處遺下陰陽偏勝隨所激動而觸發焉故此數味之中汗下清和無非當時對證之治而跬步不離病後復病之旨觀其於由痰由溼由熱由蔽在氣在血總若因陳幹而發新枝者可不謂脫胎仲景別樹新義者耶要之復病之流詎止於是儻別現他證仍隨證索治可矣溫瘧常山寒微寒溫瘧胸中痰結吐逆蜀漆平微溫瘧腹中堅癥痞結牡蠣平微寒溫瘧灑灑驚恚怒氣鱉甲平溫瘧血瘕腰痛麝香溫溫瘧辟惡氣麻黃溫微溫溫瘧去邪熱氣大青大寒防葵寒溫瘧驚邪狂走豬苓平咳瘧利水道防己平溫溫瘧熱氣利大小便茵芋溫微溫溫瘧發作有時藥性論巴豆溫生溫熟寒溫瘧癥瘕結聚堅積留飲痰癖白頭翁溫溫瘧狂𬌺寒熱女青平溫瘧辟不祥芫花溫微溫鬼瘧白薇平大溫溫瘧灑灑發作有時松蘿平痰熱溫瘧可為吐湯蜀本天靈蓋平蕘花寒主傷寒溫瘧茵蔯蒿平主瘴瘧日華藥對龜甲平臣療痎瘧小麥微寒躑躅溫使主溫瘧白斂微寒主溫瘧寒熱使主小兒驚癎溫瘧蒴翟根溫使當歸溫主瘧寒熱君主溫瘧寒熱灑灑在皮膚中竹葉平合常山煮主孩子久瘧極良雞子黃和常山為丸用竹葉湯下主久瘧證類桃仁平烏梅平治瘧方多用之雄黃平大溫菖蒲溫小兒溫瘧身積熱不可解可作浴湯莽草溫目標溫瘧舉痎瘧瘴瘧鬼瘧瘧寒熱而胥附焉何也夫痎瘧瘴瘧鬼瘧瘧寒熱之混於溫瘧猶時行瘟疫瘴熱之混於傷寒矣古人別病極嚴凡相似而析者不徒析也必其同中有異不相似而合者不徒合也必其異中有同是故傷寒時行瘟疫瘴熱之合以其皆屬陰陽相拒溫瘧痎瘧瘴瘧鬼瘧瘧寒熱之合以其皆屬陰陽相爭耳夫陰陽相爭則分理其陰陽可矣乃劫痰行水利溼之物且居其半何者哉不知此正分理陰陽微意所在也素問瘧論大旨邪藏骨髓之中不與陽俱出而隨陰偕行出則并於陽以與陰爭為熱復入則并陰以與陽爭為寒者為溫瘧陽加於陰陽逐陰行者謂之汗則溫瘧之邪固依水為行止者也淒愴寒水藏於腠理復感於風兩氣相搏伏衛氣經行之所屆衛氣來先受者先動則風并於水而寒後感者後動則水并於風而熱者為瘧寒熱必得汗而熱始解則瘧寒熱之邪亦依水為行止者也特溫瘧之汗當其始瘧寒熱之汗當其終耳靈樞五癃津液別篇謂天暑衣厚為汗天寒衣薄為溺與氣則汗與小水本係一氣所化而翕張於外則有去有來通輸於下則往而不反是治瘧者多半以劫痰行水利溼又何疑焉觀篇中即非劫痰行水利溼者其旋轉陰陽每於闔闢翕張之處緩其陽之怒以撓陰而於結聚痞滿之中泄其陰之阻以激陽其使外達者又每跬步設防俾能出不能復入以就其徹底畢達之功其與他外感為寒熱者界劃分明無少混淆是其綱舉目張有條不紊為何如哉若夫瘴瘧鬼瘧即瘧寒熱之偶兼他癘者痎瘧即瘧寒熱之久而不已者皆陰陽相爭者之支流餘派如疸瘧雖亦起落有時即不入焉則以其單熱無寒非陰陽相爭耳故斥之然則明人所創治瘧方謂使邪離於陰陽者非極善之法歟夫其所謂用風藥之甘辛氣清者以升陽氣使離於陰而寒已用苦甘寒引陰氣下降使離於陽而熱已者是使陰陽相離非使邪與陰陽相離也使邪與陰陽相離猶可言人身陰陽可使之相離乎且瘧論明言瘧由暑熱氣藏於營氣之舍寒水氣舍於皮膚之內而其所用甘辛氣清風藥茈胡升麻葛根羌活防風果可使藏於營氣之舍者離乎其所用苦甘寒石膏知母甘草粳米果可使舍於皮膚之內者離乎吾正恐其在外之陰邪愈加蔽痼在內之陽邪益難升發兩氣互阻馴至寒不成寒熱不成熱決裂潰敗耳烏得云極善之法哉嗟嗟土苴古法芻狗經方非一日矣太陽病得之八九日如瘧狀發熱惡寒熱多寒少一日二三度發身癢者與桂枝麻黃各半湯服桂枝湯後形如瘧日再發者汗出必解宜桂枝二麻黃一湯之文何嘗不在傷寒論何嘗不使邪氣與陰陽相離茈胡去半夏加栝蔞根湯治瘧病發渴亦治勞瘧茈胡桂枝乾薑湯治瘧多寒微有熱或但寒不熱之文何嘗不在金匱要略亦何嘗不使邪與陰陽相離擴而充之則皮膚之內邪氣盛者大小茈胡茈胡桂枝小茈胡加芒消小茈胡加龍骨牡蠣亦何者不可用豫每於瘧來時先嘔者用半夏瀉心吐瀉交作者用生薑瀉心胸痞下痢者用甘草瀉心汗多腹脹滿者用厚朴生薑甘草半夏人參腹滿痛者用桂枝加芍藥皆應如桴鼓若更參此篇以逗引其陰陽抉摘其巢窟當益便利如指而必杜撰成方以示古法經方之可唾棄耶且夫邪之陰陽與人身之陰陽不能不相從猶水之必流溼火之必就燥不能強之使達也況邪能與陰陽相并而為旋轉之樞耶相并者能相入也能相入原係人身陰陽生化之機故瘧雖久多不致死特能相入而不能相和故每連月浹旬不能驟解以其開者自為開闔者自為闔而不能相顧耳倘使闔中有開能拒邪而不拒正開中有闔能入正而不入邪斯開闔之間陰陽日相聯絡邪氣日益零落愈病之機遂可把握故本篇之用介類實皆取意於翕闢之中以挫其邪較之取意於使邪與陰陽相離者明眼觀之自有以知其不侔矣中惡麝香溫中惡心腹暴痛脹急痞滿雄黃平寒大溫中惡腹痛鬼疰丹沙微寒中惡腹痛毒氣升麻平微寒中惡腹痛乾薑溫大溫中惡霍亂脹滿巴豆溫生溫熟寒當歸溫大溫中惡客氣虛冷芍藥平微溫中惡腹痛腰痛吳茱萸溫大熱中惡心腹痛逆氣鬼箭寒中惡腹痛桃梟微溫中惡腹痛殺精魅桃皮平中惡腹痛胃中熱桃膠微溫中惡疰忤唐本烏頭溫大熱烏雌雞血平中惡腹痛蜀本海桐皮平主霍亂中惡肉豆蔻溫主中惡冷疰嘔沫冷氣蓬莪朮溫主心腹痛中惡疰忤鬼氣藥對牛黃平君主卒中惡芎藭溫臣主中惡卒急腫痛苦參寒君主中惡腹痛藥性論梔子大寒臣主中惡通小便藥性論枲耳葉微寒臣桔梗微溫臣主中惡桃花平使治惡氣日華巢氏云中惡者卒然心腹刺痛悶亂欲死也按此與賊風均為卒發之病第風係陰陽之偶愆故鍾於音聲發為飄驟由腠理入筋衇而阻人營衛此是陰陽之偏駁故鍾於臭味發為激射由口鼻入胸腹而隔人氣血耳其已中人也又或為嘔吐或為腸澼下痢或為腹脹或為霍亂十三自當各按見證而求治惟或著於陰而錮陽或著於陽而逼陰或著於血而閉氣或著於氣而動血種種不同是以投其間抵其隙或崇陽以化陰或由陰以起陽或通氣以調血或和血以行氣大率用苦辛溫烈為主治間之推蕩以開其蔽佐之升發以揚其遏率之辟惡以奪其魄雜之調和以緩其急因其欲上而上之因其欲下而下之因其欲外而外之因其欲行而行之盡矣第此與心腹冷痛大同不過彼係積漸而成此由卒暴而得以冷原大地之正氣惡是天地之沴氣正氣與正氣自能彼此相容不久可化乃痛而不已焉則其人正氣之不足尤盛故治之者多以補而溫沴氣與正氣本不能相入故隨即激而發病而治之者必相度其勢而疏瀹利導之也奈何世之診視二者不目為急痧即調為肝氣急痧則用金石開泄之劑猶可開通閉塞抉去穢氣肝氣則用骩骳利氣之物骩骳屈曲也不能去病適以導病游行他所治病貴乎先正病名厥有旨哉霍亂人參微寒微溫霍亂吐逆調中朮溫霍亂吐下不止附子溫大熱心腹冷痛霍亂轉筋桂心大熱霍亂轉筋乾薑溫大熱霍亂脹滿橘皮溫氣衝胸中吐逆霍亂止泄厚朴溫大溫霍亂腹痛脹滿香薷微溫霍亂腹痛吐下麕舌微溫主霍亂腹痛吐逆心煩高良薑大溫胃中冷逆霍亂腹痛木瓜溫霍亂大吐下轉筋不止蜀本小蒜溫歸脾腎主霍亂腹中不安雞屎白微寒藊豆葉主霍亂吐下不止雞舌香微溫療霍亂心痛豆蔻溫山薑去惡氣溫中中惡霍亂心腹冷痛功用如薑楠材微溫主霍亂吐下不止蓬莪朮溫主霍亂冷氣吐酸水肉豆蔻溫主霍亂中惡冷疰嘔沫冷氣海桐皮平主霍亂中惡藥對吳茱萸大熱臣主霍亂瀉痢日華證類丁香溫脾胃止霍亂擁脹既云嘔吐而病名霍亂矣復云病發熱頭痛身疼惡寒吐痢者名霍亂是霍亂之證不特吐痢必且兼有表證矣又云痢止復更發熱又云卻四五日至陰經上轉入陰必痢又云似欲大便而反失氣仍不痢者屬陽明見霍亂之證吐痢止後有表證不止者且有實則入陽明虛則入三陰者矣傷寒論霍亂篇寥寥數策而外自三陽內至三陰貫通周浹傳變分明治法詳盡如此何容復贅一辭乃茲篇更以藥二十餘味命為通治霍亂而仲景所不用者十居其八是果於仲景之書有關會否耶蓋嘔吐暨下痢有因傷寒而致者有不因傷寒而致者則霍亂亦必如是矣霍亂之有因傷寒而致有不因傷寒而致於何別哉巢氏曰霍亂者揮霍之間便致繚亂也由人溫涼不調陰陽清濁相干亂於腸胃變發則心腹絞痛心痛者先吐腹痛者先痢心腹竝痛則吐痢俱發實者身發熱頭痛體痛虛者但吐痢而已其別有飲酒食肉腥膾生冷過度者有居處不節者有露臥溼地者有當風取涼風冷襲之者皆歸於三焦傳於腸胃而作也惟此則不特霍亂之或因傷寒或不因傷寒既可曉然即此篇藥品所主亦將思過半矣蓋補虛有調中和中之物去實有利氣疏氣之物驅溼有散發滲利之物達外有開拓經絡之物以及解酒辟腥卻寒除水概欲腸胃間陰陽相順而不相干使廩於三焦輸於膀胱是不特竟霍亂之委抑且徹霍亂之源矣於仲景書又何悖焉轉筋小蒜溫木瓜溫橘皮溫雞舌香溫楠材微溫轉筋日華豆蔻溫香薷微溫轉筋可煮汁頓服半升孟詵杉木微溫藊豆微溫薑微溫掌氏曰本經朱字乾薑溫墨字生薑微溫若從朱字則是乾薑即不當言微溫若從微溫則是生薑即當作墨字然二薑俱不主轉筋難以改正霍亂有因傷寒而致有不因傷寒而致固然矣轉筋有因霍亂而致有不因霍亂而致亦不易之理也奈何此篇所陳藥品檢竅本經別録多無主轉筋明文率有主霍亂名目則一似轉筋竝由霍亂來者可乎蓋巢氏之言可徵矣云大吐下後陰陽俱虛血氣皆極則手足逆冷而營衛不理冷搏於筋筋遂為之轉云足太陽下血氣皆少則喜轉筋喜踵下痛以血氣少則易虛虛而風冷乘之故也是以時俗之發轉筋止有兩端一者由霍亂一者老人夜臥足間不暖而二者之來一係吐下後一係無病又一則足筋轉手筋亦轉一則及足不及手皎然可辨也惟篇中所列祇及霍亂轉筋而不及老人轉筋此則應有說焉夫曰冷搏之冷乘之是冷氣能及筋筋畏冷氣為之絞轉非冷能入之也而皆云因血氣之少營衛之虛則護衛失於外葸餒存乎中其情益著矣然其虛也有方病方不病之殊方病者摘去其病源病已而轉筋不能不已方不病者亦必求其所以虛之由自當核諸虛勞腰痛等篇若以虛勞腰痛等篇暖下補益之物混於此中則似霍亂轉筋亦有溫補之治以霍亂者必轉筋老人者不皆轉筋故其治自宜界晝分明耳霍亂篇尚兼用補益惟此篇則消暑袪溼溫中利氣獨不及補益可見霍亂固有因虛而作者第因虛而作者多不必轉筋則此篇雖寥寥數味又豈不足取證於別録本經豈竟遂無間隙可尋義旨可按耶嘔啘厚朴溫大溫胃中冷逆胸中嘔不止香薷微溫麕舌微溫雞舌香微溫附子溫大熱小蒜溫楠材微溫高良薑大溫暴冷胃中冷逆木瓜溫桂大熱咳逆結氣擁痹橘皮溫胸中瘕熱逆氣沖胸中吐逆蜀本枇杷葉平卒啘不止下氣麝香溫肉豆蔻溫中惡冷疰嘔沫冷氣藥對青竹茹微寒主啘嘔臣蘆根寒生主啘開胃除噎噦不止藥性論通草平主啘臣心煩噦出音聲生櫻薁根汁寒證類人參微寒微溫胸脅逆滿丁香溫朮溫說文玉篇廣韻皆無啘字啘字始於難經第十六難曰其病煩心心痛掌中熱而啘有是者心也滑氏注云啘乾嘔也夫啘之義為乾嘔而此篇之目曰嘔啘若合為一貫則嘔啘連稱於義不可通若分作兩層剖嘔與乾嘔為二項則嘔又與下文嘔吐條犯復矣諸病源候論嘔之目有六曰乾嘔曰嘔噦曰噦曰嘔吐曰噫酢曰惡心是乾嘔不能與嘔同稱之證其諸為嘔噦之訛歟廣韻噦字讀呼會切者其義為鳥聲於此無涉讀於月切者其義為逆氣而凡宛傍之黦菀字讀於月紆物於歇等切則啘噦以聲相近而為省體稔矣況本篇通草下藥對云主啘而別録則謂心煩噦出音聲非確不可移之證耶嘔噦云何巢氏曰胃受邪氣則嘔脾受邪氣則脹而氣逆遇冷折之氣不通則噦靈樞口問篇曰穀入於胃胃氣上注於肺今有故寒氣與新穀氣俱還入胃新故相亂其邪相攻氣竝相逆復出於胃故為噦是嘔者氣上逆而有物噦者氣上逆而有聲或先有聲而繼之以物或既有物而復續之以聲者命曰嘔噦何為不可乎以是知嘔噦有因氣者有因寒者有因火者有因水者有因虛者導氣更橫開直降散泄通順之不同逐寒又溫中暖下開結通陽之各異至於益津調中以退火開解滲利以驅水益氣泄溼以補虛篇中莫不隨事而制宜因利而乘便要之皆直揭其原而濬其流斯無盛盛虛虛之弊耳傷寒論云傷寒大吐大下之極虛復極汗出者以其人外氣怫鬱復與之水以發其汗因得噦所以然者胃中寒冷故也云傷寒噦而腹滿視其前後知何部不利利之則愈金匱要略云病人胸中似喘不喘似嘔不嘔似噦不噦徹心中憒憒然無奈者生薑半夏湯主之云乾嘔噦若手足厥者橘皮湯主之噦逆者橘皮竹筎湯主之夫以水火相軋而病以陰開陽入而愈其常也而不知縷析條分源同派異有如本篇者又焉得不揣切本篇義旨而為仲景擴充微蘊耶大腹水腫大㦸寒大寒十二水腹滿急痛甘遂寒大寒大腹疝瘕腹滿面目浮腫澤漆微寒皮膚熱大腹水氣四支面目浮腫葶藶寒大寒邪水上出面目浮腫下膀胱水芫花溫微溫消胸中痰水喜唾巴豆溫生溫熟寒留飲痰癖大腹水脹豬苓平防己平溫水腫風腫澤蘭微溫大腹水腫身面四支浮腫骨節中水桑根白皮寒水腫腹滿臚脹利水道商陸平水腫痿痹腹滿洪直疏五臟散水氣澤藛寒逐膀胱三焦停水郁李仁平大腹水腫面目四支浮腫利小便水道海藻寒腹中上下鳴十二水氣昆布寒十二水腫苦瓠寒大水面目四支浮腫下水令人吐小豆平下水利小便瓜蒂寒大水身面四支浮腫下水蠡魚寒溼痹面目浮腫下大水鯉魚寒水腫腳滿下氣大豆平逐水脹除胃中熱痹蕘花寒微寒下十二水利水道黃牛溺寒水腫腹脹腳滿利小便蜀本海松子小溫散水氣藥對香薷微溫主水腫臣散水腫穀米微寒主逐水腫利小便臣通草平主利水腫及小便臣麥門冬微寒臣身重目黃心下支滿椒目寒主除風水滿使柳花寒主腹腫使風水黃疸面熱黑雄黃平君白朮溫逐風水結腫君秦艽微溫主下大水臣水腫一證支派甚多在素問有腎風風水湧水之別在靈樞有膚脹鼓脹腸覃石瘕石水之別在金匱要略有風水皮水正水石水氣水血分氣分之別在諸病源候論有水分毛水疸水燥水溼水水癥水瘕水蠱水澼之別今以藥三十三物概之謂可挈其要領而盡其變歟是固不可然其命意所在亦實有甚廣大而極精微者不可不察也蓋水者節制於肺輸引於脾敷布於腎通調於三焦膀胱此其分焉者也一處有病則諸處以漸窒礙乃遂成水此其合焉者也自其分者而言則或始於喘呼或始於脛腫或廓於皮膚或充於腸胃或綳急於外而中空或堅結於裏而中實自其合者而言則均之一身支體面目紅腫已矣就其合遡其分而別其勢之靜與動虛與實驗其機之上與下出與入焉以迎而奪之適事為故非已得其要領遂貫其條目也耶或謂湯液醪醴論所謂開鬼門潔淨府者是治水之大綱詳篇中所列藥品大都皆屬潔淨府而於開鬼門僅略及焉不可謂偏而不全乎夫論治論藥自是二端無容相混就如金匱要略水氣篇何嘗不麻黃桂枝細辛生薑間用其黃芪附子甘草石膏芍藥杏仁枳實用之亦不一而足又如千金方外臺祕要等以兼喉中鳴而加白前半夏兼咳上氣而加五味乾薑兼小便癃閉而加石韋兼癥瘕及澼而加麝香牽牛藜蘆苦參狼毒烏頭野葛雄黃兼滿而加厚朴兼結而加射干兼熱而加黃芩大黃用過其當未嘗不奏捷也而目之謂主水腫可乎蓋治必以方方必該一病之全藥須求主主必抵一病之隙歷繹自唐以前方書固有治水而不用此篇之藥者矣未有他證不兼有水而用此篇之藥者也則彼此交互之處豈無意義寓於其間乎水證必小便不利茯苓為利小便統領本經載之仲景遵用之別録且一謂其主大腹淋瀝二謂其主水腫淋結此獨屏不載入豈無故哉夫松當生長之際其氣上行則質疏而葉散色青而不雕及斬伐之餘其氣下淪則疏變為堅散變為整故若松脂之主疽瘡松實之主風痹松葉之主風溼松節之主久風皆病淫於軀體而不能散者至茯苓之利水則病結於中而不能下者觀其上行之氣於色為青下行之氣於色則白青主升而白主降其能利水審矣第茯苓之利水固降水之結於中而不下者若水而過顙在山汪洋盈溢則非其所能降也篇中諸味所主之證不曰面目四肢浮腫則曰腹滿臚脹急痛盡向上向橫之水是豈茯苓所能利故別録所列不合之曰大腹水腫而分之曰大腹淋瀝水腫淋結夫淋者小便澀也結則閉而難通瀝則通而不爽大腹則氣盛於水水腫則水盛於氣曰大腹淋瀝見氣不能化水曰水腫淋結見水不從氣化茯苓者專行直道令水道氣通使水隨氣化而下是固的對相符之劑矣而本篇不載非漏也亦非佚也見其所主者淋而非主大腹水腫也若載之豈不嫌於能主上出橫出之水乎是故大腹水腫而淋瀝淋結用之可也不淋瀝淋結用之無益也此其不載之故歟然則澤藛豬苓非茯苓儔歟且其經文絶不及大腹水腫乃得竝列篇中何也夫水不畏其難於決泄而畏其旁溢上出不患其不從陽宣而患其不從陰化故凡水病仲景收列之方後人獲效之法用溫用補者何限此篇概不及焉非匿也蓋以日暴水以火熯水原夫人知之無煩更諄諄耳良以水體陽而用陰性動而好靜試觀天下巨川凡歸壑處必先匯為大浸浸澤之總名復束而狹之則其奔流就下自無阻滯不畏其更淤濁而淀矣淀淺水也玉篇豬苓所治之水平流漶漫漶漫不分別貌不攪亦濁澄亦不清者也而欲其從陰化是猶使匯為澤乃加束縛焉以助其湍疾耳是本經利水道之謂也凡水中有熱則趨下必梗以熱欲上而水欲下也其在人而應之以濁竝可見其非特熱不得伸水亦不得升矣惟澤藛善使水中之氣出於水上氣伸而水亦升水中之精微升則其體質降矣故本經稱之曰消水別録稱之曰主消渴而更謂為逐膀胱三焦停水也夫膀胱屬太陽三焦屬少陽少陽為樞太陽為開惟陽盛而不開緣樞折而不轉則其所苦非熱其誰水以熱停而欲逐者自宜先轉其樞樞轉而升降自遂矣要而論之澤藛所主是水中之氣不化故於大腹水腫為要劑豬苓茯苓所主是水不從氣化故應次之而茯苓是水蓄於陰不從陽化豬苓是水漫於陽不從陰化以兩者相較則不從陽化者其常不從陰化者其變以是常者可略變者不應略耳腸澼下利赤石脂腹痛泄澼下利赤白龍骨平微寒泄利膿血牡蠣平微寒澀大小腸止大小便乾薑溫大熱腸澼下利黃連寒微寒腸澼腹痛下利黃芩平大寒腸澼泄利逐水當歸溫大溫止利腹疼藥性論附子溫大熱下利赤白禹餘糧寒煩滿下赤白小腹痛結煩疼藜蘆寒微寒泄利腸澼檗木寒止泄利雲實溫泄利腸僻礬石寒寒熱泄利白沃阿膠平微溫療風止泄熟艾微溫止赤白利陟釐大溫溫中消穀強胃氣止泄利石硫黃溫大熱蠟微溫下利膿血白蠟久泄澼後重見白膿烏梅平除冷熱利石榴皮平療下利枳實寒微寒止利蜀本使君子溫療溼利金櫻子平溫療脾泄下利藥對白石脂平主水利臣止腹痛下水小腸澼熱溏便膿血牛角䚡溫治利臣止冷利瀉血藥性論滑石寒主澼下君身熱泄僻地榆微寒止血利桂心大熱主下利君吳茱萸大熱主冷下泄臣鯽魚頭溫主下利作鱠主久赤白利厚朴溫主下泄腹痛臣泄利白朮溫主胃虛冷利君蜜平主赤白利君止腸澼龜甲平主下泄臣漏下赤白久蜆穀寒主下利使薤白主下赤白利臣白頭翁溫主毒利止痛使猬皮平主赤白利臣腸風瀉血蚺蛇膽寒主下䘌蟲使柏葉微溫主血利君蒲黃平主下血臣小豆花平主下利使麴溫主腹脹冷積下利臣消穀止利豬懸蹄微寒主下漏泄使雞子平主下利卵白主小兒下泄貝子平主下血白蘘荷微溫主赤白利臣葛穀平主十年赤白利臣赤羊脂溫主下血臣合腎為羹療勞利唐本蓯蓉微溫主赤白下利臣除膀胱邪氣腰痛止利赤白花鼠尾草微寒主赤白下利使下利膿血不止白花者主白赤花者主赤證類赤地利平赤白冷熱諸利桃花石溫大腸中冷膿血利腸澼下利顯不同科釋名云泄利言其出漏泄而利也下重而赤白曰䐭䐭赤白痢也玉篇言厲䐭而難也是一病於通一病夫塞烏得以一物兩綰之耶綰貫也繫也殊不知塞與通皆由於結陰結而陽不足以破之是以病乎通陽結而陰不足以入之是以病乎塞故治利治澼不容苟同解結闢途仍歸一轍此篇中用溫劑燠寒滯泄劑逐水停所以既堪挽其過通即得開其蔽塞也而其批郤導窾卻又別有經緯蓋讀傷寒論金匱要略而知其部署分析各有區域焉曰久利曰暴利而已矣治久利者烏梅丸是也暴利者復宜分上中下三停所謂傷寒服湯藥下利不止心下痞硬服瀉心湯已復以他藥下之利不止醫以理中與之利益甚理中者理中焦此利在下焦赤石脂禹餘糧湯主之復利不止者當利其小便是也合四方一法而本篇原所載藥已十得八九矣再核之以熱利氣利清穀利厥逆利既吐且利實結利此中豈復更有餘蘊哉惟一篇之中別有所因一證之內更有罅隙故不得不窮其流而指以歸束如病在血者及開闔之不遂者食物之不化者徑道之枯澀者自當各有的對之治焉其他兼外邪者解其表而利自寧因勞乏者補其虛而漏自止則又不待言而可識矣水利久水利赤利久赤利血利久血利赤白利久赤白利疳利久疳利此外臺祕要方條目也熱利冷利疳溼利此千金方條目也太陽病桂枝證醫反下之利遂不止太陽中風下利嘔逆太陽與陽明合病必自下利太陽與少陽合病下利傷寒發熱汗出不解心中痞硬嘔吐下利陽明少陽合病必下利太陰為病腹滿而吐食不下自利甚益時腹自痛自利不渴者屬太陰少陰病衇微下利少陰病下利清穀裏寒外熱厥陰病下之利不止傷寒先厥後發熱而利者必自止見厥復利傷寒始發熱六日厥反九日而利後三日衇之其熱續在者期之旦日夜半愈此傷寒論條目也統而繹之一言新久一言冷熱一言表裏其何以合之是篇而使有所適從乎夫是篇者所以盡其常三書者所以極其變無是篇諸藥不足定下利之指歸無三書推原不足知下利之委曲此三書與是篇互相發明還相成就處也至三書旨趣似若猶有歧者然千金不云乎利方萬千撮效七八宏之在人陟釐丸烏梅丸松皮散暴利服之何有不瘥溫脾湯建脾丸久利得之焉能不愈而陟釐等法載在熱利溫脾等方隸諸冷利是已可就新久而分冷熱矣況在傷寒金匱玄機妙諦如走盤珠毫無窒礙如植芎藭逐節生根而其歸著仍有大綱挺然對峙則曰自利因下而利也自利者不乘裏不虛因下而利者不連表難治何以故曰下利衇沉弦者下重也衇大者為未止衇微弱數者為欲自止雖發熱不死曰下利有微熱而渴衇弱者今自愈曰下利衇數有微熱汗出今自愈設復緊為未解此自利乘裏可治之候也曰下利手足厥冷無衇灸之不還反微喘者死曰少陰病惡寒身踡而利手足逆冷者不治此自利乘裏不可治之候也曰太陽病下之後其氣上衝者可與桂枝湯如前法曰太陽病下之仍頭項強痛翕翕發熱無汗心下滿微痛小便不利桂枝去桂加茯苓白朮湯主之此雖下而連表之候也曰動氣在下不可下下之則腹脹滿卒起頭眩食則下清穀心下痞曰咽中閉塞不可下下之則上輕下重水漿不下臥則欲踡身急痛下利日數十行此因下而不連表之候也雖然利之支流庸詎止是如膿血利水飲利寒熱錯雜利熱利協熱利甚者有應下之利且不一端焉何也蓋病之情不一病之變不一病之遷延不一病之駐足不一若因乎熱因乎實而止者不行行者不止以至水不資火火不運水則捨下何以使熱去而水得浥土水既浥土而火遂暢朗耶夫然故下證多矣多不云急下而惟下利之當下者每稱急下此可憬然悟也若夫以寒已熱以錯雜對待錯雜其理皆甚易明以驅飲除水俾水去而利自止者更不煩言矣更有一言可明全局者曰千金方之以利屬脾臟也夫脾不為土乎利者水土之不膠黏也素問經衇別論食氣入胃散精於肝淫氣於筋食氣入胃濁氣歸心淫精於衇衇氣流經經氣歸於肺肺朝百衇輸精於皮毛毛衇合精淫氣於腑腑精神明留於四臟氣歸於權衡權衡以平氣口成寸以決死生流轉臟氣偏沾所合而不及脾腎是可證食入於陰氣長於陽矣飲入於胃游溢精氣上輸於脾脾氣散精上歸於肺通調水道下輸膀胱水精四布五經竝行合於四時五臟陰陽揆度以為常則獨重脾腎夾輔以肺於三焦三焦肺通膀胱之道也而偏行陽道以澤陰是可明飲入於陽氣長於陰矣故小戴禮郊特牲曰凡食養陰氣也飲養陽氣也不可互相發明耶土之於水也能浥而後布水之於土也就範而後流猶江河必行於地設使地不足以隄水為害者固水也受害者其誰耶土卑靡則水為窪積而至盈必潰捨培土何以使之相和土剛磽則水不沾泄而無留必燥捨撥土何以使之相入大寒凝沍凌結於上土燥於下捨溫煦無從就和大暑溽潤土既饜飫水遂漫溢捨涼肅決難消落此篇中用寒用溫厚土疏土所以竝行不悖至若土之高下驟殊水之奔駛莫挽宜於置閘以蓄之水之衝激所向土之抵禦難周宜於加堤以護之此篇中用澀用固之旨更若土平水漫待涸無期何能不鑿渠以導水若土燥盼澤維艱何能不抑戽為資此篇中用疏泄用滋柔之方也他如緣蟲聚而水礙流因食滯而水被阻血結亦能致氣澀氣澀遂足離水土之交氣漓亦能致血漓血漓儘足解鍵鐍而潰烏能不一一涉及脾腎哉大便不通大黃寒大寒蕩滌腸胃推陳致新通利水穀巴豆溫生溫熟寒蕩練五藏六府開通閉塞利水穀道石蜜平微溫麻子平初食利大小腸久食則否陳士良牛膽大寒利大小腸藥性論豬膽微寒證類朴消寒大寒逐六府積聚結固留癖芒消大寒五臟積聚久熱胃閉大㦸寒大寒利大小腸檳榔溫逐水除痰癖牽牛子寒治痃癖氣塊利大小便藥性論郁李仁平治腸中結氣關格不通藥性論以大便不通而用篇中諸味皆可無藉思索立得成驗者豈遂徑情直行竟投之乎抑猶當瞻顧詳審乃用之也豫則謂下藥終不可浪投觀仲景諄諄於不可下至反覆煩碎而所謂當下之急下之者脫口而出又若斷不容遲則其故必有在矣夫當下之證莫多於陽明篇以陽明之病為胃家實正大便不通之謂也然猶汗出多者不可下小便多者不可下不能食者不可下衇緩弱者不可下何況咽中閉塞者不可下諸外實者不可下衇浮大者不可下病欲吐者不可下諸四逆厥者下可下面合赤色者不可下心下硬滿者不可下又疊載於不可下篇耶雖然既已識其不可用即不失其所當用故夫大便不通而無以上諸證旁見側出者遂徑情直行而用之何患焉以是觀之則篇中所載已覺其謹嚴不苟甚矣夫推寒蕩熱兩物之雄爽峻健既已竝峙於前餘非潤以滑之則血肉之品苦以泄之而已下藥何限豈獨此區區哉即唐氏所續軟堅逐水導氣開結又豈無功相似性相近者可以羅列備採耶太陽病寸緩關浮尺弱其人發熱汗出不惡寒而渴者此轉屬陽明也小便數者大便必硬不更衣十日無所苦也渴欲得水少少與之但以法救之渴者宜五苓散傷寒五六日頭汗出微惡寒手足冷心下滿口不欲食大便硬衇細者此為陽微結必有表復有裏也可與小茈胡湯陽明病本自汗出醫更重發汗病已瘥尚微煩不了了者此大便必硬故也以亡津液胃中乾燥故令大便硬當問其小便日幾行若本小便日三四行今日再行故知大便不久出今為小便數少以津液當還入胃中故知不久必大便也仲景於大便不通不下之下不治之治如此後人尋思於此而擴充之即此篇治法亦自在矣小便淋滑石寒大寒通九竅六府津液去留結止渴冬葵子及根寒主五癃利小便白茅根寒利小便下五淋瞿麥寒關格諸癃結小便不通榆皮平大小便不通利水道石葦平五癃閉不通利小便水道葶藶寒大寒下膀胱水伏留熱氣蒲黃平心腹膀胱熱利小便麻子平逐水利小便琥珀平通五淋石蠶寒主五癃破石解結氣利水道除熱蜥蜴寒主五癃邪結破石淋下血利小便水道胡燕屎平破五癃利小便衣魚溫婦人疝瘕小便不利又療淋亂髮微溫五癃關格不通利小便水道蜀本林石暖主石淋水磨服之當得碎石隨溺出藥對車前子寒主淋主氣癃止痛利水道小便茯苓平主淋利小便君黃芩大寒主利小便臣逐水利小腸澤藛寒主淋利三焦停水君消渴淋瀝逐膀胱三焦停水敗豉皮平主利小便臣冬瓜微寒主淋小便不通君利小便止渴桑螵蛸平主五淋利小便臣通五淋利小便水道證類豬苓平利水道石燕寒以水煮汁飲之治淋有效海蛤平治水氣浮腫下小便藥性論木通平通利九竅貝齒平主五癃利水道說者謂靈蘭祕典論言膀胱者州都之官津液藏焉氣化則能出矣故利小便者在用溫通以化膀胱之氣而巢氏則謂腎虛膀胱熱乃為淋兩說正相歧也夫巢氏固云水入小腸下於胞行於陰為溲便腎氣通於陰陰為津液下流之道若腑臟不和則腎虛而膀胱熱熱則津液溲便遂數且澀淋瀝不宣故謂之為淋矣而泰西家則言腎之情熱與溼膀胱之情冷與燥且言腰體之內有一穴以膜皮圍用為吸取血絡衇絡綁縛絡使溺液流通乃以腰之驅德進於溺液之吸德下至膀胱而瀉焉則出雖由於膀胱而化氣則繫於腎腎之熱溼正所以和膀胱之冷燥且腎曰驅膀胱曰吸則是一臟一腑緊相接遞相和者也若驅德不濟吸德遂優於是熱與溼者移於膀胱而道路不順津液內溢故小便如粟狀小腹弦急痛引臍中以是篇中溫劑竟少而性寒者類以清膀胱之熱平者類以助腎之驅斯亦知彼說雖異而無不可可通矣然謂淋家不可發汗發汗必便血何也請即篇中所列衣魚亂髮論之夫血水同源竝藉心火蒸化其精者行於陰分為血粗者行於陽分為溺汗亦心之所布而徵之腎者也故曰腎主五液入心為汗今心以強迫之劑必欲作汗而徵諸腎腎方困於膀胱之吸而不能驅其何能更輸將不爽於是心暴斂於下膀胱不勝誅求致所聚之熱所蓄之溺竝蒸迫化血下行矣亂髮之用能使水火合德而化氣故血源濬而水自通水道利而血自止衣魚之用能化水溼於木氣閉塞中使從竅穴而達故去疝瘕即以通水道利水道即以消疝瘕淋家緣發汗而溺血惟以是耳自其疲罷而言謂之癃自其艱阻而言謂之淋癃罷病也說文淋懍也小便難懍懍然也釋名癃之虛者溺多汗多泣多唾多氣出而不反其實者溺祕汗祕目乾舌乾氣結而不解此其所以然既見於疏證石葦下矣而病源復列五淋之目曰熱曰冷曰氣曰沙曰勞病則似不相兼治則多容相濟者蓋癃之虛近於淋之勞與熱淋之沙與冷又近於癃之實且兩端皆有因氣成病者則本篇之竝列五癃五淋非疊出亦非混淆矣況言治癃之下不言治淋言治淋之下不言治癃耶惟曰利小便曰利水道曰利小便水道曰逐曰下則不得不縷析而鬯其義焉夫小便者水道之委水道者小便之源宜利小便者必源清而委不順宜利水道者必委道而源不繼利小便水道則通徹源委之謂也又何難竟其義哉下降平聲也史記陳涉世家蘄下索隱調降之也史記酈食其傳令下足下正義逐從也楚詞河伯乘白黿兮逐文魚注馳逐也文選南都賦群上放逐注流蕩也荀子儒效篇故風之所以不逐者注以是論之下者因其不順脅之使順也逐者因其無力助之推送也然則曰通曰利又何以別之夫通者對不通而言利者能通而不能便利如指也是以篇中凡言下言通者其物多有力而迅言利言逐者其物多宛轉而和以此權衡藥之緩急即以此料度病之虛實則為癃為淋之差別自明而三焦膀胱之通塞順逆自見矣素問六節藏象論靈樞終始篇禁服篇咸謂人迎衇大四倍曰格寸口衇大四倍曰關關為溢陰格為溢陽人迎氣口衇竝大四倍曰關格關格之衇羸不能極於天地之精則死皆言衇而不言證難經三難曰關以前者陽之動遂上魚為溢為外關內格此陰乘之衇也關以後者陰之動遂入尺為覆為內關外格此陽乘之衇也三十七難曰邪在六腑則陽衇不和陽衇不和則氣留之氣留之則陽衇盛矣邪在五臟則陰衇不和陰衇不和則血留之血留之則陰衇盛矣陰氣太盛則陽氣不得相營故曰格陽氣太盛則陰氣不得相營故曰關關格者不能盡其命而死此則明其理而猶未言其證仲景曰寸口衇浮而大浮為虛大為實在人為關在寸為格關則不得小便格則吐逆趺陽衇伏而澀伏則吐逆水穀不化澀則食不得入名曰關格則言其證矣而與本篇所治尚未盡符巢元方曰關格者大小便不通也大便不通謂之內關小便不通謂之外格二便俱不通為關格由於陰陽氣不和營衛不通故關格則陰陽氣痞結腹內脹滿氣不行於大小腸則大小便不通又風邪在三焦三焦約則小腸痛內閉大小便不通日不得前後外臺祕要曰集驗云關格之病腸中轉痛不得大小便葛氏云卒關格大小便不通支滿欲死二三日則殺人姚氏云風寒冷氣入腸忽痛堅急如吹狀大小便不通或小腸有氣結如升大脹起名為關格則詳於證且與本篇之治合矣卻又不及乎衇紛紛諸說遂可聯衇證為一貫耶自其淺而言則衇較大四倍為何如狀不能極天地之精為何如候豈得以大小便不通一節概之殊不知由大小便不通而脹滿由脹滿而大小便益不通上不得入下不得出又安能呼吸天地精氣以為生即葛氏亦謂二三日則殺人又何能更盡其期以死若是猶以為輕渺必立斃之證乃得為甚耶雖然此非篇中瞿麥亂髮所治之關格也欲求瞿麥亂髮所治之關格則仲景所論其庶乎蓋寸口之衇浮為氣虛大為陽實在上則陽越而氣無以攝在下則氣餒而陽無以泄所謂陽實而不能化氣者也故曰在尺為關在寸為格關則不得小便格則吐逆觀乾薑黃連黃芩人參之治格即可以悟治關之法矣而不曰不大便自固與衇偏大四倍以上者異也跗陽之衇伏為陽鬱澀為絡虛陽鬱而欲達不得達則吐絡虛而陽不為之行則脘中乾而食不得入曰此為關格則竝不重在小便之不利而重在吐逆矣絡虛而氣不行陽實而氣不化其病皆涉於火瞿麥開火之腑氣者也亂髮化火之臟氣者也臟氣化則血源濬而水自通火府開則水氣清而火自散故凡兩物之用固在衇之偏大偏小而實不得以四倍以上為準其效固在通小便又實不得以大小便竝不通為準且二物於關格之下竝繼以不通字樣則凡篇中別物下言其病曰不通言其效曰通者皆可以關格類推矣小便利牡蠣平微寒澀大小腸止大小便龍骨平微寒縮小便鹿茸溫微溫主小便利桑螵蛸平夢寐失精遺溺漏蘆寒大寒止遺溺土瓜根寒止小便數不禁雞䏶胵微寒主小便利遺溺除熱止煩雞腸草微寒止小便利藥對菖蒲溫止小便君止小便利蒟醬溫主尿不節臣證類山茱萸平通九竅止小便利小便利實該小便多小便不禁小便數遺尿四證而四證者惟小便數為有熱餘則皆屬陽衰陽衰之中又宜分作兩端如孩提之善遺尿是陽氣之未充也老人之苦溺多至夜尤是是陽之已竭也大抵小便者根於腎行於膀胱膀胱者以氣為用氣盛則中熱而有紀律經行者不敢不受其節制氣弱則中寒而不能自振經行者遂不受約束直達而過焉是故小便數者約束太過也小便利者徑情直行也小便不禁者醒而不能約束也遺尿者昏而不能約束也昏而不能約束猶可俟醒醒而不能約束則直陽之憊矣然此皆常病可於方書核證檢方以求愈者也此篇所載則更有啓發元悟醒惕靈機者在焉篇中大旨小便之行固恃夫陰陽之相化尤喫緊在土之浥滲蓋惟其浥是以精華必留惟其滲是以形質必去惟其當浥是以有藉夫陽惟其當滲是以有藉夫陰陰者所以召陽使歸而行所當行止所當止陽者所以布陰使溉而內沾五臟外透皮毛且客熱恃陰以消孤陰恃陽以化相裒相益以底乎成此不更於病源千金外臺前加一曳綱振領乎況以水中多節之物制水之無節便而不溺之物轉溺而不便之為病引而伸之觸類而長者醫中關鍵不益明暸哉雖然小便利之候不得兼渴也若兼渴則是消渴病而非小便利矣漏廬夫人知其能利水此則曰止遺溺小便利者其患必在竅之通此則曰山茱萸能通九竅止小便利又通五淋利小便水道者必與遺溺相違惟桑螵蛸兩者兼治是焉知其能不適相反耶是三者皆當詳其兼證按其氣化而明之夫漏廬春夏色白屆秋變黑能化金為水固治溼熱之物也乃主皮膚熱而有惡瘡疽痔溼痹是外之熱不能入內以逐其溼內之溼不能及外以和其熱矣膀胱者腎之表而肌膚又膀胱之表倘其病表裏不相符而水道不利者是腎虛膀胱熱用此正以除表熱而逐裏溼遺溺者是膀胱虛冷不能約水用此正以挽外熱歸裏而約水山茱萸花於仲春實於初夏必屆冬乃成味酸性平是能挽金水以涵木回下降以為升之物也乃主心下邪氣寒熱逐寒溼痹是取其收中有發發中有收矣而更治頭風風氣去來鼻塞目黃耳聾面皰而遺溺是其一竅過通而諸竅皆閉通其諸竅即所以治一竅之過通桑螵蛸深秋生子仲夏成形是隨陰之斂謐而藏隨陽之昌熾而出矣本經以通五淋利小便水道列於傷中疝瘕陰痿血閉之下是欲其化陰之斂謐而從陽以出別録以止失精遺溺列於男子虛損五藏氣微之下是欲其化陽之昌熾而從陰以藏三者雖同工而異調而中實有理焉如此溺血戎鹽寒心腹痛溺血蒲黃平利小便止血消瘀血龍骨平微寒主溺血鹿茸溫微溫主溺血乾地黃寒主溺血利大小腸蜀本蔥涕平主溺血證類牛膝平逐惡血留結藥性論車前子寒葉主血瘕下血小便赤止煩下氣柏子并葉平溫世之引經義言溺血者莫不以氣厥論胞移熱於膀胱為據特既曰癃溺血則屬血淋非但溺血也血淋必溺澀溺血必溺自如巢氏曰心主血血之行身通偏經絡循環腑臟勞甚則散失其常經溢滲入胞而成血淋是熱淋之甚者推其源雖溺血之所由原不外是別其類實通塞之殊致矣然則痿論所謂悲哀太過則胞絡絶胞絡絶則陽氣內動發則心下崩數溲血者可為經義之準歟是固衇痿之源卻亦溺血之鵠矣然因勞悴而生火與因七情而動陽其所從來縱有久暫之殊而以陽搏陰實無彼此況胞衇者屬心而絡於胞中證既不能離胞情又不能離熱遂謂其竟相懸絶可乎夫解結釋縛必摘其綱別嫌明微須窮其目事固有本協黍銖末殊尋丈者此血淋溺血證必不可不別而治原無不可相同況溺血已久續以急澀急澀先愈旋復溺血者甚多耶在此歸之理固不必以此而費辭但欲明病之所由然則終不得不詳乎此耳蓋血與水本同源而有凝釋之殊其不遍經絡而自甘與水為伍隨其流行坎止者不特化源有愆常度必擁衛之土氣受盛之木氣均有不循其職焉何但陰陽薄蝕水火迫蕩已哉是故從水以凝之從土以浥之從陰以除其熱迫從陽以填其漏巵而土浥之中復分從火中使之收攝從水中使之和諧兩途其所以如此者緣靈素於此既言之未詳後世復無有推明之者千金外臺雖列多方然亦不述其源惟孫氏於第一方提明房勞傷中尿血夫房勞而致傷中必亦祇係胞衇之不咸彼之悲哀動中者能使胞衇閉而月事不來則此之胞衇開而血常自下者自必因恣樂之過極不參核至是恐不特不能了此篇之旨即千金外臺諸方亦未能取之左右逢源矣溺血云乎哉消渴白石英微溫主消渴陰痿不足石膏微寒大寒止消渴煩逆口乾舌焦不能息茯神平風眩風虛五勞口乾麥虋冬平大寒虛勞客熱口乾燥渴黃連寒微寒止消渴知母寒主消渴熱中除邪氣栝蔞根寒主消渴身熱脣乾口燥短氣茅根寒止渴枸杞根大寒熱中消渴小麥微寒止燥渴咽乾利小便䈽竹葉大寒根作湯益氣止渴補虛下氣土瓜根寒主消渴內痹葛根平主消渴身大熱起陰氣李根大寒主消渴止心煩逆奔氣蘆根寒主消渴客熱止小便利菰根大寒主腸胃痼熱消渴止小便利冬瓜微寒止渴馬乳冷止渴牛乳微寒補虛羸止渴羊乳溫潤心肺止消渴藥性論桑根白皮寒熱渴水腫藥對茯苓平主口乾君理石寒主口乾消熱毒君解煩毒止消渴兔絲子平主口乾消渴口苦燥渴牛膽大寒主渴利中焦熱君口焦燥苧汁寒止渴使漬苧汁療渴古屋瓦苔寒主消渴兔骨平治熱中消渴臣豬苓平主渴利使或謂石藥肥甘酒鹽四者皆致消渴隋唐以來巢氏孫氏王氏言之極詳然咸謂其性熱助火已耳其能治致水所難制之火則未及也況釋名云消渴係腎氣不周於胸中腎氣不周於胸中豈特火之所為耶豫謂四十九難曰腎主五液以布五臟在肝為泣在心為汗在脾為涎在肺為涕自在為唾則胸中津潤所以溉喉舌而滋呼吸者獨非腎之所布乎寶命全形論曰鹽之味鹹者以其氣令器津泄夫鹽得水可化得火復成此其令消渴在乎合水則行而不留遇火則結而不散矣營衛生會篇曰酒者熟穀之液其氣悍以清故能後穀而入先穀而液出此其令消渴在乎氣係於上而不去質傾於下而不停矣何況石藥者入水不濡入火則赤肥甘者遇水便浮著火能燃此其蟠踞於人身但應火而不應水且使臟腑不浥不沾又何論夫周是其涸竭之患豈但胸中蓋將遍有焚如之害固非特火之所為也諸家之論雖詳大率巢氏之消渴渴利內消三者最為明爽曰消渴者渴而小便不多也渴利者隨飲即溲也內消者不渴而小便多也今以是篇核之渴飲而小便不多非有所出即有所停寒而燥者以治泄於下寒而達者以治泄於外散而清者以治停於上寬而利者以治停於下者也隨飲即溲者非四旁不沾即直道無節故凡通內痹行衇絡皆以使其沾厚土氣助薰蒸皆以使其節至不渴而小便過利自有小便利篇可按然篇中往往列止小便利之物不在小便利篇者豈不可彼此參伍求所以分所以合耶若夫不渴不利善食易消古人謂之食與消渴無涉也素問氣厥論心移熱於肺肺消心移熱於肺膈消熱能為消是固然矣寒亦可為消乎此可證之金匱要略者也假使寒不能消何得治之以八味腎氣丸耶曰寸口衇浮而遲浮即為虛遲即為勞虛則衛氣不足勞則營氣竭由是觀之非寒則衇何以遲夫心本不任受寒心所謂寒蓋在所主之血衇中其移肺亦由榮泛及衛耳且非外中之寒亦非卒受之寒乃陽氣之不營於外而直升直降於內者也營衛既失其樞資稟遂不合度故內而陽氣熾盛常藉水以自救外而營衛無所汲引則其水直溜而下且曳一身津液竝而泄焉故曰肺消者飲一溲二死不治此即前所謂不沾者其於病源實兼渴利內消者也曰趺陽衇浮而數浮即為氣數則消穀而大堅氣盛則溲數溲數則堅由是觀之數熱徵也夫膈以隔蔽清濁而非匿寒藏熱之所心肺以熱相移清道陽氣熾盛遂不變化取汁為赤以分布灑陳而一歸於三焦膀胱焉故曰堅數相搏即為消渴此即前所謂不留其於病源則所謂渴利者也統而計之陽宗於心陰根於腎心所以移寒移熱皆由腎陰不上交於陽而肺遂失其節宣裒益以底於平是則責之所攸歸耳八味腎氣丸攝土中水氣以濬陰之源地黃拔土氣最力薯蕷入土中最深而喜攀磚附石山茱萸於季春結實至初冬乃成亦吸土氣以濟水者動水中火氣以振陽之本附子桂枝而使天一之水由下以及上澤藛由上以歸下茯苓浮游之火鬱結之血藉此遂周流而不滯焉牡丹得非能降火升水使兩相濟而稱物平施者耶有是以通本篇之不逮即由本篇以通仲景之所及如治消渴之用五苓散豬苓湯白虎加人參湯白頭翁湯其中石膏知母黃連豬苓茯苓固皆列於是矣肺消膈消獨不可由彼而更求於此篇哉然則食㑊亦可以是篇之義通之乎此則不可郊特牲曰食養陰飲養陽臟陰也腑陽也氣厥篇論消渴之源在五臟食㑊之源在六腑五臟之不咸則無以制通而病反在陽故本篇之藥多主氣而輕清六府之不調則無以制臟而病反在陰故聖濟總録食㑊諸方多主味而沉著惟其流異是以不可通非特此也凡因消渴而致之水氣治法遂絶不同惟其源同是以可通凡不與消渴類之強中治法乃殊不異即此可明其指矣黃疸茵蔯蒿平微寒風溼寒熱邪氣熱結黃疸通身發黃小便不利梔子寒大寒通小便解五種黃病藥性論紫草寒主心腹邪氣五疸白鮮皮寒主黃疸生鼠微溫大黃寒大寒豬屎寒主寒熱黃疸溼痹瓜蒂寒療黃疸栝蔞寒除腸胃中痼熱八疸身面黃秦艽平差五種黃病唐本黃芩大寒主諸熱黃疸證類牡鼠微寒小茈葫湯小半夏湯小建中湯瓜蒂散五苓散桂枝加黃芪湯豬膏髮煎皆治他證為本黃疸為標他證愈黃自不能不愈也大黃消石湯梔子大黃湯消石礬石散梔子檗皮湯麻黃連軺赤小豆湯則黃疸為本矣而標病猶盛不能竟捨標從本故宜有輔佐以擊動其標其本乃能釋也惟茵蔯蒿湯乃為黃疸正劑知茵蔯蒿湯為黃疸正劑則身黃如橘子色小便不利腹微滿為黃疸主候發熱不惡寒但頭汗出餘無汗齊頸而還渴飲水漿小便不利為黃疸正因矣發熱不惡寒反惡熱是為陽明病而承氣證為陽明病之正出茵蔯蒿證則陽明病之對出以一有汗一無汗一小便過利一小便不利汗出多小便利所以成乎燥汗不出小便不利則本燥末溼所以祇對化耳不然凡衇遲食難用飽飽則微煩頭眩小便難縱下之腹滿如故必其中先硬後溏非特不能全成燥證且駸駸乎將全成溼證者何以亦用茵蔯蒿湯耶此全從傷寒外邪立論者若更參以金匱雜證則不必有外邪但係本燥末溼者均得成黃故夫酒者氣燥而質溼受其傷則心中懊憹而熱不能食時欲吐遂為酒疸房勞甚者陰已泄陽不得越遂與已化未成之陰精糾結怫鬱於中欲出不得雖微汗出小便自利而不免薄暮手足中熱膀胱急而為女勞疸更益之黃汗所謂五疸具矣篇中義旨亦明明推茵蔯蒿湯為督率核以傷寒金匱所隸治黃諸方無非由此而因候加味合成成方如因懊憹則合入梔子豉小承氣而為梔子大黃湯因小便不利則合入五苓而為茵蔯五苓散因表利裏實則合入調胃承氣而為大黃消石湯是也獨調胃承氣湯用水消此用火消更核消石礬石散亦用火消似其中必有故者蓋火消是曳陰向陽乃攜溼以就燥而散水消是化陰濟陽乃剖燥以凝溼而行於此即可以悟陽明病之正出對出矣至於篇中白蘚秦艽栝蔞根黃芩仲景雖未嘗用治黃而葛氏肘後孫氏千金王氏外臺諸方多用之揣其意旨亦非貿貿然徒用之而已也蓋於此有以窺黃證之微焉夫黃根於溼熱客於脾胃固不待言矣然非必上罩下承面面周匝密圍也定有一端滲泄處焉惟滲泄不敵其摶聚是以蒸鬱而成耳不然則所謂陽明中風衇弦浮大而短氣腹都滿脅下及心痛久按之氣不通鼻乾不得汗嗜臥一身及面目悉黃小便難有潮熱時時噦耳前後腫刺之小差外不解之候何以見不尿腹滿加噦者遂為不治耶一端滲泄者何如栝蔞根之主小便利是其黃必仍小便通矣黃芩主諸熱黃疸腸澼泄利是其黃必大便泄矣白蘚主頭風黃疸是其黃必頭面多汗惡風矣秦艽主寒溼風痹是其黃必骨骱煩疼矣倘不依證尋治馴致病氣連橫不至水氣脹滿不已故曰疸而渴者其疸難治疸而不渴者其疸可治蓋疸病至渴則溼已盡從熱化薰尉元氣元氣不支求助於水駐見水日增而火日熾如潑膏以救燎愈益其不能息耳況其病不愈則劇自有定期不容遷延耽緩所謂當以十八日為期治之十日以上瘥反劇者為難治耶十八日者四季土旺用事日數也土之所用僅能及此過是以往力遂不勝則將轉移他處而木金水火皆非藏受溼熱之所無力推傳則土困頓而崩頽矣曷若及早驗其所向因勢以利導之耶是故頭面汗多是風舉溼於上則令其沉於下俾其氣徹底而隨之化焉白蘚根藏羶氣羶氣者木氣也骨骱煩疼是風拒溼於外則令其連於內俾其氣疏通而為之化焉秦艽羅紋密織盡從左旋是化風歸水自上下下之治也小便自利者其病不在溼而在熱則滋化土中之熱使與溼離而自已栝蔞根澄之則散而成粉味苦氣寒能使土中溼熱離散大便泄利者其熱有所歸緣溼滯之而不爽則清化腸中之溼使隨熱泄而病除黃芩形如腐腸治因熱生溼故能清利腸中溼熱經方用藥總在定六氣以見病原隨形色性味以為治則非後世漫云以寒治熱以利泄溼籠統不切於病機病情毫無關照者比也黃汗一證自巢氏隸之黃病門後世遂視為黃病支流據金匱則證鄰於歷節目列於水氣蓋黃病與黃汗本異而末亦不同黃汗與歷節乃異派而同源也何以言之夫黃病之甚動云有麴塵然未聞有能染衣至黃者黃汗則汗本不黃至沾衣乃如檗汁以黃病屬脾家脾為土土之生物不倚他助黃汗屬心家心為火火之燔燎必著他物是其一病於肌肉一病於血衇為殊絶也至其所由然則與歷節竝因汗出入水中如水傷心故黃汗衇自沉歷節衇沉弱黃汗汗黃歷節亦汗黃黃汗發熱歷節亦發熱第歷節支節疼或疼痛如掣黃汗則僅重而痠歷節身體羸瘦獨足腫大黃汗則身體洪腫四肢面目皆腫而胸中窒不能食反聚痛口多涎暮躁不得眠乃歷節所絶無是同為水傷心而有甚有不甚甚即所謂小便通利上焦有寒者也統三者計之皆為溼不得泄然惟黃病為尤甚黃病分歧於肌肉歷節分歧於骨節固不待言矣乃黃汗既有汗而小便又利獨為最有去路反至化溼成水何也夫水氣亦何嘗不從溼化然惟火能為之宣導則無此弊黃汗者因雖從外及內病實從內外出是火之不宣已明著矣況祇有身黃之水氣竝無黃汗而身黃水氣而身黃者內本能宣由外鬱遏不得開故越婢湯中用麻黃黃汗本自有汗且小便利則外本無所阻而內之宣導不力故桂枝加黃芪湯芪芍桂酒湯竝賴有桂枝矣由是言之隸於黃病嫌於未似相同也而殊不同隸於歷節嫌於本相同也而末卻大異何如就證論證隸之水氣之為愈哉上氣咳嗽麻黃溫微溫止咳逆上氣杏仁溫咳逆上氣雷鳴喉痹白前微溫胸脅逆氣咳嗽上氣橘皮溫主胸中瘕熱逆氣下氣止嘔咳紫菀溫主咳逆上氣胸中寒熱結氣桂心大熱主咳嗽款冬花溫主咳逆上氣善喘喉痹五味子溫主益氣咳逆上氣細辛溫主咳逆溫中下氣破痰利水道開胸中蜀椒溫大熱邪氣咳逆溫中半夏平生微寒熟溫喉咽腫痛咳逆腸鳴生薑微溫傷寒頭痛鼻塞咳逆上氣止嘔吐桃仁平止咳逆上氣消心下堅紫蘇子溫下氣寒中射干平微溫咳逆上氣喉痹咽腫不得消息散結氣芫花溫微溫咳逆上氣喉鳴喘咽腫短氣百部根微溫主咳嗽上氣乾薑溫大熱胸滿咳逆上氣溫中𦮷母平微溫咳逆上氣止煩熱渴出汗皂莢溫除咳嗽蜀本蛤蚧平療咳嗽縮沙蜜溫下氣藥對鍾乳溫主上氣臣主咳逆上氣獺肝平主氣嗽使止久嗽烏頭大熱主嗽逆上氣使主咳逆上氣消胸中痰冷藜盧微寒主嗽逆使咳逆泄利鯉魚平燒末主咳嗽臣肉主咳嗽上氣黃疸止渴淡竹葉大寒主嗽逆氣上臣海蛤平上氣臣主咳嗽上氣喘息煩滿硫黃大熱主氣嗽臣咳嗽上氣腳弱冷疼無力上氣者不必咳嗽咳嗽者不盡上氣論咳嗽者何不但標咳嗽則所謂暴嗽久嗽冷嗽熱嗽呷嗽五臟咳嗽者咸可隸於其中耶夫諸嗽者咳嗽之支分上氣咳嗽者肺痿肺癰肺脹支飲風水與致嗽之竝界也既云咳嗽則諸嗽原隸於中不因兼標上氣而有礙已標上氣則肺痿肺癰肺脹支飲風水之稍涉疑似學者遂不得不細心體究以分析之耳不然金匱要略部分諸病最為嚴密既有肺痿肺癰咳嗽上氣篇矣乃疊出痰飲咳嗽篇耶然則奈何細心體究分析之夫風舍於肺其人即咳是咳嗽主腦也咳唾膿血衇數虛者為肺痿數實者為肺癰上氣喘而躁者為肺脹咳逆倚息不得臥者為支飲頸衇動時時咳目窠下微腫按其手足上陷而不起者為風水是咳嗽之條目也核篇中列藥三十味試舉治肺痿之甘草乾薑湯炙甘草湯千金桂枝去芍藥加皂莢湯治肺癰之桔梗白散葦莖湯治肺脹之越婢加半夏湯小青龍加石膏湯治支飲之木防己湯小半夏湯十棗湯小青龍湯桂苓五味甘草湯及諸加味治風水之越婢湯咸藉本篇之味以成方者卻逾篇中三分之一即專主咳嗽上氣縱如皂莢丸射干麻黃湯厚朴麻黃湯澤漆湯幾全賴此成方者亦不過得篇中之半則諸證之與咳嗽原經界相連犬牙相錯曾謂可舍此綱領而徒別其支派耶試再核之千金如百部根湯之治嗽不得臥兩眼突出蜀椒圓之治上氣咳嗽杏仁飲子之治暴熱嗽橘皮蘇子煎之治上氣咳嗽款冬圓又方之治三十年上氣咳嗽唾膿喘息不得臥鍾乳烏頭則咳嗽之支流竟矣更參之外臺如深師麻黃湯之治卒嗽延年𦮷母煎之主暴熱咳深師乾薑湯之療冷逆咳深師立愈丸款冬花丸古今録驗麻黃湯之治久咳則咳嗽之派別明矣更參之聖濟如紫菀丸之治肺咳丹沙半夏丸之治心咳木乳散之治肝咳半夏陳皮湯之治脾咳四味散之治腎咳鹿角膠湯之治大腸咳人參散之治膀胱咳檳榔丸皂莢丸之治三焦咳亦莫不有篇中之物錯雜其用則咳嗽之所從駐又瞭然矣不應合而合之足以見病源之不異應合而不別足以見病變之非歧明乎此篇則咳嗽之主治已彰參乎經方斯咳嗽之分殊有在而後咳嗽之為咳嗽遂無遁情也然則咳論之義遂可置之勿講歟是又烏可夫肺痿肺癰支飲即咳論所謂多涕唾也肺脹風水即咳論所謂面浮腫氣逆也斯二者皆聚於胃關於肺而本於五臟之邪以傳六腑其該甚博其變甚煩不僅肺痿肺癰肺脹支飲風水已也就其初傷在氣久乃涉血筋骸之牽引身體之疼痛甚者為嘔逆吐蛔為遺矢遺溺是其再變而為膈噎胃反為下利洞泄為霍亂轉筋不難矣特他病則自陽入陰而此獨以臟傳腑所宜體究焉蓋論中所謂臟病皆經病腑病則入內矣所以然者論中固言之曰皮毛者肺之合皮毛先受邪氣邪氣隨從其合此病從外受者也其寒飲食入胃從肺衇上至於肺則肺寒肺寒則外內合邪此病從內受者也兩皆歸竝於肺故為肺咳非特此耳其心值夏脾值長夏腎值冬肝值春受邪而肺家適有內受之寒如向所云者當其邪乘衇絡以朝肺因之外內合邪亦能為咳則心咳脾咳腎咳肝咳作矣故病必關肺病因不必關肺病因必由寒病不盡寒不然咳之淺者惟肺與心宜乎病入未深變化未定寒氣應仍在者而胡為乎反見唾血及咽腫喉痹諸不盡屬寒之證耶至臟咳不已反移於腑者以臟主藏而不瀉其守堅腑主瀉而不藏其罅疏病在經絡久而不愈勢必內入內入之始未有不從疏而從堅者故久咳不已至移於三焦則腹滿不欲食飲遂將移於臟矣不然咳久而成癆瘵者亦豈在經在腑之病哉此篇雖無治臟腑諸咳明文然有可以意會而得其旨者如降氣者皆治上之劑也守中者皆治中之劑也攝氣者皆治下之劑也散結者皆治心肺之物也聚飲者皆治肝腎之物也通利者皆治小腸膀胱之物也醒豁者皆治胃與大腸之物也即是以推能謂其與經旨絶不相涉耶嘔吐厚朴溫大溫胸中嘔不止橘皮溫下氣止嘔咳人參微寒微溫半夏平生微寒熟溫時氣嘔逆麥冬平微寒止嘔吐白芷溫療風邪久渴吐嘔兩脅滿生薑微溫止嘔吐鉛丹微寒主吐逆反胃雞子微寒鍊之主嘔逆藥性論薤白溫甘竹葉大寒除嘔吐蜀本旋覆花溫開胃止嘔逆不下食藥性論白豆蔻大溫主積冷氣止吐逆反胃藥對附子大熱主嘔逆使竹筎微寒主乾嘔臣同為水穀逆出也吐可植躬嘔須曲脊釋名嘔傴也將有所吐脊曲傴也吐猶器滿而溢毋庸勉強嘔已沸騰於中出反不易故吐如棄物可隨手拋擲一切經音義引倉頡篇吐棄也嘔遭迫脅必聲揚物先山海經東山經膏水其中多薄魚其音如嘔注如嘔如人嘔吐聲也則吐為陰嘔為陽吐有寒嘔有熱吐屬虛嘔屬實矣然吐非無實熱證但係有因決非自作如服桂枝湯而吐其後必吐膿血等證嘔亦有虛寒證則能自致不關誤治矣如嘔而衇弱嘔而胸滿等證故曰病人衇數不消穀引食而反吐者胃中虛冷故也衇數且然何況不數曰傷寒發熱嘔不能食而反汗出濈濈然者是轉屬陽明也有汗如此何況無汗蓋陽之出多奮迅其所以奮迅則以陰格之也陰之出多慘栗其所以慘栗則以陽先潰也故凡嘔而利者無一虛證十棗湯證大茈胡湯證既吐且下者無一實證四逆湯證吳茱萸湯證餘如傷寒三陽證則多嘔而少吐胃反證則言吐而不言嘔循是以尋其緒餘本篇所載之物不湛然可明哉特篇中藥物寥寥且大段治嘔似於兩證偏有側重殊不知嘔吐原有竝見者如黃連湯證小半夏加茯苓湯證小半夏湯證豬苓散證大半夏湯證是也今篇中兩證竝提者本有四味提吐不及嘔者亦有兩味全篇僅臚藥一十五味則其多寡之間雖似有偏重然於本書中核以霍亂篇治吐下之物於本書外參以治胃反之物則較於嘔翻有若稍羸者惟篇中偏以大溫之附子主嘔逆則其理所當究耳夫此乃在下陰霾陵逼中陽而中陽卼臲震蕩之候也是其證在仲景書曰嘔而衇弱小便復利身有微熱見厥者難治四逆湯主之曰腹中寒氣雷鳴切痛胸脅逆滿嘔吐者附子梗米湯主之此與既吐且利之候正同第彼既下有漏泄則中陽敗散祇能滂沱四漬是證下無漏泄則中陽但上不下猶能衝激作聲用附子者正以散其上逼之陰霾回其離窟之生陽也然四逆湯證與附子粳米湯證又復不同一則在下亦有聲是陽猶能與陰為梗故須佐以調和為一成不敗之計一則小便復利是陰陽不相堵禦故更助以溫守而陽之回不回陰之定不定尚在不可知之天曰難治者以此而其用附子之意則一耳由是言之應用附子之嘔是嘔之敗局用附子治嘔是治之急著遇非常之證自不得以常法禦之固難與凡嘔凡治竝論者也嘔吐噦自金匱要略以下皆連綴一處惟茲則剖隸兩篇曰嘔啘曰嘔吐不知者必以為妄分畛域孰知均胃病也而有脾不濟胃胃不從脾之別焉巢氏曰新穀未及傳化故穀之氣與相干犯胃氣則逆胃逆則脾脹氣逆遇冷折之則噦風邪在胃則嘔膈間有停飲胃內有久寒則嘔而吐是噦由氣嘔吐由質氣者應恃脾之磨而消質者應恃胃之輸而化氣不消是脾不濟胃也質不化是胃不從脾也不然何以噦僅有聲而嘔吐兼有物耶試以兩篇所列之藥較之相同者五厚朴橘皮人參附子竹茹嘔啘餘十五味而九物之用在氣香薷雞舌香小蒜高良薑桂麝肉豆蔻丁香朮皆用其氣嘔吐餘十味而七物之用在味半夏麥冬生薑鉛丹雞子甘竹葉旋覆花等皆用其味若然則合之者以其相類分之者以其相差循軌以導其行溯流以求其本務欲後人識顛末知嚮方則一也乾嘔與停飲而吐恰相反對蓋乾嘔有火卻係虛火停飲有水全非實水故服白通湯後厥逆無衇乾嘔煩者白通加豬膽汁人尿湯通衇四逆湯證乾嘔者加生薑乾嘔吐涎沫頭痛者吳茱萸湯乾嘔吐逆吐涎沫半夏乾薑散乾嘔噦手足厥者橘皮湯中風六七日不解而煩有表裏證渴欲飲水水入則吐者五苓散咳而嘔渴心煩不得眠者豬苓湯胃反吐而渴欲飲水者茯苓澤藛湯吐後渴欲得水者文蛤湯卒嘔吐心下痞膈間有水氣悸眩者小半夏加茯苓湯嘔吐穀不得下者小半夏湯嘔吐病在膈上後思水者豬苓散胃反嘔吐者大半夏湯夫火不能卻陰而反被陰迫逐氣不能化水而反任水停瀦是陰陽之悖亂水火之相射矣則不得以治嘔常法治之故破其陰即以助其陽降其火即以和其陰化其水即以調其氣降其氣即以逐其水迥與篇中之義不相符矣雖然篇中亦何嘗不計及此凡橘皮生薑附子者果何為列哉即水氣一面篇中亦未嘗不思行水下氣第吐本因水自不應濫列多品占水飲地步故將旋覆花半夏二味微逗端倪使人觸類引伸推尋有法庶無越畔之嫌仍得兼濟之益耳識得虛者為真實者是僞則嘔吐之為嘔吐全局大抵屬虛間有大黃甘草湯十棗湯大茈胡湯數證自是絶無僅有故曰傷寒嘔多雖有陽明證不可攻吁可畏哉痰飲大黃寒大寒除痰實腸間結熱心腹脹滿甘遂寒大寒主留飲宿食芒消大寒腹中痰實結搏茯苓平膈中痰水茈胡平微寒除諸痰熱結實芫花溫微溫消胸中痰水喜唾前胡微寒療痰滿胸脅中痞朮溫消痰水細辛溫溫中下氣破痰旋覆花溫消胸上痰結吐如膠漆心脅痰水厚朴溫大溫消痰下氣人參微寒微溫枳實寒微寒主胸脅痰癖橘皮溫半夏平生微寒熟溫消心腹脅膈痰熱滿結生薑微溫甘竹葉大寒蕘花寒微寒療痰飲咳嗽蜀本威靈仙溫主心膈痰水藥對射干微溫主胸中結氣使烏頭大熱主心下寒冷不下食使吳茱萸大熱主痰熱腹內諸冷臣朴消大寒主痰滿停結君巴豆溫主痰飲留結利水穀破腸中冷破留飲痰癖證類高良薑大溫尤潛溪曰穀入而胃不能散其精則凝為痰水入而脾不能輸其氣則蓄為飲蓋惟其以穀化故質稠惟其以水化故質稀質稠故能藏寒匿熱而至當用烏頭吳茱萸高良薑蕘花甘竹葉能蘊實釀虛而至當用大黃芒消朴消巴豆厚朴枳實人參朮茯苓質稀故能內沉外溢而為裏堅表腫能徹上徹下而為眩冒滄泄又惟其穀入於陰而以質用故痰每流於隱僻而注於窪下水入於陽而以氣用故飲能歸於四肢偏於身體此四飲分支惟痰飲可獨當一面而三飲者祇可竝之而相對待矣雖然痰與飲相殊稱謂自應有別測其所當別則似飲可稱水痰不得稱水者而曰水走腸間瀝瀝有聲謂之痰飲可乎夫穀非由水調不堪食水非由穀出不成痰是其根本原未始非水以水呼之又何不可特既化入穀中還從穀中化出則其搏引稠黏合為同類自與未曾經化者殊且既有素盛今瘦句冠於其端益可知為久病而非暴病夫暴病何嘗不有痰飲第觀篇中所列茈胡前胡細辛生薑威靈仙射干等物又豈久病而成者所可用耶蓋惟其暴病則水為火逼而成久病則陰隨陽溜而成仲景所謂當以溫藥和之者久病之治也篇中所羅性峻刻而注有痰字者則暴病之治矣然則篇目雙標痰飲篇中所列備悉搜釆本經別録主治但稱飲者止一味痰水痰飲竝稱者僅七味但稱痰者至十味不云水飲及痰者七味則偏重於痰極矣此又何為者耶夫飲變見之證極多比連之證亦極多凡嘔吐咳嗽上氣大腹水腫皆是也痰則僅在是篇若使與諸證諸治相乘除恐反不及飲之多矣寧反謂為少耶仲景於飲與水分之極嚴呼之甚亂如痰飲篇大半稱飲為水是也飲固可呼之為水耶夫飲本水也特有受約束不受約束之分耳受約束者縱能變化不離畛域不受約束者橫流直衝過隙即就故痰飲篇曰水在某水氣篇曰某水明明一指為注於何臟之水一指為何臟所發之水矣雖然兩篇之旨猶當更有推明者焉曰水在心心下堅築短氣惡水不欲飲水在肺吐涎沫欲飲水水在脾少氣身重水在肝脅下支滿嚏而痛水在腎心下悸曰心水者其身重而少氣不得臥煩而躁其人陰腫肝水者其腹大不能自轉側脅下腹痛時時津液微生小便續通肺水者其身腫小便數時時鴨溏脾水者其腹大四支苦重津液不生但苦少氣小便難腎水者其腹大臍腫腰痛不得溺陰下溼如牛鼻上汗其足冷面反瘦合而觀之欲飲不欲飲嚏悸少氣病皆係於上陰溼陰腫小便難病皆係於下其諸阻於上者謂之飲阻於下者謂之水歟夫上是水之來源下是水之去路來源雖阻去路猶通於何能不受約束濫及他處若來源通而去路塞則時有所益日有所增水從何往而欲其不衝溢他處依規就範得乎是以治水之物通多而化少治飲之物通少而化多檢核篇中惟芫花甘遂蕘花巴豆朮與大腹水腫篇同用其餘則各有所當矣水聚於上而論其欲飲不欲飲水聚於下而論其津液生不生似甚難解然不知阻於上者欲其化阻於下者欲其通既化既通則清光來而滓穢去夫固曰津液微生小便續通矣是故篇中所具行經絡解客感皆引清光之物也下留結濬壅淤皆去滓穢之物也內經未嘗言及痰飲金匱要略則詳論之矣然及飲多而及痰少千金外臺則已痰飲參半沿至後世乃飲日少而痰日多何哉此又世道升降之會也蓋維元古飲與食庖治無不精詳飲湯飲水各按其時則入陽而資氣化荼寥稻黍各佐其肉則入陰而養元精傳曰肉雖多不使勝食氣肉中既有食氣勝之矣於何能入陰而成痰經曰漿人掌其六飲水漿醴涼醫馳水中既有冷熱節之矣於何能入陽而成飲中古制御多失其方是以痰飲竝興然緣烹茶之度甚精則既能導飲不留復能運食不滯及夫近世茶惟點啜則未得其氣之全肉務煎煿則反增其味之厚於是水入成飲肉入生痰駸駸乎無病不以是棘其治矣況更爇淡巴菰之葉常吸其煙豈知此實劫飲化痰之妙劑哉歷考經方竝無引飲令吐之法有之自金元四家始子和在前專工劫掠景嶽繼述稍務平和然實為今日吸煙作俑倘無神聖闡別痰飲界域於前勢必將遇痰即逐試觀今人之痰果堪逐否耶篇中雖未嘗不用逐而妙在解痰之為窟容邪去痰之連衡瘀滯痰隨氣結開氣即以行痰痰與熱壅化痰即以清熱釋寒之縛痰脫火之膠痰補其虛而痰自退舍聽命攻其實而痰自隨跡消除化痰之法盡矣學者更能擴充於此而權衡其輕重焉益可不治痰而痰自無不順矣宿食大黃寒大寒破留飲宿食蕩滌腸胃推陳致新巴豆溫生溫熟寒開通閉塞利水穀道朴消寒大寒胃中食飲熱結茈胡平微寒去腸胃中結氣飲食積聚朮溫消食桔梗微溫溫中消穀厚朴溫大溫宿食不消藥性論皂莢溫療腹脹滿消穀麴溫消穀止利糵溫檳榔溫主消穀逐水除痰宿食不徒停也蓋必有所挾焉外臺祕要方目所載有傷寒宿食不消方有留飲宿食方有因食飲水上氣方有食不消成癥積方有積聚宿食寒熱方有食癥及魚肉成癥方有冷利食不消方有下利清穀方有下利食完出方大率體氣實者食因病而用病據食為橐體氣虛者食遺病以泄病因食遂殆所以仲景書舍攻下溫補無別法獨於差後勞復出一枳實梔子豉湯而曰有宿食者加大黃遂可見其因病治病即於中挾入利導之治不別立間架畛域竟指為一病也而今者特建標題為病綱領何哉推其微義蓋亦以經方值此大抵用攻第因病而致食留不去病而食可行乎故首列三品原係經方正治無從遺漏此外則因邪而結者疏其邪因氣而滯者調其氣因肥膩而膠黏者即為消其脂膏因痰水而勾留者即為行其瀦蓄甚至折其生氣而使難消者消發其生氣而使難化者化同麴與糵者蓋亦神乎治矣於此見本書特立是篇正為別樹一義羽翼仲景救後人遇食即攻之失乎腹脹滿麝香溫中惡心腹暴痛脹急痞滿甘草平煩滿短氣人參微寒微溫胸脅逆滿朮溫除心下急滿乾薑溫大熱霍亂脹滿百合平邪氣腹脹心痛浮腫臚脹痞滿寒熱厚朴溫大溫腹痛脹滿痷閭子微寒微溫腹中水氣臚脹留熱枳實寒微寒消脹滿心下結痞痛逆氣桑根白皮寒水腫腹滿臚脹利小便皂莢溫療腹脹滿消穀大豆黃卷平五藏胃氣結積唐本卷柏溫蜀本蓽澄茄溫主心腹間氣脹令人能食藥對忍冬溫主腹滿君主寒熱身腫射干微溫主脅下滿急使散結氣腹中邪氣香葇微溫主腹滿水腫臣旋覆花溫主脅下寒熱下水臣主結氣脅下滿證類訶梨勒主冷氣心腹脹滿下食草豆蔻直溢曰滿橫充曰脹皆氣有所向而不遂也脹與弛對左成十年脹陷而卒作張則知其欲寬緩而不能矣滿與減對則知其欲降泄而不能矣夫氣之濁者不降則清者不升行者不舒則駐者自急故滿多實而脹多虛在仲景書則脹滿而按之痛者為實不痛者為虛脹滿而時能減者為寒不能減者為熱厚朴生薑甘草半夏人薑湯大建中湯附子粳米湯虛而寒者之治也大承氣湯大茈胡湯厚朴七物湯厚朴三物湯實而熱者之治也本篇意義大旨似異根柢究同觀其言痛者寥寥而別著心腹冷痛二十九篇是其注意不全在實氣寒氣平者與氣溫者參半是其設法不全在寒如其用百合庵閭桑皮黃卷忍冬香葇旋覆治邪而非偏寒偏熱之邪用麝香皂莢蓽澄茄射干訶梨勒草豆蔻行氣而非偏實偏虛之氣獨理中湯全方端然首列則知其病本屬虛而夾輔以枳實之泄滿厚朴之除脹於是唐人之枳實理中厚朴理中都可識經方與是篇恰合之故且行水除痰燠寒清熱備又可見脹滿之因不一而足矣心腹冷痛當歸溫大溫溫中止痛人參微寒微溫療腸胃中冷心腹鼓痛芍藥平微寒疝瘕止痛中惡腹痛桔梗微溫胸脅痛如刀刺乾薑溫大熱寒冷腹痛桂心大熱腹內冷氣痛不可忍蜀椒溫大熱除六府寒冷附子溫大熱心腹冷痛吳茱萸溫大熱去痰冷腹內絞痛烏頭溫大熱心腹冷疾臍間痛朮溫止嘔逆腹內冷痛藥性論甘草平腹中冷痛藥性論礜石大熱生溫熟熱破積聚痼冷腹痛蜀本膃肭臍大熱心腹痛肉豆蔻溫積冷心腹脹痛零陵香平心腹痛滿下氣紅豆蔻溫心腹攪痛胡椒大溫除藏府中風冷藥對芎藭溫臣諸寒冷氣心腹堅痛黃芩大寒臣胃中熱小腹絞痛戎鹽寒臣心腹痛厚朴溫臣腹痛脹滿萆薢平臣證類蒜溫主霍亂腹中不安高良薑大溫霍亂腹痛蜂子平微寒心腹痛蓬莪朮心腹痛心腹冷痛次於宿食腹脹滿之下以金匱要略原屬一篇也第其目增一心字則似連胸痹之痛者亦在其中中間一冷字則似無與於熱然胸痹之治如栝蔞薤白白酒湯栝蔞薤白半夏湯桂枝生薑枳實湯凡言痛者皆不於此中取材而不言痛之人參湯反全數在焉若云無與於熱則黃芩固已列篇中又何以為解矣殊不知治法固有用熱無犯寒用寒無犯熱者亦有用熱不遠寒用寒不遠熱者別録載黃芩之用曰胃中熱小腹絞痛則焉知非胃中之熱不下濟反隔礙腸中之寒致無以泄而痛者即如脅下偏痛發熱衇緊弦明明已指為寒謂宜溫藥下之附子細辛已隸方中矣其復用大黃何耶惟其有寒故以熱藥為君惟其寒為熱激而痛則以寒藥為臣藥對於黃芩大寒之下原未嘗不注臣字又何不可用之歟以此觀之凡心腹間以冷而痛者其用藥大旨不出此篇之中胸痹不盡屬寒其屬寒者固宜以此篇之藥為治寒疝則盡屬寒矣故凡大烏頭煎當歸生薑羊肉湯抵當烏頭桂枝湯大半皆藉此成方不特是也傷寒於理中湯四逆湯吳茱萸湯當歸四逆湯雖不皆言腹痛惟其所用盡取給於此則亦不能決其必無痛矣豈特規規於腹滿寒疝篇之附子粳米湯大建中湯而後謂此方是腹滿痛證哉腹脹滿與心腹冷痛分隸兩篇原不在屬虛屬實上起見前篇已言之第既曰冷則其以屬寒屬熱而分不可泯矣第兩篇同列之藥偏在理中湯及厚朴豈理中厚朴寒熱均可用者耶夫理中厚朴固不可治熱然所謂胸痹心中痞氣氣結在胸胸滿脅下逆搶心者不知果屬寒否如果屬寒則不得云枳實薤白桂枝湯主之人參湯亦主之矣惟其如是是以此篇載之彼篇亦載之耳蓋有不痛為虛痛者為實之言故但脹滿而不痛者焉能無虛證然雖不痛而有水有痰有寒熱有逆氣其中又何能無實證則剋削之物自多用矣虛者比於寒實者比於熱故既脹滿而復痛者焉能無實證然雖痛而僅係寒冷所為則不能不直以溫藥逐之而剋削之物自少用矣此其交互之間正兩證之邊際而犬牙相錯者明乎此而後其分其合方有執持也篇中積藥二十七味注冷者十有三是標目雖曰冷實與不冷者相參半則其章旨重在痛矣痛之分派八論形象者二曰脹滿痛曰絞痛論所在者四曰心腹痛曰腹痛曰胸脅痛曰臍間痛更有言痛不言處言處不言痛二項其大略可相校也治脹滿痛者三味言冷者一治絞痛者亦三味言冷者亦一心腹痛七味言冷者三腹痛七味言冷者五胸脅痛一味不言冷臍間痛一味言冷言痛不言處四味言冷者二言處不言痛一味不言冷足見臍間痛無不因寒腹痛因寒者多不因寒者少但言痛及心腹痛則因寒不因寒參半脹滿痛絞痛猶間有因寒者惟胸脅痛則絶不因寒矣所以然者寒託氣於水故就下則不傍撓歸壑則不上激況篇中凡治寒者勢皆向下惟芎藭一味兼寓升提則血分之寒固應出就氣分而解無從與泛治寒者竝論且凡入血之物偏能兼主疝瘕堅積在篇中可稽也惟本太陽病下之因爾腹滿時痛者桂枝加芍藥湯主之則芍藥應止滿痛今乃言痛不言滿霍亂寒多不用水者理中丸主之吐多者去朮今乃以嘔吐而用朮似與仲景相悖不知吐多云者原未嘗不利特較之吐為少也凡兩面奔馳之證欲其止則俱止作則相稱如一面止一面加則證益危矣朮本止利今既利少於吐而更止之是使為全吐之敗證矣是以去之非為有礙於吐也故下文曰下多者還用朮下多云者見吐雖多而下亦多勢不偏重也勢不偏重則無須去朮矣況嘔吐而用朮者甚多奚啻如右然證之以五苓散茯苓澤藛湯豬苓散則皆為有水則今之治痛而嘔吐亦為水非為痛也本太陽病因下轉入太陰部位雖易卻未易邪自還當以太陽之治治之矣無如桂枝證所受之邪陽邪也桂枝證所據之地軀幹也以軀幹之邪而移入腹中為陽邪陷於陰位陽邪據於陽自宜治以寒熱停勻之法既已入陰陰將蔽之而不使出此腹所以滿陽又不甘為蔽而與相支持此所以時痛故必以比於陰而不附陰不助陰者使之入陰以操同室之戈拔陷入之陽邪仍使從表出耳倘陰不欲蔽陽僅為陽入陰中而與陰角則但痛而不滿矣勿拘拘於滿而不痛不滿而痛此猶脹滿冷痛分為兩篇之旨也腸鳴丹參微寒主心腹邪氣腸鳴幽幽如走水桔梗微寒腹滿腸鳴幽幽海藻寒腹中上下鳴昆布寒證類半夏生微寒熟溫胸脹咳逆腸鳴傷寒汗出解之後胃中不和乾噫食臭脅下有水氣腹中雷鳴下利者生薑瀉心湯主之傷寒中風醫反下之其人下利日數十行穀不化腹中雷鳴心下痞硬而滿乾嘔心煩不得安此非結熱但以胃中虛客氣上逆故也甘草瀉心湯主之嘔而腸鳴心下痞者半夏瀉心湯主之腹中寒氣雷鳴切痛胸脅逆滿嘔吐附子粳米湯主之可見水火不相激不為腸鳴陰陽能相交腸鳴自已然此皆因他病中有腸鳴不得以腸鳴為病本也惟此數味者所主之腸鳴乃為病之本然亦同為陰陽不交水火激射所異者竝無他病乃水為氣束而難行氣為痰格而難達淹蹇抑鬱莫名其狀而惟腸自鳴耳雖然還宜察其聲以求其故也幽幽者微而和上下者回而轉咳逆者不咳逆則不鳴此其差等即有陰不奉陽陽不化陰水不濟火火不布水之咎而在氣在血在上在下在中之分誠析其理而投之效矣心下滿急茯苓平心下結痛枳實寒微寒心下急痞痛逆氣半夏平生微寒熟溫心下急痛堅痞朮溫除心下急滿生薑微溫和半夏主心下急痛藥性論百合平除心下急滿痛藥性論橘皮溫和杏仁蜜丸主心下結鞕孟詵藥對菴閭子微寒主心下堅療心下堅膈中寒熱杏仁溫主心下急滿臣消心下急石膏大寒主心下急臣心下熱氣驚喘心下滿急即胸痹之類歟不然何以篇中有橘枳生薑湯茯苓杏仁甘草湯也心下滿急即水飲之所為歟不然何以篇中有枳朮湯小半夏湯小半夏加茯苓湯也夫心下滿急之氣結不行固有類於胸痹其為病之根固不出於水飲第言其處則曰心下言其狀則曰滿急能不推求其故混同胸痹水飲治之乎夫曰心下則其處狹於胸中曰滿急則其狀甚於脹痛蓋貯物充盛毫無空隙謂之滿急如弦張謂之急通評虛實論王注非特不波及於腹且不遍於胸以為胸痹則胸痹有緩有急此則但急不緩以為支飲則支飲在傍此則在中所據之地甚微所憑之勢甚猛自是胸中之氣為水飲所格急切不能升降金匱要略曰病人胸中似喘不喘似嘔不嘔似噦不噦徹心中憒憒然無奈者生薑半夏湯主之彼則言其所欲不能之跡此則言其為病之根若生薑半夏湯則正煌煌列於篇中者也更詳篇中之義此證係以陰困陽特其陽有盛有衰其最衰者宜化陰以伸之其次則導陰以舒之百合菴閭子其最盛者雖困於中仍能劫陰以助陽卻宜通陽以救陰者石膏其等限不可紊也篇中僅臚藥十味與腹脹滿篇同者四與痰飲篇同者六與上氣咳嗽篇同者四祇石膏一味無同焉以其病固與腹脹滿同狀而部位異與痰飲同體而動靜異與上氣咳嗽同源而趨向異耳心煩石膏微寒大寒止消渴煩逆滑石寒大寒除煩熱心躁杏仁溫心下煩熱梔子寒大寒心中煩悶茯苓平心下結痛寒熱煩滿𦮷母平微寒傷寒煩熱咳嗽上氣止煩熱渴通草平療脾疸常欲眠心煩李根大寒止心煩逆奔氣竹瀝大寒暴中風風瘴胸中大熱止煩悶烏梅平主下氣除熱煩滿雞子微寒除心下伏熱煩滿咳逆豉寒傷寒頭痛寒熱瘴氣惡毒煩躁滿悶甘草平煩滿短氣知母寒傷寒久瘧煩熱尿寒療血悶熱狂日華蜀本盧會寒主熱風煩悶胸隔間熱氣天竺黃寒胡黃連平大人五心煩熱唐本藥對王不留行平主心煩君止心煩鼻衄石龍芮平主心煩君止煩滿玉屑平主胸中熱心煩君除胃中熱喘息煩滿止渴雞䏶胵微寒除熱主煩熱君除熱止煩寒水石大寒主煩熱臣皮中如火燒煩滿藍汁寒主煩熱君止心煩躁藥性論楝實寒主大熱狂使傷寒大熱煩狂廩米溫止煩熱臣主下氣除煩渴敗醬微寒主煩熱臣除疹煩渴藥性論梅核仁平主煩熱臣蒺藜子微寒主心煩君止煩下氣龍齒角平主小兒身熱臣牛黃平主小兒癇熱口不開心煩君酸棗平主心煩煩心不得眠虛汗煩渴煩之訓為勞禮記樂記注為劇周官司隸注為擾廣雅釋詁為亂考工記弓人注為多淮南俶真訓注為衆大戴記少問注似與病之煩不相當者而不知煩心病也凡心之為用由外入者自此而藏於中由中出者自此而暴於外設有熱蕪纍於其間則中外攪擾於是平昔之以為與目之所見耳之所聞未嘗思而忽來欲剖決而不得一事未已一事復起憧憧往來歷碌難稽此可為衆多擾亂劇勞否耶雖然是在方書溯其源則一出於熱揆其派則為虛熱為實熱已耳及歷稽是篇所隸而後知熱之所由化熱之所挾持熱之所停頓不一而足并有不必由熱者觀之天可知夫天之所以使人煩者非溼熱鬱蒸即蘊隆亢旱然不有山川崇卑彼此之相殊乎不有夏秋春冬節序之早晚乎就其推移溯其遷化已指不勝屈況即鬱蒸亢旱而論民之所以徒避望救者且必審高下向背以求即於安此治煩之所以熾盛者折石膏楝實寒水石藍汁衝逆者抑杏仁梔子竹瀝尿烏梅蒺藜相持者解𦮷母李根皮豉壅遏者通通草滑石茯苓王不留行疲罷者和甘草廩米焦涸者滋知母雞子酸棗仁玉屑頑劣者化牛黃敗醬散漫者收龍齒突致病之源隨所在即所據而利而導之慰而安之治煩之法於是乎擴充然謂已盡則未也煩非重病也故太陽病欲自解者必當先煩乃有汗而解陽明不吐不下心煩者可與調胃承氣湯病已差尚微煩不了了者不過大便硬太陰中風四支煩疼為欲愈少陰病雖煩下利必自愈惡寒而踡時自煩欲去衣被者可治厥陰病厥而嘔胸脅煩滿者其後僅便血寸口衇陰陽俱緊證至其人大煩目重瞼內際黃為欲解皆以煩乃從陰出陽之候也惟其兼躁則為自陽入陰乃是重病故太陽病躁煩者為欲傳傷寒六七日躁煩者為陽去入陰而少陰病吐利躁煩四逆者死自利煩躁不得臥者死亦良以煩屬於心躁屬於腎耳考躁之訓為動淮南主術注為疾廣雅釋詁為狡淮南原道注為不安靜論語季氏集解引鄭注為暴急荀子富國注為好變動周書諡法是煩為心動躁為體動心動猶是陽不容陰體動則是陰不容陽故且煩且躁者雖係死徵猶有可救若僅躁不煩則陽亦無以自容故陽微發汗則躁不得眠少陰病不煩而躁者死傷寒發熱下利厥逆躁不得臥者死衇微而厥膚冷躁無暫安時者為藏厥則皆必死之證矣雖然煩亦不盡由心然必病應於心乃煩躁固不由於體然必病應於體乃躁故溼家有身體煩疼關節煩疼脾病有腹中煩重穀疸飽則發煩頭眩黃疸有四支苦煩婦人雜病有腹滿手掌煩熱而躁之義更有如物既燥乃動而飛揚者釋名則係陽不浹陰陰不入陽陽燥而欲飛動陰非特不能使之攝納且將迸而逐之矣雖然欲知煩之所以然斷須擴充斯義若注此篇之煩則毋庸論計及此何者篇目固曰心煩也形容心煩之狀莫妙如反覆顛倒心中懊憹者此篇梔子豉湯咸具焉故曰煩非重病也然亦非實病如心中悸而煩心中煩不得臥下利咽痛胸滿心煩下利咳而嘔渴心煩不得眠可知矣而其主治頗取裁於是篇則此篇之不可列極寒極溫極補極泄正為此矣似與仲景書各途而實一貫之大旨也積聚癥瘕空青寒大寒破堅積朴消寒大寒逐六府積聚固結留癖破留血閉絶停痰痞滿芒消大寒主五藏積聚久熱胃閉破留血腹中痰實結搏石硫黃溫大熱療心腹積聚冷癖在脅粉錫寒去鱉瘕大黃寒大寒破癥瘕積聚留飲宿食狼毒平破積聚飲食寒熱水氣脅下積癖巴豆溫生溫熟寒破癥瘕結聚堅積留飲痰癖附子溫大熱破癥堅積聚血瘕烏頭溫大熱破寒熱積聚苦參寒主心腹結氣癥瘕茈胡平微寒去腸胃中結氣飲食積聚諸痰熱結實鱉甲平主心腹癥瘕堅積寒熱溫瘧血瘕蜈蚣溫療心腹寒熱結聚赭魁平主心腹積聚白馬溺微寒破癥堅積聚男子伏梁積疝婦人瘕疾鮀甲微溫主心腹癥瘕伏堅積聚寒熱礜石大熱生溫熟熱一本作礬石掌氏曰礬石條竝無主療積聚癥瘕之文一本作礬石者為非芫花溫微溫掌氏曰唐蜀本作蕘花今據本經蕘花破積聚癥瘕而芫花非的主當作蕘花鰡魚微溫掌氏曰唐本蜀本云鮀魚甲微溫無此鰡魚一味遍尋本草竝無鰡魚上已有鮀甲此鰡魚為文誤不當重出蜀本續隨子溫主婦人血結月閉癥瘕痃癖瘀血除痰飲積聚下惡滯物京三稜平主老癖癥瘕結塊太陰玄精溫心腹積聚冷氣威靈仙溫久積癥瘕痃癖氣塊藥對牡蒙平主心腹積聚寒熱邪氣蜀漆平主癥結癖氣使腹中癥堅痞結積聚貫衆微寒主腸中邪氣積聚使破癥堅甘遂寒主破癥結積聚使破癥堅積聚利水穀道天雄大熱主破癥結積聚使破積聚邪氣心腹結積理石寒主除熱結破積聚破結聚消石寒主破積聚堅結君去蓄結飲食推陳致新證類豬肚微溫五十五難曰積者陰氣聚者陽氣故陰沉而伏陽浮而動氣之所積名曰積氣之所聚名曰聚積者五藏所生聚者六府所成積者其始發有常處其痛不離其部上下有所終始左右有所窮處聚者其始發無根本上下無所留止其痛無常處巢元方曰癥者由寒溫失節致府藏之氣虛弱而食飲不消聚結在內漸染生長塊段盤牢不移動者是也瘕者由寒溫不適飲食不消與藏氣相搏積在腹內結塊瘕痛隨氣移動虛假不牢者是也觀此則積聚由氣癥瘕由物積定而聚移癥牢而瘕散截然四項不可混矣乃今不特篇題合而為一所列之藥竟有一物而四項竝主之者大黃巴豆附子白馬溺鮀甲續隨子甘遂有竝主三項者蜀漆貫衆天雄主積聚癥鱉甲威靈仙主積聚瘕有竝主二項者朴消芒消石硫黃狼毒烏頭茈胡赭魁元精石牡蒙理石消石主積聚苦參京三稜主癥瘕其僅主一項者空青主積蜈蚣主聚粉錫主瘕又不四證皆有癥無主者不竟與難經病源不相應歟雖然氣能阻物物亦能阻氣則因積聚可以生癥瘕因癥瘕可以致積聚矣聚者氣有聚散瘕者物可動移故積可兼癥瘕聚不可兼癥瘕積聚可兼癥不可兼瘕是其篇目正合以類相從其論治正合緣異生別謂之為混適當因混而得析謂為不相應正賴此乃得互相印證其果混耶其果不相應耶是已可無措意所宜措意者部分也物類也細核篇中部分之目有三曰心腹蜈蚣石硫黃赭魁苦參鮀魚甲曰脅下狼毒曰腸胃茈胡物類之目有五曰痰朴消巴豆續隨子曰水狼毒甘遂曰飲狼毒消石大黃續隨子曰食狼毒消石大黃甘遂曰血朴消芒消鱉甲附子續隨子皆以詔後人因病何在而求藥之所抵因物何屬而取藥之所當為反三之舉一焉故就是中而言則任六淫皆可致積聚而茈胡烏頭可以治風附子天雄石硫黃可以治寒苦參貫衆理石可以治暑治火諸消空青大黃可以治燥威靈仙甘遂狼毒可以治溼出乎外而言則任隨物皆能成癥瘕而狗屎可治魚肉癥敗篦敗梳可治蝨癥雞屎白可治米癥油可治髮癥莫不圓陀陀活潑潑更出其外而究之且無不可矣積聚癥瘕以互相援引而成則互相牽制為治其用也有體焉益當知之則其所以然自可識也夫曰氣為積聚物為癥瘕然不有氣而竟成癥瘕物而僅成積聚者乎物而僅成積聚則金匱要略所謂宿食者明係食物結而不行惟憑吐下不謂癥瘕是也氣而竟成癥瘕則諸病源候論所謂積聚痼結者明係氣聚復因邪氣重沓牢痼久即成癥是也若是則積聚癥瘕益似混而難定而孰知如此乃益可定耶請以四言決之曰形而上者為積聚形而下者為癥瘕積聚者以物之死氣阻人生氣癥瘕者已自鍾生氣而用人生氣為使盡之矣何謂形而上者為積聚仲景曰衇緊如轉索無常者宿食也又曰衇緊頭痛惡風寒腹中有宿食不化也見風寒之衇風寒之證而竝無風寒止係宿食為患故雖實有物而僅得為積聚不謂為癥瘕以其見證形於上形於外所以知其因氣為害也何謂形而下者為癥瘕仲景曰妊娠六月動者前三月經水利時胎也下血者後斷三月衃也所以血不止者其癥不去故也又曰陽明病中寒不能食小便不利手足濈然汗出欲作固瘕必大便初鞕後溏以胃中冷水穀不別故也證屬傷寒寧汗出而不得小便已結胎元寧漏下而不以養胎故雖實無物而竟目為癥瘕不謂為積聚以其見證形於下形於內所以知其因物為害也何謂以物之死氣阻人生氣則如以上宿食諸證是也何謂其物自鍾生氣用人生氣為使則如千金外臺諸書所論髮癥嗜油食癥嗜食魚肉癥嗜魚肉米癥嗜米此非人所欲食乃物使然也然則癖也痃也獨非有形堪與積聚癥瘕匹者乎篇中所列藥物明載治是兩病者且四之一特同類得以相該而於目不繁贅耳欲釋此者猶可不別其同中之異耶巢氏曰三焦否膈則腸胃不宣因飲水漿過多便令停滯不散更遇寒氣積聚成癖癖謂僻側在兩脅之間有時而痛苦經久不差結聚成形段而起按之水鳴則為久癖若兩脅之側轉動便痛不耐風寒不欲食而短氣又為水癖由是觀之積聚癥瘕有在偏旁者然不終在偏旁癖則無在中者積聚癥瘕有因水漿者然不皆因水漿癖則無不因水漿者以此為別庶可知其異矣至於痃諸書皆不言其狀惟外臺祕要凡治痃方悉云兩肋相引弦急脹滿則是癖之屬而兼脹滿弦急者蓋癖惟由飲痃則兼氣故本篇藥物主治於癖則曰冷曰飲曰痰曰留惟兼痃則曰瘀血續隨子曰氣塊威靈仙是其所以分猶不可意會得耶且外臺主治方目有酒癖有痰癖有飲癖有癖飲有療癖有癖結有寒癖有久癖有癖羸瘠有痃癖有痃氣有痃癖不能食有癥癖有癖硬如石腹滿有癥癖痃氣灸法癖不稱氣而痃則稱氣亦可證前言之不謬也條而鬯之按而則之治癖治痃思過半矣鬼疰尸疰雄黃平寒大溫主鬼疰殺精物惡鬼丹沙微寒殺精魅邪惡鬼金牙平主鬼疰毒蠱諸疰野葛溫殺鬼疰馬目毒公溫微溫主鬼疰精物辟惡不祥女青平逐邪惡氣殺鬼溫瘧辟不祥徐長卿溫主鬼物百精虎骨平除邪惡氣殺鬼疰毒狸骨溫主風疰尸疰鬼疰毒氣在皮膚中淫躍如針刺心腹痛走無常處鸛骨主鬼蠱諸毒五尸心腹疾獺肝平主鬼疰蠱毒芫青微溫主風疰鬼疰白殭蠶平鬼臼溫微溫掌氏曰神農本草鬼臼一名馬目毒公今此療鬼疰尸疰藥雙出二名據本草說為重當刪去一條然詳陶隱居注鬼臼條下以鬼臼與馬目毒公為一物及古方多有兩用處今且竝存之白鹽寒掌氏曰本經言鹽有食鹽光明鹽緑鹽鹵鹽大鹽戎鹽六條竝無白鹽之名遍檢諸鹽皆不主鬼疰尸疰惟食鹽主殺鬼蠱邪疰又陶隱居注戎鹽條下述虜中鹽有九種云白鹽食鹽常食者則白鹽乃食鹽之類而食鹽主殺鬼蠱邪疰疑此白鹽乃食鹽耳即當為溫又不當為寒也蜀本天靈蓋平膃肭臍大熱主鬼氣尸疰夢與鬼交鬼狐魅心腹藥對麝香溫君殺鬼精物療凶邪鬼氣卷柏溫臣治尸疰鬼疰腹痛去百邪鬼魅藥性論敗天公平君主鬼疰精魅牛黃平除邪逐鬼龍齒平微寒殺精物骨主心腹鬼疰精物老魅雷丸寒大寒安息香平主心腹惡氣鬼疰代赭寒主鬼疰殺精物惡鬼腹中毒邪氣世無識鬼疰尸疰者以豫揣之其病頗有皆緣醫不加察漫認為勞投以寒涼滋補無不斃者遂更傳其親串病復如是甚至闔門竝逝殊可悲憫也巢氏曰疰之言住也謂邪氣居住人身由陰陽失守經絡空虛風寒暑溼勞倦所致言其連滯停住也夫尸者人之體魄鬼者人之精靈人之與人本係同類而相親是以中尸氣者令人寒熱淋瀝沉沉默默不的知所苦而無處不惡或腹痛脹滿喘急不得氣息上衝心胸旁攻兩脅或螺塊踊起或攣引腰脊或舉身沉重精神錯雜昏謬是病於人軀體為多中鬼氣者令人心腹刺痛或悶絶倒地得差之後餘氣不歇積久停住發動有時是病於人府藏者為多其不傳染他人而專貽親串則以晝夜陪伺調護憂傷之餘患氣薰灼之久故耳觀篇中用意皆假變幻靈通之質威厲猛烈之性芳香走竄之氣沉雄惡毒之味按其為中軀體為中藏府循隙析理而投之以震驚其居住之堅牢鈐制其止發之自由靜則誘引而搜剔之動則乘勢以驅逐之不涉於補不流於瀉其境與虛勞迥異知其異而按其則以為治焉非特愈一人疾厄已也雖然此為疰病不傳變者言耳逮其傳變則不得以此律之矣詳哉蘇游之論也其言曰疰病初得半臥半起號為殗殜氣急咳者名曰肺痿骨髓中熱稱為骨蒸內傳五藏名之伏連假如男子因虛損得之名為勞極吳楚云淋瀝巴蜀云極勞死訖復易家親一人故曰傳尸亦名轉疰是殗殜肺痿骨蒸伏連淋瀝各有其治而無與於篇中諸藥物矣特既可名勞極則是去勞極為近究何以析之夫勞之為病金匱要略虛勞篇論之詳矣疰病仍當以蘇游之論為別曰傳尸之候心胸滿悶背髆煩疼兩目精明四肢無力雖知欲臥睡常不著脊膂急痛膝脛痠寒多臥少起狀如佯病每至旦起即精神尚好欲似無病從日午以後即四體微熱面好顏色喜見人過常懷忿怒才不稱意即欲嗔恚行立腳弱夜臥盜汗夢與鬼交通或見先亡或多驚悸有時氣急有時咳嗽雖思想飲食而不能多食死在須臾而精神尚好或兩脅虛脹或時微利鼻乾口燥常多粘唾有時唇赤有時欲睡漸就沉羸猶如水涸不覺其死此其與虛勞大異者也至其分析傳變五藏之形曰其源先從腎起初受之氣兩脛痠疼腰脊拘急行立腳弱食飲減少兩耳颼颼似風聲夜臥夢泄陰汗痿弱腎既受已次傳於心心初受氣夜臥心驚或多忪悸心懸乏氣吸吸欲盡夢見先亡有時盜汗食無滋味口內生瘡心常煩熱惟欲眠臥朝輕夕重兩頰唇口悉紅赤如傅胭脂又時手足五心皆熱心既受已次傳於肺肺初受氣時時咳嗽氣力微弱有時喘氣臥即更甚鼻口乾燥不聞香臭假令得聞惟覺朽腐物氣有時惡心憒憒欲吐肌膚枯燥或時刺痛或似蟲行乾皮細起狀若麩片肺既受已次傳於肝肝初受氣兩目䀮䀮面無血色常欲顰眉視不及遠目常乾澀又時赤痛或復睛黃朝暮瞢朧常欲合眼及至於臥睡還不著肝既受已次傳於脾脾初受氣兩肋虛脹食不消化又時渴利熟食生出有時肚痛腹脹雷鳴唇口焦乾或生瘡腫毛髮乾聳無有光潤或復上氣抬肩喘息利赤黑汁至此候者將死之證也能悉乎此斯不與虛勞混彼此誤治矣千金之隸是於肺病項下也將無以其氣從鼻吸入耶抑以其能變肺痿骨蒸耶然皆小焉者也其大處則以是病乃壞人之精魄致魂無所依氣無所主血無所朝而死魄非肺之所藏耶魄者金水之精譬之於鏡能映物而不能燭物遇寒則清逢熱則昏故千金之論曰凡諸心腹痛服衆方熱藥入腹寂然不動但益氣息急者此尸疰病也試觀前蘇游所列病狀有一堪用熱藥者乎篇中所列諸藥物有一大溫大熱者乎曰尸疰初覺先與甘草汁一升消息少時服瞿麥湯盡一劑得下便覺稍寬亦可知其從鼻吸入即布於胃而化熱遂盤旋於血分水道水道者肺氣所由通調血分者肺家為所朝會入其所主之竅窒其敷布之節而剷削其所客之神消耗其所治之氣始終與肺為患謂為肺病不亦宜哉然篇中所列藥物謂為治肺不可也其理何在夫病在何藏即從何藏治是金元已來所長苟其當理則不必更勤求古訓矣是固宜別其所感何氣觀其所化何似揣其所嚮何方決其所成何患則篇中藥物味味靈通絲絲順理不治肺而肺家所入邪卻肺藏治節之職復既不使邪惡之氣化熱而附水道侵精魄詎非的當之至歟倘但知邪氣何屬而不知邪氣之化邪氣所在而不知邪氣之傳均可謂執中無權舉一廢百此有明後葉之弊貽害於今者也驚邪雄黃平寒大溫丹沙微寒紫石英溫補心氣不足定驚悸安魂魄填下焦茯神平止驚悸多恚怒善忘龍齒平驚癇癲疾狂走心下結氣不能喘息龍膽寒大寒主驚癇邪氣防葵寒癲癇驚邪狂走馬目毒公溫微溫升麻平微寒小兒風驚癇藥性論麝香溫小兒驚癇客忤鎮心安神合丹沙水灌下人參微寒微溫安精神定魂魄止驚悸沙參微寒寒除血積驚氣桔梗微溫驚恐悸氣白薇平大寒療驚邪風狂疰病隱居遠志溫定心氣止驚悸柏實平主驚悸安五藏益氣鬼箭寒鬼督郵平小草溫卷柏溫平微寒鎮心治邪啼泣紫菀溫小兒驚癇羚羊角寒微寒除邪氣驚夢狂越僻謬鮀甲微溫五邪涕泣時驚丹雄雞微溫微寒犀角寒微寒止驚安五藏日華羚羊角溫微寒止驚悸茯苓平憂恚驚邪恐悸心下結痛蚱蟬寒小兒驚癇夜啼蜀本縮沙蜜溫證類鬼臼掌氏說見鬼疰尸疰篇搐搦牽掣抽縱也古人名之曰瘛瘲其病在筋衇振顫震動戰栗也古人名之曰振其病在肌肉皆由於外而無與於神志驚則病在神志而發自中時若有所見聞有所恐怖其形體手足掣而不縱動而不栗所以然者心以陽舍陰以靜攝動驟有恐迫陽縮入陰動混於靜不能自振則肝起為禦侮於是陽錯行而氣遂亂舉痛論曰驚則心無所倚神無所歸慮無所定故氣亂奇病論曰有所大驚氣上不下精氣并居金匱真言論曰肝病發驚駭大奇論曰肝衇騖暴有所驚駭又曰腎肝并小弦欲驚竝與是義帖切故篇中所列諸品皆取乎奠安陽中之陰扶翼動中之靜此猶朝廷綱紀紊亂則方面竝起名曰勤王實以觀釁但得內庭整肅則方面自然退聽是以第交媾陰陽調燮水火而不顓顓於治心治肝誠可謂以無厚入有間也矣然不曰驚而曰驚邪則以驚有因邪而致者與因驚而生邪者異也因邪而致驚奈何金匱要略曰病有奔豚有吐膿有驚怖有火邪此四部病皆從驚發得之不但言驚而繼以發見病雖固有然不應致此所以致此則因乎驚也傷寒論曰太陽傷寒加溫針必驚少陽不可吐下吐下則悸而驚是因邪致驚之由茈胡加龍骨牡蠣湯桂枝去芍藥加蜀漆牡蠣龍骨救逆湯桂枝加桂湯茯苓桂枝甘草大棗湯奔豚湯是因邪致驚之治其因驚而致邪則下篇所列癲癇是矣癲癇既別為篇奈何茲篇重列治之之物亦以癲癇雖因驚而致然亦有因邪而驚因驚復癲癇者故篇中凡節本經別録諸物主治涉及癲癇者竝與癲癇篇復龍齒防葵升麻蚱蟬等是也見驚邪癲癇雖分門別戶然驚邪不解仍得為癲癇癲癇之內仍有因驚邪者疏其派正以各會其全非復也亦非混也至篇中驚邪治法與傷寒論金匱要略迥不相謀則以前所論諸湯皆治傷寒者也夫邪亦何常之有有正邪有虛邪有賊邪有雜邪風有八痹有五豈得概而言者所論諸湯僅一奔豚湯自係雜邪餘者竝屬正邪變幻不有此篇拾遺補闕焉得治驚邪全體哉本篇諸藥物主治除驚癇癲疾外多曰驚悸曰驚狂蓋又有陰迫陽陽迫陰之別焉夫水停為悸火盛為狂驚悸驚狂究其來歷雖絶不由水停火盛徵其見在則有非水停火盛不為驚悸驚狂者其故可約略而言也曰傷寒八九日下之胸滿煩驚小便不利讝語一身盡重不可轉側者柴胡加龍骨牡蠣湯主之非水停耶曰傷寒衇浮醫以火迫劫之亡陽必驚狂起臥不安者桂枝去芍藥加蜀漆龍骨牡蠣救逆湯主之非火盛耶然以火盛而曰陽亡以水停而用大黃緣誤治耳設不因誤治而陽迫陰陰迫陽則水停者當思濬其道火盛者當思熄其焰即指誤治者言水停仍須茯苓火盛猶賴蜀漆其旨不可窺見哉況本是虛邪雜邪暨夫不因邪者故篇中藥物下所繫主治凡言驚悸者無性寒之品言驚狂者無性熱之品就是而推不既思過半歟觀其安陰於陽中雄黃丹沙人參紫石英柏實紫菀清火於水中龍膽攝火以歸土龍齒導水以就窪茯神茯苓撥陰之遏陽升麻舉陽使出陰蚱蟬挽陽以入陰遠志闢陽以通陰犀角於陰中伸陽丹雄雞就陽中益陰沙參鑿陰之閉陽麝香開陽之拒陰桔梗帖陰陽之違從施擒縱俾就理曾謂治驚尚有遺義哉癲癇龍齒角平齒主大人小兒驚癇癲疾狂走角主驚癇瘛瘲身熱如火牛黃平小兒諸癇熱口不開大人狂癲防葵寒咳逆溫瘧癲癇驚邪狂走白斂平微寒小兒驚癇溫瘧牡丹寒微寒驚癇邪氣茛菪子寒療癲狂風癇顛倒拘攣雷丸寒微寒主癲癇狂走鈎藤微寒主小兒寒熱十二驚癇白殭蠶平小兒驚癇夜啼蛇牀子平癲癇惡瘡溫中下氣蛇蛻平主小兒百二十種驚癇瘛瘲癲疾寒熱蜣蜋寒主小兒驚癇瘛瘲腹脹寒熱大人癲疾狂易白馬目平主驚癇腹滿瘧疾鉛丹微寒驚癇癲疾除熱下氣蚱蟬寒小兒驚癇夜啼癲病寒熱白狗血溫主癲疾發作豚卵溫主驚癇癲疾豬牛犬等齒平熊膽寒蜀本盧會寒主熱風煩悶胸膈間熱氣小兒癲癇驚玳瑁寒止驚癇日華藥對白馬懸蹄平臣主驚邪瘛瘲淡竹瀝大寒臣蛇銜微寒主寒熱臣主驚癇寒熱邪氣除熱秦白皮微寒大寒小兒癇身熱頭髮溫小兒驚癇雞子平主發熱主熱火瘡驚癇狗糞中骨平臣主寒熱小兒驚癇露蜂房平使驚癇瘛瘲寒熱邪氣癲疾白鮮皮寒臣小兒驚癇雀甕平使主小兒驚癇寒熱結氣甘遂寒使升麻微寒君小兒風驚癲藥性論大黃大寒使證類銀屑與銀薄同主定志去驚癲小兒癲疾狂走巢氏曰癇者小兒病也十歲已上為癲十歲已下為癇豫以為不盡然奇病論曰人有生而病癲者得之在母腹時母有所大驚氣上而不下精氣并居故令子發為癲疾也小兒有癲則大人不可有癇乎案備列癲病形象莫詳於甲乙經其目但標癲者不兼瘛瘲癲狂竝舉則每兼之而癇則口眼相引目睛上搖手足掣縱之謂是癲不必掣縱癇必掣縱癲而狂亦掣縱癇而癲或不掣縱非癲癇之確別歟奈世人見此二證而均不識也凡卒仆無知痰涎湧出者無論掣縱與否皆謂之癇而以神識不慧語言錯亂者為癲不知甲乙經所載除因外邪寒熱此外如僵仆嘔沫目妄見口喎喎悸耳鳴頰腫吐舌吐血羊鳴戾頸短氣胸背痛痿厥洞泄煩滿悲泣轉筋目䀮䀮鼽衄皆癲之兼證病源所載癇證如搖頭弄舌睡中驚掣數齧齒屈指如數背脊強直頸項反折等與癲絶不相同癇之與癲豈果難分耶雖然玩篇中所摘本經別録主治則混稱固不可過析亦不可要須深明其故也觀治癇者每比於驚可知其氣之亂而伏行經隧矣治癲者每比於狂可知其氣之并而鬱勃難達矣而難經二十難曰重陽者狂重陰者癲是當析者也靈樞邪氣藏府病形篇曰心衇緩甚為狂笑微澀為癲疾其不析何也素問衇解篇太陽所謂甚則狂癲疾者陽盡在上而陰氣從下下虛上實故狂癲蓋均是相并陰盛於下則癲陽盛於上則狂陰陽互并而相搏則癲狂此甲乙經多癲狂竝提之證本篇多狂癲竝治之藥也而驚與癇之析者有二陰急為癇厥二陽急為驚之文其混者有心衇滿大癇瘛筋攣肝衇小急癇瘛筋攣腎肝并小弦欲驚之文竝素問大奇論病源曰氣血不和熱實在內心神不定所以發驚甚者掣縮攣癇蓋心主血衇熱氣輳於本則驚輳於標則癇此驚癇本相連屬古書所以多連稱而本篇亦多驚癇竝治之藥也試不析癲癇而但舉其所兼之疾則有身熱龍角鉛丹秦皮牛黃有溫瘧防葵白斂有寒熱鈎藤蛇蛻蜣螂白馬目蚱蟬蛇銜露蜂房雀甕狗糞中骨有風邪牡丹蘆會升麻有惡瘡蛇牀子雞子有脹滿蜣螂白馬目蘆會有拘攣茛菪子凡得全篇十之五若析癲癇無論所兼所因者龍角牡丹白斂鈎藤白殭蠶白馬目鉛丹玳瑁白馬懸蹄蛇銜秦皮頭髮狗糞中骨雞子白鮮皮雀甕治驚癇僅白狗血治癲亦得全篇十之五餘則均可治癲狂復可治驚癇者準是而論析之亦何益矣即以兩味竝提大人小兒者為十歲以上為癲十歲以下為癇之證則篇中特提小兒而癲癇皆治者且三之一此又何說焉總之比其兼證別其寒溫而揣其上下以定取捨是用此篇治癲癇之大綱亦分癲癇之微旨矣驚癇癲狂既每相連為患本篇固為癲癇正治驚則前有驚狂篇亦既詳論治矣至於狂則舍與癲相連者外遂可無治法乎夫狂有四端有陽鬱有七情有火邪有瘀血陽鬱者病能論曰陽氣者因暴折而難決故為怒狂則所謂多與癲連者也七情者癲狂篇曰狂始生先自悲也喜忘苦怒善恐者得之憂飢狂言驚善笑好歌樂妄行不休者得之大恐狂者多食善見鬼神善笑而不發於外者得之大喜狂目妄見耳妄聞善呼者少氣所生此皆宜循其端以導之或針治或如陰陽應象大論所謂悲勝怒恐勝喜怒勝思喜勝憂喜勝恐消息其意而調之可也火邪者傷寒論曰傷寒衇浮醫以火迫劫之亡陽必驚狂起臥不安者桂枝去芍藥加蜀漆龍骨牡蠣救逆湯主之是也瘀血者傷寒論曰太陽病不解熱結膀胱其人如狂血自下下者愈其外不解者尚未可攻當先解外外解已但少腹急結者乃可攻之宜桃核承氣湯太陽病六七日表證仍在衇微而沉反不結胸其人發狂者以熱在下焦少腹當硬滿小便自利者下血乃愈所以然者以太陽隨經瘀熱在裏故也抵當湯主之是也曾謂不與癲連者遂無治法乎然則神識不慧語言錯亂世俗所謂癲者又何從治是在金匱可按也曰防己地黃湯治病如狂狀妄行獨語不休無寒熱其衇浮既無外感復無掣縱如狂非狂似癲非癲其治如此則與之類者可推測而知其概矣孫真人千金方王太守外臺祕要於驚癇癲狂皆加以風字千金方又於風癲論中附載素問厥論全篇其義趣皆當深考者也夫陰陽在人互相維繫乃生兩相背馳則死可即而不可離然有乍相激而遂相離者有久相拒而仍相維者無他一則積漸使然一則卒然乘之耳夫癲癇與傷寒其陰陽之偏頗無異然而傷寒勝負不過十餘日而決裂癲癇相持有至數年數十年不愈亦不死者此其故自有在矣譬之漢楚鏖鬪五載而亡七國媾爭二百餘年未已且其間齊成田氏晉室三分他國終不能遂吞并之謀由其素與民浹不肯相離也是故癲由厥成風從厥化癇以驚作驚為風生風煽火熾火爍狂發驚癇癲狂烏得不加風字而其所謂風在厥論固足寒則火上逆而生風為狂足熱則風痰上湧而為癲而厥成為癲疾衇要精微論精氣并居於上為癲奇病論陽盡在上陰氣從下下虛上實為狂癲衇解篇陽盛則四支實能登高棄衣而走且妄言罵詈不避親疏陽明衇解篇無不可一以貫之是其以漸相并之勢積微成著之機或以陰輳陽而陽愈盛如燈燭之燃脂或引陽就陰而陽愈牢如薪槱之蓄火豈猶冰炭之相迫水火之相沃能不眨眼而澌盡哉故曰癲疾厥狂久逆之所生通評虛實論是其酷似七雄之爭非如鴻溝之鬪也使盡檢千金外臺凡風狂風驚恐風邪五邪風驚悸風驚恐風癲五癲風癇風眩風旋諸方合之本篇所用所未及用者止十四味而在附録者止八味蓋已得十分七八矣苟以意消息之猶有不能用之物哉癲者陽搏陰而難通狂者陽絶陰而無制皆陽窮化風與驚癇之陽為風煽者異奈何藥物能竝主之也夫合而言之則驚狂掣縱卒倒無知之際但見風陽之擾亂遑定本末於由來竝治之物急所當需特苦僅得四味耳就四味而言如龍齒角攝水火於土而不使相逐牛黃除蓄熱於土而兼清內外蜣螂納穢濁於土而撲火之焰防葵出土最早而得水能沉均無論內傷外感皆可施用者又何陽化風風煽陽之別而有所隔礙耶分而言之則驚邪既有專條狂走又多別故如瘀血大熱等病中皆可尋狂之治則是篇所重獨在癲癇故所列多直探病本不假旁推側擊而發表去邪者絶跡難求於此可悟靈樞癲狂篇有骨癲筋癲衇癲而無肉癲皮癲如有肉癲皮癲則外發之物在所必用矣通評虛實論曰癲疾衇搏大滑久自已陽中有陰也衇小堅急死不治陰之拒陽也虛則可治陰可合陽陽可合陰也實則死陰陽不可相入也篇中生而病癲厥成為癲癲字內經皆作巔故王注咸謂為首疾今從甲乙經千金方引用以皇甫士安孫真人皆在太僕前也喉痹痛升麻平微寒風腫諸毒喉痛口瘡射干平微溫喉痹咽痛不得消息杏仁溫雷鳴喉痹下氣蒺藜子溫微寒主喉痹棘針寒掌氏曰本經白棘一名棘針不主喉痹痛棘刺花條末云又有棗針療喉痹不通此棘針字當作棗針絡石溫微寒喉舌腫不通水漿不下百合平除喉痹䈽竹葉大寒除喉痹莽草溫療喉痹不通苦竹葉大寒唐本細辛溫開胸中除喉痹藥對豉寒治喉開不通使主喉痹卒不語煎一升服覆取汗當歸溫切醋熬傅腫上亦主喉閉不通君曹青岩曰喉嚨主天氣咽嗌主地氣蓋咽主納穀喉主出氣天氣者肺氣地氣者胃氣也天氣為邪所阻則心主三焦之施化不行故濁結於上而為痹病源曰喉痹喉裏腫塞痹痛水漿不得入令人壯熱惡寒七八日不治則死邪客於喉則人陰陽之氣不能出於肺循喉而上下是也地氣為邪所阻則脾胃之轉輸不利故濁蒸於上而為腫靈樞癰疽論猛疽發於嗌中不治化為膿塞嗌中半日死膿得瀉者飲以豕膏三日已是也然痹則無膿有朝發夕死者腫則有膿有數日不死者蓋喉為氣道氣道阻則津液留而不化結為痰涎阻塞竅隧嗌為食道食道阻則胃氣餒而化熱蒸為膿血阻遏氣機故瀉膿易而撤痰難也痹腫皆邪氣所為有上受而結者下傳而結者故凡內腫及外外腫涉內內腫外不腫外腫內不腫或曰喉閉或曰喉風是皆痹之類更有上熱下寒腫白而赤汗出喘逆為陽之內竭喘渴吐血閉不能飲煩擾壯熱為陰之內竭是皆不治又如嗌上下左右或奇或偶結腫為膿曰癰不為膿曰蛾為腐曰疳是皆嗌腫之類實則熱痛俱盛而神清虛則熱痛俱微而神倦竭則如痹而死矣更婦人女子有所結於內亦發於喉或腫或腐遇勞怒即發不甚為楚男子間亦有之室孀發者特甚是即少陰咽痛也少陰主唾熱則唾不上供利少陰之氣即致少陰之唾非勞極之唾為熱涸而音喑喉蝕比也據此則喉痹重在閉嗌腫重在痛矣然厥論曰手陽明少陽厥逆喉痹嗌腫咳論曰心咳則喉中介介如梗甚則咽腫喉痹則腫之甚者亦痹痹之甚者亦腫腫而至痹痹而至腫皆絶證也故推原治法定恃痛與閉孰甚所以篇中標痛者二其散發皆於陽分標不通者四其斡旋皆在陰中而均係開解其餘則盡下氣之物矣是治咽喉大旨不外降散兩端更別以寒熱之殊宜較以輕重之得所猶有遁而之不可為哉噎病羚羊角寒微寒除食噎不通通草平青竹茹微寒頭垢微寒治噎酸漿水煎膏用之藥性論蘆根寒能解大熱開胃治噎藥性論牛齝平按拾遺云牛口中齝草絞取汁服止噦不云治噎日華云牛涎止反胃嘔吐治噎要取則以水洗口後鹽塗之涎自出舂杵頭細糠平主卒噎藥對鸕鷀頭微寒主噎不通頭主噎及鯁燒末服說文曰噎飯窒也詩正義曰噎者咽喉蔽塞之名此言噎之狀病源曰噎由憂恚所致憂恚則氣結氣結則不宣流使噎噎者噎塞不通也又曰陰陽不和則三焦隔絶三焦隔絶則津液不利故令氣塞不調理也此言噎之由蓋憂為肺志腎家之水賴肺以輸脾家之精賴肺以布因憂氣結不能循職則津液結澀氣道不澤食入遂窒塞焉篇中之治或因其津液內窒而通之於外竹茹蘆根或因其氣機外窒而通之於內羚羊角外革抅曲而內之木直遂或因其不降而通之於下通草或因其不升而通之於巔頭垢或直達其阻塞杵糠或曲肖其食物牛涎顱鷀頭不泥執其由來但歆動其生氣古人治病往往如此擴而充之則𦮷母之解鬱萱草之忘憂均可為三隅之反也若因其氣與食窒而用香燥開通苦寒剋降則不勝其夯而病遂由此增劇矣雖然千金方述古今録驗云五噎氣噎憂噎勞噎食噎思噎也氣噎者心悸上下不通噎噦不徹胸脅苦痛憂噎者天陰苦厥逆心下悸動手足逆冷勞噎者苦氣膈脅下支滿胸中填塞令手足逆冷不能自溫食噎者食無多少惟胸中苦塞常痛不得喘息思噎者心悸動喜忘目視䀮䀮凡若是者猶可但以篇中諸藥治之歟夫特據其始自理歸一致暨推其變則分遂殊異津液結而不流能使陽氣痹而不宣亦能使陰氣凝而不釋陽痹不宣則蒸而生熱陰凝不用則滯而為寒寒熱相搏則激而成實寒熱相凌則削而成虛故仲景曰寸口衇浮大醫反下為大逆浮則無血大則為寒寒氣相搏則為腸鳴醫乃不知令飲冷水汗遂大出水得寒氣冷必相搏其人即噎曰跗陽衇浮浮則為虛浮虛相搏故令氣噎言胃氣虛竭也曰小青龍湯證若噎者小青龍湯去麻黃加附子主之斯足以窺其際矣更竅之以千金五噎丸乾薑湯之溫竹皮湯羚羊角湯之寒猶不可識其流耶特走竄攻下千金外臺終不及用此則常極加意耳有膈證者每緣噎所致靈樞僅列其名素問推言其由外臺雖列其治卻甚不可明本篇及千金并不載其目膈者病之末傳大證也死證也可不條理其緒俾人識其端或者十中可全二三乎夫膈淺言之則靈樞一語盡其概曰氣為上膈是也分言之則有上傳下傳焉素問陰陽別論曰一陽發病少氣善咳善泄其傳為心掣其傳為膈此上傳也一陽為膽與三焦宜直達而不宜抑遏抑遏則氣機窒塞而難通難通則運用於中者寡上下間出者多於是心不舒為掣食難入為膈此即由噎致者也曰三陽結謂之膈此下傳也三陽為小腸膀胱有經過而無滯留留則逆逆則滿於中而反上出此由反胃致者也自金元已降噎膈反胃雖皆混稱然亦頗有見到語曰噎在上脘膈在中脘反胃在下脘是也但未檢病源所謂胸中氣結煩悶津液不通飲食不下羸瘦不為氣力為憂膈心下苦實滿噫輒酢心食不消心下積結牢在胃中大小便不利為恚膈胸脅逆滿噎塞胸膈不通噫聞食臭為氣膈心腹脹滿咳逆腹上苦冷雷鳴繞臍痛食不消不能食肥為寒膈藏有熱氣五心中熱口爛生瘡骨煩四支重唇口乾燥身體頭面手足或熱腰背疼痛胸痹引背食不消不能多食羸瘦短氣及癖為熱膈且寒熱外因必連脹滿憂恚內因亦須便祕其膈乃成可見結在上而下仍通結在下而上不闔皆不能為隔惟上下交鎖鬱滯連衡始得就耳故噎不便祕僅可謂噎反胃自嘔不過反胃倘反胃不嘔又不能食噎且便祕胸腹不通斯則膈矣趺陽衇浮而澀浮則為虛澀則傷脾脾傷則不磨朝食暮吐暮食朝吐宿穀不化名曰胃反虛且傷脾是中焦病不得云下脘也然胃反吐而渴欲飲水者茯苓澤藛湯主之其方較五苓散多生薑甘草而少豬苓不可見病確在中實由在下水道不宣歟不與三陽結為膈相連屬歟是反胃與嘔同形異治反胃與噎膈異病同情也然則外臺治膈八方蜀椒遠志乾薑桂心細辛無方不用何義夫膈既方成胸腹閉塞自非溫開不能通達通達之後自有條理可尋乃更換證檢方剷除病本試思八方何無一方作湯服者丸如彈子僅服一丸如梧子者服四五丸至多以十丸為率亦可見其意之所在矣鯁狸頭骨溫按藥性論狸頭骨燒末治噎病不通食飲不云治鯁蓋治野獸骨鯁可以意會者也獺骨平卻魚鯁鶴鷀骨微寒千金論曰凡療病者皆以其類至如治鯁之法豈宜以鸕鷀主魚哽狸虎治骨哽耶至於竹篾薤白嚼筋綿蜜等事乃可通為諸哽治耳明一物一制者其用隘非其所制則不能為力由其天賦止於如此兼制諸物者其用廣雖非所制亦能為力由械智既周物莫能遁此為人巧可奪天工觀外臺祕要列諸哽才三十五首誤吞物方一十七首其大意可剖析而論焉大率有用其滑者如多食半脂肥肉能引釘箭針鐵之類有用其黏者如飴糖能出鐶叉之類有用其縛者如薤葉麥葉能裹鐶叉之類有用其引者如磁石能吸鐵針之類有用其類者如以所餘燒灰末水服及以髮灰還治吞髮繞喉之類有用其拔者如吞鹿筋竹篾等令至哽處動其所哽之類皆人巧也有用其劫者如魚笱鬚魚網治魚骨哽之類有用其服者如汞能軟銀之類有用其制者即鸕鷀治角狸虎治骨之類有用其魘者如刀鋸漬酒治竹木哽之類皆天工也夫物情局曲病變多方乍視之則參差不齊一若終難相接者而不知或迎其首或隨其尾或憑其腰領或截其行蹤總須使之相值尤要在馴其暴遂其欲而不激其怒故一病也而在甲則微在乙則甚一物也施之於始不效施之於終乃效苟能得其機尋其緒遂無不可批之郤不可導之窾矣雖然物情能勿察乎體氣勿顧乎譬如深師用薔薇灰療哽及刺不出以薔薇之刺不連根於梗也千金以瞿麥療哽及刺以瞿麥子熟則奔迸自出也肘後以布刀故鋸燒清酒中調婦人指甲灰治誤吞木竹叉以叉慣熟婦人手拔也此之謂察物情備急以豬羊及肥肉治吞針箭鏃金鐵假使不耐肥人豈能服之又以生艾蒿水酒煮服治諸肉骨哽假使津液竭者豈能服之此之謂顧體氣非特治哽宜然也一切病能外是哉齒痛當歸溫大溫治牙疼痛不可忍患人虛冷加而用之藥性論獨活平主風毒齒痛細辛溫除齒痛蜀椒溫大熱堅齒髮芎藭溫單用唅咀治口齒疾藥性論附子溫大熱莽草溫濃煎湯淋風蚛牙痛日華礬石寒堅骨齒除固熱在骨髓久服傷人骨蛇牀子平療齒痛藥性論生地黃大寒主齒痛食療茛菪子寒主齒痛出蟲雞舌香微溫風毒諸瘡齒疳䘌車下李根寒掌氏曰郁李根也主齒齗腫齲齒堅齒馬懸蹄平主齲齒雄雀糞溫療齒齲痛有蟲綿裹塞齒孔外臺祕要蜀本楓香脂平主浮腫齒痛藥對金叉火燒針齒痛即止烏頭大熱使治齒痛藥性論白頭翁溫使治齒痛藥性論酒漬枳根微寒有齒痛有齗痛凡脣頰腫齗爛赤能齧能嚼者齗痛也不得齧且嚼齗頰脣如常者齒痛也故治齒痛可溫可補齗痛宜清宜泄蓋以齒之體連於骨而主於腎齗則手足陽明所縈絡也腎病有內因有外因外因者溼熱生蟲從外而蝕篇中凡用雄烈殺蟲者是莽草雞舌香車下李根馬懸蹄雄雀糞茛菪子內因者寒閉血液不能榮骨篇中凡用升降水火者是當歸芎藭附子蜀椒烏頭白頭翁陽明病有風有火風則肌肉膹腫開闔不利篇中凡用開發行氣者是獨活細辛蛇牀子楓脂香枳根火則糜爛氣穢致成膿血則篇中所列寥寥蓋於血證癰疽惡瘡䘌者均可倣佛其治故不多載而說者謂上齒屬少陰下齒屬陽明非也少陰之衇僅循喉嚨挾舌本不能至齒惟手陽明之衇入下齒足陽明之衇入上齒亦無當齒痛大義然惟如是益可見痛關陽明在經衇肌肉而無涉於骨若靈樞雜病篇所謂齒痛不惡清飲取足陽明惡清飲取手陽明則劇所當思矣夫陽明為燥金之經其發齒痛非津液壅滯即津液焦枯焦枯者欲飲未必欲清壅滯則欲清飲矣所以然者焦枯是虛壅滯是實實者猶火之附薪虛者猶物之失養即是觀之則凡篇中之物燥烈者止可治實滋澤者方堪治虛而病涉少陰則非特不欲清并不欲飲皆可見矣口瘡黃連寒微寒療口瘡檗木寒主口瘡龍膽寒大寒升麻平微寒喉痛口瘡大青大寒療時氣頭痛大熱口瘡苦竹葉大寒療口瘡石蜜平微溫主口瘡酪寒酥寒利大腸主口瘡豉寒藥對乾地黃平題作口瘡於千金七竅門實該口舌脣三者若外臺祕要之緊脣瀋脣瘡爛口瘡口吻瘡舌本縮舌上瘡皆應隸此乃檢其所主之方所用之藥較是何啻倍蓰而以此寥寥數味者昭列於篇毋乃不遍不該歟而不知彼倍蓰之方之藥有不能不於此取裁者蓋心主舌脾主口心者外陽內陰脾者體靜用動故口之與舌其開闔轉掉咸在津唾之常承則其為病非患於津唾之不足承必患於津唾中挾有熱是以兩書中方法雖多然每方中必有是篇一二味者十居七八篇中所載僅十一味分而言之入水以清火者六入陽以澤陰者五觀其命意所在猶當以火因溼而出黃連火因溼而用黃檗火不羈於水中龍膽水抑遏於火上升麻火附水以外發則充其水而使之畢發大青水迫火以上升則解其火而使之開散竹葉而或澤其上酪或澤其中蜜或澤其下酥或解其糾結而津自行豉或濡其礦頑而陰自復地黃莫不秩然有序界劃攸分不特可為一病之規模并可覘凡病之取裁矣然其治水中之火多注意於藏治陰不承陽反注意於府一若府當補藏當泄者不幾與凡病之藏病多虛府病多實者適相戾歟夫藏者藏精氣而不瀉府者轉化物而不藏惟其藏故火得與津偕藏其治非泄也乃剔去津中火耳惟其瀉故津背火而自瀉其治非補也乃益津以配火耳是故以津而言則藏實而府虛以火而言則府實而藏虛正與傷寒之少陰證陽明證同一例也獨其火或搏於津津或違於火所以不為他重病而僅僅口瘡是當深研其義得其所以然則變換在手萬化生心矣吐唾血羚羊角寒微寒白膠平溫療吐血下血戎鹽寒吐血齒舌血出柏葉微溫主吐血衄血艾葉微溫止吐血水蘇微溫主吐血生地黃大寒吐血搗飲之大小薊溫止吐血蠐螬微溫微寒療吐血在胸腹不去飴糖微溫止渴去血伏龍肝微溫主吐血黃土平蜀本鐺墨主吐血研末以酒或水溫服之藥對馬通微溫使止渴及吐下血小麥微寒使止漏血唾血麥句薑寒君天名精也止血藥性論證類牛膝桑根白皮主吐血熱渴吐唾血者吐而唾間有血也若但云吐血則牙宣者口舌裂者咳嗽者嘔者皆有血可吐不必雜在唾間矣惟云吐唾血則牙宣者當質之齒痛門口舌裂者當質之口瘡門咳嗽者當質之咳嗽上氣門嘔者當質之嘔吐門而無所混然則吐唾血之由奈何千金載廩邱之說云吐血有三種有內衄有肺疽巢氏作胏疽有傷胃內衄者出血如鼻衄但不從鼻孔出是近從心肺間津液出還流入胃中或如豆羹汁或如切䘌血凝停胃中因滿悶即便吐或數斗至一石得之於勞倦飲食過常也肺疽者或飲酒之後毒滿悶吐之時血從吐後出或一合半升一升是也傷胃者因飲食大飽之後胃中冷不能消化不能消化便煩悶強嘔吐使所食之物與氣共上衝蹙因傷裂胃口吐血色鮮正赤腹絞痛汗出其衇緊而數者為難治也諸病源候論曰吐血者皆由大虛損及飲酒勞損所致也肺為五藏上蓋心肝又主於血上焦有邪則傷諸藏藏傷血則下於胃胃得血則滿悶氣逆氣逆故吐血以是知唾間之血非緣火迫不由衝激乃上焦自有所傷血久已流於胃胃滿遂溢於上故雜唾而出其出也甚易不假嘔逆無須咳嗽則治之者竟不在平氣止逆行痰泄火可直推其何以聚於中而從其中以化之導之滲之泄之矣夫陽明多氣多血者非滿盛氣血於胃中也以其受納較他藏府為能容其決泄較他藏府為難竭耳即能容難竭亦非所素有也以其盛則必有所掣衰則必有所曳耳今者血瀦於中至隨唾而吐是其掣與曳定有所窒而不靈從篇中所列以窺其微則不靈之故蓋有在矣血以榮肌肉肌肉者土也土之納潤必以陽煦陽不煦則水不入土矣故須煦而納之艾葉伏龍肝黃土水蘇若土頑礦則亦不受潤矣故須濡而納之地黃飴糖血以行經衇漓則不入經衇矣故須凝而入之戎鹽白膠經衇通始能受血窒則血不能入矣故須通而入之牛膝蠐螬大小薊其餘若血阻而生熱則清以通之羚羊角血停而化水則滲使下之桑根白皮超超元箸全從順化令流而不瀦起見洵與咳嘔有血者異吐唾血由血聚胃中致血聚胃中由飲食醉飽固已如上矣欲驗其果否血聚胃中當徵之於經衇要精微論曰肺衇搏堅而長當病吐血邪氣藏府病形篇曰肺衇微急為肺寒熱怠惰咳唾血謂之堅謂之急而定其部分於肺則是實非虛在上不在下可見然吐唾血者詎能絶無虛證即篇中地黃飴糖小麥牛膝謂其必因飲食醉飽而用可乎則邪氣藏府病形篇曰心衇微澀為血溢經衇篇曰足少陰是動則病飢不欲食咳唾有血喝喝而喘夫以主血之鄉而見澀沉靜之處而見動其為因虛無疑則地黃等物皆為是用歟要其為血聚於中則一也驗之之道凡咳血者必兼膿濁嘔血者必挾胃汁此則稠而不散醇而不厚滿而無形熱而不燥皆可證矣獨其與瘀血頗似相涉但瘀血凝而此不凝此動而瘀血不動要其歸則篇中之物亦可治瘀血瘀血篇所載亦可治吐唾血以意消息之可耳鼻衄血礬石寒療鼻衄藥性論蒲黃平止鼻衄藥性論蝦蟇藍寒掌氏曰天名精一名蝦蟇藍鼻衄不止雞蘇微溫掌氏曰水蘇一名雞蘇主衄血大薊溫止衄鼻艾葉微溫治心痛鼻洪日華桑耳平搗熬塞鼻治少小鼻衄遇勞輒出肘後竹茹微寒按別録第云皮茹治溫氣寒熱吐血不云治鼻衄蝟平皮燒末吹主鼻衄藥性論溺垽平療鼻衄藍寒主鼻洪吐血日華狗膽平燒亂髮微溫止血鼻衄燒之吹內立已藥對熱馬通微溫傅頂止衄使主鼻衄證類生地黃大寒衄鼻搗飲之詳核是篇治血中之水蝦蟇藍溺垽礬石蒲黃及自裏達表如絲如縷者竹筎蝟皮亂髮十居七八因悟金匱要略所謂尺衇浮目睛暈黃衄未止暈黃去目晴慧了知衄今止者為有合也夫尺部為水所居水之精微上出為目瞳子水中沉濁釀火隨經而上焉斯尺衇浮瞳子不慧而黑轉暈黃知衄當未止矣是治血中之水者泄其本根之濁自裏達表如絲如縷者除治其所由之道不使隨地有所脅從耳蓋衄從清道清道者必自陰及陽如六陽之衇皆上於頭然其起咸在四末是矣故不特陰中之火上冒清空能為衄也即如寒薄於下激陽不靖亦能致之則曰病人面無色無寒熱衇沉弦者衄非金匱之文歟不過尺浮在當衄之際沉弦在既衄已後然張後必翕焉知尺浮不轉為沉弦翕後更張可見沉弦能再為尺浮但就事論事見景生情則沉弦之治端有異於尺浮而篇中所載性溫及開發者雞蘇大薊艾葉馬通斷注意在是矣不然衇浮者何以計較其旨不止設使不衄不必論其止沉弦何以言其面無色無寒熱假令才衄面豈遽無色耶此衄皆自內發其自外因成者曰太陽病衇浮緊發熱身無汗自衄者愈傷寒衇浮緊不發汗因致衄者麻黃湯主之太陽病衇浮緊無汗發熱身疼痛八九日不解表證仍在此當發其汗麻黃湯主之服藥已微除其人發煩目瞑劇者必衄衄乃解陽明病口燥但欲漱水不欲咽者此必衄衇浮發熱口乾鼻燥能食者則衄則凡衄不特內因有異即外因且隨經殊狀焉夫陰中非乏水不生火陽中非氣盛不成熱乏水故火能升而不能降氣盛故熱欲外而不欲內假使火而能降原如環斯旋決不別趨歧徑熱而得外已遂所嚮往豈更妄作阻撓是故內因之衄由乎陰經乾涸火升而水不相濟外因之衄由乎陽經盛滿血降而氣不相隨此內外因之殊也太陽之熱充溢動蕩陽明之熱蓄聚蒸騰蓄聚則能礙降充溢則能助升故曰從春至夏衄者太陽正以其助升從秋至冬衄者陽明正以其礙降此獨外因之殊也由此以推則衄證可分六經論何則三陰在內三陽在外皆有開闔及樞觀乎陽應開而因不開為患乃助之開則陰應升而因礙升為患者則當引之升矣助開者麻黃湯引升者自裏達表諸味陰因闔而不化者既導之使下則陽之因闔不化者亦導之使下可見其在兩樞在陰治血中之水則在陽當治血中之火既有性溫開發之治陽則虛勞篇目暝悸衄之治為治陰又不可泯矣豫嘗謂仲景之書非疏為有經方補苴斯不疏而此篇者非不全以補苴仲景書而遂全此之謂也古有吐行濁道衄行清道之說而不言其理今玩此兩篇其理遂可明第吐唾血為血聚胃中有唐人之說為據衄血之所由來與據實亦所當申明者不然空演六經無謂也夫靈樞經衇篇曰足太陽之衇起目內眥上額交巔一支從巔入絡腦還出別下項一支從巔至耳上角足陽明之衇起鼻交額中旁納太陽之衇下循鼻外上入齒足少陽之衇起目鋭眥上抵頭角下耳後從耳後入耳中出走耳前至目鋭眥足太陰之衇連舌本散舌下足少陰之衇循喉嚨挾舌本足厥陰之衇上入頏顙連目系上出額與督衇會於巔其支從目系下頰而仲景云衄家不可發汗汗出必額上陷衇急緊直視不能眴不得眠則衄所從出皆額上鼻旁與系於目之衇從清空之道而出謂之清道不亦可乎然二道之治有相同焉者何也蓋天名精主瘀與小便不利大薊主腫與熱水蘇主下氣殺穀馬通主止血及疼痛生地黃主血上薄夫停即為瘀而所以停則或以穀氣之薰蒸或以水熱之上迫陽不下通則小便不利陰不相浹則為腫為痛此病於清道者可有病於濁道者亦可有也故不害其為同況吐與衄皆血上薄之所致乎此其同中仍有界限而非漫同異中具有條理而非絶異處也鼻𪖵通草平除𪖵鼻細辛溫除𪖵鼻桂心大熱主鼻𪖵蕤核溫微寒主𪖵鼻薰草平瓜蒂寒主腦寒熱𪖵鼻之病多矣曰鼽鼻寒塞也曰𪖦今所謂鼻流清涕曰淵鼻液常流而有穢氣也曰乾鼻燥也𪖵特其一端耳何以諸病咸不載而獨裁是耶夫鼽者𪖦者乾者皆乘六淫之激而成故隨外感為消長外感愈則其病自瘳無從別標治則淵則據險附巖能為勞傷外感樹幟矣然終乍作乍輟遇勞而發勞復輒平因感病來感解亦去茲固可治其勞與感不必別分門類也𪖵乃有壅之義焉較之於鼽則通而非塞𪖦則濁而不清乾則潤而不燥淵則常而不輟雖通而氣常不暢有涕而長壅不流甚則聲如從室中出而鼻且日腫大色赤此其根柢有風有溼有火有寒可以歷年不瘳可以畢生不愈斯其獨標一目竝立治法也固宜然則何以不用香藥宣通而用是夫香藥宣通仍是治塞不是治𪖵蓋在竅而言塞是從外窒內壅是從內障外故篇中諸味但玩蕤核之主心腹邪結氣及破心下結痰痞氣薰草之去臭惡氣細辛之溫中下氣破痰利水道開胸中即可見鼻氣之𪖵必係胸中臭惡邪氣結痰宿水翳障氣機之所為而通草之逐水桂之利肝肺氣瓜蒂之抽吮溼熱無不可一以貫之為治𪖵之本非治𪖵之標矣耳聾磁石寒除大熱煩滿及耳聾菖蒲溫平主耳聾蔥涕平雀腦主耳聾白鵝膏主耳卒聾以灌之鯉魚膽滴耳中主耳聾拾遺髓煮粥服治暴聾日華絡石溫微寒白頸蚯蚓寒大寒鹽霑為汁療耳聾藥對生麻油微寒君烏賊魚骨微溫臣治耳聾藥性論土瓜寒益氣愈聾烏雞膏寒肪主耳聾證類龍腦微寒膏主耳聾耳目之似天地大戴記曾子天圓篇曰天道圓地道方方曰幽圓曰明明者吐氣故外影幽者含氣故內影外影火與日也內影金與水也此似耳目之體吐氣者施含氣者化故陽施而陰化陽之精氣曰神陰之精氣曰靈神靈者品物之本此似耳目之用目之說見後以耳而言則幽者其分含氣者其才內影者其德然體非用不見用非體不立則非化無以見含氣之無滓非靈無以見內影之有朕惟其有朕而靈故能為含氣之歸致含氣使化納含氣於幽而聾之內因外因皆可於此驗矣夫靈之為言空也廣雅靈空也昭也左傳鄭昭宋聾莊子天地大愚者終身不靈釋文引司馬注靈昭也不空能令不昭不昭亦能令不空不空之聾為外因以含氣中有蕪雜也不昭之聾為內因以朕兆中不光澤也夫固曰金與水為內影也請假金水兩行喻耳聾之內外因按考工記攻金分職鑑燧所需偏資下劑鄭注謂金多錫則刃白且明亦以多金則堅剛多錫則白耐久而明耳而金久鍊不渝錫乃久鍊可燬則錫似精而金似氣金錫參半精氣適勻精藉氣以為空氣藉精以為昭設使精不給斯為內因氣蕪雜斯為外因理不可誣也水為坎坎之二陰外附正取其空一陽內藏確似其朕而水者濁則無影雖清而深且窅則亦無影求水之能照正猶求金之能照質欲其清體欲其薄不清則不昭不薄則不空矣篇中內因治則滋膏以膏之飛走之腴偏選其蔬食或不害生類者不求昭中有求空乎外因治則荄蘇以剃之辛苦之烈偏選其味薄或體含滋汁者不求空中有求昭乎而磁石之引金合水尤為至元至妙以是悟用藥治病參病掄藥昭昭然道也進乎技矣鼻息肉藜蘆寒微寒療鼻中息肉礬石寒去鼻中息肉地膽寒蝕鼻中息肉散結氣通草平療息肉白狗膽平主鼻𪖵鼻中息肉藥性論藥對細辛溫君桂心大熱治鼻息肉藥性論瓜蒂寒臣去鼻中息肉證類雄黃平大溫療鼻中息肉王太僕謂息為死肉病能篇夫癰氣之息者注蓋惡肉贅疣之類也而息之詁可為生史紀孔子世家自大賢之息索隱息者生又可為滅禮記中庸則其政息注息猶滅也則其物能不假擁腫而生無藉潰膿而滅潛滋暗長如所謂息壤者山海經海內經鯀竊帝之息壤以湮從水注息壤者言土自長息無限卻又不礙起居無妨飲食隨其所因以生屆其分遂已有寧靜休止之義焉左昭八年臣必致死禮以息楚注息寧靜也禮記樂記著不息者天也注息猶休止也所因奈何巢氏云肺氣通於鼻肺藏為風冷所乘則鼻氣不和津液壅塞而為鼻𪖵冷搏於血氣停結鼻內故變生息肉是也其分奈何篇中羅列藥物所該主治是也蓋惟其與鼻𪖵同源故篇中所列九味僅異其五惟其鼻𪖵言風故病及津液此不言風而言血故病及肌肉夫均冷也從風搧則散被血攝則凝散者宜隨而逐之凝者宜搜而剔之以故劫痰藜蘆劫火雄黃卻溼礬石散結地膽去瘀白狗膽無一善類較之與鼻𪖵同用之物良劣殊不相侔蓋取其針孔相符於去惡肉死肌又取其帖切於橫梗氣道之惡肉死肌此古人治病專著意處若今人則通肺化痰利溼清火開結去瘀泛遴混使以為隔膜之治無怪獲效之難也雖然鼻息肉非要病也非急病也其全備此篇藥治之乎抑逐一遍試之乎是又非矣蓋必盡其兼病應用之物而引以此篇一二味與病證偏重處逼真的對者其庶乎如桴鼓云目赤熱痛黃連寒微寒主熱氣目痛眥傷泣出明目蕤核溫微寒主明目目赤痛傷淚出石膽寒主明目目痛空青寒大寒主青盲明目療目赤痛去膚翳曾青小寒主目痛止淚出決明子平微寒主青盲目淫膚赤白膜眼赤痛淚出檗木寒療目熱赤痛梔子寒大寒療目熱赤痛薺子溫主明目目痛苦竹葉大寒主目痛明目利九竅雞子白微寒療目熱赤痛鯉魚膽寒主目熱赤痛青盲明目田中螺大寒主目熱赤痛止渴車前子寒明目療赤痛菥蓂子微寒主明目目痛淚出藥對細辛溫明目君止眼風淚下銅青寒主風爛淚出明目去膚赤秦皮微寒主目赤熱淚出去肝中久熱兩目赤腫疼痛風淚不止石榴皮溫主目赤痛淚下使取汁止目淚下白薇大寒主目赤熱據大戴記曾子天圓篇之義以言目則明者其分吐氣者其才外影者其德而目熱赤痛為其外因目膚翳四十八為其內因矣惟內因故不痛惟外因故無不痛然就痛之中仍有發於內襲於外者當析焉發於內者六淫已著於藏府藏府氣血不咸蘊釀而及目襲於外者六淫先著於眥眶眥眶被灼潰腐而及目就巢氏病源稽之則凡傷爛腫脹皆外襲者也焮赤淚出皆內發者也然目固火也六淫何以竝能病火六淫之中何以火復病火者居多蓋目以明為本明以燭物為功其不明固當屬內因矣若火自明緣隔蔽不能及物遂無明之用則六淫何者不可為且惟同氣相投之火尤足譸張何則燭物之火猶燈燈惟藉膏膏者木於土中浥水精所為也尤貴其量輕重遠近與火悉稱燈光乃清光清矣苟燔燎之火薰炙之火置於其旁煙焰騰湧最能隔蔽至溼氣之瀰漫風氣之簸搧均無異也而惟寒氣憑陵能縮其威不能蒙其照理固如是能不謂六淫所為哉請析篇中腫脹為溼傷爛為溼火淚出為風痛為火言痛赤者為兼涉血分言明目者為兼及內因而核其物潤燥之性散泄之宜升降之能補瀉之用更彙而論之遂昭昭然可知其目之病狀而無漫投遍試之弊矣夫瀉火本以救火已甚難乎為繼況治寒須熱治溼須燥治風須散又欲其不助火之焰致火之炧故必令柔巽而入先與之帖切近已周旋排解然後從而誘掖之化導之俾各自順從解釋明者復明而無一味剋制逆折之物於其間觀乎其用清者避滋用滋者避膩用開者以消散用逐者以通順又妙在即中空之清汁益中空之陰氣而解浮蘊就中貯之寒氣發中貯之陰氣而除煩懊要在使其吐氣而已世皆憎治目疾者善投寒涼若用寒涼而措思及此又何可憎哉目膚翳秦皮微寒大寒除熱目中青翳白膜細辛溫久服明目真珠寒粉點目主膚翳障膜貝子平主目翳石決明平主目障翳痛青盲麝香溫去目中膚翳馬目毒公溫微溫去目中膚翳伏翼平主目瞑癢痛明目夜視有精光青羊膽平主赤障白膜風淚點睛中蠐螬微溫微寒目中淫膚青翳白膜蜀本石蟹寒主青盲目淫膚翳及丁翳藥對丹沙微寒益氣明目目膚翳視目熱赤痛為病在內矣然猶多由外邪其純屬內因者又非此篇藥物所能治凡金匱虛勞篇所為目瞑千金外臺肝腎虛寒所謂目䀮䀮無所見及失明眼暗青盲者是也而目膚翳之支流又有暈有淫膚有膜有障有丁其大較在病源曰陰陽皆上注於目若風邪痰氣乘於腑臟腑臟之氣虛實不調遂衝於目而不散晴上有物如蠅翼名曰膚翳若肝藏不足為風熱所干晴亦生翳翳久不散漸漸侵覆瞳子若肝藏血氣蘊積衝發於眼津液結聚遂成珠管若藏府虛風隨目系入腦則令腦轉目系急目眴而眩若肝虛受風搏於精氣致精氣聚於白睛繞於黑睛精采昏濁黑白不分謂之暈若肝經虛為風熱所乘致血衇生於白睛謂之飛血皆其類也篇中亦既分析昭列每味下矣然其旨趣確誠注意在肝肝即前篇所謂木浥土中水精以為膏者而此類病則皆膏中蕪雜致燈不明之候也膏中蕪雜不澄泌其內而磨鑢其外不澡雪其外而清肅其中則亦良以病雖根內內猶散而外已著若刈草然根魁碩者劚葉豐茂者剃固宜如是耳觀其磨翳之物外雖礦而內則明真珠貝子丹沙石決明石蟹清肅之物性雖寒而氣則散秦皮委曲內臟者飛觸蠕動以使其內出伏翼青羊膽蠐螬汁堅牢難拔者割剝薰燎以使其外揭麝香馬目毒公仍不忘招徠安奠之意微逗其間兔絲子使人知舉一反三而精衰光散者猶得有所遵循也聲暗啞菖蒲溫平出音聲石鍾乳溫能通聲藥性論孔公孽溫能使喉聲圓亮藥性論皂莢溫治中風口噤藥性論苦竹葉大寒瀝中風失音不語藥性論麻油微寒藥對通草平利九竅出聲臣出音聲聲以詔聰聰以納聲是故暗啞與聾源同而派別第聲主發聰主受故聲者資乎水而發乎金聰者因乎金而受乎水以鑑喻聰即可以鐘喻聲乃其質則鐘出上劑鑑出下劑此為異矣金多於錫為上劑六分其金而錫居一謂之鐘鼎之劑金錫半謂之鑑燧之劑鑄金之狀黑濁之氣竭黃白次之黃白之氣竭青白次之青白之氣竭青氣次之然後可鑄夫錫易燬金難銷功候既屆純青恐無論上劑下劑其錫皆已竭矣而善化氣者水善範氣者金則音聲者必使水盡化入金然後從金而出故曰資乎水而發乎金正與聰之藉道於金而并化於水者適相對也然病於聲者不一何以皆不列治惟喑啞特著哉蓋彼焦殺亢厲者湮鬱不暢者湫隘曲細者急遽迫促者此所謂薄厚之所震動清濁之所由出侈弇之所由興侈微張貌已厚則石已薄則播侈則柞除草曰芟除木曰柞弇則鬱長甬則震大而短則疾而短聞小而長則舒而遠聞此猶鐘然由稟賦之不齊非病也非藥之所能治也若醫經之聲嘶聲嗢聲亂咽嘶舌痿聲不得前聲嗄經方之因病失音不語皆緣他患連纍及聲非聲獨自為病他患愈聲亦隨之愈故皆不得列治而惟暗啞之不由他纍者得特著焉然暗之與啞又應分別暗者無聲啞者有聲觀篇中有竝提聲音者有獨標聲獨標音者大率聲者音之概音者聲之成聲發於水音成於金是聲為本音為標故治水者其力全治金者其功偏也至如誤服毒藥而失音叫囂竭力而聲啞是又在似病非病間治之自別有道即不治亦能自復又不可與是竝論矣面皯皰兔絲子平汁去面䵟麝香溫去面䵴熊脂微寒微溫去面皯皰治面上䵟𪒟及治瘡藥性論女萎平久服去面黑䵟好顏色潤澤去䵟皰藥性論去皮膚疵皯酒齄粉刺日華藁本溫微寒長肌膚悅顏色辟霧露潤澤木蘭寒去面熱赤皰酒皶梔子寒大寒胃中熱氣面赤酒皰皶鼻紫草寒以合膏療面皶白瓜子平寒令人悅澤好顏色去皮膚風剝黑䵟潤肌膚日華藥對蜂子微寒君酒漬傅面令面白悅白斂平主光澤治面上疱瘡藥性論白朮溫君主面光悅駐顏去䵟藥性論山茱萸平臣去面皰除面上瘡藥性論治酒皶日華證類冬瓜子平寒即白瓜子不知何故重出白殭蠶平滅黑䵟令人顏色好蜀葵花平白附子平面上百病行藥勢巢氏云面皰者謂面上有風熱氣生皰頭如米大亦如穀大白色者是面皯䵴者由風邪客於皮膚痰飲漬於府藏故生於面皮或如烏麻或如雀卵上之色者是面皶者由飲酒熱勢衝面而遇風冷相搏令面鼻生皶赤皰匝匝然者是曰風熱氣曰風邪客於皮膚曰飲酒後熱氣在面遇風冷相搏則均外感也外感何以不發於遍身而獨生於面部哉夫固有故矣蓋任禦邪者惟陽氣頭面固諸陽所共至亦陽氣停頓處也何則手三陽皆終於面足三陽皆始於面經衇所終始分支必多多則力分而行不迅其遲留伏匿固宜何況一身皆裹面獨不衣是其受感自當較易且其邪不流於榮衛為發熱惡寒不行於經衇為汗出惕瞤不入於肌肉為身體煩重不攢於筋骨為疼強牽掣而獨滯於皮膚面皮本最厚靈樞邪氣藏府病形篇諸氣之津液皆上薰於面而皮又厚故尤能藏邪匿滯是以不布於周身耳然觀篇中用藥不重搜風不重去滯而惟取其色白及潤者居十八九何也考玉篇皯面黑氣也䵴面黑也䵟黑也皻皰也今作齇齇鼻上皰皰面皮生氣也因是知病源所謂如米如穀者皆言其大小非言其高突故又云或如烏麻或如雀卵皆言其色非言其形就舉篇中所列藥味主治而言則黑星黑點為斑為暈或疏或密固已十得八九矣色黑則治以白氣滯則治以潤滑謂非的對可乎況但云皰皶者寥寥然亦為面皮生氣是亦不能逃滑潤之治矣即其本雖為風為熱為痰為滯然既成是病獨著是形卻又不能捨去現在而專討論已往且散風清熱除痰疏滯之物固自有在耶髮禿落桑上寄生平堅髮齒長鬚眉秦椒溫生溫熟寒堅髮齒桑根白皮寒椹變白髮為黑又拔去白者以椹汁點孔中即生黑者麻子平長髮益毛髮日華桐葉寒沐髮去頭風生髮滋潤藥性論豬膏微寒和生鐵煮沸塗髮千金翼雁肪平長毛髮鬚眉馬髻膏平主生髮松葉溫生毛髮棗根雞肪掌氏曰藥對云寒荊子微寒溫掌氏曰本經有蔓荊牡刑此只言荊子據朱字合是蔓荊子及據唐本云味苦辛故定知非牡荊子矣蔓荊實能長鬚髮藥性論禿有兩端一者虛人髮不向長或病後髮落不更生一者因瘡髮墮說文云禿無髮也鬜鬢禿也釋名云禿無髮沐禿也毼頭生創也頭有瘡曰瘍毼亦然也是漢魏之間猶有分別巢氏云人血盛則榮於頭故鬚髮美若血氣衰弱經衇虛竭不能榮潤故鬚髮禿落又云蟯蟲發動最能生瘡乃成疸癬瘑疥白禿者由此蟲在頭生瘡結白痂甚癢其上髮竝禿落不生謂之白禿若無白痂而有汁皮赤而癢則謂之赤禿是隋唐間雖有分別然謂之禿則均矣因蟲之治當求之惡瘡篇此篇則因虛因病之禿而禿與落又當兩途視之蓋禿者不長茂也落者不更生也然玩篇中所載諸物主治又不止兩途曰堅則能使其不落曰長則因其所有而長之曰生則因其所無而生之若地於草木然欲其不雕須培欲其長茂須灌苟欲其生則不直培之灌之而已將必布之種焉故篇中於生之一類不特令人憬悟且將解頤也沈存中謂髮屬心稟火氣故上生鬚屬腎稟水氣故下生眉屬肝故側生斯言似甚合理孰知靈樞二十五人篇言之尤詳曰足陽明之上血氣盛則髯美長在頤曰鬚在頰曰髯血少氣多則髯短氣少血多則髯少血氣皆少則無髯足陽明之下血氣盛則下毛美長至胸血多氣少則下毛美短至臍血氣皆少則無毛有則枯悴足少陽之上氣血盛則通髯美長血多氣少則通髯美短血少氣多則少鬚血氣皆少則無鬚足少陽之下血氣盛則脛毛美矣血多氣少則脛毛美短血少氣多則胻毛少足太陽之上血氣盛則美眉眉有亳毛血多氣少則眉惡手陽明之上血氣盛則髭美髭口上鬚也說文血少氣多則髭惡血氣皆少則無髭手陽明之下血氣盛則腋下毛美手少陽之上血氣盛則眉美以長手太陽之上血氣盛則有多鬚皆與沈說不同蓋沈自據理靈樞則指經衇所屆而言以愚意權之則指經衇所屆而言乃有補於徵驗據理而言則眉惡而補肝鬚少而補腎恐終無益但靈樞獨不言髮之美惡長短則頗缺漏倘欲例此而續之在素問則六節藏象論曰腎者精之處也其華在髮若據經衇所屆言則督衇也足太陽也足厥陰也皆至於髮之根再據前說血盛者美氣盛者長又可推見不生者血氣皆少生而不長者氣少長而不澤者血少然此皆言其故非言其治也若據此而為之補血補氣誠可謂針孔植鬚矣總之事補益循經絡皆不可廢尤不可鑿要當於此篇之中咀其味摘其元化而裁之如以髮為藥物則能利小便止血仍自還神化則固小便充血衇者均可有濟於髮矣擴而充之例以馬䰇膏則凡多髯獸之膏均可增鬚之美例以松葉則凡根繁之草木類可益鬚之長宗此意而讀千金方外臺祕要方發人神智不少也或曰人本老則髮墮而眉反長何也夫惟於此尤可見靈樞素問之說為長矣蓋人之易盡者陰也血也而氣則必不息息則死矣天癸之至與竭以上古天真論而言其主皆在腎以六節藏象論而言髮為腎之華是故腎氣漸衰則天癸日減於下而髮遂日耗於上其致一也眉則主於足太陽手少陽是二經根本專司消息水火於下自幼而壯壯而老同出一轍不易衰也況老人頤養如法者既無嗜欲之火攪亂於中下而火益順水益清其反長也固宜滅瘢鷹屎白平主傷撻滅瘢白殭蠶平滅諸瘡瘢痕衣魚溫塗瘡滅瘢白附子平主一切冷氣面皯瘢疵證類蜜陀僧平治金創面上瘢皯面膏藥用之聖濟總録謂風熱諸毒留於府藏發於肌肉而為瘡癤病已瘡愈餘毒未殄故瘡痂落而瘢痕不滅治法既有塗澤膏潤之劑亦須賴榮衛平均肌溫氣應外宜慎風冷也據此以核本篇則所列之外調榮衛溫肌肉尤為要著矣若但據本篇而言鷹屎白主撻傷瘢蜜陀僧主金瘡五十三瘢白附子主冷瘡瘢則白殭蠶主風瘡瘢衣魚主溼瘡瘢矣數瘡之外遂無瘡乎他瘡之愈能無瘢乎說者謂白殭蠶縱死不浥爛變色衣魚隨行皆有迹而拭之輒滅鷹所食物其色皆濃厚而屎且白均可為泯迹之用而白附子之助藥勢蜜陀僧之剷壘突任諸瘡奇幻均可已之是矣然諸物皆色白倘本白而染他色用之固宜設黃赭蒼黧者緣患瘡而餘白瘢猶得以是滅之乎且諸物者其力皆行於面今但曰滅瘢則不特面瘢而已一身之瘢皆可以是滅之乎以是知猶係舉一反三之旨欲人循此自多讀書而悟會焉耳不然獺髓滅瘢白玉平痕昭然在冊乃皆不可信耶金瘡石膽寒治金瘡牆薇溫微寒金瘡傷撻生肉復肌地榆微寒療金瘡止膿血艾葉微溫乾者煎治金瘡食療王不留行平主金瘡止血逐痛白頭翁溫逐血止痛療金瘡釣樟根溫皮主金瘡止血石灰溫止金瘡血和雞子白敗船筎甚良藥性論狗頭骨平主金瘡止血蜀本薤白溫主金瘡止痛瘡中風水腫臣車前子寒止血葉及根主金瘡止血當歸溫君主金瘡蘆籜寒主金瘡生肉使桑灰湯平臣按桑灰孟詵云煉五金家用不云治金瘡惟桑白皮主縫金瘡桑葉治撲損瘀血耳蛇銜微寒臣主金瘡葛根平臣療金瘡止痛證類水楊花寒柳花主金瘡突厥白寒主金瘡生肉止血補腰續筋聖濟總録曰金刃所傷瘡有微甚生死所係要在原經絡所在觀變動之形察微妙之衇葛稚川曰天窗眉角腦戶臂裏跳衇髀內陰股兩乳上下心鳩尾小腹及五藏六府俞皆不可傷此所謂原經絡所在也腦破出血戴眼直視不能語言咽中傷聲嘶急舌出兩手妄舉肌肉不生按之乾急或青黃汁出或瘡邊寒青肉消殠敗或先出赤血後出黑血或血出不止白汁隨出皆不可療此所謂觀變動之形也疹其衇虛細小者生微細遲者生反此為難治此所謂察微妙之衇也而病源載其分析有血出不止有內衄有筋急相引痛不得屈伸有傷筋斷骨有中風發痙有驚痙有驚悸有煩有咳有渴有蟲出有著風有著風腫有癰腫有風水甚者有斷腸有腸出有金刃不得出有下血虛竭有久不差不可以一二端窺也獨奈何以不足二十物者印定人眼目為治金瘡通用哉且照證科分指明某物治某證猶之可矣乃偏列藥十有八味而止血者居其八生肉者居其三止痛者居其四混云治金瘡者居其五而於前所臚兼證僅及中風水腫及補腰續筋數端謂為備則疏漏已甚謂為不備偏又有一支一節存於其間是果何說也哉殊不知驚悸者煩者渴者蟲出者癰者水者既有專門皆曾列治惟其血出不止不可與吐衄竝論疼痛筋攣不可仿溼痹為治而斷折而刃留皆他病不能兼有者至中風則與中於腠理者異水入則與水停者不同故微逗其義略引其端使人知循病本之絶殊參病情之究異俾求治法於他門不至刻舟求劍與泛常關於此備於彼者為迥不侔矣雖然其中具寒溫與平之性行氣行血之殊散逐補苴之宜去敗生新之效詎可任拈一物浪治一證哉亦自有針孔相符處但觀其一物兼列數效者可差識其緒矣再試思金匱要略王不留行散為治金瘡第一經方僅得是篇二味其餘寒如黃芩芍藥熱如蜀椒乾薑竝與金瘡無涉卻故用之何也又思肘後外臺每每單拈一味使治金瘡竝非是篇所有卻又何故譬如甘草本經明明載主金瘡腫而未列此篇欲使人舉一反三從中會悟耳踒折生鼠微溫牡鼠療踒折續筋骨搗敷之生龜平身腫踒折食療生地黃大寒主墮墜踠折瘀血留血烏雄雞血平主踒折骨痛烏骨雞平李核仁平主僵仆躋瘀血骨痛蜀本自然銅平療折傷散血止痛木鱉子溫主折傷散結腫骨碎補溫補傷折無名異平主金瘡折傷內損止痛生肌肉藥對續斷微溫臣主金瘡癰傷折跌續筋骨金瘡血內漏止痛踒說文玉篇皆云足跌也踒折後人或謂之被打千金或謂之腕傷病源或謂之傷折聖濟或謂之跌仆損傷今人其意皆無踒折二字之周蓋為人所侮不過力不相及在傷者本無病也而有氣憤之兼暴折之歉若但蹉跌則或以眩暈或以驚觸或以下弱或以失足或從車覆或從騎蹶或因道滑或因巉巖當時之情景不同則受傷之淺深自別而氣血之違從遂殊曰足跌而致折則人之相加己之失誤并宿疾之發動無不由之矣故謂之周然其間派別猶有頭破腦出折骨傷筋壓迮墮墜內損中風發痙發腫諸異除此之外則無不有瘀而瘀又有新者久者皆按篇中可循條理而得其緒夫在血曰瘀曰內漏曰止曰散可想見其傷折後血之情形在跌曰墮墜曰僵仆躋可想見致傷折之景狀在痛曰骨曰腕曰腫曰折可想見受傷折之部位而所列之物偏選其跌而不傷者鼠開而能闔者龜折而可聯者雞外雖斷而中仍連者地黃續斷擊之可碎鎔之可合者自然銅紫爛於外青白其中者李皆使元氣不隨傷而傷不因折而折耳至因是而幻成他候則仍有本類可稽取治則於彼焉瘀血蒲黃平消瘀血琥珀平消瘀血通五淋羚羊角寒微寒去惡血注下牛膝平逐血氣傷熱婦人月水不通血結逐惡血留結藥性論大黃寒大寒主下瘀血血閉寒熱乾地黃寒逐血痹破惡血通血衇朴消寒大寒破留血閉絶紫參寒微寒療腸中聚血散瘀血主心腹堅脹藥性論桃仁平主瘀血血閉瘕邪氣虎杖微溫破留血癥結茅根寒除瘀血血閉寒熱䗪蟲寒破瘀下血閉虻蟲微寒木虻主瘀血血閉蜚虻主賊血在胸腹水蛭平微寒逐惡血瘀血月閉破血瘕積聚蜚蠊寒主瘀血通利血衇蜀本天南星利胸膈散血藥對鮑魚溫主踒跌除瘀血痹在四肢不散飴糖微溫去血病臣止渴去血神屋平主血敗龜治血麻痹庵閭子微寒主藏血身中有毒臣主五藏瘀血心下堅芍藥微寒主逐賊血除血痹通順血衇緩中散惡血逐賊血鹿茸溫主血流在腹臣車前子寒主瘀血痛葉及根主瘀血血瘕下血牡丹微寒主除留血使主癥堅瘀血留舍腸胃射干微溫主除留血老血使療老血在心脾間咳唾言語氣臭藕汁寒主消血破産後血悶天名精地菘是也寒主瘀血血瘕欲死玩篇中端緒甚繁第一先剖其瘀之情狀則濡遲有待曰留篇中凡朴消牡丹射干皆治留血壅塞不通曰閉大黃茅根䗪蟲虻蟲桃仁皆治血閉積久而朽曰老射干主老血扼困垢穢曰惡羚羊角牛膝乾地黃水蛭皆治惡血敗類害良曰賊虻蟲芍藥皆主賊血其次當究其瘀之部分則在內曰腸中紫參療腸中聚血曰腹中鹿茸主血流在腹曰胸腹蜚虻除賊血在胸腹曰心脾射干主老血在心脾間曰心腹紫參散瘀血主心腹堅脹曰胸膈天南星利胸膈散血在外曰血衇乾地黃主通血衇蜚蠊主利血衇芍藥主通順血衇曰四肢鮑魚主血痹在四肢其次當審其瘀之為病則曰寒熱大黃茅根皆主血閉寒熱曰淋琥珀主消瘀通五淋曰注下羚羊角主惡血注下曰渴飴糖主止渴去血曰麻痹敗龜主血麻痹曰癥瘕桃仁主血閉瘕邪氣虎杖主留血癥結水蛭主血瘕積聚車前根葉主血瘕下血牡丹主癥堅瘀血留舍腸胃天名精主血瘕欲死曰月水不通牛膝主月水不通血結水蛭主瘀血月閉曰踒跌鮑魚主踒跌條分件析皆有循緒以通特已後經方治是均附載他門不別標統領遂使內有瘀血無以悉其外見情形是蓋當細核焉夫仲景書雖云不無疏漏要其徹源徹委處未嘗不綱舉目張何為源病因是也何為委病處是也病形則有內外之殊內因者所謂食傷憂傷飲傷房室傷飢傷勞傷經絡榮衛傷外因者瘀或比於風桃仁承氣湯證或比於熱抵當湯丸證或比於水大黃甘遂湯證皆所經見於書者也病處則有上下之別在上者為肌膚甲錯兩目黯黑大黃䗪蟲丸證為其人咳口乾喘滿咽燥不渴多唾濁沫時時振寒熱之所過血為凝滯畜結癰膿唾如米粥肺癰證在下者為著臍下腹痛下瘀血湯證在少腹不去溫經湯證少腹滿如敦狀小便微難而不渴大黃甘遂湯證經水閉不利藏堅癖不止下白物礬石丸證亦所經見於書者也但其所陳不若此篇之備然據所謂如狂喜忘少腹滿而小便自利衇微而沉衇沉結屎雖硬大便反易其色黑無表裏證而發熱衇浮數雖下之衇數不解消穀善飢其景其情在內在外固已略備其概矣而其最有致者曰病人胸滿唇痿舌青口燥但欲嗽水不欲咽無寒熱衇微大來遲腹不滿其人言我滿為有瘀血曰病者如有熱狀煩滿口燥而渴其衇反無熱此為陰伏是瘀血也曰婦人年五十所病下利數十日不止暮即發熱少腹裏急腹滿手掌煩熱唇口乾燥此曾經半産瘀血少腹不去統而言之已見熱標而無熱證衇無熱象者瘀也有所阻則應有所不通有所阻而氣化仍通者瘀也竝無所阻而自謂若有所阻者瘀也有燥象而不渴不應渴而反渴者瘀也蓋氣以化而行血以行而化氣已行而結者猶結則非氣病況血應濡而不濡實未枯而似枯是非有瘀何由得此哉故曰仲景書雖似疏然得為是編之綱是編雖密僅能為仲景書之目者此也火灼柏白皮微寒主火灼爛瘡生胡麻平潤五藏主火灼食療鹽寒豆醬寒湯火燒灼未成瘡用汁點之井底泥寒治湯火燒瘡用之醋溫黃芩平大寒下血閉惡瘡疽熱火瘍牛膝平主傷熱火爛梔子寒大寒集驗云凡被火燒者初慎勿用冷水冷物并井下泥火創得冷即熱氣更深轉入至骨爛壞人筋攣縮者良由此也病源千金亦云然聖濟總録亦深禁冷物淋搨又云水火之氣當因其勢而利導之湯火誤傷毒方熾通導而泄其氣可也本非氣血所生病故治不及於湯液特在乎塗敷膏浴治其外而已乃本篇直列井底泥於中何哉夫別録固謂為湯火燒創用之矣核之以豆醬下之未成瘡用汁點之之語則固用於後而非用於初者也大抵齊梁及唐皆尊信是編而是編者又祇列其物而不下其物注腳則恐後人宗之者漫拈以取快一時不計後日深害耳其實有何不可用哉然據此已足見已成瘡未成瘡宜分兩途治矣再考千金外臺凡治此者多以膏油調敷幾乎無方不然而本篇所載僅止九物醞釀蒸暴而成者鹽醬及醋已得其三即井底泥之柔冷難燥柏皮胡麻之多脂又得其三其餘則牛膝以遏其上游梔子以醒其變色黃芩以界其腐潰耳而居其前者果何為者耶夫蒸盦不至臭敗暴炙不為消泯反能成淨潔之質芳香之氣以助人元氣者何不可救人被蒸盦暴炙之害且能耐蒸盦暴炙者惟滋膏潤澤耶是二端者一以其受成艱苦化患害於方殷一以其秉賦豐腴拒侵軼之盛熾曾謂無故也哉而千金外臺意即可於是徵之矣癰疽絡石溫主風熱死肌癰傷口乾舌焦癰腫不消黃芪微溫主癰疽久敗瘡排膿止痛白斂平微寒主癰腫疽瘡散結氣止痛除熱烏喙微溫主癰腫膿結通草平散癰腫諸結不消敗醬平微寒主癰腫浮腫結熱白芨平微寒主癰腫惡瘡敗傷陰死肌大黃寒大寒傅一切瘡癤癰毒日華半夏平生微寒熟溫消癰腫元參微寒散頸下核癰腫薔蘼微寒主癰腫惡瘡敗瘡熱氣陰蝕不廖鹿角溫微溫主惡瘡癰腫逐邪惡氣留血在陰中蝦蟇寒主癰腫陰瘡土蜂子平主癰腫嗌痛伏龍肝微溫與醋調塗癰腫甘焦根大寒主癰腫結熱藥對礪石火燒於苦酒中淬破醋和帖之即消北史方技馬嗣明傳練石法以粗黃色石如鵝鴨卵大猛火燒令赤內醇醋中自有石屑落醋裏頻燒至石盡取石屑曝乾搗下篩和醋以塗腫上無不愈烏賊魚骨微溫臣主陰蝕腫痛鹿茸溫臣散癰腫骨中熱疽癢升麻微寒帖諸毒君療癰腫水煎綿洗拭瘡上赤小豆平主帖腫易消臣排癰腫膿血側子大熱主癰腫曹青巖曰癰疽雖寒熱邪氣所為實因氣血壅瘀而致故內無壅則邪氣侵襲僅生疾病內有瘀則邪氣依附遂發癰疽病源曰六府主表氣行經絡而浮不和則邪氣乘而為疽是癰邪淺而輕疽邪深而重然靈樞癰疽篇有名癰而深重名疽而淺輕者是癰疽之名不必泥淺深之致亟當辨也蓋邪結輕淺雖血肉腐壞瀉膿可瘳邪結深重則經衇敗漏傷藏以死治外實者開之治內虛者托之血瘀則通氣壅則宣所謂因其輕而揚之因其重而減之責虛取實適事為故也豫不善治瘍然嘗聞之治瘍猶治傷寒也傷寒首論外解未解瘍則先分已潰未潰傷寒次審裏實不實再察有無虛象瘍則亦然是故瘍之始治自有條理與傷寒迥殊若其初作已挾虛方膿而挾實與夫內搏而傳陰外開而不闔種種與傷寒同即以傷寒法治之可也今觀篇中皆始條理事而其委曲周折當異於傷寒處剖析綦詳如分別部位則曰頸曰嗌曰陰是其所至之上下可見矣研核久暫則曰散曰消無非開首之治曰排曰止痛無非成膿之治皆在未潰之前是其所在之淺深可見矣至諦審名目則曰腫曰結腫則有浮有堅結則有氣有熱有膿此亦未潰前事是其所受之來源可見矣推究極盡則曰敗曰傷皆已潰後事是其所留之禍患可知矣而又不遺傅帖之術膏摩之方蓋亦明明示人以除是已外儘可同他疾一例治也雖然題曰癰疽篇中列藥二十二味乃疽字祇兩見餘則盡屬治癰未免偏重不均夫是亦傷寒例耳回檢傷寒篇起首之治即無桂枝外解而後凡為補為溫纖悉不載以傷寒實證正治原已具於篇中調和溫補乃借虛證之治以治傷寒非傷寒正法也則於此篇遂可識疽證純宜用補無他別法即其僅一見於黃芪再見於鹿茸可以會悟矣若其入後之治本與癰同癰且不載補劑疽更何勞獨出不又有例可循耶惡瘡雄黃平寒大溫主惡瘡疽痔死肌雌黃平大寒主惡瘡頭禿痂疥下部䘌瘡粉錫寒療惡瘡石硫黃溫大熱主婦人陰蝕疽痔惡血及惡瘡下部䘌瘡止血殺疥礬石寒陰蝕惡瘡松脂溫主疽惡瘡頭瘍白禿疥瘙風氣蛇牀子平主惡瘡地榆微寒主惡瘡熱瘡水銀寒主疥瘻痂瘍白禿蛇銜微寒主惡瘡頭瘍白斂平微寒主癰腫疽瘡散結氣止痛漏蘆寒大寒主皮膚熱惡瘡疽痔作浴湯主熱氣瘡癢如麻豆檗木寒主陰傷蝕瘡口瘡占斯溫主寒熱疽瘡惡瘡癰腫雚菌平微溫去長患白㿅瘑疽㿅同癬莽草溫主風頭癰腫乳癰除結氣疥瘙青葙子微寒主邪氣皮膚中熱風瘙身癢惡瘡疥蝨下部䘌瘡白芨平微溫主癰腫惡瘡敗傷陰死肌楝實寒主疥瘍及己平主諸惡瘡疥痂及牛馬諸瘡狼跋平主惡瘡瘑疥桐葉寒主惡賊瘡著陰虎骨平主惡瘡豬肚微溫䕡茹寒微寒主蝕惡肉敗瘡死肌排膿惡血藜蘆寒微寒主頭瘍疥瘙惡瘡石灰溫主疽瘡疥瘙熱氣惡瘡癩疾死肌墮眉療髓骨疽狸骨溫主惡瘡鐵漿平治時氣病骨中熱生疱瘡豌豆瘡飲之差梅師方蜀本野駝脂主頑痹風瘙惡瘡毒腫死肌筋皮攣縮藥對苦參寒主諸惡瘡軟癤君療惡瘡下部䘌白石脂平主疽痔惡瘡臣蘩蔞平主積年惡瘡臣藁本溫臣治皮膚疵䵟酒齄粉刺菖蒲溫主風瘙君主癰瘡治惡瘡疥瘙艾葉微溫苦酒煎主除癬及下部瘡臣療下部䘌瘡槲皮平臣治惡瘡煎湯洗之藥性論葵根寒君主惡瘡柳華寒主馬疥惡瘡煮洗立差使痂疥惡瘡五加皮微寒主疳瘡使主疽瘡陰蝕梓葉微寒使主爛瘡苧根寒主小兒赤丹使穀葉平洗之令生肉臣萹竹平主浸淫疥惡瘡使主浸淫疥瘙疽痔女子陰蝕大麻平臣嚼塗治小兒疳瘡子母祕録孔公孽溫主男女陰蝕瘡臣主邪結氣惡瘡疽瘻痔紫草寒主小兒面上瘡使馬鞭草平主下部瘡臣主下部䘌瘡曹青巖曰癤疽癬疥皆惡瘡也病源曰肺主皮毛脾主肌肉氣虛腠疏則溼邪乘入化為熱毒侵食肌膚浸漬血衇癤疽則或腫或腐疥癬則為痛為癢延擾日久變化生蟲淺則外淫深則內薄既宜化其濁穢又當潔其膿腐然毒本散漫藥峻則傷氣血藥緩則邪淹留欲弭其患必於宣逐之中寓以抵罅補隙則邪氣去而絡隧寧矣按本篇除異名同患異文同義如㿅即癬釋名癬徒也侵淫移徙日廣故青徐謂癬為徙也音義引此作㿅瘙即疥之所苦釋名疥齘也癢搔之齒䫴齘也癢即瘙之所由釋名癢揚也其氣在皮膚中欲得發揚使人搔發之而揚出也痂即創之所結外曰疽曰禿曰䘌曰瘑曰癩曰癤曰丹病源曰體虛受風熱溼毒與氣血相搏則發惡瘡癢痛焮腫而多汗身體壯熱癬者風溼邪氣客於腠理復值寒溼與血氣相搏則血氣否澀皮肉隱疹如錢文漸漸增長或圓或斜有匡郭裏生蟲搔之有汁有乾蘚有溼癬有風癬有白癬有牛癬有圓癬有狗癬有雀眼癬有久癬疥者皮內隱起發如㾦㿔極癢搔之汁出旋作乾痂皆有蟲有馬疥有水疥有乾疥有溼疥疽者瘑之類多發於支節腳脛相對匝匝作細孔如針頭其裏有蟲瘙痛搔之黃汁出隨差隨發有甲疽有查疽有頑疽有根疽非癰疽之疽也禿見前髮禿落篇䘌見後䘌篇瘑瘡者風溼之氣折於血氣結聚所生多著手足間遞相對如新生茱萸子痛癢抓搔黃汁出浸淫生長拆裂時瘥時劇變化生蟲有燥瘑創溼瘑瘡久瘑創癩者多從風起初入皮膚流通四支潛於經衇或在五藏眉睫墮落鼻柱崩壞語聲變散耳鳴啾啾皮肉頑痹不覺痛癢有烏癩有白癩癤者人運役勞動陽氣發泄遇風冷溼氣折之經絡之血結澀不通乃生核如梅李丹者風熱惡毒所為令人身體忽然焮赤如丹塗之象諸患者其來有自其制有物則其間自有針孔相符處可人人領會而不必縷述者也第其植根非深而瑣碎淹蹇倏忽以至遷延不退積久內伐仍可斃人所當比諸內證闡發其理者蓋癰疽既猶傷寒此類則猶瘧痢瘧痢者根連內外此類之根未嘗不亦連內外傷寒乃傷榮衛概從氣分鼓蕩瘧痢則傷經隧每傍血衇消長是瘧痢為著形體而傷寒反僅礙氣機矣是故礙氣機者易進易退雖奔騰踴躍張甚而可決其生死瘧痢則綿延反覆遲滯而難斷其違從譬之天降時雨縱傾盆倒峽每多生物之功惟淫霖瀰漫積日纍旬者傷害禾稼實甚也篇中諸病大率由溼火痰蟲風醞釀以成受之者多在血衇而溼乃浸淫之溼可由逐而去風非外中之風可由散而息從溼生火火與溼搏而成痰從溼熱生風風與溼熱媾而生蟲故篇中藥物除溼者幾居其半即治風治火治痰亦必關照驅溼通血衇此其大綱矣漆瘡蟹寒敗漆愈漆瘡茱萸皮溫大熱吳茱萸皮能療漆瘡苦芙微寒主面目通身漆瘡雞子白微寒治漆瘡塗之鼠查見杉材注洗漆瘡井中苔萍大寒主漆瘡熱瘡秫米微寒療漆瘡杉材微溫療漆瘡削作柿煎湯隱居蜀本石蟹寒主漆瘡漆姑葉微寒療漆瘡見杉材注隱居云藥對芒消大寒傅漆瘡君湯漬芒消令濃洗漆瘡證類黃櫨木洗湯火漆瘡及赤眼曹青巖曰漆之為物濡溼則乾風燥反潤投以鹹鹵則消化為水人著其氣則腫而為瘡病源曰漆瘡者瘙癢腫起先發赤㾦後生細粟厲者腫膿焮痛極而為痂癩然有不畏者終日播弄了無他苦畏者遠襲其氣輒發輕者至七八日不治自差重者治以相制之物亦必七八日始已或曰其人本有溼熱感漆氣之竄烈則為瘡每見易生瘡疥者染氣即發遇漆則固無恙也是稟賦之畏惡非溼熱之感召也明矣按治漆瘡者惟化患害為護衛其義最精且盡美盡善杉材柿其次去結聚茫消清熱毒井中苔萍其次充土氣秫米澤肌膚雞子白美矣若夫任敗漆之物蟹石蟹漆氣固為之解散其質將奈之何是又可證仍有去滓消毒之物為之佐使以善其後也惟漆之為物本經列諸上品謂為無毒別録則增有毒於下其理所當究焉夫人乖常理曰姦物戾常情曰妖在人視之為妖在物所具則為毒漆之毒以其得燥反漓得溼反凝耳然則本經何以著其主絶傷續筋骨填髓腦之功夫正以其止能於血液盛滿之軀續筋骨填髓腦也故本經不曰主絶竭絶涸而曰絶傷正為其人血液盛滿時忽遭傷損致斷絶不續耳既知其如是不遂可知其於血液燥涸人則能劫血液使漓揚血液使沸耶故患漆創者多嬌怯白嫩之人蟹鹹寒散血漆能劫之則蟹能散之漆能揚之則蟹能止之所以為第一的對之劑篇中諸物欲盡識其用意所在即以是推之可也癭瘤小麥微寒海藻寒主癭瘤氣頸下核破散結氣昆布寒主癭瘤聚結氣文蛤平半夏平生微寒熟溫除癭瘤氣虛而有痰氣加用之藥性論𦮷母平微寒與連翹同治頸下癭瘤藥性論通草平根治項下癭瘤藥性論松蘿平主項上癭瘤連翹平主癭瘤結熱白頭翁溫主積聚癭氣海蛤平治項下癭瘤藥性論生薑微溫藥對元參微寒主散頸下腫核臣杜蘅溫臣主項間癭瘤藥性論曹青巖曰癭瘤皆氣結疾也靈樞刺節真邪論曰有所結氣歸之津液邪氣凝結日甚連以聚居為昔瘤是癭瘤悉緣積纍而成癭專主氣瘤兼主血癭不治則能妨咽瘤不治惟日塸大而無痛癢聚沙曰塸故病源有癭可破瘤不可破之戒恐氣血外竭而致斃也二候初覺但宜解結氣通津液使不連聚塸大化熱為膿則善矣按古人謂險阻氣多癭淮南墜形訓輕水所多禿與癭人呂覽盡數何哉蓋生其地者癭其氣食其畜者踐其形氣應上達血應潛趨當達不達以其地勢有以攖之也攖拈也亂也當趨不趨以其力微不能前進也是二說者一似言癭淮南一似言瘤呂覽以癭與瘤本係同類特隨處結聚曰瘤但居頸項曰癭以義言之嬰繞抱也淮南要略訓以與天和相嬰薄注留滯守也莊子山木無留居注滯守者不能擇地繞抱者必倚險要故曰癭頸瘤也說文癭嬰也在頸嬰喉也釋名瘤肉起疾也廣韻瘤流也氣血流聚而生腫也釋名猶不可見泛稱則為瘤在頸則為癭耶即癭專主氣瘤兼主血亦於此可識矣血有定屆氣無定行則宜瘤有常處癭無常處乃適相反又氣能鼓激聚則迫急血主流行聚止盈科則應癭急瘤寬瘤垂癭突乃復相反何哉夫成癭者非有餘之氣為癭者乃氣阻之血氣緣不足故不能通達而陷於險血緣氣阻故反能鳩合而結為壘則癭如纓絡之垂瘤似榴球之湛非無由也雖然氣本因疲乏不盡欲行之量血亦因氣滯乃故違流動之趨是其責皆應在氣故本篇少獨治癭瘤之物有之惟一味耳白頭翁且見頸項字樣者十四味中復居其七是可曉行氣則血自流解鬱則血自順開結則血自通化痰則血自利除火則血自寧耳曾謂竟不治血哉瘻瘡雄黃平寒大溫主寒熱鼠瘻礬石大熱生溫熟熱主寒熱鼠瘻常山寒微寒主鼠瘻狼毒平主惡瘡鼠瘻疽蝕側子大熱寒熱鼠瘻連翹平主寒熱鼠瘻瘰癧昆布寒主結氣瘻瘡狸骨溫主鼠瘻惡瘡王不留行平主瘻乳斑猫寒主鼠瘻疥癬地膽寒主鬼疰寒熱鼠瘻惡瘡鱉甲平藥對蟾蜍寒臣治鼠漏惡瘡藥性論附子大熱使漏蘆寒主諸瘻療諸瘻疥久服甚益人隱居白礬寒主瘻惡瘡瘰癧使治鼠漏瘰癧藥性論雌黃平主諸瘻惡瘡臣車前子寒蛇銜微寒主鼠瘻臣證類蝦蟇寒蝦蟇即蟾蜍也重出曹青巖曰瘻瘡之源凡三素問生氣通天論曰陷衇為瘻留連肉腠是緣瘍久不斂而成者靈樞寒熱篇曰鼠瘻之本在藏是因情志拂鬱而發者又曰浮於衇中未著肌肉外為膿血是受蟲鳥之毒而生者夫蟲鳥之毒或自飲食染其精液或自居處襲其毒氣內則決而逐之外則蝕而去之所謂從本引末以去之也瘍久不斂或瘍生筋骨空陷之處外闔而內不聯或以氣血虛乏腐去而肉不長所謂補虛易而塞漏難也情志拂鬱則精血內沮他藏之損不若肝藏之專男子每發於莖婦人歷生於乳經方所謂㿉瘻乳瘻是也亦有發於頸掖者所謂狼瘻是也其成每至數年數十年其潰每至於死而後已近世名之曰失榮乳巖陰巖治者善於補救尚爾無裨攻蝕則適促其生也按陷衇為瘻即所謂漏也本在於藏上出項腋間者即所謂瘰癧是其未潰者也浮於衇中未著肌即外為膿血者即所謂鼠瘻是瘰癧之已潰者也漏者當求諸癰疽治虛之法瘰癧者當順氣開結鼠瘻者當殺蟲解毒癰疽治虛順氣開結自宜依指他求若解毒殺蟲則此篇備矣凡曰瘰癧及言瘻不言鼠者皆解毒者也言鼠瘻惡創者皆殺蟲者也而順氣開結亦多寓焉蓋惟專順是氣專開是結者皆不假取諸他篇也雖然鼠蠅蜂蟻蛇蛙蟲蚝蚍蜉蠐螬蜣螂蚯蚓蝦蟇螲蟷鵰烏鶴撅既遺精於食既中毒於人何以不為內患而反流於經衇發諸皮腠且能不著肌肉耶夫惟如此方可用篇中諸物而不嫌其毒也蓋人藏府充實毒本難干設藏府不虛第經衇懈弛則毒不內犯而外流故藥物亦得以毒化毒耳假使毒內蘊而發病寧得尚攻伐耶就是而循其所列之物察其氣性之異合夫剋化之理推其生制之宜而更佐以抵隙補罅之資期歸於成平帖服而後已詎不可哉且靈樞寒熱篇岐伯答帝治鼠瘻千金外臺皆作請從其末引其本今本乃作請從其本引其末唐人所引詎無所本況非止一處也不與本篇之旨吻合耶五痔白桐葉寒皮主五痔萹蓄平療疽痔蝟皮平主五痔陰蝕下血赤白豬懸蹄平主五痔伏熱在腸黃芪微溫主五痔鼠瘻蜀本五靈脂溫五倍子平療五痔下血不止藥對龜甲平主五痔臣赤石脂大溫君療癰疽瘡痔檗木寒主腸痔棐子平臣主五痔去三蟲槐子寒君補絶傷五痔火瘡蛇脫平寒熱腸痔臘月鴝鵒平作屑主五痔主五痔止血鱉甲平主五痔臣主蝕痔惡肉腐木糯寒臣竹茹微寒臣治五痔藥性論葈耳微寒臣為末水服治五痔千金翼槲衇平燒作散主痔槲若主痔止血證類槐鵝微溫治五痔槐花鵝見簡要濟衆方柏葉平艾葉微溫治五藏痔瀉血藥性論曹青巖曰痔侯凡五皆下血有瘡生氣通天論曰因而飽食經衇橫解腸澼為痔病源曰醉飽合陰陽致血氣勞擾經衇流溢滲漏腸間衝發為痔據此則痔因氣勞擾而下注血即隨注而滲泄泄而不暢則瘀滯變熱而結腫滲而不已則經衇滑溜而為澼腫久為膿則成痿澼久乏氣則脫肛腫而熱者化其熱虛而滑者固其衇必補益其氣使樞軸旋不阻斯治法之善也按崔氏曰五痔肛邊生肉如鼠乳出孔外時時濃血出者牡痔肛邊腫痛生創者酒痔肛邊有核痛寒熱者腸癖大便輒清血者血痔大便難肛良久乃肯入者氣痔集驗曰氣痔溫寒溼勞即發蛇脫皮主之牡痔生肉如鼠乳在孔中頗見外妨於更衣鱉甲主之牡痔從孔中起外腫五六日自潰出膿血蝟皮主之腸痔更衣挺出久乃縮豬左懸蹄甲主之衇痔更衣出清血蜂房主之兩說者參差不齊大同小異更核之病源千金又或小有不同蓋突於外者為牡苞於內者為牝著於腸者為腸血者血之不攝氣者氣之不舉則牡者為腫牝者為痛便艱者為腸重墜者為氣流血者為血而腫者有溼有火痛者有熱有瘀便堅者有燥有火重墜者有溼有熱流血者有瘀有虛篇中解熱清火燥溼滲溼舉氣調氣通瘀止血滋燥清燥非特一面周到也皆可就其病之偏重為之調劑俾歸於平焉欲使知此病之解熱清火等義絶與治他病者不同一若預燭後人將必有以陰陽表裏虛實籠統大概之說為治病標準者詔之俾息其喙是書之微義也脫肛鱉頭平頭血塗脫肛藥性論卷柏溫平微寒治脫肛鐵精微溫療脫肛東壁土平主下部瘡脫肛蝸牛寒大腸下脫肛筋急生鐵微寒主治下部及脫肛刪繁云肛者主大便道肺與大腸之合也號為通事令史若臟傷熱即脫閉塞大便不通或腫縮入生創若府傷寒則肛寒大便洞瀉肛門凸出良久乃入病源云脫肛者肛門脫出也多因久利後大腸虛冷所為肛門為大腸之候大腸虛而傷於寒利用氣𠸯而氣下衝則肛門脫出即已如是豈有用寒涼之理乃篇中列藥六味寒涼者三重墜者二此曷故哉夫固當體藏府情性而審其耐寒耐溫之所以然矣試檢千金大腸虛冷篇其證則謂胸中喘腸鳴虛渴唇乾目急善驚其治則用灸為多其用藥則黃連補湯其物則黃連茯苓芎藭石榴皮伏龍肝地榆何嘗有一味溫補而曰治大腸虛冷利下清白腸中雷鳴相逐是誠何故乃治大腸實熱之生薑泄腸湯反生薑白朮桂心連用是知千金方五藏六府虛冷實熱諸篇非泛泛設乃藏府耐藥性情精理所繫矣故刪繁療肛門寒則洞瀉凸用豬肝散方豬肝黃連阿膠芎藭艾葉烏梅亦不濫用溫劑兩相印證無異義也本篇大旨寒涼三味具伸而能縮之機重墜二味取墜可轉升之理鱉蝸之伸縮不待言即卷柏亦得水則舒暴乾仍卷猶是此意鐵則本重而浥取精氣於水不已化為輕乎至東壁土則緣水過下趨為禍始還以防水之物為隄埂之幹耳超超元理益人神智如是䘌青葙子微寒主下部䘌瘡苦參寒療下部䘌蚺蛇膽寒主䘌瘡腹蛇膽微寒心腹䘌痛下部䘌瘡大蒜溫散癰腫䘌瘡戎鹽寒藥對艾葉煎微溫臣療下部䘌瘡證類馬鞭草平主下部䘌瘡蛔蟲薏苡根微寒下三蟲煮汁作糜食香去蛔蟲效隱居雚菌平微溫去蛔蟲寸白乾漆溫利小腸去蛔蟲楝根微寒療蛔蟲利大腸茱萸根溫大熱根白皮殺蟯蟲艾葉微溫汁殺蛔蟲隱居藥對石榴根平使療蛔蟲檳榔溫君殺三蟲證類鶴蝨平主蛔蟯蟲用為散肥肉臛汁方寸匕龍膽寒大寒去腸中小蟲寸白檳榔溫療寸白蕪荑平逐寸白散腸中嗢嗢喘息貫衆微寒去寸白狼牙寒去白蟲雷丸寒微寒白蟲寸白自出不止青葙子微寒殺三蟲橘皮溫止泄去寸白茱萸根溫大熱治寸白蟲藥性論石榴根平療寸白棐子平去三蟲藥對桑根白皮寒臣利水道去寸白曹青巖曰溼熱之氣變化生瘡蝕爛孔竅即金匱之狐惑病源之疳䘌也傷寒熱病邪不盡達薰蒸腹中浸淫孔竅令人下部或咽喉生瘡喜睡惡食微熱利血甚則胃虛氣逆嘔噦每有致死者嗜甘之人脾胃氣緩蟲動侵食亦能為之但宜化導鬱勃之氣蓋欲復窪聚之流先瀹湮遏之源是也又曰九蟲之害蛔與寸白為多皆溺熱化生者也蛔處胃中每有上逆吐出者寸白處腸中但從大便出者蛔依於血寒則內動而致腹痛寸白附於液熱則滋生而致疳蝕其生也藉藏府之溼熱其出也憑糟粕之黏裹蛔則必待血滯通而後行寸白必待凝液化而始出蛔性畏苦寸白性畏辛得其性而制之流毒可冀免矣按䘌蛔寸白所由不同趨嚮殊異而均為蟲者以脾胃失職溼熱蘊隆則同也狐惑屬心心者火火逢空斯發故主面目乍赤乍黑乍白著物即燃故主蝕蛔屬肝肝者木木上聳下朻朻木下曲說文故主上下皆出喜潤惡燥故主煩寸白屬脾脾者土土藏垢納汙故主津液凝濁生物繁庶故主羣又狐惑連表而裏不靖故狀如傷寒默默欲眠目不得閉臥起不安不欲飲食惡聞食臭蛔病在陰而陽不振故主衇微而厥膚冷靜復時病須臾復止得食而嘔又煩寸白諸書皆少言其外候惟千金謂脾勞熱則有白蟲在脾中為病令人好嘔本篇謂腸中嗢嗢喘息蟲自出不止則陽不運陰而反激陰之候也又肝藏血故蛔每倚血為起伏篇中薏苡根乾漆楝實艾葉皆屬血藥而能殺蟲者脾生津故寸白必凝津為窠臼篇中貫衆橘皮棐子桑皮皆於津液中殺蟲者蛔服苦篇中誠有沉苦之列寸白服辛篇中不乏辛烈之厠質之於䘌則辛苦竝陳津血竝利而與寸白同用青葙已可見其清溼熱可瘳與蛔同用艾葉又可見其行血液乃伏然執此而不知權變猶執一也權變惟何傷寒論之烏梅丸金匱要略之甘草粉蜜湯甘草瀉心湯苦參洗雄黃薰是也說者謂蟲生於風故風字從蟲此言良是第此風若係外中內生其咎應不止此是必別有故試思溼盛則為痹為攣水停則為痰為飲又安得生蟲惟其中有熱則陽氣不得入而與之交化於是陽氣與溼熱錯而相摩蕩焉正蒙所謂陰氣凝聚陽在外不得入則周旋不合而為風者是也是知生蟲之溼與水非盛滿停瀦乃飲食精微之餘不隨陽化者仍係生氣之萌故成有生之物確似風而實非風也或者又謂䘌與寸白人不常有蛔則夫人有之故多別無大病稍稍怫逆即見於吐者是已蓋天之與地無所不包陰陽交化而孕育者無物不有則人腹之有蟲又何疑焉古人亦以泛辭置之曰人不必盡有有亦不必盡多或偏有或偏無皆依腸胃之間若府藏實則不為害虛則侵蝕焉隨其蟲之動而能變成諸患也病源云虛勞丹沙微寒空青寒大寒益肝氣石鍾乳溫安五藏益氣補虛療下焦傷竭強陰紫石英溫補心氣不足白石英微溫益氣補五藏磁石寒養腎藏強骨氣藥性論云能補男子腎虛風虛身強腰中不利蓋攝治節於作強中也龍骨平微寒養精神定魂魄安五藏茯苓平調氣伐腎邪長陰益氣力保神守中黃芪微溫補丈夫虛損五勞羸瘦乾地黃寒主男子五勞七傷女子傷中胞漏茯神平療風眩風虛五勞天虋冬平大寒保定肺氣薯蕷溫平主傷中補虛羸勞瘦充五藏除煩熱強陰石斛平主傷中補五藏虛勞羸瘦強陰沙參微寒補中益肺氣人參微寒微溫補五藏元參微寒補腎氣五味子溫主益氣勞傷羸瘦補不足強陰益男子精肉蓯蓉微溫主五勞七傷補中養五藏強陰益精續斷微溫助氣調血衇補五勞七傷日華澤藛寒補虛損五勞牡丹寒微寒安五藏芍藥平微寒牡桂溫補中益氣遠志溫主傷中補不足當歸溫大溫補五藏生肌牡蠣平微寒五加皮溫微寒五緩虛羸補中益精白棘寒療丈夫虛損陰痿精自出補腎氣益精髓覆盆子平主益氣巴㦸天微溫安五藏補中增志益氣牛膝平療傷中少氣杜仲平溫補中益精氣柏實平安五藏益氣療恍惚虛損吸吸桑螵蛸平療男子虛損五藏氣微石龍芮平平腎胃氣補陰氣不足石南平主養腎氣內傷陰衰桑根白皮寒主傷中五勞六極羸瘦補虛益氣地膚子寒補中益精氣車前子寒養肺強陰益精麥虋冬平微寒療虛勞客熱口乾燥渴乾漆溫主絶傷補中安五藏兔絲子平主續絶傷補不足益氣力肥健蛇牀子平令婦人藏熱男子陰強枸杞子微寒補內傷大勞噓吸大棗平補中益氣枸杞根大寒麻子平主補中益氣胡麻平主傷中虛羸補五內益氣力長肌肉填骨髓唐本葛根平起陰氣蜀本補骨脂大溫主五勞七傷風虛冷藥對甘草平補益五藏下氣長肌肉制諸藥君黃雌雞平主續絶臣補益五藏療勞益氣萎蕤平補不足除虛勞客熱頭痛君甘菊平補中益五藏君紫菀溫主勞氣臣五勞體虛補不足狗脊平補益丈夫臣藕實寒補中養氣君主補中養神益氣力除百疾蜂子微寒補虛冷君補虛羸傷中蕪青蘆蔔溫益五藏輕身君主利五藏輕身益氣赤石脂大溫主養心氣君薔薇微寒主五藏寒熱君雲母平主氣益精君安五藏補中療五勞七傷虛損少氣枳實微寒主虛羸少氣君利五藏益氣防葵寒君療五藏虛氣虛由於自然勞因於有作譬諸器物虛者製造之薄劣勞者使用之過當仲景論虛勞凡言勞者必主衇大云衇浮衇浮弱而澀衇虛弱細微衇沉小遲皆不謂勞則可見勞者衇必大虛者衇必小遂可知勞者精傷而氣鼓虛者氣餒而精違而其間節目虛有陰陽之不同勞有傷損之殊異是其治則遂覺煩多以篇中校之大率曰補曰安皆治勞之技曰益曰養咸治虛之法以其所至之處察其所乘之機剖而析之曲而帖之可以得其當也夫大熱消渴鬼疰尸疰吐唾血上氣咳嗽下利聲暗瘻䘌陰痿六十八泄精不得眠腰痛婦人崩中月閉皆可為虛勞兼有雖不能不合於諸證之治要須與是相符而不相乖更核是篇須與彼相即而不相舛乃能曲當苟泥諸證常治恐犯虛虛之戒徒執本篇所見又防盛盛之嫌故篇中不憚縷析條陳合而言之則曰安五藏石鍾乳龍骨牡丹巴㦸天柏實乾漆雲母補五藏白石英石斛人參當歸補益五藏甘草黃雌雞充五藏薯蕷養五藏肉蓯蓉五藏氣微桑螵蛸補五內胡麻益五藏甘菊花蕪青五藏寒熱薔薇五藏虛氣防葵調藏氣茯苓利五藏蕪青枳實五勞黃芪茯神澤藛桑白皮紫苑但主五勞七傷乾地黃續斷補骨脂雲母兼主五勞七傷補中沙參牡蠣五加皮牡桂巴㦸天杜仲地膚子乾漆大棗麻子甘菊花藕實雲母莫不具列章程分而言之則曰肝空青益肝氣心紫石英補心氣不足赤石脂養心氣肺天虋冬保定肺氣沙參益肺氣車前子養肺腎磁石養腎氣元參白棘補腎氣石南養腎氣益氣石鐘乳白石英覆盆子巴㦸天柏實桑白皮黃雌雞蕪青枳實續斷益氣力茯苓兔絲子胡麻藕實羸瘦黃芪薯蕷石斛五味子五加皮桑白皮蜂子枳實兔絲子令肥健胡麻甘草長肌肉當歸生肌肉傷中地黃薯蕷石斛遠志牛膝桑白皮胡麻蜂子強陰石鍾乳薯蕷石斛五味子肉蓯蓉車前子蛇牀子磁石強骨氣石南主陰衰益精五味子肉蓯蓉五加皮白棘杜仲地膚子車前子胡麻莫不各分條理校他病之用補益者毫不相同其灼然尤可明者無如除熱一法不加散發不投清泄其命意更屬天淵薯蕷除煩熱麥虋冬主客熱口乾燥渴萎蕤平客熱頭痛薔薇主五藏寒熱是其因地制宜為何如哉奈何挽近論治虛勞輒曰滋陰清火養血除熱既不按病治病復不遵循仲景凡桂枝龍骨牡蠣小建中黃芪建中天雄散等物治之者概視為畏途漫不加省馴至胃減便溏益復寒涼滋肝致不可救而止無怪乎是篇更辨髦置之矣而不知是篇宗旨確有稗補仲景者請試言其一二如益精而去精中之蕪纍地膚子車前子五加皮強陰而召不羈之浮陽石鍾乳薯蕷石斛五味子因傷中而反求諸上下桑白皮牛膝因羸瘦而轉事消耗桑白皮枳實補中者益脾益氣亦益脾而寓治體治用於其間補中諸物是益脾體益氣諸物是益脾用不然則四藏皆有專補而脾獨闕如也安五藏補五藏補益五藏充五藏養五藏益五藏皆以聯絡五藏而寓動靜升降於其間不然諸物之功未見若是其溥也要而言之篇中列藥六十五味無非補精補氣兩端推而極之則其間性溫者二十性平者二十有六微寒者七寒者十有二又不過丹沙空青磁石天虋冬澤藛白棘桑白皮地膚子車前子枸杞根藕實防葵等物治虛勞大旨猶不可窺見一斑乎陰痿白石英微溫主消渴陰痿不足陽起石微溫陰痿不起補不足男子莖頭寒陰下溼癢巴㦸天微溫主陰痿不足肉蓯蓉微溫主莖中寒熱痛強陰益精氣五味子溫強陰益男子精蛇牀子平男子陰痿溼癢能令陰強地膚子寒強陰與陽起石同服主丈夫陰痿不起補氣益力藥性論鐵精微溫治産後陰下脫白馬莖平主傷中衇絶陰不起兔絲子平強陰主莖中寒精自出溺有餘瀝原蠶娥熱主益精氣強陰道交接不倦狗陰莖平主傷中陰痿不起令強熱大雀卵溫主男子陰痿不起強之令熱多精藥對樗雞平使主心腹邪氣陰痿益精健志生子好色五加皮微寒主陰痿下溼使男子陰痿囊下溼癢小便餘瀝覆盆子平能長陰臣主陰痿能令堅長牛膝平主陰消君男子陰消婦人失溺石南平使主養腎氣內傷陰衰雖能養腎令人陰痿藥性論白芨微寒主陰痿使小豆花主陰痿不起使證類山茱萸平微溫強陰益精天雄溫大溫長陰氣令人強志助陽道暖水藏日華虛勞已下自陰痿至腰痛七證連屬在虛勞足見下虛者多在七證七證皆虛勞支別而陰痿尤切近故首及焉陰痿與虛勞切近其義在金匱虛勞篇一則曰陰寒精自出再則曰精氣清冷曰陰頭寒蓋非精無以蓄陽非陽無以化物生氣生血之本遂絀動靜云為之節皆乖虛勞之成多由於此是以本經藥物復虛勞者恰半而皆強陰益精和暖資育之品以存少火而成脾胃轉運之功非為媾精設祈似續計也雖然二莖蠶娥雀卵實亦因是而用夫恢復之役積儲易而發機難雖溫煦培植而機括未靈仍同堆垛不足以轉發生氣象譬諸釜底益薪縱多不燃何由得暖必且以炬引之是其驗矣其他則一若突中除溼五加皮竈下噓薪陽起石障暖氣之旁泄天雄伸氣機之窒礙山茱萸竝可引類而推此所以雖似虛勞附庸實是虛勞鄰境各闢都鄙別建城郭而不相統攝者也惟治痿獨取陽明陽明虛宗筋縱者則與是迥殊不得混同而論陰㿉海藻寒暴㿉留氣熱結利小便鐵精微溫見陰瘻狸陰莖溫主男子陰㿉燒之以東流水服之狐陰莖微寒小兒陰㿉卵腫蜘蛛微寒主大人小兒㿉蒺藜溫微寒陰㿉可作摩粉鼠陰平藥對蝦䗫衣寒主陰腫車前子也然不云治陰腫地膚子寒治陰卵㿉疾去熱風可作湯沐浴藥性論槐皮煮汁主陰腫淋陰囊墜氣痛藥性論痿者疲垂不起㿉者木腫不靈疲垂不起為虛勞支別宜矣木腫不靈亦為虛勞支別乎不知素問陰陽別論曰三陽為病發寒熱下為癰腫及為痿厥腨㾓其傳為索澤其傳為㿉疝夫太陽陽之至盛也偏稟氣於寒水而其氣下行賴足少陰腎之經遞接而復上出假使腎氣不給不克傳宣斯寒水盛陽鬱勃於上而沸騰湧逆交戰肌表抑溜於下而浸淫漸漬潰敗血衇由是而在外之潤澤日以簫索由是而在下之靈機日以虺隤病若是者可為虛勞支別否耶是故㿉本疝類而與疝源不用說見本經疏證蜘蛛下陰㿉與陰痿不同而其源卻不甚異此古人編書相次之微旨也陰㿉隱祕醜惡之疾以不甚害起居食息較之凡㿉反為可耐故多忍之不肯宣播然觀篇中所用藥物則其間兼證亦殊不一如用蜘蛛則有時腫時減者矣用海藻則有堅頑難馴者矣用鐵精則有重墜迫切者矣用蝦䗫衣則有小溲不利者矣用地膚子則有肌熱者矣用蒺藜則有癢者矣用槐皮則有痛者矣用三種陰莖則有㿉而并痿者矣要之痿則有虛無邪㿉則虛邪錯雜凡㿉則邪多於虛陰㿉則虛甚於邪然皆緣少陰腎不能泌別清濁化陰使從陽舉陽使載陰盤旋以上濟所致故分正羡引陰陽自應支貫條析而佐以強陰益腎皆可因彼而識此也囊溼五加皮溫微寒男子囊下溼女人陰癢槐枝一作槐皮洗瘡及陰囊下溼癢檗木寒虎掌溫微溫除陰下溼菴閭子微寒微溫蛇牀子平主男子陰痿溼癢浴男女陰去風冷藥性論陰汗溼癢日華牡蠣平微寒和蛇牀子麻黃根乾薑為粉主陰汗拾遺宣溼清溼劫溼熯溼化溼矣而又緊切於陰囊以治囊溼尚何容論哉第此微末之疴似若不足為虛勞支別者殊不知亦虛勞支別也所知錢君叔和因下血致虛勞多服補益巨劑始瘥瘥後遂成囊溼苟才燥輒復下血而虛證叢集間亦陰㿉腫必仍服溫補大劑但囊得溼病即愈矣巢元方曰大虛勞損腎氣不足故陰汗陰冷液自泄風邪乘之則搔癢豈不信然泄精韭子溫主夢泄精溺白白龍骨平微寒療夢寐泄精小便泄精鹿茸溫微溫小便利泄精溺血牡蠣平微寒療泄精桑螵蛸平主男子虛損五藏氣微夢寐失精車前子葉寒治泄精藥性論澤藛寒止泄精消渴淋瀝石榴皮平實止漏精麞骨微寒主虛損泄精藥對五味子溫主泄精臣棘刺寒使兔絲子平主精自出君主莖中寒精自出溺有餘瀝薰草平臣石斛平君益精補內絶不足鍾乳溫臣主泄精寒嗽扶元氣健益陽事藥性論麥虋冬微寒臣主泄精藥性論陰陽應象大論曰陽為氣陰為味味歸形形歸氣氣歸精精歸化精食氣形食味化生精氣生形味傷形氣傷精精化為氣氣傷於味據此則陰陽互根彼此遞化而精為陰之至醇陽之歸宿矣蓋惟其有陽歸宿故能守而不離惟為陰之至醇故亦感陽而動金匱要略虛勞篇論泄精蓋分兩種一者陰寒精自出也一者夢失精也病源則分四種曰失精曰溢精曰尿精曰夢泄精外臺祕要僅存其三而無溢精夫固謂溢精為見聞精出則仍與夢泄精無異原可不必別分條件統而會之尿精自別有故夢泄精是感陽而動一例陰寒精自出是陽不歸宿一例桂枝龍骨牡蠣湯小建中湯者失精之治天雄散者陰寒精出之治故外臺遂仿是布置焉原夫人之生本水火相守局也即水所以湛然盈澄然潔者豈徒恃隄岸鞏固哉蓋必水無他歧之衝齧風無別道之激蕩然尤畏寒氣凌侵潦消漲落不期縮而縮不期竭而竭故治泄精者首當使其水勢搏而弗散內而弗外韭子五味子其次則使土攝水龍骨使陽歸陰牡蠣於是開渠以去旁歧之引而相從車前子澤藛聚氣以防衝激之率而相離桑螵蛸石榴皮而煦陽以伸其機鹿茸鍾乳黏陰以助其固兔絲子石斛麥虋冬則歷處可參入焉要須核之金匱兩途外臺三派更合以千金補腎而融會貫通之泄精治則寧尚有遺憾耶好眠通草平療脾疸常欲眠孔公孽溫治常欲眠睡馬頭骨微寒主喜眠令人不睡牡鼠目平燒作屑魚膠相注目眥則不眠千金方茶茗微寒令人少睡證類沙參微寒治常欲眠藥性論不得眠酸棗仁平主煩心不得眠榆葉平治不眠藥性論細辛溫藥對沙參微寒臣證類乳香溫靈樞大惑論曰衛氣常以晝行陽以夜行陰行陽則寤行陰則寐若其人腸胃大則衛氣行留久皮膚溼分肉不解則行遲留於陰也久其氣不精則欲瞑故多臥矣其人腸胃小皮膚滑以緩分肉解利則衛之留於陽也久故少瞑焉據衛氣行篇言其行自平旦出於目行足太陽手太陽足少陽手少陽足陽明手陽明竟而復始凡行二十五周遂盡陽分乃由足少陰注於腎而心而肺而肝而脾亦如陽之二十五周以復出於目則當其在陽具建瓴之勢行乎所不得行固無干於好眠不得眠也惟入陰則穿貫府藏經由分肉寬則遠窄則近滑則疾澀則徐殆止乎所不得不止好眠不得眠因此生焉雖然此其常也不得為病無從求治然病之好眠不得眠倘不明此則又無從求治是故據兩病所列首味而言則好眠是陰滯於陽不得眠是陰不浹陽矣治好眠當求其陽出陰中今反陰滯於陽治不得眠當求陽交於陰今反陰不浹陽是由出入之違常徑道泥濘則行止濡遲徑道清肅則行止速疾故治好眠以浣濯茶茗治不得眠以黏滑榆葉是由汗潔之背度陰分有阻陽不得入則宜去陰中之阻細辛陽分自曠陰不得出則宜促留陰之駕孔公孽是由通塞之愆期準此而會意焉其他亦可不事縷述矣獨沙參一味藥對謂其主不得眠證類又言其主好眠何也夫沙參治好眠以能緩滑皮膚解利分肉也其治不得眠則以能溼潤皮膚脂膏分肉也試參之老人類少眠以皮膚槁也凡人茶飲多者亦少眠以分肉利也故沙參之治不得臥是取其體氣之舂容豐腴者類多臥以分肉澀也勞力者亦多臥以汗易泄也故沙參之治好眠是取其性味之滑澤至腸胃之寬窄似無涉於沙參之治矣然寬者行遲不可使之滑澤而迅乎窄者行疾不可使之充滿而遲乎是皆得以類擴充者也腰痛杜仲平溫主腰脊痛補中益精氣堅筋骨強志萆薢平主腰背痛強骨節狗脊平微溫主腰背強機關緩急周痹男子腳弱腰痛梅實平療肢體痛鱉甲平療血瘕腰痛五加皮溫微寒主腰脊痛兩腳疼痹菝葜平溫主腰背疼痛爵牀寒主腰脊痛不得著牀俯仰艱難除熱可作浴湯蜀本木鱉子溫止腰痛藥對牡丹微寒使勞氣頭腰痛石斛平君主男子腰腳軟弱藥性論附子大熱使主腰脊風寒證類鹿角膠主傷中勞絶腰痛羸瘦補中益氣牛膝平除腰脊痛鹿茸溫微溫主羸瘦四肢痠疼腰脊痛小便利烏喙微溫主寒熱歷節掣引腰不能行步續斷微溫主腰痛關節緩急病源云腰痛有五一曰少陰少陰腎也由十月萬物陽氣皆衰而痛二曰風痹由風寒著腰三曰腎虛由役用傷腎四曰䐴腎䐴腰忽痛也玉篇由墜墮傷腎五曰寢臥溼地又云腎主腰腳腎經虛損風冷乘之故腰痛諸證皆有因而無狀惟云邪客於足少陰之絡令人腰痛引少腹不可以仰息此可為第一項注解然素問刺腰痛篇所謂足少陰令人腰痛痛引脊內廉者又與之稍有異同此外在病源則腰痛不得俯仰風溼腰痛卒腰痛久腰痛腎著腰痛各標名目在素問則六經腰痛解衇腰痛同陰腰痛陽維腰痛會陰腰痛飛陽腰痛昌陽腰痛散衇腰痛肉里腰痛別自樹幟皆與下四項參差不合惟病源云䐴腰痛者謂卒然傷損於腰血搏背脊所為久不出令人氣息乏少面無顏色素問云衡絡之衇令人腰痛不可以俯仰仰則恐仆得之舉重傷腰衡絡惡血歸之此卻可為第四項注解且於篇中鱉甲之治確有合也大率欲求五項之狀亦匪甚難一項三項自屬內傷然一項由天三項由人縱同為虛軟痿疲由天者必別無他涉由人者自更覺困頓二項四項五項同為外傷然由風寒則必牽掣由溼則必沉重至傷損則更自有異此其畫然可分者也至於素問所列尤廣其狀益確然解衇陽維衡絡會陰飛陽皆足太陽之別同陰肉里皆足少陽之別散衇為足太陰之別昌陽為足少陰之別均得仍隸六經約其旨趣亦可分以陰陽兩端竝可概以在陰者虛在陽者實徵之陽之痛為引項脊尻骨加重為如以針刺皮中循循然亦可俯仰為不可顧顧如有見者善悲陰之痛為痛引脊內廉為腰中如張弓弩弦蓋內外虛實的然有辨不容杜撰矣尋篇中所列補瀉自是殊途寒溫已別所屬或驅風或滲溼或燠寒或清熱均得因材器使或疏氣或行血或耐急或茹剛咸令隨事設施而大旨則覷定補虛損化溼痹利機械強筋骨以腰痛始終為虛勞支別虛者多實者少也婦人崩中石膽寒主崩中下血禹餘糧寒平主煩滿下赤白治崩中藥性論赤石脂大溫主崩中漏下代赭寒女子赤沃漏下帶下百病牡蠣平微寒療女子帶下赤白龍骨平微寒主女子漏下蒲黃平主女子崩中不住藥性論白殭蠶平主女子崩中赤白牛角䚡溫主女人帶下血烏賊魚骨微溫主女子漏下赤白經汁紫葳微溫主婦人産乳餘疾崩中桑耳平主女子漏下赤白汁生地黃大寒主婦人崩中血不止檗木寒主女子漏下赤白白茅根寒止婦人崩中艾葉微溫止婦人漏血鮀甲微溫主女子崩中下血五色小腹陰中相引痛鱉甲平治婦人漏下五色羸瘦者燒令黃末之清酒服藥性論馬蹄平白馬蹄療婦人白崩赤馬蹄療婦人赤崩白膠平療崩中不止四肢痠疼多汗丹雄雞微溫微寒主女子崩中漏下赤白沃補虛溫中止血阿膠平微溫主女子下血安胎鬼箭寒主女子崩中下血腹滿汗出鹿茸溫微溫主漏下惡血大小薊根溫主女子赤白沃馬通微溫主婦人崩中止渴伏龍肝主婦人崩中吐血乾地黃寒主女子傷中胞漏下血藥對柏葉微溫酒漬主吐血及崩中赤白君續斷溫臣主婦人崩中漏血淡竹筎微寒主崩中溢筋白芷溫主漏下赤白臣蝟皮平臣下血赤白五色汁不止飴糖微溫臣地榆微寒主漏下赤血主婦人七傷帶下病治月經不止血崩日華綱目崩中而目有崩有漏有沃有帶是其緩急輕重之勢可從此參矣崩如山冢崒崩毛詩言其來甚驟其勢重急也漏猶漏師公羊言自上下泄也沃如沃泉懸出爾雅言不假旁流直漏而下也帶之著衣如物繫蒂釋名言其柔韌連續也體狀一殊情由立異斯固宜循因索治如治崩是治崩石膽禹餘糧蒲黃白殭蠶紫葳生地黃茅根鮀甲馬蹄白膠鬼箭馬通伏龍肝竹茹柏葉治漏是治漏龍骨烏賊魚骨桑耳檗木艾葉鱉甲鹿茸乾地黃白芷治沃是治沃大小薊根治帶是治帶牡蠣牛角䚡地榆奈何或竝治崩漏赤石脂續斷或竝治崩漏沃丹雄雞或竝治沃漏帶耶代赭石何況根本固迥異如下赤白下五色而有兼治赤白者禹餘糧牡蠣殭蠶烏賊魚骨桑耳檗木馬蹄丹雄雞大小薊柏葉白芷兼治五色者鮀甲鱉甲蝟皮此又何說且赤白二端相兼者既衆矣而但治下血者頗不為少石膽生地黃艾葉阿膠鬼箭鹿茸乾地黃續斷地榆但治下白者乃僅止一味且仍在兼治赤白中白馬蹄是又何耶仲景曰婦人之病因虛積冷結氣為諸經水斷絶至有歷年血積寒結胞門寒傷經絡凝堅在上嘔吐涎唾久成肺癰形體損分在中盤結繞臍寒疝或兩脅疼痛與藏相連或結熱中痛在關元衇數無瘡肌若魚鱗時著男子非止女身在下來多經候不勻令陰掣痛少腹惡寒或引腰脊下根氣衝氣急痛膝脛疼煩奄忽眩冒狀如厥巔或憂慘悲傷多嗔此皆帶下非有鬼神久則羸瘦衇虛多寒三十六病千變萬端審衇陰陽虛實緊弦行其針藥治危得安病雖同而衇源各異據此則千變萬端皆緣於積冷結氣兩者而其為病遂分三歧在上則為肺癰在中則或為寒疝或為熱中在下則惟帶下而已素問骨空論曰任衇為病男子內結七疝女子帶下瘕聚蓋積冷結氣在下久而幻化阻隔衝衇寒則凝其通降而經閉不行熱則激其機械而漏下不止不通降則溜於任而為帶為沃被激迫則沸於衝而為崩為漏寒熱相薄則崩漏帶沃竝行竝行既有竝行之由斯竝治自有竝治之故矣第因證易則則不可不究但觀其治崩漏外有兼治他證自宜著意如煩滿禹餘糧産乳餘疾紫葳少腹陰中相引痛鮀甲羸瘦鱉甲四肢痠疼多汗白膠安胎阿膠腹滿汗出鬼箭渴馬通吐血伏龍肝柏葉溢筋竹茹與所謂陰掣痛少腹惡寒氣衝急痛膝脛疼煩奄忽時冒悲傷多嗔者大都有合故曰其病雖同衇源各異言病證同則治法同縱淵源有異可勿論也千金白堊丸治三十六病十二癥倍禹餘糧牡蠣烏賊骨白石脂龍骨九痛倍黃連白斂甘草當歸七害倍細辛藁本丹皮五傷倍大黃石葦瞿麥三痼倍人參十二癥之藥本篇悉備其餘則闕如所謂痛害傷痼皆非下赤白惟十二癥則曰如骨如黑血如紫汁如赤肉如膿痂如豆汁如葵羹如凝如清血血似水如米泔如月浣乍前乍卻及經度不應期皆名曰癥而實係帶即此又可識五色者不必逐色審定凡屬漏下均可隨證檢治矣陰陽應象大論曰陽化氣陰成形是故在陽之病聚則成形散則成氣在陰之病靜則為瘕動則為帶男女之分在此上下之異亦不離此也不然何以病名曰癥而病則為崩漏沃帶哉月閉鼠婦微溫微寒主婦人月閉䗪蟲寒治月水不通破留血積聚虻蟲微寒蜚虻主女子月水不通積聚水蛭平微寒主逐惡血瘀血月閉蠐螬微溫微寒主月閉桃仁平通月水止痛狸陰莖溫主月水不通土瓜根寒主瘀血月閉牡丹寒微寒治女子經衇不通血瀝腰痛牛膝平主婦人月水不通血結占斯溫主血癥月閉無子虎杖微溫主通利月水陽起石微溫破子藏中血桃毛平下血瘕破堅閉白堊溫主女子寒熱癥瘕月閉積聚陰腫痛漏下無子銅鏡鼻平主女子血閉癥瘕伏腸絶孕藥對白茅根寒主血閉臣治瘀血血閉大黃大寒治月候不通使主女子寒血閉脹小腹痛老血留結射干微溫使通女人月閉治氣消瘀血藥性論卷柏溫臣主女子陰中寒熱痛癥瘕血閉絶子生地黃大寒君解諸熱破血通利月水閉絶不利藥性論乾漆溫治血閉臣主女人經衇不通鬼箭寒破陳血使通月經破癥結日華庵閭子微寒臣療婦人月水不通朴消大寒君破留血閉絶此篇乃金匱要略婦人雜病篇婦人因虛積冷結氣為諸經水斷絶證中焦屬熱者治法也夫感受之初寒與氣固不相侔其傳變亦自有異及傳變既定則證雖有寒熱之異而其因遂不顯寒熱之殊然究其歸猶大率寒少熱多故中病有寒有熱而上下病則不甚見屬寒者蓋因寒為病仍見寒徵是為輕淺可以應治速愈不得為沉痼至有歷年矣下病之治見前崩中篇上病之治見前上氣咳逆篇中病屬寒之治見前腹脹心腹冷痛等篇此何以的知其為中病屬熱者為篇中所列皆氣平氣寒故耳中病屬熱證不可以或結熱中痛在關元衇數無創肌若魚鱗數言印證所列如許藥味也則仍當求諸金匱要略以本篇與金匱要略相較則有下瘀血湯抵當湯全方於大黃䗪蟲丸僅少黃芩甘草芍藥杏仁於土瓜根散少桂枝芍藥於鱉甲煎丸亦幾得其半大黃䗪蟲丸證肌膚甲錯與肌若魚鱗又正合除諸方所用外僅餘少半且有各物專治及情性可憑則其通月閉又何難曉焉第月閉何以不為上下病而屬中則素問陰陽別論曰二陽之病發心脾有不得隱曲女子不月評熱病論曰月事不來者胞衇閉胞衇者屬心而絡胞中氣上迫肺心氣不得下通故月事不來是其病為在中而不可屬諸上下矣雖然理難常執事變無端月閉非特因上因下無不有即因於寒者亦甚多要在就證論治可矣無子紫石英溫女子風寒在子宮絶孕十年無子石鍾乳溫令人有子陽起石微溫寒熱腹痛無子紫葳微寒桑螵蛸平益精生子艾葉微溫使人有子秦皮微寒大寒有子卷柏溫平微寒主血閉絶子蜀本列當溫主男子五勞七傷補腰腎令人有子藥對覆盆子平臣女子食之有子白膠溫君婦人血閉無子白薇大寒臣子孳也滋生蕃衍也不滋生者能使之滋生乎夫亦如漆園之論牧去其害馬者而已乃篇中所載非特去害此又何說易大傳曰天地絪縕萬物化醇男女媾精萬物化生解者謂絪縕交密之狀醇厚而凝也言氣化者也化生形化者也夫不交至則不相結猶不交密則不相凝特氣以化而釋形以化而結欲氣之化須陽欲形之化須火故篇中之物溫柔堅韌大抵欲其靜生動陰含陽較之男子陰痿篇大同小異在彼則希其挺拔直遂在此則求其卷舒得宜如是而已然觀天地生物饒有實理卒不容強其幾微敏妙莫可名狀如生物之功恃雨而所以致雨者不一垂雨而中輟者亦不一風急而雨風息則止無風而蒸雨風生則止風違時而雨風轉則止俄項之際倏雨倏晴次亦恃日物生而無日煦則柔萎不花不實日常朗而乏雨露則枯槁殭瘠雨後日烈又螟螣叢生是節候之或晴或雨物生之榮瘁判焉在物則不期然而然也況水生者惡日陸生者惡水固矣然荷芡之屬沒頂即斃蒲柳之物逢潦益茂是特氣有至不至遇不遇且堅脆或殊厚薄互異壽天成敗寓乎其間體天道而盡人為惟當之者勿強希治之者勿邀功無子者鑒茲可矣安胎紫葳微寒養胎白膠平溫安胎桑上寄生平安胎鯉魚寒懷妊人胎不安烏雌雞溫安胎蔥白平安胎阿膠平微溫安胎唐本生地黃大寒傷身胎動下血胎不落蜀本豬苓平按藥性論云主腫脹滿腹急痛當是水無陰不化而侵胎元者藥對艾葉微溫安胎止腹痛仲景於妊娠期列桂枝茯苓丸膠艾湯當歸芍藥散乾薑半夏人參丸當歸𦮷母苦參丸葵子茯苓散當歸散白朮散刺瀉勞宮關元法於産前可謂詳悉周至矣乃於本篇藥物僅用三味阿膠生地黃艾葉餘則闕如此有遺漏歟抑仲景所見尚有未及歟何相左也不知兩書立意自是殊途仲景篇目是治婦人妊娠病本書篇目是安胎妊娠之病亦係六淫外加附子湯治寒當歸芍藥散葵子茯苓散治水當歸𦮷母苦參丸治溼白朮散當歸散治火七情內蘊捨此而外則實者有舊病不除以妬害新結之生氣有新去過多以陷溺才凝之元氣則桂枝茯苓丸膠艾湯之用矣且仲景書專治六淫故於不得依尋常論者特剔出治法本篇乃據情立治故不及兼病所應用體各有當意自異而旨實同若胎則固以捆縕交密凝者還當以絪縕交密長養之故篇中諸物之義終不過組織元氣俾其稠密此之為安惟虛不任胎而應補則兩途所公共此膠艾地黃所以不能分彼此也以是見本篇是膠黏帖著以固胎仲景是防牖檢隙以護胎然服湯中病即止丸散則久服常服乃仲景書除附子湯失傳外惟膠艾湯是湯劑除皆丸散豈懷妊者補劑祇宜暫服搜剔反當常用歟夫胎元始結質稚而吸引不多月事既停則氣有餘為火血有餘為水盤旋環繞與胎氣為難及其質巨引多則彼既化水火者不能仍復氣血以餵胎亦惟不羈於內以為患故仲景方中朮茯苓澤藛黃芩牡蠣蜀椒等少與漸與以消摩之倘有闕漏則宜即速補苴防其水行舟動豈得更自遲緩此補劑宜急搜剔宜緩之謂非暫與常之謂也況虛甚則氣血本不能凝既能凝則虛必不甚以故胎前無滲漏原無補法惟有餘氣血化為水火譸張為幻則僅有免者此篇三物用補之外亦惟推極其理以備急需所以多用血肉之品歟墮胎雄黃平寒大溫雌黃平大寒水銀寒粉錫寒朴消寒大寒飛生蟲平溲疏寒微寒大𦻝寒大寒巴豆溫生溫熟寒野葛溫牛黃平藜蘆寒微寒牡丹寒微寒牛膝平桂心大熱皂莢溫䕡茹寒微寒躑躅溫鬼箭寒槐子寒薏苡微寒瞿麥寒附子溫大熱天雄溫大溫烏頭溫大熱烏喙微溫側子大熱蜈蚣溫地膽寒斑貓寒芫青微溫亭長微溫水蛭平微寒虻蟲微寒䗪蟲寒螻蛄寒蠐螬微溫微寒蝟皮平蜥蜴寒蛇脫平爪寒芒消大寒藥對檔根大熱使䒽草溫使牽牛子寒使證類半夏生微寒熟溫虎掌溫微寒鬼臼代赭蚱蟬麝香溫桃仁平蕘花寒微寒狼牙寒生鼠微溫或謂墮胎豈醫者事何為摘其藥品詳列於篇豫則謂墮胎固非醫者事然俾知其物能墮胎縱使當用而不用曷當非醫者事耶或又謂有必不能不墮之胎墮之以全形跡胡為非醫者事豫則謂凡若此者自有專門名家何必醫者或於萬不得已之病母子勢難兩全者知其病必須某藥治然性能墮胎不得已冒禁而用之縱使胎元傷而母獲安庶幾其一端矣特如篇中所列牡丹牛膝槐子薏苡等尋常施用之物人所不經意者尤宜念之不置斯則可謂善讀是書者矣難産槐子寒墮胎桂心大熱能墮胎滑石寒大寒女子乳難𦮷母平微寒主乳難蒺藜平微寒催生墮胎皂莢溫婦人胞不落酸漿平寒産難吞其實立産蚱蟬寒婦人乳難胞衣不出墮胎螻蛄寒主産難鼺鼠微溫主墮胎令易産生鼠肝平牡鼠尾主婦人墮胎易出按肝自係尾之誤鳥雄雞冠血溫主乳難弓弩弦平主難産胞衣不出以縛腰上并燒弩牙淬酒服隱居馬銜平主難産臨産時令産婦手持之敗醬平微寒主催生落胞日華榆皮平蛇蛻平催生日華藥對麻油微寒治産難胞不出君澤藛寒治胞衣不出君葉主産難牛膝平落死胎日華陳薑大熱豬脂酒各隨多少服主産難衣不出胞衣不出腹滿則殺人但多服脂佳肘後證類飛生蟲平令人易産取其角臨時執之兔頭平頭骨和毛髓燒為丸催生落胞日華海馬寒主婦人難産帶之於身神驗伏龍肝催生下胞冬葵子療婦人乳難內閉凡藥能墮胎類可治難産今析為二篇篇中同者得三之一不既復歟夫墮胎者其物峻烈足以搖動胎元治難産者胎本應動緣機關窒強反不能動故擇氣味較醇不甚剝害生氣者為撥動機關之用曰墮胎是胎固未應下因藥物氣味逆觸而下名為抅折生氣曰難産是胎應下不下因藥物性情順導而下名為歆動生氣知此則非特本篇藥物靈敏活潑曄然呈顯即墮胎篇藥物為避忌而列不為備用而列尤可識矣諺有之瓜熟者蒂落夫瓜與蒂其相繫相藉不一端略言之則瓜恃蒂吮精液以供生長然惟其蔓不跨田塍乃能一意輸將別無歧故若蔓跨田塍田塍燥則蔓焦枯而蒂反引瓜中精液以救蔓田塍溼則蔓浥爛而蒂遂無以通抽吮合於人之所以難産者母子皆有故矣抑觀於植物之布種則種需自翻身萌芽乃生更觀於動物之抱鷇則鷇已具必自裂卵衣乃出再合於人之生所以難産者半在子不能自轉試以此意核之篇中諸物在母亦有氣張而血不澤者有血行而氣不順者在子則有養薄而轉側不靈者有轉側靈而體過豐者其治蓋咸備焉乃復不專滯於性情氣味全從機勢以為斡旋其理微矣産後病乾地黃寒生地黃主産後血上薄心悶絶秦椒溫生溫熟寒主産後餘疾腹痛出汗利五藏敗醬平微寒主産後腹痛澤蘭微溫主乳婦內衄産後金創地榆微寒婦人乳痓痛及産後內塞大豆平藥對大豆紫湯溫治産後中風惡血不盡痛羖羊角微寒燒灰酒服主産後煩悶臣主婦人産後餘痛羚羊角微寒主産後血悶臣燒服之藥性論鹿角散溫主墮娠血不盡臣女子胞中血不盡欲死清酒和服食療小豆散平主産後血不盡煩悶臣産後不能食煩滿千金三歲陳棗核平燒灰治産後腹痛使證類芍藥主女人一切病産前後諸疾日華當歸紅藍花主産後血運口噤腹內惡血不盡絞痛豉寒産後何病不可有顧以區區者概之愚謂産後病凡可不必問其産後與否直得見病治病者可毋求諸此也則産後之病不既少歟詳檢篇中非治關於血及痛者不載亦可知其故矣然血有既虛仍行應行遽止之殊痛有瘀惡未盡去多內空之別又確是因於産乳竝無涉於崩漏是其條分縷析跬步易形仍有不可混不可濫而當參他病以求其同核本篇以抉其異施諸此則可用諸彼則不可者所宜諦審焉善夫仲景之論婦人有三病病痓病鬱冒病大便難以新産血虛多汗出喜中風故令痓亡血復汗寒多故令鬱冒亡津液胃燥故令大便難而其所用小茈胡大承氣湯不外治傷寒方當歸生薑羊肉湯不外治寒疝方白頭翁湯不外治下利方於此以求其同則痙之治在桂枝加栝蔞根湯葛根湯可見矣治利用白頭翁湯必加甘草阿膠中虛煩亂嘔逆不用梔子豉湯橘皮竹筎湯而用竹皮大丸中風發熱面赤喘而頭痛不用麻黃湯而用竹葉湯腹痛煩滿不得臥不用小承氣湯而用枳實芍藥散於此以求其異則本篇不盡列仲景所用之藥又可見矣曰産後血上薄心悶絶曰産後餘疾腹痛出汗曰産後金創曰産後內塞內衄曰産後血運口噤幸各檢其非産後有是證否非産後而有是證其治相同否倘不相同則更求其同病異治之故慎勿草草置之下乳汁石鍾乳溫下乳汁漏盧寒大寒下乳汁蠐螬微溫微寒産後中寒下乳汁栝蔞寒子下乳汁食療土瓜根寒下乳汁狗四足平四腳蹄煮飲之下乳汁豬四足小寒下乳汁藥對葵子寒主嬭腫能下乳汁藥性論豬𦚠平臣證類木通平下乳日華凡值有病而乳汁不下者治去其病乳汁自下有不下者檢此中相當物服之自下其有別無病患而乳汁不下者即檢此中相當物服之可也何謂相當蓋人身氣血流行無倦全恃陰陽不相偏著偏著即令氣機停滯血衇壅瘀譬於小便不行有由陽不化者有由陰不化者即本篇蠐螬之主産後中寒下乳汁葵子之主嬭腫下乳汁可見循此理以推其餘則鍾乳與栝蔞對乳溫蔞寒皆象形也狗四足與豬四足對狗平豬寒均會意也豬𦚠與土瓜根對豬𦚠滑中澀土瓜根澀中滑漏盧與木通對廬黑通白謂之通竅則雖皆能通竅而實不著意其通竅謂之利水而實不著意其利水絶非行血而有行血之旨存乎其間略不導氣而有導氣之效著乎其後巢氏曰婦人既産則水血俱下津液暴竭經血不足故無乳汁其經血盛者雖水血俱下而津液自有餘故乳汁多而溢出皆非此篇之物所能治也其有津液非不足而不溢者方與此篇之治相當中蠱桔梗微溫下蠱毒鬼臼溫微溫殺蠱毒馬目毒公溫微溫掌氏說見鬼疰犀角寒微寒主百毒蠱疰斑貓寒主寒熱鬼疰蠱毒芫青微溫主蠱毒風疰鬼疰亭長微溫主蠱毒鬼破淋結積聚射罔大熱鬼督郵平赤箭一名鬼督郵主殺鬼精物蠱毒惡氣白襄荷微溫主中惡及瘧敗鼓皮平主中蠱毒藍實寒殺蠱蚑疰螫毒藥對赭魁平使徐長卿溫使主鬼物百精蠱毒羖羊角微寒臣療蠱毒野葛溫使殺鬼疰蠱毒羖羊皮平使獺肝平使主鬼疰蠱毒露蜂房平使主鬼精蠱毒雄黃平君殺蠱毒藥性論槲樹皮平水煎膿汁除蠱世類以病源所云蠱是變惑之氣人有故造作者多取蟲蛇之類器皿盛貯任其相噉殺剩有一物獨在者即謂之蠱便能變惑隨逐酒食為人禍患於他則蠱主吉利所以不羈之徒畜事之為中蠱所由按庶氏讀如煮掌除毒蠱以攻說襘之嘉草攻之凡毆蠱則令之比之剪氏掌除蠹物以攻禜攻之以莽草熏之凡庶蠱之事皆載於周官夏殷之時寧已有是周公顧設官以司之況蠱毒之物疊見本經本經固出於漢然非三代已來口授耶不知古固有以惑亂人為蠱者如令尹子元欲蠱文夫人左莊二十八年驪姬惑蠱君而誣國人國語晉語皆見於春秋時或周公時已有未可知也蓋維邃古隆平貴賤由乎德貧富由乎位其等類均者本無甚軒輊之弊而政治公允無畸輕畸重致民相仇有亦任人報之而司之官以平曲直必畜藏毒以害人利己殆少惟男女相悅蓋有不減後世者任情造作變惑人心求遂己欲子元振萬驪姬妖媚足以蠱人而絶無與於畜毒蟲聚蛇蠍其蛇蠍之貽毒害人則不由人為而人偶中之當時為病久後致斃聖人知其然預設官司專攻其事以救民故本經藥物主治曰主療蠱毒殺蠱毒絶無被人行蠱之詞本篇提綱曰中蠱亦可見係人自中非人賊害之也史記秦本紀德公二年初伏以狗禦蠱張守節曰蠱者熱毒惡氣為害傷人故磔狗以禦之磔禳也狗陽畜也以狗張磔於郭四門禳卻熱毒則又為氣而非蠱封禪書磔狗邑四門以禦蠱菑司馬貞引樂彥云左傳皿蠱為蠱梟磔之鬼亦為蠱故月令云大儺旁磔注云磔攘也厲鬼亦為蠱將出害人旁磔於四方之門故此亦磔狗邑四門也則亦為氣而非蟲或者氣中於人即能生蠱亦未可知其法雖與周官不同然其間猶頗寓聖人微意然則何者為中蠱之狀孫真人曰蠱毒千品種種不同或下鮮血或好臥暗室不欲光明或心性反常乍嗔乍喜或四肢沉重百節痠疼又曰凡中蠱毒令人心腹絞切痛如有物囓或吐下血皆如爛肉若不治蝕人五藏致死又曰凡人患積年時復大便黑如漆或堅或薄或微赤者皆蠱也然當其時則已有人行蠱者矣故有服藥知蠱主姓名等語大抵始由天造繼則人為萬事皆然非特此也雖然食蟲之精液僅生瘻於項腋浮於衇而不去其究不過潰爛得蟲之化源僅生蟲於咽肛著其處而不去充類不過聲嗄咽乾蠱果得蟲何物乃能生蟲至食人府藏移人心志耶據庶氏賈疏攻說襘之去其神也嘉草攻之去其身也則不特成蟲之形軀且具蟲之靈幻矣夫皿蟲為蠱穀之飛亦為蠱左昭元年文茲二語者一譬之於禾黍生蟲夫食苗心者止食心食節者止食節食葉者止食葉食根者止食根此之謂皿蟲為蠱緣其物之所病更感天地之氣相媾而生故於物食物非其物則氣不偶而不能害物不為傷矣一譬之於凡物之化蟲夫淫溺惑志具逢罅夤緣奮迅摩捋而垂其腴以誘人搧其翼以惑人者此其機已全蟲之能事而常思效蟲之鑽研復感天地生蟲之氣致遂生蟲此蟲之伎倆益靈幻怪惑無所不為矣此之謂穀之飛亦為蟲言本無所謂蟲而自願化蟲以遂其欲也不然大祝六祈攻說居二非其人自有所感召胡為臨之以神攻其人之慝而說其人使遷善改過耶大祝注攻說祭名以辭責之是也惟篇中所列諸物恐不足當嘉草之譽此則所當析者夫事貴適情論須切用故概而言之則物無良劣當病者嘉分而言之則兼傷正氣為毒唯蝕邪氣為嘉試思攻蠹之莽草殺蛙之牡鞠以無關於人不傷夫元氣故不品以嘉毒而特出其名若瘍醫輔劀殺之五毒庶氏輔攻說之嘉草皆指其類而不出其名良亦以既當創肉破骨其邪乃出又何能不傷及元氣則雖欲避毒而有所不能若病在府藏府藏既為邪纍焉能更耐毒攻則雖欲用毒而有所不可此治道不得不通乎醫而醫道之不可違乎治道亦易見矣藥對主療掌氏補出汗麻黃溫臣主中風傷寒頭痛溫瘧發表出汗杏仁溫臣發汗主溫病治心下急滿痛除心腹煩悶療邪氣藥性論棗葉平君覆麻黃能令出汗蔥白平臣主傷寒寒熱出汗中風面目腫石膏大寒臣主時氣頭痛身熱三焦大熱皮膚熱腸胃中膈氣解肌發汗𦮷母微寒臣止煩熱渴出汗山茱萸平臣溫中下氣出汗葛根平臣療傷寒中風頭痛解肌發表出汗開腠理桂心溫大熱主頭痛腰痛出汗止煩乾薑溫大熱出汗逐風溼痹附子溫大熱主風寒咳逆邪氣生薑微溫主傷寒頭痛鼻塞咳逆上氣薄荷溫飲汁出汗大解勞乏蜀椒溫大熱主傷寒溫瘧大風汗不出心腹留飲宿食豉寒主時疾熱病發汗世類以驅除風寒之物為出汗之劑而服之顧汗不出則以未深求夫寒所由招風所由入故耳今讀是篇人於麻黃葛根蔥白生薑薄荷豆豉六物外類不知其能出汗之故不敢施用而孰知寒因虛集風為熱留氣機不遂雖欲出而莫由儘去風寒汗終不出蓋汗雖出於肌膚化實鍾於心液心氣擾而不定心陰餒而不繼心陽痿而不振心血虛而不給則不足鼓化汗之源氣機逆而不順經衇澀而不利肌肉痹而不宣膚腠闔而不開則不足通出汗之路是豈驅風驅寒所能為力顧可獨恃以出汗耶徐氏集本經別録所曾言體會曲鬯旁通所當道摘其精粹示以端倪而詔人遵循以補陶氏之未及其亦深具苦衷已豫每見區區外感醫甚忽之而不顧其內徒會驅除風寒者攻之外感不解汗亦不出然後更推裏證之所見為疏析之汗忽自出甚有服驅除風寒劑多者當時毫無災咎及撥動其機反至汗多亡陽徐氏之續是篇也倘亦有見於此夫止汗乾薑大熱臣柏實平君益血止汗麻黃根并故扇末臣杵末撲之藥性論白朮溫君止汗除熱粢粉雜豆豉熬末半夏生微寒熟溫使止汗牡蠣微寒雜杜仲平水服枳實寒微寒松蘿平主瞋怒邪氣止虛汗頭風如前所言則止汗者在寧其化源澀其道路不在防其肌腠矣而十二物之間外撲者四麻黃根故扇粢粉豆豉三停仍居其一何耶夫四物者固亦寧化源澀道路者也苟會其意境觀其形似揣其致用則有執之而燠消故扇窺之而中阻麻黃根蒸盦之而性轉涼豆豉磨礱之而粗變黏者粢粉固得調防其肌腠者乎陰陽應象大論曰陽之汗以天地之雨名之陽之氣以天地之疾風名之致雨以風止雨亦以風氣之與汗猶是矣是故守其在中之陽不使隨驅而外漏乾薑堵其必經之道不使由內以出外半夏隨所在而消弭之朮能運肌肉中津液據其源而分布之柏實能致血液於肺其尤妙者藏津液於綿密堅固之中杜仲清陽氣於泛溢流離之際牡蠣益足使動者寧亡者歸化裁之神極矣粗工妄為當斂黃芪攝衛五味收津較之於是果何如耶然必更核之於仲景始為直探其源如四逆湯通衇四逆湯之止汗猶是篇之意也桂枝加附子湯則進於是矣白虎湯葛根黃連黃芩湯桂枝加葛根湯麻黃杏仁甘草石膏湯亦治汗出則可謂識神駿於牝牡驪黃之外矣驚悸心氣絡石微寒主大驚入腹君人參微溫君安精神定魂魄止驚悸茯苓平君主憂恚驚邪恐悸心下結痛柏實平君主小兒驚癇沙參微寒臣主血積驚氣龍膽大寒主驚傷五內君益肝膽氣止驚惕羖羊角微寒臣止驚悸桔梗微溫臣主腹滿腸鳴幽幽驚恐悸氣小草溫君遠志溫君定心氣止驚悸銀屑溫君安心神止驚悸紫石英溫君補心氣不足定驚悸本篇所載藥味與驚邪同所不同者兩物耳其別出此篇以證驚邪所該者廣凡此與癲癇等皆其支流也雖然驚邪篇能該驚不能該悸驚與悸皆緣心氣而悸不皆兼驚則徐氏之補是正可剖陶氏之渾成而使眉目昭晰矣太陽傷寒加溫針則驚少陽不可吐下吐下則悸而驚風溫被火劇則如驚癇時瘛瘲傷寒二三日心中悸而煩傷寒衇結代心動悸太陽病小便利者以飲水多必心下悸皆驚悸也皆不得為驚悸心氣驚悸心氣奈何則盡在篇中曰精神不安魂魄不定曰憂恚恐悸心下結痛曰血積曰腸鳴幽幽咸是矣心氣因何而發驚悸則金匱真言論曰肝病發驚駭陰陽別論曰二陽一陰發病主驚駭背痛善噫善缺名曰風厥氣交變大論中歲水大過六丙歲也寒氣流行民病身熱煩心躁悸五常政大論曰委和之紀六丁歲不及之化其發驚駭敦阜之紀六甲年太過之化其變驚震六元政紀大論曰寅甲之紀甲寅甲申其變震驚飄驟至真要大論曰少陽之勝善驚譫妄詳此是驚者火之偏盛悸者水之偏盛水偏盛則火被迫而搖火偏盛則火披猖而熾火披猖而熾者著物輒先卻後肆火被逼而搖者於內卻無時不栗此驚所以有發有罷悸則常自跳動此心氣偏陰偏陽之分即心氣發見為病之驗也心氣偏陰偏陽勢隔天淵決不得同物為治且不得相提竝論今於十二味竝云止驚悸者居其七既可治偏陰必不能復治偏陽是果何說哉而不知七者所主之偏是調陰陽之精非調其粗調其粗者見陰攻陽見陽攻陰而已調其精者必其物本具陰陽相入之機陰陽既能相入則彼此自能交化而不相勝矣但觀其於陽中生陰人參於氣中化水茯苓於水中熄火龍膽於火中引水桔梗已可識其大概矣何況於陰中攝陽遠志於水中含火紫石英者更顯然示人以權度耶蓋必先明乎心氣能為驚悸而後知驚邪既能明驚邪與心氣之驚悸有攸分而後知為癲為癇之驚與屬心氣者殊絶癲癇篇與驚悸心氣篇所列無相同者此徐氏推研極細之功雖謂更精於陶氏可也肺痿人參微溫治肺痿君消胸中痰主肺痿吐膿藥性論天虋冬大寒治肺痿君療肺痿生癰吐膿藥性論蒺藜子微寒治肺痿臣主咳逆傷肺肺痿止煩下氣茯苓平君主肺痿痰結白石英微溫君療肺痿下氣利小便薏苡仁微寒主肺主肺痿肺氣吐膿血咳嗽涕唾上氣藥性論麥虋冬微寒治肺痿臣治肺痿吐膿藥性論肺痿肺癰為病實同而異金匱要略詳闡其源亦始出一致初無歧故特為病時搏於虛為痿搏於實為癰是以肺痿吐涎沫肺癰吐膿血肺痿衇數虛肺癰衇數實而其兼證則均有咳故治法大都仿咳為規模可以愈咳即可以已痿與癰也獨是肺癰無不咳者肺痿則有咳有不咳觀於甘草乾薑湯炙甘草湯生薑甘草湯桂枝去芍藥加皂莢湯皆不言咳此篇所列七物與上氣咳嗽篇無一復者是徐氏所以補此篇之意歟蓋熱在上焦因咳為肺痿其始終虛者熱無所附惟迫痰涎亦有雖淪於虛旋附於實遂自痿而癰者想不能無故本篇謂天虋冬療肺痿生癰吐膿而人參薏苡仁麥虋冬均有吐膿字樣係於下可見兩證者雖源同而派異然亦可互相出入中異而終同其一定不移處在與咳畫界限不在與癰分彼此此麥虋冬湯既有此篇藥兩味即但主上氣而不見咳字以肺痿肺癰之咳者原有上氣咳嗽篇藥可尋用也肺痿肺癰既係互相連屬肺痿之不咳者已有是篇之藥為準其咳者又有上氣咳嗽篇之藥為規肺癰獨可無治乎肺癰之治咳甚者亦規上氣咳嗽篇夫固言之矣而有停飲為膿源者儘可逐飲有膿盛致氣阻者自當蝕膿苟如膿飲已蠲元氣難復病患向愈生陽不振則又有癰疽篇之藥為歸著若之何其無治則耶素問痿論歷數五藏皆有痿自金匱要略已下論證者止及肺病而不及餘痿論治者亦止及肺痿而不及餘痿豈衇痿筋痿肉痿骨痿咸無足論耶抑諸痿者皆不可治也夫痿論固言之矣曰五藏因肺熱葉焦發為痿躄是論痿之源皆由於肺也曰治痿獨取陽明是論痿之治皆可責諸胃也蓋痿者軟罷難振之候其始不過吐涎沫身形疲弱耳既而脛縱不任地焉筋急而攣焉肌肉不仁焉腰脊不舉焉都在痿之分內不如此不足以繪痿之傳不如此不足以窮痿之變不如此不足為痿之敗故在肺之痿時原可治至衇痿筋痿肉痿乃漸不可治至骨痿遂係必敗之候縱有治法亦當推尋其源仍從肺痿立則故治痿者得獨陽明論其所以然則如痿論所言其關係在經衇間論其所當然則胃固為肺之母矣然則諸痿之治概可質諸是篇歟夫欲塞其流者必推其源欲溯其本者須循其末治宗肺痿固其大本大源所在第脛縱不任地筋急而攣肌肉不仁腰脊不舉豈遂可任之乎是又當於本經逐味究之下氣麻黃溫臣杏仁溫臣主雷鳴喉痹下氣厚朴溫臣消痰下氣橘皮溫臣下氣止嘔咳半夏生微寒熟溫使傷寒寒熱心下堅下氣白前微溫臣主一切氣藥性論生薑微溫臣主痰水氣滿下氣前胡微寒臣去痰實下氣李樹根白皮大寒使下氣主熱毒煩躁蘇子溫臣主下氣除寒中石硫黃大熱臣能下氣治腳弱腰腎久冷藥性論白茅根寒臣蒺藜子微寒臣止煩下氣上氣者病之情形下氣者藥之功效故治上氣病必以下氣之藥此下氣篇列藥十三所以復於上氣篇者七也然在上氣篇不有此復則無以知上氣與咳嗽猶有分科在下氣篇若盡皆復則無以知下氣之藥不必盡治上氣故夫因痰厚朴前胡因熱李根白皮茅根蒺藜因寒石硫黃當從下氣而愈者均可以是而識由是而推矣雖然病變萬殊治遵一轍即全編而言凡大腹水腫嘔吐腹脹肺痿皆可因上氣而生咳嗽痰飲皆本與上氣為伍治之者必不可置其上氣但治他患他患遂可除也則下氣之藥竟是至要之物就是篇而言則中熱下寒痰凝氣滯皆得以下氣而除第祇可推實以就虛使氣機得其平決不可推虛俾就實則非特實不濟虛且虛已先自受戕而無從救矣則下氣之藥斷難獨任而須裁成輔相之得宜統稽篇中曰痰曰嘔曰心下堅曰水可以悟性溫者之下氣斷須執定病氣之有形曰熱毒曰煩躁又可悟性寒者之下氣斷須選擇清利之品如是則下氣之物不敢濫投削人元氣矣下氣云乎哉蝕膿䕡茹寒排膿雄黃平桔梗微溫養血排膿日華龍骨微溫麝香溫蝕一切癰創膿藥性論白芷溫能蝕膿藥性論大黃大寒蝕膿藥性論芍藥微寒能蝕膿藥性論當歸溫藜蘆寒巴豆溫排膿消腫日華地榆微寒蝕膿藥性論創癰之膿猶傷寒之汗汗者正氣伸而邪氣解膿者新血生而惡血化邪氣本無形故隨解而即散惡血固有用故雖化而未去是以有汗者不必再汗一汗亦且忌其多潰膿者仍當蝕膿屢膿方得希其盡此兩者之異同實亦至理之所在也徐氏患陶氏於創癰止言上截而遺潰復恐後人一例認為傷寒表解後見病治病內病雖差膿水壅結復有攻衝侵薄等事卒至難期全效久曠變生因於膏摩薄帖外詔示徹內徹外之法剝蝕淨盡之計庶幾腐退新生血行肌滿恢復之後毫無闕漏為最要篇中大半皆在皮膚肌肉血衇上著想其有頑礦不化仍不廢惡劣劫爍大黃藜蘆巴豆及去火去溼雄黃地榆固犁庭掃穴所不容緩者而於血中導氣當歸氣中導血桔梗白芷成和治之功腐中引新䕡茹新中逐腐麝香復流動之舊由是意推廣之蓋可信手拈來頭頭是道不推此數物者為可用也況猶有金匱要略排膿散排膿湯之調燮其內耶女人血閉腹痛黃芪微溫主婦人子藏風邪氣逐五藏間惡血芍藥微寒主婦人血閉不通藥性論紫參寒主婦人血閉不通桃仁平主瘀血血閉瘕邪氣細辛溫主血不行紫石英溫主女子風寒在子宮乾薑大熱治血閉桂心大熱主破血茯苓平療心腹脹痛婦熱淋藥性論血閉矣月事能仍利乎苟不利則與月閉復矣月閉矣腹能無痛乎苟腹痛則與血閉腹痛復矣夫亦因其甚相近絶相似故特補此使後人不得於血閉腹痛未經月候者浪用治月閉法治之耳觀本篇藥物所主一則曰婦人子藏風邪再則曰瘀血血閉瘕邪氣屢屢曰風寒在子宮曰心腹脹痛熱淋可見血皆因邪而閉因閉而痛既痛而邪未化與因虛積冷結氣為諸經水斷絶已至結熱中而在關元者迥不侔也夫然故月閉篇所用藥多寒間有微溫亦皆血肉之品過而不留之性無他恐其助熱益燥陰液也此篇所用藥多溫間有微寒又係破陰布陽芍藥拔邪離血紫參非他以逐寒須及早欲免其成月閉也試更參其彼此俱用之一味桃仁能既治新邪復攻舊積則本篇為治寒邪阻血彼篇為治邪血化熱事有先後之殊為異中之同矣然彼篇多用剋削本篇多用補益豈暴病正反虛久病正反實耶夫破血之物何限彼篇不皆采用偏偏列血肉之物空靈之品其披郤導窾之意為何如而此為之補偏不補血而補氣是其命意又在惟欲逐邪乃暫崇正非沾沾用補可同日語是法有常哲之用為同中之異也倘無此篇不令人視血閉皆屬熱歟然使僅有此篇不令人謂月閉亦屬寒歟徐氏之補意固在是女人血氣歷腰痛澤蘭微溫治婦人血瀝腰痛藥性論當歸溫主婦人瀝血腰痛藥性論甘草平治婦人血瀝腰痛藥性論細辛溫主血閉婦人血瀝腰痛藥性論柏實平治腰腎中冷藥性論牡丹微寒主女子經衇不通血瀝腰疼藥性論牡蠣微寒是篇病候若依藥性論當作血漏而腰痛解然崩中篇所該之漏甚多所列之藥亦甚多何無一證數味相同者若謂是瘀在腰間作痛則與瘀血篇又無一味相同女人所以異於男子不外血分之病乃考之於血分諸證而稽其治竟毫不可通若分析核之則得血閉腹痛之細辛産後之澤蘭當歸月閉之牡丹而當歸甘草牡蠣牡丹柏實竝連載於虛勞篇其諸在下素虛血氣素滯以滯歷虛不勝踐踏故為痛歟血氣之滯奈何蓋究澤蘭而知血中有水矣究細辛而知血中有寒矣究當歸甘草牡丹牡蠣而知血中有火矣血之於人身如歷鹿之不停方言繀車謂之轣轆廣雅作歷鹿惟在腰間尤欲存駐以當聽命於腎腎主五液血固液之屬也乃布令萎餒不速受事倔強多稽於是遣者行者互相齟齬推諉而為痛少項則已片時復然此所以與尋常腎虛風溼痹瘀血種種腰痛為不同也是故歷傳也爾雅釋詁經也文選西京賦歷其彌光薛注陟也後漢書杜篤傳注行也廣雅釋詁過也楚詞天問河海何歷注逢也離騷委厥美而歷茲注謂經過則痛過已即止也然是說也於本篇則合矣其如與藥性論不可合何按堖漏古人謂之歷堖依義而言當曰瀝堖瀝可為歷釋名釋疾病歷獨不可為瀝乎女人腹堅脹芍藥微寒治心腹堅脹婦人血閉不通藥性論黃芩大寒治熱腹中㽲痛心腹堅脹藥性論茯苓平療心腹脹滿婦人熱淋藥性論解是篇者孰不謂黃芩治熱堅脹茯苓治溼堅脹芍藥治陰陽相拒堅脹夫熱與溼及陰陽相拒何以得為堅脹則曰溼聚則化熱熱盛能生溼溼熱不行則脹其有素蓄熱更被溼或先停溼復受熱客主不和洽彼此不交也因兩不相下抵拒而為脹然何以能堅則曰始原為脹久且成堅芍芩苓三者足治脹已耳何以竝能治堅則曰黃芩初生表裏俱實在地久則內腐而中虛癥瘕但因熱而堅脹正外實中空以其形似化其病本堅脹胡為不已芍藥破陰布陽陽既入而和陰陰被和而隨化陰陽互交堅脹有何不已至茯苓原吸氣以蟠於下雖在下終受氣而不受溼其利溼可知正與氣之下歸被停溼阻而不能化者相對以此入室操戈堅脹自然得已又不知三種堅脹恃何者為驗而有攸分則曰熱堅脹外必有熱溼堅脹必小便不利陰陽相拒堅脹必腹痛然男子亦應有之何以獨標女人蓋女人腹堅脹鮮不似為血分病而三種腹堅脹止係常病實無與於血恐人錯會誤攻血分故特詔人見病治病耳若男子病此原列於腹痛大熱小便淋篇則腹痛篇之用芍藥大熱篇之用黃芩小便淋篇之用茯苓皆可知其有腹堅脹矣凡試古書者宜會心焉解百藥及金石等毒右蛇虺百蟲毒右蜈蚣毒右蜘蛛毒右蜂毒右狗毒右惡風瘴毒右喉痹腫邪氣惡毒入腹右風腫毒腫右百藥毒右射罔毒右野葛毒右斑貓芫青毒右狼毒毒右躑躅毒右右巴豆毒右藜蘆毒右雄黃毒右甘遂毒右蜀椒毒右半夏毒右礜石毒右芫花毒右烏頭天雄附子毒右莨菪毒右馬刀毒右大㦸毒右桔梗毒右杏仁毒右諸菌毒右防葵毒右野芋毒右雞子毒右鐵毒右食諸肉馬肝漏脯中毒右食金銀毒右食諸魚中毒右食蟹中毒右食諸菜毒右飲食中毒心煩滿右服石藥中毒右服藥過劑悶亂者服藥食忌藥不宜入湯酒者右一十七種石類右四十八種草木類右二十九種蟲獸類本經疏證十二卷續疏六卷序疏八卷鄒君潤庵澍撰豫年弱冠喜治岐黃家言每日夕與潤庵會陳家酒罏課日間所業或舉今日治某家某症立某方互證得失以為常既奔走皖豫燕趙者垂二十年道光壬辰重晤於中表趙于岡之約園豫醫學茫未有進而君蔚然為世所宗君為人治病必先單家而後巨室非盛寒暑未嘗乘輿常疾夫世之號能名其家者破壞古法羼雜私意故每治人疾必引成方豫在山左時常以玫瑰花龍眼肉合成膏愈吳洛生大令母脘痛為君所呵豫答言藥在中病古方奚為君驟聞頗忿甚立起辭去豫亦即北行乃未一年而君歸道山矣君歿後五年戊甲于岡始郵示此書實能抉昔賢之閫奧為後學之津梁悔從前率爾違牾悲涕刻責會江夏童公石塘濂仁和武公蝶生蒞莊見是書而愛之力請集資剞劂以戊申八月開雕斷手己酉三月校定者袁君坦齊光裕魏君修鬯裴莊君子久延準揚君曉亭欣而始終其事者童武兩公之力為多用中得藉手補過慰私恨於無窮益滋愧矣道光己酉三月湯用中謹跋
